 LOADING_TIP_0: "I want to die on Mars, just not on impact.\n- Elon Musk, 2013"
 LOADING_TIP_1: "Most entrepreneurial ideas will sound crazy, stupid, and uneconomic, and then they will turn out to be right.\n- Reed Hastings, 2011"
