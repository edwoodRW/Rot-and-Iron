 RI_european_socialist_union:0 "European Socialist Union"
 RI_european_socialist_union_desc:0 "\n\n\n£RI_european_socialist_union_tooltip\n\n\n\n\n\nThe European Socialist Union brings its members together in a shared political and economic community. Through industrial cooperation and joint research, its members seek prosperity and closer ties while retaining their own governments."
