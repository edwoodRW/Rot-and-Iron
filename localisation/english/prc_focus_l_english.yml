l_english:
  PRC_the_new_era_of_rejuvenation: "The New Era of Rejuvenation"
  PRC_the_new_era_of_rejuvenation_desc: "Xi Jinping's China enters 2029 convinced that history is moving in its favour. The task ahead is to convert centralised authority, industrial scale, and nationalist confidence into a coherent grand strategy for the decades to come."
  PRC_secure_the_party_centre: "Secure the Party Centre"
  PRC_secure_the_party_centre_desc: "The Party's supremacy is the foundation of everything else. Before Beijing can reshape society, the economy, or the world beyond China's borders, it must ensure the centre remains disciplined, feared, and obeyed."
  PRC_manage_the_property_slowdown: "Manage the Property Slowdown"
  PRC_manage_the_property_slowdown_desc: "The era of endless real-estate expansion is over. If the slowdown is not contained, the debt burden and regional imbalances could become a direct political threat to the regime."
  PRC_launch_the_common_prosperity_drive: "Launch the Common Prosperity Drive"
  PRC_launch_the_common_prosperity_drive_desc: "The Party cannot allow inequality, elite excess, and social anxiety to harden into a crisis of legitimacy. Common prosperity offers a new slogan through which Beijing can justify tighter direction over capital and society alike."
  PRC_reform_the_pla_command: "Reform the PLA Command"
  PRC_reform_the_pla_command_desc: "China's armed forces must be more than large; they must be joint, disciplined, and ready for high-intensity war in the Western Pacific. The command structure must reflect that reality."
  PRC_forge_a_unified_chinese_identity: "Forge a Unified Chinese Identity"
  PRC_forge_a_unified_chinese_identity_desc: "The Party's version of national unity rests on a shared patriotic narrative, developmental promises, and relentless central direction. Fragmentation cannot be tolerated in a century Beijing intends to dominate."
  PRC_prepare_for_a_global_china: "Prepare for a Global China"
  PRC_prepare_for_a_global_china_desc: "China no longer acts as a merely regional power. Its diplomacy, trade, infrastructure finance, and military reach now combine into a global presence that must be deliberately organised."
  PRC_strengthen_the_central_commission: "Strengthen the Central Commission"
  PRC_strengthen_the_central_commission_desc: "Top-level coordination is the regime's answer to factional drift. The more power is centralised in Beijing, the harder it becomes for rivals and local interests to challenge the line from above."
  PRC_expand_the_security_apparatus: "Expand the Security Apparatus"
  PRC_expand_the_security_apparatus_desc: "Mass surveillance, internal security, and political policing are not emergency tools but pillars of statecraft. The Party will invest accordingly."
  PRC_stabilise_the_housing_market: "Stabilise the Housing Market"
  PRC_stabilise_the_housing_market_desc: "A controlled correction is tolerable; a property crash is not. Beijing must prevent local debt and unfinished projects from poisoning confidence in the system itself."
  PRC_push_advanced_manufacturing: "Push Advanced Manufacturing"
  PRC_push_advanced_manufacturing_desc: "Cheap labour alone will not sustain Chinese power. Strategic industries, higher-value production, and technological upgrading must carry the next phase of growth."
  PRC_address_youth_unemployment: "Address Youth Unemployment"
  PRC_address_youth_unemployment_desc: "An educated generation with dim prospects is a political risk. The regime must offer careers, mobilisation, or at least the appearance of purpose."
  PRC_expand_the_digital_state: "Expand the Digital State"
  PRC_expand_the_digital_state_desc: "Data, platform control, and algorithmic oversight can increase both economic efficiency and political supervision. Beijing intends to harvest both benefits."
  PRC_modernise_joint_operations: "Modernise Joint Operations"
  PRC_modernise_joint_operations_desc: "The PLA's future lies in integrated theatre command, rapid decision cycles, and the ability to synchronise sea, air, missile, cyber, and ground forces in one campaign."
  PRC_expand_the_rocket_force: "Expand the Rocket Force"
  PRC_expand_the_rocket_force_desc: "Missile power underpins deterrence, coercion, and anti-access strategy. Expanding the Rocket Force strengthens China's hand across the first and second island chains."
  PRC_develop_the_inland_provinces: "Develop the Inland Provinces"
  PRC_develop_the_inland_provinces_desc: "If the coast alone prospers, the Party's national story weakens. The interior must be bound to the centre by infrastructure, industry, and visible state investment."
  PRC_integrate_hong_kong_and_macau: "Integrate Hong Kong and Macau"
  PRC_integrate_hong_kong_and_macau_desc: "The age of tolerated ambiguity is ending. Beijing expects the special administrative regions to become politically reliable extensions of central authority."
  PRC_expand_the_belt_and_road: "Expand the Belt and Road"
  PRC_expand_the_belt_and_road_desc: "Ports, railways, energy corridors, and development loans are instruments of geopolitical leverage. The Belt and Road remains China's signature method of turning capital into influence."
  PRC_prepare_for_the_taiwan_question: "Prepare for the Taiwan Question"
  PRC_prepare_for_the_taiwan_question_desc: "Taiwan remains the central unresolved issue of Chinese national strategy. Even if the moment of decision has not yet come, the state must prepare for it politically, economically, and militarily."
  PRC_launch_the_inspection_teams: "Launch the Inspection Teams"
  PRC_launch_the_inspection_teams_desc: "Discipline inspectors are the centre's instrument for reminding every provincial cadre, ministry chief, and state executive where real authority resides."
  PRC_party_cells_in_private_enterprise: "Party Cells in Private Enterprise"
  PRC_party_cells_in_private_enterprise_desc: "The private sector may create wealth, but it will not become politically autonomous. Party supervision must follow capital into every boardroom that matters."
  PRC_cyber_sovereignty_doctrine: "Cyber Sovereignty Doctrine"
  PRC_cyber_sovereignty_doctrine_desc: "Beijing rejects the liberal internet. Digital space is sovereign space, and the Party intends to police it as such."
  PRC_ideological_rectification_campaign: "Ideological Rectification Campaign"
  PRC_ideological_rectification_campaign_desc: "Periods of tightening are not signs of insecurity alone. They are also demonstrations that doctrine still flows from the top and that deviation will be corrected."
  PRC_build_the_financial_firewall: "Build the Financial Firewall"
  PRC_build_the_financial_firewall_desc: "Debt can be rolled, hidden, and restructured, but only if the centre moves early enough to prevent panic from escaping local balance sheets."
  PRC_megacity_cluster_strategy: "Megacity Cluster Strategy"
  PRC_megacity_cluster_strategy_desc: "China's urban future lies not in isolated giant cities, but in coordinated industrial and transport corridors tying them into regional powerhouses."
  PRC_semiconductor_self_reliance: "Semiconductor Self-Reliance"
  PRC_semiconductor_self_reliance_desc: "If advanced chips remain vulnerable to foreign pressure, so does the entire Chinese growth model. Indigenous capacity is now a strategic necessity."
  PRC_green_industrial_transition: "Green Industrial Transition"
  PRC_green_industrial_transition_desc: "Electrification, batteries, and clean transport can serve both industrial policy and regime legitimacy, provided the transition remains under Party command."
  PRC_expand_graduate_placement_programmes: "Expand Graduate Placement Programmes"
  PRC_expand_graduate_placement_programmes_desc: "A generation educated for success must not be left idle. The state will absorb frustration by steering graduates into priority sectors and public initiatives."
  PRC_natalist_support_packages: "Natalist Support Packages"
  PRC_natalist_support_packages_desc: "Demographic decline now sits beside debt and slowing growth as one of the regime's central long-term anxieties. Incentives must replace complacency."
  PRC_social_credit_expansion: "Social Credit Expansion"
  PRC_social_credit_expansion_desc: "Compliance can be nudged, monitored, and recorded at scale. The more data the Party controls, the more behaviour it can shape in advance."
  PRC_managed_civil_society: "Managed Civil Society"
  PRC_managed_civil_society_desc: "The regime will tolerate social organisation only where it can be supervised, redirected, and folded back into the state's own legitimacy."
  PRC_theatre_command_exercises: "Theatre Command Exercises"
  PRC_theatre_command_exercises_desc: "Joint command structures exist to be tested. Large-scale exercises will reveal weaknesses before a real campaign does."
  PRC_support_force_reorganisation: "Support Force Reorganisation"
  PRC_support_force_reorganisation_desc: "Space, cyber, logistics, and electronic warfare are no longer auxiliaries. They are central to any serious war plan China may one day pursue."
  PRC_expand_missile_production_lines: "Expand Missile Production Lines"
  PRC_expand_missile_production_lines_desc: "Deterrence requires volume as much as sophistication. Industrial capacity must underpin the Rocket Force's growing strategic role."
  PRC_deploy_layered_air_defence: "Deploy Layered Air Defence"
  PRC_deploy_layered_air_defence_desc: "A credible denial strategy demands overlapping missile, radar, and interceptor coverage capable of complicating enemy operations from the outset."
  PRC_western_development_corridor: "Western Development Corridor"
  PRC_western_development_corridor_desc: "The interior must not remain merely governed; it must be transformed into an integrated zone of transport, extraction, and strategic depth."
  PRC_national_high_speed_grid: "National High-Speed Grid"
  PRC_national_high_speed_grid_desc: "Rail is not only infrastructure. In Chinese hands it is a tool of state cohesion, labour mobility, and administrative reach."
  PRC_one_country_one_line: "One Country, One Line"
  PRC_one_country_one_line_desc: "Autonomy has narrowed into administration. Beijing's message to the special administrative regions is simple: there is one sovereign centre and one acceptable political line."
  PRC_frontier_security_doctrine: "Frontier Security Doctrine"
  PRC_frontier_security_doctrine_desc: "Borderlands are treated not as peripheral questions but as tests of regime durability. Security, surveillance, and demographic engineering must work together."
  PRC_global_south_partnerships: "Global South Partnerships"
  PRC_global_south_partnerships_desc: "Many states do not wish to live in a world dominated entirely by Washington. Beijing can present itself as patron, investor, and alternative pole."
  PRC_yuan_settlement_networks: "Yuan Settlement Networks"
  PRC_yuan_settlement_networks_desc: "Financial reach matters as much as trade reach. Every contract settled in yuan slightly widens China's room for strategic manoeuvre."
  PRC_eastern_theatre_readiness: "Eastern Theatre Readiness"
  PRC_eastern_theatre_readiness_desc: "Any future crisis over Taiwan will be decided by readiness before the opening shot. Planning, logistics, and joint rehearsal cannot wait for the last minute."
  PRC_united_front_networks: "United Front Networks"
  PRC_united_front_networks_desc: "Influence rarely looks like open coercion at first. Business links, social groups, media channels, and political intermediaries all extend Beijing's reach."
  PRC_patriotic_education_revival: "Patriotic Education Revival"
  PRC_patriotic_education_revival_desc: "The Party intends to shape memory as well as policy. National story, historical grievance, and regime loyalty will be taught as one."
  PRC_the_leading_small_groups: "The Leading Small Groups"
  PRC_the_leading_small_groups_desc: "Formal ministries matter less when the top leadership creates special organs to cut through bureaucracy and concentrate decision-making around the centre."
  PRC_local_government_debt_swap: "Local Government Debt Swap"
  PRC_local_government_debt_swap_desc: "Provincial debt cannot be allowed to become a political contagion. Beijing will absorb the pain now to preserve control later."
  PRC_chinese_standards_2035: "Chinese Standards 2035"
  PRC_chinese_standards_2035_desc: "Technical standards are geopolitical weapons in slow motion. If Chinese systems become the norm, dependence on China follows naturally."
  PRC_hukou_reform_pilot_zones: "Hukou Reform Pilot Zones"
  PRC_hukou_reform_pilot_zones_desc: "Mobility, labour allocation, and urban integration all run through the household registration system. Reform will come, but only in controlled experiments."
  PRC_algorithmic_social_management: "Algorithmic Social Management"
  PRC_algorithmic_social_management_desc: "The mature digital state does not merely react to dissent or disorder. It predicts, profiles, and pre-empts them."
  PRC_blue_water_navy_programme: "Blue-Water Navy Programme"
  PRC_blue_water_navy_programme_desc: "A state with global trade routes and overseas interests cannot remain a coastal naval power forever. The PLA Navy must learn to think in oceans, not just littorals."
  PRC_strategic_deterrence_posture: "Strategic Deterrence Posture"
  PRC_strategic_deterrence_posture_desc: "Missiles, air defence, command resilience, and political signalling combine into one message: coercing China will be costly and uncertain."
  PRC_rural_revitalisation_campaign: "Rural Revitalisation Campaign"
  PRC_rural_revitalisation_campaign_desc: "The countryside must remain governable, productive, and loyal. Revitalisation is therefore as much a political project as an economic one."
  PRC_frontier_assimilation_measures: "Frontier Assimilation Measures"
  PRC_frontier_assimilation_measures_desc: "The Party prefers the language of harmony, but the substance is integration on Beijing's terms through administration, development, and relentless pressure."
  PRC_string_of_pearls_network: "String of Pearls Network"
  PRC_string_of_pearls_network_desc: "Ports, dual-use facilities, and maritime partnerships provide the infrastructure for Chinese influence from the South China Sea to the western Indian Ocean."
  PRC_assertive_wolf_warrior_posture: "Assertive Wolf Warrior Posture"
  PRC_assertive_wolf_warrior_posture_desc: "This line holds that visible pressure, public confrontation, and diplomatic intimidation will force rivals to respect Chinese power."
  PRC_calibrated_great_power_diplomacy: "Calibrated Great-Power Diplomacy"
  PRC_calibrated_great_power_diplomacy_desc: "China may gain more from restraint than theatrical escalation. Influence can be deepened quietly if confidence is paired with discipline."
  PRC_the_chinese_century: "The Chinese Century"
  PRC_the_chinese_century_desc: "The regime's ambition is no longer merely survival, prosperity, or regional primacy. It seeks a century in which Chinese power sets the terms for Asia and increasingly for the wider world."