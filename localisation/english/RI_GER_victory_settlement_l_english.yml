l_english:
 RI_GER_war_negotiations:0 "The Eastern War and Settlement"
 RI_GER_offer_victory_settlement:0 "Offer Moscow a Settlement"
 RI_GER_offer_victory_settlement_desc:0 "With Moscow under our side's control, we can offer the Soviet government a settlement. If it agrees, a peace conference will decide the defeated side's fate. The Soviet Union may be partitioned or annexed; its survival is not guaranteed. The offer expires after 90 days, and another can be made after 180 days."
 RI_GER_continue_to_urals:0 "Continue to the Urals"
 RI_GER_continue_to_urals_desc:0 "The fighting need not end at Moscow. Press east towards Sverdlovsk, where Germany can propose a settlement leaving a Soviet government beyond the Urals."
 RI_GER_offer_urals_settlement:0 "Renew the Urals Offer"
 RI_GER_offer_urals_settlement_desc:0 "Ask the Soviet government to surrender its western territories and withdraw its capital east. Germany and its allies will seek peace; China will continue its own war if it is still fighting the Soviets. The offer expires after 90 days and can be repeated after 180 days."
 RI_GER_release_ukraine:0 "Establish a Ukrainian Government"
 RI_GER_release_ukraine_desc:0 "Release German-controlled Ukrainian core territory as a dependent state. All Ukrainian core territory owned by Germany must be fully controlled before it can be transferred."
 RI_GER_release_belarus:0 "Establish a Belarusian Government"
 RI_GER_release_belarus_desc:0 "Release German-controlled Belarusian core territory as a dependent state. All Belarusian core territory owned by Germany must be fully controlled before it can be transferred."
 RI_GER_release_georgia:0 "Establish a Georgian Government"
 RI_GER_release_georgia_desc:0 "Release German-controlled Georgian core territory as a dependent state. All Georgian core territory owned by Germany must be fully controlled before it can be transferred."
 RI_GER_release_armenia:0 "Establish an Armenian Government"
 RI_GER_release_armenia_desc:0 "Release German-controlled Armenian core territory as a dependent state. All Armenian core territory owned by Germany must be fully controlled before it can be transferred."
 RI_GER_release_azerbaijan:0 "Establish an Azerbaijani Government"
 RI_GER_release_azerbaijan_desc:0 "Release German-controlled Azerbaijani core territory as a dependent state. All Azerbaijani core territory owned by Germany must be fully controlled before it can be transferred."
 RI_GER_release_kazakhstan:0 "Establish a Kazakh Government"
 RI_GER_release_kazakhstan_desc:0 "Release German-controlled Kazakh core territory as a dependent state. All Kazakh core territory owned by Germany must be fully controlled before it can be transferred."
 RI_GER_review_russian_settlement:0 "Review the Remaining Eastern Territories"
 RI_GER_review_russian_settlement_desc:0 "Resume the post-war review of Wilna, the Russian heartland, the Urals and Siberia. Only territories still owned and fully controlled by Germany can be considered."
 RI_GER_return_crimea_to_ukraine:0 "Transfer Crimea to Ukraine"
 RI_GER_return_crimea_to_ukraine_desc:0 "Transfer German-owned and fully controlled Crimea to an existing Ukraine, and recognise it as Ukrainian core territory. This decision is available after the Russian partition."
 RI_GER_partition_russian_settlement:0 "Reconsider the Russian Settlement"
 RI_GER_partition_russian_settlement_desc:0 "Consider dividing the remaining German and Soviet territories into smaller independent states, with or without a small Soviet Far Eastern remnant. The decision remains available after the Soviet government has been restored."
 RI_GER_eastern_campaign.1.t:0 "Moscow Has Fallen"
 RI_GER_eastern_campaign.1.d:0 "The German side controls Moscow, but the Soviet government has not surrendered. In Berlin, the cabinet must decide whether to offer terms now or order the army farther east.\n\nA settlement offered from Moscow would put the future of Soviet territory before a peace conference, if the Kremlin accepts. The alternative is to push towards Sverdlovsk and seek a different settlement at the Urals, leaving a Soviet government in the east."
 RI_GER_eastern_campaign.1.a:0 "Offer Moscow terms."
 RI_GER_eastern_campaign.1.b:0 "Continue to the Urals."
 RI_GER_eastern_campaign.1.c:0 "The war has already ended."
 RI_GER_eastern_campaign.2.t:0 "At the Edge of Europe"
 RI_GER_eastern_campaign.2.d:0 "Our side has reached Sverdlovsk. The advance has taken Germany to the Urals, and the government must decide how much farther it is willing to go.\n\nBerlin can offer Moscow peace in exchange for its western territories, leaving the Soviet government in the east. China will continue its war if it is still fighting. Alternatively, the army can be ordered onward in pursuit of a complete Soviet surrender."
 RI_GER_eastern_campaign.2.a:0 "Offer terms at the Urals."
 RI_GER_eastern_campaign.2.b:0 "Continue until the Soviets surrender completely."
 RI_GER_eastern_campaign.2.c:0 "The war has already ended."
 RI_GER_eastern_campaign.3.t:0 "A German Offer from the Urals"
 RI_GER_eastern_campaign.3.d:0 "German forces have reached the Urals. Berlin offers an end to its war against us if we concede the western territories and move the government east. Territories held by China will not be handed to Germany, and any Chinese war against us will continue.\n\nAccepting would preserve a Soviet government beyond the Urals, but only at the price of abandoning much of the country. Refusing means continuing the war against Germany as well."
 RI_GER_eastern_campaign.3.a:0 "Accept the terms and withdraw east."
 RI_GER_eastern_campaign.3.b:0 "Reject the German terms."
 RI_GER_eastern_campaign.3.c:0 "The proposal is no longer relevant."
 RI_GER_eastern_campaign.4.t:0 "The Urals Offer Rejected"
 RI_GER_eastern_campaign.4.d:0 "The Soviet government has rejected our proposed settlement. We can renew the offer later, provided the conditions still hold, or continue the campaign until the Soviet Union capitulates."
 RI_GER_eastern_campaign.4.a:0 "Leave the door open to talks."
 RI_GER_eastern_campaign.4.b:0 "There will be no more limited objectives."
 RI_GER_eastern_campaign.5.t:0 "The Urals Settlement"
 RI_GER_eastern_campaign.5.d:0 "The Soviet government has accepted the terms. Germany's war with Moscow is over, and the Soviet government has moved east. Berlin must now decide how to administer the territories it has acquired.\n\nIf China remains at war with the Soviet Union, fighting in the east may continue."
 RI_GER_eastern_campaign.5.a:0 "The eastern campaign is over."
 RI_GER_eastern_campaign.6.t:0 "The Settlement Has Not Ended the War"
 RI_GER_eastern_campaign.6.d:0 "The Soviet government accepted the Urals terms and the territorial transfers were made, but Germany is still at war with the Soviet Union. The settlement has not brought the expected peace; the situation needs further attention."
 RI_GER_eastern_campaign.6.a:0 "The war is not over."
 RI_GER_postwar_fates.1.t:0 "The Future of the East"
 RI_GER_postwar_fates.1.d:0 "The Soviet Union is gone, and the peace settlement has placed former Soviet territories under German rule. Their inhabitants cannot be treated as an afterthought to the war: each territory has its own political movements, institutions and expectations of what comes next.\n\nThe cabinet will consider the countries that can be formed from land Germany owns. For each, it can establish a dependent government, grant full independence or retain German control. Land held by other countries will not be transferred."
 RI_GER_postwar_fates.1.a:0 "Let us consider their futures."
 RI_GER_postwar_fates.2.t:0 "The Future of Ukraine"
 RI_GER_postwar_fates.2.d:0 "Ukraine's fields, cities and industry have passed through a devastating war. Ukrainian organisations are already pressing Berlin for a government of their own, while German officials argue over the security and economic ties they want to preserve. The cabinet must decide the future of the Ukrainian territory Germany holds."
 RI_GER_postwar_fates.3.t:0 "The Future of Belarus"
 RI_GER_postwar_fates.3.d:0 "Belarus lies between Germany and the former Soviet heartland, and its roads and towns have paid heavily for that position. Some in Berlin see a dependent government as the safest arrangement; others believe Belarus should decide its own future. The choice now rests with the cabinet."
 RI_GER_postwar_fates.4.t:0 "The Future of Georgia"
 RI_GER_postwar_fates.4.d:0 "In Georgia, local politicians and communities are looking beyond Soviet rule. Berlin can sponsor a government tied to Germany, recognise a fully independent state or retain the territory it has acquired."
 RI_GER_postwar_fates.5.t:0 "The Future of Armenia"
 RI_GER_postwar_fates.5.d:0 "Armenia's future will shape the settlement in the southern Caucasus. German officials must weigh their wish for influence against the demands of Armenians seeking a government of their own."
 RI_GER_postwar_fates.6.t:0 "The Future of Azerbaijan"
 RI_GER_postwar_fates.6.d:0 "Azerbaijan's oil and its position on the Caspian make it important to any settlement in the Caucasus. Its people also have a claim to decide their own affairs. Berlin must choose what relationship, if any, the new government will have with Germany."
 RI_GER_postwar_fates.7.t:0 "The Future of Kazakhstan"
 RI_GER_postwar_fates.7.d:0 "Kazakhstan's great distances and varied communities make administration from Berlin a demanding prospect. German ministers can establish a dependent government, recognise Kazakhstan's independence or retain the territory under German rule."
 RI_GER_postwar_fates.8.t:0 "The Question of Wilna"
 RI_GER_postwar_fates.8.d:0 "Wilna sits between Lithuania and Belarus, with rival claims and a long history of changing hands. Germany can transfer the territory to Lithuania, Belarus or Poland, provided the chosen country exists and is not at war with Germany, or retain it. A transfer to Belarus will recognise a Belarusian core there."
 RI_GER_postwar_fates.8.lithuania:0 "Transfer Wilna to Lithuania."
 RI_GER_postwar_fates.8.belarus:0 "Transfer Wilna to Belarus."
 RI_GER_postwar_fates.8.poland:0 "Transfer Wilna to Poland."
 RI_GER_postwar_fates.9.t:0 "The Russian Heartland"
 RI_GER_postwar_fates.9.d:0 "Moscow and much of the Russian heartland lie under German rule. Berlin can establish a Russian Republic around Moscow, either under German protection or fully independent, or keep the territory. Only German-owned and fully controlled Soviet-core states in the Moscow region will be transferred; Belarusian and Ukrainian cores are excluded."
 RI_GER_postwar_fates.10.t:0 "Beyond Moscow, the Urals"
 RI_GER_postwar_fates.10.d:0 "The Urals stand at the edge of Germany's European settlement. A separate Ural Republic based at Sverdlovsk could govern the German-held Soviet-core territory in the northern and southern Urals, or Berlin could retain it. Kazakh cores will not be transferred."
 RI_GER_postwar_fates.11.t:0 "A Soviet Government in the East?"
 RI_GER_postwar_fates.11.d:0 "The Soviet Union has been annexed, but Germany now holds territory beyond the Urals. Berlin can restore an independent Soviet government in the German-owned Siberian and Far Eastern Soviet-core states, keep the territory, or consider dividing it into smaller states. Restoring the Soviets will also open the question of a more fragmented settlement. Land owned by China or any other country will not be transferred. A restored Soviet state is not a formal government-in-exile hosted by another country."
 RI_GER_postwar_fates.11.restore:0 "Restore a Soviet government in the east."
 RI_GER_postwar_fates.11.divide:0 "Consider a settlement of smaller states."
 RI_GER_postwar_fates.12.t:0 "The Russian Settlement Reconsidered"
 RI_GER_postwar_fates.12.d:0 "A single government may be unable to represent the vast lands from the western plains to the Pacific. Berlin can recognise a series of independent regional republics, leaving a small Soviet government around Vladivostok and Khabarovsk if those territories are available, or replacing it entirely.\n\nOnly designated territory owned and fully controlled by Germany or the Soviet Union can be divided. Existing countries keep their land; German-held cores may be returned to existing Belarus, Ukraine, Georgia, Armenia, Azerbaijan and Kazakhstan. Crimea goes to an existing Ukraine, and Wilna goes to Lithuania, or to Belarus or Poland if Lithuania is unavailable. Wasteland remains wasteland.\n\nGermany and an existing Soviet Union must be at peace, and the Soviet Union must be independent and hold no territory outside the designated regions. If the necessary territories are unavailable, the settlement cannot be applied."
 RI_GER_postwar_fates.12.remnant:0 "Recognise the republics and a small Soviet remnant."
 RI_GER_postwar_fates.12.divide:0 "Recognise the republics; leave no Soviet state."
 RI_GER_postwar_fates.12.defer:0 "Leave the present settlement unchanged."
 RI_GER_postwar_fates.puppet:0 "Establish a government under German protection."
 RI_GER_postwar_fates.independent:0 "Recognise full independence."
 RI_GER_postwar_fates.keep:0 "Retain German control for now."
 RI_GER_postwar_fates.changed:0 "Circumstances have changed; move on."
 RI_GER_retry_ceasefire_talks:0 "Reopen Ceasefire Talks"
 RI_GER_retry_ceasefire_talks_desc:0 "Moscow rejected our earlier approach. We can ask again, but the Berlin Settlement requires Soviet consent."
 RI_GER_offer_stalemate:0 "Propose a Mutual Ceasefire"
 RI_GER_offer_stalemate_desc:0 "After at least twelve months of war, and while neither Germany nor the Soviet Union has reached 70% surrender progress, we can propose a white peace to Moscow. Acceptance starts a coalition-wide white peace; no territorial concessions are scripted. The offer expires after 90 days and can be repeated after 180 days."
 RI_GER_victory_offer.1.t:0 "A German Offer from Moscow"
 RI_GER_victory_offer.1.d:0 "Moscow has fallen to the German side and our forces are close to defeat. Berlin offers an end to the fighting, but accepting means submitting the fate of the Soviet Union to a peace conference. Our enemies may divide or annex the country. Refusing means continuing the war."
 RI_GER_victory_offer.1.a:0 "Accept the conference."
 RI_GER_victory_offer.1.b:0 "We fight on."
 RI_GER_victory_offer.1.c:0 "Events have overtaken the proposal."
 RI_GER_victory_offer.2.t:0 "Moscow Rejects the Offer"
 RI_GER_victory_offer.2.d:0 "The Soviet government has rejected our settlement proposal."
 RI_GER_victory_offer.2.a:0 "We must consider our next move."
 RI_GER_victory_offer.3.t:0 "An Offer to End the Deadlock"
 RI_GER_victory_offer.3.d:0 "After a long and costly war, Germany proposes a mutual white peace between the opposing sides. Neither government would concede territory under the proposal, but both must accept that their armies have failed to secure victory. We can agree, or continue the fighting."
 RI_GER_victory_offer.3.a:0 "Agree to the white peace."
 RI_GER_victory_offer.3.b:0 "Reject the proposal."
 RI_GER_victory_offer.3.c:0 "Events have overtaken the proposal."
 RI_GER_victory_offer.4.t:0 "Moscow Rejects the Ceasefire"
 RI_GER_victory_offer.4.d:0 "The Soviet government has rejected our proposal for a mutual white peace."
 RI_GER_victory_offer.4.a:0 "We must consider our next move."
 SOV_german_ceasefire.1.c:0 "The proposal is no longer relevant."
 GER_SOV_establish_administration:0 "The Berlin Administration"
 GER_SOV_establish_administration_desc:0 "The defeat has left Berlin answerable to Moscow and responsible for a much smaller country. Before deciding what sort of republic can emerge, its provisional authorities must restore the most basic services and find officials willing to serve."
 GER_SOV_rebuild_industry:0 "Workshops in the Rubble"
 GER_SOV_rebuild_industry_desc:0 "Machinery has been damaged, removed or left idle. Reopening a civilian factory in a safely controlled state will give the administration a foothold for rebuilding."
 GER_SOV_restore_railways:0 "Reconnect the Republic"
 GER_SOV_restore_railways_desc:0 "Food, fuel and workers must reach towns cut off by the fighting. The administration will repair transport infrastructure where there is room for improvement, while coordinating deliveries throughout the republic."
 GER_SOV_expand_technical_education:0 "Reopen the Institutes"
 GER_SOV_expand_technical_education_desc:0 "Engineers and teachers are needed as urgently as equipment. Reopening technical institutes will strengthen research and, if Germany has fewer than five research slots, provide another slot."
 GER_SOV_form_workers_republic:0 "A Republic Within the Bloc"
 GER_SOV_form_workers_republic_desc:0 "The government will work with Moscow to establish durable socialist institutions in the north. Cooperation offers a route to recovery and greater autonomy, but commits us against organising an uprising."
 GER_SOV_reconstruction_councils:0 "Councils for Reconstruction"
 GER_SOV_reconstruction_councils_desc:0 "Factory committees and local officials will draw up reconstruction priorities together. Their plans should speed civilian construction, although Berlin must reconcile a growing number of demands."
 GER_SOV_negotiate_deliveries:0 "The Price of Deliveries"
 GER_SOV_negotiate_deliveries_desc:0 "Soviet demands for machinery and supplies compete with the needs of German workers. A negotiated schedule cannot end those obligations, but it can give the republic more say over its own recovery."
 GER_SOV_social_guarantees:0 "Bread, Housing and Work"
 GER_SOV_social_guarantees_desc:0 "The councils will make food distribution, housing repairs and employment their immediate concerns. These guarantees should restore public confidence, though they will place greater demands on civilian industry."
 GER_SOV_integrate_socialist_economy:0 "Industry Across the Bloc"
 GER_SOV_integrate_socialist_economy_desc:0 "German factories will coordinate orders and production with the Soviet-led economy. Reliable contracts can raise output, even if the republic must accept the priorities of its partners."
 GER_SOV_negotiate_self_government:0 "A Larger Voice in Berlin"
 GER_SOV_negotiate_self_government_desc:0 "A functioning administration can ask Moscow for greater control over local affairs. This improves our autonomy but does not itself guarantee independence."
 GER_SOV_consolidate_republic:0 "A Settlement for the North"
 GER_SOV_consolidate_republic_desc:0 "The republic has made a place for itself within the Soviet-led order. Its institutions remain constrained, but a more stable government can now pursue the work of recovery."
 GER_SOV_organise_resistance:0 "Beneath the Occupation"
 GER_SOV_organise_resistance_desc:0 "Not everyone accepts a future under Moscow's supervision. Creating a clandestine network costs political power and strains public life, but opens a path toward an armed struggle for independence instead of cooperation."
 GER_SOV_underground_press:0 "Words Passed Hand to Hand"
 GER_SOV_underground_press_desc:0 "Printers, couriers and trusted contacts will circulate news beyond the reach of official channels. Their papers can connect isolated opponents and make the case for a free German republic."
 GER_SOV_form_cells:0 "Cells in the Cities"
 GER_SOV_form_cells_desc:0 "Small groups in workplaces and neighbourhoods will recruit carefully and train away from the authorities' attention. They must be able to act locally if contact with Berlin is lost."
 GER_SOV_workers_militias:0 "Recruit the Militia"
 GER_SOV_workers_militias_desc:0 "Veterans and volunteers will be organised into a reserve for the day the underground emerges. A militia is no substitute for an army, but it gives the movement people prepared to fight."
 GER_SOV_hidden_arsenals:0 "Arms Behind Locked Doors"
 GER_SOV_hidden_arsenals_desc:0 "Weapons and medical supplies will be hidden in workshops, cellars and farms. Dispersed caches are harder to uncover and can equip the first recruits when the order comes."
 GER_SOV_coordinate_uprising:0 "A Signal from Berlin"
 GER_SOV_coordinate_uprising_desc:0 "The cells, printers and militia organisers must agree on communications and a common plan. A premature revolt would leave each group to face the occupation alone."
 GER_SOV_defy_occupation:0 "The Republic Rises"
 GER_SOV_defy_occupation_desc:0 "The underground will emerge, break Germany's dependence on Moscow and declare war on the Soviet Union. This is an armed uprising, not a negotiated independence; prepare the army before taking this step."
 GER_SOV_reconstruction_science:0 "Reopened Technical Institutes"
 GER_SOV_reconstruction_science_desc:0 "Teachers and engineers are returning to the laboratories and workshops needed to rebuild the republic."
 GER_SOV_planned_reconstruction:0 "Reconstruction Councils"
 GER_SOV_planned_reconstruction_desc:0 "Local councils direct construction while competing for a share of scarce resources."
 GER_SOV_workers_guarantees:0 "Workers' Guarantees"
 GER_SOV_workers_guarantees_desc:0 "Food, housing and employment commitments give the public security at a cost to industry."
 GER_SOV_integrated_industry:0 "Bloc Industry Contracts"
 GER_SOV_integrated_industry_desc:0 "Coordinated orders tie German factories to the wider Soviet-led economy."
 GER_SOV_underground_network:0 "The Underground Network"
 GER_SOV_underground_network_desc:0 "Clandestine organisers prepare for resistance, but secrecy and the risk of discovery strain the republic."
 GER_SOV_liberation_militia:0 "Militias of the Uprising"
 GER_SOV_liberation_militia_desc:0 "The underground's volunteers fight alongside the regular army during the first year of the uprising."
 GER_victory_reassert_sovereignty:0 "The Republic Stands"
 GER_victory_reassert_sovereignty_desc:0 "The fighting in the east has ended, and Germany can once again decide its own future. The government will reassert its authority and turn to the damage left by the war, though neither victory nor liberation can make that work easy."
 GER_victory_economic_revival:0 "The First Factory Orders"
 GER_victory_economic_revival_desc:0 "The government will place the first civilian orders with German industry and reopen idle capacity. A factory in a German core state will be brought back into production, giving reconstruction somewhere to begin."
 GER_recovery_reopen_workshops:0 "The Workshops Reopen"
 GER_recovery_reopen_workshops_desc:0 "Factories cannot rebuild the country alone. Workshops and suppliers will be given the orders and materials to return to civilian work, adding another factory to the recovery effort."
 GER_recovery_restore_connections:0 "Roads Between Us"
 GER_recovery_restore_connections_desc:0 "Damaged connections and disrupted deliveries slow every part of the recovery. A national transport plan will coordinate the rebuilding of roads and other infrastructure between German communities."
 GER_recovery_peacetime_economy:0 "Industry After the War"
 GER_recovery_peacetime_economy_desc:0 "With factories reopening and a transport plan in place, ministries and industry can look beyond the first repairs. A sustained civilian programme will increase output and make future factory construction easier."
 GER_victory_ideological_consolidation:0 "The Debate Returns"
 GER_victory_ideological_consolidation_desc:0 "The eastern war strained the republic's institutions and left political disagreements unresolved. The government will bring unions, parties and local representatives back into public debate before deciding how reconstruction should be directed."
 GER_recovery_local_councils:0 "The Councils Take a Hand"
 GER_recovery_local_councils_desc:0 "Local councils and workers know which buildings, services and workplaces need attention first. Giving them a greater role will help civilian construction, though the government will have more competing demands to reconcile."
 GER_recovery_national_compact:0 "A Compact for Recovery"
 GER_recovery_national_compact_desc:0 "Party leaders, unions and industry will be asked to agree on a common national programme. A stronger central agreement gives the government room to act, but leaves less priority for local factory projects."
 GER_recovery_civic_reconciliation:0 "A Place at the Table"
 GER_recovery_civic_reconciliation_desc:0 "The war divided families, workplaces and political movements. Whatever course reconstruction has taken, the republic must give those who disagree with the government a place in its future if public confidence is to return."
 GER_recovery_security_review:0 "The Army Looks Back"
 GER_recovery_security_review_desc:0 "The eastern fighting tested Germany's plans against an enemy with enormous depth and resources. A review of operations, losses and logistics will give the army a clearer picture of what must change before the next crisis."
 GER_recovery_reform_the_reserves:0 "The Reserve Rolls"
 GER_recovery_reform_the_reserves_desc:0 "Officers will revise the reserve rolls and call-up system using the lessons of the war. A more reliable pool of trained personnel will give the army manpower it can draw on without keeping every soldier in uniform."
 GER_recovery_european_dialogue:0 "The Capitals Answer"
 GER_recovery_european_dialogue_desc:0 "Berlin will approach France, Scotland and Poland, where they exist and are not at war with Germany, to discuss the security of Europe. The conversations promise no alliance, but they may leave each government more willing to listen."
 GER_recovery_defence_and_diplomacy:0 "A Defence Worth Negotiating"
 GER_recovery_defence_and_diplomacy_desc:0 "Germany's security cannot rest on military strength alone. The government will combine the army's reserve reforms with its diplomatic contacts, improving defensive planning while keeping channels to other capitals open."
 GER_victory_rearmament_and_renaissance:0 "A Republic Renewed"
 GER_victory_rearmament_and_renaissance_desc:0 "The factories are working again, political life has found a measure of stability and the army has begun to adapt. Germany can now turn that recovery into a longer programme of research and national renewal, without forgetting the cost of the eastern war."
 GER_recovery_transport_plan:0 "The Republic Reconnected"
 GER_recovery_transport_plan_desc:0 "A national transport programme coordinates repairs and future investment across German communities. Better planning makes infrastructure easier to build, but the network will take years of work to restore."
 GER_recovery_peacetime_industry:0 "Peacetime Industrial Recovery"
 GER_recovery_peacetime_industry_desc:0 "Civilian orders and a steadier flow of materials allow German factories to increase output and expand. The programme supports a longer recovery instead of relying on emergency production alone."
 GER_recovery_council_participation:0 "Local Reconstruction Councils"
 GER_recovery_council_participation_desc:0 "Workers and local councils have a direct voice in reconstruction projects. Their involvement helps factory construction, though coordinating their demands costs the government time and political effort."
 GER_recovery_national_consensus:0 "National Recovery Compact"
 GER_recovery_national_consensus_desc:0 "A central agreement gives the government a clearer mandate to direct recovery. Political decisions come more easily, but local civilian factory projects receive less priority."
 GER_recovery_defensive_posture:0 "Defence and Diplomacy"
 GER_recovery_defensive_posture_desc:0 "Reserve reforms and diplomatic contacts support a defensive posture designed to protect the republic without closing the door to negotiation. The army gains cohesion and plans more quickly, while peace still depends on decisions beyond Berlin."
 GER_recovery_national_renewal:0 "A Republic Renewed"
 GER_recovery_national_renewal_desc:0 "Reconstruction, political compromise and a more considered defence policy give the government room to look ahead. Research and administration benefit from the recovery, even as the consequences of the war remain."
 GER_recovery_dialogue_opinion:0 "Post-War European Dialogue"
