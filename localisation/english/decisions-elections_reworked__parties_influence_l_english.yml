l_english:
elections_reworked__parties_influence:0 "Parties Influence"
elections_reworked__parties_influence_desc:0 "Being on the political stage is always about showing your people how you are ready to make their lives better and why your way is the best, or let other parties deal with it.  \n\n Reactionary Party influence: £reactionary_influence_texticon [?ROOT.Rea_inf|Y]§Y%§!§Y§!\n\n Conservative Party influence: £conservative_influence_texticon [?ROOT.Con_inf|Y]§Y%§!§Y§!\n\n Social Liberal Party influence: £social_liberal_influence_texticon [?ROOT.Soc_lib_inf|Y]§Y%§!§Y§!\n\n Social Democrats influence: £labour_influence_texticon [?ROOT.labour_inf|Y]§Y%§!§Y§!\n\n Progressive influence: £Progressive_influence_texticon [?ROOT.Pro_inf|Y]§Y%§!§Y§!\n\n Socialist Parties influence: £socialist_influence_texticon [?ROOT.Soc_inf|Y]§Y%§!§Y§!\n\n Communist Parties influence: £communism_influence_texticon [?ROOT.COM_inf|Y]§Y%§!§Y§!\n\n nationalist Parties influence: £nationalist_influence_texticon [?ROOT.Nat_inf|Y]§Y%§!§Y§!\n\n Fascist Party influence: £fascism_influence_texticon [?ROOT.Fas_inf|Y]§Y%§!§Y§!\n\n Monarchy party influence: £neutrality_influence_texticon [?ROOT.Neu_inf|Y]§Y%§!§Y§!\n\nThe influence of parties shows how much the party controls your country. The increase in influence decreases with the increase in the level of influence, the higher the influence, the greater the chance of peaceful overthrow or civil war. (limit 100.00). You can change the influence of parties by giving them more power or, on the contrary, arrange routs against them. \n\nParty Power: £party_power_texticon [?ROOT.party_power|G]§Y§! \n\nParty Power is spent on decisions from this category and other categories of the mod. \nThe increase of £party_power_texticon is equal to the increase of £pol_power (limit 100.00)"
