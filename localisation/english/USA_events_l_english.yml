l_english:

 USA_events.1.t:0 "The Situation Room"
 USA_events.1.d:0 "3:47 AM. The Deputy National Security Advisor is still in the clothes she wore to a fundraiser six hours earlier when the call comes in: German armor has crossed the frontier, Chinese divisions are moving on Central Asia, and CNN has already cut to a graphic reading BREAKING: WORLD WAR III? before the White House has issued a single statement. By the time Nina Turner reaches the Situation Room, the group chats of every foreign policy staffer in Washington are already on fire, and three different cable networks are running the same shaky phone footage of tanks outside Alma-Ata on a loop.\n\nSomeone hands the President a printed one-pager. She doesn't read it. She asks instead: 'What are we telling people in the next hour, because they are already telling themselves something.'"

 USA_events.1.a:0 "Address the nation directly, tonight"
 USA_events.1.b:0 "Let the State Department manage the message"

 USA_events.2.t:0 "Backlash on the Hill"
 USA_events.2.d:0 "The Turner Doctrine is barely twelve hours old when the first defection lands: a Blue Dog senator from Ohio goes on Meet the Press and calls it 'the single most reckless foreign policy decision by an American president in my lifetime,' and the clip is doing six million views before lunch. Inside the DSA's own caucus, the reaction splits along lines that have been quietly forming since Turner's inauguration, the internationalist wing thrilled that America is finally standing with a genuine socialist revolution abroad, the more cautious members quietly asking staffers whether 'ally of a one-party German state' is a phrase that survives a midterm campaign ad.\n\nTurner's chief of staff slides a folder across the Resolute Desk. Inside: three different polling memos, all disagreeing with each other, and a single handwritten note from the Vice President that just says, 'Your call. But say something today.'"

 USA_events.2.a:0 "Hold the line, publicly and unapologetically"
 USA_events.2.b:0 "Reframe it quietly as humanitarian aid, not alliance"

 USA_events.3.t:0 "The First Flag-Draped Coffins"
 USA_events.3.d:0 "They come home through Dover in the grey hour before dawn, seventeen of them, off a transport that took shrapnel outside a logistics hub the Pentagon still won't name publicly. By the time the honor guard finishes the last salute, a livestream shot from someone's phone in the crowd has already hit the front page of every app on every phone in the country, and the chyron under it reads simply: THE FIRST. Not the last, everyone understands. The first.\n\nTurner's press secretary is drafting three versions of a statement in the car on the way to Andrews. One is measured. One is defiant. One, which nobody will admit was ever written, is just an apology. The President has not decided yet which version she believes."

 USA_events.3.a:0 "Turner attends every ceremony personally"
 USA_events.3.b:0 "Delegate the ceremonies, focus on the war effort"

 USA_events.4.t:0 "Moscow's Answer"
 USA_events.4.d:0 "The backchannel cable that finally reaches the Kremlin gets a response after four days of total silence, four days in which American diplomats in Geneva refresh their secure inboxes like teenagers waiting on a text back. When the reply finally comes, it isn't from Rashkin himself, it's from a mid-level Foreign Ministry functionary, and it is exactly nine words long, translated by the State Department analyst with a flat, professional disbelief: 'The Soviet Union does not require American charity.'\n\nA junior aide, reading over the analyst's shoulder, says what everyone in the room is thinking: 'That's not a no. That's a Soviet no, which is different.' Turner, watching the exchange over a secure video link from the residence, asks whether it's worth pushing again, or whether pride is the only thing left in Moscow that still functions on schedule."

 USA_events.4.a:0 "Push again, harder, through a different channel"
 USA_events.4.b:0 "Let the silence sit, and wait for Moscow to blink"

 USA_events.5.t:0 "The Geneva Gambit"
 USA_events.5.d:0 "The conference room in Geneva has hosted a hundred failed negotiations before this one, and by the second week, the assembled delegations, German, Soviet, and a Chinese observer who has said perhaps eleven words the entire time, seem determined to make this one the hundred and first. The American delegation's read-outs, leaked within hours to three separate outlets despite everyone's best efforts, describe a room where nobody wants to be the side that blinks first, and where every procedural objection is really just a proxy for the war itself.\n\nTurner's special envoy calls from a hotel room at 2 AM Geneva time with a stark choice on the table: force a draft ceasefire onto the agenda by threatening to walk, and risk the whole thing collapsing in recrimination, or let the diplomats keep circling for another week while the front lines keep moving without them."

 USA_events.5.a:0 "Force the issue, threaten to walk"
 USA_events.5.b:0 "Let the process play out at its own pace"

 USA_events.6.t:0 "Capital Flight"
 USA_events.6.d:0 "The nationalization order is barely dry when the first corporate jet leaves Teterboro, and by the end of the week a dozen more have followed it, executives relocating headquarters to Toronto, London, or wherever else still recognizes a stock certificate as sacred. A leaked internal memo from one of the largest holdouts, printed in full by a business outlet gleeful at the scoop, describes Turner's administration in language that would have gotten a junior staffer fired in any other White House, and gets shared approvingly by half of Congress instead.\n\nTurner's Treasury Secretary lays out the choice bluntly in the morning briefing: chase the capital that's already fleeing and risk a harder crackdown radicalizing the moderates still on the fence, or offer the remaining holdouts a soft landing and risk looking like the revolution has a price after all."

 USA_events.6.a:0 "Nationalize the holdouts too, no exceptions"
 USA_events.6.b:0 "Offer transition guarantees to keep the rest onside"

 USA_events.7.t:0 "Whispers From the Pentagon"
 USA_events.7.d:0 "The memo lands on the Chief of Staff's desk unsigned, sourced from a career intelligence officer who insisted on a face-to-face handoff in a parking garage instead of email. Its contents are careful, deliberately vague in the way people write when they expect to be quoted in a hearing someday: several retired flag officers, a handful of defense contractors, and at least one sitting general have been meeting quietly, more than once, in settings that have nothing to do with any official Pentagon business.\n\nNobody uses the word coup out loud in the meeting that follows. They don't have to. Someone finally says what everyone is thinking: the Business Plot happened once before, when a President tried to change too much too fast for the people who actually owned the country. Turner asks the only question that matters. Does anyone in this room believe it can't happen twice?"

 USA_events.7.a:0 "Move against them now, before they're ready"
 USA_events.7.b:0 "Gather more evidence before acting"

 USA_events.8.t:0 "The Purge"
 USA_events.8.d:0 "It ends not with tanks in the street but with a series of quiet, devastating personnel orders: generals reassigned to ceremonial postings, board members subpoenaed, a defense contractor's federal contracts frozen pending investigation. The plotters, whoever exactly they were, never get the chance to become the story, because Turner's administration makes sure the story is always about the plot being crushed, decisively, before it could become anything else.\n\nThe DSA's base, terrified for exactly one news cycle, comes out the other side more energized than Turner has seen them since her inauguration. Her advisors warn her, privately, that a government this willing to move against its own military establishment has just spent political capital it may never fully get back. Turner, for her part, seems entirely at peace with the trade."

 USA_events.8.a:0 "Continue"

 USA_events.9.t:0 "The Republic Under Guard"
 USA_events.9.d:0 "Before dawn, military units secure federal buildings, television studios and the principal telephone exchanges. A uniformed spokesman announces that a provisional command has assumed authority in the name of national security. The statement calls the takeover temporary; the suspension of elections and the arrest warrants issued for DSA organizers suggest otherwise.\n\nNina Turner is missing from the broadcast and her whereabouts remain unconfirmed. Across the country, local Democratic Socialist Alliance chapters, union organizers and elected community committees begin coordinating without waiting for instructions from Washington. Their delegates announce a National Council to direct the resistance collectively, rejecting both military rule and any claim that one person can command the movement alone."

 USA_events.9.a:0 "Remain with the military government"
 USA_events.9.b:0 "Join the DSA-led resistance"

 USA_events.100.t:0 "Military Takes Control in Washington"
 USA_events.100.d:0 "Reports from Washington describe troops surrounding federal offices and communications centers as senior officers announce the formation of a provisional national command. The coup leaders promise a return to constitutional government but provide no timetable, while the new authorities move to dissolve the Democratic Socialist Party of America and detain prominent organizers.\n\nThe country is now divided. A revolutionary socialist government has formed from DSA-aligned regions and units, and the first clashes with forces loyal to the junta have been reported. Foreign capitals are calling for restraint as Americans wait to learn whether the crisis can still be resolved without a wider war."
 USA_events.100.a:0 "A crisis with consequences for the whole country"

 USA_events.101.t:0 "DSA Council Calls for a Nationwide Rising"
 USA_events.101.d:0 "In a broadcast relayed through union halls, local radio stations and encrypted messages, the Democratic Socialist Alliance's National Council calls on its supporters to resist the military-nationalist government and defend elected civilian rule. The appeal is presented as a collective decision by delegates from labor organizations, state chapters and community groups; Nina Turner is not named as its commander.\n\nThe Council asks DSA supporters, workers and sympathetic service members to join the revolutionary side, protect their communities and refuse orders issued by the junta. Reports of defections and volunteer formations continue to arrive, though the scale of the response remains unclear. With Washington's command structure fractured, the appeal has become the first common rallying point for the insurgent movement."
 USA_events.101.a:0 "The call echoes across the country"

 USA_dsa_national_council_desc:0 "The DSA National Council is a collective leadership formed by delegates from labor organizations, local chapters and community groups. It directs the revolutionary movement through a coalition rather than placing authority in one individual."

 USA_events.10.t:0 "First Shots in the Pacific"
 USA_events.10.d:0 "The USS Enterprise's strike group crosses the demarcation line at 0600 local time, and within the hour, American F-35s are flying combat air patrol over Korean airspace for the first time since the war began. The Pentagon briefing that follows is carefully worded, defensive posture, protecting allied forces, nothing that sounds like escalation, but the footage that leaks from a deck-mounted camera an hour later, missiles leaving the rail with a flash that lights up half the frame, tells a different story to anyone actually watching it.\n\nTurner's national security team is split evenly in the follow-up call: press the advantage while Chinese-backed forces are reeling from the surprise, or hold the line exactly where it is and let the demarcation do the talking instead of the Navy."

 USA_events.10.a:0 "Press the advantage"
 USA_events.10.b:0 "Hold at the demarcation line"

 USA_events.11.t:0 "The Handshake at Krakow"
 USA_events.11.d:0 "The photograph goes out on every wire service within the hour: an American general and his German counterpart, shaking hands in front of a joint operations map, the Stars and Stripes hanging exactly level with a flag most of America spent eighty years being taught to fear. Inside the tent, the handshake is a great deal less comfortable than the photograph suggests, the German staff officer's opening remarks, translated a beat too literally by an exhausted interpreter, amount to a polite but unmistakable assertion that this is fundamentally a German operation that America has been invited to join, not the other way around.\n\nThe American commander smiles for the cameras and says nothing about it in the room. What he says in his cable back to Washington that night is considerably less diplomatic."

 USA_events.11.a:0 "Insist on genuine operational parity"
 USA_events.11.b:0 "Let Berlin lead, avoid the friction"

 USA_events.12.t:0 "An Empire Ends on Live Television"
 USA_events.12.d:0 "There is no single dramatic moment, no flag lowered in a ceremony, just a slow accumulation of footage that network anchors eventually stop trying to contextualize and simply let play: abandoned checkpoints, soldiers walking home in no particular formation, a red flag coming down from a provincial government building somewhere outside Minsk with nobody in the frame who looks like they're being forced to do it. A country that occupied a third of the news cycle for most of the last century is ending, on camera, without the war crimes trial or the grand surrender ceremony anyone expected.\n\nTurner watches the coverage alone in the residence longer than her schedule allows for. Her staff offers two recommendations. Washington can back local administrations trying to keep food moving and ministries open, risking the charge that America is choosing who governs the ruins. Or it can hold back and prepare for the vacuum to be filled by whoever arrives first. 'Nothing triumphant,' she says. 'Whatever we do next, people are going to remember it for a very long time.'"

 USA_events.12.a:0 "Help the successor administrations keep order"
 USA_events.12.b:0 "Do not let the strategic vacuum stand"

 USA_events.13.t:0 "The Vienna Signing"
 USA_events.13.d:0 "The signing ceremony is a study in careful diplomatic choreography, both delegations photographed shaking hands in front of flags positioned at exactly equal height, both sides' press releases going out within ninety seconds of each other to avoid the appearance that either flinched first. What the cameras don't capture is the argument that happened in the hallway twenty minutes earlier, over a single clause about war reparations that very nearly ended the whole process, resolved only when Turner's envoy suggested, quietly, that both sides simply agree to disagree about who owed whom and sign the document anyway.\n\nBack in Washington, the reaction splits instantly: relief from a war-weary public, fury from a vocal minority who wanted the Soviet system to answer for Kiev and Baku before America ever put its name on anything with Moscow attached to it."

 USA_events.13.a:0 "Defend the accord as the only realistic path"
 USA_events.13.b:0 "Let the controversy pass quietly"

 USA_events.14.t:0 "Sirens Over Buenos Aires"
 USA_events.14.d:0 "The footage out of Argentina is difficult to watch and impossible to look away from, riot police moving through a crowd that started as a labour march and became something the junta's spokesman insists on calling an insurrection, though nobody watching the actual video finds that word especially convincing. Refugee columns are already forming at border crossings into Chile and Brazil before the American State Department has even finished drafting an official statement.\n\nTurner's ambassador in Buenos Aires cables back a blunt assessment: whatever the Pan-American Union decides to do here, or decides not to do, will define what the entire project actually means to the rest of the hemisphere for a generation."

 USA_events.14.a:0 "Offer the junta's opposition material support"
 USA_events.14.b:0 "Limit the response to statements and asylum offers"

 USA_events.15.t:0 "The Arithmetic of War"
 USA_events.15.d:0 "The Joint Chiefs walk Turner through the numbers a second time, slower, in case the first briefing hadn't fully landed: current shipbuilding capacity, current troop rotation schedules, current fuel reserves, none of it built to sustain two genuine theatres of war indefinitely. Somewhere in the briefing, a young staffer says what the generals have all been too careful to say directly. 'Ma'am, this isn't a strategy question anymore. It's a math problem, and math doesn't care which theatre we'd prefer to prioritize.'\n\nTurner listens to the entire briefing without interrupting once. By evening the options are on paper: move ships and divisions west and accept the cost in Europe, or hold the Pacific line with a smaller force and bring the rest home. The President does not ask which choice is safer. She asks which one the country can still afford a year from now."

 USA_events.15.a:0 "Move divisions and shipyards to the Pacific"
 USA_events.15.b:0 "Keep the Pacific commitment deliberately limited"

 USA_events.16.t:0 "What the Reckoning Cost"
 USA_events.16.d:0 "The final report runs to nearly nine hundred pages, and by the time it's finished, it has quietly ended the careers of two sitting generals, a dozen board members, and one senator who resigns the same morning the relevant section is due to be made public. It is, by any measure, one of the most thorough dismantlings of entrenched institutional power in American history, and it is genuinely popular with exactly the coalition that elected Turner twice.\n\nIt is also, her more cautious advisors point out in a memo she reads twice before setting aside, the kind of precedent a very different kind of government could someday use against a very different kind of target. Turner does not disagree with the memo. She simply decides, for now, that the risk is one she can live with."

 USA_events.16.a:0 "Embrace the reckoning as necessary and unfinished"
 USA_events.16.b:0 "Declare the reckoning complete and move on"

 USA_events.17.t:0 "The Hardest Seventy-Two Hours"
 USA_events.17.d:0 "The first violation comes six hours into the ceasefire, a shelling incident both sides immediately blame on the other, and Turner's envoy spends the next three days functioning on almost no sleep, physically shuttling between command posts because neither side fully trusts a phone call anymore. Every hour that passes without total collapse feels like a small, exhausted victory. Every hour also feels like the one where it all finally falls apart.\n\nWashington is watching the same uncertain reports Turner is, and her political team wants a decision on how hard to lean into this publicly before the outcome is even clear."

 USA_events.17.a:0 "Publicly stake your presidency on this ceasefire"
 USA_events.17.b:0 "Support it quietly without overcommitting"

 USA_events.18.t:0 "The Money Behind the Op-Eds"
 USA_events.18.d:0 "A Treasury analyst, the kind of career civil servant nobody ever expects to make headlines, traces an unusually coordinated pattern of funding across a dozen think tanks and media outlets, all suddenly producing remarkably similar arguments about the dangers of a hasty peace, all funded, several layers removed, by the same small cluster of defense-sector donors. It is not, strictly speaking, illegal. It is also not remotely subtle, once someone actually bothers to look.\n\nTurner's chief of staff lays out the choice plainly: drag this into the light and risk turning it into exactly the kind of politically charged circus that makes the ceasefire itself collateral damage, or quietly note it, quietly counter it, and keep the actual peace process the story instead."

 USA_events.18.a:0 "Expose the sabotage campaign publicly"
 USA_events.18.b:0 "Press on and ignore it for now"

 USA_events.19.t:0 "What Was Lost in Geneva"
 USA_events.19.d:0 "The junior diplomat who leaks the postmortem does not do it for money or spite, colleagues later say, she does it because she was in the room for the final collapsed session and cannot live with the official version of events being the only one on the record. Her account, corroborated within days by two other staffers willing to go on background, describes a peace that had genuine support on both sides of the front line, undone specifically by pressure campaigns back in Washington that had nothing to do with Germany or Moscow at all.\n\nThe story dominates the news cycle for exactly as long as it takes the next crisis to bump it off the front page. Turner never publicly confirms or denies any of it. Privately, she keeps a copy of the leaked report in her desk long after everyone else has stopped talking about it."

 USA_events.19.a:0 "Let the anger at the saboteurs fuel the war effort"
 USA_events.19.b:0 "Move on and focus forward"

 USA_events.20.t:0 "The Committee for National Recovery"
 USA_events.20.d:0 "The junta's first cabinet meeting is held in a requisitioned federal building with the blinds drawn. The generals call it an interim council; the businessmen beside them have already brought a list of ministries to dissolve and contracts to reopen. On the radio, the new government promises elections when the emergency is over. No one in the room can say what would end the emergency.\n\nThe officers want a visible return to order. The civilian administrators want a government that can still make decisions without a uniform in every doorway. The first appointments will tell the country which of them the junta intends to hear."
 USA_events.20.a:0 "Put the security council above civilian ministries"
 USA_events.20.b:0 "Keep the ministries operating under military supervision"

 USA_events.21.t:0 "The Contracts Behind the Convoys"
 USA_events.21.d:0 "The first shipping schedules for Berlin arrive in Congress alongside a list of suppliers that reads like a directory of the old defense establishment. The administration can keep the paperwork classified and send a large first shipment of rifles, artillery and support equipment before the next winter offensive, or let civilian auditors trace each contract and release a smaller shipment under closer oversight.\n\nThe argument is not really about accounting. It is about how much American matériel Berlin receives, and who gets to profit from a war Turner promised would not become America's war."
 USA_events.21.a:0 "Keep the convoys moving; the front cannot wait"
 USA_events.21.b:0 "Put the contracts under civilian review"

 USA_events.22.t:0 "The Atlantic Pact Charter"
 USA_events.22.d:0 "The alliance protocol is short enough to fit in a folder and contentious enough to keep the State Department awake for a week. Berlin proposes a permanent combined command structure, while the Pentagon wants a treaty between two sovereign militaries with separate chains of command. Both sides describe their position as a matter of efficiency; both know it is a matter of trust.\n\nTurner must decide what kind of alliance America is joining before the officers begin planning its first campaign."
 USA_events.22.a:0 "Establish a permanent combined command"
 USA_events.22.b:0 "Sign a pact between sovereign militaries"

 USA_events.23.t:0 "The Map Table"
 USA_events.23.d:0 "The new staff's first planning session is spent arguing over a rail junction that neither side can afford to lose. The German officers arrive with a plan already printed. The Americans arrive with better fuel estimates and a different map. By dawn, a workable operation exists, but it is less a shared strategy than a compromise written in grease pencil.\n\nThe alliance charter has already settled who holds formal authority. Now Washington must decide how much influence the staff should have over actual campaigns: it can be authorized to prepare shared operational plans, or kept to exchanging intelligence and advice."
 USA_events.23.a:0 "Authorize shared operational planning"
 USA_events.23.b:0 "Limit the staff to liaison and intelligence"

 USA_events.24.t:0 "The Ceasefire's First Test"
 USA_events.24.d:0 "The guns have gone quiet in enough sectors for the networks to call it a ceasefire. At the line itself, nobody is using that word yet. Prisoner lists do not match, observers are still waiting for travel papers, and every government has an explanation ready for the shell that landed after midnight.\n\nTurner's envoy argues that the truce needs inspectors with authority to publish what they find. The political team warns that a single report blaming Washington's partners could bring the whole settlement down."
 USA_events.24.a:0 "Fund a verification mission and publish its findings"
 USA_events.24.b:0 "Take the imperfect terms and keep the guns silent"

 USA_events.25.t:0 "The Emergency Has a Lobby"
 USA_events.25.d:0 "With the ceasefire gone, the emergency production board meets before dawn. Its members have brought factory forecasts, casualty projections and a list of contracts that cannot be paused without shutting down entire towns. Outside, union organizers and antiwar demonstrators occupy the same wet pavement, each accusing the other of deciding whose sons should die.\n\nThe President can grant the board the authority it wants and turn industrial capacity into a weapon of state policy, or impose a civilian ceiling and accept that the campaign may move more slowly."
 USA_events.25.a:0 "Give the production board emergency authority"
 USA_events.25.b:0 "Limit the contractors and keep civilian oversight"

 USA_events.26.t:0 "The Price of a Reform Package"
 USA_events.26.d:0 "The aid proposal for Moscow is ready: grain, credit and medical supplies, released in stages against verifiable prisoner releases and access for relief organizations. The Soviet delegation has called the conditions an ultimatum. Turner's advisers call them the minimum price of asking American families to pay for someone else's recovery.\n\nA second memorandum offers immediate relief with no political conditions. It might keep the channel open. It might also make Washington the guarantor of a government it has no leverage left to change."
 USA_events.26.a:0 "Tie each shipment to a verifiable concession"
 USA_events.26.b:0 "Send relief now and leave reform to the Soviets"

 USA_events.27.t:0 "A Fortress Needs a Perimeter"
 USA_events.27.d:0 "The Monroe Doctrine speech is still being replayed when the first requests arrive from Mexico City, Havana and Brasília. Some ask for infrastructure and trade guarantees; others want air patrols, intelligence sharing and a promise that Washington will act if the regional balance shifts. Turner has spent a year telling the country that America must stop pretending it can manage every crisis on earth.\n\nNow she must decide whether Fortress America is a defended border or a neighborhood with obligations."
 USA_events.27.a:0 "Build the continental perimeter first"
 USA_events.27.b:0 "Make the hemisphere a partnership, not a buffer"

 USA_events.36.t:0 "A Coalition Against the New Direction"
 USA_events.36.d:0 "After the Pacific Century announcement, intelligence officers bring the White House a new report. Executives from nationalized firms, defense contractors and retired generals have begun meeting with serving officers who oppose Turner's expanding public ownership and leftward agenda. Their stated concern is the country's direction; the report suggests some are privately discussing how to force a change in government. The evidence is not yet proof of a coup, but the links between corporate donors and military contacts warrant an investigation."
 USA_events.36.a:0 "Open a discreet investigation"

 USA_events.28.t:0 "The Alliance Nobody Will Name"
 USA_events.28.d:0 "The agreement with Tokyo is signed without a ceremony. Its existence is confirmed by three denials, two anonymous briefings and a photograph of Japanese officers entering a naval facility in California through a side gate. In private, the alliance is already changing patrol schedules. In public, Turner's own caucus is demanding to know what Washington has promised a government it spent years condemning.\n\nThe staff offers two versions of the partnership: share planning and intelligence now, or keep the pact narrow enough that it can still be disavowed."
 USA_events.28.a:0 "Share the plans; an ally kept at arm's length is no ally"
 USA_events.28.b:0 "Limit the commitment and preserve room to withdraw"

 USA_events.29.t:0 "Who Rebuilds the East?"
 USA_events.29.d:0 "The first requests for reconstruction arrive from towns whose names were missing from the war maps until the front rolled through them. Berlin offers to coordinate the work. Local councils ask for direct American credit. The aid committee warns that money without oversight will disappear into whichever administration controls the rail station.\n\nTurner can make visible reconstruction the opening act of a different European order, or release assistance only where political guarantees are already in place. One choice costs more now; the other risks making hunger another instrument of diplomacy."
 USA_events.29.a:0 "Rebuild first; let the towns decide what follows"
 USA_events.29.b:0 "Make aid conditional on independent oversight"

 USA_events.30.t:0 "The Victor's New Borders"
 USA_events.30.d:0 "Berlin's map of the postwar settlement reaches Washington before its diplomats do. It is not a declaration, merely a set of administrative lines and proposed security zones, but the staff in the Situation Room recognizes what the document assumes: Germany expects its victory to become the permanent architecture of Europe.\n\nTurner can answer with quiet military preparation that risks making the next war easier to imagine, or build a smaller, more defensible policy around American autonomy and a public refusal to bless Berlin's map."
 USA_events.30.a:0 "Prepare quietly for the balance to break"
 USA_events.30.b:0 "Contain Berlin through diplomacy and distance"

 USA_events.31.t:0 "The Union's First Budget"
 USA_events.31.d:0 "The Pan-American Union has been founded, and Mexico, Cuba and Brazil have accepted invitations to join where their existing commitments allow. Its first budget will decide what the new faction means in practice. Mexico wants cross-border rail and power links. Brazil wants guarantees that the bloc will not become an American procurement office. The smaller states want a vote that can change the outcome, not another seat at a table whose decisions were made in Washington.\n\nTurner can spend political capital on shared development, or build the project around security coordination and a promise that no outside power will dictate terms in the hemisphere."
 USA_events.31.a:0 "Fund shared infrastructure and give partners a stake"
 USA_events.31.b:0 "Make collective security the Union's first business"

 USA_events.32.t:0 "Moscow Answers"
 USA_events.32.d:0 "Rashkin's reply reaches Washington through the grain-ship channel: a list of prisoners to be released and three ministries to be opened to outside inspectors, in return for the resumption of American credits. Turner's advisers are divided over whether it is a real concession or a delaying move."
 USA_events.32.a:0 "Accept the offer and release the first grain shipment"
 USA_events.32.b:0 "Hold the credits until the reforms are verified"
 USA_tt_grain_released:0 "§GThe Soviet Union§! receives American grain and credits and gains §G+8%§! stability."
 USA_tt_credits_held:0 "§RThe Soviet Union§! loses §R5%§! stability and §R50§! political power while the credits remain frozen."

 USA_events.33.t:0 "Moscow Opens Its Files"
 USA_events.33.d:0 "Soviet newspapers report the release of political prisoners and the first public audit of the security ministries. Rashkin does not mention Washington, but American grain ships are in every port. Turner calls it a start and not a settlement."
 USA_events.33.a:0 "A slow thaw is better than none"
 USA_events.34.t:0 "The Eastern Compact Finds Its Purpose"
 USA_events.34.d:0 "Delegates from Warsaw, Kyiv, Helsinki, Bucharest and Budapest meet in a converted railway hall to decide what the new compact is for. Commentators call it the first European gathering in decades that Berlin did not organise. Washington must decide whether the compact is to be built on trade and credit or on a shared defence."
 USA_events.34.a:0 "Build it on trade, credit and open markets"
 USA_events.34.b:0 "Build it on a shared defence and a common staff"

 USA_events.35.t:0 "The Long Watch"
 USA_events.35.d:0 "Radar stations, fuelling depots and port garrisons now line the Atlantic coast. Berlin's papers call the American build-up provocative; Washington's call it routine. Turner's staff warn that every new battalion will be read abroad as a message, and ask what she wants it to say."
 USA_events.35.a:0 "Keep the pressure on and expand the garrisons"
 USA_events.35.b:0 "Open a quiet channel to Berlin to prevent a miscalculation"

 USA_events.102.t:0 "Loyalist Columns Advance on the Revolutionary Cities"
 USA_events.102.d:0 "Military columns have begun moving against strongholds of the Democratic Socialist Alliance, backed by the new government's control of rail and fuel depots. Union halls report shortages and arrests as the National Council's broadcasts are jammed in several states. The Council insists the rising will hold, but its supply lines are strained."
 USA_events.102.a:0 "The front lines harden"
