l_english:
 ryan_naval_decisions:0 "Military Assistance & Defence Posture"
 ryan_naval_decisions_desc:0 "With Reform UK in government, Britain can pursue a new defence line: targeted international assistance, strategic partnerships, and stronger domestic deterrence. This programme prioritizes active support for Israel, conditional assistance to Ukraine, and sovereign defence reforms at home."
 
 ryan_ship_upgrade_efficiency:0 "Strategic Assistance Package: Israel"
 ryan_ship_upgrade_efficiency_desc:0 "Expand intelligence coordination, defensive materiel support, and security cooperation with Israel to strengthen allied deterrence posture."
 
 ryan_heavy_ship_specialization:0 "Conditional Assistance Package: Ukraine"
 ryan_heavy_ship_specialization_desc:0 "Provide selective support to Ukraine through logistics coordination, training assistance, and materiel channels where feasible."

 ryan_navy_research:0 "Sovereign Defence Reform Agenda"
 ryan_navy_research_desc:0 "Implement a harder national defence posture through force-readiness upgrades, domestic security planning, and strategic resilience reforms."

 ryan_nato_interoperability_drills:0 "NATO Interoperability Drills"
 ryan_nato_interoperability_drills_desc:0 "Expand joint command-and-control exercises with key NATO partners to raise readiness, strengthen operational alignment, and improve alliance response speed."

 ryan_baltic_deterrence_initiative:0 "Baltic Deterrence Initiative"
 ryan_baltic_deterrence_initiative_desc:0 "Increase maritime patrol coordination and regional deterrence signalling across the Baltic security perimeter in support of allied frontline resilience."

 ryan_heavy_engine_specialization:0 "Ship Heavy Engine Specialization -Divert Military Factories to Support Shipyards"
 ryan_heavy_engine_specialization_desc:0 "Convert tank factories into manufacturing heavy ship engines"

 ryan_carrier_specialization:0 "Carrier Specialization"
 ryan_carrier_specialization_desc:0 "Convert aircraft factories into manufacturing carrier components."
 