l_english:
 GER_opening.1.t:0 "The First Night"
 GER_opening.1.d:0 "§gLIVE FEED // ARD NACHTMAGAZIN // 04:31§!\n\n'Good morning. If you have just woken, I am sorry to say that it is not the morning you were expecting. Shortly after midnight, German forces crossed the eastern frontier. The Chancellor has not yet addressed the nation, but the Defence Ministry has confirmed that Operation Hammer is under way.'\n\n'Let me tell you what we know. Armoured columns are advancing along three axes. Our air force has struck Soviet command posts and air defence sites across the border region, and cyber units are reported to have disabled communications along the front. Soviet forces appear to have been caught largely unprepared.'\n\n'In Berlin, the mood is hard to describe. I walked through Alexanderplatz an hour ago. Nobody was shouting. Nobody was cheering. A group of students stood in front of a shop window watching the feed on twelve television screens, and I heard one say, very quietly, \"So that's it, then.\"'\n\n'Across the country, phones are lighting up. Families are calling soldiers. Soldiers are calling their mothers. Stock exchanges will not open today. The Chancellor will speak at noon.'\n\n'Whatever your view of this decision, this is the moment the country has chosen. We will be with you throughout.'\n\n§Y\"It began not with a bang but with the sound of ten thousand phones lighting up at once.\"§!"
 GER_opening.1.a:0 "Take the offensive. Strike fast, strike hard."
 GER_opening.1.b:0 "Hold the line and let diplomacy catch its breath."
 GER_economy.1.t:0 "The Factory Floor"
 GER_economy.1.d:0 "§gTHE GUARDIAN WEEKEND // FEATURE§!\n\n§YINSIDE THE FACTORY THAT BECAME A FORTRESS§!\n\nThe Ruhr was always a place that made things. For a century it made steel, then cars, then parts for cars. This spring it began making something else, and nobody in the town of Duisburg will say what, exactly, because they have been asked not to.\n\nI visited the plant on a Tuesday. The foreman, a heavy man named Jürgen with a voice like gravel, walked me past rows of machines still wearing last year's paint. 'Three months ago we built washing machines,' he said. 'Now I could not tell you what we build, only that there is a lorry outside every four hours.'\n\nThe government calls it the Production Drive. The workers call it 'the second shift', although many of them are now on the third. Wages are up, overtime is plentiful, and the canteen has begun serving real meat. Nobody complains. Nobody says much of anything, in fact. Everyone seems to be waiting for the thing the factory is being built to answer.\n\nWhen I asked Jürgen whether he was worried, he thought for a moment. 'My father worked in this plant in the old days,' he said. 'He told me the machines always know before the men do. I do not like how loud they are getting.'\n\n§Y\"The noise from the factory is not just industry. It is a country clearing its throat.\"§!"
 GER_economy.1.a:0 "Squeeze every ounce of output. Whatever the cost."
 GER_economy.1.b:0 "Pace the effort. A tired nation breaks."
 GER_economy.conscription_reaction.t:0 "The Call-Up"
 GER_economy.conscription_reaction.d:0 "§gBBC NEWS ONLINE // ANALYSIS§!\n\n§YGERMANY'S CONSCRIPTION DECISION SPLITS A NATION§!\n\nBERLIN - On the morning the new call-up notices began arriving in letterboxes across Germany, three things happened at once. The recruitment portal crashed under the weight of applicants. A student march of several thousand formed outside the Reichstag. And a quiet, almost sombre queue formed outside every barracks in the country.\n\nThe government calls it a 'duty of national resilience'. Its critics call it something else, and the placards in Berlin were not subtle. 'MY BODY, NOT YOUR BORDER', read one. A smaller, older group nearby held signs with a different message: 'WE DID IT BEFORE.'\n\nSocial media tells the same story in a thousand fragments. There are videos of tearful goodbyes at railway stations, memes mocking the first-aid training, and a viral clip of a grandmother handing her grandson a thermos and telling him, 'Do not be a hero. Be home.' It has been watched forty million times.\n\nPolling suggests public opinion is not uniform. Younger voters are sceptical. Older ones are resigned. Those who have already served are, perhaps surprisingly, the most supportive, and the most anxious.\n\nOne reservist in Hannover, interviewed outside a recruitment office, summed up the national mood. 'I am not angry,' he said. 'I am just very tired of being needed.'\n\n§Y\"A country that asks its children to serve should be prepared to tell them why.\"§!"
 GER_economy.conscription_reaction.a:0 "Hold firm. The country needs soldiers."
 GER_economy.conscription_reaction.b:0 "Listen to the protests. Offer exemptions and ease the rollout."
 GER_eastern.hammer_fired.t:0 "Hammer Falls"
 GER_eastern.hammer_fired.d:0 "§gOPERATIONS LOG // HEERESFÜHRUNGSKOMMANDO // 03:12§!\n\nThe operations room had gone quiet in the way a room goes quiet when everyone is pretending not to listen. On the main display, a hundred small blue symbols crawled east across the border. Beside them, a handful of red ones flickered, hesitated, and began to vanish.\n\nColonel Reuter, the duty officer, spoke into his headset in a low, steady voice. 'First Panzer reports crossing at Brest. No contact. Second Mechanised reports bridge secure, minimal resistance. Air wing has confirmed air defence suppression in sectors Alpha and Bravo.' He paused, listening. 'They say the sky is theirs.'\n\nA captain by the window leaned back and let out a breath she had been holding for six hours. Someone near the door started to clap, then thought better of it. Nobody joined in.\n\nGeneral Hartmann stood at the back of the room, arms folded, watching the symbols move. He had been staring at maps like this for forty years, and only once before had he seen one look so clean. He did not say what he was thinking, which was that clean maps lie.\n\nAt 03:40 the first Soviet counter-signal appeared, brief and panicked. Reuter wrote down the time. 'So it begins,' he muttered. And then, for no reason anyone could later explain, he added: 'God help them.'\n\n§Y\"The Hammer has fallen. The anvil is not yet ready.\"§!"
 GER_eastern.hammer_fired.a:0 "Press the advantage. Keep the tempo up."
 GER_eastern.hammer_fired.b:0 "Consolidate. Let the army catch its breath."
 GER_naval.1.t:0 "The Baltic Gambit"
 GER_naval.1.d:0 "§gCOMMODORE'S SIGNAL // BALTIC FLEET // ENCRYPTED§!\n\nTo Flag, from Commodore Jansen. Priority.\n\nWe are in position. Three submarines are sitting in the deep water south of Gotland, engines silent, sonar passive. Two surface groups are loitering in the approaches to the Gulf of Finland, running without lights. I want it understood that none of this required anyone's permission. We were simply where the maps said we should be.\n\nThe Soviet Baltic Fleet is not what it was. We have counted nine hulls in port at Kaliningrad, of which perhaps four could put to sea. Their coastal radar network is running at half capacity, and what remains is staffed by people who have not been paid. I watched a corvette try to leave harbour yesterday and turn back because the tugs refused to move.\n\nOur plan is straightforward. We close the Straits and cut the sea lanes. No shots need be fired unless they decide to fire first. The Baltic will become a lake with a German lid, and every barrel of oil, every tonne of grain heading east will pass beneath our eyes.\n\nI do not like to speak of luck, but I have been at sea long enough to know when the water is on our side. It is on our side. Please do not make us wait.\n\n§Y\"The sea does not choose sides. But it remembers who arrived first.\"§!"
 GER_naval.1.a:0 "Authorise a full blockade. Close the sea lanes."
 GER_naval.1.b:0 "Show the flag and negotiate passage. Keep the shipping lanes open."
 GER_naval.submarine_reaction.t:0 "Contacts Under the Waves"
 GER_naval.submarine_reaction.d:0 "§gSONAR LOG // U-BOAT U-3214 // PATROL REPORT§!\n\nCaptain's log, third day of patrol. Depth sixty metres. The boat is quiet and so are we.\n\nAt 02:14 the sonar operator, Petty Officer Weiß, raised his hand without looking up from his screen. 'Contact, bearing two-seven-zero. Single screw, slow. Sounds like a merchantman.' He listened for another minute. 'No, sir. Two of them. And something larger behind.'\n\nThe boat has not spoken so softly in all the weeks since we left port. I watched the faces in the control room: the helmsman, the engineer, the young lieutenant on his first deployment, all of them leaning very slightly towards the sound, as though it might hear them back.\n\nThe convoy passed over us at four knots. Through the hull I could hear the distant rhythm of their propellers, a slow, patient drumming. They had no escort worth the name. They did not know we were there. It would have been the easiest thing in the world.\n\nI gave the order to hold fire. Not out of mercy; we are not in the business of mercy. But the Admiralty wants a pattern, not a massacre, and patterns require patience.\n\nWe let them pass. The sea closed over them like a hand. I wrote the time in the log and did not look at anyone for a while.\n\n§Y\"A submarine's best weapon is the one it does not fire.\"§!"
 GER_naval.submarine_reaction.a:0 "Hunt the convoys. Let them know we are watching."
 GER_naval.submarine_reaction.b:0 "Shadow, don't strike. Gather intelligence."
 GER_naval.lifeline_cut.t:0 "The Lifeline Is Cut"
 GER_naval.lifeline_cut.d:0 "§gMOSCOW TIMES // BUSINESS // 06:00§!\n\n§YIMPORT SHIPMENTS HALTED AS BALTIC ROUTE GOES DARK§!\n\nMOSCOW - Traders at the Moscow Exchange opened the morning to a table of red numbers and a silence unusual even for a market in decline. Overnight, the shipping lane that supplied the Soviet Union with Western oil equipment, medicine and consumer goods stopped moving.\n\nOfficial statements are brief. The Ministry of Trade describes it as 'a temporary disruption in maritime logistics'. A source close to the port authority at Kaliningrad was more direct. 'We have eleven ships waiting at anchor,' he said, 'and none of them will tell us why.'\n\nThe effects are already visible in the capital. Pharmacies have posted notices about stock shortages. Petrol queues stretch around the block in the outer districts. A grocery chain announced rationing for imported goods, then retracted the announcement an hour later after it spread across social networks and caused panic buying.\n\nEconomists are already running the numbers. A prolonged cutoff would not be fatal to the Soviet economy, but it would be humiliating, and humiliation has a way of travelling upstream. One analyst put it plainly: 'They can survive losing the ships. They cannot survive losing the story that they are in control.'\n\nIn a café near the Arbat, a waiter shrugged when asked what he thought of the news. 'Same as always,' he said. 'They tell us it is nothing. And then the shelves are empty.'\n\n§Y\"A blockade does not need to kill. It only needs to convince.\"§!"
 GER_naval.lifeline_cut.a:0 "Let them feel the pinch. Time is on our side."
