l_english:
 USA_tt_reconstruction_aid:0 "Eastern European states (Poland, Ukraine, Belarus, the Baltics, Finland, Romania, Hungary) receive §G+3%§! stability, §G+30§! political power and better opinion of us."
 USA_tt_independent_recovery:0 "We guarantee the independence of the Eastern European states, which gain the §GIndependent Recovery§! spirit. Germany's opinion of us drops."
 USA_tt_cold_peace:0 "We gain a large equipment stockpile and §G60,000§! manpower. If we chose open containment, we guarantee Germany's eastern neighbours and Germany's opinion of us drops; if we chose diplomacy, Germany's opinion of us improves."
 USA_tt_quiet_rearmament:0 "We gain §G5,000§! infantry equipment, §G500§! support equipment and §G40,000§! manpower."
 USA_tt_moscow_pressure:0 "The Soviet Union loses §R5%§! stability and its opinion of us drops."
 USA_tt_moscow_silence:0 "The Soviet Union gains §G+3%§! stability and §G50§! political power, and its opinion of us improves."
 USA_tt_soviet_thaw:0 "The Soviet Union gains the §GSoviet Thaw§! spirit and §G+5%§! stability."
 USA_tt_grain_dependency:0 "The Soviet Union gains the §YGrain Dependency§! spirit and §G+5%§! stability."
 USA_tt_mexico_partnership:0 "We guarantee Mexico, which gains the §GHemispheric Partner§! spirit, §G+3%§! stability and an American equipment shipment."
 USA_tt_argentina_opposition:0 "Argentina gains the §RArgentine Unrest§! spirit and loses §R10%§! stability. Brazil and Mexico think better of us."
 USA_tt_argentina_asylum:0 "Argentina loses §R3%§! stability. Brazil thinks better of us."
 USA_tt_hemisphere_engagement:0 "We gain a puppet wargoal against Argentina and §G30,000§! manpower. Argentina loses §R5%§! stability."
 USA_tt_the_wall_holds:0 "We gain §G20,000§! manpower. Brazil thinks better of us and Argentina's opinion of us drops."

 USA_reconstruction_aid:0 "American reconstruction aid"
 USA_rival_reconstruction:0 "Rival American reconstruction"
 USA_cold_peace_guarantee:0 "American guarantee against Germany"
 USA_cold_peace_rivalry:0 "American containment"
 USA_cold_peace_dialogue:0 "American diplomatic restraint"
 USA_moscow_pressured:0 "American ultimatum"
 USA_moscow_courted:0 "American grain and credits"
 USA_hemispheric_partnership:0 "Pan-American partnership"
 USA_argentina_interference:0 "American interference"

 USA_independent_recovery:0 "Independent Recovery"
 USA_independent_recovery_desc:0 "American aid and a guarantee of independence let the country rebuild without being absorbed into a single power's sphere."
 USA_soviet_thaw:0 "Soviet Thaw"
 USA_soviet_thaw_desc:0 "Political prisoners are released and parts of the bureaucracy are open to scrutiny. The change is slow, but it is real."
 USA_soviet_grain_dependency:0 "Grain Dependency"
 USA_soviet_grain_dependency_desc:0 "American grain keeps the country stable, but the arrangement leaves reform and independent policy on hold."
 USA_hemispheric_partner:0 "Hemispheric Partner"
 USA_hemispheric_partner_desc:0 "Joint rail, power and trade projects with the United States are modernizing the economy."
 USA_argentine_unrest:0 "Argentine Unrest"
 USA_argentine_unrest_desc:0 "An American-backed opposition has left the government struggling to keep order and support."

 USA_eastern_compact_faction:0 "The Eastern Compact"
 USA_tt_eastern_compact:0 "We found §YThe Eastern Compact§! and invite the independent Eastern European states, who receive an equipment shipment and a better opinion of us. Germany's opinion of us drops."
 USA_tt_atlantic_shield:0 "We gain the §GAtlantic Shield§! spirit, §G30§! army experience, and large infantry and artillery stockpiles. Germany's opinion of us drops."
 USA_tt_long_watch_arms:0 "We gain the §GLong Watch Readiness§! spirit and §G80,000§! manpower. Germany's opinion of us drops and its war support rises."
 USA_tt_long_watch_detente:0 "Germany gains §G3%§! stability and its opinion of us improves."
 USA_tt_europe_trade:0 "We gain the §GEastern Trade Network§! spirit. Our Eastern European partners receive stability, political power and a better opinion of us."
 USA_tt_europe_defense:0 "We gain the §GEastern Shield§! spirit and bring Belarus, Poland, Ukraine, Finland, Romania and Hungary into the compact if they are unaligned."
 USA_The_Eastern_Compact:0 "The Eastern Compact"
 USA_The_Eastern_Compact_desc:0 "The states of Eastern Europe are rebuilding with American help, but each is too small to stand alone between Berlin and Moscow. Turner invites them into a compact of equals, with joint planning, shared supplies and no occupying army. Berlin sees a rival bloc forming on its border."
 USA_A_Europe_of_Many_Peoples:0 "A Europe of Many Peoples"
 USA_A_Europe_of_Many_Peoples_desc:0 "The compact has survived its first year. Now its members must decide what kind of body it is to be: a common market that binds their economies to Washington's, or a defensive pact with a joint staff. Whichever path Turner chooses will shape the continent long after the war."
 USA_The_Atlantic_Shield:0 "The Atlantic Shield"
 USA_The_Atlantic_Shield_desc:0 "The quiet rearmament becomes a standing posture. Coastal garrisons, reserve divisions and forward depots are organised into a single plan to defend the American seaboard against any German move. Berlin watches closely and begins to answer in kind."
 USA_The_Long_Watch:0 "The Long Watch"
 USA_The_Long_Watch_desc:0 "A cold peace needs constant attention. Turner must now decide whether to keep raising the pressure on Berlin, or to open a private line to prevent a misreading from becoming a war."
 USA_atlantic_shield:0 "Atlantic Shield"
 USA_atlantic_shield_desc:0 "Coastal garrisons, reserves and depots are organised into one plan for defending the seaboard."
 USA_long_watch_readiness:0 "Long Watch Readiness"
 USA_long_watch_readiness_desc:0 "Standing forces train to a permanent war plan against a possible German attack."
 USA_eastern_trade_network:0 "Eastern Trade Network"
 USA_eastern_trade_network_desc:0 "American credit and shipping bind the Eastern Compact into a growing common market."
 USA_eastern_shield:0 "Eastern Shield"
 USA_eastern_shield_desc:0 "A joint staff and shared supply lines give the Eastern Compact a credible defence."

 USA_tt_loyalist_offensive:0 "The revolutionary government loses §R5%§! stability, §R5%§! war support and §R50§! political power as loyalist columns advance."
 USA_tt_martial_law:0 "We gain the §GMartial Law Mobilization§! spirit, §G60,000§! manpower and equipment. The revolutionary government loses §R5%§! war support and §R3%§! stability."
 USA_tt_security_state_abroad:0 "We gain §G100,000§! manpower and a large equipment stockpile. Germany, Italy, Japan and Spain think better of us; Britain, France and Canada think worse of us."
 USA_tt_civilian_cabinet_abroad:0 "Britain, France, Canada and Mexico think better of us. Germany, Italy and Japan think worse of us."
 USA_tt_purge_aftermath:0 "Corporate influence falls by §G25§!."
 USA_tt_party_remade_abroad:0 "Corporate influence is reset to zero. Britain, France, Canada, Mexico, Brazil and the Soviet Union think better of us; Germany thinks worse of us."
 USA_junta_sympathy:0 "Sympathy for the American junta"
 USA_junta_pariah:0 "Disapproval of American government"
 USA_civilian_restoration:0 "Restored American civilian government"
 USA_martial_law_mobilization:0 "Martial Law Mobilization"
 USA_martial_law_mobilization_desc:0 "Emergency powers let the army draft, supply and reinforce at the expense of civilian politics."
 USA_National_Security_Directorate:0 "The National Security Directorate"
 USA_National_Security_Directorate_desc:0 "The junta will replace its improvised wartime command with a permanent National Security Directorate. Intelligence, military planning and arms procurement will report to one executive council, which will set national priorities and coordinate the agencies. This improves the regime's ability to govern, but the new command structure diverts resources from civilian goods."
 USA_Operation_Civic_Shield:0 "Operation Civic Shield"
 USA_Operation_Civic_Shield_desc:0 "The Directorate will establish a joint federal-state security command, share intelligence files between agencies and assign investigators to sabotage and resistance networks. Better coordination makes underground activity easier to detect and contain, but maintaining the program consumes political capacity."
 USA_The_Atlantic_Perimeter:0 "The Atlantic Perimeter"
 USA_The_Atlantic_Perimeter_desc:0 "The armed forces will adopt an Atlantic defense plan: coordinate naval patrols with allied ports, prepare airfields for rapid reinforcement and position the army to defend coastal approaches. The plan improves defensive readiness and naval organization; it does not establish new bases or alliances by itself."
 USA_The_Loyalty_Bureaus:0 "The Loyalty Bureaus"
 USA_The_Loyalty_Bureaus_desc:0 "The government will screen senior civil servants and officers, review their political and service records, and replace those judged unreliable. The bureaus also secure internal communications, strengthening the regime's command discipline and war support while deepening public mistrust."
 USA_The_Continental_Arsenal:0 "The Continental Arsenal"
 USA_The_Continental_Arsenal_desc:0 "The government will issue long-term contracts for standardized weapons and support equipment, guarantee factory orders and keep production lines on a standing readiness schedule. This ensures a steady supply of military equipment while diverting resources from civilian goods."
 USA_America_Under_Watch:0 "America Under Watch"
 USA_America_Under_Watch_desc:0 "The Directorate will merge loyalty records, surveillance warrants and federal policing into a permanent domestic-security system, then place those agencies under its direct control. This will improve political coordination and war support, but the new command structure diverts resources from civilian goods."
 USA_The_Hemisphere_Armed:0 "The Hemisphere Armed"
 USA_The_Hemisphere_Armed_desc:0 "The government will expand the reserve, reinforce coastal commands and stock artillery and anti-aircraft guns for a hemispheric mobilization. This strengthens the armed forces and increases available conscription, at the cost of domestic stability."
 USA_national_security_directorate:0 "National Security Directorate"
 USA_national_security_directorate_desc:0 "A permanent executive council coordinates intelligence, military planning and arms procurement. It improves political coordination while diverting resources from civilian goods."
 USA_civic_security_program:0 "Civic Security Program"
 USA_civic_security_program_desc:0 "Federal and state agencies share intelligence and coordinate counter-sabotage investigations. Resistance is easier to detect, but the program consumes political capacity."
 USA_loyalty_bureaus:0 "Loyalty Bureaus"
 USA_loyalty_bureaus_desc:0 "Officials and officers are screened and unreliable personnel are removed. Internal communications are more secure, but public trust declines."
 USA_atlantic_perimeter:0 "Atlantic Perimeter"
 USA_atlantic_perimeter_desc:0 "An Atlantic defense plan improves army defensive readiness, naval organization and public support for military preparedness."
 USA_continental_arsenal:0 "Continental Arsenal"
 USA_continental_arsenal_desc:0 "Long-term arms contracts and standardized production raise factory output, while military orders take resources from civilian goods."
 USA_hemisphere_armed:0 "Hemisphere Armed"
 USA_hemisphere_armed_desc:0 "Expanded reserves and stocked artillery strengthen the armed forces and increase available conscription, at the cost of domestic stability."

 USA_events.103.t:0 "The National Security Directorate"
 USA_events.103.d:0 "The government announces a permanent directorate to coordinate the armed forces, intelligence services and industrial planning. Its charter describes a unified response to future emergencies. Civilian officials privately note that no sunset clause appears in the document."
 USA_events.103.a:0 "Order must be made permanent"
 USA_events.104.t:0 "A New Atlantic Perimeter"
 USA_events.104.d:0 "Washington unveils plans for a network of naval stations, airfields and intelligence agreements around the Atlantic. The government calls the perimeter defensive. Foreign capitals see a military government extending its reach beyond its borders."
 USA_events.104.a:0 "Secure the approaches"
 USA_events.105.t:0 "America Under Watch"
 USA_events.105.d:0 "The National Security Directorate has centralised surveillance warrants, personnel files and emergency policing. The administration claims the system has prevented a return to civil war. Civil-liberties groups warn that the temporary machinery of the coup has become permanent government."
 USA_events.105.a:0 "The state will not be surprised again"
 USA_events.106.t:0 "The Hemisphere Armed"
 USA_events.106.d:0 "The United States announces a major expansion of its reserves and coastal commands, describing the buildup as a guarantee of hemispheric stability. Governments across the Americas are left to decide whether Washington's promise of protection sounds more like an ultimatum."
 USA_events.106.a:0 "No rival power will take root here"
 USA_christian_national_order:0 "Christian National Order"
 USA_christian_national_order_desc:0 "The regime fuses religious identity with patriotism and presents loyalty to its government as a civic duty."
 USA_christian_civic_code:0 "Christian Civic Code"
 USA_christian_civic_code_desc:0 "Public institutions are reorganised around the junta's religious-national doctrine, narrowing civic space while strengthening regime control."
 USA_one_party_christian_state:0 "One-Party Christian State"
 USA_one_party_christian_state_desc:0 "Opposition parties and independent presses are suppressed. The state gains short-term unity at the cost of pluralism, consumer production and open debate."
 USA_christian_hemisphere:0 "Christian Hemisphere"
 USA_christian_hemisphere_desc:0 "The junta frames its security policy as a religious-national mission and seeks partners willing to accept American leadership."
 USA_national_service_act:0 "National Service Act"
 USA_national_service_act_desc:0 "Military, industrial and civil defence service expand the available manpower while straining social stability."
 USA_americas_covenant:0 "Americas Covenant"
 USA_americas_covenant_desc:0 "The United States arms and protects governments that accept its security leadership across the hemisphere."
 USA_christian_american_order:0 "American Christian-national partnership"
 USA_events.107.t:0 "The Opposition Proscribed"
 USA_events.107.d:0 "The junta has outlawed socialist and liberal political organisations and closed independent presses associated with them. Government spokespeople describe the measures as national protection and Christian renewal. Critics abroad warn that the new American order has turned political opposition into a punishable status."
 USA_events.107.a:0 "The regime's new order is complete"
 USA_events.108.t:0 "The Americas Covenant"
 USA_events.108.d:0 "Washington has paired new military commitments with arms shipments to governments in Mexico and Brazil. The junta describes the arrangement as a Christian-national partnership for hemispheric stability. Opposition voices in the region call it a sphere of influence enforced by American power."
 USA_events.108.a:0 "The hemisphere will stand together"
 USA_Security_National_Covenant:0 "The Security State's National Covenant"
 USA_Security_National_Covenant_desc:0 "With the security apparatus firmly in place, the junta begins a new political project: a Christian-national state built around patriotic unity, moral regulation and a permanent military presence in public life."
 USA_State_Church_Charter:0 "A Charter for the Churches"
 USA_State_Church_Charter_desc:0 "The administration gives favoured Christian institutions a formal role in public ceremonies and national policy. Supporters call it a return to the country's moral foundations; other faiths and secular groups fear second-class status."
 USA_Christian_Schools:0 "Christian Schools"
 USA_Christian_Schools_desc:0 "Federal education standards now emphasise religious instruction, patriotic history and service to the nation. The reform deepens support among the regime's base but narrows space for secular teaching."
 USA_The_Family_Compact:0 "The Family Compact"
 USA_The_Family_Compact_desc:0 "The government directs new benefits and civic programs toward families that publicly support its religious-national values. Participation is described as voluntary, though access to public institutions increasingly depends on conformity."
 USA_An_American_Covenant:0 "An American Covenant"
 USA_An_American_Covenant_desc:0 "The junta declares Christian nationalism the moral foundation of the new republic. The state gains a more unified public identity, while scientific and political life become less open to dissent."
 USA_Corporate_Concordat:0 "The Corporate Concordat"
 USA_Corporate_Concordat_desc:0 "Industrial leaders, military planners and approved labour organisations are brought into a state-supervised council. Collective bargaining survives only inside the new national framework."
 USA_Labor_Peace:0 "Labour Under the Flag"
 USA_Labor_Peace_desc:0 "Independent unions are pressured to dissolve into national labour organisations. Strikes become rarer, but workers lose the right to challenge the regime or its industrial partners."
 USA_Industrial_Charters:0 "Industrial Charters"
 USA_Industrial_Charters_desc:0 "The government awards long-term charters to firms that meet military production targets and accept state direction. The arrangement expands output while giving a small circle of corporations privileged access."
 USA_National_Reconstruction:0 "National Reconstruction"
 USA_National_Reconstruction_desc:0 "The regime directs construction, transport and manufacturing toward a permanent mobilisation economy. Roads and factories expand, but civilian priorities are subordinated to national strength."
 USA_Anti_Subversion_Act:0 "The Anti-Subversion Act"
 USA_Anti_Subversion_Act_desc:0 "A broad security law places socialist organisations and independent political networks under surveillance. The administration says it is preventing another civil conflict; critics warn that opposition itself is being redefined as a threat."
 USA_Civil_Service_Lustration:0 "Lustration of the Civil Service"
 USA_Civil_Service_Lustration_desc:0 "Public employees are screened for political reliability and removed from sensitive posts if they refuse the new oath. The government consolidates control, but expertise and public trust suffer."
 USA_Outlaw_the_Opposition:0 "Outlaw the Opposition"
 USA_Outlaw_the_Opposition_desc:0 "Socialist and liberal parties are banned, their presses closed and their organisers excluded from public office. This is a sweeping political purge, not a battlefield campaign; the country is left with no legal opposition."
 USA_One_Party_Charter:0 "The One-Party Charter"
 USA_One_Party_Charter_desc:0 "The ruling nationalist movement is made the sole legal political organisation. Stability and mobilisation improve, but civic freedoms and independent institutions have been almost entirely extinguished."
 USA_Hemispheric_National_Covenant:0 "The Hemispheric National Covenant"
 USA_Hemispheric_National_Covenant_desc:0 "After securing the home front, the junta announces that America's future lies in organising the hemisphere around shared Christian-national values and American military leadership."
 USA_Christian_Diplomacy:0 "Christian Diplomacy"
 USA_Christian_Diplomacy_desc:0 "Embassies become instruments of religious and political influence. Washington offers aid and recognition to governments that publicly endorse its vision of a disciplined, Christian-led hemisphere."
 USA_The_American_Pact:0 "The American Pact"
 USA_The_American_Pact_desc:0 "A network of bilateral security agreements replaces the language of equal partnership with a clear hierarchy. The United States promises protection; smaller states are expected to follow its lead."
 USA_Arms_for_Allies:0 "Arms for the Allies"
 USA_Arms_for_Allies_desc:0 "Military shipments to Mexico and Brazil bind their armed forces more closely to American equipment and training. The deliveries strengthen friendly governments and extend Washington's influence."
 USA_Hemispheric_Order:0 "A Hemispheric Order"
 USA_Hemispheric_Order_desc:0 "The covenant becomes the organising principle of American diplomacy. Governments that welcome US leadership receive aid, while those that resist face isolation and growing pressure."
 USA_Continental_Service:0 "Continental Service"
 USA_Continental_Service_desc:0 "National service expands the pool of trained personnel available for military and industrial mobilisation. The policy makes the armed state stronger but places new obligations on every household."
 USA_An_Arsenal_for_Order:0 "An Arsenal for Order"
 USA_An_Arsenal_for_Order_desc:0 "Factories receive contracts for weapons, vehicles and air defence systems needed to police the hemisphere. The armaments sector expands rapidly, drawing resources away from civilian production."
 USA_Forward_Defense_Network:0 "The Forward Defence Network"
 USA_Forward_Defense_Network_desc:0 "Coastal commands, forward depots and regional planning staffs are integrated into one continental defence system. The military gains reach and readiness, while neighbouring states watch the buildup warily."
 USA_Fortress_Hemisphere:0 "Fortress of the Americas"
 USA_Fortress_Hemisphere_desc:0 "The junta declares the hemisphere a security perimeter and prepares to enforce that claim by force. The armed forces gain manpower and equipment, but the doctrine risks turning every regional crisis into a confrontation."
 USA_Economic_Sphere:0 "The Economic Sphere"
 USA_Economic_Sphere_desc:0 "Trade and investment are redirected toward governments that accept American security leadership. Washington intends to make the region economically dependent on the covenant as well as militarily aligned."
 USA_Corporate_Aid:0 "Corporate Aid Missions"
 USA_Corporate_Aid_desc:0 "Private firms receive state-backed contracts to build infrastructure and extract resources in partner countries. The projects improve local stability but give American corporations lasting leverage."
 USA_Resource_Independence:0 "Resource Independence"
 USA_Resource_Independence_desc:0 "The government stockpiles strategic materials and expands domestic production to reduce reliance on overseas suppliers. The policy strengthens the war economy and deepens the security state's control."
 USA_The_Americas_Covenant:0 "The Americas Covenant"
 USA_The_Americas_Covenant_desc:0 "The United States proclaims a permanent Christian-national order in the hemisphere. Its partners receive arms and investment; its neighbours must decide whether the covenant is protection or submission."
 USA_theocratic_public_life:0 "Theocratic Public Life"
 USA_theocratic_public_life_desc:0 "Religious observance is woven into public policy and national ceremonies. The regime gains cohesion among its supporters while restricting pluralism and independent thought."
 USA_corporatist_charters:0 "Corporatist Charters"
 USA_corporatist_charters_desc:0 "Government-approved firms and labour bodies coordinate production under military direction. Output rises, but workers and smaller businesses lose independence."
 USA_corporatist_reconstruction:0 "Corporatist Reconstruction"
 USA_corporatist_reconstruction_desc:0 "The state directs rebuilding through a compact of military planners and approved corporations."
 USA_forward_defense_network:0 "Forward Defence Network"
 USA_forward_defense_network_desc:0 "Regional bases and command structures allow the armed forces to mobilise rapidly across the hemisphere."
 USA_fortress_hemisphere:0 "Fortress Hemisphere"
 USA_fortress_hemisphere_desc:0 "The government prepares to enforce its claims over the Americas with a larger, more capable military."
 USA_hemispheric_economy:0 "Hemispheric Economic Sphere"
 USA_hemispheric_economy_desc:0 "Investment, trade and strategic production are channelled toward states aligned with the American security order."
 USA_events.109.t:0 "A New National Covenant"
 USA_events.109.d:0 "The military government has announced a sweeping program of religious nationalism, corporatist planning and political consolidation. It promises unity after civil war. Opponents warn that the new covenant leaves little room for those who reject the junta's definition of the nation."
 USA_events.109.a:0 "The next chapter begins"
 USA_events.110.t:0 "Washington Claims a Christian Mission"
 USA_events.110.d:0 "The junta declares that its hemispheric security policy will be guided by Christian-national principles. The announcement combines calls for moral renewal with a promise to arm governments aligned with Washington, unsettling capitals across the Americas."
 USA_events.110.a:0 "The covenant reaches beyond our borders"
 USA_events.111.t:0 "The One-Party Charter"
 USA_events.111.d:0 "The regime has formalised the nationalist movement as the sole legal party and barred socialist and liberal organisations from public life. The administration calls this unity after civil war. Foreign observers describe it as the end of political pluralism in the United States."
 USA_events.111.a:0 "The state permits no rival centre of power"
 USA_events.112.t:0 "The Americas Covenant"
 USA_events.112.d:0 "Washington has combined military aid, corporate investment and political pressure into a regional system under American direction. Governments in Mexico and Brazil receive new arms and contracts. Across the hemisphere, leaders debate whether the covenant is an alliance or an empire in all but name."
 USA_events.112.a:0 "The hemisphere is bound together"
 USA_Civic_Reconstruction_Charter:0 "The Civic Reconstruction Charter"
 USA_Civic_Reconstruction_Charter_desc:0 "The civilian cabinet publishes a charter for recovery: restore accountable government, rebuild communities devastated by war and decide how much justice can be pursued without reopening the country's wounds."
 USA_Reopen_Congress:0 "Reopen Congress"
 USA_Reopen_Congress_desc:0 "Congress reconvenes under civilian protection and begins reviewing the emergency decrees that accumulated during the coup. Legislators are divided, but public debate returns to the centre of national life."
 USA_Civilian_Control_of_the_Armed_Forces:0 "Civilian Control of the Armed Forces"
 USA_Civilian_Control_of_the_Armed_Forces_desc:0 "The armed forces return to a professional chain of command answerable to elected officials. The reform is carefully negotiated with the officer corps to avoid another confrontation."
 USA_A_New_Constitutional_Convention:0 "A New Constitutional Convention"
 USA_A_New_Constitutional_Convention_desc:0 "Delegates debate stronger limits on emergency powers, civilian oversight and protections for political opposition. The compromise is imperfect, but it gives the recovery a legal foundation."
 USA_Return_to_the_Ballot:0 "Return to the Ballot"
 USA_Return_to_the_Ballot_desc:0 "The transitional government sets an election timetable and restores competitive civilian politics. The first vote will be contentious, but the right to replace the government is once again recognised."
 USA_Repair_the_Heartland:0 "Repair the Heartland"
 USA_Repair_the_Heartland_desc:0 "Federal recovery teams assess damaged railways, power stations and workshops, directing materials first to the communities most affected by the fighting."
 USA_Public_Works_Corps:0 "Public Works Corps"
 USA_Public_Works_Corps_desc:0 "A national employment program rebuilds roads, bridges and public utilities while bringing demobilised soldiers into civilian work."
 USA_Labor_and_Industry_Compact:0 "Labour and Industry Compact"
 USA_Labor_and_Industry_Compact_desc:0 "Unions, employers and federal planners negotiate wage protections and a timetable for reopening factories. The agreement slows confrontation and gives workers a stake in the recovery."
 USA_The_Recovery_Dividend:0 "The Recovery Dividend"
 USA_The_Recovery_Dividend_desc:0 "As production returns, the cabinet directs a share of the recovery toward public services and household purchasing power rather than emergency procurement alone."
 USA_Truth_and_Accountability:0 "Truth and Accountability"
 USA_Truth_and_Accountability_desc:0 "A civilian commission gathers testimony about the coup, the civil war and abuses committed by all sides. Its hearings risk exposing painful divisions, but silence would leave the causes of the conflict untouched."
 USA_Amnesty_and_Due_Process:0 "Amnesty and Due Process"
 USA_Amnesty_and_Due_Process_desc:0 "The cabinet must choose between open hearings that hold senior figures publicly accountable, or conditional amnesty intended to prevent retaliatory prosecutions. Each approach carries political costs."
 USA_Restore_Civil_Liberties:0 "Restore Civil Liberties"
 USA_Restore_Civil_Liberties_desc:0 "Restrictions on the press, assembly and political organisation are repealed. The government accepts criticism as the price of proving that civilian rule is more than a new name for the old emergency."
 USA_Rejoin_the_Democratic_World:0 "Rejoin the Democratic World"
 USA_Rejoin_the_Democratic_World_desc:0 "Washington renews ties with governments that withheld recognition during military rule and commits to transparent diplomacy. The United States seeks trust through consistent civilian institutions rather than promises alone."
 USA_civilian_charter:0 "Civic Reconstruction Charter"
 USA_civilian_charter_desc:0 "A transitional civilian cabinet has begun rebuilding accountable government and national stability."
 USA_civilian_legislature:0 "Reopened Legislature"
 USA_civilian_legislature_desc:0 "Congress has resumed public debate and begun rolling back the emergency decrees."
 USA_civilian_command:0 "Civilian Command"
 USA_civilian_command_desc:0 "The armed forces are returning to a professional command structure under civilian oversight."
 USA_constitutional_reform:0 "Constitutional Reform"
 USA_constitutional_reform_desc:0 "New constitutional limits are being negotiated to prevent another concentration of emergency power."
 USA_constitutional_republic:0 "Constitutional Republic"
 USA_constitutional_republic_desc:0 "Competitive elections and constitutional limits have replaced military rule."
 USA_reconstruction_corps:0 "Reconstruction Corps"
 USA_reconstruction_corps_desc:0 "Federal teams coordinate the repair of infrastructure and communities damaged by civil war."
 USA_public_works_program:0 "Public Works Program"
 USA_public_works_program_desc:0 "Public employment is rebuilding transport links, utilities and civic infrastructure."
 USA_labor_industry_compact:0 "Labour-Industry Compact"
 USA_labor_industry_compact_desc:0 "Workers, employers and government have agreed on a framework for industrial recovery."
 USA_recovery_dividend:0 "Recovery Dividend"
 USA_recovery_dividend_desc:0 "The recovery is restoring production while directing more resources toward civilian needs."
 USA_truth_commission:0 "Truth Commission"
 USA_truth_commission_desc:0 "Public testimony is establishing a record of the coup and civil war so abuses can be addressed through legal institutions."
 USA_civil_liberties:0 "Restored Civil Liberties"
 USA_civil_liberties_desc:0 "Press, assembly and political organisation are protected again under civilian law."
 USA_democratic_reintegration:0 "Democratic Reintegration"
 USA_democratic_reintegration_desc:0 "The United States is rebuilding international trust through transparent diplomacy and civilian government."
 USA_events.113.t:0 "The Civilian Reconstruction Charter"
 USA_events.113.d:0 "The new cabinet has set out a three-part program: restore constitutional government, rebuild the communities scarred by the civil war and establish a public account of the coup. The ministers agree on the destination but not on how quickly the country can get there."
 USA_events.113.a:0 "Reconstruction must begin with trust"
 USA_events.114.t:0 "Justice or Reconciliation?"
 USA_events.114.d:0 "The truth commission's first findings implicate officers and civilian officials on both sides of the conflict. Some cabinet members demand public hearings and individual accountability; others warn that prosecutions could provoke another crisis and favour conditional amnesty."
 USA_events.114.a:0 "Hold open hearings under ordinary courts"
 USA_events.114.b:0 "Offer conditional amnesty to prevent reprisals"
 USA_events.115.t:0 "The Ballot Returns"
 USA_events.115.d:0 "The transitional cabinet has announced an election timetable and restored legal protections for competitive civilian politics. Parties are already organising rallies, and the armed forces have pledged to remain outside the campaign."
 USA_events.115.a:0 "Let the voters decide"
 USA_events.116.t:0 "Washington Seeks Democratic Reintegration"
 USA_events.116.d:0 "The United States has renewed diplomatic ties and committed to civilian oversight, public accountability and transparent negotiations. Foreign governments remain cautious, but the new cabinet has begun to replace emergency rule with institutions that can be scrutinised."
 USA_events.116.a:0 "Trust must be earned"
 USA_events.117.t:0 "A Civilian Government Takes Shape"
 USA_events.117.d:0 "The civilian recovery cabinet has presented its opening charter to Congress, promising a return to constitutional government, postwar investment and a legal reckoning with the civil war. The new administration inherits a country exhausted by conflict and divided over what justice should mean."
 USA_events.117.a:0 "The work of rebuilding begins"
 USA_events.118.t:0 "The United States Returns to Elections"
 USA_events.118.d:0 "The transitional cabinet has restored competitive elections and constitutional limits on executive power. Campaigns begin across the country as the military formally steps back from government."
 USA_events.118.a:0 "A republic renewed"
 USA_Revolutionary_Reconstruction_Programme:0 "The 2026 People's Programme"
 USA_Revolutionary_Reconstruction_Programme_desc:0 "Turner's remade party is convinced that the old coup network survives in private platforms, data centres and corporate finance. Its answer is a radical digital-socialist programme: take strategic infrastructure into public ownership, give workers a voice in automated industries and build a security system capable of seeing threats before they organise."
 USA_Public_Banking:0 "The People's Digital Bank"
 USA_Public_Banking_desc:0 "A public payment and credit network brings banking infrastructure under democratic control. Low-cost digital accounts route investment toward housing, clean power and strategic technology instead of speculative finance."
 USA_Nationalise_Heavy_Industry:0 "Nationalise the Cloud and Chip Foundries"
 USA_Nationalise_Heavy_Industry_desc:0 "The government brings major cloud platforms, semiconductor fabrication and critical data infrastructure into public ownership. The transition is disruptive, but planners gain direct access to the computing capacity needed for the new economy."
 USA_The_Five_Year_Plan:0 "Real-Time Industrial Planning"
 USA_The_Five_Year_Plan_desc:0 "A national dashboard combines supply-chain data, factory output and energy demand to revise production targets continuously. The system can react faster than a paper plan, though its priorities remain set by the party."
 USA_A_Planned_Economy:0 "The Algorithmic Plan"
 USA_A_Planned_Economy_desc:0 "Public data infrastructure coordinates investment, automated production and grid capacity across the country. The plan is faster and more responsive than its predecessors, but consumer choice is increasingly subordinate to central targets."
 USA_Workers_Councils:0 "Worker-Owned Platforms"
 USA_Workers_Councils_desc:0 "Platform workers, warehouse crews and public-sector staff elect councils through secure digital ballots. The councils negotiate algorithms, schedules and safety standards instead of leaving those decisions to private executives."
 USA_Guaranteed_Employment:0 "An Automation Dividend"
 USA_Guaranteed_Employment_desc:0 "Public retraining and a jobs guarantee move workers displaced by automation into grid upgrades, care work and advanced manufacturing. Productivity gains are used to expand the workforce rather than discard it."
 USA_Universal_Public_Provision:0 "Universal Digital Services"
 USA_Universal_Public_Provision_desc:0 "A public digital identity links healthcare access, housing applications and benefit payments through one privacy-protected service. Universal access becomes easier to deliver, while the government assumes responsibility for safeguarding enormous quantities of personal data."
 USA_The_Workers_Republic:0 "The Connected Workers' Republic"
 USA_The_Workers_Republic_desc:0 "Public platforms, worker councils and universal services become permanent institutions. The revolution presents itself as a modern social contract: technology is owned collectively and its gains are shared."
 USA_Counterplot_Investigations:0 "Map the Coup Networks"
 USA_Counterplot_Investigations_desc:0 "Investigators trace shell companies, encrypted channels and financial transfers linked to the old coup. The network analysis can expose real threats, but the paranoid party is tempted to treat ordinary dissent as another hidden plot."
 USA_The_Party_Security_Bureau:0 "The Cybersecurity and Signals Bureau"
 USA_The_Party_Security_Bureau_desc:0 "A new bureau monitors hostile cyber operations and protects public infrastructure. Its access to communications metadata makes it capable of disrupting plots—and of watching nearly everyone."
 USA_Centralise_the_Revolution:0 "One Socialist Platform"
 USA_Centralise_the_Revolution_desc:0 "Party branches move to a unified digital system for membership, debate and policy votes. Leaders promise faster participation; internal critics warn that the same platform lets the centre rank, filter and silence opposition."
 USA_The_Vanguard_State:0 "The Algorithmic Vanguard"
 USA_The_Vanguard_State_desc:0 "Predictive security systems, central party coordination and the public data network are fused into a permanent governing architecture. It is efficient, technologically advanced and increasingly difficult to challenge."
 USA_revolutionary_reconstruction:0 "The 2026 People's Programme"
 USA_revolutionary_reconstruction_desc:0 "Digital infrastructure, public ownership and a modern socialist reconstruction agenda guide the post-coup government."
 USA_public_banking:0 "People's Digital Bank"
 USA_public_banking_desc:0 "Public payments and credit infrastructure direct investment toward social and strategic priorities."
 USA_public_ownership:0 "Public Cloud and Chip Foundries"
 USA_public_ownership_desc:0 "Public ownership of cloud platforms and semiconductor capacity gives the state direct control of critical computing resources."
 USA_five_year_plan:0 "Real-Time Industrial Planning"
 USA_five_year_plan_desc:0 "Live supply-chain, factory and energy data inform continuously updated production targets."
 USA_planned_economy:0 "Algorithmic Plan"
 USA_planned_economy_desc:0 "Public data infrastructure coordinates investment, automation and industrial production at national scale."
 USA_workers_councils:0 "Worker-Owned Platforms"
 USA_workers_councils_desc:0 "Digital worker councils negotiate algorithms, schedules and safety standards."
 USA_guaranteed_employment:0 "Automation Dividend"
 USA_guaranteed_employment_desc:0 "Retraining and public jobs redirect workers displaced by automation into new industries."
 USA_universal_provision:0 "Universal Digital Services"
 USA_universal_provision_desc:0 "A privacy-protected public platform delivers healthcare, housing and benefits."
 USA_workers_republic:0 "Connected Workers' Republic"
 USA_workers_republic_desc:0 "Public technology and worker institutions make the gains of automation a collective resource."
 USA_counterplot_investigations:0 "Digital Counterplot Analysis"
 USA_counterplot_investigations_desc:0 "Network analysis tracks coup financing and hostile cyber activity, with a risk of treating dissent as a threat."
 USA_party_security_bureau:0 "Cybersecurity and Signals Bureau"
 USA_party_security_bureau_desc:0 "The bureau defends public infrastructure while gaining sweeping access to communications data."
 USA_revolutionary_discipline:0 "Unified Party Platform"
 USA_revolutionary_discipline_desc:0 "A central digital system coordinates party activity but also makes internal dissent easier to monitor and suppress."
 USA_vanguard_state:0 "Algorithmic Vanguard State"
 USA_vanguard_state_desc:0 "Predictive security, public data systems and central party control make the state efficient and difficult to challenge."
 USA_events.120.t:0 "The 2026 People's Programme"
 USA_events.120.d:0 "Nina Turner's government has announced a plan to bring cloud platforms, payment networks and semiconductor capacity under public control. Worker councils will negotiate how automation is deployed, while a new cyber bureau will track networks suspected of plotting another coup. The party calls this a modern defence of the revolution. Critics ask who will watch the watchers."
 USA_events.120.a:0 "Public technology for a socialist future"
 USA_events.121.t:0 "The Algorithmic Plan Goes Live"
 USA_events.121.d:0 "A national industrial platform now links factory output, logistics, energy demand and public investment. Planners say the system can redirect production in hours rather than months. Its critics warn that the same data architecture places economic life under unprecedented central control."
 USA_events.121.a:0 "Plan with the data, produce for the people"
 USA_events.122.t:0 "The Algorithmic Vanguard"
 USA_events.122.d:0 "The ruling party has connected membership, internal communications and security analysis to a single digital platform. It promises faster participation and protection against another coup. Its critics see a party able to monitor every conversation and define dissent as a security threat."
 USA_events.122.a:0 "The revolution will be defended in every network"
l_english:

 USA_Nat_Department_of_War:0 "Restore the Department of War"
 USA_Nat_Department_of_War_desc:0 "Hegseth's first order as head of the Directorate is a change of letterhead. The old name, retired for sounding too soft, returns on every building, badge and press release, and the civilian bureaus that once checked the generals are folded into the headquarters at Arlington. The message to the services is blunt: the country is at war, and the Department exists to win it."
 USA_Nat_Warrior_Ethos_Directive:0 "The Warrior Ethos Directive"
 USA_Nat_Warrior_Ethos_Directive_desc:0 "A new directive redefines fitness for command around lethality, discipline and loyalty to the Directorate. Officers who objected to the coup or ask for written orders are removed within hours, and promotion boards ask more questions about politics than about readiness. The ranks that remain are leaner, harder and quieter."
 USA_Nat_Drone_Autonomy_Command:0 "Autonomous Systems Command"
 USA_Nat_Drone_Autonomy_Command_desc:0 "A new command consolidates drone swarms, loitering munitions and AI targeting software under one general with a contractor's budget. Young engineers drawn from the defence-tech sector wear uniforms for the first time. The next war, the Directorate's planners say, will be won by whoever sees and strikes first."
 USA_Nat_Chairmans_Office:0 "The Chairman's Office"
 USA_Nat_Chairmans_Office_desc:0 "Hegseth gathers the Directorate's levers into a single office staffed by loyalists and answerable to no committee. Orders now travel in hours instead of weeks, and rivals discover that proximity to the Chairman is the only rank that matters. Efficiency rises; so does the cost of disagreeing."
 USA_Nat_Generals_Council:0 "The Generals' Council"
 USA_Nat_Generals_Council_desc:0 "Hegseth bows to the senior commanders and accepts a standing council that votes on every major decision. The arrangement is slower and more cautious, but it ties the army's prestige to the regime's survival. Hegseth remains the public face, and the generals quietly remain the government."
 USA_Nat_Cult_of_the_Chairman:0 "The Cult of the Chairman"
 USA_Nat_Cult_of_the_Chairman_desc:0 "Portraits appear in post offices and school corridors, and patriotic influencers compete to praise the Chairman's discipline and sacrifice. Official biographies turn a television veteran into a national saviour. The regime gains the affection of the faithful and loses the ability to hear bad news."
 USA_Nat_Collective_Directorate:0 "The Collective Directorate"
 USA_Nat_Collective_Directorate_desc:0 "A rotating council of service chiefs, intelligence heads and industrial representatives governs through published communiques and carefully minuted votes. It lacks the Chairman's glamour but not his reach. The regime looks less like a cult and more like a boardroom with tanks."
 USA_Nat_Information_Integrity_Authority:0 "The Information Integrity Authority"
 USA_Nat_Information_Integrity_Authority_desc:0 "A new agency licenses platforms, orders takedowns and certifies which accounts may speak on matters of national security. Officials call it a defence against foreign deepfakes and coup propaganda. Anyone who has watched it work calls it the ministry of what may be said."
 USA_Nat_Patriot_Media_Network:0 "The Patriot Media Network"
 USA_Nat_Patriot_Media_Network_desc:0 "Regime-aligned broadcasters, podcasters and short-video creators receive access, funding and protection under a unified brand. The old networks that refuse to comply lose their licences or their advertisers. The country's screens begin to agree with one another."
 USA_Nat_Campus_Order:0 "Order on the Campuses"
 USA_Nat_Campus_Order_desc:0 "Universities that depend on federal grants must adopt loyalty oaths, ban organised opposition and submit curricula for review. Faculty resign by the hundred, and research budgets are redirected toward weapons and energy. The campuses grow quiet, and the laboratories grow thin."
 USA_Nat_Sentinel_Data_Grid:0 "The Sentinel Data Grid"
 USA_Nat_Sentinel_Data_Grid_desc:0 "Licence-plate readers, facial recognition, payment records and location data from private brokers are fused into a single platform that scores citizens for risk. Analysts promise it will stop the next coup before it organises. It will also remember every protest anyone ever attended."
 USA_Nat_Border_Security_Corps:0 "The Border Security Corps"
 USA_Nat_Border_Security_Corps_desc:0 "A new armed service patrols the borders with sensor towers, drones and detention camps, and begins mass removals of anyone the Directorate classes as a threat. Supporters call it long-overdue order. The farmers, churches and employers who depended on the people being removed say very little, and say it quietly."
 USA_Nat_Managed_Plebiscite:0 "The Managed Plebiscite"
 USA_Nat_Managed_Plebiscite_desc:0 "The Directorate schedules a national vote to ratify the new order. Opposition parties are banned, observers are accredited by the government, and the ballot asks a single question. The result is announced before the polls close, and the regime calls it a mandate."
 USA_Nat_Permanent_Emergency:0 "The Permanent Emergency"
 USA_Nat_Permanent_Emergency_desc:0 "Rather than stage an election, the Directorate renews the state of emergency indefinitely. Mobilisation, censorship and curfews become the ordinary conditions of national life, justified by an enemy that is always about to appear. The country is safe, supervised and permanently on alert."
 USA_Nat_Defence_Tech_Partnerships:0 "Defence-Tech Partnerships"
 USA_Nat_Defence_Tech_Partnerships_desc:0 "A circle of venture-backed defence firms receives exclusive contracts for drones, satellites and battlefield AI, and their founders take seats on advisory boards. Prototypes reach units in months rather than years. So do the invoices."
 USA_Nat_Energy_Dominance:0 "Energy Dominance"
 USA_Nat_Energy_Dominance_desc:0 "Federal land is opened to drilling, pipeline approvals are fast-tracked and liquefied natural gas terminals multiply along the Gulf. Cheap fuel feeds the arsenal and wins loyalty in the oil states. The programme ignores the climate, the Directorate does not much care, and the bills arrive in other decades."
 USA_Nat_The_New_American_Order:0 "The New American Order"
 USA_Nat_The_New_American_Order_desc:0 "The Directorate declares the civil war over and the republic restored on a new foundation of faith, discipline and command. Hegseth reviews the troops before a crowd of loyalists and cameras. Whether history records it as a restoration or a funeral depends on who writes it, and the regime has taken care to be the one writing."
 USA_Nat_Northern_Alliance:0 "The Northern Alliance"
 USA_Nat_Northern_Alliance_desc:0 "Conrad Black's government in Ottawa, uneasy under Turner's America, receives the treaty it has wanted for years: a guarantee of its borders and its regime. Joint patrols, shared intelligence and a common list of enemies bind the two governments. Two oligarchies and two militaries now watch the same horizon."
 USA_Nat_Southern_Alliance:0 "The Southern Alliance"
 USA_Nat_Southern_Alliance_desc:0 "The junta in Buenos Aires, isolated since 2003, finds a patron at last. American advisers arrive with security guarantees and open credit lines, and Argentine strikers find that the army now has Washington behind it. Washington calls it a partnership. The strikers call it something else."
 USA_Nat_Partners_Not_Satellites:0 "Partners, Not Satellites"
 USA_Nat_Partners_Not_Satellites_desc:0 "The Directorate chooses patience: arms, investment and political cover for governments that accept American leadership, and none of the garrisons that made earlier interventions so hated. Mexico City and Brasilia are courted rather than commanded. It is cheaper than force, and slower to deliver what Washington wants."
 USA_Nat_Enforce_the_Order:0 "Enforce the Order"
 USA_Nat_Enforce_the_Order_desc:0 "The Directorate decides that partnership is only another word for hesitation. Ultimatums go to Mexico City and Brasilia, naval squadrons leave port and the press is told that no hostile ideology will be allowed to take root in the hemisphere. The region learns what the Covenant means when its terms are refused."
 USA_Nat_Golden_Dome:0 "The Golden Dome"
 USA_Nat_Golden_Dome_desc:0 "A layered missile-defence shield, with sensors in orbit and interceptors on land and sea, is promised to cover the entire hemisphere. Contractors celebrate, allies are asked to host batteries, and rivals are told that no strike will succeed. Whether it works is a question for a day nobody wants to see."
 USA_Nat_Canal_and_Arctic:0 "The Canal and the Arctic"
 USA_Nat_Canal_and_Arctic_desc:0 "Naval and air units are posted to the Panama Canal, the Aleutians and a chain of new northern bases, with the Arctic passages treated as the front line of a hemispheric perimeter. Neighbours who hosted American forces willingly and those who did not are reminded which side of the line they sit on."
 USA_Nat_Blue_Water_Shield:0 "The Blue Water Shield"
 USA_Nat_Blue_Water_Shield_desc:0 "Shipyards on both coasts receive long-term orders for escorts, submarines and unmanned vessels to guard the hemisphere's sea lanes. Convoy plans that once seemed fantastical become routine staff work. The navy, long the quiet service, finds itself at the centre of the strategy."
 USA_Nat_Dollar_Zone:0 "The Dollar Zone"
 USA_Nat_Dollar_Zone_desc:0 "Washington offers cheap credit, tariff relief and swap lines to governments that agree to settle trade in dollars and refuse rival financing. Banks in Mexico City and Buenos Aires rewrite their contracts. Those who decline discover how many of their supply chains pass through American ports."
 USA_Nat_Lithium_and_Energy_Compact:0 "The Lithium and Energy Compact"
 USA_Nat_Lithium_and_Energy_Compact_desc:0 "Treaties lock in American access to the hemisphere's lithium, copper and oil. Mines reopen across Chile and Bolivia under joint security forces, and the contracts favour American buyers on every line. The local profit is real, and so is the dependence."
 USA_Nat_Pax_Americana:0 "Pax Americana Restored"
 USA_Nat_Pax_Americana_desc:0 "The Directorate proclaims an American peace across the hemisphere: allied governments armed, neighbours disciplined, rivals shut out and the sea lanes patrolled. It is a peace of arms, bases and contracts, and it lasts while the arms hold. Hegseth calls it the end of the long decline. The neighbours call it the new empire."

 USA_nat_family_compact:0 "The Family Compact"
 USA_nat_family_compact_desc:0 "Benefits and civic access are tied to public conformity with the regime's family and faith programmes."
 USA_nat_labour_under_flag:0 "Labour Under the Flag"
 USA_nat_labour_under_flag_desc:0 "Independent unions are folded into national labour bodies, trading strikes for state-managed wages."
 USA_nat_hemispheric_order:0 "Hemispheric Order"
 USA_nat_hemispheric_order_desc:0 "Aid and recognition flow to governments that endorse Washington's leadership of the Americas."
 USA_nat_resource_independence:0 "Resource Independence"
 USA_nat_resource_independence_desc:0 "Strategic stockpiles and domestic extraction harden the war economy against foreign supply shocks."
 USA_nat_covenant_enforced:0 "The Covenant Enforced"
 USA_nat_covenant_enforced_desc:0 "The hemispheric covenant is backed by force, and neighbours know it."
 USA_nat_department_of_war:0 "The Department of War"
 USA_nat_department_of_war_desc:0 "The civilian defence bureaucracy is merged into a single wartime headquarters."
 USA_nat_warrior_ethos:0 "The Warrior Ethos"
 USA_nat_warrior_ethos_desc:0 "Promotion rewards lethality and loyalty to the Directorate over seniority and independence."
 USA_nat_autonomy_command:0 "Autonomous Systems Command"
 USA_nat_autonomy_command_desc:0 "Drone swarms, loitering munitions and AI targeting are consolidated under one command."
 USA_nat_chairmans_office:0 "The Chairman's Office"
 USA_nat_chairmans_office_desc:0 "Power is concentrated in a single personal office that answers to no committee."
 USA_nat_generals_council:0 "The Generals' Council"
 USA_nat_generals_council_desc:0 "Senior commanders share rule through a standing council, trading speed for institutional stability."
 USA_nat_cult_of_the_chairman:0 "Cult of the Chairman"
 USA_nat_cult_of_the_chairman_desc:0 "Official propaganda presents the Chairman as the nation's saviour, with little room for bad news."
 USA_nat_collective_directorate:0 "The Collective Directorate"
 USA_nat_collective_directorate_desc:0 "A rotating council of service chiefs and industrial representatives governs through minuted votes."
 USA_nat_information_authority:0 "Information Integrity Authority"
 USA_nat_information_authority_desc:0 "A federal agency licenses platforms and orders takedowns in the name of national security."
 USA_nat_patriot_media:0 "Patriot Media Network"
 USA_nat_patriot_media_desc:0 "Regime-aligned broadcasters and creators dominate the national conversation."
 USA_nat_campus_order:0 "Order on the Campuses"
 USA_nat_campus_order_desc:0 "Loyalty oaths and funding conditions have quieted universities and thinned their laboratories."
 USA_nat_sentinel_grid:0 "The Sentinel Data Grid"
 USA_nat_sentinel_grid_desc:0 "Fused surveillance data scores citizens for risk and anticipates organised opposition."
 USA_nat_border_corps:0 "Border Security Corps"
 USA_nat_border_corps_desc:0 "An armed border service with sensor towers, drones and detention facilities enforces mass removals."
 USA_nat_permanent_emergency:0 "The Permanent Emergency"
 USA_nat_permanent_emergency_desc:0 "Mobilisation, curfews and censorship have become the ordinary conditions of national life."
 USA_nat_defence_tech:0 "Defence-Tech Partnerships"
 USA_nat_defence_tech_desc:0 "A circle of defence-technology firms delivers prototypes quickly and at a premium."
 USA_nat_energy_dominance:0 "Energy Dominance"
 USA_nat_energy_dominance_desc:0 "Drilling, pipelines and gas export terminals fuel the arsenal and ignore the climate."
 USA_nat_new_american_order:0 "The New American Order"
 USA_nat_new_american_order_desc:0 "The civil war is declared over and the republic restored on a foundation of faith, discipline and command."
 USA_nat_northern_alliance:0 "The Northern Alliance"
 USA_nat_northern_alliance_desc:0 "A treaty with Ottawa binds the two governments' borders, intelligence services and enemies."
 USA_nat_southern_alliance:0 "The Southern Alliance"
 USA_nat_southern_alliance_desc:0 "American backing props up the junta in Buenos Aires and gives Washington a regional ally."
 USA_nat_golden_dome:0 "The Golden Dome"
 USA_nat_golden_dome_desc:0 "A layered missile-defence shield is being built to cover the hemisphere."
 USA_nat_canal_arctic:0 "The Canal and the Arctic"
 USA_nat_canal_arctic_desc:0 "Garrisons at the canal, the Aleutians and the northern passages extend the defensive perimeter."
 USA_nat_blue_water_shield:0 "The Blue Water Shield"
 USA_nat_blue_water_shield_desc:0 "Long-term shipbuilding orders guard the hemisphere's sea lanes with escorts, submarines and unmanned vessels."
 USA_nat_dollar_zone:0 "The Dollar Zone"
 USA_nat_dollar_zone_desc:0 "Credit and tariff relief reward governments that settle trade in dollars."
 USA_nat_lithium_compact:0 "Lithium and Energy Compact"
 USA_nat_lithium_compact_desc:0 "Treaties secure American access to the hemisphere's lithium, copper and oil."
 USA_nat_pax_americana:0 "Pax Americana"
 USA_nat_pax_americana_desc:0 "An armed American peace covers the hemisphere, kept by bases, contracts and credit."

 USA_nat_events.1.t:0 "The Department of War"
 USA_nat_events.1.d:0 "The sign above the Pentagon's main entrance is replaced at dawn, and by mid-morning the change has been announced on every channel. Hegseth, standing in front of the new letters, says the country has spent decades pretending that war was a policy option instead of a condition. A retired colonel watching from the plaza tells a reporter that the name is the easy part."
 USA_nat_events.1.a:0 "The Department stands ready"
 USA_nat_events.2.t:0 "The Warrior Ethos"
 USA_nat_events.2.d:0 "The directive's first week produces forty-one relieved generals and a quiet exodus of colonels who can see which way promotion now runs. The reform wing of the Directorate argues that purging experienced officers in a civil war's aftermath is reckless. Hegseth's circle argues that experience is exactly what failed during the first coup attempt."
 USA_nat_events.2.a:0 "Relieve every officer who objected"
 USA_nat_events.2.b:0 "Retire them with full pensions"
 USA_nat_events.3.t:0 "The Plebiscite"
 USA_nat_events.3.d:0 "The ministry announces turnout at ninety-four percent and approval at ninety-eight. Foreign observers, invited late and seated far from the counting halls, are not asked for comment. Hegseth thanks the nation for its trust. Somewhere, a clerk keeps a second set of figures in a drawer."
 USA_nat_events.3.a:0 "A mandate, unanimous and complete"
 USA_nat_events.4.t:0 "Takedown Orders"
 USA_nat_events.4.d:0 "On its first day the Authority issues six thousand takedown orders covering news sites, opposition channels and a satirist's account with four million followers. Two platforms comply within the hour, one refuses and loses its licence, and a small number of users learn how to route around the blocks. The Authority's director wants to know whether to escalate."
 USA_nat_events.4.a:0 "Escalate: seize the servers"
 USA_nat_events.4.b:0 "Let compliance do the work"
 USA_nat_events.5.t:0 "The Buenos Aires Embrace"
 USA_nat_events.5.d:0 "The first American advisers land at Ezeiza to a guard of honour and a crowd of exactly the right size. The junta's chairman embraces Hegseth's envoy on the tarmac for the photographers. In the industrial belt outside the city, a strike committee reads the news and understands that the army no longer needs to be careful."
 USA_nat_events.5.a:0 "A partnership of the faithful"
 USA_nat_events.6.t:0 "The Terms Refused"
 USA_nat_events.6.d:0 "Mexico City answers the ultimatum with a three-line statement and a general mobilisation. Brasilia is slower and more careful, and its reply is leaked before it is sent. The Directorate's planners, studying satellite feeds, say the order of battle looks better on paper than it will in the field. Hegseth tells them to proceed."
 USA_nat_events.6.a:0 "The order will be enforced"
 USA_nat_events.7.t:0 "A New Order"
 USA_nat_events.7.d:0 "The ceremony lasts forty minutes and is broadcast to every screen in the country. Hegseth reviews the troops on the Mall under a sky full of aircraft, declares the civil war over and the republic restored. The crowd is large, the applause is strong, and the cameras do not linger on the empty balconies along the route."
 USA_nat_events.7.a:0 "The republic is restored"
 USA_nat_events.8.t:0 "Pax Americana"
 USA_nat_events.8.d:0 "Washington announces that the hemisphere has a new order, signed by governments that were willing, or obliged, to join it. The communique lists the treaties, the garrisons, the credit lines and the defence systems in a single paragraph. Hegseth's address runs eleven minutes. In Mexico City, Brasilia and Ottawa, officials begin reading the fine print."
 USA_nat_events.8.a:0 "The hemisphere is secured"