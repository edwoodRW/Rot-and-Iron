 SuperEventQuote911: "Terrorist attacks can shake the foundations of our biggest buildings, but they cannot touch the foundation of America.\n                     -George W. Bush"
 SuperEventQuoteIraq: "I hereby declare before you that Iraq is clear of all nuclear, chemical and biological weapons.\n           -letter from Saddam Hussein"
 SuperEventQuoteIraqWon: "Baghdad is determined to force the Mongols of our age to commit suicide at its gates.\n                 -Saddam Hussein"
 SuperEventQuoteGCCUnification: "I ask today that we move from a phase of cooperation to a phase of union within a single entity.\n          -King Abdullah bin Abdulaziz"
 SuperEventQuoteBaathUnification: "Unity, Freedom, Socialism\n               -Motto of Ba'ath Party"
 SuperEventQuoteYemenCivilWar: "The more the enemy increases its injustice, criminality the more our morale, and faith will increase to defeat them.\n         -Sayyed Abdul Malik al Houthi"
 SuperEventQuoteSyrianCivilWar: "No solution can be reached with terror except by striking it with an iron fist.\n                     -Bashar al-Assad"
 SuperEventQuoteGazaWar: "If the enemy desires a long battle, our capacity is longer than our enemy’s, and our resistance will have the decisive word in it.\n                      -Ismail Haniyeh"
 SuperEventQuoteIranIsraelWar: "The Zionist regime is slowly being erased from the world.\n                      -Hossein Salami"
 SuperEventQuoteIranArabiaWar: "It will have a lot of casualties, but we won't blink to defend our territory.\n                       -Javad Zarif"
 SuperEventQuoteAfricaUnified: "We must unite in order to achieve the full liberation of our continent.\n                       -Kwame Nkrumah"
 SuperEventQuoteLybiaCivilWar: "We will fight until the last man and last woman to defend Libya from east to west, north to south\n                      -Muammar Gaddafi"
 SuperEventQuoteNagornoWar: "to fight for the rights of our people means, first of all, to take up arms and commit to the protection of the rights of the homeland\n                      -Nikol Pashinyan" 
 SuperEventQuoteArmeniaTurkeyWar: "Erdogan’s statement proves that Turkey is still unpunished. The only difference is that in 1915 she secretly drew plans of the Armenian Genocide, while today she is doing it impudently and openly\n                      -Galust Sahakyan"
 SuperEventQuoteRussiaGeorgiaWar: "When tanks, multiple rocket launchers and heavy artillery are used against us, are we supposed to fire with sling shots?\n                      -Vladimir Putin"
 SuperEventQuotePakistanIndiaWar: "When two nuclear-armed countries fight, if they fight a conventional war, there is every possibility that it is going to end up into nuclear war.\n                      -Imran Khan"
 SuperEventQuoteChinaIndiaWar: "The era of expansionism is over, this is the era of development. It is this mindset of expansionism that did great harm.\n                      -Narendra Modi"
 SuperEventQuoteKoreanWar: "We don’t want war but we have no intention of avoiding it.  \n                      -Kim Jong Un"
 SuperEventQuoteWorldWar: "I know not with what weapons World War III will be fought, but World War IV will be fought with sticks and stones.  \n                      -Albert Einstein"
 SuperEventQuoteTuranUnification: "For the Turks, Fatherland means neither Turkey, nor Turkestan; Fatherland is a large and eternal country – Turan!  \n                       -Ziya Gökalp"
 SuperEventQuoteUSSR: "Above all, we should acknowledge that the collapse of the Soviet Union was a major geopolitical disaster of the century.  \n                      -Vladimir Putin"
 SuperEventQuoteSovietEmpire: "In principle, Eurasia and our space, the heartland Russia, remain the staging area of a new anti-bourgeois, anti-American revolution.  \n                      -Aleksandr Dugin"
 SuperEventQuoteThirdRome: "Russia has the right to stand on the side of light, on the side of God’s truth  \n           -Patriarch Kirill of Moscow"
 SuperEventQuoteWarinUkraine: "If there is no Ukrainian strong army, there will be no Ukraine… It’s not the war in Ukraine, it’s the war in Europe.  \n                  -Volodymyr Zelenskyy"  
 SuperEventQuoteNewYorkRussia: "If Russia rises, it means that the USA falls down.  \n                 -Vladimir Zhirinovsky"
 SuperEventQuoteEUFederation: "Only Europe can, in a word, guarantee genuine sovereignty or our ability to exist in today’s world to defend our values and interests.  \n                     -Emmanuel Macron"
 SuperEventQuoteUkraineRightSector: "The first word of its first article is ‘Ukraine.’ And this reflects our ultimate goal, our mission. Ukraine is – and will be – on earth. Ukrainians are – and will be – on earth.  \n                 -Volodymyr Zelenskyy"
 SuperEventQuoteWielkaLechia: "It’s important for the West to drown the Russian-Ukrainian brotherhood, our Slavic brotherhood in blood.  \n                -Alexander Lukashenko"
 SuperEventQuoteMoscowPoland: "We will do whatever it takes not to be a Russian colony again.  \n                   -Radosław Sikorski"
 SuperEventQuotePSLAssad: "Poland must create a better future for the next generations. To our children, our grandchildren we must hand over a Poland better than the one we found.  \n           -Władysław Kosiniak-Kamysz"
 SuperEventQuoteCommonwealth: "The essence of the plan to build the Fourth Republic was to change those things in the country that, in fact and in everyday life, truly shape the nature of our existence.  \n                   -Jarosław Kaczyński"
 SuperEventQuoteUkraineJihad: "The abolition of man-made laws cannot be achieved only through preaching.  \n                        -Sayyid Qutb"
 SuperEventQuoteRomaniaUnification: "We will not forget a single piece of Romanian land. No humiliation will remain irreversible.  \n                        -Ion Antonescu"
 SuperEventQuoteGreekTurkeyWar: "Greece will never accept any grey zone theory and will never accept Turkey telling it what to do or what not to do within areas of Greek sovereignty.  \n                  -Kyriakos Mitsotakis"
 SuperEventQuoteYugoslavia: "We have spilt an ocean of blood for the brotherhood and unity of our peoples and we shall not allow anyone to touch or destroy it from within.  \n                      -Josip Broz Tito"
 SuperEventQuoteKingdomYugoslavia: "The Yugoslavs are not three, nor are they two, but one people, with three names.  \n            -Alexander I of Yugoslavia"
 SuperEventQuoteCommunistEU: "Your 'order' is built on sand. Tomorrow the revolution will already rattlingly straighten itself up again and announce to your horror with the sound of the trumpet: I was, I am, I will be!.  \n                       -Rosa Luxemburg"
 SuperEventQuoteGermanyMonarchy: "Germany is a young and growing empire. She expects those interests to go on growing, and she must be able to champion them manfully in any quarter of the globe. Her horizons stretch far away.  \n                           -Wilhelm II"
 SuperEventQuoteFourthReich: "God the Almighty has made our nation. By defending its existence we are defending His work.  \n                         -Adolf Hitler"
 SuperEventQuoteNapoleon: "It requires more courage to suffer than to die.  \n                   -Napoleon Bonaparte"
 SuperEventQuoteRome: "You, Roman, remember: rule the nations with your power—this shall be your art.  \n                               -Virgil"
 SuperEventQuoteIberianUnion: "One sees that this has been the work of God, for without His will, favor and protection men could not have done so great a thing.  \n           -Jesuit about Iberian Union"