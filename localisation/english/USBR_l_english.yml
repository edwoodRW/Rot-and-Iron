l_english:

ENG_THE_LIFELINE_SNAPS:0 "The Lifeline Snaps"
 ENG_THE_LIFELINE_SNAPS_desc:0 "For nearly five years, our forces have been locked in a grueling, bloody stalemate against the Scottish separatists in the north. It was Soviet oil, Soviet munitions, and Soviet advisors that kept the regime from collapsing under the weight of this endless war. But last week, everything changed. German and Chinese forces launched a massive, coordinated invasion of the USSR, shattering their front lines in mere days. With the Soviet Union fighting for its own survival, the vital cargo ships we depend on have stopped arriving in our ports. The lifeline has snapped. As the Scots sense our sudden weakness and the domestic opposition grows bolder, the Central Council must figure out how to survive a war we are already fighting—now entirely on our own."
	ENG_RATION_NORTH_SEA_FUEL:0 "Ration North Sea Fuel"
 ENG_RATION_NORTH_SEA_FUEL_desc:0 "The sudden halt of Soviet tankers has emptied our strategic reserves. By supreme executive decree, all non-essential civilian vehicle use across England is strictly banned. Every drop of petroleum pumped from our limited North Sea operations must be rationed, prioritized, and diverted directly to our frontline armor pools and border transport networks. The public will freeze, but the army will move."
 ENG_SEIZE_THE_DOCKYARDS:0 "Seize the Dockyards"
 ENG_SEIZE_THE_DOCKYARDS_desc:0 "The dockyards of the Clyde and Tyne are the lifeblood of our war effort. They are the only places in the country capable of producing the ships and submarines we need to defend our coasts and maintain our supply lines. The dockyards are also home to a large number of workers who have been radicalized by the trade unions. The Central Council has decided to seize the dockyards and place them under direct military control. This will ensure that production continues uninterrupted, but it will also provoke a backlash from the unions and their supporters."
 ENG_MUZZLE_THE_TRADE_UNIONS:0 "Muzzle the Trade Unions"
 ENG_MUZZLE_THE_TRADE_UNIONS_desc:0 "We cannot allow internal democratic luxuries to sabotage frontline survival. The collective bargaining and strike protection laws established during the 1999 revolution are permanently suspended. Any manufacturing slowdown, strike, or labor dispute within our critical weapons complexes will be treated as high treason. The factories must run twenty-four hours a day, regardless of the workers' complaints. The Central Council will not hesitate to use the full force of the military to enforce this policy."
 ENG_THE_TWEED_DEFENSE_GRID:0 "The Tweed Defense Grid"
 ENG_THE_TWEED_DEFENSE_GRID_desc:0 "With the Scottish forces probing for gaps along our northern lines, our current trench systems are no longer enough. We must immediately expend our emergency concrete and steel reserves to construct a massive, deep-fortified defensive line along the River Tweed. If the frontline breaks, this grid will be the only thing standing between the Scottish army and Newcastle."
 ENG_EMERGENCY_CONSCRIPTION:0 "Emergency Conscription"
 ENG_EMERGENCY_CONSCRIPTION_desc:0 "The bleeding trenches of the north are consuming our manpower at an unsustainable rate. To replace our staggering casualties, enlistment windows are expanded and medical standards are drastically lowered. Factory floors will be emptied of young men, and the gap will be filled by whoever is left behind. The front lines demand bodies, and the state will provide them."
 ENG_GARRISON_THE_LOWLANDS:0 "Garrison the Lowlands"
 ENG_GARRISON_THE_LOWLANDS_desc:0 "Capturing territory from the Scots is only half the battle; holding it is the true nightmare. Local partisan insurgencies and coordinated rail sabotage are crippling our logistical supply lines behind the front. We must establish a heavy, uncompromising martial footprint across the occupied Lowlands. Curfews, checkpoints, and swift military tribunals will restore order."
 ENG_the_1999_constitution:0 "The 1999 Constitution"
 ENG_the_1999_constitution_desc:0 "The approaching 2025 General Election is a luxury this bleeding nation cannot afford. Tabling an emergency bill under the "Supreme State Emergency Protocol," the Central Council will permanently suspend the constitution and defer the vote indefinitely. While this safeguards our immediate grip on power, it pushes our internal ideological factions to an absolute breaking point."
 ENG_Winter_Of_Discontent_25:0 "Winter of Discontent '25"
 ENG_Winter_Of_Discontent_25_desc:0 "The worst winter in a generation has descended upon the British Isles, and we are utterly unprepared. Heating oil has run out completely, metropolitan hubs are paralyzed by anti-war riots, and combat fatigue has broken the spirit of our military. The state cannot sustain itself under this pressure. The cracks within the Central Council have widened into an unfillable chasm. The system is collapsing from within, and a split is completely inevitable."
 ENG_Starmer_Holds:0 "Starmer Holds"
 ENG_Starmer_Holds_desc:0 "The Central Council Split nearly shattered the party, but Keir refuses to let the 1999 revolutionary legacy disintegrate into chaos. By utilizing our deep state internal networks, mobilizing loyalist elements of the security apparatus, and enforcing strict bureaucratic discipline, the Premier has successfully stabilized the core leadership. The internal rebellion has been contained—for now. We must immediately move to solidify this victory and neutralize the remaining dissenters before they can regroup."
 ENG_IRON_CHOKEHOLD:0 "Iron Chokehold"
 ENG_IRON_CHOKEHOLD_desc:0 "True stability requires absolute control. With our faction secure at the top, we will turn England into an airtight, hyper-managed bureaucratic fortress. The legal system will be weaponized to choke out opposition before it can even form; political rivals will be buried in endless state litigation, independent local assemblies will be dissolved into central directories, and a vast surveillance network will monitor every level of society. They call it a dictatorship of the desk—we call it survival."
 ENG_Reform_Attempt:0 "Reform Attempt"
 ENG_Reform_Attempt_desc:0 "The old guard has failed. Years of rigid, authoritarian mismanagement have left England starving, bleeding on the Scottish border, and completely isolated on the world stage. Jeremy Corbyn’s socialist faction & Tony Blairs centre left faction has successfully pushed through the deadlock during the Council Split, demanding a radical return to the original democratic and humanitarian promises of the 1999 revolution. We must immediately begin dismantling the emergency police state and offer an olive branch to the people."
 ENG_BRITISH_GLASNOST:0 "British Glasnost"
 ENG_BRITISH_GLASNOST_desc:0 "It is time to open the windows and let the fresh air into British politics. Through a policy of total political transparency, we will release state political prisoners, lift decades-old censorship laws, and decentralize our collapsing war factories into independent worker co-operatives. Most critically, we will offer an immediate ceasefire to the Scots and prepare for a true, multi-party general election in 2025. If Nigel Farage and his right-wing coalition think they can win at the ballot box, let them try."
 ENG_Garrison_State:0 "Garrison State"
 ENG_Garrison_State_desc:0 "Starmer’s compromise was a half-measure, and Corbyn’s reformism is dynamic suicide. Dermot Hudson’s hardline Marxist-Leninist faction has seized the initiative following the Central Council Split. The world is actively hostile, the Soviet Union has fallen, and our island is completely surrounded by imperialist jackals. If we are to survive, the entire concept of civilian life must end. Every factory, every farm, and every citizen is now a direct cog in the state's military machinery."
 ENG_THE_NEW_PATH:0 "The New Path"
 ENG_THE_NEW_PATH:0 "We will forge a new, unyielding path of absolute autarky and total ideological mobilization. Drawing inspiration from the most uncompromising command economies in history, England will become a locked Juche-style industrial fortress. We will permanently cancel the 2025 election, completely eliminate private property, ration food down to the gram, and launch a merciless, total militarized push to utterly crush the Scottish resistance. There will be no retreat, no surrender, and no compromise with the old world."
 ENG_Military_Intervention:0 "Military Intervention"
 ENG_Military_Intervention_desc:0 "The socialist experiment has run its course, and it has brought England to the absolute brink of ruin. As the Central Council tore itself apart during the January split, General Sir Patrick Sanders activated emergency military contingency protocols. Armed forces and armored columns have rolled into London, declaring a state of national emergency. The politicians have had their chance; the military is taking the wheel to save the nation from complete self-destruction."
 ENG_SANDERS_STRATEGY:0 "Sanders Strategy"
 ENG_SANDERS_STRATEGY_desc:0 "Martial law is now the law of the land. Our strategy is pragmatic, ruthless, and entirely focused on national defense. We will completely dissolve the NBP socialist party, crush any labor strikes with military force, and pull back our overextended, bleeding frontline troops to highly defensible tactical borders. Most importantly, we will look outward: the Atlantic Quarantine must break. We will reach across the ocean to Canada and the United States, offering to purge radicalism from the British Isles completely in exchange for emergency fuel, resource shipments, and official Western recognition."
 ENG_Establish_the_Committee_of_Public_Security:0 "Establish the Committee of Public Security"
 ENG_Establish_the_Committee_of_Public_Security_desc:0 "We must focus on on expanding the secret police network into every neighborhood and factory council. The Committee of Public Security will be the eyes and ears of the state, rooting out any remaining opposition to the Central Council. We will establish a network of informants, spies, and surveillance systems to monitor every citizen's actions and thoughts. The Committee will have the authority to arrest, interrogate, and eliminate any threats to national security."
 ENG_The_Enemy_Within_the_Walls:0 "The Enemy Within the Walls"
 ENG_The_Enemy_Within_the_Walls_desc:0 "The Winter of Discontent was not a spontaneous strike; it was a coordinated, treasonous conspiracy to hand the U.S.B.R. over to our enemies. Trust no one. Check every phone line. The party must be cleansed from the top down."
 ENG_The_London_Show_Trials:0 "The London Show Trials"
 ENG_The_London_Show_Trials_desc:0 "We will drag the reformist elements out of their comfortable offices and into the light. Publicly expose their secret meetings, their hidden capitalistic tendencies, and their letters to foreign agents. Let the public see what treason looks like. Let the public see what happens to traitors. Let the public see that the Central Council will not tolerate dissent."
 ENG_Liquidate_the_Modernizers:0 "Liquidate the Modernizers"
 ENG_Liquidate_the_Modernizers_desc:0 "Tony Blair and his clique of university-educated, smooth-talking "reformers" thought they could slide the U.S.B.R. toward social democracy. Find them. Arrest them. Ensure they never speak to a camera or a crowd ever again."
 ENG_Purge_the_High_Command:0 "Purge the High Command"
 ENG_Purge_the_High_Command_desc:0 "The military hesitated during the strikes. A hesitating general is a traitor in waiting. Replace the old military elite with fanatical political commissars who answer directly to Starmer. The army must be a weapon of the state, not a collection of independent-minded officers. The old guard must be purged, and the new guard must be loyal to the Central Council above all else."
 ENG_Radio_Free_Whitehall:0 "Radio Free Whitehall"
 ENG_Radio_Free_Whitehall_desc:0 "Flood the airwaves over the Scottish Lowlands with relentless, coordinated psychological warfare. We will broadcast falsified reports of impending American betrayal, mass starvation in Edinburgh, and the "inevitable" triumph of Starmer's regime to shatter the enemy's civilian morale. The Scottish people will be forced to choose between their own survival and the lies of their leaders. We will make them beg for peace."
 ENG_The_Scottish_Pacification:0 "The Scottish Pacification"
 ENG_The_Scottish_Pacification_desc:0 "The offensive into Scotland has stalled along the Tweed, turning the northern front into a meatgrinder. Starmer refuses to admit tactical failure; instead, he blames the lack of progress on subversives sabotaging the war effort from within. If we cannot break through their lines, we will ensure our own frontlines are locked down with an iron fist. The Scottish people will be forced to choose between their own survival and the lies of their leaders. We will make them beg for peace."
 ENG_Dismantle_the_Edinburgh_Soviet:0 "Dismantle the Edinburgh Soviet"
 ENG_Dismantle_the_Edinburgh_Soviet_desc:0 "We cannot capture Edinburgh by force of arms, but we can destroy its influence. The Scottish secessionists are using "red" terminology to trick our workers. We will launch a massive espionage and propaganda offensive to delegitimise their regime, outlawing any cross-border communication and arresting anyone in England who speaks in support of the northern rebels."
 ENG_The_Highland_Re_education:0 "The Highland Re-education Centers"
 ENG_The_Highland_Re_education_desc:0 "With the front frozen, the border regions have become hotbeds for smugglers, deserters, and Scottish nationalist sympathizers passing intelligence to the enemy. We will establish specialized correction and labor camps right behind our defensive lines in the northern hills. Anyone suspected of helping the Scots or faltering in their loyalty to London will be cleared out to secure our rear. The Highland Re-education Centers will be a warning to all who would betray the U.S.B.R."
 ENG_No_Step_Backwards_in_Britain:0 "No Step Backwards in Britain"
 ENG_No_Step_Backwards_in_Britain_desc:0 "To retreat from the stalemate is to commit treason against the Republic. Political commissars are given the explicit authority to execute any commander who orders a tactical withdrawal from the Tweed line. We hold, or we die where we stand. The Scottish people will be forced to choose between their own survival and the lies of their leaders. We will make them beg for peace."
 ENG_Shells_for_the_Static_Front:0 "Shells for the Static Front"
 ENG_Shells_for_the_Static_Front_desc:0 "A static war is a war of industrial attrition. Every single factory in the Midlands must shift production away from mobile vehicles and toward heavy artillery pieces and endless stockpiles of ammunition to relentlessly pound the Scottish lines day and night."
 ENG_The_Iron_Line_on_the_Tweed:0 "The Iron Line on the Tweed"
 ENG_The_Iron_Line_on_the_Tweed_desc:0 "With the front frozen, the border regions have become hotbeds for smugglers, deserters, and Scottish nationalist sympathizers passing intelligence to the enemy. We will establish specialized correction and labor camps right behind our defensive lines in the northern hills. Anyone suspected of helping the Scots or faltering in their loyalty to London will be cleared out to secure our rear. The Highland Re-education Centers will be a warning to all who would betray the U.S.B.R."
 ENG_The_Sappers_Mandate:0 "The Sappers Mandate"
 ENG_The_Sappers_Mandate_desc:0 "Frontline infantry units are ordered to dig deeper. Underground tunnel networks, subterranean command bunkers, and hidden artillery emplacements will ensure our troops can survive any capitalist or Scottish bombardment. The Sappers Mandate will be enforced with the full weight of the state, and any soldier who fails to comply will be treated as a traitor to the Republic."
 ENG_Project_Caelus:0 "Project Caelus"	
	ENG_Project_Caelus_desc:0 "If we cannot inherit Scotland, we will ensure nobody else can profit from it. We will prepare chemical stockpiles and agricultural defoliants to unleash along the border zone, poisoning the soil and creating a toxic, uncrossable wasteland between our two nations."
 ENG_Weaponize_the_Rations:0 "Weaponize the Rations"	
 ENG_Weaponize_the_Rations_desc:0 "The blockade has made food scarce, but we will use it as a weapon. Black market food pipelines will be funneled across the border strictly to desperate, starving Scottish citizens who are willing to sabotage local infrastructure or feed intelligence back to London. The Scottish people will be forced to choose between their own survival and the lies of their leaders. We will make them beg for peace."
 ENG_Requisition_the_Welsh_Valleys:0 "Requisition the Welsh Valleys"
 ENG_Requisition_the_Welsh_Valleys_desc:0 "Industrial workers in the Midlands and the Red Army divisions pinned down on the Tweed cannot fight on empty stomachs. The rural fields, livestock, and farms of Wales must be entirely subjected to the survival of the U.S.B.R. Every grain harvested in Wales belongs to London now, and any farmer who refuses to comply will be treated as a traitor to the Republic."
 ENG_Crush_the_Plaid_Insurgency:0 "Crush the Plaid Insurgency"
 ENG_Crush_the_Plaid_Insurgency_desc:0 "Exploiting the food shortages, underground Welsh nationalist cells and anti-Starmer syndicalists are arming themselves in the hills. We must flood Wales with specialized internal security divisions to violently root out these partisans before they can link up with the Scots. The Welsh people will be forced to choose between their own survival and the lies of their leaders. We will make them beg for peace."
 ENG_The_Rural_Collectivisation:0 "The Rural Collectivisation"
 ENG_The_Rural_Collectivisation_desc:0 "Welsh farmers are hiding livestock and destroying crops in protest of our quotas. We will forcefully dissolve all private Welsh holdings, placing them under state-run agricultural syndicates. Any farmer who hoards food will be treated as an active counter-revolutionary saboteur. The Welsh people will be forced to choose between their own survival and the lies of their leaders. We will make them beg for peace."
  ENG_The_Dragon_Awakens:0 "The Dragon Awakens"
 ENG_The_Dragon_Awakens_desc:0 "Our heavy-handed requisitions have pushed Wales past the breaking point. The Welsh people have risen in a total, unified insurrection against London's rule, shattering the western flank of the U.S.B.R. and threatening to invite a capitalist landing on our beaches. We will crush the rebellion with overwhelming force, and we will make an example of the Welsh people to ensure that no other region dares to rise against the Republic."
 ENG_The_Conquest_of_Cardiff:0 "The Conquest of Cardiff"
 ENG_The_Conquest_of_Cardiff_desc:0 "The Welsh rebellion has been drowned in its own valleys. The red dragon has been broken by the sheer willpower of the English worker. Our security forces have re-established total control over Cardiff, and the ringleaders of the secessionist movement have been publicly hanged. Let this be a lesson to anyone who doubts the absolute resolve of London."
 ENG_The_Welsh_Bread_Basket_Secure:0 "The Welsh Bread Basket Secured"
 ENG_The_Welsh_Bread_Basket_Secure_desc:0 "With the countryside pacified, the requisition trucks are rolling once again. The fields of Glamorgan and the livestock of the north are back under state syndicates. The turnip rations are over; the factories of the Midlands are fed, and our soldiers will finally march on full stomachs."
 ENG_Sights_Back_on_the_Tweed:0 "Sights Back on the Tweed"
 ENG_Sights_Back_on_the_Tweed_desc:0 "We have proven that the breakaway regimes are fragile. If the Welsh could not hold against our resolve, neither can the Edinburgh Soviet. The troops guarding the western flank are being loaded onto trains and sent directly to reinforce the frozen trenches of the north. We will break the stalemate. The Tweed will be breached."
 ENG_Restore_the_Greater_Map:0 "Restore the Greater Map"
 ENG_Restore_the_Greater_Map_desc:0 "The domestic emergency is officially over. By systematically breaking the Welsh insurgency and dissolving the Edinburgh Soviet, we have proven that the United Socialist British Republic is a permanent reality. But we cannot remain a fortress behind walls while foreign regimes sit on lands born from our temporary collapse. Today, we initiate the Whitehall Doctrine. Let it be known to our neighbors and the world: any territory that fractured away from London's jurisdiction during the revolution is considered sovereign soil currently under hostile occupation. We will systematically redraw the borders, enforce our laws, and bring the breakaway nations back into the fold."
 ENG_The_Ulster_Ultimatum:0 "The Ulster Ultimatum"
 ENG_The_Ulster_Ultimatum_desc:0 "We will not waste time playing by Dublin's diplomatic playbook. A formal communique has been dispatched from Whitehall directly to the Irish Parliament. The message is blunt: the emergency referendum that stole the six counties during our revolution is declared null and void. We demand the immediate, peaceful handover of Northern Ireland. If Dublin backs down and allows our administration to secure the North, their Republic will be entirely ignored by our forces. If they refuse or interfere, they will face total annihilation."
 ENG_The_Belfast_Amphibious_Assault:0 "The Belfast Amphibious Assault"
 ENG_The_Belfast_Amphibious_Assault_desc:0 "Dublin’s predictable hesitation to our ultimatum is all the justification we need. While they debate in parliament, our Clyde-built transport fleets will strike. Red Army divisions will storm the beaches of Belfast Lough and secure the key ports of Derry and Newry, rapidly establishing a militarized line across the historic border to lock down the six counties. The Irish Republic will be forced to choose between their own survival and the lies of their leaders. We will make them beg for peace."
 ENG_Enforce_the_Republic_Line:0 "Enforce the Republic Line"
 ENG_Enforce_the_Republic_Line_desc:0 "Our vanguard has secured the North and dug in heavily along the frontier. Our heavy artillery is unlimbered, pointing directly south into the Republic. We have issued our final warning to Dublin: stay on your side of the wire. Do not send volunteers, do not supply the local resistance, and do not cross our checkpoints. If they obey, they are safe. If a single Irish uniform crosses that line, we march to Cork and burn the Republic to the ground. The Irish people will be forced to choose between their own survival and the lies of their leaders. We will make them beg for peace."
 ENG_The_Irish_Conquest_Campaign:0 "The Irish Conquest Campaign"
 ENG_The_Irish_Conquest_Campaign_desc:0 "They chose poorly. Dublin has defied our warnings, ordering its army to reinforce local insurgencies and shelling our border outposts. Since they refused to stay behind the line, the rules are null and void. The Red Army will drop the gate, cross the frontier, and launch a full-scale conquest to bring the entire island of Ireland under a syndicalist puppet administration. The Irish people will be forced to choose between their own survival and the lies of their leaders. We will make them beg for peace."
 ENG_Ignore_the_Southern_Isolation:0 "Ignore the Southern Isolation"
 ENG_Ignore_the_Southern_Isolation_desc:0 "The Dublin government, utterly paralyzed by the speed of our blitz into Belfast, has chosen survival over pride. They have officially pulled their garrisons back, closed their borders, and abandoned the North to its fate. As promised, we will ignore the Republic entirely. Let them rot in isolation behind their fence while we fully integrate Ulster back into the U.S.B.R."











	

