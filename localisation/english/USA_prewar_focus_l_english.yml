l_english:
 USA_Inauguration_Day:0 "Inauguration Day"
 USA_Inauguration_Day_desc:0 "Nina Turner takes the oath on a cold morning, in front of a crowd that is larger than the pollsters predicted and angrier than her staff would like. Some have come to cheer. Others hold signs about a country that has been promised repair before and has watched the repairs go to someone else. Behind her on the platform sit former presidents, donors and generals, and she is aware of every one of them.\n\nThe speech is short. She does not promise to heal the country, because she does not believe that a country can be healed by a speech. She promises to start, and to tell people the truth about how long it will take. Back in the West Wing, the first memo on her desk is a list of every institution that has already announced it will resist her. The list is eleven pages long.\n\nThe presidency begins, and with it a long list of choices about what to repair first."
 USA_First_Hundred_Days:0 "The First Hundred Days"
 USA_First_Hundred_Days_desc:0 "Every new administration is judged on its first hundred days, and Turner's chief of staff has pinned a countdown clock to the wall of the Roosevelt Room as a joke that nobody finds funny. The legislative calendar is crowded, the cabinet is only half confirmed, and the press is already counting the promises that have not yet been kept.\n\nThe team decides to do a small number of things quickly and visibly rather than many things slowly. Executive orders go out in batches. Agency heads who have been waiting for guidance get it. A weekly address, recorded in a kitchen rather than a studio, turns out to be more popular than anything the communications office has produced in a year.\n\nThe administration gains the Turner Mandate, a modest but real boost to its ability to govern. Whether it can be turned into law depends on the budget fight to come."
 USA_Budget_Showdown:0 "The Budget Showdown"
 USA_Budget_Showdown_desc:0 "A budget is the clearest statement of what a government believes, and Congress knows it. The Senate Majority Leader is a man who has never lost a vote he cared about, and he has let it be known that the President's priorities will be heard politely and then buried in committee. The Speaker is more direct: if the White House wants a budget, it can come and ask for one.\n\nTurner decides to go over their heads. A series of town halls in districts held by wavering members, a coalition of governors and mayors who need the money, and a carefully timed leak about who stands to lose from a shutdown all push the same way. The negotiation lasts nineteen days and ends at four in the morning with a bill that nobody loves and enough people can live with.\n\nThe budget passes, and the administration gains political capital and a little stability. It is the first proof that the President can win a fight in Washington."
 USA_Jobs_and_Infrastructure:0 "Jobs and Infrastructure"
 USA_Jobs_and_Infrastructure_desc:0 "The bridges are rusting, the water mains are older than the people who rely on them, and in a third of the country the rail network has gone back to the schedules of the previous century. Every governor has a list. Every mayor has a story. For the first time in a generation, they find a White House that wants to read both.\n\nThe plan is not clever, and it is not meant to be. It funds repairs that nobody can argue against, hires from the local labour pool and requires the work to be done by crews that live in the communities they are repairing. Within a month, the first projects have broken ground in places where the last federal visit was a disaster tour.\n\nThe administration gains political capital and stability, and support among moderate socialists grows. It is slow, visible progress, which is exactly what the programme needs."
 USA_Healthcare_Compact:0 "The Healthcare Compact"
 USA_Healthcare_Compact_desc:0 "No issue divides the country quite like health care, and no issue unites a family quite like a diagnosis. The Compact is the administration's attempt to square the circle: a public option available in every state, a cap on what hospitals can charge, and a transition period long enough that insurers can plan to survive.\n\nThe insurance lobby spends eight figures on advertising. Hospitals warn of closures, and in a few cases they are right. Yet on the ground, the response is different. Nurses organise in support. Small-town doctors, who have spent years drowning in paperwork, begin to sign letters of endorsement. A woman in Ohio who is shown on the evening news holding a medical bill the size of a mortgage becomes the face of the bill.\n\nThe administration gains political capital, stability and support among moderate socialists, and pays for it with a determined and well-funded enemy."
 USA_Rebuilding_the_Unions:0 "Rebuilding the Unions"
 USA_Rebuilding_the_Unions_desc:0 "Decades of legislation have stripped the unions of what they once could do. Shops have closed, contracts have been broken and an entire profession has been taught to believe that organising is a risk rather than a right. The administration decides to reverse it, quietly and at the most basic level, by making it possible once again to join one.\n\nThe new rules streamline recognition, protect workers who speak out and give the labour board the staff it has lacked for years. In the first month, organising drives begin in warehouses, hospitals and fulfilment centres that have never had a union. Some succeed. Many fail. But the possibility has changed, and the people on the picket lines can feel it.\n\nThe nation gains the Union Compact, improving output and goodwill among workers, and the revolutionary socialists, who see in this a beginning of something larger, gain a little ground."
 USA_Heartland_Industrial_Strategy:0 "The Heartland Strategy"
 USA_Heartland_Industrial_Strategy_desc:0 "Factories that closed in the nineties still stand in towns that never recovered. The Heartland Strategy proposes something that the previous administration would have called impossible: that the government should help to reopen them, on the condition that the workers share in what is produced.\n\nThe economists argue. The bankers scoff. In the towns themselves, nobody has time for the argument, because the first call for applications has been oversubscribed twenty to one. A shuttered steel mill in Pennsylvania announces it will reopen in the spring. A battery plant breaks ground in Michigan. For the first time in years, the evening news carries a story about somewhere in America getting better.\n\nThe nation gains the Recovery Programme and the political capital of a visible success. Industry will matter a great deal when the war comes."
 USA_Meeting_the_Opposition:0 "Meeting the Opposition"
 USA_Meeting_the_Opposition_desc:0 "Pete's people are not hard to find. They hold their rallies in stadiums, run their own media and have a stack of polling that shows the country is more divided than anyone in Washington is willing to say. They are also not wrong about everything, a fact that the more disciplined members of the administration try, with mixed success, to keep in mind.\n\nTurner invites their leaders to the White House. It is a tense afternoon. Some of them speak with real passion about what they have seen in their districts. Others speak as though the meeting is a deposition. The Secret Service notes, without comment, that two of the guests leave by the side entrance rather than face the press.\n\nThe door has been opened, and what the President does with it will define the next phase of her presidency."
 USA_Reach_Across_the_Aisle:0 "Reach Across the Aisle"
 USA_Reach_Across_the_Aisle_desc:0 "The advisers who believe in conciliation are the older ones, the ones who remember when it worked. They argue that the country cannot be governed by a president who is perpetually at war with half of it, and that a modest gesture now might buy a great deal of peace later.\n\nThe gesture is real: four cabinet-level posts to opposition figures, a bipartisan commission on election integrity and a promise to hold open hearings on every major executive action. Some in her own party are furious. The base grumbles. But the polls tick upward, the Senate calendar clears a little and a handful of opposition members begin, cautiously, to take her calls.\n\nThe administration gains political capital and stability, and the nationalist opposition loses some of its edge, though not all of it. This path is exclusive with a more confrontational approach."
 USA_Confront_the_Obstructionists:0 "Confront the Obstructionists"
 USA_Confront_the_Obstructionists_desc:0 "The younger staff say what the older staff will not: that conciliation has been tried, and that every compromise has been turned into a weapon. They argue that the President has a mandate, a microphone and a base that is hungry for a fight, and that the only way to govern is to force the opposition to vote on the record.\n\nSo Turner takes the fight to them. Names are named. Filibusters are forced into the open, and the cameras are invited in. The rallies grow louder, the opposition's tone sharpens, and the political temperature rises in a way that makes the more cautious members of her team reach for the antacids.\n\nThe administration gains political capital and war support, and the revolutionary socialists gain ground. Stability suffers. This path is exclusive with conciliation, and it makes the road ahead more dangerous."
 USA_Courts_and_Congress:0 "Courts and Congress"
 USA_Courts_and_Congress_desc:0 "A legislature can be outvoted, but a court can only be obeyed or defied. The administration's lawyers spend months preparing for the first big test, a challenge that the opposition has promised to bring in the most conservative federal district that will hear it.\n\nThe ruling, when it comes, is narrow, technical and carefully worded. Nobody wins entirely. But the administration has learned what it can do, and what it cannot, and the lines of authority between the branches, which had been fuzzy for years, are a little clearer than they were.\n\nThe administration gains political capital and a small boost to stability. The next question is the hardest of all: whether the institutions that answer to the President can be trusted to obey her."
 USA_Reform_the_Security_Services:0 "Reform the Security Services"
 USA_Reform_the_Security_Services_desc:0 "The intelligence agencies are the only part of the government that the President cannot fully see. They have their own traditions, their own loyalties and, in more than a few cases, their own politics. A review panel is convened under a veteran inspector general, with a brief to find out who is reporting to whom, and who is reporting to no one.\n\nThe results are sobering. Two directorates have accounts that do not appear in any budget. A senior official has been meeting, regularly and off the record, with men who are not in government. A set of files labelled as routine has been copied more times than a routine file ever would be.\n\nThe nation gains Counterplot Vigilance, improving the government's ability to detect hostile networks, and the administration gains political capital. The panel's findings are sealed. For the moment."
 USA_Watching_Berlin:0 "Watching Berlin"
 USA_Watching_Berlin_desc:0 "The analysts at Langley have been tracking German policy for months, and their reports are increasingly hard to dismiss. Shipping schedules have changed. Reserve units have been called to unexplained exercises. A series of diplomatic contacts with Scotland and France have been described by the Germans as routine, but the language of the cables is too careful for that.\n\nThe President reads the briefing twice. She asks whether the Germans are preparing for a war or for a bluff. The analyst, to his credit, says he does not know, and that he doubts anyone in Berlin does either.\n\nThe administration gains political capital and a clearer view of the situation in Europe. This is one of two intelligence strands that feed the final preparations."
 USA_Watching_Moscow:0 "Watching Moscow"
 USA_Watching_Moscow_desc:0 "Moscow is quieter than Berlin, and that is what worries the people who study it. Troop movements have been reported along the western frontier, but the Soviet press has said nothing. Diplomats who once complained about being followed have stopped complaining, because they are no longer followed.\n\nThe Soviet leadership is, in the view of the Agency, a government that knows something is coming and has decided to say nothing about it. Whether that silence reflects confidence or fear is the central question of every briefing, and the answers vary according to who is in the room.\n\nThe administration gains political capital and a better understanding of the eastern balance. This is the second intelligence strand, which with the first will shape how the war is seen when it comes."
 USA_Whispers_of_a_Plot:0 "Whispers of a Plot"
 USA_Whispers_of_a_Plot_desc:0 "It begins with a rumour that nobody can trace. A retired general mentions, in the wrong company, that the country would be better off under a firmer hand. A wealthy donor stops returning calls. An officer on the Joint Staff is quietly reassigned, and the three people who ask why are told not to.\n\nThe analysts who put the picture together are careful not to use the word coup. They use phrases like irregular political activity and coordinated elite discontent. But the President, who has spent her career reading between the lines of such phrases, knows exactly what they mean.\n\nAn event follows in which the first concrete warning reaches the Oval Office. The choice of how to respond is next."
 USA_Counter_the_Plot:0 "Counter the Plot"
 USA_Counter_the_Plot_desc:0 "The decision is not easy. To act is to admit that the threat is real, to risk making enemies of people who might have remained neutral, and to open the administration to the charge of paranoia. Not to act is to leave the country in the hands of the people who are planning to take it.\n\nTurner chooses to act. A small, tightly held group is assembled to track the conspirators. Surveillance warrants are sought. A few officers are moved to posts where they can do less harm. In the press, the story is carefully managed: a routine reorganisation, nothing more.\n\nThe administration gains an additional measure of vigilance and loses a little stability as rumours begin to spread. This path is exclusive with trust in the institutions."
 USA_Trust_the_Institutions:0 "Trust the Institutions"
 USA_Trust_the_Institutions_desc:0 "The alternative is faith. Turner has spent her career believing that American institutions, whatever their flaws, are stronger than any man or faction that tries to bend them. She does not intend to abandon that belief now, when it is most needed.\n\nShe goes to the Capitol, to the Pentagon and to the Supreme Court, and tells their leaders what she knows. Their reactions are carefully worded, grave and supportive. Some of them mean it. For a short, bright period, the country has the feeling that its institutions are rallying around its government.\n\nThe administration gains political capital and stability, but at a price. The plotters have been warned, and they are not fools. This path is exclusive with a counter-plot."
 USA_The_Last_Quiet_Day:0 "The Last Quiet Day"
 USA_The_Last_Quiet_Day_desc:0 "It is a Sunday in early autumn, and the capital feels almost ordinary. The President has been to church. Her advisers have gone home, and in the kitchen of the residence somebody is making soup. On the television in the next room, a talk show host is arguing about the price of milk.\n\nShe knows it will not last. The intelligence summaries, folded and unopened on the desk, tell her that the quiet has been bought by someone, and that the bill will be presented soon. She has done what she could: the budget is passed, the factories are reopening, the opposition has been engaged and the plot, as far as she can tell, has been seen.\n\nAn event follows that closes this chapter of the presidency. Whatever comes next will not be a matter of repair, but of survival."
