l_english:
 ryan_army_decisions:0 "Rebuild and Strengthen the UK Military"
 ryan_army_decisions_desc:0 "Our armed forces need a serious rebuild. We will restore military standards, expand training, modernize doctrine, and invest in logistics and command capacity so Britain can field a stronger, more reliable force again. Experienced domestic and allied officers will help train a new generation of leaders for the UK military."

 ryan_expand_army_recruitment_and_reserves:0 "Expand Army Recruitment and Reserves"
 ryan_expand_army_recruitment_and_reserves_desc:0 "Launch a national recruitment and reserve expansion drive to increase trained manpower, rebuild unit depth, and restore long-term force readiness."

 ryan_modernise_army_logistics_command:0 "Modernise Army Logistics and Command"
 ryan_modernise_army_logistics_command_desc:0 "Upgrade logistics planning, command structures, and operational coordination so the British Army can deploy faster and sustain operations more effectively."

 ryan_joint_readiness_exercises:0 "Joint Readiness Exercises"
 ryan_joint_readiness_exercises_desc:0 "Run large-scale readiness drills with key partners to improve command integration, accelerate training cycles, and strengthen real-world military preparedness."
 
 ryan_officer_training_corps:0 "Expand Officer Training and Command Schools"
 ryan_officer_training_corps_desc:0 "Reorganize military facilities into modern officer-training institutions to build a stronger leadership pipeline for the rebuilt armed forces."
 
