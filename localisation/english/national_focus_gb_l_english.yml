uk_left_tree:0 "UK Left Tree"
ENG_LEFT_The_Socialist_Mandate:0 "The Socialist Mandate"
ENG_LEFT_The_Socialist_Mandate_desc:0 "The government will use its mandate to tighten rules on political influence, begin restoring public services, and shift national policy toward redistribution, labour protections, and a less interventionist foreign policy."
ENG_LEFT_The_Year_of_Jubilee:0 "The Year of Jubilee"
ENG_LEFT_The_Year_of_Jubilee_desc:0 "The first programme of government will combine household debt relief, emergency social spending, and tax changes designed to shift resources away from concentrated wealth and into public services, housing, and local recovery."
ENG_LEFT_Peace_Through_Disarmament:0 "Peace Through Disarmament"
ENG_LEFT_Peace_Through_Disarmament_desc:0 "Britain will withdraw from NATO, cancel further expansion of the nuclear deterrent, and begin decommissioning the existing system while redirecting part of defence spending toward domestic priorities."
ENG_LEFT_The_Right_of_Return:0 "The Right of Return"
ENG_LEFT_The_Right_of_Return_desc:0 "Britain will recognise the State of Palestine, support an internationally supervised right of return, expand reconstruction aid, and align diplomatic policy behind Palestinian statehood and civilian protection."
ENG_LEFT_The_Bridge_of_Hope:0 "The Bridge of Hope"
ENG_LEFT_The_Bridge_of_Hope_desc:0 "The government will end the hostile-environment approach, expand asylum processing and legal routes, shift maritime operations toward search and rescue, and build reception, housing, and integration capacity for new arrivals."
ENG_LEFT_The_Citizen_of_the_World_Curriculum:0 "The Citizen of the World Curriculum"
ENG_LEFT_The_Citizen_of_the_World_Curriculum_desc:0 "Schools will revise history and civics teaching around empire, colonialism, labour movements, migration, and international institutions, backed by updated curriculum standards, materials, and teacher guidance."
ENG_LEFT_The_Ethical_Arms_Ban:0 "The Ethical Arms Ban"
ENG_LEFT_The_Ethical_Arms_Ban_desc:0 "Britain will suspend arms export licences to active war zones, tighten end-use controls, and fund conversion plans for affected defence production into civilian and green manufacturing."
ENG_LEFT_The_Fair_Trade_Tariffs:0 "The Fair Trade Tariffs"
ENG_LEFT_The_Fair_Trade_Tariffs_desc:0 "Tariffs, procurement rules, and import standards will be used to protect domestic industry, labour standards, and strategic supply chains from undercutting and offshoring pressure."
ENG_LEFT_The_Citizen_of_the_World_Passport:0 "The Citizen of the World Passport"
ENG_LEFT_The_Citizen_of_the_World_Passport_desc:0 "Britain will expand humanitarian visas, simplify residency and travel procedures, and orient passport and border policy around safe movement, family reunion, and international cooperation."
ENG_LEFT_Socialist_Protectionism:0 "Socialist Protectionism"
ENG_LEFT_Socialist_Protectionism_desc:0 "The government will use public investment, ownership rules, and trade controls to protect strategic sectors, support co-operatives, and rebuild domestic production under stronger democratic oversight."
ENG_LEFT_The_Workers_Coffee_Coops:0 "The Workers' Coffee Co-ops"
ENG_LEFT_The_Workers_Coffee_Coops_desc:0 "A public co-operative development programme will back worker-owned shops, local credit, and community purchase schemes to revive town centres and reduce dependence on absentee landlords and chain operators."
ENG_LEFT_Public_Wealth_Levy:0 "Public Wealth Levy"
ENG_LEFT_Public_Wealth_Levy_desc:0 "Emergency tax and asset measures will target dormant holdings, large fortunes, and speculative property, with the proceeds redirected into housing, public services, and local investment."
ENG_LEFT_National_Broadband_Service:0 "National Broadband Service"
ENG_LEFT_National_Broadband_Service_desc:0 "The state will take control of core broadband infrastructure, set universal-service obligations, and expand affordable high-speed access through a publicly run national network."
ENG_LEFT_The_Peoples_Media_Mandate:0 "The People's Media Mandate"
ENG_LEFT_The_Peoples_Media_Mandate_desc:0 "The government will impose stronger media-ownership limits, expand public-interest journalism, and subject major platforms and news conglomerates to stricter democratic and regulatory oversight."
ENG_LEFT_Police_Accountability_Reform:0 "Police Accountability Reform"
ENG_LEFT_Police_Accountability_Reform_desc:0 "Police forces will be placed under stronger local democratic oversight, with reforms to training, use-of-force rules, complaints systems, and command accountability."
ENG_LEFT_Public_Control_of_the_Grid:0 "Public Control of the Grid"
ENG_LEFT_Public_Control_of_the_Grid_desc:0 "The government will transfer the grid into public ownership, curb profiteering, and run investment, pricing, and transition planning through a publicly accountable energy authority."
ENG_LEFT_Everyone_is_Welcome:0 "Everyone is Welcome"
ENG_LEFT_Everyone_is_Welcome_desc:0 "Emergency accommodation, municipal support funds, and access to basic services will be extended regardless of immigration status so that no resident is left without shelter or immediate support."
ENG_LEFT_End_Royal_Prerogative:0 "End Royal Prerogative"
ENG_LEFT_End_Royal_Prerogative_desc:0 "The government will transfer prerogative powers from the Crown to Parliament, end royal consent as a political veto point, and place crown finances and estates under statutory public oversight."
ENG_LEFT_Reform_the_Upper_House:0 "Reform the Upper House"
ENG_LEFT_Reform_the_Upper_House_desc:0 "The Lords will be stripped of hereditary and patronage privileges and reconstituted as a smaller second chamber with representation tied to labour, local government, and public service."
ENG_LEFT_The_Second_Reconstruction:0 "The Second Reconstruction"
ENG_LEFT_The_Second_Reconstruction_desc:0 "With the old constitution split open, the government will move from reform to reconstruction, combining emergency social legislation, permanent public ownership powers, and a new settlement built around class power rather than inherited authority."
ENG_LEFT_Workers_Control_Act:0 "Workers' Control Act"
ENG_LEFT_Workers_Control_Act_desc:0 "Large firms will be required to recognise elected workplace councils with binding rights over safety, closures, investment plans, and redundancy proposals, giving organised labour a direct role in economic management."
ENG_LEFT_Convention_of_the_Republic:0 "Convention of the Republic"
ENG_LEFT_Convention_of_the_Republic_desc:0 "A constituent convention drawn from unions, councils, tenants' groups, and civic bodies will be convened to draft the institutional shape of the post-Westminster order and decide which powers remain national, regional, and local."
ENG_LEFT_The_Duchies_for_the_Public:0 "The Duchies for the Public"
ENG_LEFT_The_Duchies_for_the_Public_desc:0 "The Duchies of Lancaster and Cornwall will be stripped of private constitutional status and transferred into public trusts, with their revenues redirected into local government, housing, and regional development."
ENG_LEFT_Social_Ownership_Charter:0 "Social Ownership Charter"
ENG_LEFT_Social_Ownership_Charter_desc:0 "Strategic industries, major logistics networks, and firms that attempt capital flight will be brought under social ownership through compulsory purchase, public equity stakes, and co-operative conversion powers."
ENG_LEFT_The_Republican_Constitution:0 "The Republican Constitution"
ENG_LEFT_The_Republican_Constitution_desc:0 "Britain will adopt a written constitution defining social rights, limits on executive authority, binding standards for public ownership, and a clear supremacy of democratic law over convention and prerogative."
ENG_LEFT_Palestine_Solidarity_Offensive:0 "Palestine Solidarity Offensive"
ENG_LEFT_Palestine_Solidarity_Offensive_desc:0 "Britain will move beyond recognition into active solidarity, backing Palestinian statehood in every forum, suspending military and diplomatic support for Israeli operations, and turning foreign policy toward anti-colonial alignment across the region."
ENG_LEFT_Arrest_the_Fascist_Ringleaders:0 "Arrest the Fascist Ringleaders"
ENG_LEFT_Arrest_the_Fascist_Ringleaders_desc:0 "The state will pursue the organisers, financiers, and public leaders of violent far-right networks through conspiracy, weapons, and hate-crime prosecutions, aiming to break the command layer behind the street movement."
ENG_LEFT_Break_the_Private_Press_Bloc:0 "Break the Private Press Bloc"
ENG_LEFT_Break_the_Private_Press_Bloc_desc:0 "Cross-ownership caps, anti-monopoly action, and disclosure rules will be used to break concentrated press power, preventing a handful of proprietors from dominating political communication or sabotaging the new order."
ENG_LEFT_Housing_Beyond_the_Market:0 "Housing Beyond the Market"
ENG_LEFT_Housing_Beyond_the_Market_desc:0 "National rent controls, compulsory purchase of long-empty property, and a state-led building programme will be used to turn housing into a guaranteed social good rather than an investment vehicle."
ENG_LEFT_Refugee_Solidarity_Corridors:0 "Refugee Solidarity Corridors"
ENG_LEFT_Refugee_Solidarity_Corridors_desc:0 "Britain will establish protected humanitarian routes from major conflict zones, sharply expand asylum capacity, and direct councils, unions, and public services to treat refugee resettlement as a national obligation rather than a border problem."
ENG_LEFT_Break_with_Atlantic_Orthodoxy:0 "Break with Atlantic Orthodoxy"
ENG_LEFT_Break_with_Atlantic_Orthodoxy_desc:0 "Foreign policy will no longer follow Washington's security consensus by default. Britain will oppose sanctions regimes that produce mass suffering, refuse alignment with regional proxy wars, and pursue open links with anti-imperial governments across the Middle East and Global South."
ENG_LEFT_Public_Service_Broadcasting_Act:0 "Public Service Broadcasting Act"
ENG_LEFT_Public_Service_Broadcasting_Act_desc:0 "Broadcast licensing, platform carriage rules, and public grants will be reorganised to expand non-commercial news, local stations, and union-backed media outside private ownership chains."
ENG_LEFT_Seize_the_Hate_Platforms:0 "Seize the Hate Platforms"
ENG_LEFT_Seize_the_Hate_Platforms_desc:0 "Broadcasters, publishers, and digital channels that coordinate fascist agitation or incitement will face licence seizure, emergency trusteeship, and asset confiscation so that organised reaction cannot hide behind media ownership."
ENG_LEFT_Tribunals_for_Incitement:0 "Tribunals for Incitement"
ENG_LEFT_Tribunals_for_Incitement_desc:0 "Special republican courts will be empowered to try political incitement, organised hate campaigns, and violent conspiracy cases rapidly, targeting the influencers and patrons who turn propaganda into attacks on the street."
ENG_LEFT_Common_Treasury_Programme:0 "Common Treasury Programme"
ENG_LEFT_Common_Treasury_Programme_desc:0 "Revenue from the wealth levy, the duchies, and recovered Crown assets will be pooled into a permanent treasury for housing, municipal industry, transport modernisation, and emergency welfare guarantees."
ENG_LEFT_Internationalism_Without_Empire:0 "Internationalism Without Empire"
ENG_LEFT_Internationalism_Without_Empire_desc:0 "The republic will define itself through anti-imperial solidarity: refugee protection, sanctions on occupation and apartheid, and a foreign policy that treats the decline of Western bloc power as an opportunity to build a different international order."
ENG_LEFT_No_Platform_for_the_Counter_Revolution:0 "No Platform for the Counter-Revolution"
ENG_LEFT_No_Platform_for_the_Counter_Revolution_desc:0 "Reactionary parties, financiers, and media fronts that organise to overturn the republic will be denied the protections of ordinary politics, facing party bans, property seizures, and permanent exclusion from public institutions."
ENG_LEFT_The_Monarchy_Question:0 "The Monarchy Question"
ENG_LEFT_The_Monarchy_Question_desc:0 "Once prerogative, privilege, and aristocratic property have been cut back, the state must decide whether the royal family will remain in the country as private citizens or whether the Crown itself will be ended in law."
ENG_LEFT_Exile_the_House_of_Windsor:0 "Exile the House of Windsor"
ENG_LEFT_Exile_the_House_of_Windsor_desc:0 "The royal household will be removed from Britain, stripped of remaining privileges, and barred from intervention in public life, while the state settles its estates and titles under republican law."
ENG_LEFT_End_the_Monarchy:0 "End the Monarchy"
ENG_LEFT_End_the_Monarchy_desc:0 "The Crown will be abolished outright, all remaining royal functions will be transferred into the republican constitution, and Britain will cease to recognise monarchy as a legal or political institution."

ENG_peoples_dictatorship_idea:0 "The People's Dictatorship"
ENG_peoples_dictatorship_idea_desc:0 "The republic has hardened into a revolutionary regime. The state moves faster and speaks more sharply, but large parts of the country increasingly feel occupied rather than represented."
ENG_quiet_republic_idea:0 "The Quiet Republic"
ENG_quiet_republic_idea_desc:0 "Corbyn's republic has chosen legitimacy over rupture, trying to stabilize the new order through patience, restraint, and social trust rather than revolutionary coercion."
ENG_lamppost_resistance_idea:0 "Lamppost Resistance"
ENG_lamppost_resistance_idea_desc:0 "Sultana's split has driven the hardest elements of the movement underground. The Vanguard Guard now wages a campaign of sabotage and intimidation against the quieter republic they denounce as a betrayal."
ENG_jubilee_programme_idea:0 "Jubilee Programme"
ENG_jubilee_programme_idea_desc:0 "Debt relief, emergency social spending, and redistribution have started to circulate purchasing power back into ordinary households while easing pressure on the welfare state."
ENG_citizen_world_curriculum_idea:0 "Citizen of the World Curriculum"
ENG_citizen_world_curriculum_idea_desc:0 "Schools are teaching a more international and anti-imperial civic story, broadening political literacy while making chauvinist narratives harder to normalize."
ENG_socialist_protectionism_idea:0 "Socialist Protectionism"
ENG_socialist_protectionism_idea_desc:0 "Industrial planning now favors strategic domestic production, public procurement, and supply-chain resilience over cheap dependence on external markets."
ENG_workers_cooperative_sector_idea:0 "Workers' Co-operative Sector"
ENG_workers_cooperative_sector_idea_desc:0 "The government is channeling credit and procurement toward worker-owned firms, giving the co-operative economy a real foothold in national production."
ENG_national_broadband_service_idea:0 "National Broadband Service"
ENG_national_broadband_service_idea_desc:0 "A public broadband backbone is reducing infrastructure bottlenecks and spreading digital capacity beyond the most profitable private markets."
ENG_reformed_public_order_idea:0 "Reformed Public Order"
ENG_reformed_public_order_idea_desc:0 "Police oversight has been tightened and the internal security apparatus is under closer democratic supervision, making covert destabilization more difficult."
ENG_public_energy_authority_idea:0 "Public Energy Authority"
ENG_public_energy_authority_idea_desc:0 "The grid is now being planned as national infrastructure rather than a private rent stream, improving investment discipline and reducing consumer waste."
ENG_parliamentary_supremacy_idea:0 "Parliamentary Supremacy"
ENG_parliamentary_supremacy_idea_desc:0 "Royal discretion is being replaced by statutory authority and parliamentary control, making the state more politically responsive and less vulnerable to constitutional obstruction."
ENG_second_reconstruction_idea:0 "The Second Reconstruction"
ENG_second_reconstruction_idea_desc:0 "The government has entered a more disruptive phase of institutional change, accelerating public investment and political centralization at the cost of social calm."
ENG_workers_control_idea:0 "Workers' Control"
ENG_workers_control_idea_desc:0 "Workplace councils now have teeth. Management decisions are being pushed through structures that include labor directly, improving efficiency where the state can enforce compliance."
ENG_social_ownership_charter_idea:0 "Social Ownership Charter"
ENG_social_ownership_charter_idea_desc:0 "Public ownership powers have expanded from emergency intervention into a standing doctrine of economic management, pulling strategic industry further under collective control."
ENG_republican_constitution_idea:0 "Republican Constitution"
ENG_republican_constitution_idea_desc:0 "A written constitution has clarified the new political order, raising confidence in the republic and limiting the ability of hostile elites to exploit old ambiguities."
ENG_housing_beyond_market_idea:0 "Housing Beyond the Market"
ENG_housing_beyond_market_idea_desc:0 "Housing policy is now organized around social need instead of asset speculation, giving the state more room to build and plan at scale."
ENG_refugee_solidarity_corridors_idea:0 "Refugee Solidarity Corridors"
ENG_refugee_solidarity_corridors_idea_desc:0 "Protected routes and expanded settlement capacity are turning refugee reception into an organized state function rather than an ad hoc emergency response."
ENG_post_atlantic_doctrine_idea:0 "Post-Atlantic Doctrine"
ENG_post_atlantic_doctrine_idea_desc:0 "Britain's foreign policy is no longer anchored to automatic Atlantic alignment. The state is freer politically, but relations with established partners are cooling."
ENG_common_treasury_programme_idea:0 "Common Treasury Programme"
ENG_common_treasury_programme_idea_desc:0 "Recovered wealth and Crown revenues are being recycled into a permanent public investment pool focused on housing, transport, and municipal industry."
ENG_internationalism_without_empire_idea:0 "Internationalism Without Empire"
ENG_internationalism_without_empire_idea_desc:0 "The republic is framing itself as an anti-imperial state, accepting diplomatic friction abroad in exchange for a clearer foreign-policy identity at home."
ENG_counter_revolution_suppressed_idea:0 "Counter-Revolution Suppressed"
ENG_counter_revolution_suppressed_idea_desc:0 "The state has shut much of the organized reactionary ecosystem out of public life, making internal sabotage harder but deepening the sense of permanent confrontation."
ENG_state_of_rebellion_modifier:0 "State of Rebellion"
ENG_state_of_rebellion_modifier_desc:0 "The local political settlement has broken down. Militant committees, strikes, and sporadic clashes are disrupting normal administration and economic life."


