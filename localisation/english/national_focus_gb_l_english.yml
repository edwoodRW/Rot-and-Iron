 ENG_above_upper_ni:0 "Reform UEL on National Insurance"
 ENG_above_upper_ni_desc:0 "The Upper Earnings Limit (UEL) and Upper Profits Limit (UPL) have meant that those earning over the threshold of £595/week do not pay any national insurance as they are seen to having 'paid their due'. This is not an appropriate solution to a country that takes care of the vulnerable so a small 1% tax should be imposed on anything greater than this sum."
 ENG_upper_rate_tax:0 "A New Upper Rate Tax"
 ENG_upper_rate_tax_desc:0 "There is a clear difference in the living of those who live on £100k in London and £150k, we must stop punishing those who are well off and go after the truly rich who won't feel their belts' tighten."
