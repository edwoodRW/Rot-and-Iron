 britain.41.t:0 "Killing of Mark Duggan"
 britain.41.d:0 "Known black-british gang member Mark Duggan was discovered to having acquired a blank firing handgun converted to fire live rounds. As part of Operation Trident he was stopped at 6:15pm while in a minicab, he ran out of the taxi and pulled out a handgun. Debate has emerged over whether the gangster was warned before he was shot however he was killed during the altercation."
 britain.41.o1:0 "Another tragedy"
 britain.42.t:0 "Riots Erupt"
 britain.42.d:0 "In the aftermath and confusion of the shooting of the gangster Mark Duggan people have taken to the streets and violent clashes have been reported across london, Manchester, Bristol and other areas. Looting is widespread with the police having to draft in riot police from other areas. The situation has been made worse by looters organising with BBM (Black Berry Messanger) to coordinate, with many members having travelled to take part in the looting."
 britain.42.o1:0 "How does this help?"
 britain.167.t:0 "The Socialist Mandate"
 britain.167.d:0 "The first private conversation after the victory rally stretches well past midnight. Corbyn sits at the cabinet table with his tie loosened and a marked-up Treasury brief in front of him. Sultana, still carrying notes from the campaign trail, is already moving line by line through the first hundred-day programme. Between them the tone is settled quickly: this government was not elected to preserve the old settlement with kinder language. It was elected to change who government serves and how it uses power.\n\nCorbyn argues that the result gives them permission to do the practical work previous governments refused to attempt. Anti-union restrictions are to be reviewed. Emergency support for councils and the NHS will move immediately. A wealth-led tax package is to be prepared, along with tighter rules on lobbying, political donations, media access, and the revolving door between ministers and private contractors. Sultana pushes for speed. If they wait for Whitehall to feel comfortable, she warns, every entrenched interest in Britain will have time to regroup and obstruct.\n\nBy the time the meeting breaks, the outline is clear. Public services are to be rebuilt. Organised labour is to be treated as a governing partner rather than a problem to contain. Foreign policy is to move away from Atlantic reflexes and toward ceasefires, mediation, and reconstruction. Tomorrow's headlines may choose their own language, but the working assumption inside Downing Street is already fixed: Britain is to become a fairer country through deliberate state action, not rhetorical sympathy."
 britain.167.o1:0 "The victory has to become a programme."
 britain.168.t:0 "The Year of Jubilee"
 britain.168.d:0 "The first full strategy session of the new government is less celebratory than administrative. Departmental briefs cover the table, and every page points to the same conclusion: household debt is suppressing demand, councils are close to insolvency, public services are operating on exhaustion, and private utilities still expect the state to guarantee profit while accepting no public obligation in return. The phrase Year of Jubilee survives the meeting because it captures the substance of what ministers want to do: reset who receives relief and who is expected to carry the burden.\n\nThe programme taking shape is expansive and specific. Debt enforcement on low-income households will be paused while relief mechanisms are drafted. Local authorities will receive emergency funding to stabilise social care, temporary accommodation, transport, and child services. A first public investment bill will direct money into housing, insulation, school repair, and NHS maintenance. The Treasury is instructed to prepare levies on wealth, speculative property, and idle assets instead of another round of cuts or consumption taxes. Trade union leaders are invited into implementation talks, because wage growth and collective bargaining are being treated as part of recovery rather than an obstacle to it.\n\nCorbyn insists the government explain the programme in plain terms: less money extracted upward, more security delivered downward. Sultana presses for visible early measures so Jubilee cannot be dismissed as another consultation exercise with a red slogan on top. Together they settle on the line every minister will carry out of the room. Debt relief, social investment, and a deliberate transfer of leverage away from rentier interests and back toward households, workers, and local institutions will define the first year. Managed decline is over; the state is now expected to intervene on the side of ordinary people."
 britain.168.o1:0 "Put the programme before the country."