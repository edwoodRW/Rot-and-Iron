ENG_scottish_costs:0 "Union Dividend"
ENG_scottish_costs_desc:0 "The Union Dividend is the applied Barnett formula where Scotland receives more per head than England. Scotland provides less income in taxes (including North Sea Oil) than England so overall is a net drain on expenditure."
