l_english:
### UNITED KINGDOM ##
ENG_The_Farage_Coalition:0 "The Farage Coalition"
ENG_The_Farage_Coalition_desc:0 "The 2029 General Election has shattered the old order. With Labour in 4th and the Greens surging to 3rd, the traditional parties have failed. Prime Minister Nigel Farage now leads a historic coalition with the Conservatives. Our mandate is clear: restore the borders, slash the taxes, and ignore the screams of the metropolitan elite. The work of national renewal begins today."
ENG_First_100_Days:0 "The First 100 Days"
ENG_First_100_Days_desc:0 "We have 100 days to make it clear we have a government of efficiency and show this is what the people voted for no matter how hard the work is. We made a promise and we must keep to it no matter the cost."
ENG_Exit_The_ECHR:0 "Exit The ECHR"
ENG_Exit_The_ECHR_desc:0 "For too long, the British government has been hamstrung by the dictates of a foreign court in Strasbourg. Foreign criminals have used 'the right to a family life' to mock our justice system, while our borders remain a sieve. By withdrawing from the European Convention on Human Rights, we reclaim our judicial supremacy. No longer will unelected European judges be able to ground our flights or prevent the deportation of those who mean us harm."
ENG_Operation_Channel_Shield:0 "Operation Channel Shield"
ENG_Operation_Channel_Shield_desc:0 "The small boats crisis is no longer a mere policy failure; it is a national security emergency. We will mobilize the Royal Navy and the Border Force into a unified command with a simple mandate: pick up and take back. By establishing a permanent maritime wall in the English Channel and utilizing offshore processing centers, we remove the incentive for the crossing."
ENG_The_Five_Year_Rule:0 "The Five Year Rule"
ENG_The_Five_Year_Rule_desc:0 "A welfare state cannot be a 'world-fare' state. To preserve our social fabric and the integrity of our public services, we must enforce a simple principle, you must contribute before you can collect. We will legislate that no foreign national shall be eligible for benefits or social housing until they have lived and paid tax in the United Kingdom for five consecutive years."
ENG_The_Ecomomic_Shock_Therapy:0 "The Economic Shock Therapy"
ENG_The_Ecomomic_Shock_Therapy_desc:0 "Half-measures have brought us to the brink of insolvency. The 2024–2029 era was defined by high taxes, sluggish growth, and a state that grew faster than the economy supporting it. We cannot simply 'tweak' the system; we must break it. This program is designed to deliver a short, sharp shock to the British economy—stripping away the regulatory rot, ending the era of state dependency, and forcing the UK to compete on the global stage once again."
ENG_Scuttle_Net_Zero:0 "Scuttle Net Zero"
ENG_Scuttle_Net_Zero_desc:0 "For a decade, the British economy has been sacrificed on the altar of a 'Net Zero' ideology that our competitors in the East simply ignore. We will repeal the ruinous carbon taxes, scrap the subsidies for unreliable wind-farms, and end the ban on internal combustion engines. Britain is a nation built on coal, gas, and steel—it is time we acted like it."
ENG_The_20k_Threshold:0 "The £20k Threshold"
ENG_The_20k_Threshold_desc:0 "The most effective way to help the working people of Britain is not through more government handouts, but by letting them keep their own money. By raising the Personal Allowance to £20,000, we effectively abolish income tax for seven million of our lowest-paid citizens. This bold move will put more money in the pockets of those who need it most, stimulate consumer spending, and unleash a wave of entrepreneurial energy across the nation."
ENG_The_Corperate_Tax_Cut:0 "The Corporate Tax Cut"
ENG_The_Corperate_Tax_Cut_desc:0 "Capital goes where it is welcome and stays where it is well-treated. Currently, the UK is treating its wealth-creators like a piggy bank for a failing state. We will immediately cut the main rate of Corporation Tax to 15%, undercutting the stagnant economies of the Eurozone and making the UK the most attractive investment destination in the Western Hemisphere. This bold move will create jobs, boost innovation, and restore Britain's position as a global economic powerhouse."
ENG_The_Blob_Retrenchment:0 "The Blob Retrenchment"
ENG_The_Blob_Retrenchment_desc:0 "The Civil Service has expanded by nearly 100,000 since the pandemic, yet public service productivity has plummeted. We will mandate an immediate 25% headcount reduction across all non-essential government departments and abolish over 100 'Quangos' that exist only to produce red tape. By streamlining the bureaucracy, we will create a leaner, more efficient state that serves the people rather than stifles them."
ENG_The_Saint_Stephen_Agreement:0 "The Saint Stephen Agreement"
ENG_The_Saint_Stephen_Agreement_desc:0 "The Green-Labour 'Popular Front' has brought Westminster to a standstill. To survive, we must secure the Conservative flank. The Saint Stephen’s Agreement formalises our coalition: we agree to moderate our fiscal 'Shock Therapy' and guarantee the independence of the Judiciary in exchange for a 'Ironclad' Tory vote of confidence. This pact ensures stable governance and a united front against the forces of chaos."
 ENG_Civil_Contingencies_Act:0 "Civil Contingencies Act"
  ENG_Civil_Contingencies_Act_desc:0 "The 2004 Act was designed for floods and pandemics; it was not built for a political insurrection. We will push through a targeted amendment that allows the Home Secretary to designate 'Red Zones' around critical infrastructure. In these zones, law enforcement will have enhanced powers to prevent sabotage, enforce curfews, and maintain order during times of national emergency."
ENG_The_Westminster_Realignment:0 "The Westminster Realignment"
ENG_The_Westminster_Realignment_desc:0 "Reform UK was a disruptor; now it must be a governor. By formally integrating the Conservative backbenches into our policy-making machine, we end the era of right-wing infighting. This realignment will create a unified centre-right bloc, capable of delivering bold reforms and steering the nation through turbulent times."
 ENG_The_Kings_Peace_Proclamation:0 "The King's Peace Proclamation"
  ENG_The_Kings_Peace_Proclamation_desc:0 "We will utilize the ultimate symbol of British stability: the Monarchy. By advising His Majesty to issue a Proclamation for the King’s Peace, we frame the Popular Front not as a political movement, but as a threat to the Crown's subjects. This appeals to the 'Quiet Majority' and forces the Green leadership to choose between de-escalation or appearing like republicans."
 ENG_The_Common_Sense_Consensus:0 "The Common Sense Consensus"
  ENG_The_Common_Sense_Consensus_desc:0 "The public is tired of 'isms.' We will re-brand our most radical policies as 'Common Sense Governance.' Instead of talking about ideology, we talk about efficiency, value for money, and the quiet majority. This shift in rhetoric will help us win over sceptical voters and build a broad coalition for reform."
 ENG_Enterprise_Over_Ideology:0 "Enterprise Over Ideology"
  ENG_Enterprise_Over_Ideology_desc:0 "We will pivot from 'Tax Cuts for the sake of it' to 'Targeted Growth Incentives.' We will work with the Confederation of British Industry (CBI) to ensure our reforms benefit the big players as much as the entrepreneurs. If the City of London is happy, the Government is safe."
 ENG_The_Triple_Lock_On_Sovereignty:0 "The Triple Lock On Sovereignty"
  ENG_The_Triple_Lock_On_Sovereignty_desc:0 "To satisfy the base while appeasing the moderates, we will create a 'Triple Lock' law. Any further transfer of power to international bodies (EU, WHO, UN) will require a mandatory referendum. It keeps the Restore Britain wing happy without actually leaving every treaty on day one. This is realpolitik at its finest."
 ENG_Professionalise_The_Ranks:0 "Professionalise The Ranks"
  ENG_Professionalise_The_Ranks_desc:0 "No more 'people's army' antics. To govern effectively, we need the best minds from the City, the Law, and the Military. We will replace the firebrands in our party leadership with seasoned administrators. We lose some populist fire, but we gain the competence needed to actually run a G7 nation. This is how we turn disruption into governance."
 ENG_The_Defence_Of_The_Realm_Decree:0 "The Defence Of The Realm Decree"
  ENG_The_Defence_Of_The_Realm_Decree_desc:0 "The liberal-left coalition has mistaken our patience for weakness. By blockading our capital and stalling our economy, they have abandoned the ballot box for the barricades. We shall meet them there. Invoking an emergency 'Defence of the Realm' decree, we authorize the Home Secretary to suspend the right to assembly for 'subversive organizations. This is not a step we take lightly, but the survival of our nation demands it."
 ENG_Federalise_The_Police:0 "Federalise The Police"
  ENG_Federalise_The_Police_desc:0 "Regional police forces, particularly in London, have been compromised by local mayors and radical activists. To restore order, we will merge all 43 territorial forces into a single National Police Service. Directly answerable to the Home Secretary, this force will prioritise national security over local political posturing. This is essential to maintaining law and order in these turbulent times."
 ENG_The_Tri_Partite_Security_Pact:0 "The Tri-Partite Security Pact"
  ENG_The_Tri_Partite_Security_Pact_desc:0 "The streets are still on fire, and the Tory backbenchers are losing their nerve. We need allies who are not afraid of a headline. By bringing Restore Britain into a formal Security Pact, we gain their grassroots strength and their Volunteer Reserve units to bolster our overstretched police."
 ENG_The_Cabinet_Purge:0 "The Cabinet Purge"
  ENG_The_Cabinet_Purge_desc:0 "The tension between the 'One-Nation' Conservatives and our Restore Britain partners has reached a breaking point. Following their latest attempt to block our emergency security laws, we have requested the resignation of all moderate Tory ministers. They have walked out of the coalition, but they have nowhere to go. We are now a majority of two: Reform and Restore Britain."
 ENG_Infiltrate_The_Selection_Committees:0 "Infiltrate The Selection Committees"
  ENG_Infiltrate_The_Selection_Committees_desc:0 "The real power in a party is not the leader; it is the person who chooses the candidates. We will use our Volunteer Reserve members to pack local Reform selection meetings. We will ensure that every new parliamentary candidate is a Restore Britain loyalist in a Reform tie. By the next election, the Reform party will be a Restore Britain party in all but name."
 ENG_The_Common_Sense_Enforcers:0 "The Common Sense Enforcers"
  ENG_The_Common_Sense_Enforcers_desc:0 "Restore Britain-affiliated Citizen Volunteers are now a common sight alongside the regular police. We will formally deputise them to guard Critical National Assets such as media hubs, energy plants, and ports. They do not need a diversity handbook; they just need to know how to keep a line. This is community policing at its most effective."
 ENG_Asorb_The_Local_Branches:0 "Absorb The Local Branches"
  ENG_Asorb_The_Local_Branches_desc:0 "The old Conservative Party is hollow. Their local associations are aging and demoralized, while the Restore Britain movement is young and aggressive. We will launch a National Realignment program, allowing Restore Britain and Reform branches to merge. By the time the Wet Tories in Westminster realise what is happening, they will have no seats to go back to."
 ENG_Weaponise_The_Tory_Lite_Label:0 "Weaponise The Tory-Lite Label"
  ENG_Weaponise_The_Tory_Lite_Label_desc:0 "Every time Reform makes a compromise with the remaining Conservatives, we will leak it to the grassroots. Through our network of influencers and Restore Britain local cells, we will frame these deals as Farage going native in Westminster. By painting the Reform leadership as the new status quo, we position Restore Britain as the only true anti-establishment force left in Britain."
 ENG_Nigel_Is_A_Tory_Narrative:0 "Nigel Is A Tory Narrative"
  ENG_Nigel_Is_A_Tory_Narrative_desc:0 "Restore Britain has begun a whisper campaign: Farage has gone soft. They argue that by staying in the old Downing Street system, he has become part of the managed decline. By painting the Reform leadership as Tory-Lite and establishment-adjacent, Restore Britain positions itself as the only truly radical force for change. This narrative will resonate with the disaffected voters who feel betrayed by the political class."
 ENG_Subvert_The_Contract:0 "Subvert The Contracts Of Power"
  ENG_Subvert_The_Contract_desc:0 "The Contract for Government was a Reform document. We will amend it. By pushing for more radical amendments, such as the total ban on non-traditional NGOs and a new Restore Britain curriculum, we force Farage to either alienate the moderates or look like a coward. Either way, Restore Britain wins."
 ENG_The_Blood_an_Soil_Argiculture_Act:0 "The Blood and Soil Agriculture Act"
  ENG_The_Blood_an_Soil_Argiculture_Act_desc:0 "Environmentalism is a globalist scam, but the Land is sacred. We will replace Net Zero farming subsidies with a national restoration grant available only to multi-generational British families. We are not just protecting the economy; we are protecting the ancestral connection between the British people and the British earth."
  ENG_Revoke_The_1948_Nationality_Act:0 "Revoke The 1948 Nationality Act"
 ENG_Revoke_The_1948_Nationality_Act_desc:0 "The root of our national decline lies in the post-war consensus on citizenship. We will introduce a Restore Britain nationality bill, redefining what it means to be British. Citizenship will no longer be a clerical gift; it will be a privilege earned through lineage and loyalty. Those who cannot prove their commitment to the British nation will be downgraded to Guest Status."
 ENG_The_London_Sanitisation_Program:0 "The London Sanitisation Program" 
ENG_The_London_Sanitisation_Program_desc:0 "London has become a foreign city on British soil. We will launch a comprehensive program to sanitize the capital, clearing out radical squats, shutting down subversive cultural centers, and repurposing modern art spaces into Restore Britain monuments. If the Mayor resists, we will treat it as a declaration of secession and respond with the National Police."
 ENG_The_2030_Reform_Party_Conference:0 "The 2030 Reform Party Conference"
  ENG_The_2030_Reform_Party_Conference_desc:0 "The annual conference in Birmingham was supposed to be a victory lap. Instead, the halls are packed with Restore Britain activists who have out-organized our own delegates. The air is thick with tension as hardliners heckle every mention of 'coalition' or 'compromise.' Outside, the Progressive Alliance has staged the largest protest in a decade, branding us as fascists, while our own moderate MPs are whispering to the press that we have lost control of the beast we created."

ENG_The_Enabling_Act_Of_Westminster:0 "The Enabling Act Of Westminster"
ENG_The_Enabling_Act_Of_Westminster_desc:0 "The talking is over. For decades, Parliament has been a circus of delay, and the Courts have served as a shield for the corrupt and the cowardly. We will no longer permit procedure to obstruct national survival. This Act ends the era of debate and concentrates emergency power in the hands of the state, so the Leader's will may be carried out without hesitation. The old world of red tape will be swept aside and replaced with the iron reality of national rebirth."
ENG_The_Great_Purge:0 "The Great Purge"
ENG_The_Great_Purge_desc:0 "The rot in our institutions is not accidental; it is the deliberate product of decades of ideological capture. The BBC, the universities, Whitehall, and the cultural establishment have all become engines of anti-national thought. We will move through them methodically and without mercy, removing every hostile voice and every complacent functionary who still clings to the old order. This will not be a reform of the system. It will be a cleansing of it."
ENG_The_National_Support_Detachment:0 "The National Support Detachment"
ENG_The_National_Support_Detachment_desc:0 "The thin blue line has snapped. The regular police are exhausted, compromised, or unwilling to do what this moment demands. We will create the National Support Detachment as an auxiliary force of loyal men and women empowered to hold the streets, defend public order, and enforce the law where ordinary bureaucracy has collapsed. Order will no longer be requested. It will be imposed."
ENG_The_25_Point_Plan_for_National_Rebirth:0 "The 25 Point Plan for National Rebirth"
ENG_The_25_Point_Plan_for_National_Rebirth_desc:0 "The movement now requires doctrine, not merely momentum. The 25 Point Plan will serve as the ideological charter of the Reborn Kingdom, setting out a total program for state, society, economy, citizenship, and culture. It will define who belongs, who serves, and what Britain is to become. With this document, our revolution stops being a reaction to crisis and becomes a complete blueprint for the nation we intend to build."
ENG_Lets_Get_Rid_Of_Our_Opponents:0 "Let's Get Rid of Our Opponents"
ENG_Lets_Get_Rid_Of_Our_Opponents_desc:0 "For decades, the halls of Westminster have been a playground for the weak and the treacherous. While the people struggled, the professional old parties treated Parliament as a market of factional barter and managed decline. We will no longer rebuild a house while the previous tenants are still trying to burn it down. The fractured parties of the old order will be broken, their voices silenced, and their roadblocks swept away."
ENG_The_Appointment_Of_The_High_Chancellor:0 "The Appointment of the High Chancellor"
ENG_The_Appointment_Of_The_High_Chancellor_desc:0 "The age of the politician is over; the age of command begins. A nation in crisis does not need a parliament, it needs a will. By decree of the National Unity Act, the office of Prime Minister is dissolved and replaced by the High Chancellor of the Chancellory. He is the father of the nation, the arbiter of truth, and the final word on every British life. From the shadows of Whitehall to the streets in every town, his eyes are upon us and his will is the law."
ENG_The_Chancellors_Youth:0 "The Chancellor's Youth"
ENG_The_Chancellors_Youth_desc:0 "The past belongs to the dead; the future belongs to the Chancellor. We are severing the chain of the old world at the root. The youth of Britain will no longer be raised by parents who remember the freedoms of the collapse. They will be raised by the state. In camps of the Rebirth Youth, they will learn that their first family is the Chancellory and their first mother is the Motherland. They will be taught to report sedition, to worship strength, and to carry the future in iron hands."
ENG_The_Eye_The_Fire_And_The_Ear:0 "The Eye, The Fire, and The Ear"
ENG_The_Eye_The_Fire_And_The_Ear_desc:0 "Safety is not a right; it is a reward for obedience. To ensure the peace of the new order, we must see what cannot be seen and hear what is whispered in the dark. We are establishing the Ministries of Oversight, the Eye to watch, the Ear to listen, and the Fire to strike. There will be no dark corners left in this kingdom where sedition can hide. Every street corner, every telephone line, and every dinner table is now a frontier of national security."
ENG_The_Ministry_Of_Public_Order:0 "The Ministry of Public Order"
ENG_The_Ministry_Of_Public_Order_desc:0 "It is time to make a point of the role of each of our factions and ensure that the public listens to everything we do. Everything we see, and most importantly, follow the rules of the Chancellor. The Ministry of Public Order will be the administrative fist that binds surveillance, enforcement, and obedience into one machine."
ENG_The_Finger:0 "The Finger"
ENG_The_Finger_desc:0 "The Eye sees. The Ear hears. But the Finger strikes. This is the operational arm of the Ministry, the secret police formation with physical removal at its core. There will be no trials, no lawyers, and no public records. When the Finger touches you, you simply cease to be a part of the British story."
ENG_The_Eye:0 "The Eye"
ENG_The_Eye_desc:0 "A citizen with nothing to hide has nothing to fear from the gaze of the state. We are saturating every urban centre, every rural high street, and every transit hub with the Omni-Lens network. The Eye will not blink, and in the New Britain the sun never sets on the Chancellor's watch."
ENG_The_Ear:0 "The Ear"
ENG_The_Ear_desc:0 "Silence is the breeding ground of doubt, and whispers are the seeds of treason. The Ear will be the secret conversation of the old world, recast through listening posts, informants, and data systems that strip privacy from the nation. Every word, every telephone line, and every dinner table is now a frontier of national security."
ENG_The_Voice_Of_Fate:0 "The Voice of Fate"
ENG_The_Voice_Of_Fate_desc:0 "The people do not want the truth; they want certainty. We will give them the Voice of Fate. Through every television, every radio, and every loudspeaker in the streets, the message of the Chancellory will be the only music they hear. We will feed them a daily bread of fear for the outside world and pride for the new order. They will learn that the world is dark and the old Britain is a broken dream. When they close their eyes at night, they will thank the Chancellor for their safety; when they wake, they will work for his glory."
ENG_The_Panopticon_Protocol:0 "The Panopticon Protocol"
ENG_The_Panopticon_Protocol_desc:0 "Privacy is the sanctuary of the traitor. The old world allowed the shadows to grow long, and in those shadows enemies of Britain plotted their downfall. We are bathing the land in the light of total observation. Through the Eye of a million lenses and the gaze of a billion sensors, the state will become an omnipresent guardian. We are not watching you to catch you; we are watching you to protect you from the darkness within."
ENG_The_Social_Purity_Act:0 "The Social Purity Act"
ENG_The_Social_Purity_Act_desc:0 "A healthy body cannot survive if it is riddled with parasites. The old world allowed the British bloodstream to be diluted and poisoned by the weak, the foreign, and the degenerate. Under the Social Purity Act, we begin the Great Cleansing. We are defining the biological standard of the British citizen and drawing a permanent line between the pure and the impure. Those who cannot conform will be removed, and those who resist will be silenced. Britain will be British, and every deviation will be treated as a threat to the strength of the nation."
ENG_The_Dissolution_Of_Secret_Societies:0 "The Dissolution of Secret Societies"
ENG_The_Dissolution_Of_Secret_Societies_desc:0 "There can be no brotherhoods but the national brotherhood. There can be no secrets from the state. For centuries the old elites hid behind private clubs, hidden lodges, and clandestine patronage. We are kicking in the doors of these networks and dissolving them into ash and memory. In the New Britain there is no inner circle. There is only the Chancellor and the People."
ENG_The_Decree_Of_Moral_Hygiene:0 "The Decree of Moral Hygiene"
ENG_The_Decree_Of_Moral_Hygiene_desc:0 "A nation is a biological engine, and an engine cannot run on contaminated fuel. Under the new Chancellory, the Great Hygiene Initiative will scrub the British soul clean of the filth of the old world. The weak, the degenerate, and the foreign remnant are not our brothers. They are contaminants to be identified, classified, and removed so that the seed of the New Age may grow without thorns. Purity is strength, and strength is life."
ENG_The_Splendid_Isolation_Decree:0 "The Splendid Isolation Decree"
ENG_The_Splendid_Isolation_Decree_desc:0 "The world beyond our white cliffs is a chamber house of chaos and liberal rot. Today we withdraw from their institutions and their expectations alike. Let the markets tremble and the ports fall silent if they must. Britain will stand alone, master of itself and answerable to none, until the day the outside world learns to fear our silence."
ENG_The_Formation_Of_The_Order_Of_The_Rebirth:0 "The Formation of the Order of the Rebirth"
ENG_The_Formation_Of_The_Order_Of_The_Rebirth_desc:0 "The regular army is for the defence of the borders, but the Order of the Rebirth is for the defence of the soul. They are the dream of our youth, forged in the fires of the High Chancellor. They are not police, not party guards, but warriors of purification whose task is to watch the nation from within and eliminate dissent before it can speak."
ENG_The_Total_War_Economy:0 "The Total War Economy"
ENG_The_Total_War_Economy_desc:0 "The time for comfort is over; the time for conquest is here. Every factory that once made toys will now make shells. Every shipyard that made luxury liners will now make battleships. Every drop of oil and every hour of labour will be bent to a single purpose: the forging of an iron kingdom that does not merely endure, but prepares to dominate."
ENG_Case_Emerald_The_Irish_Question:0 "Case Emerald: The Irish Question"
ENG_Case_Emerald_The_Irish_Question_desc:0 "A house divided cannot stand, and the map before us still bears an insult in green. For too long the Irish question has been treated as a problem to be managed rather than resolved. Under Case Emerald, every network of sympathy, every rebel link, and every obstacle to British control will be identified and removed. The Emerald Isle will return to the fold by decree or by force."
ENG_The_Pacification_Of_The_Pale:0 "The Pacification of the Pale"
ENG_The_Pacification_Of_The_Pale_desc:0 "The Republic was a dream that has ended in a nightmare of its own making. There is no 'Ireland' now; there is only the Western Province of the British State. We are not occupiers; we are the rightful owners returning to our land. Every rebel mouth will be silenced, every monument to rebellion levelled, and every child re-educated in the language of the Chancellor. To those who submit, there is a place in the New Order. To those who resist, there is only the silence of the reclamation pits."
ENG_The_Suppression_Of_The_Gaelic_Myth:0 "The Suppression of the Gaelic Myth"
ENG_The_Suppression_Of_The_Gaelic_Myth_desc:0 "A unified nation cannot speak with two tongues. The Gaelic dialect is a relic of a tribal, fractured past; a language of rebellion and regression. We will silence the bards and burn the grammar books. Every street sign in the Western Province will be written in the King's English; every Celtic knot will be unravelled to make room for the geometric perfection of the Rebirth. By the time this generation passes, the very sounds of the old tongue will be forgotten."
ENG_The_Plantation_Of_The_Loyalists:0 "The Plantation of the Loyalists"
ENG_The_Plantation_Of_The_Loyalists_desc:0 "The land belongs to those who have the strength to hold it and the loyalty to serve it. We are launching the Great Resettlement. Tens of thousands of loyal, standard-British families will be granted estates in the Western Province. They are not pioneers; they are the human wall that will ensure the West never falls again. The old world residents will be moved to the industrial labour camps of the North to serve the war machine, while Britain is replanted with sturdier, more loyal stock."
ENG_The_Labor_Categorization_Decree:0 "The Labor Categorization Decree"
ENG_The_Labor_Categorization_Decree_desc:0 "The inhabitants of the Western Province have forfeited their right to citizenship through centuries of defiance. We will no longer waste British resources on welfare for the ungrateful. Under this decree, every soul in the West is now a ward of the state. Those of sound body will be assigned to the National Labour Corps; those of questionable loyalty will be remanded to the reclamation centres. We are not employing a workforce. We are managing a resource."
ENG_The_Act_Of_Eternal_Union:0 "The Act of Eternal Union"
ENG_The_Act_Of_Eternal_Union_desc:0 "The Republic was a historical hallucination, a fever that has finally broken. There is no 'Ireland'. There is only the Western Extension of the Great British State. From this day forward, the word Ireland is struck from the lexicon of the loyal citizen. The border in the Irish Sea has been cauterized, and the wound is closed. Even Dublin shall henceforth be known as New London, an administrative heart of the Western Province. One King. One Chancellor. One Realm."
ENG_The_Damnatio_Memoriae:0 "The Damnatio Memoriae"
ENG_The_Damnatio_Memoriae_desc:0 "If a man has no memory, he has no reason to rebel. We are erasing the very conception of an Irish identity from the earth. It is now a category of crime to possess an Irish flag, a Gaelic book, or a record of the rebellion. We are tearing down the statues of their poets and replacing them with the iron busts of the High Chancellor. We will teach the children of the West that they have always been British, that their ancestors were merely confused, and that their only father is the State."
ENG_The_Iron_Pale:0 "The Iron Pale"
ENG_The_Iron_Pale_desc:0 "If the West is to be our forge, it must also be our fortress. We are raising the Iron Pale: a ring of concrete, barbed wire, and sensor arrays that will encircle the entire province. There will be no escape to the Atlantic, and no mercy for the fugitive. The Western Province is a closed system, a silent engine room where the only sounds permitted are the clatter of the loom and the roar of the furnace."
ENG_The_Black_Gold_Harvest:0 "The Black-Gold Harvest"
ENG_The_Black_Gold_Harvest_desc:0 "The harvest is ready. The Western Province has been broken, tilled, and replanted. The resistance is a memory, the culture is a ghost, and the people are a machine. From the peat bogs to the deep-water ports, every ounce of Irish energy now flows directly into the heart of London. We have done what a thousand years of kings could not: we have ended Ireland. The West is ours, body and soul. Now the High Chancellor looks east. The Channel is merely a wider trench, and the Continent is the next field to be ploughed."
ENG_The_Curfew_Of_The_Five_Cities:0 "The Curfew of the Five Cities"
ENG_The_Curfew_Of_The_Five_Cities_desc:0 "Order is not a suggestion; it is a physical constraint. The cities of the Western Province have long been breeding grounds for sedition. No more. Under the Curfew of the Five Cities, the streets belong to the state. No citizen may walk without a permit, no light shall burn after the Chancellor's hour, and the Order of the Rebirth will stand on every corner with rifles and masks. If a city whispers, we will make it scream. If it screams, we will make it silent."
ENG_The_Larkhill_West_Complex:0 "The Larkhill-West Complex"
ENG_The_Larkhill_West_Complex_desc:0 "The West has a fever that only the most sterile instruments can cure. We are establishing the Larkhill-West Administrative Zones: vast, electrified complexes where the old-world elements of the Irish population are processed for the safety of the state. Here the Social Purity standards are applied with clinical precision. Those who can be broken will be moulded into mindless labourers for our factories; those who cannot will be used to advance our understanding of the Yellow Fever protocols. In the silence of the midlands, the past is being burned away to fuel the future."
ENG_The_Decree_Of_Unified_Command:0 "The Decree of Unified Command"
ENG_The_Decree_Of_Unified_Command_desc:0 "Britain cannot be reborn while its armed forces still answer to rival ministries, old service traditions, and officers trained to hesitate. The Decree of Unified Command will bind every branch of the military into a single hierarchy directed from the Chancellory itself."
ENG_The_Purge_Of_The_Mess_Halls:0 "The Purge of the Mess Halls"
ENG_The_Purge_Of_The_Mess_Halls_desc:0 "The officer caste still shelters itself in private clubs, dining rooms, and whispered loyalties to the old kingdom. We will tear that world apart, removing every senior figure whose instincts remain with the dead order rather than the living state."
ENG_The_Dissolution_Of_The_Regiments:0 "The Dissolution of the Regiments"
ENG_The_Dissolution_Of_The_Regiments_desc:0 "Historic regimental identities are obstacles to total command. Their colours, titles, and local traditions will be dissolved into numbered formations so that soldiers remember only the state, the mission, and the Chancellor who commands both."
ENG_The_Scuttled_Remnants:0 "The Scuttled Remnants"
ENG_The_Scuttled_Remnants_desc:0 "Royalist holdouts and disloyal specialists who flee abroad or into hiding must be denied even the dignity of organised resistance. Their names will be erased, their contacts hunted, and their scattered remnants treated as refuse cast off by history."
ENG_The_Political_Commissariat:0 "The Political Commissariat"
ENG_The_Political_Commissariat_desc:0 "Every level of the armed forces will be fitted with political officers tasked with measuring zeal, reporting hesitation, and ensuring that operational competence never exists apart from ideological obedience."
ENG_The_Ministry_Of_Deterrence:0 "The Ministry of Deterrence"
ENG_The_Ministry_Of_Deterrence_desc:0 "The armed forces must learn that hesitation is not weakness but crime. The Ministry of Deterrence will turn scrutiny, review, and removal into permanent features of military life until doubt itself becomes professionally fatal."
ENG_The_Science_Of_Absolute_War:0 "The Science of Absolute War"
ENG_The_Science_Of_Absolute_War_desc:0 "Chivalry, restraint, and inherited professionalism belong to weaker ages. Britain will develop a new doctrine of annihilation, industrial war, and total operational dominance in which morality no longer limits the necessary exercise of force."
ENG_The_Rebirth_Officer_Academies:0 "The Rebirth Officer Academies"
ENG_The_Rebirth_Officer_Academies_desc:0 "The Gentleman Officer is finished. In his place we will educate commanders whose first instinct is ideological certainty, whose second is conquest, and whose loyalty begins and ends with the reborn state."
ENG_The_Sword_Of_The_Protector:0 "The Sword of the Protector"
ENG_The_Sword_Of_The_Protector_desc:0 "When command, doctrine, education, and ideology have all been fused into one military machine, Britain will finally possess the weapon the High Chancellor demands: a sword drawn in the name of total obedience and not to be sheathed until the world has been subdued into silence."
ENG_The_Downing_Street_Ultimatum:0 "The Downing Street Ultimatum"
ENG_The_Downing_Street_Ultimatum_desc:0 "The emergency will no longer masquerade as temporary. Downing Street will suspend what remains of the old democratic machinery and replace it with a direct administrative command structure optimized for obedience, speed, and political control."
ENG_The_World_Wide_Web:0 "The World Wide Web"
ENG_The_World_Wide_Web_desc:0 "Foreign platforms, foreign news, and foreign networks are now treated as hostile delivery systems for dissent and sanctions pressure. Britain will cut itself loose from the open web before the open web can keep reaching into Britain."
ENG_The_National_Intranet:0 "The National Intranet"
ENG_The_National_Intranet_desc:0 "The open internet will be replaced by a sealed domestic network under state supervision. News, payments, messaging, and records will pass through national filters so that communication itself becomes part of the administrative order."
ENG_St_Marys_Agricultural_Mandate:0 "The St. Mary's Agricultural Mandate"
ENG_St_Marys_Agricultural_Mandate_desc:0 "Britain will answer sanctions and import shortages by militarizing food policy. Fertilizer, machinery, and planting targets will be directed from the center so that agriculture serves national survival before private comfort."
ENG_The_Panopticon_Mandate:0 "The Panopticon Mandate"
ENG_The_Panopticon_Mandate_desc:0 "Surveillance will cease to be an exceptional measure and become a permanent basis of rule. Databases, cameras, and emergency access powers will be integrated so that the state can classify, flag, and watch the population continuously."
ENG_The_Yerbury_Process:0 "The Yerbury-Process"
ENG_The_Yerbury_Process_desc:0 "Oil scarcity will be met with a crash synthetic-fuel program built around shale, coal derivatives, and emergency industrial direction. Britain may become dirtier and harsher, but it will also become harder to choke from abroad."
ENG_The_Order_Of_The_Black_Guards:0 "The Order of the Black Guards"
ENG_The_Order_Of_The_Black_Guards_desc:0 "The regime needs a coercive force that begins loyal rather than being purged into loyalty later. The Black Guards will be expanded into a permanent paramilitary structure linking party enforcement, occupation duties, and internal security."
ENG_The_Officers_Blood_Oath:0 "The Officers' Blood-Oath"
ENG_The_Officers_Blood_Oath_desc:0 "Every officer trusted with this new order must swear personal loyalty to the Chancellor and the emergency state. Refusal will mark a man for removal; compliance will bind the services more tightly to political command."
ENG_The_Larkhill_West_Complexes:0 "The Larkhill-West Complexes"
ENG_The_Larkhill_West_Complexes_desc:0 "The western occupation system will be expanded into a broader network of guarded production, coerced labour, and militarized administration, turning provincial control into a repeatable instrument of the war state."
ENG_The_Damnatio_Memoriae_Campaign:0 "The Damnatio Memoriae"
ENG_The_Damnatio_Memoriae_Campaign_desc:0 "The regime will treat history as infrastructure. Archives, schools, commemorations, and public memory will be rewritten so that older Britains survive only where they can be made to legitimize the present one."
ENG_The_Sovereign_Synthesis:0 "The Sovereign Synthesis"
ENG_The_Sovereign_Synthesis_desc:0 "Surveillance, coercion, extraction, and political command will now operate as one system. The synthesized state is meant to survive isolation, suppress dissent, and reproduce its own emergency without needing the old order at all."
ENG_The_Atlantic_Wall_2_0:0 "The Atlantic Wall 2.0"
ENG_The_Atlantic_Wall_2_0_desc:0 "The first coalition fleets believed the sea alone would frighten us back into caution. They have misunderstood the scale of the regime's response. Southern Britain will be rebuilt as a defended machine of concrete, flak towers, buried relays, and kill-zones calibrated against the Channel approaches. This is not a temporary coastal alert. It is the conversion of the homeland into a permanent siege architecture designed to make every attempted landing look like an act of suicide."
ENG_Project_LEVIATHAN:0 "Project: LEVIATHAN"
ENG_Project_LEVIATHAN_desc:0 "The navy's old procurement logic belonged to an age of treaty habits and conventional prestige. Project LEVIATHAN abandons that mindset in favor of an undersea force optimized for attrition, interdiction, and sudden strikes against the coalition ring. Shipyards in the Scottish Lowlands will be bent toward submarine output and the fleet reorganized around the assumption that Britain may need to fight for its approaches from below the surface."
ENG_The_Scorched_Earth_Protocols:0 "The Scorched Earth Protocols"
ENG_The_Scorched_Earth_Protocols_desc:0 "If the enemy forces a landing, Britain will not greet it with intact roads, untouched depots, and orderly rear areas. The Scorched Earth Protocols turn every retreat line, magazine, and municipal works plan into a demolition script to be executed before the invader can profit. The regime would sooner blacken its own soil than allow a hostile army to inherit the material comforts of occupation."
ENG_The_Silly_Isles_Standoff:0 "The Silly Isles Standoff"
ENG_The_Silly_Isles_Standoff_desc:0 "The western approaches must cease to be treated as empty water. The outlying islands and Cornish approaches will become forward surveillance and strike platforms, extending Britain's reach into the Atlantic perimeter and forcing hostile fleets to operate under constant observation. What seems like a remote naval outpost is in fact a tripwire meant to make the first breach visible and punishable."
ENG_The_Vanguard_Of_Youth:0 "The Vanguard of Youth"
ENG_The_Vanguard_Of_Youth_desc:0 "The older officer caste still measures war against limits, memory, and private hesitation. The regime intends to replace that instinct with cadres raised inside its own political religion. Selected youth battalions will be pushed through accelerated militarization and ideological hardening so that the formations entering the field are not merely young, but fanatically aligned with the state's will."
ENG_The_Citizen_Soldier_Decree:0 "The Citizen-Soldier Decree"
ENG_The_Citizen_Soldier_Decree_desc:0 "The defense of the homeland will not be left to professionals alone. Under the decree, urban wards, county administrations, and party cells are reorganized into a mass auxiliary system capable of delaying, bleeding, and exhausting any landing force. Britain is to be defended not only by the army, but by a population drilled into obedience, armed readiness, and permanent local mobilization."
ENG_Fortress_London:0 "Fortress London"
ENG_Fortress_London_desc:0 "The capital can no longer exist as a ceremonial center open to peacetime routines. London will be remade into a fortified command city, its bridges and approaches engineered for denial, its public buildings repurposed for defense, and its streets integrated into a layered security grid. The political heart of the regime must now be able to withstand the military logic its own escalation has invited."
ENG_The_Larkhill_Ultimatum:0 "The Larkhill Ultimatum"
ENG_The_Larkhill_Ultimatum_desc:0 "The laboratories and restricted ranges at Larkhill are no longer being used merely to support the war effort. They are being fused into a deterrent message aimed directly at the coalition: any attack on Britain will be answered with methods severe enough to make victory feel indistinguishable from contamination. The ultimatum is strategic and psychological alike. The enemy is being warned that invasion itself may become the beginning of its ruin."

ENG_automated_coastal_defense_category:0 "Automated Coastal Defense"
ENG_automated_coastal_defense_category_desc:0 "The southern and eastern coasts are being folded into a semi-automated defense grid of towers, radar, flak, and layered fortification. The question is no longer whether Britain can fortify the shore, but which sectors will receive the next concentration of steel and power."
ENG_channel_turret_grid:0 "Deploy the Channel Turret Grid"
ENG_north_sea_flak_grid:0 "Expand the North Sea Flak Grid"
ENG_irish_retaliation_category:0 "Irish Retaliation Measures"
ENG_irish_retaliation_category_desc:0 "The Scouring has not ended the Irish problem; it has only turned the island into a harsher battlefield. The regime now has a standing menu of reprisals, quotas, and defensive measures through which to keep the Governorate under pressure."
ENG_black_guard_clearance_sweeps:0 "Black-Guard Clearance Sweeps"
ENG_enforce_governorate_quotas:0 "Enforce Governorate Quotas"
ENG_fortify_the_ulster_line:0 "Fortify the Ulster Line"

ENG_The_Dragon_Over_Westminister:0 "The Dragon Over Westminster"
ENG_The_Dragon_Over_Westminister_desc:0 "The impossible has happened. In a shock result that has sent the pound sterling into a freefall, Restore Britain has secured the largest number of seats in the House of Commons. Nigel Farage's Reform Party has been decimated, with voters defecting en masse to the only movement they believe has not compromised."
ENG_The_Reform_Mandate:0 "The Reform Mandate"
ENG_The_Reform_Mandate_desc:0 "The country has not voted for another caretaker stitch-up or a softer version of managed decline. Reform enters government with a direct popular mandate to break the habits of the post-Brexit establishment, centralize power in Downing Street, and turn electoral revolt into a governing doctrine."
ENG_Dismantle_The_Managed_State:0 "Dismantle the Managed State"
ENG_Dismantle_The_Managed_State_desc:0 "The quango labyrinth, the consultancy class, and the permanent advisory apparatus have insulated Whitehall from democratic pressure for too long. We will strip away the shadow-state of boards and agencies that turned every election promise into a polite briefing note and a delayed review."
ENG_A_National_Mandate_Government:0 "A National Mandate Government"
ENG_A_National_Mandate_Government_desc:0 "Reform was not elected to supervise national drift; it was elected to force a break. The Cabinet will be refashioned into an openly majoritarian government, one that treats parliamentary victory as authority to govern rather than an invitation to negotiate with every institutional veto player in Britain."
ENG_Border_Command_Without_Appeal:0 "Border Command Without Appeal"
ENG_Border_Command_Without_Appeal_desc:0 "The border regime must no longer be scattered between ministers, agencies, tribunals, and improvised hotel procurement schemes. A single chain of authority will govern entry, detention, and removal, with executive direction placed above the endless cycle of appeal and obstruction."
ENG_The_Reform_Civil_Service:0 "The Reform Civil Service"
ENG_The_Reform_Civil_Service_desc:0 "Whitehall cannot remain a neutral machine if neutrality simply means resistance to the elected government. Senior appointments, departmental incentives, and delivery targets will be rebuilt around political execution, loyalty to ministerial priorities, and visible policy results."
ENG_Britain_First_Reconstruction:0 "Britain First Reconstruction"
ENG_Britain_First_Reconstruction_desc:0 "The state will be reordered around visible national preference: local procurement, domestic infrastructure, and the principle that public investment should first reinforce British labor, British firms, and British communities. The language is blunt because the intended break is blunt."
ENG_The_Merit_Border_Code:0 "The Merit Border Code"
ENG_The_Merit_Border_Code_desc:0 "Immigration policy will be rewritten as a test of national advantage rather than universal entitlement. Entry, settlement, and status will be judged by utility, compliance, and cultural fit, with the government claiming that Britain must at last decide who is admitted on its own terms."
ENG_The_New_Patriotic_Consensus:0 "The New Patriotic Consensus"
ENG_The_New_Patriotic_Consensus_desc:0 "After years of apologetic Conservatism and procedural Labourism, Reform intends to define a new center of gravity in British politics. Patriotism, border control, and hostility to administrative liberalism are no longer campaign slogans; they become the default assumptions of government."
ENG_The_State_Of_The_Majority:0 "The State of the Majority"
ENG_The_State_Of_The_Majority_desc:0 "The government will act as if its voters are not an embarrassing problem to be managed but the core constituency around which the state itself should be arranged. Bureaucracy, policing, and the welfare system will be recast to serve a declared national majority rather than a universal civic abstraction."
ENG_The_Reform_Britain_Settlement:0 "The Reform Britain Settlement"
ENG_The_Reform_Britain_Settlement_desc:0 "This is the regime-forming moment Reform has spent years promising: a centralized executive, a politicized state machine, a hard border doctrine, and a permanent claim to speak for the real country against every intermediary institution that once diluted popular anger. The mandate is no longer electoral. It is constitutional."
ENG_The_Majority_Whips_Office:0 "The Majority Whip's Office"
ENG_The_Majority_Whips_Office_desc:0 "Coalition management is over. The parliamentary operation will be rebuilt around majority discipline, message control, and a chain of command that treats the Commons not as a forum for bargaining but as an instrument for executing the government's line at speed."
ENG_Commissioners_Into_The_Counties:0 "Commissioners Into the Counties"
ENG_Commissioners_Into_The_Counties_desc:0 "Local government is full of inherited veto points, soft resistance, and procedural delay. Reform will send political commissioners outward to monitor delivery, police obstruction, and ensure that the national mandate is enforced beyond Westminster rather than slowly suffocated in county chambers and municipal offices."
ENG_Rewrite_The_Broadcast_Rules:0 "Rewrite the Broadcast Rules"
ENG_Rewrite_The_Broadcast_Rules_desc:0 "If hostile editors, regulators, and legacy broadcasters can still frame every Reform move as an aberration, the mandate remains incomplete. The communications order must be rewritten so that the governing majority no longer speaks through institutions built to distrust it by reflex."
ENG_The_Patriotic_Managerial_State:0 "The Patriotic Managerial State"
ENG_The_Patriotic_Managerial_State_desc:0 "This route turns Reform's majority into a durable governing method rather than a permanent rally. Commissioners, disciplined whips, and a state apparatus tuned to national preference give the party a harder, more administrative grip on Britain without fully abandoning electoral respectability."
ENG_National_Compliance_Bureau:0 "National Compliance Bureau"
ENG_National_Compliance_Bureau_desc:0 "The governing majority will no longer rely on persuasion alone. A central compliance structure will monitor implementation, pressure reluctant institutions, and make sure the state's transmission belts run in the direction the mandate demands."
ENG_The_Reform_State:0 "The Reform State"
ENG_The_Reform_State_desc:0 "This is the next step beyond insurgency and even beyond office: the conversion of an electoral majority into a durable governing order. Parliament, local administration, communications, and the permanent machinery of state are to be aligned around Reform's claim to represent the country more authentically than the institutions it inherited."
ENG_The_Scottish_Endgame:0 "The Scottish Endgame"
ENG_The_Scottish_Endgame_desc:0 "The constitutional struggle in Scotland can no longer be left to rolling briefings and televised outrage. Reform must decide whether to break the nationalist challenge by force or outmanoeuvre it through a colder, more skilful settlement."
ENG_Backchannels_To_Bute_House:0 "Backchannels to Bute House"
ENG_Backchannels_To_Bute_House_desc:0 "Public confrontation only helps the SNP. Quiet contact, business intermediaries, and selective guarantees may still separate Swinney's room for manoeuvre from his public rhetoric."
ENG_Suspend_Holyrood_Completely:0 "Suspend Holyrood Completely"
ENG_Suspend_Holyrood_Completely_desc:0 "Enough half-measures. If devolution has become a platform for permanent constitutional blackmail, then Reform should cut directly at the institution rather than keep negotiating with it in public."
ENG_A_Fiscal_Pact_For_Scotland:0 "A Fiscal Pact for Scotland"
ENG_A_Fiscal_Pact_For_Scotland_desc:0 "A hard political compromise can still leave Westminster in command while giving Scotland enough practical autonomy, money, and face-saving space to pull the heat out of the streets."
ENG_Break_The_SNP_Machine:0 "Break the SNP Machine"
ENG_Break_The_SNP_Machine_desc:0 "The nationalist network must be hit as an organised political force, not merely argued with. Funding channels, local machines, and the patronage web around the SNP will all come under direct pressure."
ENG_The_Edinburgh_Accommodation:0 "The Edinburgh Accommodation"
ENG_The_Edinburgh_Accommodation_desc:0 "A durable deal with Scotland will require concessions Reform supporters dislike and constitutional craft Reform ministers rarely trust, but it can still prevent the union question from detonating outright."
ENG_The_Illegal_Edinburgh_Declaration:0 "The Illegal Edinburgh Declaration"
ENG_The_Illegal_Edinburgh_Declaration_desc:0 "If Reform keeps tightening the screw, Scotland may stop caring whether Westminster recognises the next move. The danger is no longer a lawful referendum, but a unilateral break led from Edinburgh itself."
ENG_The_Welsh_Question:0 "The Welsh Question"
ENG_The_Welsh_Question_desc:0 "Wales is not at the same breaking point as Scotland or Northern Ireland, but Reform still has to decide whether to cool the protests with concessions or treat them as another front in the battle for a more centralized state."
ENG_The_Cardiff_Civic_Compact:0 "The Cardiff Civic Compact"
ENG_The_Cardiff_Civic_Compact_desc:0 "A narrow agreement with Welsh institutions, local councils, and civic bodies can drain momentum from the protest wave without requiring Reform to admit strategic retreat."
ENG_Police_The_Welsh_Protests_Hard:0 "Police the Welsh Protests Hard"
ENG_Police_The_Welsh_Protests_Hard_desc:0 "The demonstrations will be handled as a public-order problem rather than a constitutional one. Roads stay open, occupations are cleared, and protest leaders learn that Cardiff will not set the limits of Westminster's authority."
ENG_The_Cardiff_Settlement:0 "The Cardiff Settlement"
ENG_The_Cardiff_Settlement_desc:0 "With enough quiet bargaining and selective respect for Welsh institutions, Reform can reduce the protests to resentment rather than rebellion and keep Wales politically noisy but manageable."
ENG_The_Discipline_Of_Cardiff:0 "The Discipline of Cardiff"
ENG_The_Discipline_Of_Cardiff_desc:0 "A hard policing model can restore surface order in Wales, but it does so by forcing the protest movement back rather than persuading it. The streets quiet down; the grievance remains."
ENG_The_Irish_Endgame:0 "The Irish Endgame"
ENG_The_Irish_Endgame_desc:0 "Northern Ireland is turning into the most combustible part of Reform's constitutional project. London can either restore enough political balance to steady it, or try to impose order until the whole settlement snaps."
ENG_Quiet_Talks_With_Dublin:0 "Quiet Talks with Dublin"
ENG_Quiet_Talks_With_Dublin_desc:0 "The Irish question cannot be handled by slogans alone. Informal channels with Dublin and local parties may still rebuild a working arrangement before brinkmanship becomes an irreversible constitutional defeat."
ENG_Seal_The_Border_Completely:0 "Seal the Border Completely"
ENG_Seal_The_Border_Completely_desc:0 "If softness only encourages escalation, the answer is visible control. The crossings, the security posture, and the symbolic line of British sovereignty will all be tightened at once."
ENG_A_New_Stormont_Working_Arrangement:0 "A New Stormont Working Arrangement"
ENG_A_New_Stormont_Working_Arrangement_desc:0 "A stable Northern Ireland will require London to restore enough political give, administrative balance, and private coordination to keep every faction invested in a settlement short of rupture."
ENG_Direct_Rule_At_All_Costs:0 "Direct Rule at All Costs"
ENG_Direct_Rule_At_All_Costs_desc:0 "If power-sharing is treated as weakness, Reform can instead govern the province in the blunt language of command. The risk is that every show of strength also strengthens the case for leaving the union."
ENG_The_Belfast_Reset:0 "The Belfast Reset"
ENG_The_Belfast_Reset_desc:0 "Through discipline, compromise, and quiet bargaining, Reform can still pull Northern Ireland back from the edge and deny Sinn Féin the constitutional shock it has been waiting for."
ENG_The_United_Ireland_Shock:0 "The United Ireland Shock"
ENG_The_United_Ireland_Shock_desc:0 "A maximal crackdown may not save British authority in Ulster. It may instead destroy the last belief that the union can only be changed with London's blessing, and hand Irish unification its moment."
ENG_The_Self_Serving_Act:0 "The Self-Serving Act"
ENG_The_Self_Serving_Act_desc:0 "The Progressive Alliance claims to speak for the 'people,' but look at their record. They spent the last decade voting for their own pay rises while the Red Wall crumbled. We will introduce the Public Service Accountability Act, stripping former MPs of their lucrative 'Gold-Plated' pensions if they are found to have 'subverted' the national interest. If the Alliance wants to strike, let them do it without a taxpayer-funded safety net."
ENG_The_Blood_and_Soil_Agricultural_Act:0 "The Blood and Soil Agricultural Act"
ENG_The_Blood_and_Soil_Agricultural_Act_desc:0 "For too long, our farmers have been forced to prioritize 'carbon targets' over British crops. We are scrapping all Net Zero agricultural mandates. We will redirect those funds into the Ancestral Land Grant, providing massive subsidies to British-born farmers."
ENG_Reclaim_the_Streets:0 "Reclaim the Streets"
ENG_Reclaim_the_Streets_desc:0 "The Progressive Alliance and the 'London Commune' are attempting to grind the country to a halt through strikes and blockades. We will not negotiate. We will authorize the National Police to use 'proactive measures' to clear the streets. If the courts try to stop us, we will ignore them. Order must be restored by any means necessary."
ENG_The_Hostile_Repatriation_Directive:0 "The Hostile Repatriation Directive"
ENG_The_Hostile_Repatriation_Directive_desc:0 "The era of 'soft borders' and 'asylum hotels' is over. We will not just stop the boats; we will clear the backlog. The Home Office is authorized to begin the Great Repatriation, deporting all illegal arrivals and foreign criminals within 48 hours of identification. No appeals, no legal aid, and no 'human rights' excuses. Britain is a home for the British, not a transit lounge for the world."
ENG_The_British_First_Welfare_Code:0 "The British First Welfare Code"
ENG_The_British_First_Welfare_Code_desc:0 "Citizenship has been treated like a coupon in a cereal box. No more. We will repeal the current naturalisation laws. All foreign nationals currently on the path to citizenship will have their wait time increased to 20 years. To qualify, they must pass an 'Advance UK Loyalty' test and show zero history of receiving state benefits. Britain is a prize to be earned, not a right to be claimed."
ENG_Protect_the_Schools:0 "Protect the Schools"
ENG_Protect_the_Schools_desc:0 "Our children's minds are the front line of the cultural war. We will ban 'Gender Ideology' and 'Critical Race Theory' from all state schools. In their place, we will introduce a National Advance UK Curriculum, focusing on British exceptionalism, the virtues of the Empire, and traditional family structures. We are raising the next generation of patriots."
ENG_The_Hostile_Environment_2_0:0 "The Hostile Environment 2.0"
ENG_The_Hostile_Environment_2_0_desc:0 "We will make it impossible for those here illegally to exist in our society. We will ban any bank, landlord, or employer from interacting with anyone without an 'Advance UK ID Card.' We aren't just deporting people; we are creating a society where the unwanted have no choice but to leave voluntarily."
ENG_The_Unitary_Restoration_Act:0 "The Unitary Restoration Act"
ENG_The_Unitary_Restoration_Act_desc:0 "The experiment of the 1990s has failed. Devolution was a bribe to separatists that only fed their hunger for more. Today, we repeal the 1998 Acts. The buildings in Holyrood and Cardiff Bay will be 'cleared of their assemblies' and repurposed for the National Police and Federal Administration. From now on, there is one First Minister - there is only the Prime Minister of a single, indivisible British state."

ENG_The_Tri_Party_Concordat:0 "The Tri-Party Concordat"
ENG_The_Tri_Party_Concordat_desc:0 "Politics as usual is dead. To survive the coming storm, we must put aside the tribalism of the past decade. By formalizing a power-sharing agreement between the Greens, the Lib Dems, and Labour, we present a united front against Reformist interference. City Hall will be a coalition of competence - a sanctuary for the status quo in an age of radical chaos."
ENG_The_Globalist_Anchor:0 "The Globalist Anchor"
ENG_The_Globalist_Anchor_desc:0 "The 'New City Compact' is a death sentence for our financial services. The Treasury wants to raid the Square Mile to fund their northern vanity projects. We will offer the banks something Westminster cannot: stability. By guaranteeing a 'Regulatory Safe Zone' within the city limits, we ensure that the engines of our economy stay here, rather than fleeing to Dubai or Frankfurt."
ENG_The_Green_Ringfence:0 "The Green Ringfence"
ENG_The_Green_Ringfence_desc:0 "Every penny paid by a London driver should stay with a Londoner. We are ending the practice of sending our transport revenue to the national pot. This 'Social Resilience Fund' will be used to insulate our homes and fix our schools, protecting our city's infrastructure from the austerity being imposed on the rest of the UK by the coalition."
ENG_The_Brussels_Office:0 "The Brussels Office"
ENG_The_Brussels_Office_desc:0 "If the Prime Minister wants to treat the EU as an enemy, he can do so alone. London is a global city, and we will maintain our own direct diplomatic line to Brussels. By establishing a permanent mission in the heart of Europe, we can bypass the 'Brussels Protocol' and negotiate 'London-Only' equivalence for our tech and finance sectors. We are a city-state in all but name."
ENG_The_Strategic_Reserve:0 "The Strategic Reserve"
ENG_The_Strategic_Reserve_desc:0 "We have seen the rhetoric coming from the Reform backbenches - they talk of 'sieges' and 'blockades.' We will not be caught off guard. We are converting disused dockland warehouses into strategic reserves for medicine and essential goods. If Westminster tries to starve us into submission, London will have the strength to hold out until the coalition collapses under its own weight."
ENG_The_London_Charter_Of_Rights:0 "The London Charter of Rights"
ENG_The_London_Charter_Of_Rights_desc:0 "If Westminster chooses to abandon the European Convention on Human Rights, London will not follow them into the dark. We are codifying our own local Bill of Rights. This legal 'Shield' ensures that no Londoner can be subjected to biometric tracking or 'Common Sense' policing without a warrant from a London-appointed judge. We will keep our citizens' data out of Farage's hands."

ENG_The_Scottish_Pacification:0 "The Scottish Pacification"
ENG_The_Scottish_Pacification_desc:0 "Scots law has stood apart for centuries. We will end that duality by folding Scotland's legal institutions into a single British framework and restoring direct constitutional control from Westminster."
ENG_Dissolve_the_Scottish_Civil_Service:0 "Dissolve the Scottish Civil Service"
ENG_Dissolve_the_Scottish_Civil_Service_desc:0 "A parallel bureaucracy cannot survive in a unitary state. Senior offices in Edinburgh will be dissolved, departments merged into Whitehall chains of command, and policy authority returned to central ministries."
ENG_Repeal_the_Scotland_Act:0 "Repeal the Scotland Act"
ENG_Repeal_the_Scotland_Act_desc:0 "The devolution settlement is formally reversed. Legislative competence returns to Westminster, and the legal basis for autonomous Scottish governance is removed in favor of one sovereign parliament."
ENG_The_New_Enlightenment_Schools:0 "The New Enlightenment Schools"
ENG_The_New_Enlightenment_Schools_desc:0 "A new national curriculum will replace regional education frameworks, with common standards in history, civics, and language policy. The objective is a single civic identity taught consistently across the realm."
ENG_Abolish_the_Court_of_Session:0 "Abolish the Court of Session"
ENG_Abolish_the_Court_of_Session_desc:0 "Scotland's highest civil court will be wound down and its powers transferred to a unified British appellate hierarchy. Justice remains available, but no separate constitutional lane remains."
ENG_The_North_Britain_Initiative:0 "The North Britain Initiative"
ENG_The_North_Britain_Initiative_desc:0 "Administration, signage, and public institutions will be standardized under a North Britain framework to reinforce territorial cohesion. The era of symbolic ambiguity is over; the state speaks with one voice."
ENG_Re_Integrate_the_Kirk:0 "Re-Integrate the Kirk"
ENG_Re_Integrate_the_Kirk_desc:0 "Ecclesiastical exceptionalism is replaced by state-supervised integration. Church governance is aligned with national institutions to ensure religious administration supports constitutional unity."

ENG_The_Welsh_Re_Integration:0 "The Welsh Re-Integration"
ENG_The_Welsh_Re_Integration_desc:0 "Wales will be brought back under direct constitutional administration, ending fragmented authority between Cardiff and Westminster. Governance, funding, and security policy return to central control."
ENG_Dissolve_the_Senedd:0 "Dissolve the Senedd"
ENG_Dissolve_the_Senedd_desc:0 "The devolved legislature in Cardiff Bay is dissolved and its competencies absorbed by Westminster departments. Legislative uniformity takes precedence over regional autonomy."
ENG_The_Marcher_Industrial_Zones:0 "The Marcher Industrial Zones"
ENG_The_Marcher_Industrial_Zones_desc:0 "Large-scale industrial corridors will be built along the Marches to bind Wales and England through logistics, energy, and heavy manufacturing. Economic integration will make political separation impractical."
ENG_Repeal_the_Welsh_Language_Act:0 "Repeal the Welsh Language Act"
ENG_Repeal_the_Welsh_Language_Act_desc:0 "Bilingual administrative mandates are repealed and state services move to a single operational language standard. Officials frame the change as streamlining governance and reducing institutional duplication."
ENG_Standardize_the_Eisteddfod:0 "Standardize the Eisteddfod"
ENG_Standardize_the_Eisteddfod_desc:0 "National cultural festivals are retained but reorganized under central oversight, with funding tied to civic integration goals. Regional tradition remains, but within a single state narrative."
ENG_The_Cambrian_Heart_Decree:0 "The Cambrian Heart Decree"
ENG_The_Cambrian_Heart_Decree_desc:0 "This decree codifies Wales as an integral and non-separable part of the British constitutional order. Administrative, cultural, and security reforms are fused into one permanent settlement."

ENG_Abolish_the_Stormont_Executive:0 "Abolish the Stormont Executive"
ENG_Abolish_the_Stormont_Executive_desc:0 "Power-sharing in Northern Ireland is terminated and executive authority is reassigned to direct UK governance. London now governs the province without devolved coalition constraints."
ENG_Repeal_the_Good_Friday_Consensus:0 "Repeal the Good Friday Consensus"
ENG_Repeal_the_Good_Friday_Consensus_desc:0 "The old settlement is replaced with a unilateral constitutional framework centered on Westminster sovereignty. Institutions built around permanent vetoes are dismantled in favor of direct rule."
ENG_Dismantle_the_Peace_Walls:0 "Dismantle the Peace Walls"
ENG_Dismantle_the_Peace_Walls_desc:0 "Segregation barriers are removed and replaced by permanent national security zones under central command. The government presents this as ending enclave politics through enforced territorial control."
ENG_The_Civil_Loyalty_Oath:0 "The Civil Loyalty Oath"
ENG_The_Civil_Loyalty_Oath_desc:0 "Teachers, civil servants, and public office holders must swear an oath to the King and the UK state. Access to public roles is tied to formal constitutional loyalty."
ENG_Ban_the_Foreign_Flag:0 "Ban the Foreign Flag"
ENG_Ban_the_Foreign_Flag_desc:0 "Public display of political flags deemed separatist or paramilitary is prohibited under national order statutes. The policy is designed to suppress competing sovereignty claims in contested spaces."
ENG_The_One_Ireland_Blockade:0 "The One-Ireland Blockade"
ENG_The_One_Ireland_Blockade_desc:0 "The government enacts a comprehensive legal and security barrier against constitutional unification initiatives. Trade, administration, and policing are aligned to lock Northern Ireland permanently into UK structures."

ENG_The_Proclamation_of_the_Second_Commonwealth:0 "The Proclamation of the Second Commonwealth"
ENG_The_Proclamation_of_the_Second_Commonwealth_desc:0 "The restructured state is formally proclaimed: centralized, unitary, and ideologically cohesive. Devolution is ended, emergency reforms are codified, and the new constitutional order is declared irreversible."






###ideas#


Professional_Vanguard:0 "Professional Vanguard"
The_Common_Sense_Consensus:0 "The Common Sense Consensus"
The_City_State_Partnership:0 "The City-State Partnership"
The_Progressive_Triple_Lock:0 "The Progressive Triple-Lock"
The_Progressive_Triple_Lock_desc:0 "A formal coalition compact between Labour, the Liberal Democrats, and the Greens binds policy through a shared constitutional, social, and environmental agenda. The alliance offers broad legitimacy and coordinated governance at a critical moment."
The_Green_Chancellor:0 "The Green Chancellor"
The_Green_Chancellor_desc:0 "Energy policy is placed under Green leadership, accelerating the renewable transition and innovation agenda. The program boosts long-term modernization but strains coalition unity in the short term."
Representative_Democracy:0 "Representative Democracy"
Representative_Democracy_desc:0 "The referendum has broken the era of safe seats and winner-takes-all mandates. Coalition governance becomes the norm, widening legitimacy and reducing democratic distortion."
Giga_Factory_Gamble:0 "The Giga-Factory Gamble"
Giga_Factory_Gamble_desc:0 "State-backed guarantees unlock private capital for a new industrial buildout. Infrastructure deployment accelerates as green manufacturing scales in former post-industrial regions."
The_Brussels_Thaw:0 "The Brussels Thaw"
The_Brussels_Thaw_desc:0 "A durable UK-EU stability pact restores confidence, improves market access, and deepens technical cooperation. Trade and research ties tighten as the diplomatic freeze ends."



