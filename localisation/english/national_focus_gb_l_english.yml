 ENG_coastal_patrol_desc:0 ""
 ENG_hedgehog_defence:0 "Hedgehog Defence"
 ENG_hedgehog_defence_desc:0 "The military must be able to defend the nation from any threat, through a large expansion of our anti-air umbrella we can prevent any invasion from getting a foothold."
 ENG_diversity_is_our_strength:0 "Diversity is our Strength"
 ENG_diversity_is_our_strength_desc:0 "No matter what ethnicity or nation of birth we will allow our people to defend the nation."
