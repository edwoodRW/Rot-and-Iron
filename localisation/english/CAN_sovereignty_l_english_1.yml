# NEW FOLLOW-UP EVENTS
###########################################################

 CAN_carney_implementation.1.t: "Implementing the Framework"
 CAN_carney_implementation.1.d: "§IOttawa, Ministry of International Trade§!\n\n§R\"Prime Minister, I understand the concerns about the timeline. I do. But we have an opportunity here that comes once in a generation. The Americans are ready to talk. They're ready to deal. If we move now, if we show them we're serious about this framework, we can set terms that work for Canada.\n\nTrade barriers down within six months. Regulatory harmonization within the year. Cross-border investment flowing both ways instead of just one. This isn't surrender — it's leverage.\n\nThe unions will complain. I know they will. But the alternative is watching Ontario manufacturing die a slow death while Michigan and Ohio thrive. We can protect Canadian workers by giving them access to the biggest market on earth.\n\nI need you to hold the line. Let me do my job. Let me build something that lasts.\"§!"
 CAN_carney_implementation.1.a: "Proceed with the framework."

 CAN_carney_economic_reforms.1.t: "The Bay Street Blueprint"
 CAN_carney_economic_reforms.1.d: "§IToronto Financial District§!\n\n§R\"I've spent thirty years in global finance. I know how capital moves. I know what investors look for. And I can tell you with certainty: Canada has been leaving money on the table for decades.\n\nWhat we're doing here isn't radical. It's common sense. Remove the barriers that keep American investment out. Streamline the regulatory maze that makes Canadian businesses uncompetitive. Give our companies the same tax environment their competitors enjoy south of the border.\n\nThe unions call it deregulation. I call it modernization. The CCF calls it surrender to American capital. I call it access to the deepest capital markets in the world.\n\nWe can be the bridge between North American enterprise and Canadian values. But first we have to be open for business. Real business. Not the protectionist fantasy we've been living in.\"§!"
 CAN_carney_economic_reforms.1.a: "The market decides."

 CAN_angus_industrial_nationalization.1.t: "The Nationalization Program"
 CAN_angus_industrial_nationalization.1.d: "§IHamilton Steel Belt§!\n\n§R\"I stood on picket lines in Hamilton for eighteen months. I watched men who had given their lives to those mills being told they were expendable. I watched shareholders who had never set foot in Ontario deciding the fate of communities that had existed for generations.\n\nNo more.\n\nThese industries are too important to be governed only by distant balance sheets. They have to serve the people who work in them, the towns built around them, and the country that depends on them. If that means Ottawa takes a stronger hand in strategic sectors, then that is what Ottawa will do.\n\nWe're not abolishing Canada's economy. We're rebalancing it. Toward labour, toward community, and toward a national interest bigger than quarterly returns.\n\nThat work starts now.\"§!"
 CAN_angus_industrial_nationalization.1.a: "Strategic industry needs public direction."

 CAN_boris_naval_expansion.1.t: "The Halifax Expansion"
 CAN_boris_naval_expansion.1.d: "§IHalifax Dockyards§!\n\n§R\"Look at them! Three thousand shipyard workers hired in six months. Four new dry docks breaking ground. The first keels of a proper Canadian fleet being laid as we speak.\n\nI know what the Treasury says. I know what the cost looks like on paper. But let me tell you what I see when I walk these yards — I see pride. I see purpose. I see men and women who know they're building something that matters.\n\nCanada cannot defend herself with fishing boats and good intentions. We need hulls in the water. We need ships that can patrol the Arctic. We need a navy that can protect our coasts and project power if necessary.\n\nThe imperial dream? No. This is the Canadian dream. A nation that controls her own waters. A country that can stand on her own feet. The fleet will sail, Conrad. I promise you that.\"§!"
 CAN_boris_naval_expansion.1.a: "Full steam ahead."

 CAN_saganash_compromise.1.t: "A Compromise Position"
 CAN_saganash_compromise.1.d: "§IOttawa, Parliament Hill Corridor§!\n\n§R\"Conrad, I'm not going to pretend this is what I wanted. I asked for a seat at the cabinet table. I asked for a real voice in how this country is run. What you're offering me is a junior ministry with a fancy title.\n\nBut I've been in politics long enough to know that sometimes you take what you can get and make it work.\n\nNorthern Affairs. Indigenous consultation. Territorial defence. These are important files. They matter to my people. They matter to the future of this country. If I can build something real in this portfolio, if I can show that Indigenous voices belong at the heart of Canadian decision-making, then maybe that opens the door for something more.\n\nIt's not everything. But it's something. And I will make it count.\"§!"
 CAN_saganash_compromise.1.a: "Better than nothing."

 CAN_northern_affairs_setup.1.t: "The Northern Shield Initiative"
 CAN_northern_affairs_setup.1.d: "§IOttawa, Department of Northern Affairs§!\n\n§R\"My grandfather trapped in these lands for forty years. He knew every river, every lake, every migration path. He could navigate the Barrenlands by starlight and never lose his way.\n\nThe government in Ottawa has treated the North as a resource frontier and a strategic afterthought for too long. That changes now.\n\nWe're building a partnership. First Nations leading on development. Indigenous knowledge shaping defence planning. Northern communities deciding their own future instead of having it decided for them in boardrooms they've never seen.\n\nThe Arctic is ours. Not to exploit, but to protect. Not to dominate, but to steward. This isn't just about sovereignty — it's about respect. And it's long overdue.\"§!"
 CAN_northern_affairs_setup.1.a: "The North matters."

###########################################################
# ADDITIONAL FOLLOW-UP EVENTS
###########################################################

 CAN_mogg_lobbying_campaign.1.t: "The Quiet Campaign"
 CAN_mogg_lobbying_campaign.1.d: "§IOttawa, Back corridors§!\n\n§R\"I've been in this business a long time. I know when to fight openly and when to work the corridors. Conrad Black thinks he's won because he gave a speech and fired me from cabinet. He's mistaken.\n\nThe Reclamation is not dependent on one man's position. It's dependent on the will of the British people — and the British exiles who remember who they are.\n\nI'm building something. Quietly. Methodically. Private meetings with MPs who still believe in the cause. Conversations in the clubs where the real decisions are made. Strategic leaks to remind the public what we stand for.\n\nNot an open revolt. Not yet. But a pressure group. A reminder that there are still Canadians who remember their obligations. That the path home hasn't been abandoned — merely delayed.\"§!"
 CAN_mogg_lobbying_campaign.1.a: "The opposition organizes."

 CAN_backbench_tension.1.t: "The Backbench Restless"
 CAN_backbench_tension.1.d: "§IParliament Hill, Government Caucus§!\n\n§R\"I don't like what I'm hearing, Conrad. The backbench is restless. They're hearing whispers — Jacob is preparing a challenge, you're going soft on the Americans, the sovereignty address was a mistake.\n\nI know most of it is nonsense. But nonsense repeated often enough starts sounding like truth. And these are the people who need to show up for confidence votes. The people who need to defend you in their ridings.\n\nYou need to address them directly. Remind them why they're in this party. Remind them what we're building. Show them that the Prime Minister still has a vision for Canada — and that it's worth fighting for.\n\nThe majority isn't as solid as it looks. Not anymore.\"§!"
 CAN_backbench_tension.1.a: "Reassert authority."

 CAN_carney_economic_reforms.2.t: "The Bay Street Implementation"
 CAN_carney_economic_reforms.2.d: "§IToronto Financial District§!\n\n§R\"The framework is working. Trade barriers down within six months — ahead of schedule. Regulatory harmonization proceeding faster than expected. The first round of Washington talks concluded with actual progress instead of diplomatic theatre.\n\nI know the unions are preparing for battle. I know they see this as American surrender. But let me show you the numbers — cross-border investment up forty percent. Ontario manufacturing orders up twenty-five percent. Real jobs for real workers.\n\nThis isn't ideology. It's arithmetic. Canada can be the economic bridge between North American enterprise and Canadian values. But only if we're willing to walk across that bridge instead of standing on our side yelling about how tall it is.\n\nThe transformation has begun. There's no going back.\"§!"
 CAN_carney_economic_reforms.2.a: "The market decides."

 CAN_carney_economic_reforms.3.t: "Attracting Foreign Investment"
 CAN_carney_economic_reforms.3.d: "§IToronto Financial District§!\n\n§RAmerican capital is flowing into Ontario at a rate nobody predicted a year ago. Carney's technocrats call it validation. His critics call it a mortgage on the country's future. Either way, the balance sheet is undeniable, and the Prime Minister's office has stopped pretending it doesn't notice.§!"
 CAN_carney_economic_reforms.3.a: "The numbers speak for themselves."

 CAN_angus_industrial_nationalization.2.t: "The Great Nationalization"
 CAN_angus_industrial_nationalization.2.d: "§IHamilton Steel Belt§!\n\n§R\"The first stage is done. Arbitration has held. The plants are running. The papers are still furious, which probably means we're on the right track.\n\nLet me be clear about what this is and what it isn't. This is not some fantasy of permanent emergency rule. This is democratic government deciding that steel, energy, and strategic production matter too much to be treated as abstractions in a Toronto boardroom.\n\nWe will pay people fairly. We will run these industries competently. And we will remember that the point of an economy is not to impress capital. It is to support a country.\"§!"
 CAN_angus_industrial_nationalization.2.a: "Labour and government can build this together."

 CAN_angus_industrial_nationalization.3.t: "Public Works for the People"
 CAN_angus_industrial_nationalization.3.d: "§IOttawa, Ministry of Public Works§!\n\n§RAngus's public works program breaks ground in a dozen ridings at once — roads, schools, hospitals, all of it built by Canadian labour under Canadian union contracts. The photographs practically write the next election campaign for him.§!"
 CAN_angus_industrial_nationalization.3.a: "Built by the people, for the people."

 CAN_boris_naval_expansion.2.t: "The Imperial Fleet"
 CAN_boris_naval_expansion.2.d: "§IHalifax Dockyards§!\n\n§RThe first battlecruiser-class hull is laid down to full ceremony, bands playing and Boris Johnson practically climbing the scaffolding himself to inspect the keel plates. Whatever else people say about him, nobody doubts he means every word about the fleet.§!"
 CAN_boris_naval_expansion.2.a: "Let the fleet grow."

 CAN_boris_naval_expansion.3.t: "The Dominion Network"
 CAN_boris_naval_expansion.3.d: "§IOttawa, Department of National Defence§!\n\n§RRoads, rail, and supply depots now link the new dockyards to the rest of the Dominion. Boris calls it the backbone of an imperial navy that can actually deploy when it matters, not just look impressive at anchor.§!"
 CAN_boris_naval_expansion.3.a: "A navy that can move."

###########################################################
# POLICY EVENT FOLLOW-UPS
###########################################################

 CAN_black_implementation.1.t: "The Canada First Doctrine"
 CAN_black_implementation.1.d: "§IOttawa, Cabinet Room§!\n\n§R\"Gentlemen, let me be clear about what we're building here. Canada is not a stepping stone for other people's wars. We are not a dependent economy serving distant capitals. We are a sovereign nation, and we will behave like one.\n\nSelf-sufficiency in critical industries. Heavy defence of our territory. Economic autonomy so that no foreign power can pressure us by threatening our trade. This isn't isolationism — it's independence.\n\nI know some of you have concerns about the cost. I know others worry about our obligations. But let me tell you what the alternative looks like — Canada as a permanent vassal state, always dancing to someone else's tune, always bleeding for someone else's cause.\n\nThat ends today. The era of Canadian sovereignty begins not with speeches, but with steel and concrete.\"§!"
 CAN_black_implementation.1.a: "Canada stands alone."

 CAN_black_implementation.2.t: "Fortress North America"
 CAN_black_implementation.2.d: "§IOttawa, Department of National Defence§!\n\n§RThe first concrete has been poured. Fortress North America is no longer a slogan on Black's desk — it is bunkers on the border, radar stations on the coast, and a doctrine of self-reliance written into law. The cabinet watches the plans unfold with cautious pride.§!"
 CAN_black_implementation.2.a: "Let the work continue."

 CAN_black_implementation.3.t: "North American Fortress"
 CAN_black_implementation.3.d: "§IOttawa, Cabinet Room§!\n\n§RThe anti-air batteries are manned, the border infrastructure complete. Black's ministers report that Canada's approaches are, for the first time in living memory, genuinely defensible without relying on a single foreign garrison.§!"
 CAN_black_implementation.3.a: "A fortress worthy of the name."

 CAN_black_implementation.4.t: "Domestic Industry"
 CAN_black_implementation.4.d: "§IHamilton, Industrial Belt§!\n\n§RNew industrial complexes rise where Black promised them. Canadian steel, Canadian machine tools, Canadian factories — the self-sufficiency he preached is starting to look like a balance sheet instead of a speech.§!"
 CAN_black_implementation.4.a: "Canada builds for Canada."

 CAN_black_implementation.5.t: "The Fortress Economy"
 CAN_black_implementation.5.d: "§IOttawa, Cabinet Room§!\n\n§R\"Gentlemen, look at what we have built. A defended border. A domestic industry that answers to Ottawa, not to London or Washington. A country that can feed, arm, and defend itself without asking anyone's permission.\n\nThis is the Canada First doctrine made real — not a speech, not a promise, but steel, concrete, and full order books from coast to coast.\"§!"
 CAN_black_implementation.5.a: "Canada, fully sovereign at last."

 CAN_mogg_implementation.1.t: "The Great Reclamation"
 CAN_mogg_implementation.1.d: "§IHalifax, Exile Community Hall§!\n\n§R\"Twenty-seven years! Twenty-seven years we have waited in this foreign land, watching our homeland fall to darkness, nursing the wound that never heals!\n\nThey told us to be patient. They told us to build new lives. They told us that Britain was gone and that we should accept our exile. I say NO!\n\nThe home islands still stand. The British people still remember who they are. And we — we who kept the flame burning when all seemed lost — we shall be the instrument of their liberation!\n\nThe armada will be built! The crusade will begin! Canada shall be the sword that strikes back at the darkness, the shield that protects the faithful, the bridge that carries our people home!\n\nWe are going home, my friends. We are going home!\"§!"
 CAN_mogg_implementation.1.a: "We are going home."
 CAN_mogg_implementation.2.t: "The Great Armada"
 CAN_mogg_implementation.2.d: "§IHalifax Dockyards§!\n\n§RThe keels are laid. Rees-Mogg's promised armada is no longer a rally-hall slogan — it is steel on the slipways, exile veterans drilling on the docks, and a fleet that grows larger by the week.§!"
 CAN_mogg_implementation.2.a: "The crusade takes shape."

 CAN_mogg_implementation.3.t: "Amphibious Training"
 CAN_mogg_implementation.3.d: "§IHalifax Dockyards§!\n\n§RExile veterans and young Canadian recruits drill together on the beaches south of Halifax, rehearsing the landings they mean to make on English shores. For the first time, the Reclamation looks less like a dream and more like an order of battle.§!"
 CAN_mogg_implementation.3.a: "Practice for the real landing."

 CAN_mogg_implementation.4.t: "Entente Contribution"
 CAN_mogg_implementation.4.d: "§IOttawa, Cabinet Room§!\n\n§RCanadian ships and Canadian soldiers are pledged to the wider Entente cause. Rees-Mogg's exiles finally have a role to play beyond speeches — a place in the coalition that means to take Britain back.§!"
 CAN_mogg_implementation.4.a: "Canada answers the call."

 CAN_mogg_implementation.5.t: "The Reclamation Fleet"
 CAN_mogg_implementation.5.d: "§IHalifax, Exile Community Hall§!\n\n§R\"Look at what we have built, my friends. A fleet worthy of the crossing. Soldiers trained for the landing. Allies pledged to the cause.\n\nTwenty-seven years of waiting end here. The Reclamation Fleet is ready to sail, and when it does, it will carry the hopes of every exile who never stopped believing we would go home.\"§!"
 CAN_mogg_implementation.5.a: "Let the crusade begin."