l_english:

 CAN_opening.1.t: "The Two Titans of Ottawa"
 CAN_opening.1.d: "§IOttawa, January 2026!\n\nA quiet tension fills the Prime Minister's office as Conrad Black and Deputy PM Jacob Rees-Mogg look over the latest quarterly budget. The debate, as always, is over the allocation of the Dominion's resources.\n\n§R\"My dear Conrad,\"§! Rees-Mogg says, adjusting his spectacles as he gestures to the naval expansion proposal. §R\"A nation that limits its gaze to its own shores is not a fortress, but a prison. The Royal Navy requires those steel shipments if we are to ever break the Spartakist blockade of the Channel.\"§!\n\nBlack leans back, chewing on an unlit cigar.\n\n§R\"Jacob, I am as committed to the Crown as any man in this room. But if I strip the steel mills of Ontario to build your battleships, the union strikes will paralyze our railways by winter. We cannot liberate Westminster if we bankrupt Ottawa first.\"§!\n\nThe two men lock eyes — each representing a different half of the nation's fractured soul.\n\nA compromise must be struck. But both know that as the global situation worsens, the time for half-measures is running out."
 
 CAN_opening.1.a: "Back Rees-Mogg's Naval Plan."
 
 CAN_opening.1.b: "Back Black's Infrastructure Priority."
 
 CAN_opening.2.t: "The Timber Allocation Dispute"
 CAN_opening.2.d: "§IOntario Steel Belt, February 2026§!\n\nThe announcement hits the shop floors like a hammer.\n\nEvery ton of high-grade Ontario steel diverted to the Halifax dockyards is a ton not going to the railways, the bridges, the mills. The workers know exactly what it means — and they are not pleased.\n\nCharlie Angus, speaking at a union rally in Sudbury, does not mince words.\n\n§R\"They are stripping our factories to build ships for a war that is not ours. They are asking Canadian workers to fund a British crusade with their livelihoods. And they call themselves the government of Canada.\"§!\n\nThe crowd is large. The applause is louder.\n\nIn Ottawa, Black receives the intelligence report with a face that gives nothing away.\n\nSomething must be done."
 
 CAN_opening.2.a: "The steel goes to the ships. That is final."
 
 CAN_opening.2.b: "Offer the unions a partial concession."
 
 CAN_opening.3.t: "The Great Lakes Steel Crisis"
 CAN_opening.3.d: "§IOttawa, February 2026§!\n\nThe blast furnaces of Hamilton and the Great Lakes are roaring at maximum capacity — but there is simply not enough high-grade steel to satisfy everyone.\n\nConrad Black's industrialists want the steel allocated to building up domestic rail networks, heavy manufacturing plants, and defensive border fortifications.\n\nJacob Rees-Mogg's Admiralty delegates argue that every single ton of steel must be reserved for laying down the hulls of new destroyers and heavy cruisers.\n\nRees-Mogg comes to Black's office at eight in the morning. He does not look like a man who has slept.\n\n§R\"Conrad. The exile community has been patient. Extraordinarily patient. Twenty-seven years of patience. I am asking you not to mistake that patience for indifference. The shipyards need steel. The Reclamation needs ships. And the ships need to be started §Inow§R, not when it is convenient for the railways.\"§!\n\nBlack looks at him for a long moment.\n\n§R\"Jacob. Sit down.\"§!"
 
 CAN_opening.3.a: "Canada's infrastructure comes first. The Navy can wait."
 
 CAN_opening.3.b: "Reassure the exile community — their patience will be rewarded."
 
 CAN_naval_priority: "Naval Priority"
 CAN_naval_priority_desc: "The steel mills of Ontario have been directed to prioritise naval construction above all other demands. The Halifax dockyards are running at maximum capacity. The Reclamation's armada is taking shape. The union halls of the steel belt are quieter than usual — a silence that means something different than peace."
 
 CAN_infrastructure_priority: "Infrastructure Priority"
 CAN_infrastructure_priority_desc: "Black's decision to prioritise domestic infrastructure over naval construction has set the steel mills to work on railways, bridges, and industrial facilities. Canada is building itself rather than building ships to fight someone else's war. The exile press is furious. Ordinary Canadians are finding work."




  ###########Sovereignty focus Chain###########
 CAN_sovereignty.1.t: "The Sovereignty Address"
 CAN_sovereignty.1.d: "§IOttawa,§!\n\nThe House of Commons is silent as Conrad Black rises to speak. In twenty-seven years of Canadian public life he has given a thousand speeches. None have felt like this.\n\nBehind him, Jacob Rees-Mogg sits with the expression of a man watching his cathedral burn. To his left, Boris Johnson suppresses something that might be a smile.\n\nBlack adjusts his glasses. Begins.\n\n§R\"Mr. Speaker.\n\nFor twenty-seven years Canada has been many things to many people. A refuge. A shipyard. A bank. A barracks. A dream deferred.\n\nWe have welcomed the dispossessed of a fallen empire with open arms and an open treasury. We have built their ships, housed their courts, educated their children, and buried their dead. We have done this because we are Canadians — and Canadians do not turn away from those who have nowhere else to go.\n\nBut generosity is not vassalage. Hospitality is not servitude.\n\nCanada is not a colony. Canada is not a launching pad. Canada is not a temporary inconvenience on the road back to Westminster.\n\nCanada is a nation.\n\nToday this government formally declares that the foreign policy of this Dominion will be conducted in the interests of the Canadian people — and the Canadian people alone. We are not belligerents in the war now consuming Eurasia. We are not participants in any crusade, however righteous its architects believe it to be. We are a sovereign power, armed and resolute, committed to the defence of our own territory and the prosperity of our own citizens.\n\nTo our allies — we remain your friends.\nTo our neighbours — we seek your partnership.\nTo those who came to us in exile — you are welcome here. As Canadians.\n\nBut Canada will not bleed for anyone else's yesterday.\"§!\n\nThe House erupts.\n\nFrom the opposition benches Charlie Angus pounds his desk. Even some NCP backbenchers look quietly relieved.\n\nRees-Mogg does not move. His face is stone.\n\nOutside, in the Ottawa winter, a crowd that has been listening on loudspeakers begins to cheer."
 CAN_sovereignty.1.a: "Deliver the address as written"
 CAN_sovereignty.1.b: "Soften the address before delivering it"


 CAN_sovereignty.2.t: "The Deputy Speaks"
 CAN_sovereignty.2.d: "§IOttawa, January 2026§!\n\nHe calls it a press availability rather than a press conference.\n\nJacob Rees-Mogg stands at a podium in the Imperial Restoration Party's parliamentary offices. Behind him the portraits of the King. Beside him the Union Jack and the Canadian flag — in that order.\n\nHe faces the cameras without notes.\n\n§R\"I have served alongside Conrad Black for many years. I have respected his intelligence, his dedication, and his love of this great Dominion that sheltered us in our darkest hour.\n\nI cannot respect this.\n\nWhat was announced yesterday in the House of Commons was not a declaration of sovereignty. It was a declaration of surrender. Dressed in the language of Canadian patriotism, it was in truth an act of profound cowardice — the abandonment of a sacred obligation to the millions of British subjects who have waited, with extraordinary patience and extraordinary faith, for the moment of their return.\n\nWe did not come to Canada to become Canadian. We came to Canada to go home.\n\nI speak now not as Deputy Prime Minister — a title that has apparently become meaningless — but as the leader of the Imperial Restoration Party and as a loyal subject of His Majesty the King.\n\nThe Reclamation will happen. With or without Conrad Black. With or without the apparatus of this government.\n\nHistory does not wait for the timid.\"§!\n\nHe turns and walks out before the questions start.\n\nIn the press gallery nobody moves for a moment.\n\nThen everyone moves at once."
 CAN_sovereignty.2.a: "Issue a formal rebuke — this cannot stand."
 CAN_sovereignty.2.b: "Let Boris respond — he has been waiting."

 CAN_sovereignty.3.t: "Half Measures"
 CAN_sovereignty.3.d: "§IOttawa, January 2026§!\n\nThe speech Black delivers is not the speech Boris read at six this morning.\n\nIt is a different speech. Shorter. Careful. The sharp edges filed smooth overnight.\n\n§R\"Mr. Speaker.\n\nCanada has always understood its obligations — to its own citizens, to its allies, and to the broader community of free nations that look to this Dominion as a beacon of stability in uncertain times.\n\nToday this government reaffirms its commitment to Canadian sovereignty, to the security of our borders, and to the prosperity of our people.\n\nWe are a nation of extraordinary resources and extraordinary resilience. We will continue to honour our commitments to our coalition partners while ensuring that Canadian interests remain at the heart of every decision made in this chamber.\n\nOur foreign policy will be guided by pragmatism, by principle, and by the enduring values that have made this country what it is.\n\nWe are, and shall remain, a sovereign Dominion — committed to our people, our allies, and our shared future.\n\nThank you Mr. Speaker.\"§!\n\nThe House receives it in confused silence.\n\nFrom the opposition benches Charlie Angus mouths something to his deputy. It might be §I\"that's it?\"§!\n\nJacob Rees-Mogg, seated behind Black, allows himself the smallest possible smile.\n\nBoris Johnson stares at the floor.\n\nOutside the crowd that gathered to listen begins quietly dispersing.\n\nNobody is cheering."
 CAN_sovereignty.3.a: "Issue a clarification — Rees-Mogg misrepresents the address."
 CAN_sovereignty.3.b: "Stay the course — changing now looks like panic."

 CAN_compromise.1.t:0 "The Grand Compromise of '26"
 CAN_compromise.1.d:0 "The oak doors of the Privy Council chamber remain locked past midnight. Inside, cigar smoke hangs like a heavy fog over two men who represent two fundamentally incompatible visions for the Dominion.\n\nOn one side of the mahogany table sits Conrad Black—slouched back, cognac glass in hand, insisting that Canada must survive as its own sovereign enterprise, pragmatically tethered to North American realities. Opposite him stands Jacob Rees-Mogg—upright, double-breasted coat immaculate, speaking in measured, Victorian tones of sacred imperial duty, uncompromising rearmament, and the unyielding obligation to recapture London.\n\nBetween them lies a document three weeks in the drafting: *The 2026 Compromise*. It attempts to reconcile Black’s economic realism with Mogg’s ideological zeal. But as the ink dries, both men know that paper cannot split a nation in two. One faction must yield, or the government will break."
 CAN_compromise.1.a:0 "Black's vision prevails. Canada is a sovereign nation first."
 CAN_compromise.1.b:0 "Rees-Mogg takes the wheel. Everything for the Imperial Restoration!"
 # Tooltips

 CAN_sovereignty.3b.t: "The Gracious Victor"
 CAN_sovereignty.3b.d: "§IOttawa, January 2026§!\n\nThat evening Rees-Mogg gives a brief statement to the press outside his parliamentary office.\n\nHe does not look angry.\n\nHe looks satisfied.\n\n§R\"I am glad to see the government has not lost sight of its obligations to the Crown. Canada's sovereignty and the Reclamation have never been in conflict — they never were.\n\nThe Prime Minister's measured address today confirms what I have always believed.\n\nCanada stands with the Crown.\n\nWe are going home.\"§!\n\nHe smiles for the cameras.\n\nSomewhere across Ottawa Boris Johnson is reading the same quote on his phone.\n\nHe puts the phone face down on his desk.\n\nHe sits for a long time."
 CAN_sovereignty.3b.a: "This cannot go unanswered."

 CAN_sovereignty.4.t: "The Call From Washington"
 CAN_sovereignty.4.d: "§IOttawa§!\n\nIt comes at 6:47 in the morning.\n\nConrad Black is already at his desk. His personal secretary appears in the doorway.\n\n§I\"Prime Minister. President Turner's office. She's on the line herself.\"§!\n\nBlack looks at the phone for a moment.\n\nTwenty-seven years. This is the first time a sitting American president has called a sitting Canadian prime minister directly.\n\nHe picks up.\n\n§R\"Prime Minister Black. I'll be direct with you — I'm not much for small talk and I suspect you aren't either.\n\nI watched your address to Parliament. I've had my people analyse it for three days. And I've decided I believe you.\n\nCanada as a sovereign nation pursuing its own interests — not an exile launching pad, not a threat to the United States — that's something my administration can work with.\n\nI'm not asking you to become a socialist. I'm not asking you to join our coalition or endorse our domestic agenda. I'm asking you whether Canada and the United States can talk to each other like neighbours again.\n\nBecause right now you have Jacob Rees-Mogg as your Deputy Prime Minister and an armada being built in Halifax harbour. And that makes it very difficult for me to explain to my Congress why we shouldn't be treating you as a threat.\n\nSo. Can we talk?\"§!\n\nBlack is quiet for a moment.\n\nOutside his window Ottawa is grey and cold and entirely itself."
 CAN_sovereignty.4.a: "\"Yes, Madam President. We can talk.\""
 CAN_sovereignty.4.b: "\"I appreciate the call. But I need assurances first.\""

 CAN_sovereignty.5.t: "The Exile Who Stayed"
 CAN_sovereignty.5.d: "§IToronto, January 2026§!\n\nHe didn't ask for a podium. He didn't ask for cameras. He simply walked out of NCP headquarters on Queen Street and started talking to the crowd that had gathered.\n\nBy the time the press arrived there were four thousand people.\n\nBoris Johnson — dishevelled as always, coat slightly wrong for the weather — looks out at the crowd with an expression nobody in Canadian politics has quite seen on him before.\n\nNot the clown. Not the schemer. Something quieter and more certain.\n\n§R\"I was twenty-five years old when I left London.\n\nI packed two bags. I didn't know where I was going. I ended up here.\n\nAnd I want to tell you something that Jacob Rees-Mogg will never tell you, because Jacob Rees-Mogg has never actually looked at this country — I mean really looked at it.\n\nCanada is extraordinary.\n\nNot because of what it can do for Britain. Not because of its shipyards or its steel mills or its harbours. But because of what it is. Because of the people I have met here over twenty-five years — people who are tough and funny and generous and completely unimpressed by anyone who thinks a title or an accent makes them special.\n\nJacob says we did not come here to become Canadian.\n\nI did.\n\nI am a Canadian. My children are Canadian. And I will not stand by and watch this country bleed for a yesterday that neither I nor anyone else can give back to Jacob Rees-Mogg.\n\nBritain is gone. The Britain we left is gone.\n\nOur way is here. Our future is here.\n\nAnd it is — I promise you — it is going to be magnificent.\"§!\n\nThe crowd goes absolutely silent for one moment.\n\nThen it erupts."
 CAN_sovereignty.5.a: "Canada has spoken."

 CAN_sovereignty.6.t: "The Night the Coalition Broke"
 CAN_sovereignty.6.d: "Parliament Hill, Ottawa — Late Evening\n\nJacob Rees-Mogg calls a press conference outside the Imperial Restoration Party's parliamentary offices. Every major Canadian outlet is present.\n\nHe enters precisely on time, wearing his best suit. Behind him stand seventeen Imperial Restoration Party MPs.\n\n\"This afternoon Prime Minister Black removed me from cabinet. He did so because I refused to misrepresent to the British people the nature of this government's commitment to their return. I was asked to lie. I declined.\n\nThe Imperial Restoration Party will not support a government that has abandoned the Reclamation. Effective immediately the Imperial Restoration Party withdraws from the governing coalition.\n\nWe will be writing to the Governor General tonight to request that she consider whether the government retains the confidence of the House.\n\nCanada deserves a government that knows what it stands for. We always have.\"\n\nHe turns and walks out before the questions start.\n\nBlack's office. Eight fifteen pm.\n\nConrad Black sits at his desk. Boris Johnson stands by the window. Three NCP whips are working through a list of names.\n\nOn the desk: a legal pad with two columns. One column is labelled OURS. One is labelled THEIRS. The THEIRS column is longer.\n\n\"How many do we need?\"\n\n\"To survive a confidence vote? Either the Continentalists or the CCF. Not both — either.\""
 CAN_sovereignty.6.a: "Call Carney — the Continentalists are the safer option."
 CAN_sovereignty.6.b: "Call Angus — the CCF have the numbers we need."
 CAN_sovereignty.6.c: "Call both — play them against each other."
 CAN_sovereignty.6.e: "Go to the Governor General — call an election."

 CAN_sovereignty.6a.t: "The Technocrat's Terms"
 CAN_sovereignty.6a.d: "§IParliament Hill, Ottawa§!\n\nMark Carney answers on the second ring.\n\nHe was ready for this call yesterday.\n\n§R\"Prime Minister.\"\n\n\"Mark. You've seen what happened tonight.\"\n\n\"I have. I think you did the right thing. Dismissing Rees-Mogg was correct. Long overdue, but correct.\"\n\n\"I need to know if the Continentalist Party will support this government through a confidence vote.\"\n\n\"Conrad. You know I can't do that unconditionally. My caucus has been in opposition to this government for three years. I can't walk in tomorrow and tell them we're propping up the NCP without something to show for it.\"\n\n\"Your three conditions.\"\n\n\"You know about those.\"\n\n\"Mark. I've been in politics for twenty years. Of course I know about those.\"\n\n\"The Detroit Agreement framework. A date for Washington trade talks. Indigenous land rights consultation — not negotiation, not settlement, consultation with a timeline.\"\n\n\"The third one is going to cause me problems with my own backbench.\"\n\n\"I know. That's why it's on the list.\"\n\n\"If I accept these conditions — formally, in writing — you'll deliver your full caucus on the confidence vote?\"\n\n\"Every single one.\"§!"
 CAN_sovereignty.6a.a: "Accept Carney's three conditions."
 CAN_sovereignty.6a.b: "Reject the conditions — find another way."

 CAN_sovereignty.6b.t: "The Union Man's Terms"
 CAN_sovereignty.6b.d: "§IParliament Hill, Ottawa§!\n\nCharlie Angus answers immediately. In the background Black can hear what sounds like a hockey game.\n\n§R\"Prime Minister.\"\n\n\"Mr. Angus. You said you were willing to have a conversation.\"\n\n\"I said that, yeah.\"\n\n\"I need the CCF's support through the confidence vote.\"\n\n\"Conrad. Do you know how many times the CCF has kept a Conservative government alive in Canadian history?\"\n\n\"Never.\"\n\n\"Never. So you understand this is not a small thing I'm being asked here. My people knocked on doors in minus thirty weather in Timmins and Thunder Bay. They are not going to understand why Charlie Angus saved Conrad Black's government unless I can give them a very good reason.\"\n\n\"What reason would satisfy them?\"\n\n\"Three things. First — the conscription legislation Rees-Mogg pushed through last year. I want it repealed. Not suspended. Repealed. Second — the steel workers in Hamilton who've been locked out for eight months. Binding arbitration within thirty days. Third — and this one is non-negotiable — Romeo Saganash gets a seat at the cabinet table. Not a consultative role. A full cabinet seat with a real portfolio.\"§!\n\nSilence.\n\n§RBlack covers the phone. Looks at Boris.\n\n\"All three of them are the right thing to do.\"\n\n\"That's not the question.\"\n\n\"No. The question is whether you're still the same man who gave that speech last week.\"§!"
 CAN_sovereignty.6b.a: "Accept all three of Angus's conditions."
 CAN_sovereignty.6b.b: "Accept the first two — negotiate the third."
 CAN_sovereignty.6b.c: "Reject the third condition — go back to Carney."

 CAN_sovereignty.6c.t: "The Auction"
 CAN_sovereignty.6c.d: "§IParliament Hill, Ottawa§!\n\nBoris's idea.\n\n§R\"Call them both. Tonight. Let them know you're talking to both of them. Neither of them wants the other to be the kingmaker.\n\nPlay them against each other. See who blinks first.\"\n\n\"That's extraordinarily cynical.\"\n\n\"I learned from watching masters of the form.\"§!\n\nThe calls go out simultaneously at nine pm.\n\nBy ten thirty both Carney and Angus know the other has been called.\n\nThree minutes later Angus calls Black directly.\n\n§R\"Are you actually talking to Carney?\"\n\n\"I'm talking to everyone who wants to keep this government functioning, Mr. Angus.\"\n\n\"Conrad. Don't play games with me. I'm not Mark Carney. I don't negotiate like Mark Carney. If you give Carney a better deal than you give me, I will stand up in the House tomorrow and vote against you myself. And I'll enjoy it.\"\n\n\"What's your bottom line, Charlie?\"\n\n\"Repeal the conscription law. That's it. That's the one thing I absolutely need. Repeal it and I'll get you through the confidence vote.\"\n\n\"Done.\"\n\n\"...That was fast.\"\n\n\"It was the right answer three months ago. I should have moved sooner.\"§!"
 CAN_sovereignty.6c.a: "Boris was right. It worked."

 CAN_sovereignty.6c_followup.t: "A Word With Angus"
 CAN_sovereignty.6c_followup.d: "§IParliament Hill Corridor§!\n\nIt happens by accident, more or less.\n\nBlack is walking the corridor outside the Commons chamber when Angus falls into step beside him. Neither of them planned it. No aides. No cameras. No press.\n\nThey walk in silence for a moment.\n\n§R\"You actually repealed it.\"\n\n\"I said I would.\"\n\n\"Politicians say a lot of things.\"\n\n\"Mr. Angus. In thirty years of public life I have tried very hard not to be that kind of politician.\"\n\nAngus looks at him for a long moment.\n\n\"No,\" he says finally. \"I don't think you have been.\"§!\n\nThey reach the end of the corridor. Go their separate ways.\n\nNeither mentions it to their staff.\n\nBut something has shifted, very slightly, in the air between them."
 CAN_sovereignty.6c_followup.a: "An interesting man."

 CAN_sovereignty.6d.t: "The Dissolution Request"
 CAN_sovereignty.6d.d: "§IRideau Hall, Ottawa — Eleven PM§!\n\nBoris thinks it's a terrible idea.\n\n§R\"Conrad. We have no majority. Rees-Mogg has just walked out with seventeen of our people. An election right now — Jacob will run on the Reclamation and he will hoover up every exile vote in the country.\"\n\n\"If we go to Carney or Angus we spend the next two years hostage to their agendas.\"\n\n\"Better than spending the next two years losing to Jacob in the press every single day.\"\n\n\"I've been in worse positions.\"\n\n\"Conrad. Have you?\"§!\n\nBlack stands.\n\n§R\"Get the car.\"§!\n\nThe Governor General receives him in her private study. She listens without expression.\n\nShe asks two questions.\n\n§I\"Is there any possibility of forming a stable government without an election?\"§!\n\nBlack says he does not believe so.\n\n§I\"Prime Minister. Are you certain?\"§!\n\n§R\"No. But I'm going.\"§!"
 CAN_sovereignty.6d.a: "Fight it on our own terms."

 CAN_sovereignty.7.t: "The Detroit Agreement"
 CAN_sovereignty.7.d: "§IDetroit, Michigan§!\n\nDetroit was chosen deliberately by both sides.\n\nA city on the border. A city that looks across a narrow river at Windsor, Ontario — Canada visible from America, America visible from Canada, the border almost close enough to touch.\n\nThe Canadian Foreign Minister and American Secretary of State have been talking for eleven hours.\n\nThe Foreign Minister calls Black at midnight.\n\n§I\"Prime Minister. We have something.\"§!\n\nThe Detroit Agreement is not a treaty. It is a framework. A series of mutual understandings.\n\n§RThe Americans agree:§!\n\nTo formally recognise Canada's sovereign right to determine its own defence posture\n\nTo end the informal economic pressure campaign against Canadian financial institutions\n\nTo open preliminary trade discussions within ninety days\n\n§RThe Canadians agree:§!\n\nTo provide advance notice of any military operations affecting American security interests\n\nTo cease harbouring intelligence operations directed against the United States\n\nTo engage in good faith trade discussions\n\nWhat the agreement does not say — but what both sides understand perfectly — is that the Reclamation is over.\n\nRees-Mogg will never accept this.\n\nBut Rees-Mogg is no longer driving.\n\nConrad Black pours himself a scotch — the good one, kept for occasions — and sits alone as the Ottawa dawn comes up grey and cold and Canadian.\n\n§R\"Well,\" he says quietly. \"We're still here.\"§!"
 CAN_sovereignty.7.a: "A new chapter begins."

 CAN_sovereignty.8.t: "The Resignation"
 CAN_sovereignty.8.d: "§IOttawa, Morning§!\n\nThe statement arrives before Black has finished his first coffee.\n\nIt appears on every major Canadian news channel simultaneously at seven am. Pre-recorded. Pre-distributed. Timed for maximum impact.\n\nJacob Rees-Mogg sits at the desk in his parliamentary office. Behind him the portraits of the monarchs. Before him the Union Jack.\n\nHe looks completely composed.\n\n§R\"When I came to Canada in 1999 I came with a purpose. Everything I have done in the twenty-seven years since has served that purpose.\n\nThe Detroit Agreement, signed yesterday, represents the formal abandonment of that purpose by this government.\n\nI cannot serve in a cabinet that has made peace with the socialist occupation of the British homeland.\n\nI am therefore resigning as Deputy Prime Minister of Canada, with immediate effect.\n\nI wish to say one thing directly to Prime Minister Black.\n\nConrad. You are an intelligent man. You are a patriotic man in your way. But you have made a historic mistake today and I believe that history will record it as such.\n\nThe Reclamation was always going to happen. It will still happen.\n\nYou have simply chosen not to be part of it.\"§!\n\nHe reaches forward and turns off the camera.\n\nIn his own office Conrad Black watches the clip end.\n\nBoris Johnson is standing beside him.\n\nNeither says anything for a moment.\n\nThen Boris:\n\n§R\"Well. That's that then.\"\n\n\"Yes,\" says Black. \"That's that.\"§!"
 CAN_sovereignty.8.a: "Let him go. Canada moves forward."

