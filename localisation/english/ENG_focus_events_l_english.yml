  rot_eng_focus.9.t:0 "THE WINTER OF DISCONTENT '26"
  rot_eng_focus.9.d:0 "\"The breaking point has been reached. If the center cannot provide, the streets will take what they are owed.\"\n- Fragment of a strike leaflet, Leeds\n\n--------------------------------------------------------------------------------\n\nThe plans laid out in the 1999 Constitution have collided violently with a brutal, material reality. The winter of 2025-2026 has descended with an unforgiving intensity, and with the blockade completely choking out fuel and food imports, the centralized system has begun to buckle under its own weight. The quotas are not being met, the rations are not arriving, and the population has reached its absolute limit.\n\nWhat began as isolated, silent defiance in the freezing textile mills of Yorkshire has erupted into a massive, uncoordinated wave of industrial sabotage and mass strikes across the urban centers.\n\nDespite the total ban on independent syndicates, workers have walked out of the critical munitions plants in Birmingham, the transport hubs in Manchester, and the dockyards along the Mersey. Power stations are being starved of coal by rebellious miners, plunging whole cities into pitch darkness. Street corners are choked with uncollected refuse, frozen mud, and growing crowds of desperate, starving citizens defying the curfews to demand bread and heating.\n\nInside Westminster Hall, the silence of the Revolutionary Congress has been shattered. The unified front has broken completely. As news arrived of military units openly refusing to fire on striking workers, the assembly erupted into a furious, chaotic shouting match. Realizing that Starmer's rigid centralization is driving the nation into an economic abyss, an ad-hoc coalition of shouting factions took the podium. By an overwhelming, chaotic show of hands, the Congress has formally revoked the Secretariat's emergency powers and ordered Starmer to stand down, forcing an immediate, emergency snap leadership election.\n\nThe floor has transformed into an ideological arena, with heavyweights moving furiously through the benches to whip votes and secure the numbers needed to claim the vacant leadership:\n\n- The Loyalist Hardliners: Starmer's core faction is desperately pulling strings to retain an iron chokehold on power, arguing that changing horses mid-crisis will invite total structural collapse.\n- The Socialist Left: Jeremy Corbyn is surrounded by a surging crowd of trade union delegates and veteran syndicalists, demanding a radical return to genuine worker autonomy and democratic local soviets.\n- The Modernized Reformers: Tony Blair is leading a quiet, intense huddle of technocrats and administrative pragmatists, looking to win over centrist elements with promises of economic restructuring and realistic foreign diplomacy.\n- The Security Apparatus: From the back of the hall, Dermot Hudson and the internal security cadres look on coldly, ready to ruthlessly expand the garrison state if the politicians falter.\n- The Red Army High Command: General Patrick Sanders stands with a faction of grim-faced officers, prepared to enforce a strict military war cabinet the moment civilian logistics jeopardize the frontier.\n\nThe chamber doors have been locked, the guards are split, and the future of the U.S.B.R. hangs in the balance as the ballot box is laid upon the central table.\n\n--------------------------------------------------------------------------------"
  rot_eng_focus.9.a:0 "The center cannot hold. Open the nominations."

  rot_eng_focus.10.t:0 "THE DICTATORSHIP OF THE LEDGER"
  rot_eng_focus.10.d:0 "\"You thought the law was fragile because it lacks passion. You forgot that iron does not need to feel to crush you.\"\n- Keir Starmer, Post-Election Address\n\n--------------------------------------------------------------------------------\n\nThe frantic whispering, the desperate vote-whipping, and the grand promises of the opposition factions collapsed under the cold weight of a single afternoon. When the emergency ballots were collected from the central table and tallied under the watchful glare of the Congress clerks, the result wasn't a narrow escape for Starmer - it was a brutal, overwhelming rout. Supported by a massive, silent bloc of provincial administrators, industrial directors, and regional party loyalists who fear chaos more than they hate the cold, Keir Starmer secured an absolute, unassailable majority.\n\nBut the true shock came from outside the stone walls of Westminster. As news of the victory rippled through the freezing streets, the expected riots did not materialize. Instead, organized State Security detachments, working in perfect tandem with loyalist workers' brigades, flooded the urban centers - not to suppress a revolt, but to celebrate a mandate. Thousands of workers, exhausted by the unending winter and terrified of total anarchy, gathered under massive banners bearing Starmer's stark directives. They didn't demand a new path; they demanded the stability of the old one.\n\nBack inside the chamber, Starmer stepped to the dispatch box. He did not look like a man who had just survived a coup. He looked like an auditor about to balance a bloody account.\n\nHe didn't speak to the whole room. He fixed his gaze directly on the benches where the reformers, the syndicalists, and the military dissidents sat. A suffocating, terrified silence fell over the opposition delegates as his flat, level voice echoed off the high rafters:\n\n\"The debate is concluded. The working people of this Republic have looked at your factions, they have looked at your deviations, and they have rejected them. They have chosen the law. Let it be entirely clear to those who sought to weaponize this winter for their own political ambitions: your names have been noted, your arguments have been recorded, and your immunity is hereby revoked. The 1999 Constitution will now be enforced to its absolute, unyielding limit. There will be no further warnings.\"\n\nAs the loyalist benches erupted into a thunderous, rhythmic applause, the delegates who had signed the ultimatum sat paralyzed in their seats, realizing too late that they hadn't just lost an election - they had sealed their own fate.\n\n--------------------------------------------------------------------------------"
  rot_eng_focus.10.a:0 "The iron chokehold tightens. Purge the dissenters."

  rot_eng_focus.11.t:0 "THE CRUSHING OF THE CENTRAL CLERKS"
  rot_eng_focus.11.d:0 "\"The ballot boxes have spoken, but they did not speak with one voice. We have shattered the old machine; now we must decide what to build.\"\n- Midnight Pamphlet, London printing\n\n--------------------------------------------------------------------------------\n\nThe counts were finalized at dawn. The bureaucratic wall that Starmer built to protect his Secretariat cracked completely under the weight of the emergency ballots, as a massive coalition of reform-minded delegates, trade union radicals, and younger industrial managers voted down the hardline loyalists. The 1999 Constitution has been suspended, and Starmer's ministers have been escorted from the ministries under armed guard. The Reform Faction has triumphed.\n\nYet, the euphoria inside Westminster Hall was short-lived. The moment the common enemy was removed, the fragile alliance of convenience instantly shattered into two deeply dug-in camps. The chamber floor is completely deadlocked, and the entire country watches the radio bulletins to see which wing of the reformation will claim the soul of the U.S.B.R.\n\nOn the left of the benches, the veteran syndicalists and factory councils are rallying around Jeremy Corbyn. They are demanding an immediate, uncompromised return to genuine Democratic Socialism. Their plan is to dismantle the police state entirely, hand absolute control of the economy over to localized, decentralized worker soviets, and rebuild the state from the bottom up on the principles of mutual aid, solidarity, and worker democracy.\n\nDirectly opposing them sits Tony Blair and his hyper-modernizing faction of technocrats. They mock the traditional socialist path as an obsolete, archaic recipe for continued starvation. Blair's group is presenting a chillingly efficient, authoritarian take on Social Democracy. They envision a highly centralized, digitalized state apparatus - using integrated data networks, modern algorithmic allocation, and hyper-liberal economic reforms to smash the blockade through sheer efficiency and institutional competence. It is a vision of a clean, modern, but strictly top-down republic.\n\nThe delegates are screaming across the aisle. The country is paralyzed. A single choice must be made, and it will define whether Britain becomes a direct democracy of the factories, or an autocratic meritocracy of the screen.\n\n--------------------------------------------------------------------------------"
  rot_eng_focus.11.a:0 "Empower Corbyn: Build a genuine Socialist Democracy."
  rot_eng_focus.11.b:0 "Empower Blair: Trust the Technocrats and modernize the State."

  rot_eng_focus.12.t:0 "THE DOCTRINE OF TOTAL RELIANCE"
  rot_eng_focus.12.d:0 "\"The mistake of past leaders was trusting in external forces and human frailty. The state is only secure when it relies on its own collective, unbending will.\"\n- Dermot Hudson, Assembly Address\n\n--------------------------------------------------------------------------------\n\nThe emergency ballot boxes yielded a outcome that sent a cold shockwave through the reformist and military factions. By quietly marshaling the deep-state security apparatus, the ideological monitoring units, and a massive bloc of rural administrators who view any hint of liberalization as structural suicide, Dermot Hudson secured the necessary votes to claim the Secretariat.\n\nYet, those expecting an immediate military crackdown or a sweeping suspension of the Congress were entirely mistaken. Hudson played the master politician, smiling thinly from the podium as he accepted the mandate, moving not with a sudden coup, but with a series of highly calculated, legitimate administrative reforms. He restructured the state planning committees, subtly expanding the oversight of the Security Directorate while maintaining the absolute letter of parliamentary law.\n\nBut it was his inaugural address to the newly seated Congress that truly chilled the room. He did not speak of standard planning or maritime logistics; he laid out an completely unprecedented, deeply insular philosophical vision for the future of England - a doctrine of total, absolute self-reliance.\n\n\"We have spent decades looking outward, begging for trade or fearing blockades,\" Hudson announced, his flat voice carrying an unsettling, rhythmic certainty.\n\n"No more. True socialism dictates that the English people are masters of their own destiny, capable of transforming this island through collective consciousness and unwavering devotion. We will build a system completely independent of global markets and foreign corruptions. Our production will be guided not by mechanical supply lines, but by an absolute, unified loyalty to the revolutionary center.\"\n\nAs he spoke, the back of the chamber filled with newly organized youth cadres, all wearing uniform badges bearing Hudson's likeness, applauding in terrifying, perfect synchronicity. Huge, newly minted portraits of the new General Secretary were unfurled along the stone galleries, framing him not as a mere politician, but as the singular, living embodiment of the nation's survival.\n\nAcross the benches, the Corbynites, the Blairites, and the high-ranking generals sat completely paralyzed, watching the rapid, legal creation of an overwhelming personality cult. They had expected a bureaucrat; they realized too late that they had just handed the keys of the state to a man who intended to reshape the very psyche of the British people into an unbreakable, isolated fortress.\n\n--------------------------------------------------------------------------------"
  rot_eng_focus.12.a:0 "The new path is charted. Secure the home front."

  rot_eng_focus.13.t:0 "THE JUNTA STORMS THE PEOPLE'S CONGRESS"
  rot_eng_focus.13.d:0 "\"Civilian debate ends where the security of the Republic begins.\"\n- General Patrick Sanders, before the Congress podium\n\n--------------------------------------------------------------------------------\n\nThe People's Congress had almost settled into its usual rancorous rhythm when the chamber doors were thrown open and the noise of boots on stone cut across the shouting delegates. Patrick Sanders did not enter alone. He arrived at the head of a military junta - a column of officers, armed orderlies, and hard-faced security men who moved with the cold precision of a unit that had already decided the question of legitimacy in its own favor.\n\nThe debate over the new leader froze in place. Some delegates stood from their benches, others shouted for the guards, but the guards were already moving. Sanders walked straight down the aisle toward the central table as if it had been reserved for him. Behind him, the junta fanned out through the benches, sealing the exits, taking the galleries, and quietly disarming the first few men foolish enough to reach for trouble.\n\nHe did not bother with theatrics. Sanders climbed the steps to the podium, looked over the stunned chamber, and announced that the military had intervened to prevent the Congress from surrendering the state to factional collapse. The reformers were told to sit down. The loyalists were told to stay silent. The officers at the doors were told to prepare the building for a new authority.\n\nWithin minutes, the Congress had ceased to be a parliament and become a command post. The debate was over. The ballots no longer mattered. The Republic would now be governed under the supervision of the men with rifles, maps, and the confidence to use both.\n\n--------------------------------------------------------------------------------"
  rot_eng_focus.13.a:0 "The junta takes control of the chamber."

  rot_eng_focus.14.t:0 "THE DICTATORSHIP OF THE LEDGER"
  rot_eng_focus.14.d:0 "\"You thought the law was fragile because it lacks passion. You forgot that iron does not need to feel to crush you.\"\n- Keir Starmer, Post-Election Address\n\n--------------------------------------------------------------------------------\n\nThe frantic whispering, the desperate vote-whipping, and the grand promises of the opposition factions collapsed under the cold weight of a single afternoon. When the emergency ballots were collected from the central table and tallied under the watchful glare of the Congress clerks, the result wasn't a narrow escape for Starmer - it was a brutal, overwhelming rout. Supported by a massive, silent bloc of provincial administrators, industrial directors, and regional party loyalists who fear chaos more than they hate the cold, Keir Starmer secured an absolute, unassailable majority.\n\nBut the true shock came from outside the stone walls of Westminster. As news of the victory rippled through the freezing streets, the expected riots did not materialize. Instead, organized State Security detachments, working in perfect tandem with loyalist workers' brigades, flooded the urban centers - not to suppress a revolt, but to celebrate a mandate. Thousands of workers, exhausted by the unending winter and terrified of total anarchy, gathered under massive banners bearing Starmer's stark directives. They didn't demand a new path; they demanded the stability of the old one.\n\nBack inside the chamber, Starmer stepped to the dispatch box. He did not look like a man who had just survived a coup. He looked like an auditor about to balance a bloody account.\n\nHe didn't speak to the whole room. He fixed his gaze directly on the benches where the reformers, the syndicalists, and the military dissidents sat. A suffocating, terrified silence fell over the opposition delegates as his flat, level voice echoed off the high rafters:\n\n\"The debate is concluded. The working people of this Republic have looked at your factions, they have looked at your deviations, and they have rejected them. They have chosen the law. Let it be entirely clear to those who sought to weaponize this winter for their own political ambitions: your names have been noted, your arguments have been recorded, and your immunity is hereby revoked. The 1999 Constitution will now be enforced to its absolute, unyielding limit. There will be no further warnings.\"\n\nAs the loyalist benches erupted into a thunderous, rhythmic applause, the delegates who had signed the ultimatum sat paralyzed in their seats, realizing too late that they hadn't just lost an election - they had sealed their own fate.\n\n--------------------------------------------------------------------------------"
  rot_eng_focus.14.a:0 "The iron chokehold tightens. Purge the dissenters."

  rot_eng_focus.15.t:0 "THE WIRES IN THE WALLS"
  rot_eng_focus.15.d:0 "\"Conspiracy is never discovered in the street first. It is discovered in the corridor, in the file room, and on the wire.\"\n- Internal Security Circular No. 14\n\n--------------------------------------------------------------------------------\n\nAt an emergency session in Westminster Hall, Starmer framed the Winter of Discontent as organized subversion, not hardship.\n\n\"The Republic was not weakened by hunger alone. It was stalked from within by men who mistook crisis for permission. We will account for every corridor and every ministry desk,\" he declared before authorizing sweeping internal surveillance powers.\n\nState Radio Bulletin, 21:00:\n\n"By decree of the Secretariat, telephone boards, postal censors, and civil records offices are now integrated under a unified anti-conspiracy mandate. Citizens are reminded that failure to report suspect activity is itself a punishable offense.\"\n\nIn the streets, the policy lands as fear and routine at once. A tram worker in Southwark mutters,\n\n"They checked my locker three times this week.\" A clerk outside Whitehall whispers,\n\n"Nobody jokes in the lift anymore.\" In factory canteens, conversations stop when doors open.\n\nSuspicion is no longer an emergency measure. It has become the daily operating system of the state.\n\n--------------------------------------------------------------------------------"
  rot_eng_focus.15.a:0 "Search every office. Trust no corridor."

  rot_eng_focus.16.t:0 "THE LONDON SHOW TRIALS"
  rot_eng_focus.16.d:0 "\"A public confession is more efficient than a private execution. One kills a man. The other disciplines a nation.\"\n- Memorandum from the Central Prosecutor's Office\n\n--------------------------------------------------------------------------------\n\nThe defendants were brought to London beneath floodlights and camera towers, not for justice but for choreography. Files were stacked in perfect order, witnesses drilled, verdicts prepared before the first microphone crackled to life.\n\nFrom the upper gallery, Starmer addressed the tribunal in a low, measured tone:\n\n"Let this chamber serve as instruction. A Republic at war cannot survive ambiguity. Treason must be named in public so loyalty can be measured in public.\"\n\nHome Service News, midnight rebroadcast:\n\n"The London Security Tribunal has concluded the first cycle of anti-sabotage hearings. Citizens are advised that confessions prove the depth of hostile penetration and the necessity of expanded vigilance.\"\n\nOutside, crowds gathered around loudspeakers in the rain. Some applauded when names were read. Others stared at the cobblestones. A nurse leaving a night shift said,\n\n"I recognized one of the voices. He fixed our boiler last winter.\" A dockhand replied,\n\n"Keep your head down and stay alive. That's politics now.\"\n\nBy dawn, the city had learned the lesson the state wanted taught: punishment is local, and everyone is in the audience.\n\n--------------------------------------------------------------------------------"
  rot_eng_focus.16.a:0 "Let the city watch. Let the city learn."

  rot_eng_focus.17.t:0 "THE SILENCING OF THE MODERNIZERS"
  rot_eng_focus.17.d:0 "\"They wanted a smiling republic with cleaner accounting. We will give them a cell with perfect bookkeeping.\"\n- Security Directorate officer, overheard in Whitehall\n\n--------------------------------------------------------------------------------\n\nBlair's circle never imagined they would lose so totally. Their aides vanished first, lifted from ministry annexes and university offices in discreet overnight operations. Then came the economists, speechwriters, media handlers, and data men who had tried to sell the Congress a sterilized future of managed liberalization. Their files, disks, correspondence, and donor lists were seized in one coordinated sweep.\n\nThe arrests were accompanied by a ferocious propaganda effort painting the modernizers as a class apart: polished accents, foreign habits, managerial contempt, and a willingness to trade the revolutionary state for technocratic compromise. Starmer's loyalists insist the threat was not simply political. It was cultural. Blairism is being framed as a disease of cleverness without loyalty, competence without belief, modernization without submission.\n\nBy the end of the week, the cameras had gone dark around the reformist wing. No statements. No photographs. No appeals. Their disappearance is the point. The state intends not merely to defeat the modernizers, but to erase the expectation that they might ever speak again.\n\n--------------------------------------------------------------------------------"
  rot_eng_focus.17.a:0 "Remove the clique. Seal the record."

  rot_eng_focus.18.t:0 "THE OFFICERS' RECKONING"
  rot_eng_focus.18.d:0 "\"An officer who hesitates at the moment of class conflict is already loyal to someone else.\"\n- Starmer, to the War Bureau\n\n--------------------------------------------------------------------------------\n\nThe Army's conduct during the strikes has been turned into an indictment. Units that failed to fire, commanders who asked for clarification, and staff officers who argued for restraint have all been grouped together under one lethal conclusion: hesitation. In the new language of the regime, hesitation is not caution. It is treachery deferred.\n\nPromotion boards were dissolved overnight and replaced by mixed tribunals of security inspectors and political commissars. Old campaign veterans, decorated brigade leaders, and academy-trained planners were ordered to account for every pause, every redeployment, and every refusal issued during the winter crisis. Some were retired under guard. Some were arrested. Some simply failed to report back after being called to London.\n\nTheir replacements are not expected to be brilliant. They are expected to obey. The Red Army is being remade from a national force into a political instrument whose command structure points not upward toward professional independence, but inward toward the Secretariat itself.\n\n--------------------------------------------------------------------------------"
  rot_eng_focus.18.a:0 "The army will answer with one voice."

  rot_eng_focus.19.t:0 "THE VOICE ACROSS THE TWEED"
  rot_eng_focus.19.d:0 "\"Truth is expensive. Panic is cheap. Broadcast accordingly.\"\n- Directorate for Northern Information Warfare\n\n--------------------------------------------------------------------------------\n\nUnable to force a clean breakthrough in the north, Whitehall has widened the front into the airwaves. Civilian frequencies are being seized and retuned into a rolling campaign of counterfeit orders, fake scarcity alerts, and rumor packages crafted to fracture Scottish trust from within.\n\nIn a planning brief circulated to northern command, Starmer approved the doctrine in plain terms:\n\n"Victory does not always require advance. It requires corrosion. If their communities doubt their officers, their officers doubt their supply, and their supply doubts the next sunrise, we have already moved the line.\"\n\nNight Bulletin 3A, intercepted relay:\n\n"Attention reserve households: emergency ration reduction expected in Edinburgh sectors by week's end. Unauthorized officials are reportedly preparing evacuation lists. Confirm your local status immediately.\"\n\nAt a Glasgow tea queue, one woman spits,\n\n"Every station says something different.\" A machinist answers,\n\n"That's the point. They want us shouting at each other instead of them.\" In border villages, people now carry two radios and trust neither.\n\nThe objective is simple: make doubt cheaper than solidarity, then let panic do the marching.\n\n--------------------------------------------------------------------------------"
  rot_eng_focus.19.a:0 "Turn the radio into a weapon."

  rot_eng_focus.20.t:0 "PACIFICATION BY ATTRITION"
  rot_eng_focus.20.d:0 "\"If we cannot advance the line, we will harden everything behind it until Scotland breaks first.\"\n- Northern Front directive, revised edition\n\n--------------------------------------------------------------------------------\n\nThe northern war has settled into attrition: fewer breakthroughs, more checkpoints, more wire, more paperwork, more funerals. London has formally adopted pacification by endurance, converting border life into a controlled zone where movement, food, and speech are all filtered through security command.\n\nStarmer defended the policy from the Congress floor:\n\n"Speed is a luxury for peacetime governments. We govern in war. If the frontier cannot be won in weeks, it will be governed in years, and governed without apology.\"\n\nUnion Radio Service, 06:30 bulletin:\n\n"Revised frontier regulations now in force. Permit violations, unauthorized gatherings, and undeclared transport of goods will be prosecuted under emergency stabilization law.\"\n\nOn a bus near Carlisle, an elderly passenger says,\n\n"My grandson needs three stamps just to visit his mother.\" A conscript beside him answers,\n\n"Better stamps than shells. That's what they keep telling us.\" Nobody argues. Nobody looks out the window for long.\n\nIf the line cannot be broken, London intends to make life behind it so narrow that resistance runs out of room.\n\n--------------------------------------------------------------------------------"
  rot_eng_focus.20.a:0 "Lock down the frontier. Grind them down."

  rot_eng_focus.21.t:0 "THE WAR AGAINST THE FALSE REDS"
  rot_eng_focus.21.d:0 "\"They stole our words in order to break our state. We will strip them of both.\"\n- Party lecture notes on the northern deviation\n\n--------------------------------------------------------------------------------\n\nEdinburgh has become more dangerous to London than a mere capital in rebellion. It has become a rival language of legitimacy. By speaking of councils, solidarity, and worker defense, the Scottish regime has managed to present its secession not as betrayal, but as correction. That cannot be allowed to stand.\n\nWhitehall has launched a broad offensive against every channel through which Scottish symbolism and rhetoric travel south. Printers are raided for pamphlets that echo northern slogans. Railway depots are searched for couriers. Dockworkers and students suspected of passing messages are detained under anti-subversion statutes. At the same time, British propaganda organs have begun to describe the Edinburgh government not as socialist, but as theatrical impostors cloaking nationalist opportunism in stolen revolutionary language.\n\nThe aim is larger than censorship. London means to sever the emotional bridge between English workers and the Scottish experiment, leaving Edinburgh isolated behind its own vocabulary.\n\n--------------------------------------------------------------------------------"
  rot_eng_focus.21.a:0 "Break the message. Isolate the myth."

  rot_eng_focus.22.t:0 "THE HIGHLAND RE-EDUCATION ORDER"
  rot_eng_focus.22.d:0 "\"A frontier is secured only when memory itself is brought to heel.\"\n- Instruction from the Northern Civil Security Board\n\n--------------------------------------------------------------------------------\n\nThe security leadership has concluded that temporary arrests and ad hoc internments are no longer enough. To stabilize the north, the regime will build a permanent machinery of correction. Survey teams have already moved into the hills behind the line, selecting sites for labor compounds, interrogation stations, and fenced settlements intended to receive smugglers, suspected collaborators, deserters, and those judged politically contaminated by Scottish influence.\n\nOfficially, these are re-education centers. In practice, they are instruments of intimidation meant to transform the rear areas into a landscape of warning. Families will see the trucks. Villages will hear the names. Officers at the line will know exactly where doubts lead. The war is being turned into pedagogy by other means.\n\nThe Republic now intends not only to defeat resistance, but to reorder the populations nearest to it until obedience becomes instinct.\n\n--------------------------------------------------------------------------------"
  rot_eng_focus.22.a:0 "Build the camps. Discipline the border."

  rot_eng_focus.23.t:0 "NO STEP BACKWARDS IN BRITAIN"
  rot_eng_focus.23.d:0 "\"Retreat is a political act. It tells the nation that endurance has limits. That idea must die before any soldier does.\"\n- Commissariat order appended to the Tweed directives\n\n--------------------------------------------------------------------------------\n\nThe line has been made sacred. Under the new order, every commander on the northern front is informed that a discretionary withdrawal will be treated as sabotage unless explicitly authorized by the political center. Commissars have been attached in greater numbers to line units, not merely to inspire discipline but to enforce it with revolvers, summary tribunals, and public examples.\n\nMen in the trenches understand what the order really means. If ammunition runs low, they are to hold. If the guns fail, they are to hold. If Scottish breakthroughs threaten encirclement, they are to hold until ordered otherwise by men who are not present. The Republic has made a spectacle of endurance, and now the army must inhabit it.\n\nThe Tweed ceases to be a defensive position and becomes a vow.\n\n--------------------------------------------------------------------------------"
  rot_eng_focus.23.a:0 "Hold the line. Or be buried beneath it."

  rot_eng_focus.24.t:0 "THE GUNS OF THE MIDLANDS"
  rot_eng_focus.24.d:0 "\"Movement is a luxury. Ammunition is survival. Feed the guns and let the line speak in thunder.\"\n- Production order, Midlands Ordnance Board\n\n--------------------------------------------------------------------------------\n\nThe war planners have accepted what the soldiers already know: this is no campaign of maneuver. The northern struggle has hardened into an industrial duel fought by men buried in mud and concrete. In response, London has issued a severe redirection of national production. Civilian vehicle lines are being stripped for parts, machine tooling is being reconfigured, and artillery contracts now outrank nearly every other manufacturing priority in the Republic.\n\nThe factories of the Midlands are being told to produce one thing above all others: endurance by volume. Shell casings, propellant charges, replacement barrels, fuses, and rail-lifted ammunition trains will define the next phase of the war. The goal is not elegance. It is accumulation so vast that the Scottish line is never allowed silence.\n\nEvery night the foundries burn hotter. Every morning more wagons roll north. The static front will be held not by inspiration, but by mass and steel.\n\n--------------------------------------------------------------------------------"
  rot_eng_focus.24.a:0 "Feed the batteries. Pound the line without mercy."

  rot_eng_focus.25.t:0 "THE IRON LINE ON THE TWEED"
  rot_eng_focus.25.d:0 "\"A frontier must not merely stop the enemy. It must terrify the disloyal who live behind it.\"\n- Northern Security Commission report\n\n--------------------------------------------------------------------------------\n\nThe border is being transformed into a machine of containment. Barbed corridors, fortified checkpoints, labor detachments, and surveillance posts are now spreading backward from the trenches into the rear districts, creating a second line aimed not at Scotland but at Britain itself. Smugglers, deserters, and those merely suspected of divided loyalties are being swept from villages and workshops into a new network of correction camps built close enough to the front that the guns can still be heard at night.\n\nThe regime wants the camps to be visible. Their fences cut into the hills as warnings. Supply convoys drive past them in full daylight. Local party officials are instructed to speak of them as patriotic necessities. The Iron Line is not only a military defense. It is a social geography in which fear, hunger, and suspicion are organized into policy.\n\nWhat the Scots cannot break from the north, Whitehall intends to secure from the rear with camps, wire, and unanswerable force.\n\n--------------------------------------------------------------------------------"
  rot_eng_focus.25.a:0 "Fortify the line. Purge the rear."

  rot_eng_focus.26.t:0 "THE SAPPERS' MANDATE"
  rot_eng_focus.26.d:0 "\"If the earth above us is unsafe, then we will govern from beneath it.\"\n- Engineering Corps directive to the northern army groups\n\n--------------------------------------------------------------------------------\n\nOrders have gone out to every formation on the static front: dig deeper, bury wider, conceal everything. The Republic's engineers are no longer being treated as support troops but as architects of survival. Tunnel systems are being driven beneath ridges, command posts sunk below the frost line, and artillery nests disguised under sod, timber, and poured concrete.\n\nThe work is brutal, cold, and relentless. Infantry companies already exhausted by the line are being rotated into excavation details under armed supervision. Entire sectors are beginning to disappear underground, linked by narrow trench rail and signal cable. Officers promise the soldiers that the earth will save them from shelling. Commissars remind them that refusing the work will condemn them faster than enemy guns.\n\nThe frontier is becoming subterranean. Sanders and Starmer alike understand that if the line cannot move, it must become impossible to uproot.\n\n--------------------------------------------------------------------------------"
  rot_eng_focus.26.a:0 "Dig, brace, bury, endure."

  rot_eng_focus.27.t:0 "PROJECT CAELUS"
  rot_eng_focus.27.d:0 "\"If the border cannot be inherited, then it will be rendered unusable to all who contest it.\"\n- Sealed planning note attached to Caelus authorization\n\n--------------------------------------------------------------------------------\n\nSome proposals are too monstrous to announce publicly and too useful for the regime to abandon. Project Caelus is one of them. Under extreme secrecy, chemical planners, agricultural specialists, and military engineers have been gathered to prepare a border-denial program that would poison the very value of the contested north. Defoliants, corrosive stockpiles, and contamination dispersal plans are being assembled for rapid deployment if the conflict enters a terminal phase.\n\nOfficially, nothing exists. Unofficially, storage depots are being expanded, special handling teams trained, and maps annotated with wind, runoff, and soil absorption patterns. The purpose is chillingly simple: if London cannot guarantee secure dominion over the contested ground, then no one else will be permitted to profit from it either.\n\nCaelus turns the frontier from a line to be defended into a landscape to be ruined. It is the logic of siege stretched to its ugliest conclusion.\n\n--------------------------------------------------------------------------------"
  rot_eng_focus.27.a:0 "Prepare the wasteland contingency."

  rot_eng_focus.28.t:0 "BREAD AS BAIT"
  rot_eng_focus.28.d:0 "\"A hungry border is more useful than a loyal one. Feed desperation, and it will open doors no army can.\"\n- Northern covert operations brief\n\n--------------------------------------------------------------------------------\n\nFood is no longer simply a rationed necessity. It has been drafted into the war effort. Under the supervision of intelligence handlers and quartermasters, black-market channels are being cultivated to move carefully measured supplies across the northern divide. But the shipments are not charity. They are traps.\n\nStarving civilians, petty smugglers, and desperate workers are being approached with a simple bargain: bread in exchange for information, safe passage in exchange for sabotage, grain in exchange for rumor. London calculates that famine, if directed properly, can do what artillery cannot - turn civilian misery into an intelligence network and political solvent.\n\nThe policy is grotesque, but deliberate. Hunger is being nationalized. The blockade that nearly broke England is now to be turned outward as an instrument against the Scots.\n\n--------------------------------------------------------------------------------"
  rot_eng_focus.28.a:0 "Let hunger carry our orders across the line."

  rot_eng_focus.29.t:0 "THE HARVEST BELONGS TO LONDON"
  rot_eng_focus.29.d:0 "\"No province owns its grain while the Republic starves. Wales will feed the war whether Wales consents or not.\"\n- Whitehall agricultural seizure order\n\n--------------------------------------------------------------------------------\n\nWith the northern front devouring supplies, requisition policy in Wales has shifted from pressure to outright extraction. Assessment teams, armed escorts, and transport columns now move valley to valley under emergency authority, tagging grain, livestock, and milling output for immediate seizure.\n\nAt Whitehall, Starmer justified the campaign with accounting-room clarity:\n\n"A state that permits local surplus while soldiers starve has ceased to be a state. We are not stealing from Wales. We are reallocating to survival.\"\n\nNational Agricultural Broadcast, evening edition:\n\n"Rural quota harmonization will continue through the month. Reports of indiscriminate seizures are enemy disinformation. Citizens are encouraged to cooperate with accredited requisition officers.\"\n\nIn a market lane outside Carmarthen, a farmer mutters,\n\n"They call it harmonization. I call it empty barns.\" A teacher carrying ration coupons says,\n\n"They took seed grain this morning. Next season's hunger has already been delivered.\"\n\nThe lorries leave full, and each departure writes another argument against London into the memory of the hills.\n\n--------------------------------------------------------------------------------"
  rot_eng_focus.29.a:0 "Strip the valleys bare for the front."

  rot_eng_focus.30.t:0 "THE HILLS ARE HOSTILE"
  rot_eng_focus.30.d:0 "\"Nationality, hunger, and humiliation have met in the same valley. That is how insurgencies are born.\"\n- Security assessment on western unrest\n\n--------------------------------------------------------------------------------\n\nThe first attacks were written off as theft and banditry. Then came blown rail segments, missing patrols, burned ration warehouses, and coordinated ambushes in country lanes known only to locals. The western crisis has shed all ambiguity. Welsh nationalist cells, anti-Starmer syndicalists, and rural self-defense groups are now acting in concert across parts of the countryside, turning the requisition campaign into open counterinsurgency.\n\nLondon's answer is immediate and savage. Special internal security battalions, interrogation teams, and motorized patrol groups have been dispatched into Wales with expanded authority to detain, search, and execute suspected collaborators. Villages are being mapped according to reliability. Roads are being watched. Informants are being bought with grain. The hills are treated as enemy territory even where the flag still flies.\n\nThe regime intends to demonstrate that rebellion in the west will be answered not as dissent, but as infestation.\n\n--------------------------------------------------------------------------------"
  rot_eng_focus.30.a:0 "Flood the hills with steel and informers."

  rot_eng_focus.31.t:0 "THE FIELDS UNDER ORDER"
  rot_eng_focus.31.d:0 "\"If the peasant hides grain, then the farm itself must cease to belong to him.\"\n- Resolution of the Emergency Agrarian Board\n\n--------------------------------------------------------------------------------\n\nRequisition was deemed insufficient. Compliance purchased at gunpoint still left too much discretion in local hands. Whitehall has therefore escalated to full rural collectivisation in the Welsh countryside. Private holdings are being dissolved by decree and reorganized into state-supervised agricultural syndicates, each managed by imported administrators and guarded by security detachments.\n\nFamilies who once farmed for themselves now work under quota boards nailed to communal barns. Hidden livestock are confiscated. Grain caches are catalogued as sabotage. Tools, carts, and seed reserves are pooled whether the owners consent or not. The policy is presented as rational planning, but everyone in the valleys understands its actual purpose: to break the autonomy of the land as thoroughly as the autonomy of the worker was broken in the cities.\n\nCollectivisation will fill some granaries in London. It will also convince many in Wales that there is nothing left to lose.\n\n--------------------------------------------------------------------------------"
  rot_eng_focus.31.a:0 "The land will answer to the state."

  rot_eng_focus.32.t:0 "THE DRAGON AWAKENS"
  rot_eng_focus.32.d:0 "\"A people can be bled, searched, and lectured for only so long before they decide to burn the ledger instead.\"\n- Intercepted message from a Welsh insurgent coordinator\n\n--------------------------------------------------------------------------------\n\nThe western crisis has crossed from insurgency to uprising. Requisition offices are burning, checkpoints are collapsing, and armed crowds are coordinating across districts that were once isolated pockets of unrest. Old national banners now appear beside stolen military equipment, and the revolt is spreading faster than local security can seal roads.\n\nIn a televised emergency statement, Starmer promised annihilation of the rebellion:\n\n"This is not grievance. It is armed dismemberment of the Republic. The response will be total, legal, and immediate. Those who shelter revolt will be treated as revolt.\"\n\nHome Front Emergency Broadcast:\n\n"Curfew expanded in all designated western sectors. Military transit corridors are now priority routes. Unauthorized movement, aid, or communication with insurgent-held districts will be prosecuted under wartime treason code.\"\n\nOn a darkened Cardiff street, a shopkeeper whispers,\n\n"Yesterday it was slogans, today it's rifles.\" A young mechanic answers,\n\n"Yesterday they took food. Today people decided to stop asking.\" Sirens drown out the rest.\n\nThe dragon has awakened. London now intends to make Wales an example before the fire finds other provinces.\n\n--------------------------------------------------------------------------------"
  rot_eng_focus.32.a:0 "Crush the uprising before Britain fractures."

  rot_eng_focus.33.t:0 "$ENG_The_Conquest_of_Cardiff$"
  rot_eng_focus.33.d:0 "$ENG_The_Conquest_of_Cardiff_desc$"

  rot_eng_focus.42.t:0 "THE WESTERN FRONT STALLS"
  rot_eng_focus.42.d:0 "Thirty days of war in Wales have shattered every assumption made in Whitehall. The nationalist rising has proven far stronger, better coordinated, and more heavily armed than the Secretariat predicted. Convoys vanish in the valleys. Patrols are lured into kill-zones by false retreat signals. Entire road columns are finding barricades, demolitions, and sniper nests prepared in advance as though the Welsh command already knew where the Republic would strike.\n\nThe explanation now spreading through the ministries is as dangerous as the battlefield reality itself: the Welsh must have had outside help. In Congress, furious delegates are openly claiming that the Scottish regime has been supplying the rebellion with planners, radios, explosives, and experienced cadres from the northern war. What had been described as a provincial revolt is now being spoken of as a coordinated anti-London front stretching from the Tweed to the valleys.\b\bThe political consequences have been immediate. Congress has turned murderous. Starmer's critics accuse him of starving England for a campaign he did not understand, while his loyalists insist the disaster only proves the need for an even harsher settlement. Behind closed doors, the officer corps has moved beyond complaint. Intelligence intercepts and whispered testimony both suggest that sections of the military have begun drafting secret contingency plans to remove the civilian leadership altogether if the Welsh front cannot be stabilized.\n\n--------------------------------------------------------------------------------"
  rot_eng_focus.42.a:0 "Starmer breaks the plot and orders Cardiff taken."
  rot_eng_focus.42.b:0 "The army moves first and takes control."
  rot_eng_focus.43.t:0 "THE NIGHT OF THE IRON BROOM"
  rot_eng_focus.43.d:0 "\"Paranoia is not a disease; it is a biological necessity for survival.\"\n- attributed to Keir Starmer after the Winter of '25\n\n--------------------------------------------------------------------------------\n\nKeir Starmer had spent the years after the Winter of '25 watching the shadows, convinced that the daggers would not come from dead parliamentarians or striking dockworkers, but from the men still holding the rifles. So when a ciphered transmission from the Tweed front bypassed the Commissariat's desk at midnight, the machinery of the state security apparatus did not hesitate. It sprinted.\n\nThe coup was strangled in its cradle. In a coordinated, silent sweep across London and the northern command bunkers, Starmer's internal security detachments struck first. Frontline generals were dragged from their cots in their undergarments, while garrison commanders were intercepted in back-room planning offices before they could issue the march orders. By three in the morning, the courtyards of Wandsworth Prison were echoing with the rhythmic, mechanical cracks of firing squads.\n\nAs the sun rose over a terrified capital, Starmer stood on the balcony at Whitehall alongside Dermot Hudson, the only man whose fanaticism matched his own. The military command had been thoroughly decapitated, replaced by ideological political officers who knew little of logistics and everything of obedience. England was a bleeding, starving wreck, surrounded and hollowed out from within, but Starmer still held the keys. If the conventional army could not break the stalemate, Hudson's project at Aldermaston would have to supply a more radioactive solution.\n\nThe plot has been broken, but the Republic that survives it is harder, smaller, and far more desperate than before.\n\n--------------------------------------------------------------------------------\n\nUnlocks the Starmer-Hudson / Totalitarian Fortress path."
  rot_eng_focus.43.a:0 "Let the Tweed burn if it must. We survive."
  rot_eng_focus.44.t:0 "THE LIGHTS GO OUT IN WHITEHALL"
  rot_eng_focus.44.d:0 "The rainfall over London that night carried the smell of soot, turnip starch, and decay. For months the grand socialist experiment of the U.S.B.R. had been reduced to figures on chalkboards: calories rationed, shells expended along the Tweed, and miles of wire lost in the Welsh valleys. Inside the Cabinet Office, General Secretary Keir Starmer sat beneath the dim hum of a single desk lamp drafting yet another list of internal subversives to be handed to the executioners. He did not hear the boots on the carpet until the door was already opening.\n\nThey were not his secret police. They were officers from the front, mud-flecked and sleepless veterans of the Tweed defense grid, flanked by the commandants of the London Garrison. There were no ideological speeches and no grand declarations about the proletariat. One Red Army general stepped forward, his trench coat dripping across Starmer's immaculate paperwork, and laid a heavy service pistol on the blotter.\n\n\"The Party is adjourned, Comrade Starmer,\" he said, his voice flat with exhaustion. \"The rations are empty. The borders are broken. We are taking custody of the state before you bury us all in concrete.\"\n\nStarmer reached for the telephone, but the line had already been cut. Outside, the rumble of armored carriers replacing the security pickets announced the dawn of a new and silent Britain. The civilian republic was finished. Only the garrison remained.\n\n--------------------------------------------------------------------------------\n\nUnlocks ENG_Garrison_State, the Military Junta path."
  rot_eng_focus.44.a:0 "The Army will secure the home front."

  ENG_welsh_campaign_cat:0 "The Welsh Emergency"
  ENG_welsh_campaign_cat_desc:0 "Wales has become a test of whether London can still impose its will by force. Every day the war drags on, England starves and the regime's authority decays."
  ENG_break_wales_in_thirty_days:0 "Break Wales in Thirty Days"
  ENG_break_wales_in_thirty_days_desc:0 "Wales must be crushed before the western harvest failure and battlefield losses tear the regime apart."
  ENG_welsh_famine_cleanup:0 "Severed Western Arteries"
  ENG_welsh_famine_cleanup_desc:0 "With Wales still outside London's grasp, England is being starved by its own campaign."
  ENG_severed_western_arteries:0 "Severed Western Arteries"
  ENG_severed_western_arteries_desc:0 "Wales was the republic's breadbasket. With the western valleys in revolt and the harvest disrupted, factories slow, shelves empty, and public order decays week by week."



  rot_eng_focus.35.t:0 "THE ASHES OF THE WEST"
  rot_eng_focus.35.d:0 "The gamble has failed, and the valleys have gone silent. For ninety days the Western Front threatened to swallow London's ambitions whole. But where paranoia failed, raw industrialized brutality succeeded. The improvised barricades of the Plaid partisans could not hold against the desperate, relentless wave of Red Army divisions. Today, the republic's tricolor flies over a blackened Cardiff City Hall.\n\nThe rations are no longer starch and sawdust. Grain is flowing east once more, and with it a dark, fanatical rejuvenation has swept through the English ranks. They are no longer a starving garrison waiting to die. They are conquerors who have tasted blood.\n\nIn Whitehall, Starmer studies the map of Great Britain. The western stain has been scrubbed away. The factories are humming, the home front is secured, and a million eyes are turning toward the cold trenches of the Scottish border. The stalemate is no longer permanent.\n\n\"We have mended the west,\" the broadcast crackles across the nation. \"Now, we march north.\"\n\n--------------------------------------------------------------------------------"
  rot_eng_focus.35.a:0 "Scotland is next."

  rot_eng_focus.36.t:0 "$ENG_Restore_the_Greater_Map$"
  rot_eng_focus.36.d:0 "$ENG_Restore_the_Greater_Map_desc$"

  rot_eng_focus.37.t:0 "$ENG_The_Ulster_Ultimatum$"
  rot_eng_focus.37.d:0 "$ENG_The_Ulster_Ultimatum_desc$"

  rot_eng_focus.38.t:0 "$ENG_The_Belfast_Amphibious_Assault$"
  rot_eng_focus.38.d:0 "$ENG_The_Belfast_Amphibious_Assault_desc$"

  rot_eng_focus.39.t:0 "$ENG_Enforce_the_Republic_Line$"
  rot_eng_focus.39.d:0 "$ENG_Enforce_the_Republic_Line_desc$"

  rot_eng_focus.40.t:0 "$ENG_The_Irish_Conquest_Campaign$"
  rot_eng_focus.40.d:0 "$ENG_The_Irish_Conquest_Campaign_desc$"

