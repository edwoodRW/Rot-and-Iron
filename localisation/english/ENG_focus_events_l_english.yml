  rot_eng_focus.45.t:0 "THE ISLAND REJOINED"
  rot_eng_focus.45.d:0 "Red Army trucks are parked on the sidewalks, and civilians are lined up against a stone wall with their hands behind their heads under the glare of searchlights.\n\nThe Peace of the Grave\n\nThe final hours of the Scottish War did not end with a dignified surrender; they ended with the sound of breaking glass and screaming. In the streets of Edinburgh and Glasgow, the victory of the U.S.B.R. is being written in blood. Internal security detachments, carrying lists compiled over months of frozen stalemate, are moving block by block. Anyone suspected of nationalist ties, anyone who served in the Edinburgh Soviet, and anyone caught hoarding a scrap of food is dragged into the rain. The cracks of rifles echo down the stone alleys as hundreds are shot on the spot, their bodies left on the pavement as a warning. Tens of thousands more are bundled into the backs of canvas-topped trucks, bound for the bleak, barbed-wire perimeters of the Highland Re-education camps. Smoke from burning union halls and regional registries hangs like a funeral shroud over the Clyde. Scotland is being systematically murdered.\b\bYet, on the television screens across a starving England, the static suddenly clears. The image that appears is peaceful. Clean. Quiet. General Secretary Keir Starmer sits behind a pristine mahogany desk, looking directly into the camera with the unblinking, sterile calm of a prosecutor delivering a closing argument. The sound of gunfire in the north is replaced by his measured, clinical cadence:\n\n"Good evening. Over the last few months, this country has faced a series of profound, existential challenges. There are those who looked at the blockade, who looked at the freezing winter, and who concluded that the United Socialist British Republic was on the brink of collapse. They thought we would break. They were wrong.\n\nLet me be absolutely clear to the British people, and to those watching abroad: the era of division on this island is over. Today, the Red Army breached the Tweed. As I speak to you tonight, our security detachments are successfully restoring order, stability, and the rule of law to the streets of Edinburgh and Glasgow. The so-called 'Edinburgh Soviet' has been completely dismantled. Now, I know the sacrifices that have been asked of you. I know the reality of the rations. But we are a serious government, made up of serious people, and we have taken the hard choices necessary to secure our collective future. The factions who sought to tear this republic apart have found out the hard way that the state will not tolerate lawlessness. The rules apply to everyone. To the people of Scotland, my message is simple: the period of reckless deviation is at an end. Compliance is not optional. Industry will be redirected, resources will be centralized, and any further attempts to undermine the integrity of our borders will be met with the full, unmitigated force of the internal security apparatus. We have stabilized the nation. We have secured the island. Now, we rebuild the fortress. Thank you.""
  rot_eng_focus.45.a:0 "Order has been restored."


 ENG_Hudson_Elected:0 "Hudson Elected"
 ENG_Hudson_Elected_desc:0 "Nobody in the revolutionary council took Dermot Hudson especially seriously, a minor figure from the party's hardest fringe, running on a platform that amounted to a single blunt promise: end the war, end the compromises, finish the revolution Starmer never had the stomach to complete. Nobody is laughing anymore. Hudson wins not narrowly but decisively, carried by a war-exhausted public that heard exactly one word in his entire platform, peace, and stopped listening before he got to the rest of it."



 ENG_The_New_England_Revolution:0 "The New England Revolution"
 ENG_The_New_England_Revolution_desc:0 "Hudson's inauguration address runs twice as long as his entire election campaign combined, a sweeping declaration that the half-finished revolution of 1999 is about to be completed at last. He says the word peace exactly once, near the end, almost as an afterthought. Nobody watching notices at the time. They will.\n\nFor one brief season, the war-weary public allows itself something it hasn't felt in years: hope."

 ENG_Betray_the_Peace_Promise:0 "Betray the Peace Promise"
 ENG_Betray_the_Peace_Promise_desc:0 "The peace talks Hudson promised never actually happen. What happens instead is a lengthy televised address explaining, in careful and increasingly ominous language, that the Scottish question cannot be resolved through the same tired diplomacy that failed for five years under Starmer, that it requires instead a revolutionary solution, total, final, uncompromising. The crowds who voted for peace slowly realise they voted for something else entirely."

 ENG_Purge_the_Starmerites:0 "Purge the Starmerites"
 ENG_Purge_the_Starmerites_desc:0 "The revolutionary council that spent twenty-seven years carefully managing England's politics discovers, too late, that it has no mechanism left to manage Hudson. Arrests come first for the council's senior figures, then for their deputies, then for anyone who served them, a purge that moves with a speed and thoroughness the old Starmer bureaucracy was never built to survive. Some flee. Most don't get the chance."

 ENG_Proclaim_Hudson_Thought:0 "Proclaim Hudson Thought"
 ENG_Proclaim_Hudson_Thought_desc:0 "A new doctrine is unveiled in a speech broadcast to every household in the country, mandatory listening enforced down to the factory floor: Hudson Thought, a total ideology of self-reliance, revolutionary purity, and absolute loyalty to the one man capable, Hudson insists, of finishing what 1999 started. The old revolutionary socialism of Starmer's era is quietly, permanently retired."

 ENG_The_Personality_Cult_Begins:0 "The Personality Cult Begins"
 ENG_The_Personality_Cult_Begins_desc:0 "Portraits of Hudson appear in every classroom, every factory canteen, every railway platform, first as an administrative directive and within months as something that looks disturbingly like genuine devotion. State radio begins every broadcast with a brief tribute to his wisdom. Children are taught his biography before they're taught their multiplication tables."

 ENG_Close_the_Borders:0 "Close the Borders"
 ENG_Close_the_Borders_desc:0 "Travel visas are suspended, foreign journalists expelled, and the remaining diplomatic missions in London find their movements restricted to a handful of city blocks. Hudson's government frames it as protecting the revolution from capitalist and revisionist contamination alike. What it actually does is make England very difficult for the rest of the world to see into, which may have been the point all along."

 ENG_Establish_the_Loyalty_Register:0 "Establish the Loyalty Register"
 ENG_Establish_the_Loyalty_Register_desc:0 "Every citizen is formally sorted into one of three tiers, Core, Wavering, and Hostile, based on family history, past political associations, and the kind of denunciations neighbours have apparently been filing against each other for months without anyone quite noticing. Housing, rations, and employment all now flow through this register. Your grandfather's politics, it turns out, can still decide your dinner."

 ENG_Nationalize_Everything:0 "Nationalize Everything"
 ENG_Nationalize_Everything_desc:0 "What remained of private enterprise under Starmer's cautious mixed economy is absorbed entirely into the state in a single sweeping decree, shops, farms, the last independent newspapers, all of it. Hudson's government calls it the final completion of 1999's unfinished work. The empty shelves that follow within weeks are explained, with total consistency, as the deliberate sabotage of capitalist holdouts rather than anything resembling cause and effect."

 ENG_The_Military_First_Doctrine:0 "The Military-First Doctrine"
 ENG_The_Military_First_Doctrine_desc:0 "Military spending is formally declared the state's first priority, ahead of housing, ahead of food production, ahead of everything, on the theory that an England strong enough to finish the Scottish war has no need to worry about anything else. The army, already the most trusted institution left standing after the purges, becomes the only institution that genuinely still functions."

 ENG_Build_the_Camps:0 "Build the Camps"
 ENG_Build_the_Camps_desc:0 "Facilities begin construction in the remote stretches of Northumberland and Cumbria, officially described as re-education and labour centres for citizens the Loyalty Register has marked Hostile. Few who enter are seen again by their families. State media does not discuss them. Most of the country, for now, chooses not to ask."

 ENG_The_Eternal_War:0 "The Eternal War"
 ENG_The_Eternal_War_desc:0 "Hudson addresses the nation to formally declare what has been true in practice for months: there will be no peace with Scotland, not now, not ever, only an endless revolutionary struggle against a separatist enemy that must be defeated completely or not at all. The war he was elected to end is, by his own decree, now permanent, a line on the map that both sides understand will never move again without another war to move it."

 ENG_Harden_the_Border:0 "Harden the Border"
 ENG_Harden_the_Border_desc:0 "The line along the Tweed, informal and lightly garrisoned for most of the conflict's five years, is rebuilt from scratch: minefields, watchtowers, a fortified strip nearly impassable in either direction. England and Scotland, Hudson's planners note with something close to satisfaction, are no longer merely at war. They are now, physically and permanently, two separate worlds."

 ENG_Develop_Strategic_Weapons:0 "Develop Strategic Weapons"
 ENG_Develop_Strategic_Weapons_desc:0 "A classified directive authorizes the diversion of England's remaining industrial capacity toward a weapons programme nobody outside a small circle of generals and physicists is permitted to discuss. Hudson's logic is blunt even by his standards: a revolution surrounded by enemies on every side survives only if those enemies are afraid enough of it to leave it alone."

 ENG_The_Succession_Question:0 "The Succession Question"
 ENG_The_Succession_Question_desc:0 "Hudson is not a young man, and the revolutionary council he gutted left behind no mechanism for choosing what comes after him. Quiet preparations begin anyway, a nephew promoted rapidly through the party apparatus, portraits of a second face beginning to appear alongside Hudson's own in carefully controlled doses, the unmistakable early architecture of a dynasty built from a revolution that was never supposed to have one."

 ENG_The_Hermit_Commune:0 "The Hermit Commune"
 ENG_The_Hermit_Commune_desc:0 "What began as an election promise to finally end a five-year war has become, within a few short years, one of the most isolated, tightly controlled states on Earth, a permanent war footing, a closed border, a population sorted by loyalty and watched by its neighbours, a man whose portrait hangs in every room. Historians will spend decades arguing about the exact moment England stopped being a flawed democracy and became something else entirely. There was never just one moment. There were dozens, and nobody stopped any of them."



