  rot_eng_focus.6.t:0 "THE ARCHITECTURE OF IRON"
  rot_eng_focus.6.d:0 "\"We did not dismantle the old order merely to tolerate instability in the new. Power must have a single center, a single voice, and a single will.\"\n- Keir Starmer, Westminster Hall\n\n--------------------------------------------------------------------------------\n\nThe rows of benches inside the Revolutionary Congress were completely silent as General Secretary Keir Starmer stepped to the dispatch box. He did not waste time on ideological prose or theatrical rhetoric. Instead, he unrolled a massive, updated map of the British Isles directly over the central table and laid out the stark reality of the 1999 Constitution.\n\n\"The introduction of this constitution is not an academic exercise,\" Starmer stated, his voice cutting clearly through the chill of the chamber.\n\n"It is the immediate blueprint for the total mobilization of this Republic. As of this hour, all regional devolution pacts are permanently dissolved. Power is centralized entirely within the Secretariat to execute a three-stage transition.\"\n\nHe pointed directly to the map, tracing the new administrative lines:\n\n\"First, the domestic front will be entirely rationalised. Every factory, shipyard, and resource pool from Cornwall to the borders will be brought under direct, centralised Whitehall command to break the blockade. Second, the military command structure is being unified under the state apparatus; the independent militias will be absorbed into the Red Army, and the defense grids will be manned by immediate emergency conscription. Third, once our internal security is absolute, we will turn our eyes outward to rectify the territorial anomalies born from our temporary weakness.\"\n\nHe looked up at the assembly of party officials and military officers, his expression flat and unyielding.\n\n\"The era of crisis management is over. The era of the planned state has begun. Any administrative district, any trade union, or any individual that fails to meet their assigned quota or objects to this centralization will be treated as an active saboteur. We have the plan. We have the authority. We will now enforce it.\"\n\n--------------------------------------------------------------------------------"
  rot_eng_focus.6.a:0 "The blueprint is set. Begin the mobilization."

  rot_eng_focus.7.t:0 "$ENG_GARRISON_THE_LOWLANDS$"
  rot_eng_focus.7.d:0 "$ENG_GARRISON_THE_LOWLANDS_desc$"

  rot_eng_focus.8.t:0 "THE ARCHITECTURE OF IRON"
  rot_eng_focus.8.d:0 "\"We did not dismantle the old order merely to tolerate instability in the new. Power must have a single center, a single voice, and a single will.\"\n- Keir Starmer, Westminster Hall\n\n--------------------------------------------------------------------------------\n\nThe rows of benches inside the Revolutionary Congress were completely silent as General Secretary Keir Starmer stepped to the dispatch box. He did not waste time on ideological prose or theatrical rhetoric. Instead, he unrolled a massive, updated map of the British Isles directly over the central table and laid out the stark reality of the 1999 Constitution.\n\n\"The introduction of this constitution is not an academic exercise,\" Starmer stated, his voice cutting clearly through the chill of the chamber.\n\n"It is the immediate blueprint for the total mobilization of this Republic. As of this hour, all regional devolution pacts are permanently dissolved. Power is centralized entirely within the Secretariat to execute a three-stage transition.\"\n\nHe pointed directly to the map, tracing the new administrative lines:\n\n\"First, the domestic front will be entirely rationalised. Every factory, shipyard, and resource pool from Cornwall to the borders will be brought under direct, centralised Whitehall command to break the blockade. Second, the military command structure is being unified under the state apparatus; the independent militias will be absorbed into the Red Army, and the defense grids will be manned by immediate emergency conscription. Third, once our internal security is absolute, we will turn our eyes outward to rectify the territorial anomalies born from our temporary weakness.\"\n\nHe looked up at the assembly of party officials and military officers, his expression flat and unyielding.\n\n\"The era of crisis management is over. The era of the planned state has begun. Any administrative district, any trade union, or any individual that fails to meet their assigned quota or objects to this centralization will be treated as an active saboteur. We have the plan. We have the authority. We will now enforce it.\"\n\n--------------------------------------------------------------------------------"
