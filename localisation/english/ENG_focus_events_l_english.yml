l_english:
  rot_eng_focus.1.t:0 "$ENG_THE_LIFELINE_SNAPS$"
  rot_eng_focus.1.d:0 "\"The blockade is total. The factories are silent. Our soldiers will fight with what they have in their hands, or they will not fight at all.\"\n- Commissariat of Production, London\n\n--------------------------------------------------------------------------------\n\nThe first report reached Whitehall before dawn: the last maritime route has been severed. The hostile coalition has closed the sea with destroyers, patrol aircraft, and inspection orders that leave no room for evasion. For months the Republic survived on a thin and shameful stream of foreign machine parts, chemical feedstock, and precision tooling smuggled through sympathetic ports. That trickle is gone now. The war machine has not simply been strained. It has been cut open.\n\nIn the industrial districts, the effect is immediate enough to be heard. Belts slow, presses stop, furnaces cool, and whole lines of shell production go from rhythmic clatter to silence. Men stand beside half-finished tank treads and read ration notices pinned to tool cabinets. At the front, quartermasters crack open wooden crates expecting detonators, belts, or spare barrel assemblies, and find only stamped orders telling them to conserve, improvise, and pray.\n\nBy the time the emergency lamps came on in the War Room, General Secretary Keir Starmer had already been briefed twice by naval staff, once by production officers, and once by men who could not quite bring themselves to say the words \"strategic strangulation.\" He listened without interruption. When the final chart was unrolled across the table, he leaned over it in silence, hands flat on the map of Britain, and answered the room with the same cold arithmetic every man there understood: if the Republic can no longer buy time from the outside world, then it must extract it from its own soil, its own workers, and its own bones.\n\nThe statement went out within the hour on state radio.\n\nMorning Bulletin, London Network: \"All civil and military departments are instructed to prepare for emergency internal substitution measures. Unofficial trade routes are considered compromised. Industrial consumption will now be subordinated to national survival priorities. Citizens are reminded that resilience is a patriotic duty.\"\n\nOutside the ministries, the city already sounded different. Dockworkers smoked in tight circles and said nothing about the ships. A member of staff from the underground in Lambeth told a passenger, \"If they can't import shells, they'll just ask for more of us.\" In a queue for bread near King\'s Cross, an old woman stared at the news placard and muttered, \"Then let them stop pretending this is temporary.\"\n\nThe external lifeline is dead. The Republic survives only if Whitehall can turn scarcity into discipline before the coming offensives begin.\n\n--------------------------------------------------------------------------------"
  rot_eng_focus.1.a:0 "We must rely on our own iron."

  rot_eng_focus.2.t:0 "THE DRY PUMPS"
  rot_eng_focus.2.d:0 "\"Every drop of oil wasted on civilian heating is a bullet handed to the enemies of the Republic.\"\n- Commissariat of Logistics, Sheffield\n\n--------------------------------------------------------------------------------\n\nWith the blockade choking off foreign chemical and oil imports, the drilling rigs clinging to the stormy waters of the North Sea are the only thing keeping the U.S.B.R. from sliding into total paralysis. But the math is unforgiving. There is simply not enough fuel to run the communal tractor fleets, heat the civilian housing blocks, and keep the Red Army's armored columns moving at the front lines.\n\nBy order of Whitehall, the civilian valves have been shut tight.\n\nArmed security detachments have taken operational control of all internal fuel depots and pipeline junctions. Private transit has been completely criminalized, leaving urban streets empty save for patrolling military vehicles. Central heating to worker cooperatives and residential flats has been reduced to a freezing minimum, forcing the population to endure the bitter cold with nothing but heavy coats and state-issued rations.\n\nThe people will freeze in the dark, but the state's tanks will have fuel. Starmer's logistical directive is absolute: industrial mobility belongs exclusively to the military, and domestic comfort is a luxury the revolution can no longer afford.\n\n--------------------------------------------------------------------------------"
  rot_eng_focus.2.a:0 "Secure the reserves. Fuel the war machine."

  rot_eng_focus.3.t:0 "$ENG_SEIZE_THE_DOCKYARDS$"
  rot_eng_focus.3.d:0 "$ENG_SEIZE_THE_DOCKYARDS_desc$"

  rot_eng_focus.4.t:0 "THE BROKEN GAVEL"
  rot_eng_focus.4.d:0 "\"Strikes in a worker's state are a logical impossibility. To stop production is to sabotage the proletariat. It will be treated as treason.\"\n- Starmer's Address to the TUC\n\n--------------------------------------------------------------------------------\n\nThe syndicates and trade unions believed that because they built the foundations of this Republic, they retained the right to bargain with it. They were wrong. As resource shortages deepened and wildcat strikes threatened to paralyze the vital docks and munitions works, the state security apparatus moved to eliminate the last remaining hubs of independent worker autonomy.\n\nIn a coordinated midnight sweep, internal security detachments stormed the headquarters of the Trade Union Congress and local transport syndicates. Independent shop stewards were dragged from their offices in handcuffs, replaced immediately by disciplined, state-appointed party commissars who view production quotas as a military command. Collective bargaining has been outlawed; the right to strike has been permanently abolished.\n\nThe old labor halls, once places of fierce debate and solidarity, have been silenced. Factory floors are now patrolled by armed guards ensuring the machinery never stops. Starmer has broken the very organizations that brought him to power, proving that in the U.S.B.R., the worker does not control the state - the state controls the worker.\n\n--------------------------------------------------------------------------------"
  rot_eng_focus.4.a:0 "The factory floors will remain quiet."

  rot_eng_focus.5.t:0 "THE DRY PUMPS"
  rot_eng_focus.5.d:0 "\"Every drop of oil wasted on civilian heating is a bullet handed to the enemies of the Republic.\"\n- Commissariat of Logistics, Sheffield\n\n--------------------------------------------------------------------------------\n\nWith the blockade choking off foreign chemical and oil imports, the drilling rigs clinging to the stormy waters of the North Sea are the only thing keeping the U.S.B.R. from sliding into total paralysis. But the math is unforgiving. There is simply not enough fuel to run the communal tractor fleets, heat the civilian housing blocks, and keep the Red Army's armored columns moving at the front lines.\n\nBy order of Whitehall, the civilian valves have been shut tight.\n\nArmed security detachments have taken operational control of all internal fuel depots and pipeline junctions. Private transit has been completely criminalized, leaving urban streets empty save for patrolling military vehicles. Central heating to worker cooperatives and residential flats has been reduced to a freezing minimum, forcing the population to endure the bitter cold with nothing but heavy coats and state-issued rations.\n\nThe people will freeze in the dark, but the state's tanks will have fuel. Starmer's logistical directive is absolute: industrial mobility belongs exclusively to the military, and domestic comfort is a luxury the revolution can no longer afford.\n\n--------------------------------------------------------------------------------"
