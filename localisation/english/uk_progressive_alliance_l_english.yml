l_english:
 ENG_The_Westminster_Coalition:0 "The Westminster Coalition"
 ENG_The_Westminster_Coalition_desc:0 "Westminster has seen plenty of marriages of convenience. This one has to be something better: a Labour-led alliance that feels rooted in real places, not stitched together for the Sunday shows. Burnham's job is to turn Labour ballast, Liberal reformism, and Green urgency into a government that sounds less like process and more like Britain getting its footing back."
 ENG_The_Fair_Votes_Referendum:0 "The Fair Votes Referendum"
 ENG_The_Fair_Votes_Referendum_desc:0 "Too many towns have been treated as safe seats, stage props, or write-offs. Electoral reform is not a hobby for constitutional obsessives; it is a way of telling people in every estate, suburb, city, and county that their vote will finally count for more than padding out somebody else's majority."
 ENG_The_Green_Industrial_Trust:0 "The Green Industrial Trust"
 ENG_The_Green_Industrial_Trust_desc:0 "Burnham's version of the green transition is simple: if Britain is going to decarbonise, Britain should build the kit, train the workers, and keep the jobs. This is not green sermonising from a conference stage; it is an industrial plan with oil under its nails and sea salt in its lungs."
 ENG_The_Fiscal_Responsibility_Pact:0 "The Fiscal Responsibility Pact"
 ENG_The_Fiscal_Responsibility_Pact_desc:0 "The country cannot be rebuilt on vibes alone, but neither can it be run forever by Treasury caution. The pact is meant to calm the markets without surrendering the future, giving Burnham room to argue that discipline is not the opposite of ambition if the ambition is to make the country work again."
 ENG_Re_Enter_The_European_Fold:0 "Re-Enter the European Fold"
 ENG_Re_Enter_The_European_Fold_desc:0 "Burnham is not interested in refighting the referendum as a culture war pantomime. He wants practical cooperation back: smoother trade, easier supply chains, and a relationship with Europe that feels less like a family row frozen in time and more like grown-ups finally putting the shelves back up."
 ENG_The_Kind_Borders_Act:0 "The Kind Borders Act"
 ENG_The_Kind_Borders_Act_desc:0 "Firm, fair, and decent. That is the line Burnham wants the country to hear. The point is to restore control without cruelty, to break the gangs, clear the backlog, and prove that a state can be humane without looking helpless and orderly without sounding vicious."
 ENG_Cool_Britannia_2.0:0 "Cool Britannia 2.0"
 ENG_Cool_Britannia_2.0_desc:0 "This is not nostalgia for the 1990s in a new font. It is an attempt to recover that lost feeling that Britain can be open, inventive, stylish, confident, and still rooted in ordinary life. Burnham wants a country that feels alive again, not merely governed."
 ENG_The_Progressive_Pact:0 "The Progressive Pact"
 ENG_The_Progressive_Pact_desc:0 "The alliance cannot survive as a temporary anti-disaster arrangement. It needs a governing story. The Progressive Pact is Burnham's answer: a common programme built around decent work, regional pride, civic reform, and the idea that modern Britain should feel fairer without becoming bloodless."
 ENG_The_Gorton_Manifesto:0 "The Gorton Manifesto"
 ENG_The_Gorton_Manifesto_desc:0 "Named for the Manchester seat where Labour politics is expected to mean something in people's daily lives, the manifesto is meant to be practical idealism in print. No grand theory of history, no consultant jargon, just a plain promise that government should once again be on the side of the places that kept being told to wait."
 ENG_PR_Or_Riot:0 "PR or Riot"
 ENG_PR_Or_Riot_desc:0 "The slogan is half joke, half warning. Burnham knows the old political system cannot simply be tidied up and trusted again. If Westminster keeps hoarding power while millions feel permanently unheard, the next backlash will be uglier than the last. Better to reform the system while the country is still willing to listen."
 ENG_The_Council_of_The_Regions:0 "The Council of the Regions"
 ENG_The_Council_of_The_Regions_desc:0 "If Westminster is always the only room that matters, Britain will keep thinking in one accent and governing in one rhythm. A Council of the Regions would give the North, the Midlands, the Celtic nations, and the great city-regions a permanent place in the national conversation rather than inviting them in only when London needs applause."
 ENG_A_New_Reality:0 "A New Reality"
 ENG_A_New_Reality_desc:0 "The old settlement is finished, and dressing it back up will not save it. Burnham's project now becomes more open in its ambition: not to patch up a tired central state, but to build a Britain that looks and sounds different from the one that drifted into managed decline."
 ENG_The_Atlantic_Renaissance:0 "The Atlantic Renaissance"
 ENG_The_Atlantic_Renaissance_desc:0 "Britain should be more than a nervous island bargaining for scraps. Burnham wants a wider democratic revival across the Atlantic world, built on labour standards, clean industry, cultural confidence, and the sense that free societies ought to make life feel better, not just safer."
 ENG_The_Democratic_Handshake:0 "The Democratic Handshake"
 ENG_The_Democratic_Handshake_desc:0 "The special relationship has too often meant taking dictation with a smile. Burnham's version would be more equal and more useful: a partnership with other democracies built around workers, technology, security, and the practical business of keeping open societies strong enough to endure."
 ENG_The_Nordic_Celtic_Arc:0 "The Nordic-Celtic Arc"
 ENG_The_Nordic_Celtic_Arc_desc:0 "Britain's nearest political cousins are not always its loudest allies. The Nordic-Celtic Arc imagines a bloc of northern democracies bound by energy cooperation, maritime strategy, labour rights, and the quiet confidence of states that still think the public realm is worth defending."
 ENG_The_Nordic_Celtic_High_Command:0 "The Nordic-Celtic High Command"
 ENG_The_Nordic_Celtic_High_Command_desc:0 "Security cooperation does not have to sound imperial to be serious. Burnham's planners want a northern command framework that protects sea lanes, energy grids, and democratic infrastructure while proving that collective defence can be modern, regional, and free of old great-power theatre."
 ENG_The_London_DC_Dublin_Axis:0 "The London-DC-Dublin Axis"
 ENG_The_London_DC_Dublin_Axis_desc:0 "Awkward as the name is, the logic is clear. London, Washington, and Dublin sit at a democratic crossroads shaped by trade, migration, tech, and security. Burnham wants that triangle to become a working political habit rather than a set of occasional phone calls made in a panic."
 ENG_The_Brussels_Protocol:0 "The Brussels Protocol"
 ENG_The_Brussels_Protocol_desc:0 "Reconciliation with Europe cannot stop at customs paperwork. The Brussels Protocol is meant to lock Britain into a broader understanding with the continent on labour standards, industrial policy, security coordination, and the simple idea that cooperation should produce something ordinary people can actually feel."
 ENG_The_New_City_Compact:0 "The New City Compact"
 ENG_The_New_City_Compact_desc:0 "Burnham's Britain is built from the city outward. The New City Compact would give urban Britain more room to govern itself, invest for the long term, and stop begging Whitehall for permission to fix transport, housing, policing, and growth on its own patch."
 ENG_The_BEE_Network:0 "The Bee Network"
 ENG_The_BEE_Network_desc:0 "What worked in Greater Manchester should not stay trapped there. The Bee Network becomes the model for a more connected Britain: public transport that people can understand, afford, and rely on, run as a civic service instead of a maze of excuses and branding exercises."
 ENG_Public_Tracks_Public_Hands:0 "Public Tracks, Public Hands"
 ENG_Public_Tracks_Public_Hands_desc:0 "Rail is too important to be left as a patchwork of broken franchises, outsourced blame, and fares nobody can defend. Burnham wants the tracks and the system around them brought back into public purpose, so that movement across the country feels like infrastructure again rather than punishment."
 ENG_The_Digital_Commons:0 "The Digital Commons"
 ENG_The_Digital_Commons_desc:0 "The next public utility will not just be pipes, roads, and pylons. It will be data, fibre, platforms, and access. Burnham's digital commons is about treating connectivity as basic national wiring, not a luxury product sold back to people in postcode-sized instalments."
 ENG_The_Powerhouse_Realized:0 "The Powerhouse Realised"
 ENG_The_Powerhouse_Realized_desc:0 "The Northern Powerhouse spent too many years as a slogan looking for a budget line. Burnham wants to turn it into something solid: transport that joins up, investment that stays put, and a regional economy that no longer has to apologise for wanting more than hand-me-down growth."
 ENG_The_Devolved_State:0 "The Devolved State"
 ENG_The_Devolved_State_desc:0 "Britain cannot be renewed by treating every local problem as a departmental memo in Whitehall. The devolved state would shift power outward on purpose, trusting mayors, councils, and nations to govern in their own name instead of spending their lives waiting for central permission."
 ENG_The_declaration_Of_Manchester:0 "The Declaration of Manchester"
 ENG_The_declaration_Of_Manchester_desc:0 "If London once wrote the script for the whole country, Manchester now means to answer back. The declaration is a statement of civic patriotism: Britain belongs to all its places, and the future will be built by regions confident enough to stop mistaking distance from Westminster for irrelevance."
 ENG_The_Bee_Network_National_Integration:0 "The Bee Network National Integration"
 ENG_The_Bee_Network_National_Integration_desc:0 "Once the model exists, the next step is to stitch it together. Buses, trams, rail, ticketing, and local planning need to speak the same language across the country so that public transport becomes a visible sign of national competence rather than a set of disconnected local miracles."
 ENG_The_Federal_Union_Of_Britain:0 "The Federal Union of Britain"
 ENG_The_Federal_Union_Of_Britain_desc:0 "Burnham's answer to a brittle union is not forced sentiment but a better constitution. A federal Britain would recognise that England, Scotland, Wales, Northern Ireland, and the great English regions cannot all be governed well through the same central bottleneck and then asked to clap on cue."
 ENG_The_Commonwealth_Of_Regions:0 "The Commonwealth of Regions"
 ENG_The_Commonwealth_Of_Regions_desc:0 "This is the alliance's most ambitious domestic idea: a Britain held together less by command and more by mutual respect, shared standards, and confident local power. The Commonwealth of Regions is meant to feel like a country mending itself from the inside out."
 ENG_The_Regional_Investment_Banks:0 "The Regional Investment Banks"
 ENG_The_Regional_Investment_Banks_desc:0 "Too much British capital still flows as if the country only has one real centre of gravity. Regional banks would let places back themselves, financing housing, infrastructure, industry, and renewal with institutions that actually know the ground they stand on."
 ENG_Professionalised_Public_Services:0 "Professionalised Public Services"
 ENG_Professionalised_Public_Services_desc:0 "Burnham has little patience for the contractor state and even less for the idea that good public service is somehow old-fashioned. This focus is about rebuilding pride, standards, and skill across the state so that public services feel capable, trusted, and worth joining again."
 ENG_The_Global_Britain_2.0:0 "Global Britain 2.0"
 ENG_The_Global_Britain_2.0_desc:0 "The old Global Britain slogan sounded too often like a press release looking for a country. Burnham's version is smaller in ego and bigger in substance: a Britain known for decent cities, clean industry, democratic alliances, cultural confidence, and the quiet authority that comes from getting your own house in order."
 ENG_Britpop_2.0:0 "Britpop 2.0"
 ENG_Britpop_2.0_desc:0 "Politics cannot live on spreadsheets alone. Burnham wants a Britain that feels culturally switched on again, where music, fashion, nightlife, design, and local identity are not ornamental extras but part of how the country recovers its confidence and starts enjoying itself."
 ENG_The_Hacienda_Spirit:0 "The Hacienda Spirit"
 ENG_The_Hacienda_Spirit_desc:0 "A city that stops making space for noise, risk, and youth eventually starts talking like a museum. The Hacienda spirit is about backing venues, scenes, and local culture so that Britain's revival sounds like something people might actually dance to."
 ENG_The_New_Wave_Of_British_Art:0 "The New Wave of British Art"
 ENG_The_New_Wave_Of_British_Art_desc:0 "The next national mood will not be built by economists alone. Galleries, studios, street culture, public art, and creative education all have a role in telling the country that imagination still belongs here and does not need permission from London to matter."
 ENG_Reclaim_The_Union_Jack:0 "Reclaim the Union Jack"
 ENG_Reclaim_The_Union_Jack_desc:0 "Burnham refuses to leave patriotism to the bitter, the nostalgic, and the permanently angry. The flag should stand for solidarity, place, public service, and belonging, not just for grievance politics wrapped in cheap theatre."
 ENG_The_Social_Guarantee:0 "The Social Guarantee"
 ENG_The_Social_Guarantee_desc:0 "A decent society ought to guarantee the basics. Secure housing, fair pay, functioning services, and some confidence that a bad month will not become a ruined life. Burnham wants government to say that plainly and then back it with institutions strong enough to mean it."
 ENG_Housing_is_A_Human_Right:0 "Housing Is a Human Right"
 ENG_Housing_is_A_Human_Right_desc:0 "Britain cannot call itself civilised while millions live under the permanent threat of rent shocks, mould, waiting lists, and insecure tenancies. Housing has to stop being treated as an asset class first and a basic condition of dignity second."
 ENG_The_MBacc:0 "The MBacc"
 ENG_The_MBacc_desc:0 "For too long, Britain has told every young person the same story: university or bust. The MBacc is Burnham's answer to that dead-end snobbery, giving technical, vocational, and practical education the same national dignity as the academic route."
 ENG_The_Live_Well_Service:0 "The Live Well Service"
 ENG_The_Live_Well_Service_desc:0 "Health is not only what happens in hospital corridors. The Live Well Service treats wellbeing as something shaped by housing, work, community, prevention, and local support, pulling public policy closer to the way people actually live."
 ENG_The_Real_Living_Wage:0 "The Real Living Wage"
 ENG_The_Real_Living_Wage_desc:0 "Burnham has never had much time for the idea that a full week's work should still leave people skint. The real living wage is about restoring an old truth in modern form: if you do your bit, you ought to be able to live with some security and some pride."
 ENG_The_Hillsbourough_Law:0 "The Hillsborough Law"
 ENG_The_Hillsbourough_Law_desc:0 "No more cover-ups, no more closed ranks, and no more grieving families forced to fight the state for the truth. This law is about candour, accountability, and a simple promise that public institutions will no longer be allowed to hide behind themselves when they fail the people they serve."
 ENG_LIB_Rebuilding_the_Bridge:0 "Rebuilding the Bridge"
 ENG_LIB_Rebuilding_the_Bridge_desc:0 "Brexit was a botched job. The Liberal case is not that Britain can wish the last decade away, but that it must stop confusing self-harm with sovereignty. Rebuilding the bridge means restoring practical ties with Europe in a way that feels calm, competent, and unapologetically useful."
 ENG_LIB_A_Truly_Fair_Democracy:0 "A Truly Fair Democracy"
 ENG_LIB_A_Truly_Fair_Democracy_desc:0 "Britain still runs too much of its public life on convention, nods, and closed-shop habits. The Liberal Democrats want to modernise the state properly: cleaner rules, fairer representation, stronger rights, and institutions that do not depend on gentlemen behaving like gentlemen."
 ENG_LIB_The_UK_EU_Security_Pact:0 "The UK-EU Security Pact"
 ENG_LIB_The_UK_EU_Security_Pact_desc:0 "Beyond trade, Britain needs a serious security settlement with Europe. Associate links to the European Defence Agency, deeper defence-industrial coordination, and structured cooperation with our neighbours would make the country safer without the old chest-beating about splendid isolation."
 ENG_LIB_The_Youth_Mobility_Scheme:0 "The Youth Mobility Scheme"
 ENG_LIB_The_Youth_Mobility_Scheme_desc:0 "An entire generation was cut off from easy exchange with the continent by a politics it did not choose. This scheme, alongside renewed educational cooperation, is about letting young Britons live, learn, and work across Europe again without treating openness as a threat."
 ENG_LIB_The_SPS_Alignment:0 "The SPS Alignment"
 ENG_LIB_The_SPS_Alignment_desc:0 "The practical mess at the border is not abstract ideology. It is paperwork, delay, waste, and higher prices. Alignment on sanitary and phytosanitary standards would clear most of the friction at a stroke, easing food imports, helping exporters, and lowering one of the dumbest costs of divergence."
 ENG_LIB_Join_the_Single_Market:0 "Join the Single Market"
 ENG_LIB_Join_the_Single_Market_desc:0 "The Liberal argument is straightforward: Britain cannot keep kneecapping its own economy out of pride. Returning to the Single Market would restore common standards, shrink border friction, and help the country rediscover the quiet prosperity that comes from making trade easier instead of harder."
 ENG_LIB_The_STV_Mandate:0 "The STV Mandate"
 ENG_LIB_The_STV_Mandate_desc:0 "First-past-the-post has produced too many fake landslides, safe-seat fiefdoms, and governments with total power on a minority vote. The Single Transferable Vote would force politics to listen more carefully, negotiate more honestly, and stop treating millions of ballots as decorative scenery."
 ENG_LIB_The_Proper_Windfall_Tax:0 "The Proper Windfall Tax"
 ENG_LIB_The_Proper_Windfall_Tax_desc:0 "When households are being squeezed and energy giants are booking super-profits, the state has every right to close loopholes and tax the unearned upside. A proper windfall tax is not class war; it is basic seriousness about who should help pay for the transition."
 ENG_LIB_The_7_Day_GP_Guarantee:0 "The 7-Day GP Guarantee"
 ENG_LIB_The_7_Day_GP_Guarantee_desc:0 "People should not have to wage administrative trench warfare to see a doctor. This guarantee would expand GP numbers, widen prescribing powers, and restore a simple principle to primary care: if you need help, the system should behave as though that matters."
 ENG_LIB_Votes_at_16_and_17:0 "Votes at 16 and 17"
 ENG_LIB_Votes_at_16_and_17_desc:0 "If the state can ask young people to work, pay tax, and shoulder civic duties, it can trust them with the ballot. Extending the franchise to 16 and 17-year-olds, while scrapping needless voter barriers, would make democracy broader, healthier, and harder to game."
 ENG_LIB_The_Hong_Kong_BNO_Expansion:0 "The Hong Kong BNO Expansion"
 ENG_LIB_The_Hong_Kong_BNO_Expansion_desc:0 "Britain made obligations to Hong Kong and should stop pretending they are optional when politically inconvenient. Expanding the BNO route to adult children locked out by arbitrary cut-offs is the liberal position in its clearest form: keep faith, honour promises, and give refuge where refuge is due."
 ENG_LIB_The_0_7_Statutory_Return:0 "The 0.7% Statutory Return"
 ENG_LIB_The_0_7_Statutory_Return_desc:0 "The cut to aid spending was sold as realism but felt, to much of the world, like retreat dressed up as prudence. Restoring the 0.7% commitment and rebuilding an independent development apparatus would signal that Britain intends to be outward-looking, capable, and decent again."
 ENG_LIB_The_Ministerial_Code_in_Law:0 "The Ministerial Code in Law"
 ENG_LIB_The_Ministerial_Code_in_Law_desc:0 "A political class that writes its own standards and then marks its own homework should not be surprised when trust collapses. Putting the ministerial code on a legal footing would give ethics rules teeth and strip away one of Westminster's most complacent old indulgences."
 ENG_LIB_The_Royal_College_of_Care_Workers:0 "The Royal College of Care Workers"
 ENG_LIB_The_Royal_College_of_Care_Workers_desc:0 "Social care has long been treated as the leftover sector of the welfare state: essential, underpaid, and structurally ignored. A professional body, better pay, and a clearer career ladder would start recognising care workers as skilled people holding up one of the country's most important services."
 ENG_LIB_The_Magnitsky_Extension:0 "The Magnitsky Extension"
 ENG_LIB_The_Magnitsky_Extension_desc:0 "Liberal foreign policy should not mean softness toward repression. Expanded Magnitsky sanctions, tougher asset freezes, and a ban on goods linked to forced labour would let Britain use its financial system against corruption and abuse rather than quietly profiting from both."
 ENG_LIB_The_Digital_Bill_of_Rights:0 "The Digital Bill of Rights"
 ENG_LIB_The_Digital_Bill_of_Rights_desc:0 "The state and the market both now possess tools of surveillance and automated control that old civil-liberties law was never designed to handle. A Digital Bill of Rights would protect privacy, curb intrusive facial recognition, and insist that public algorithms remain answerable to human judgement."
 ENG_LIB_The_Graduate_Relief_Act:0 "The Graduate Relief Act"
 ENG_LIB_The_Graduate_Relief_Act_desc:0 "The student loan system has become a debt conveyor belt dressed up as social mobility. Relief for graduates, especially those who commit to essential public service, would make higher education feel less like a lifetime surcharge and more like a national investment worth making."
 ENG_LIB_The_LGBTQ_Action_Plan:0 "The LGBTQ+ Action Plan"
 ENG_LIB_The_LGBTQ_Action_Plan_desc:0 "Equality policy cannot be left as a box-ticking exercise scattered across departments. This action plan is about coordinated legal protection, harder enforcement against hate crime, and a state that treats LGBTQ+ dignity as a routine obligation rather than a culture-war bargaining chip."
 ENG_LIB_Restore_Maintenance_Grants:0 "Restore Maintenance Grants"
 ENG_LIB_Restore_Maintenance_Grants_desc:0 "A country that talks endlessly about opportunity should not make living costs the gatekeeper to education. Restoring maintenance grants would reopen university to people shut out not by ability, but by the sheer price of trying to get through the week."
 ENG_LIB_X_Gender_Passports:0 "X-Gender Passports"
 ENG_LIB_X_Gender_Passports_desc:0 "This is a small administrative change with an outsized human meaning. Introducing X-gender passport markers would give non-binary and gender-diverse citizens recognition in law and daily life without requiring them to justify their existence to an exhausted bureaucracy."
 ENG_LIB_The_Renters_Bill_of_Rights:0 "The Renter's Bill of Rights"
 ENG_LIB_The_Renters_Bill_of_Rights_desc:0 "Too many renters live one bad landlord, one retaliatory notice, or one absurd rent jump away from instability. A real bill of rights for renters would mean secure tenancies, enforceable standards, and the basic expectation that having a roof over your head should not depend on whim."
 ENG_LIB_150_000_Social_Homes_A_Year:0 "150,000 Social Homes a Year"
 ENG_LIB_150_000_Social_Homes_A_Year_desc:0 "Britain's housing crisis will not be solved by nudges and brochures. A state-backed programme to build 150,000 social and council homes a year would finally treat housing as infrastructure, giving local authorities the tools to build at scale and ordinary people a serious alternative to permanent scarcity."
ENG_LIB_A_Federal_Britain:0 "A Federal Britain"
ENG_LIB_A_Federal_Britain_desc:0 "The union cannot keep functioning as a centralised state that improvises devolution whenever the pressure becomes embarrassing. A federal settlement would put powers, finance, and constitutional guarantees on a more durable footing, turning Britain's patchwork territorial politics into a coherent liberal order."
ENG_LIB_Community_Policing_Covenant:0 "The Community Policing Covenant"
ENG_LIB_Community_Policing_Covenant_desc:0 "Public safety should not mean distant command, performative crackdowns, and collapsing trust. This covenant would rebuild neighbourhood policing, raise local accountability, and restore the idea that security works best when the public sees the law as present, competent, and answerable."
ENG_LIB_Rejoin_Erasmus_Plus:0 "Rejoin Erasmus+"
ENG_LIB_Rejoin_Erasmus_Plus_desc:0 "Reopening youth mobility is only the beginning. Rejoining Erasmus+ would restore research links, student exchanges, and the ordinary continental opportunities that an entire generation lost to a politics of needless closure."
ENG_LIB_The_European_Climate_Bank:0 "The European Climate Bank"
ENG_LIB_The_European_Climate_Bank_desc:0 "Liberal climate policy works best when it is tied to investment and scale rather than pious targets alone. Closer participation in European green-finance architecture would let Britain fund decarbonisation, industry, and infrastructure through institutions built for long-term transition rather than Treasury drift."
ENG_LIB_The_Citizens_Convention:0 "The Citizens' Convention"
ENG_LIB_The_Citizens_Convention_desc:0 "Constitutional reform should not be written only by ministers, party managers, and lawyers in Westminster offices. A national convention would bring local government, civic groups, unions, and citizens directly into the argument about how Britain should actually be governed."
ENG_LIB_The_Associate_Customs_Area:0 "The Associate Customs Area"
ENG_LIB_The_Associate_Customs_Area_desc:0 "Single Market alignment solved some of the damage. A deeper customs settlement would go further, easing the trade bureaucracy, stabilising cross-border supply chains, and making Britain feel embedded in a serious European economic framework again."
ENG_LIB_The_Open_Society_Act:0 "The Open Society Act"
ENG_LIB_The_Open_Society_Act_desc:0 "This final act binds the Liberal project together: a more federal union, firmer rights, social reform with legal teeth, and a Britain that is open to Europe without embarrassment. It is less a single law than a new governing doctrine for a liberal recovery."
ENG_LIB_The_Social_Market_Constitution:0 "The Social Market Constitution"
ENG_LIB_The_Social_Market_Constitution_desc:0 "If liberal recovery is to last, it needs firmer rules about how markets serve society instead of simply extracting from it. This settlement would harden consumer protection, public obligations, and long-term institutional rules into a more durable constitutional order."
ENG_LIB_Municipal_Housing_Corporations:0 "Municipal Housing Corporations"
ENG_LIB_Municipal_Housing_Corporations_desc:0 "The housing programme cannot depend on sporadic grants and over-centralised approval chains. New municipal corporations would give cities and counties permanent vehicles to assemble land, finance construction, and build homes at industrial scale."
ENG_LIB_A_Clean_Growth_Grid:0 "A Clean Growth Grid"
ENG_LIB_A_Clean_Growth_Grid_desc:0 "A greener economy needs hard infrastructure, not just ministerial rhetoric. Grid upgrades, storage, interconnection, and smarter distribution would give Britain the capacity to electrify transport, industry, and homes without choking on its own bottlenecks."
ENG_LIB_The_Local_Revenue_Settlement:0 "The Local Revenue Settlement"
ENG_LIB_The_Local_Revenue_Settlement_desc:0 "Devolution without real fiscal power is just delegated blame. A local revenue settlement would give councils and regional authorities stable tax tools, clearer borrowing powers, and the ability to plan beyond the next central government whim."
ENG_LIB_The_Civic_Service_Guarantee:0 "The Civic Service Guarantee"
ENG_LIB_The_Civic_Service_Guarantee_desc:0 "A stronger liberal state needs competent public institutions people can actually feel in daily life. This guarantee would expand frontline capacity, improve recruitment into key services, and make state competence into something visible rather than merely promised."
ENG_LIB_A_British_Investment_Partnership:0 "A British Investment Partnership"
ENG_LIB_A_British_Investment_Partnership_desc:0 "Britain has lacked a serious bridge between public strategy and long-term capital. This partnership would align government, municipalities, and patient finance behind industrial modernisation, housing, and strategic infrastructure instead of leaving each to stall on its own."
ENG_LIB_The_New_Liberal_Consensus:0 "The New Liberal Consensus"
ENG_LIB_The_New_Liberal_Consensus_desc:0 "By this stage the Liberal project is no longer just a reform programme. It has become a full governing order: federal, socially liberal, economically interventionist where necessary, and outward-looking enough to replace the exhausted politics that came before it."
 ENG_liberal_reconnection_agenda:0 "Liberal Reconnection Agenda"
 ENG_liberal_reconnection_agenda_desc:0 "Cooper's alliance is defined by practical reconnection: closer European ties, cleaner constitutional rules, and a liberal state that prefers competence to theatrical decline."
 ENG_open_britain_settlement:0 "Open Britain Settlement"
 ENG_open_britain_settlement_desc:0 "This final settlement ties rights, housebuilding, institutional reform, and openness together into a distinctly liberal vision of national recovery."
 ENG_single_market_reentry_idea:0 "Single Market Re-Entry"
 ENG_single_market_reentry_idea_desc:0 "The liberal project has turned reconnection into material state capacity, easing economic friction and giving Britain a more stable footing in Europe-facing sectors."
 ENG_civic_liberalism_idea:0 "Civic Liberalism"
 ENG_civic_liberalism_idea_desc:0 "Constitutional reform, standards in public life, and fairer representation are beginning to harden into a more resilient liberal-democratic settlement."
 ENG_digital_rights_charter_idea:0 "Digital Rights Charter"
 ENG_digital_rights_charter_idea_desc:0 "Britain is treating privacy, due process, and technological oversight as core rights rather than optional add-ons to an overmighty digital state."
ENG_green_growth_compact_idea:0 "Green Growth Compact"
ENG_green_growth_compact_idea_desc:0 "The Liberal route has tied climate transition to investment discipline, innovation, and productive capacity rather than drift and gesture politics."
ENG_federal_liberal_settlement_idea:0 "Federal Liberal Settlement"
ENG_federal_liberal_settlement_idea_desc:0 "Liberal constitutional reform is hardening into a more stable union, balancing devolution, accountability, and civic legitimacy."
ENG_associate_european_order_idea:0 "Associate European Order"
ENG_associate_european_order_idea_desc:0 "Britain has rebuilt a denser economic relationship with Europe, easing friction and reinforcing a more stable external orientation."
ENG_open_society_act_idea:0 "Open Society Act"
ENG_open_society_act_idea_desc:0 "The Liberal state now presents itself as outward-looking, rules-based, socially reformist, and institutionally more resilient than the order it replaced."
ENG_progressive_pact_idea:0 "Progressive Pact"
ENG_progressive_pact_idea_desc:0 "The Burnham-led alliance has cohered into a recognisable governing project, giving the government more ideological confidence and political staying power."
ENG_northern_transit_revival_idea:0 "Northern Transit Revival"
ENG_northern_transit_revival_idea_desc:0 "Integrated transport planning and infrastructure investment are starting to reconnect the neglected city-regions of Britain into a more coherent economic space."
ENG_digital_commons_idea:0 "Digital Commons"
ENG_digital_commons_idea_desc:0 "Britain's digital infrastructure is being treated as a public good, strengthening research capacity, civic technology, and state competence in the information economy."
ENG_commonwealth_of_regions_idea:0 "Commonwealth of Regions"
ENG_commonwealth_of_regions_idea_desc:0 "The union is gradually being rebalanced around stronger regional institutions and more reciprocal constitutional relationships."
ENG_britpop_revival_idea:0 "Britpop Revival"
ENG_britpop_revival_idea_desc:0 "A renewed cultural confidence is giving Burnham's Britain a broader emotional appeal, making the national project feel lively instead of merely competent."
ENG_social_guarantee_idea:0 "Social Guarantee"
ENG_social_guarantee_idea_desc:0 "The state has committed itself to a firmer baseline of material security, making democratic citizenship feel more tangible in everyday life."
ENG_live_well_state_idea:0 "Live Well State"
ENG_live_well_state_idea_desc:0 "Public services are being reorganised around prevention, dignity, and coordinated care, improving resilience without waiting for crisis to do all the talking."
 ENG_GRN_The_Eco_Populist_Mandate:0 "The Eco-Populist Mandate"
 ENG_GRN_The_Eco_Populist_Mandate_desc:0 "Polanski's case is that the climate crisis and the inequality crisis are not two emergencies competing for oxygen; they are the same broken settlement seen from different angles. The job is not to manage decline with greener slogans, but to rebuild the country around people, place, and the living world."
 ENG_GRN_The_Charter_of_Workers_Rights:0 "The Charter of Workers' Rights"
 ENG_GRN_The_Charter_of_Workers_Rights_desc:0 "Fairness is not a lifestyle preference. If a business model depends on low pay, insecurity, and casual contempt for the people who do the work, then the model is the problem. The charter sets out a greener economy that also treats labour with dignity."
 ENG_GRN_The_People_Over_the_1_Percent:0 "The People Over the 1%"
 ENG_GRN_The_People_Over_the_1_Percent_desc:0 "The Greens are done pretending that all wealth is equally earned and all sacrifice equally shared. If the future is going to be built, the money has to be prised out of dead assets, speculative excess, and a political economy that mistakes hoarding for success."
 ENG_GRN_The_Nature_Recovery_Act:0 "The Nature Recovery Act"
 ENG_GRN_The_Nature_Recovery_Act_desc:0 "You cannot eat GDP and you cannot breathe a balance sheet. The Nature Recovery Act puts the basic green principle into law: the living systems that sustain the country are not an optional extra to be restored if there is cash left over."
 ENG_GRN_The_Fair_Politics_Act:0 "The Fair Politics Act"
 ENG_GRN_The_Fair_Politics_Act_desc:0 "No more voter suppression by paperwork, no more stale rules that serve exhausted party machines, and no more treating democracy as something the public is allowed to visit but never truly own."
 ENG_GRN_Abolish_the_House_of_Lords:0 "Abolish the House of Lords"
 ENG_GRN_Abolish_the_House_of_Lords_desc:0 "If you have not been elected, you should not be making laws. The Greens want to end one of Westminster's most blatant democratic absurdities and make the constitution answerable to the public again."
 ENG_GRN_Votes_at_16_and_17:0 "Votes at 16 & 17"
 ENG_GRN_Votes_at_16_and_17_desc:0 "If you are old enough to work, pay tax, and live with the consequences of national failure, you are old enough to vote. The franchise should catch up with reality."
 ENG_GRN_The_Peoples_Mobility:0 "The People's Mobility"
 ENG_GRN_The_Peoples_Mobility_desc:0 "The right to move should not depend on your car, your postcode, or what private operators think they can skim off the route. A fit-for-the-future transport system is a public service, not a commuter tax."
 ENG_GRN_The_Written_Constitution:0 "The Written Constitution"
 ENG_GRN_The_Written_Constitution_desc:0 "Britain's constitutional habits were built on gentlemen's agreements and selective memory. The Greens want rights, duties, and democratic rules written down clearly enough that nobody powerful gets to improvise them in their own favour."
 ENG_GRN_Clean_Water_Public_Hands:0 "Clean Water, Public Hands"
 ENG_GRN_Clean_Water_Public_Hands_desc:0 "Britain's rivers are not privatised drains and its coasts are not sacrifice zones. Water will be treated as a public good again, with the polluters stripped of the assumption that they can bill people while poisoning the commons."
 ENG_GRN_The_Right_to_Roam_Act:0 "The Right to Roam Act"
 ENG_GRN_The_Right_to_Roam_Act_desc:0 "A tiny slice of England is freely accessible to the public, which tells you a lot about who the landscape has historically been for. The right to roam widens the moral geography of the country and says that land should be lived in, not just enclosed."
 ENG_GRN_The_5bn_Local_Empowerment_Fund:0 "The £5bn Local Empowerment Fund"
 ENG_GRN_The_5bn_Local_Empowerment_Fund_desc:0 "Culture, youth services, green renewal, and democratic participation all happen locally or not at all. The fund gives towns, councils, and communities the means to shape their own civic future instead of pleading upward for crumbs."
 ENG_GRN_The_Right_of_Recall_2_0:0 "The Right of Recall 2.0"
 ENG_GRN_The_Right_of_Recall_2_0_desc:0 "If voters lose trust in a representative, the system should not lock them into helplessness until the calendar says otherwise. Recall is how politics remembers that seats belong to the public first and the politician second."
 ENG_GRN_Debt_Forgiveness_and_Grants:0 "Debt Forgiveness & Grants"
 ENG_GRN_Debt_Forgiveness_and_Grants_desc:0 "Young people were sold social mobility and handed compound anxiety instead. The Greens want to write down the debt burden, restore grants, and stop treating a generation's ambition as a revenue stream."
 ENG_GRN_Abolish_Tuition_Fees:0 "Abolish Tuition Fees"
 ENG_GRN_Abolish_Tuition_Fees_desc:0 "Learning should not begin with an invoice. The Greens reject the marketisation of higher education and the fiction that pricing knowledge like a luxury good somehow expands freedom."
 ENG_GRN_Nationalise_the_Big_Five:0 "Nationalise the Big Five"
 ENG_GRN_Nationalise_the_Big_Five_desc:0 "The energy giants have had their turn. If the climate transition is going to be fast, fair, and democratic, the commanding heights of energy need to serve the public rather than trade in scarcity and dividends."
 ENG_GRN_30_by_30:0 "30 by 30"
 ENG_GRN_30_by_30_desc:0 "By 2030, thirty percent of land and sea will be protected and actively restored. This is not about turning nature into a museum exhibit; it is about giving ecosystems enough space to live, recover, and make the country livable in return."
 ENG_GRN_The_Fairer_Greener_Homes_Guarantee:0 "The Fairer, Greener Homes Guarantee"
 ENG_GRN_The_Fairer_Greener_Homes_Guarantee_desc:0 "Warm homes, lower bills, cleaner air, and better insulation are not separate policies. They are the same promise delivered properly, with decency and decarbonisation finally made to work together."
 ENG_GRN_Responsible_Access_to_All_Land:0 "Responsible Access to All Land"
 ENG_GRN_Responsible_Access_to_All_Land_desc:0 "The Greens want England to catch up with the better instincts already visible elsewhere in these islands and across northern Europe: a universal right of responsible access that treats the landscape as part of the public life of the country."
 ENG_GRN_The_End_of_the_Hostile_Environment:0 "The End of the Hostile Environment"
 ENG_GRN_The_End_of_the_Hostile_Environment_desc:0 "The hostile environment turned migration into a permanent administrative cruelty. The Greens mean to scrap it, build a Home Office capable of welcome as well as control, and stop calling dehumanisation realism."
 ENG_GRN_The_Rent_Cap_and_Control:0 "The Rent Cap & Control"
 ENG_GRN_The_Rent_Cap_and_Control_desc:0 "Landlords should not be allowed to charge whatever the market panic of the month says they can get away with. Rent control is the state choosing people over extraction in one of the harshest parts of everyday life."
 ENG_GRN_Abolish_Landlordism:0 "Abolish Landlordism"
 ENG_GRN_Abolish_Landlordism_desc:0 "Housing should not be a machine for turning need into passive income. This focus is the branch at its most unapologetic: the property model itself must be broken open if the country is to become fairer."
 ENG_GRN_The_Carbon_Chancellor:0 "The Carbon Chancellor"
 ENG_GRN_The_Carbon_Chancellor_desc:0 "If treasury orthodoxy cannot tell the difference between growth that destroys the future and investment that secures it, then the treasury has to change. A Carbon Chancellor would force every major spending decision to answer to the reality of net zero."
 ENG_GRN_The_Brighton_Compromise:0 "The Brighton Compromise"
 ENG_GRN_The_Brighton_Compromise_desc:0 "By the time most of the Green programme is in law, the alliance's internal truce is hanging by a thread. Labour and the Lib Dems demand retreat, delay, and a language of reassurance. The Green leadership hears only a demand to hollow out everything it has just built."
 ENG_GRN_No_Compromise_No_Retreat:0 "No Compromise, No Retreat"
 ENG_GRN_No_Compromise_No_Retreat_desc:0 "Zack's response is simple enough to terrify the rest of government: if the old parties think the programme has gone too far, then they were never serious about transformation in the first place. The Greens prepare to go over their partners' heads and fight in the open."
 ENG_GRN_The_Minority_Crisis:0 "The Minority Crisis"
 ENG_GRN_The_Minority_Crisis_desc:0 "The alliance rupture leaves the Greens governing in name but no longer in comfort. Every vote becomes a test of nerve, every debate a rehearsal for collapse, and every concession a potential confession that the project has run out of road."
 ENG_GRN_Rule_by_Statutory_Instrument:0 "Rule by Statutory Instrument"
 ENG_GRN_Rule_by_Statutory_Instrument_desc:0 "With Parliament blocking the programme, ministers start leaning on secondary legislation, delegated powers, and every procedural shortcut they can legally stretch. It is grey, risky, and exactly the sort of method their critics feared all along."
 ENG_GRN_The_Peoples_Assembly:0 "The People's Assembly"
 ENG_GRN_The_Peoples_Assembly_desc:0 "If Westminster is going to behave like a brake on survival, then the Greens will start looking for legitimacy elsewhere. Citizens' assemblies, local forums, and movement structures are pulled into national politics as a rival source of democratic authority."
 ENG_GRN_The_Constituent_Mandate:0 "The Constituent Mandate"
 ENG_GRN_The_Constituent_Mandate_desc:0 "The rupture has already broken the old coalition logic. This focus turns that break into an explicit constitutional claim: the Greens now seek a direct mandate to refound the state rather than merely survive inside it."
 ENG_GRN_The_Solidarity_Levy:0 "The Solidarity Levy"
 ENG_GRN_The_Solidarity_Levy_desc:0 "This is the major concession that is not really a concession at all: the tax remains, but is repackaged in more presentable language so Labour and the Lib Dems can tell themselves they are still moderating events."
 ENG_GRN_The_Public_Private_Power_Pact:0 "The 'Public-Private' Power Pact"
 ENG_GRN_The_Public_Private_Power_Pact_desc:0 "The full nationalisation threat is softened into a hybrid settlement: a state-owned investment vehicle, a controlling public share, and just enough room for private capital to claim it still has a place in the transition."
 ENG_GRN_The_National_Insulation_Scheme:0 "The National Insulation Scheme"
 ENG_GRN_The_National_Insulation_Scheme_desc:0 "The old universal retrofit promise is narrowed into a more targeted but more defensible national effort, focused on the homes where cold, damp, and high bills are doing the most immediate damage."
 ENG_GRN_The_Urban_Green_Way_Act:0 "The Urban Green Way Act"
 ENG_GRN_The_Urban_Green_Way_Act_desc:0 "The Greens recast biodiversity as urban dignity: tree-lined streets, connected green corridors, shaded routes, and parks built into the daily life of towns and cities rather than reserved as planning afterthoughts."
 ENG_GRN_The_Localist_Devolution_Deal:0 "The Localist Devolution Deal"
 ENG_GRN_The_Localist_Devolution_Deal_desc:0 "Power is pushed downward again, but this time in a greener idiom: neighbourhood control, place-based planning, and local authorities with the tools to do more than manage decline from one budget crisis to the next."
 ENG_GRN_The_Green_Municipal_Code:0 "The Green Municipal Code"
 ENG_GRN_The_Green_Municipal_Code_desc:0 "The transition needs a common operating language for councils, mayors, and local agencies. This code would standardise how local green planning, procurement, housing retrofit, and public-space renewal are actually carried out."
 ENG_GRN_The_Transition_Counties:0 "The Transition Counties"
 ENG_GRN_The_Transition_Counties_desc:0 "The rural and county state cannot be left outside the Green settlement. Transition counties would tie local government, food systems, transport, and land policy into a greener territorial model beyond the big cities alone."
 ENG_GRN_The_Green_Republic:0 "The Green Republic"
 ENG_GRN_The_Green_Republic_desc:0 "If the government survives the crises that follow the rupture, the Greens begin to speak of a much larger constitutional break. The old UK, they argue, has proved structurally incapable of ecological survival. What must replace it is a decentralised, democratic, post-Westminster republic built for the century ahead."
 ENG_GRN_The_Climate_Constitution:0 "The Climate Constitution"
 ENG_GRN_The_Climate_Constitution_desc:0 "If ecological planning is to survive the next change of government, it cannot remain a ministerial preference. The climate constitution would write long-term environmental duties, carbon accountability, and public stewardship into the constitutional order itself."
 ENG_GRN_The_Community_Energy_Commonwealth:0 "The Community Energy Commonwealth"
 ENG_GRN_The_Community_Energy_Commonwealth_desc:0 "The Green Republic should not rely on a handful of national utilities and private contractors to deliver the transition alone. Community-owned generation, municipal grids, and local storage would give the energy system democratic roots as well as technical resilience."
 ENG_GRN_The_Public_Food_System:0 "The Public Food System"
 ENG_GRN_The_Public_Food_System_desc:0 "Food policy has been left too long to speculation, precarious supply chains, and the fiction that cheapness without resilience is efficiency. A public food system would link farming, procurement, nutrition, land use, and security into one national framework."
 ENG_GRN_The_Local_Climate_Assembly:0 "The Local Climate Assembly"
 ENG_GRN_The_Local_Climate_Assembly_desc:0 "National targets matter, but democratic legitimacy is built in places people actually live. Local climate assemblies would pull councils, unions, residents, and civic bodies directly into the planning of decarbonisation, adaptation, and local public investment."
 ENG_GRN_The_Ecological_Citizens_Guarantee:0 "The Ecological Citizens' Guarantee"
 ENG_GRN_The_Ecological_Citizens_Guarantee_desc:0 "The Green state should guarantee more than survival. Warm homes, clean transport, secure food access, cheaper energy, and protection from environmental breakdown would be treated as ordinary civic entitlements rather than optional policy wins."
 ENG_GRN_The_Democratic_Ecology_State:0 "The Democratic Ecology State"
 ENG_GRN_The_Democratic_Ecology_State_desc:0 "By this stage the Green project is no longer a protest against the old order. It is a new governing doctrine: ecological, democratic, locally rooted, and committed to making social security and environmental repair parts of the same state mission."
 ENG_eco_populist_mandate_idea:0 "Eco-Populist Mandate"
 ENG_eco_populist_mandate_idea_desc:0 "The Green-led alliance defines the national crisis as ecological, social, and democratic all at once, fusing climate action with redistribution and institutional change."
 ENG_green_commonwealth_settlement_idea:0 "Green Commonwealth Settlement"
 ENG_green_commonwealth_settlement_idea_desc:0 "This settlement ties public investment, ecological repair, social rights, and democratic renewal together into a more openly transformative green state."
 ENG_green_budget_blackout_idea:0 "Budget Blackout"
 ENG_green_budget_blackout_idea_desc:0 "The Green government is holding the programme together through emergency fiscal improvisation, paying for survival with uncertainty, delay, and political strain."
 ENG_green_coup_whispers_idea:0 "Coup Whispers"
 ENG_green_coup_whispers_idea_desc:0 "Cuts and emergency decrees have rattled parts of the British state that still believe hard power belongs to them first and elected radicals only on sufferance."
 ENG_green_reform_insurrection_idea:0 "Reform Street Offensive"
 ENG_green_reform_insurrection_idea_desc:0 "Reform UK is converting parliamentary fury into organised street pressure, trying to make every Green compromise feel like proof that the government has lost control."
 ENG_nature_recovery_state_idea:0 "Nature Recovery State"
 ENG_nature_recovery_state_idea_desc:0 "Environmental repair is no longer a side programme. The Green state is beginning to treat ecological restoration as part of ordinary national administration."
 ENG_green_mobility_transition_idea:0 "Green Mobility Transition"
 ENG_green_mobility_transition_idea_desc:0 "Transport planning is being redirected toward integrated public mobility, greener logistics, and infrastructure built around access rather than traffic alone."
 ENG_localist_green_transition_idea:0 "Localist Green Transition"
 ENG_localist_green_transition_idea_desc:0 "The Green branch is pushing power, capital, and planning downward, trying to make ecological transition something communities can actually govern."
 ENG_green_industrial_trust_bonus:0 "Green Industrial Trust Research Bonus"
 ENG_green_growth_compact_bonus:0 "Green Growth Compact Research Bonus"
 ENG_green_commonwealth_grid_bonus:0 "Community Energy Commonwealth Research Bonus"
 ENG_green_republic_popularity_tt:0 "Progressive popularity is at least §Y50%§!."
 ENG_green_crisis_decisions:0 "Green Government Crises"
 ENG_green_crisis_decisions_desc:0 "The alliance rupture has pushed the Green government into a cycle of confidence votes, fiscal improvisation, and counter-mobilisation. Surviving it will require ugly choices."
 ENG_green_budget_blackout_mission:0 "Budget Blackout Deadline"
 ENG_green_budget_blackout_mission_desc:0 "Treasury improvisation can only carry the government so far. Resolve the blackout before the emergency itself becomes the story."
 ENG_green_defund_the_military_to_fund_the_nhs:0 "Defund the Military to Fund the NHS"
 ENG_green_defund_the_military_to_fund_the_nhs_desc:0 "Slash defence lines the Greens can politically afford to cut and move the money toward the public services most likely to keep the coalition's remaining social base onside."
 ENG_green_seize_frozen_assets_to_pay_teachers:0 "Seize Frozen Assets to Pay Teachers"
 ENG_green_seize_frozen_assets_to_pay_teachers_desc:0 "Use emergency powers to unlock frozen wealth and redirect it into schools, pay packets, and basic state credibility. It solves the immediate crisis while daring the right to call the bluff."
 ENG_green_hold_the_line_budget:0 "Hold the Line Budget"
 ENG_green_hold_the_line_budget_desc:0 "Delay, ration, and scrape through. It is the least dramatic option and probably the least politically rewarding, but it avoids lighting quite so many fires at once."
