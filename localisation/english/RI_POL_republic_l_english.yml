l_english:
 RI_POL_aleksander_wysocki_desc:0 "President Aleksander Wysocki leads Poland's elected government alongside Prime Minister Marta Zielińska and its democratic socialist majority."
 RI_POL_guardian_of_the_east:0 "Guardian of the East"
 RI_POL_guardian_of_the_east_desc:0 "Poland sees itself as a principal defender of Eastern Europe and maintains forces ready to protect the republic and its neighbours."
 RI_POL_industrial_revival:0 "The Polish Industrial Revival"
 RI_POL_industrial_revival_desc:0 "Domestic investment and close economic ties with Germany have strengthened Poland's industrial base."
 RI_POL_ally_not_satellite:0 "An Ally, Not a Satellite"
 RI_POL_ally_not_satellite_desc:0 "Poland values its strategic partnership with Germany while remaining determined to preserve its political independence."
 RI_POL_armoured_corps:0 "Modern Armoured Corps"
 RI_POL_armoured_corps_desc:0 "Modern equipment and coordinated training improve the Polish armoured forces."
 RI_POL_air_defence:0 "National Air Defence Network"
 RI_POL_air_defence_desc:0 "Integrated air-defence planning protects Polish cities and military infrastructure."
 RI_POL_baltic_defence:0 "Baltic Approaches"
 RI_POL_baltic_defence_desc:0 "Poland coordinates the defence of its Baltic approaches with its neighbours."
 RI_POL_warsaw_defence:0 "Defence of Warsaw"
 RI_POL_warsaw_defence_desc:0 "Prepared positions and a resilient command plan strengthen the capital's defences."
 RI_POL_full_mobilisation:0 "Polish Reserve Mobilisation"
 RI_POL_full_mobilisation_desc:0 "The republic has called up reserves to meet the immediate danger on its eastern flank."
 RI_POL_emergency_fortification:0 "Emergency Eastern Fortifications"
 RI_POL_emergency_fortification_desc:0 "Field works and defensive preparations buy time for the Polish armed forces."
 RI_POL_german_military_assistance:0 "German Military Assistance"
 RI_POL_german_military_assistance_desc:0 "German and Polish staffs are coordinating urgent military support while Poland retains its independent command."
 RI_POL_strategic_partnership:0 "Polish-German Strategic Partnership"
 RI_POL_independent_ally:0 "An Ally, Not a Satellite"
 RI_POL_independent_ally_desc:0 "The Polish government has reaffirmed that its alliance with Germany does not compromise national sovereignty."
 RI_POL_soviet_counteroffensive_alert:0 "The German Front Crumbles"
 RI_POL_soviet_counteroffensive_alert_desc:0 "Soviet forces are reversing their earlier defeats on the German front. Warsaw is preparing for the possibility that the war may reach Polish territory."
 RI_POL_defence_council:0 "Defence of the Republic"
 RI_POL_defence_council_desc:0 "The Sejm and government are considering emergency measures to protect Poland."
 RI_POL_warsaw_crisis:0 "Warsaw Must Not Fall"
 RI_POL_warsaw_crisis_desc:0 "The loss of the capital has placed the republic's survival in immediate danger."
 RI_POL_soviet_occupation:0 "Soviet Occupation"
 RI_POL_soviet_occupation_desc:0 "A government aligned with Moscow now rules Poland under Soviet authority."
 RI_POL_government_in_exile:0 "Polish Government in Exile"
 RI_POL_government_in_exile_desc:0 "The legitimate government continues to claim Polish sovereignty and seeks support from abroad."
 RI_POL_neutrality_agreement:0 "Polish Neutrality Agreement"
 RI_POL_neutrality_agreement_desc:0 "Poland has withdrawn from its military commitments to Germany in exchange for an end to hostilities with the Soviet Union."
 RI_POL_events.1.t:0 "An Ally, Not a Satellite"
 RI_POL_events.1.d:0 "President Wysocki reminds Chancellor Stefan Liebich that Poland entered the alliance as an independent republic, not as a subordinate German territory. The partnership remains important, but decisions in Warsaw will be made by Poland."
 RI_POL_events.1.a:0 "Our sovereignty is not negotiable."
 RI_POL_crisis.1.t:0 "The German Front Crumbles"
 RI_POL_crisis.1.d:0 "Reports from the German front indicate that Soviet forces have begun reversing their earlier defeats. Warsaw is increasingly concerned that the conflict could spread towards Polish territory. The government has convened an emergency session of the Sejm."
 RI_POL_crisis.1.a:0 "Prepare the Defence of the Republic."
 RI_POL_crisis.2.t:0 "The Defence of the Republic"
 RI_POL_crisis.2.d:0 "The government must choose how to answer the Soviet counteroffensive: mobilise reserves, strengthen eastern defences, or request urgent German military assistance."
 RI_POL_crisis.2.a:0 "Full mobilisation."
 RI_POL_crisis.2.b:0 "Build the Eastern Shield."
 RI_POL_crisis.2.c:0 "Request German reinforcements."
 RI_POL_crisis.3.t:0 "Warsaw Must Not Fall"
 RI_POL_crisis.3.d:0 "Soviet forces have reached Warsaw or the Polish government has been forced from the capital. The government must decide whether to continue resistance, prepare an exile administration, or seek urgent support from its allies."
 RI_POL_crisis.3.a:0 "Continue the resistance."
 RI_POL_crisis.3.b:0 "Prepare a government in exile."
 RI_POL_crisis.3.c:0 "Request international assistance."
 RI_POL_outcome.1.t:0 "The Fate of the Polish Republic"
 RI_POL_outcome.1.d:0 "With the Polish government defeated by the Soviet-led coalition, the future of the republic is uncertain. The government can accept Soviet occupation, continue the struggle from exile, or seek a neutrality agreement if Polish territory remains outside Soviet control."
 RI_POL_outcome.1.a:0 "Accept Soviet occupation."
 RI_POL_outcome.1.b:0 "The government will continue in exile."
 RI_POL_outcome.1.c:0 "Seek a neutrality agreement."
 RI_POL_BLITZKRIEG_DESC:0 "The Republic of Poland is a democratic socialist state and a close, independent partner of Germany. Its government faces an existential threat from Soviet expansion and must balance military cooperation with the defence of Polish sovereignty."
