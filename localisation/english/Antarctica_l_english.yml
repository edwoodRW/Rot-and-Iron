# Events - Claims
 antarctica.1.t:0 "Antarctic Claim"
 antarctica.1.d:0 "Our government has formally claimed Queen Maud Land, securing our whaling industries access to the region."
 antarctica.1.a:0 "Good."
 antarctica.5.t:0 "Antarctic Expedition Sets Out"
 antarctica.5.d:0 "The MS Schwabenland has set out on an expedition around the Princess Martha Coast in Antarctica. It is expected to return sometime in the spring."
 antarctica.5.a:0 "Stay warm."
 antarctica.6.t:0 "Antarctic Expedition Returns"
 antarctica.6.d:0 "After more than three months, the MS Schwabenland has returned from its expedition around the Princess Martha Coast in Antarctica."
 antarctica.6.a:0 "Welcome home."
 antarctica.4.t:0 "New Swabian Claim"
 antarctica.4.d:0 "Our government has formalized its claim on Princess Martha Coast, renaming it New Swabia."
 antarctica.4.a:0 "Good."
 antarctica.3.t:0 "Decree No. 1747"
 antarctica.3.d:0 "With other countries laying claim to Antarctica, our government has decided to push our claim to the Antarctic Peninsula."
 antarctica.3.a:0 "Good."
 antarctica.4.t:0 "Antarctic Claim"
 antarctica.4.d:0 "With other countries laying claim to Antarctica, our government has decided to push our claim to the Antarctic Peninsula."
 antarctica.4.a:0 "La Antártida es Argentina."

