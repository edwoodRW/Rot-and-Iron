l_english:

 USA_influence_mild_lobbying:0 "Mild Lobbying"
 USA_influence_mild_lobbying_desc:0 "The usual Washington traffic of defense-sector lobbyists and donor dinners, unremarkable by the standards of any American administration, socialist or otherwise. Nobody is losing sleep over it yet."

 USA_influence_entrenched_networks:0 "Entrenched Networks"
 USA_influence_entrenched_networks_desc:0 "What used to be routine influence-peddling has hardened into something more organized: standing coordination between defense contractors, sympathetic media outlets, and a growing bloc of officials who owe their careers to money that was never on any campaign finance disclosure. It is no longer background noise. It is infrastructure."

 USA_influence_shadow_government:0 "Shadow Government"
 USA_influence_shadow_government_desc:0 "There is, in any meaningful sense, a second government now, unelected, well-funded, and increasingly confident that it can act with impunity. Cabinet officials find their initiatives quietly stalled by career staff loyal to interests that were never on any ballot. Turner's intelligence briefings have started using a word nobody wanted to say out loud a year ago: infiltration."

 USA_political_decisions:0 "Political Stability"
 USA_political_decisions_desc:0 "Decisions governing the balance of power between Turner's government and the corporate and military interests working to undermine it."

 USA_investigate_military_contractors:0 "Investigate Military Contractors"
 USA_investigate_military_contractors_desc:0 "Task the Justice Department with a formal audit of defense procurement contracts, the kind of unglamorous paperwork investigation that occasionally uncovers exactly the sort of coordinated influence campaign nobody wanted found."

 USA_crackdown_on_corporate_pacs:0 "Crack Down on Corporate PACs"
 USA_crackdown_on_corporate_pacs_desc:0 "Move aggressively against the political action committees and dark-money networks bankrolling opposition to the administration. It will work. It will also confirm every accusation of authoritarian overreach the opposition has been making about Turner since her inauguration."

 USA_court_business_confidence:0 "Court Business Confidence"
 USA_court_business_confidence_desc:0 "Offer the business community a genuine olive branch: regulatory relief, quiet assurances, a seat at the table. It buys real stability in the short term. It also means the people you're courting walk away with more leverage than they had yesterday."

 USA_purge_sympathetic_officers:0 "Purge Sympathetic Officers Preemptively"
 USA_purge_sympathetic_officers_desc:0 "Move against officers and officials with suspected sympathies toward the growing shadow network, before they have the chance to organize into something more dangerous. Expensive, politically risky if the intelligence turns out to be wrong, but potentially the only way to defuse this before it becomes a crisis."

 USA_rally_the_unions:0 "Rally the Unions"
 USA_rally_the_unions_desc:0 "Turn to the labour movement that put Turner in office in the first place, mobilizing union halls as a direct counterweight to corporate influence in the political conversation. It is, in a sense, simply governing the way the DSA always promised it would."

 USA_grant_military_autonomy:0 "Grant Military Autonomy"
 USA_grant_military_autonomy_desc:0 "Loosen civilian oversight of military procurement and command decisions, a gesture of trust toward an institution that has felt increasingly sidelined under a DSA administration. The generals will genuinely appreciate the gesture. Whether that appreciation is ever repaid on Turner's terms is a different question entirely."

 USA_loosen_campaign_finance_rules:0 "Loosen Campaign Finance Rules"
 USA_loosen_campaign_finance_rules_desc:0 "Roll back a set of campaign finance restrictions that both parties have quietly complained about for years, on the theory that looser rules benefit whoever currently holds power roughly as much as whoever's trying to take it. Whether that theory survives contact with reality is, as always, an open question."
