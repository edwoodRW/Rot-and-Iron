l_english:
 RI_POL_republic_focus:0 "The Defence of the Republic"
 RI_POL_republic_focus_desc:0 "A democratic socialist Poland strengthens its institutions, modernises its armed forces, and works with Germany as an independent ally."
 RI_POL_defend_democracy:0 "Defend Polish Democracy"
 RI_POL_defend_democracy_desc:0 "The Republic's institutions and popular mandate are the foundation of national resilience."
 RI_POL_strengthen_the_sejm:0 "Strengthen the Sejm"
 RI_POL_strengthen_the_sejm_desc:0 "A capable parliament gives workers and citizens a voice in the republic's future."
 RI_POL_socialist_programme:0 "The Polish Socialist Programme"
 RI_POL_socialist_programme_desc:0 "Build a democratic socialism rooted in parliamentary legitimacy and Polish sovereignty."
 RI_POL_national_industrial_investment:0 "National Industrial Investment"
 RI_POL_national_industrial_investment_desc:0 "Invest in strategic industries while preserving a mixed economy."
 RI_POL_modern_european_republic:0 "A Modern European Republic"
 RI_POL_modern_european_republic_desc:0 "Poland will be a modern European democracy with strong public institutions."
 RI_POL_warsaw_berlin_treaty:0 "The Warsaw-Berlin Treaty"
 RI_POL_warsaw_berlin_treaty_desc:0 "Put the partnership between Poland and Germany on a clear diplomatic footing."
 RI_POL_joint_military_planning:0 "Joint Military Planning"
 RI_POL_joint_military_planning_desc:0 "Coordinate defence plans with Germany while retaining Polish command."
 RI_POL_german_industrial_investment:0 "German Industrial Investment"
 RI_POL_german_industrial_investment_desc:0 "Invite German investment into Polish industry on terms that serve the republic."
 RI_POL_shared_intelligence_network:0 "Shared Intelligence Network"
 RI_POL_shared_intelligence_network_desc:0 "Share intelligence on Soviet deployments with Germany and other partners."
 RI_POL_eastern_defence_agreement:0 "The Eastern Defence Agreement"
 RI_POL_eastern_defence_agreement_desc:0 "Formalise cooperation to deter Soviet expansion into Eastern Europe."
 RI_POL_modernise_the_army:0 "Modernise the Polish Army"
 RI_POL_modernise_the_army_desc:0 "Reform the armed forces for the demands of modern warfare."
 RI_POL_expand_armoured_corps:0 "Expand the Armoured Corps"
 RI_POL_expand_armoured_corps_desc:0 "Develop a mobile armoured force capable of defending Poland's long frontiers."
 RI_POL_modern_artillery:0 "Modern Artillery Systems"
 RI_POL_modern_artillery_desc:0 "Improve the fire support available to Polish formations."
 RI_POL_strengthen_the_air_force:0 "Strengthen the Polish Air Force"
 RI_POL_strengthen_the_air_force_desc:0 "Build a capable air force to protect Polish skies and support the army."
 RI_POL_national_air_defence:0 "National Air Defence Network"
 RI_POL_national_air_defence_desc:0 "Connect radar, air bases, and ground defences into a national system."
 RI_POL_eastern_shield:0 "The Eastern Shield"
 RI_POL_eastern_shield_desc:0 "Integrate the army, air force, and fortifications into a coherent defensive plan."
 RI_POL_the_soviet_threat:0 "The Soviet Threat"
 RI_POL_the_soviet_threat_desc:0 "Soviet expansionism is an existential danger to Polish independence."
 RI_POL_defend_the_eastern_frontier:0 "Defend the Eastern Frontier"
 RI_POL_defend_the_eastern_frontier_desc:0 "Prepare Polish forces to hold the republic's eastern border."
 RI_POL_secure_the_baltic_approaches:0 "Secure the Baltic Approaches"
 RI_POL_secure_the_baltic_approaches_desc:0 "Work with independent Baltic neighbours to protect regional access and security."
 RI_POL_defence_of_warsaw:0 "The Defence of Warsaw"
 RI_POL_defence_of_warsaw_desc:0 "Prepare the capital for the gravest contingency without abandoning the rest of the country."
 RI_POL_victory_in_the_east:0 "Victory in the East"
 RI_POL_victory_in_the_east_desc:0 "Poland will help end the Soviet threat and secure a lasting peace in Eastern Europe."
 RI_POL_confirm_independence:0 "An Ally, Not a Satellite"
 RI_POL_confirm_independence_desc:0 "Poland's partnership with Berlin is a choice between sovereign states, not a transfer of authority."
 RI_POL_strategic_independence:0 "Polish Strategic Independence"
 RI_POL_strategic_independence_desc:0 "Maintain national control over Poland's defence and long-term strategy."
 RI_POL_strengthen_national_industry:0 "Strengthen National Industry"
 RI_POL_strengthen_national_industry_desc:0 "Build domestic capacity so the republic can make its own choices."
 RI_POL_independent_foreign_policy:0 "Independent Foreign Policy"
 RI_POL_independent_foreign_policy_desc:0 "Consult allies, but make Polish diplomatic decisions in Warsaw."
 RI_POL_polands_place_in_europe:0 "Poland's Place in Europe"
 RI_POL_polands_place_in_europe_desc:0 "A democratic, capable Poland will help shape Europe's future as an equal partner."
