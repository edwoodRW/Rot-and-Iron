l_english:
 MOR_desc:0 "When the old order collapsed, Rabat slipped the French leash and never looked back. The throne now governs a conservative, pious kingdom that trusts neither Paris's red banners nor its promises.\nMorocco wants trade, not tutelage - and a long border with a socialist France it would rather not discuss."
 ALG_desc:0 "Algeria is not a colony to Paris - it is France, and the Commune has never forgiven anyone for suggesting otherwise. The same government that preaches liberation abroad garrisons Algiers and Oran at home.\nEvery contradiction of the Commune's anti-imperialism is written across these departments, and sooner or later someone will come to collect."
 MRT_desc:0 "The desert marches of Mauritania are held as a province of French West Africa, administered from Dakar and ignored everywhere else. Paris calls it solidarity; the nomads call it occupation."
 MLI_desc:0 "Mali is a landlocked afterthought of French West Africa, its river cities run by Commune prefects who speak of fraternity and collect the taxes. The Niger flows on, indifferent to which flag flies over Bamako."
 NGR_desc:0 "Niger remains part of French West Africa, valued by the Commune for its distance, its desert, and its silence. Whatever Paris says about liberation, it has not yet found the time for Niamey."
 SEN_desc:0 "Dakar is the administrative heart of French West Africa, and the Commune's regional capital for the whole bloc. The harbour is busy, the governors are loyal, and the Senegalese are expected to be grateful.\nIt is the model colony of an empire that insists it is not one."
 GNA_desc:0 "Guinea is held as another province of French West Africa, its bauxite and ports serving a government that denounces imperialism in every speech. The comrades in Paris see no irony in this. Conakry does."
 IVO_desc:0 "The Ivory Coast is a rich plantation holding of French West Africa, and the Commune is in no hurry to let its cocoa and harbours go. Fraternity, it turns out, has a price - and Abidjan pays it."
 GAM_desc:0 "The Gambia is a thin sliver of river and sand, one of two colonial enclaves the Union of British Socialist Republics refuses to surrender. London calls it post-imperial solidarity; in practice it is a flag planted in the middle of French Senegal, and everyone involved knows how absurd it looks."
 SIE_desc:0 "Sierra Leone is the second British enclave kept by the Union of British Socialist Republics, held for the same hypocritical reasons as the Gambia. Freetown's harbour still flies a foreign banner, and the socialists in London still insist they are the ones who ended the Empire."
 LIB_desc:0 "Liberia was never colonized, and it intends to stay that way. Monrovia keeps its republic liberal, its markets open, and its distance from every bloc that has tried to claim it.\nSurrounded by French and British leftovers on every side, it is the one neighbour that answers to no one."
 GHA_desc:0 "Ghana did what its neighbours could not: it walked out of empire and stayed out. Accra answers to neither red Paris nor red London, and it enjoys the contrast.\nA postcolonial republic with its own mind, it watches the occupied territories around it with something close to pity."
 TOG_desc:0 "Togo is a small state that slipped out from under French rule while its larger neighbours were still being governed from Paris. Lomé is poor, proud, and fiercely protective of an independence it knows is fragile."
 DAH_desc:0 "Dahomey, now Benin, shook off French rule at the same moment as Togo and holds its freedom with the same stubbornness. Porto-Novo trades with all sides and answers to none - a small republic with a long memory of what colonialism cost."
