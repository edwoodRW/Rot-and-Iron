l_english:
  usa_newsom_event.1.t: "The Camera Finds the President"
  usa_newsom_event.1.d: "The shot is built for reassurance. Flags in disciplined symmetry. The Capitol still intact in the background, its stone made to suggest permanence whether anyone believes in permanence or not. Gavin Newsom steps to the lectern beneath a sky so bright it makes the entire scene look staged, as if America has decided to imitate one of its own myths for an afternoon.\n\nHe does not promise redemption. That would sound absurd now. Too much has happened, and too much has been seen. The scandals, the riots, the epistemic collapse, the creeping sense that the federal government has spent the last decade alternating between theatre and exhaustion. Instead he speaks in the language of repair. The Constitution as machine, not relic. Government as instrument, not sermon. He tells the country that it does not need ecstasy. It needs function. It needs lights that stay on, allies who still believe calls will be returned, budgets that pass on time, agencies that can distinguish instructions from slogans.\n\nSomewhere beyond the ceremony, half the country is already composing rebuttals. The other half is deciding whether cautious competence is enough to deserve hope. But for a few minutes the republic watches a man stand before the microphones and behave as though the office still means what it says on paper. In 2029, that alone feels almost radical."
  usa_newsom_event.1.a: "The office must look larger than the fracture."

  usa_newsom_event.10.t: "One Hundred Days on Air"
  usa_newsom_event.10.d.nbc: "NBC's evening package runs beneath a studio banner that reads §BAMERICA, FUNCTIONING?§! in calm blue lettering. The anchor speaks in the measured cadence reserved for hurricanes and constitutional moments, careful not to overclaim. The White House, viewers are told, has not healed the republic. It has done something less cinematic and perhaps more surprising: it has passed a budget, staffed agencies, stabilised allied nerves, and reminded Washington that legislation is still possible if everyone involved lowers their voice half a register.\n\nThe segment cuts to clips of Newsom walking through the Roosevelt Room, sleeves rolled, talking to agency heads beside charts and binders thick with implementation notes. Former officials nod gravely about process. A suburban voter in Pennsylvania says she is relieved the government appears to be 'boring again, at least sometimes.' The conclusion is cautious but unmistakable. America remains febrile, but the administration has bought itself the rarest commodity in modern politics: the appearance that control may not be entirely fictitious."
  usa_newsom_event.10.d.fox: "Fox opens with harsher language. The chyron reads §RNEWSOM'S HUNDRED DAYS: ORDER OR OPTICS?§! and the host leans heavily on the second word. Yes, Congress moved. Yes, the White House has looked more coherent than many expected. But the panel insists that choreography is not recovery, and recovery is not legitimacy. Conservatives warn that managerial competence is being used as a velvet glove for a deeper liberal consolidation: more federal reach, more bureaucratic confidence, more polished language disguising the same elite project voters thought they had rejected.\n\nEven so, irritation seeps through the criticism. The administration was supposed to stumble in public. Instead it has learned how to convert low expectations into a kind of strategic momentum. That, a former Republican staffer mutters, is what makes it dangerous. If Newsom can make normalcy look like strength, then opposition will need something sharper than outrage to stop him."
  usa_newsom_event.10.d.ap: "The Associated Press version is shorter, flatter, and in some ways more devastating than either network spectacle. It notes that the administration's first hundred days produced a passed budget, modest federal staffing gains, incremental alliance reassurance, and a temporary improvement in congressional discipline. It also notes that none of this resolves the deeper American crisis. Polarisation remains acute. Institutional trust remains degraded. State governments and media ecosystems continue to operate as rival sovereignties in all but name.\n\nBut the AP dispatch ends on a line already being repeated in other outlets: after years in which the federal government often looked incapable of basic sequencing, the White House has reintroduced sequence. In another era that would not have counted as an achievement. In this one it may prove to be the foundation of all the others."
  usa_newsom_event.10.a: "The first test was survival."
  usa_newsom_event.10.b: "Spend the win in Congress before it evaporates."

  usa_newsom_event.20.t: "The Chip War Comes Home"
  usa_newsom_event.20.d.nbc: "NBC frames the Semiconductor Security Act as the moment Washington finally accepted that microchips are not merely an industry but infrastructure for national power. Clean rooms, export controls, industrial grants, and security reviews are explained with the earnest patience of a network trying to make fabrication plants feel as emotionally resonant as aircraft carriers. The story is simple enough for primetime: a country that invented the future has decided it would rather not rent it from abroad.\n\nWhat goes mostly unsaid is the cost. Subsidies on an enormous scale. Years of duplication. The possibility that half the programme becomes a boondoggle before the other half becomes indispensable. Yet the administration seems willing to absorb all of it. Better waste, apparently, than dependency. Better overbuild than discover too late that strategy can be embargoed."
  usa_newsom_event.20.d.fox: "Fox treats the bill as a paradox. The host praises the national-security instinct while mocking the people implementing it. For years, he says, the same crowd preached global efficiency and post-industrial inevitability. Now they want to stand in front of fabs and talk like Midwestern industrial nationalists. Fine, one guest replies, but if they are finally willing to use the state against strategic dependence, they should admit where the old model failed.\n\nThe argument becomes less about semiconductors than about ideology itself. Is this realism at last, or liberalism borrowing patriotic language because history forced its hand? Either way, the segment concedes one uncomfortable point: once both parties start talking about chips as if they were artillery shells, the era of treating global supply as politically neutral is probably over."
  usa_newsom_event.20.d.ap: "The AP report avoids the grander rhetoric and notes the essentials. The Semiconductor Security Act expands federal support for domestic fabrication, increases screening around strategic technology exposure, and reflects a broadening bipartisan consensus that advanced chips sit at the centre of both military and economic competition. Analysts quoted in the wire caution that results will be slow, uneven, and vulnerable to cost overruns.\n\nStill, the measure marks a threshold. The United States is no longer merely responding to supply-chain stress. It is reorganising part of its industrial policy around the assumption that technological dependence can become a strategic liability on very short notice. That assumption, once marginal, is now embedded in law."
  usa_newsom_event.20.a: "Silicon now answers to strategy."
  usa_newsom_event.20.b: "Sell it as national survival, not industrial romance."

  usa_newsom_event.30.t: "The Alliance Camera Angle"
  usa_newsom_event.30.d.nbc: "NBC's foreign desk calls the Atlantic Charter 2.0 a bid to replace nostalgia with architecture. Gone is the old, easy confidence that the alliance system can survive on memory and ritual. In its place comes a denser language of technology standards, coordinated production, strategic chokepoints, and the practical question of whether democracies can still organise themselves faster than their adversaries can exploit hesitation.\n\nThe White House presents the initiative as sober renewal, not postwar reenactment. Yet the subtext is obvious enough. America is trying to prove to allies that its commitments can still outlive a single election cycle. Europe, for its part, is trying to believe that without sounding naive."
  usa_newsom_event.30.d.fox: "Fox views the whole exercise through a narrower lens. Another charter, another summit, another spray of diplomatic language about shared values and technological coordination. Fine, says one commentator, provided Americans understand the bill eventually arrives at home. The familiar complaint follows: European free-riding, global obligations layered on a domestic system still struggling to govern itself, and an administration allegedly more comfortable abroad than at the border.\n\nBut even here the criticism is strategic rather than isolationist. No one on the panel seriously argues that the United States can simply walk away. The dispute is over terms, not direction. Newsom's problem is that every allied reassurance package also becomes a domestic argument about who, exactly, America is being asked to reassure first."
  usa_newsom_event.30.d.ap: "The AP account is austere. The Atlantic Charter 2.0, it reports, is intended to deepen transatlantic coordination on deterrence, industrial resilience, and democratic technology standards. Officials describe the initiative as a practical framework rather than a symbolic declaration. European reactions are measured, positive in public and cautious in private, reflecting persistent concerns about the durability of U.S. commitments after years of political volatility.\n\nThe summary is restrained, but the implications are not. Washington is attempting to convert reassurance into structure, on the assumption that structure may survive where sentiment no longer does."
  usa_newsom_event.30.a: "Reassurance is only real when it survives contact with reality."
  usa_newsom_event.30.b: "Frame the alliance as deterrence, not sentiment."

  usa_newsom_event.40.t: "The Border on Three Channels"
  usa_newsom_event.40.d.nbc: "NBC presents the Border Administration Compact as the sort of policy no one trusts on television until it starts producing numbers. More judges, more case workers, clearer enforcement priorities, less theatrical chaos, fewer images of a system performing collapse for every camera pointed at it. The segment goes out of its way to sound pragmatic. Nobody claims the border question is solved. The point, says the correspondent, is to make it governable enough that national politics no longer treats every backlog as proof of civilisational failure.\n\nThere is, beneath the moderation, a more radical ambition. To turn one of the country's most symbolically overloaded crises back into administration. That may be the hardest sell of all."
  usa_newsom_event.40.d.fox: "Fox's coverage is blistering. The host calls the compact what liberals always call enforcement when they need a better poll number: an administrative reset. A border crisis managed by spreadsheets is still a crisis, the panel argues, and no amount of White House process language can hide the human scale of the failure or the political instinct behind trying to depolarise it.\n\nYet the segment inadvertently reveals the administration's wager. If enough of the machinery starts moving, if enough casework is cleared, if enough procedural gridlock is turned into throughput, then the emotional monopoly long held by outrage may begin to weaken. Fox does not believe that will happen. The fact it feels the need to say so at length suggests it is not entirely certain."
  usa_newsom_event.40.d.ap: "The AP wire strips away the fury and leaves the structure. The Border Administration Compact expands administrative capacity, emphasises case processing, and seeks to align enforcement priorities with the federal government's actual ability to carry them out. Supporters describe it as an overdue move from symbolic politics to system management. Critics argue it remains vulnerable to surges that would quickly overwhelm new capacity.\n\nThe report does not pretend the issue has become less politically combustible. It simply notes that the administration is attempting something the modern American state often avoids: replacing permanent spectacle with procedures that might, under favourable conditions, become routine."
  usa_newsom_event.40.a: "The republic has mistaken administration for weakness for too long."
  usa_newsom_event.40.b: "Show that competence can be stricter than theatre."

  usa_newsom_event.55.t: "The State Learns Its Own Name"
  usa_newsom_event.55.d.nbc: "NBC presents the Federal Service Renewal as a sign that the administration has moved beyond firefighting and into the more difficult work of rebuilding state capacity itself. This is not glamorous television. Human resources pipelines, agency retention, middle-management competence, and the thousand mundane processes by which a government either becomes real or remains a speech. Yet the network's framing is quietly ambitious. A republic that cannot staff itself cannot govern itself, and a government that cannot govern itself will eventually be governed by panic instead.\n\nThat argument lacks the emotional violence modern politics prefers. It may also be truer than most of the louder ones."
  usa_newsom_event.55.d.fox: "Fox hears in the Federal Service Renewal the old administrative dream returning in better tailoring. More career officials, more process, more internal expertise, more confidence that the federal machine should not merely survive elected turbulence but outlast it. Guests warn that every appeal to competence contains its own politics, especially when the institutions being reinforced lean culturally and ideologically in one direction.\n\nEven so, the segment lands on an uneasy admission. Hollowed-out states do not produce liberty by default. They produce contractors, confusion, and eventually opportunists. The question is not whether capacity matters. It is who gets to define its purpose."
  usa_newsom_event.55.d.ap: "The AP report describes the Federal Service Renewal as a push to improve staffing, retention, and administrative effectiveness across federal agencies. Supporters argue that recent years exposed persistent operational gaps inside the state, while critics warn that bureaucratic expansion can outpace political accountability.\n\nThe broader significance is less ideological than structural. The administration is treating institutional competence as a national objective rather than a background assumption."
  usa_newsom_event.55.a: "Rebuild the service and make government work."
  usa_newsom_event.55.b: "Centralise authority and harden the chain of command."

  usa_newsom_event.50.t: "Recovery Becomes a Coalition Test"
  usa_newsom_event.50.d.nbc: "NBC presents the National Recovery Bill as the administration's first attempt to turn procedural success into visible material change. Anchors point to the familiar list: infrastructure, factory incentives, grid work, transport bottlenecks, the sort of projects politicians love only after the ribbon-cutting. The segment's real emphasis, however, is legislative choreography. This is not merely a spending package. It is a referendum on whether the White House can still assemble a governing majority large enough to do more than prevent collapse.\n\nFor supporters, that is precisely the point. The country does not need another round of emergency improvisation. It needs proof that federal power can still convert paper majorities into concrete outcomes before cynicism hardens again into doctrine."
  usa_newsom_event.50.d.fox: "Fox calls the bill a familiar liberal reflex in modern language: spend first, promise efficiency later, and wrap the whole thing in the rhetoric of resilience. Guests argue that the administration is trying to smuggle an expansive state project through a public still exhausted by inflation, mistrust, and years of hearing that every new programme is the last necessary one. The recovery package, they say, may repair roads and factories, but it also repairs the political confidence of the bureaucracy itself.\n\nEven so, the criticism is edged with concern. If the White House lands the bill cleanly, then competence will begin to look like an ideology with payroll attached. That possibility unsettles opponents more than the dollar figure ever could."
  usa_newsom_event.50.d.ap: "The AP dispatch describes the National Recovery Bill as a broad domestic package combining infrastructure improvements, industrial support, and implementation funds intended to reinforce the administration's recovery agenda. Analysts note that the measure tests both congressional discipline and the government's ability to translate high-level commitments into projects with visible local impact.\n\nIts passage would not resolve deeper structural problems. But it would suggest that Washington remains capable of pursuing medium-term economic policy without first passing through spectacle, shutdown threats, or administrative paralysis."
  usa_newsom_event.50.a: "Build the majority through visible investment."
  usa_newsom_event.50.b: "Trim the bill and keep the fiscal hawks on side."

  usa_newsom_event.60.t: "The Pacific on Prime Time"
  usa_newsom_event.60.d.nbc: "NBC treats the Pacific Shield Initiative as the strategic counterpart to domestic recovery: less visible to voters, perhaps, but no less central to the administration's theory of order. Graphics glow across the screen tracing sea lanes, basing corridors, missile arcs, and the enormous geometry of an ocean Americans notice seriously only when generals begin speaking in maps. The tone is sober. Deterrence, viewers are reminded, is a supply problem long before it is a speech problem.\n\nThe White House wants the public to understand that credibility in Asia cannot be improvised after a crisis begins. Ships, maintenance cycles, airfields, munitions stockpiles, and allied planning must all exist beforehand. It is the sort of argument that sounds dry until history sends the bill."
  usa_newsom_event.60.d.fox: "Fox approves of the harder Pacific line while questioning the administration's instincts everywhere else. Commentators argue that if China is being treated as a pacing threat, then the United States should stop talking like a seminar and start talking like a maritime power. More procurement, more basing realism, fewer diplomatic flourishes. The initiative is welcomed, but only as evidence that even liberals eventually arrive at the logic they once considered unfashionably hawkish.\n\nWhat the network cannot quite decide is whether to attack the White House for belated realism or praise it for finally choosing one. The result is criticism that sounds suspiciously like pressured endorsement."
  usa_newsom_event.60.d.ap: "The AP report states that the Pacific Shield Initiative expands attention to Indo-Pacific logistics, naval readiness, and the operational infrastructure required to sustain deterrence over long distances. Officials frame the programme as preparatory rather than escalatory, aimed at reducing the gap between declared commitments and deployable capability.\n\nAnalysts note that such efforts rarely generate immediate public rewards. Their political value lies in demonstrating that strategic competition is being managed through planning and capacity rather than rhetoric alone."
  usa_newsom_event.60.a: "Emphasise hard deterrence and maritime reach."
  usa_newsom_event.60.b: "Sell readiness as calm professionalism, not panic."

  usa_newsom_event.70.t: "Wiring the Democratic Bloc"
  usa_newsom_event.70.d.nbc: "NBC frames the Democratic Technology Compact as a recognition that alliance politics now runs through data centres, fabrication capacity, export controls, rare inputs, and the technical standards hidden inside every device too ordinary to be thought political. The administration is not promising a new digital utopia. It is promising that the democracies will stop approaching vulnerability one country and one scandal at a time.\n\nThe tone is optimistic, but not naive. Cooperation on strategic technology is expensive, slow, and full of arguments over who profits most. Yet officials insist the alternative is worse: a world in which dependency becomes coercion faster than parliaments can schedule a vote."
  usa_newsom_event.70.d.fox: "Fox hears another polished international framework and immediately asks who, exactly, is being compacted with whom. Allies, yes. Regulators, certainly. Multinational firms, probably. The scepticism is less anti-technology than anti-process. Commentators warn that every transnational standards regime carries its own class accent, and that American workers are often asked to trust words like coordination only to discover they mean consultation without leverage.\n\nStill, even the harshest guests concede that strategic technology can no longer be treated as a neutral market. The dispute is over whether Newsom wants an alliance toolbox or a global managerial priesthood."
  usa_newsom_event.70.d.ap: "The AP describes the Democratic Technology Compact as an effort to coordinate research priorities, technology standards, and supply-chain safeguards with allied states. Officials argue that strategic industries increasingly require policy alignment across jurisdictions if countries hope to avoid fragmented rules and duplicative exposure.\n\nExperts note that implementation will be uneven. But the initiative reflects a larger shift in U.S. policy: technology competition is now being treated as a durable pillar of alliance management rather than a narrow trade issue."
  usa_newsom_event.70.a: "Keep it practical and politically saleable."
  usa_newsom_event.70.b: "Go bigger and lock in a long-term tech bloc."

  usa_newsom_event.80.t: "The Hemisphere Returns to the Map"
  usa_newsom_event.80.d.nbc: "NBC covers the Hemispheric Security Framework with the careful gravity usually reserved for problems Americans prefer to imagine are external. The package links ports, interdiction, logistics, migration pressure, organised crime, and state weakness into a single regional picture. Officials argue that the era of treating the hemisphere as background geography has ended; instability to the south now lands directly in domestic governance, supply resilience, and military planning.\n\nThe segment's language is managerial, but its implications are strategic. The administration is trying to describe order in the Americas as something built through institutions and partnerships rather than periodic panic."
  usa_newsom_event.80.d.fox: "Fox likes the recognition that the hemisphere matters and dislikes almost everything else about the way the White House says it. Commentators accuse the administration of discovering realism only after being cornered by events at the border and by the visible spread of cartel logistics, smuggling routes, and regional fragility. If hemispheric security is truly national security, they argue, then Washington should speak with the bluntness of enforcement, not the vocabulary of frameworks.\n\nYet beneath the performance there is an admission. The regional picture has grown too serious for slogans alone, and the administration is at least trying to build something more durable than outrage cycles."
  usa_newsom_event.80.d.ap: "The AP wire reports that the Hemispheric Security Framework seeks closer coordination on logistics security, transnational crime, migration management, and regional state capacity. Administration officials describe it as an attempt to integrate domestic and foreign policy concerns that have increasingly converged across the Western Hemisphere.\n\nObservers say the framework's significance lies in sequencing. Rather than reacting to each flare-up as an isolated emergency, Washington is trying to organise a standing regional approach with clearer institutional lines."
  usa_newsom_event.80.a: "Treat the hemisphere as a security theatre."
  usa_newsom_event.80.b: "Anchor it in governance, not permanent alarm."

  usa_newsom_event.90.t: "Steel, Asphalt, Throughput"
  usa_newsom_event.90.d.nbc: "NBC covers the Continental Production System as if it were the physical grammar of the Newsom project finally made visible. Factories, freight corridors, substations, industrial zones, the long anonymous architecture through which policy either acquires weight or dissolves into metaphor. The administration claims it is stitching domestic production back into national strategy. Critics call it expensive. Supporters call it overdue. The cameras linger on concrete and steel because both still carry a rare symbolic force in American politics: proof that something happened.\n\nThe deeper wager is that productive capacity can once again become emotionally legible to a public trained to expect only services, platforms, and decline."
  usa_newsom_event.90.d.fox: "Fox treats the production push with suspicion sharpened by reluctant agreement. Yes, industrial capacity matters. Yes, resilient logistics matter. Yes, strategic dependence has costs. But the panel insists the administration wants to use those truths to launder a broader command-and-subsidy model back into respectability. If the federal government starts deciding where the next layer of factories and corridors goes, then politics will follow the money with all its usual hunger.\n\nStill, no one can quite deny the appeal of a state that builds more than press releases."
  usa_newsom_event.90.d.ap: "The AP describes the Continental Production System as an effort to align industrial expansion, infrastructure improvement, and supply resilience under a broader strategic planning framework. Officials say the goal is to reduce chokepoints and increase domestic productive depth. Analysts note that the programme blends economic policy with national-security logic in ways that would have been more unusual a decade earlier.\n\nThe project does not end political argument. It simply relocates that argument into the material question of what kind of economy the United States now intends to maintain."
  usa_newsom_event.90.a: "Build visibly and tie the coalition to output."
  usa_newsom_event.90.b: "Prioritise strategic throughput over ribbon-cutting."

  usa_newsom_event.95.t: "Arsenal of the Democracies"
  usa_newsom_event.95.d.nbc: "NBC describes the Democracy Arsenal Network as the administration's attempt to reconcile alliance politics, industrial policy, and deterrence into a single story the public can understand. Weapons lines, research partnerships, procurement coordination, and export controls are packaged not as isolated policy domains but as parts of one long strategic system. The implication is clear enough. The democracies will not remain secure on values alone. They will remain secure if they can still produce at scale, innovate in time, and supply one another before crises become wars.\n\nThe tone is resolute without sounding ecstatic. America is not being promised innocence. It is being asked to rediscover capacity in alliance form."
  usa_newsom_event.95.d.fox: "Fox approves of the arsenal language more than the democratic poetry wrapped around it. Commentators argue that if the United States is serious about being the spine of a larger security system, then it should speak first about output, stockpiles, and procurement discipline rather than grand theory. Yet even critics concede the administration has identified something real: deterrence now depends as much on industrial tempo and technological coordination as on speeches about credibility.\n\nWhat remains contested is whether Newsom is building an arsenal for the nation or a prestige project for the liberal order."
  usa_newsom_event.95.d.ap: "The AP wire reports that the Democracy Arsenal Network seeks deeper coordination between U.S. defence production, allied technology cooperation, and longer-term deterrence planning. Officials present it as a practical framework for sustaining military-industrial capacity among aligned states. Analysts say the proposal reflects a continued erosion of the boundary between domestic industrial policy and alliance management.\n\nIts immediate effects may be modest. Its strategic meaning is less so. Washington is attempting to make coalition power reproducible rather than improvised."
  usa_newsom_event.95.a: "Turn the bloc into an arsenal."
  usa_newsom_event.95.b: "Sell it as jobs, science, and staying power."

  usa_newsom_event.100.t: "Newsom Addresses America"
  usa_newsom_event.100.d: "By the time the address is carried live, the country already knows the shape of it. Not the exact phrases, though speechwriters and enemies alike have leaked enough fragments to guess at the cadence, but the argument. That the old centre died because it confused inertia with stability. That the republic cannot be held together by nostalgia, only by institutions that still function, industries that still produce, allies who still trust calls from Washington, and a governing class disciplined enough to treat power as responsibility rather than permanent performance.\n\nNewsom speaks from behind the Resolute Desk with that very Californian gift for sounding both solemn and camera-aware. He talks about a new American centre, but carefully avoids saying consensus. Consensus is dead, and everyone knows it. What he offers instead is something harder and less sentimental: a bloc of interests, agencies, firms, workers, allies, and voters willing to accept competence as a political project in itself. Not national healing. Not unity in the soft therapeutic sense. Structure. Direction. Capacity. Enough of all three that decline might stop looking inevitable.\n\nAcross the country, reactions split along familiar fault lines. Admirers hear the first coherent doctrine of post-crisis liberal power. Enemies hear managerial Caesarism in a pleasant voice. The exhausted hear, perhaps, only relief that someone in authority is once again describing the state as if it exists to do things. The speech ends. The cameras pull back. For a moment the White House looks less like a museum of a vanished order than the command post of one still trying to be born."
  usa_newsom_event.100.a: "America does not need innocence restored. It needs capacity restored."
  usa_newsom_event.100.b: "Tell them the republic survives by force of organisation."
  usa_newsom_event.100.c: "Hold the centre together, even if no one fully believes in one."
  usa_newsom_event.101.t: "Congress Hears the Signal"
  usa_newsom_event.101.d.high: "The Hill's response is not warm, exactly, but it is disciplined. Leadership offices are suddenly crowded, committee chairs are newly available for calls, and the usual murmur of sabotage drops half a register. Enough legislators have concluded that the administration is now a live centre of gravity rather than a temporary arrangement to be survived. In Washington, that qualifies as momentum."
  usa_newsom_event.101.d.medium: "The address lands unevenly. Some members hear doctrine, others hear branding, and a fair number hear only the latest version of the demand that they tie their fate to a presidency still being tested in real time. The administration has room to move, but not room to drift. Every next vote will matter."
  usa_newsom_event.101.d.low: "The applause ends before the problem does. Staffers leave the chamber already counting defectors, regional blocs, and procedural choke points. The presidency has found its message, but not yet the legislature required to turn message into law. The centre exists. Whether Congress will inhabit it remains unresolved."
  usa_newsom_event.101.a: "Count the members again."

  usa_newsom_event.110.t: "The Shape of Deterrence"
  usa_newsom_event.110.d: "Now that the administration has a governing centre, it must decide what kind of hard power that centre is meant to project. One path prioritises visible maritime and expeditionary strength. The other presents American rearmament as disciplined, credible, and deliberately unspectacular. Both promise power. They do not promise the same politics."
  usa_newsom_event.110.a: "Project strength at range and make rivals calculate."
  usa_newsom_event.110.b: "Build a calmer deterrence and sell it as preparedness."
  usa_newsom_event.111.t: "The Briefing Leaks Before the Bill Exists"
  usa_newsom_event.111.d: "Congressional support proves thinner than the White House pretended. Before the deterrence line can harden into doctrine, members begin treating every procurement ask and every operational posture review as a fresh bargaining chip. The administration can absorb the embarrassment and accept delay, or spend heavily to stop the late agenda from unravelling in public."
  usa_newsom_event.111.a: "Take the hit and regroup."
  usa_newsom_event.111.b: "Spend political capital before the sceptics organise."

  usa_newsom_event.120.t: "Rebuilding the Republic in Steel"
  usa_newsom_event.120.d: "The reindustrial push can be sold as a jobs-and-throughput compact broad enough to hold the House, or as a tighter strategic build-out aimed at chokepoints, energy, and defence-adjacent industry. The difference is not whether America builds. It is who the programme is designed to satisfy first."
  usa_newsom_event.120.a: "Make it broad, visible, and politically sticky."
  usa_newsom_event.120.b: "Target strategic industry and dare Congress to complain."
  usa_newsom_event.121.t: "The Appropriators Remember Themselves"
  usa_newsom_event.121.d: "The late industrial programme runs into the oldest American obstacle: legislators who like factories in principle and line items in their own districts even more. Committees begin carving, slowing, and attaching conditions. The programme can be narrowed and delayed, or the White House can open the taps and buy coherence the expensive way."
  usa_newsom_event.121.a: "Let the programme shrink rather than break."
  usa_newsom_event.121.b: "Hold the coalition together with concessions."

  usa_newsom_event.130.t: "Alliance as System"
  usa_newsom_event.130.d: "The administration can turn the alliance network into a dense web of standards, research, and production ties, or it can sharpen it into a harder geopolitical instrument meant to deter and isolate rivals. The choice will shape not only foreign policy, but the domestic coalition that must fund it."
  usa_newsom_event.130.a: "Bind the allies through institutions and shared capability."
  usa_newsom_event.130.b: "Turn the network into a strategic bloc."
  usa_newsom_event.131.t: "Committee Chairs Discover Foreign Policy"
  usa_newsom_event.131.d: "The alliance architecture collides with a familiar American ritual: legislators insisting that every outward commitment must first survive a domestic trial by veto point. Hearings multiply. Sceptics begin asking whether the administration is building a system or simply building new obligations. The project can be slowed to reassure Congress, or forced forward at political cost."
  usa_newsom_event.131.a: "Slow the timetable and absorb the damage."
  usa_newsom_event.131.b: "Lean on the Senate and push through the noise."

  usa_newsom_event.150.t: "The Decade Opens"
  usa_newsom_event.150.d: "A decade is not born in a speech, a bill, or a summit. It emerges when a state proves it can keep its promises in sequence long enough for enemies, markets, allies, and citizens to update their expectations. Whether this becomes a decade of reconstruction, deterrence, or disciplined pluralism, the administration has at least forced the old American question back into history: not whether the republic can feel united, but whether it can still act with purpose."
  usa_newsom_event.150.a: "Make the next ten years answer the last ten."
  usa_newsom_event.151.t: "The Decade Meets the Vote Count"
  usa_newsom_event.151.d: "The slogan outran the majority. The administration may have assembled a governing centre, but not yet the kind of legislative machine required to make a whole decade obey it. Members hesitate. Staffers stall. Factions return to counting leverage instead of purpose. The White House can accept a thinner decade than it promised, or spend heavily to keep the future on schedule."
  usa_newsom_event.151.a: "Scale the decade down to the majority that exists."
  usa_newsom_event.151.b: "Whip, bargain, threaten, and keep the line moving."

  usa_newsom_governing_centre:0 "The Governing Centre"
  USA_newsom_whip_the_late_agenda:0 "Whip the Late Agenda"
