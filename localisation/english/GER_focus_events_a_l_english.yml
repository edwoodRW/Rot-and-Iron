l_english:
 GER_prewar.1.t:0 "Message to the Chancellery"
 GER_prewar.1.d:0 "§gENCRYPTED // CHANCELLERY EYES ONLY // 02:14 CET§!\n\nTo the Chancellor,\n\nI write this from the back room of a hotel in Warsaw where the Wi-Fi password is still the name of a dead president. By the time you read it I will have changed hotels twice. Please do not try to reply to this address.\n\nThe Soviet position is not what the briefings tell you. Their ministries still issue the proclamations, their television still runs the anthem at midnight, and their ambassadors still smile at receptions. But I have spent three weeks in the garrison towns, and the garrisons are hollow. Fuel is rationed. Conscripts are being fed by village committees who ask for nothing in return and expect everything in the end. The officers I met no longer speak of victory. They speak of pensions.\n\nI am not telling you this so that Germany may pounce. I am telling you because the people who will decide what happens next, in Moscow and in Berlin, are all pretending they have more time than they do. Sooner or later someone will decide that the cheapest way to end an unbearable stalemate is a short, sharp war. I would rather it be someone who reads letters like this one.\n\nDo what you think best. Only decide while you can still choose.\n\n§Y\"The map is not the territory, Chancellor. But the territory is changing faster than the map.\"§!"
 GER_prewar.1.a:0 "Put the whole report in front of the cabinet."
 GER_prewar.1.b:0 "Say nothing. Let the quiet do its work."
 GER_prewar.western_understanding.t:0 "Quiet Words in Brussels"
 GER_prewar.western_understanding.d:0 "§gTHE EUROPEAN POST // POLITICS // TUESDAY EDITION§!\n\n§YGERMAN ENVOYS LEAVE TALKS 'CAUTIOUSLY OPTIMISTIC' AS WESTERN CAPITALS WEIGH THEIR WORDS§!\n\nBRUSSELS - The motorcade carrying Berlin's delegation left the Egmont Palace by a side entrance on Tuesday evening, which, in diplomatic terms, is as good as a press conference. Officials from three Western governments confirmed that the talks, officially described as a routine exchange on trade corridors, ran for nearly six hours and covered a great deal more than trade.\n\nAccording to two people present, German representatives made no request for support and no promise of action. Instead they laid out, with the calm precision of an auditor, what Berlin considers to be the strategic reality: that the eastern frontier is becoming unstable, that no one in the room would benefit from a collapse that arrived without warning, and that Germany intended to be prepared. A French delegate reportedly asked whether 'prepared' was a polite word for 'planning'. The reply, by all accounts, was a smile.\n\nNo commitments were made. None were needed. Western governments have learned to read silence in the way their predecessors once read telegrams, and the silence in that room was friendlier than anything printed in the official communique. One senior diplomat, speaking on condition of anonymity, put it simply: 'Nobody agreed to anything. Nobody objected to anything. In this business, that is a treaty.'\n\nThe communique itself ran to three sentences. Analysts have already counted the commas.\n\n§Y\"We were not given a blessing. We were given room to act. That is worth more.\"§!"
 GER_prewar.western_understanding.a:0 "A good evening's work."
 GER_prewar.western_understanding.b:0 "Keep expectations low. Silence is not a promise."
 GER_prewar.bear_is_weakened.t:0 "The Bear Is Weakened"
 GER_prewar.bear_is_weakened.d:0 "§gBUNDESNACHRICHTENDIENST // ASSESSMENT 7-C // EYES ONLY§!\n\n§YSUBJECT: SOVIET MILITARY READINESS, EASTERN MILITARY DISTRICTS§!\n\nSummary: Soviet forces on our border can no longer be described as a coherent offensive capability. This assessment is based on satellite imagery, intercepted logistics traffic and human sources inside three military districts.\n\nOf the armoured formations nominally deployed along the western frontier, fewer than a third show recent movement. Motor pools are full, but fuel depots are not. Artillery parks appear intact from orbit; ground sources report that a significant portion of the guns lack serviceable barrels or shells. Rail traffic westward has fallen by more than forty percent since the spring, and the freight that does move is increasingly grain, not ammunition.\n\nMorale is the larger problem. Our listening posts have recorded repeated instances of unit commanders refusing orders from Moscow pending 'clarification'. In two cases, local garrisons have begun taking instruction from regional administrators rather than from the General Staff. The Kremlin's response has been to issue more orders.\n\nAssessment: The Soviet Union is not collapsing. It is something more dangerous: a power that remembers what it used to be and cannot admit what it has become. Such powers lash out. They do not do so well.\n\nRecommendation: Proceed with preparations. Do not mistake weakness for harmlessness.\n\n§Y\"A wounded animal is always the most dangerous one in the room.\"§!"
 GER_prewar.bear_is_weakened.a:0 "Noted. Prepare accordingly."
 GER_prewar.military_ready.t:0 "The Army Reports Ready"
 GER_prewar.military_ready.d:0 "§gFIELD MARSHAL'S OFFICE // BENDLERBLOCK // 06:40§!\n\nThe briefing room smelled of coffee and old carpet. General Hartmann stood at the end of the table without notes, which the Chancellor had learned over the years was the surest sign that he had something to say.\n\n'Herr Chancellor, gentlemen. Five months ago I told this cabinet that the Bundeswehr could defend the country and little else. I am here to correct myself.'\n\nHe touched the display behind him. A map bloomed in amber and green: depots restocked, brigades re-equipped, a new logistics network running from the Baltic to the Alps. 'Our reserves are mobilised in all but name. Our drones are in the field and our command net is hardened against everything the Russians still know how to throw at it. Our pilots have flown more hours this quarter than in the previous three years.'\n\nA junior minister asked whether this meant the army wanted war. Hartmann looked at him for a long moment. 'The army wants to be ready, Herr Minister. Wanting war is a luxury for people who have never packed a tent.'\n\nThere was a silence. Then the Chancellor asked, quietly, what the army needed from him now. Hartmann did not hesitate. 'A decision. And the courage to make it before it is made for us.'\n\n§Y\"A soldier can wait for orders. He cannot wait forever.\"§!"
 GER_prewar.military_ready.a:0 "Reward the general staff with fresh field exercises."
 GER_prewar.military_ready.b:0 "Praise the army publicly. Calm the nation."
 GER_prewar.mandate_secured.t:0 "A Mandate for Action"
 GER_prewar.mandate_secured.d:0 "§gDIE ZEIT // THE WEEKLY // EDITORIAL§!\n\n§YTHE VOTE THAT WASN'T ABOUT WAR§!\n\nAt 11:52 on Thursday night, the Bundestag passed the Emergency Defence Authorisation by a margin that surprised even its authors. Two hundred and fourteen members voted against, a respectable showing of principled opposition. Four hundred and sixty-one voted for. The chamber then adjourned for the weekend, as if nothing had happened.\n\nSomething happened. For the first time since the Berlin Accords were drafted, a German parliament has handed its government the power to commit the country to armed conflict without first returning to ask permission. The government insists, with straight faces, that this is purely precautionary. The Chancellor said as much in his post-vote statement, in which the word 'peace' appeared eleven times and the word 'war' not at all. We counted.\n\nThat is the thing about modern politics. Nobody ever votes for war. They vote for 'readiness', for 'resolve', for 'responsible contingency'. And then, one grey morning, the contingency arrives and we discover we have already agreed to it.\n\nTo be fair to the government, the alternative was worse. A cabinet with no mandate is a cabinet that hesitates. A hesitating cabinet in a crisis is how crises become catastrophes. The Chancellor knows this. So, one suspects, do the four hundred and sixty-one.\n\nWhether the country has a mandate or merely the appearance of one will become clear soon enough.\n\n§Y\"A blank cheque is only a gift until someone presents it.\"§!"
 GER_prewar.mandate_secured.a:0 "Use the momentum while it lasts."
 GER_prewar.mandate_secured.b:0 "Reassure the public. This is a safeguard, nothing more."
 GER_prewar.the_die_is_cast.t:0 "The Die Is Cast"
 GER_prewar.the_die_is_cast.d:0 "§gSITUATION ROOM // CHANCELLERY // 23:58§!\n\nThe room was smaller than people imagined. No theatre, no bank of screens glowing on the wall, just a table, eleven chairs and a kettle someone had forgotten to turn off. The Chancellor sat at the head with his hands folded and waited for the last of them to find a seat.\n\n'You have all read the plan,' he said. 'You have all argued about it. I have listened to every argument, including the ones I disliked.' He looked down the table, one face at a time. 'I want it noted that nobody here was ordered to agree.'\n\nThe Defence Minister cleared his throat. 'Herr Chancellor, if there is any doubt in anyone's mind, now is the moment to say so.'\n\nNobody spoke. Somewhere in the building a printer began to hum. On the table, a single sheet of paper, one paragraph long, waited for a single signature.\n\nShe signed it. It took less than a second. The pen made a sound like a door closing in a distant house. Then he slid the paper across the table, stood, and said: 'Gentlemen, let us hope history is kind. We will not be.'\n\nOutside, the clocks of Berlin rolled over to midnight. In forty garrisons, officers opened sealed envelopes.\n\nAt 00:03 the Foreign Ministry's night duty officer placed a call to the Soviet embassy and read a single paragraph into a recorded line. The ambassador listened without interrupting. When the formal declaration of war had been delivered, he said only, 'You understand what you have done,' and hung up. By morning every feed in Europe carried the same words in forty languages: Germany is at war with the Soviet Union.\n\n§Y\"Fortune favours those who are ready. It does not forgive those who are late.\"§!"
 GER_prewar.the_die_is_cast.a:0 "Germany declares war on the Soviet Union."
 GER_shadow.1.t:0 "Ghosts in the Wire"
 GER_shadow.1.d:0 "§gBFV INTERNAL MEMO // CLASSIFIED // COUNTERINTELLIGENCE§!\n\n§YRE: SOVIET PENETRATION OF DOMESTIC NETWORKS§!\n\nWe have now confirmed what the technical staff suspected for weeks. Soviet operators, or someone working to their order, have been inside our civil infrastructure since at least February. Power grid controllers. Regional rail scheduling. Two hospital networks in Saxony. They have done nothing with this access. That is the problem.\n\nThe intrusions are patient and professional. There is no ransom note, no vandalism, no theft that we can find. Whoever built these tools does not intend to steal anything. They intend to be present on the day it counts. Our analysts describe it as 'a hand resting on the light switch'.\n\nWe have discovered the implants because a junior engineer in Leipzig noticed a diagnostic log that was one hundred and twelve milliseconds out of step with every other machine in the room. He reported it as a bug. I intend to see that he is promoted.\n\nWe can purge the networks tonight and alert the enemy that we know. Or we can quietly watch, feed them nonsense, and learn what they intend to do. The Director favours the second. I favour whichever option keeps the lights on.\n\n§Y\"They are not trying to break the door. They are trying to learn where we keep the key.\"§!"
 GER_shadow.1.a:0 "Burn the implants. Harden everything now."
 GER_shadow.1.b:0 "Watch them quietly. Feed them what we choose."
 GER_shadow.saboteurs_in_place.t:0 "The Sleepers Awake"
 GER_shadow.saboteurs_in_place.d:0 "§gSPECIAL BROADCAST // DEUTSCHE WELLE // BREAKING§!\n\n'We interrupt this programme to bring you urgent news. Within the past hour, a series of coordinated incidents has been reported across the Eastern Länder. Rail signalling has failed at four junctions. Two fuel depots in Brandenburg are on fire. A communications relay near Frankfurt an der Oder has gone dark, and a bridge outside Dresden has been closed after what authorities are calling an unexplained structural failure.'\n\n'Police sources tell us these events are not accidents. Arrests have been made. Federal investigators have confirmed that several of those detained were carrying forged identity cards and equipment of Soviet origin. The Interior Ministry has convened an emergency session.'\n\n'We go now to our correspondent on the scene. Anna, what can you see?'\n\n'Thank you. I am standing about two kilometres from the junction at Cottbus. The line is cut; there is a lot of smoke. I have just spoken with a railway worker who says the explosion was timed to the minute of a scheduled freight convoy. He says whoever did this knew our timetable better than we did.'\n\n'Anna, can you tell us anything about who may be responsible?'\n\n'Not officially. But I will say this. Everyone I have spoken to tonight has used the same word. They are saying: finally.'\n\n§Y\"Fear is a tool. They are wielding it. We must not let them keep it.\"§!"
 GER_shadow.saboteurs_in_place.a:0 "Rally the country. They will not break us."
