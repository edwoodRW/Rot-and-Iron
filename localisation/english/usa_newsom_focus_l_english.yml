l_english:
 USA_The_61st_Presidential_Inauguration:0 "The 61st Presidential Inauguration"
 USA_The_61st_Presidential_Inauguration_desc:0 "Newsom takes office with a formal majority, a brittle coalition, and a federal government whose legitimacy has been damaged by scandal, partisan warfare, and administrative decay. The opening task is not to promise national rebirth, but to establish that the presidency can still direct the state, set priorities, and keep enough of Washington moving to prevent paralysis from becoming the country's default condition."
 USA_The_Restoration_Mandate:0 "The Restoration Mandate"
 USA_The_Restoration_Mandate_desc:0 "The administration's first message is simple: restore competence, restore process, and restore enough public confidence for the federal government to act. That means narrowing the early agenda to a small number of deliverable priorities, preventing ideological overreach, and proving that executive authority can still coordinate a fractured republic."
 USA_Count_The_Votes:0 "Count the Votes"
 USA_Count_The_Votes_desc:0 "The real condition of the presidency is measured in whip counts, committee chairs, state delegations, and the private demands of nervous legislators. Before the White House can legislate, it needs an exact map of who is with the administration, who can be moved, and which concessions are necessary to hold a governing majority together."
 USA_Rebuild_The_Apparatus:0 "Rebuild the Apparatus"
 USA_Rebuild_The_Apparatus_desc:0 "Federal capacity did not collapse in a single moment. It was worn down by attrition, politicised appointments, contracting failures, and the hollowing out of institutional memory. The White House will begin by restoring internal coordination, strengthening agency direction, and identifying which parts of the state can still deliver at speed."
 USA_Reassure_The_Alliances:0 "Reassure the Alliances"
 USA_Reassure_The_Alliances_desc:0 "Allied governments no longer assume that American commitments survive each election intact. The administration must move quickly to reassure partners that Washington intends to remain a functioning security guarantor, even while domestic instability limits what it can credibly promise in the short term."
 USA_The_House_Whip_Operation:0 "The House Whip Operation"
 USA_The_House_Whip_Operation_desc:0 "The House majority is wider than the Senate margin, but it is also more volatile. Committee ambitions, media pressures, donor networks, and district-level panic can unravel support with little warning. The White House will run a disciplined whip operation to convert a nominal majority into a usable one."
 USA_The_Senate_Holding_Action:0 "The Senate Holding Action"
 USA_The_Senate_Holding_Action_desc:0 "The Senate is the chamber most capable of turning a government into a spectator. If the administration is to avoid procedural humiliation in its opening months, it must stabilise key votes, narrow the number of hostile holdouts, and keep leadership aligned long enough to move the first packages through."
 USA_The_Federal_Appointments_Board:0 "The Federal Appointments Board"
 USA_The_Federal_Appointments_Board_desc:0 "One of the fastest ways to restore state capacity is to stop leaving critical offices vacant. The administration will centralise its appointments process, prioritise competence over symbolism, and push to fill the positions that determine whether directives issued in Washington are carried out in practice."
 USA_The_Supply_Chain_Review:0 "The Supply Chain Review"
 USA_The_Supply_Chain_Review_desc:0 "Economic weakness is no longer just a question of growth rates. It is a question of whether the United States can still move goods, components, and industrial inputs through systems strained by fragmentation, underinvestment, and geopolitical risk. The first review will identify bottlenecks that can be relieved without waiting for a grand national settlement."
 USA_The_NATO_Reassurance_Mission:0 "The NATO Reassurance Mission"
 USA_The_NATO_Reassurance_Mission_desc:0 "European governments need evidence, not speeches, that the United States still understands the consequences of strategic drift. The administration will use its opening diplomatic cycle to rebuild working confidence, clarify near-term commitments, and prevent allied contingency planning from hardening into permanent distrust."
 USA_The_Pacific_Deterrence_Review:0 "The Pacific Deterrence Review"
 USA_The_Pacific_Deterrence_Review_desc:0 "Washington cannot afford ambiguity in the Pacific at a moment when rivals are testing its will and partners are questioning its endurance. The administration will review force posture, logistics, and signalling to ensure that deterrence remains credible even before a broader military renewal is complete."
 USA_The_Stability_Budget:0 "The Stability Budget"
 USA_The_Stability_Budget_desc:0 "The opening budget is less an ideological document than a political instrument. Its purpose is to keep markets calm, reassure institutions, fund immediate state functions, and demonstrate that Congress can still pass a governing package without descending into spectacle."
 USA_The_Government_Capacity_Act:0 "The Government Capacity Act"
 USA_The_Government_Capacity_Act_desc:0 "The administration's first durable reform will focus on the machinery of government itself: staffing, procurement, coordination, emergency implementation, and the restoration of baseline competence across departments that have spent years operating in crisis mode."
 USA_The_Democratic_Credibility_Campaign:0 "The Democratic Credibility Campaign"
 USA_The_Democratic_Credibility_Campaign_desc:0 "The United States must show both domestic and foreign audiences that its democratic system can still produce coherent policy under pressure. This is not a matter of image management alone. It is a campaign to align external commitments, internal discipline, and public expectations around a government that intends to remain functional."
 USA_The_First_Hundred_Days:0 "The First Hundred Days"
 USA_The_First_Hundred_Days_desc:0 "A successful opening will not solve the American crisis, but it can set the terms on which the rest of the presidency is fought. If the White House can pass a budget, restore parts of the federal apparatus, and reassure allies without losing Congress, it will have proven that the state still has enough coherence to govern."
 USA_The_National_Recovery_Bill:0 "The National Recovery Bill"
 USA_The_National_Recovery_Bill_desc:0 "After stabilising the opening period, the administration will need a larger recovery package that looks less like emergency patchwork and more like a governing programme. The bill will combine infrastructure, industrial resilience, and targeted investment into a single package designed to show that federal action can still shape the material direction of the country."
 USA_The_Federal_Service_Renewal:0 "The Federal Service Renewal"
 USA_The_Federal_Service_Renewal_desc:0 "A government that cannot recruit, retain, and direct capable personnel will eventually fail regardless of message discipline. This programme will rebuild the administrative corps, improve retention in critical agencies, and re-establish the expectation that federal service is a functioning career rather than a short-term political sacrifice."
 USA_The_Atlantic_Charter_2_0:0 "The Atlantic Charter 2.0"
 USA_The_Atlantic_Charter_2_0_desc:0 "The administration will move beyond reassurance and begin setting out a new working basis for transatlantic coordination. The purpose is not nostalgia for the old order, but a practical agreement on deterrence, technology, and industrial coordination among governments that can no longer afford strategic drift."
 USA_The_Pacific_Shield_Initiative:0 "The Pacific Shield Initiative"
 USA_The_Pacific_Shield_Initiative_desc:0 "The Pacific theatre requires more than rhetoric about competition. It requires visible logistics, clearer planning, and a demonstrated ability to sustain maritime and air power across long distances. The administration will use this initiative to show that American deterrence in Asia is still backed by operational preparation."
 USA_The_Border_Administration_Compact:0 "The Border Administration Compact"
 USA_The_Border_Administration_Compact_desc:0 "The southern border cannot be governed through slogans alone. The White House will pursue an administrative compact focused on case management, enforcement prioritisation, inter-agency coordination, and the reduction of backlogs that have turned the system into a permanent national flashpoint."
 USA_The_Grid_Modernization_Program:0 "The Grid Modernization Program"
 USA_The_Grid_Modernization_Program_desc:0 "Energy insecurity now runs through industry, household costs, and national resilience alike. The administration will push a programme of transmission upgrades, regional interconnection, and resilience investment to reduce bottlenecks that have become a structural drag on growth and reliability."
 USA_The_Semiconductor_Security_Act:0 "The Semiconductor Security Act"
 USA_The_Semiconductor_Security_Act_desc:0 "A country that cannot secure advanced chips cannot secure much else. The administration will use procurement, subsidies, and security screening to harden domestic semiconductor capacity and reduce the strategic vulnerability created by concentrated foreign supply."
 USA_The_Career_State_Project:0 "The Career State Project"
 USA_The_Career_State_Project_desc:0 "The long crisis of American governance has been worsened by institutional churn and the replacement of experience with improvisation. This project will rebuild the internal ladder of federal competence by strengthening career tracks, retaining specialists, and restoring the authority of officials whose job is to make government function regardless of media cycles."
 USA_The_National_Permit_Office:0 "The National Permit Office"
 USA_The_National_Permit_Office_desc:0 "Projects stall not only because of politics, but because the American state has made routine approval work painfully slow and fragmented. A central permits office will coordinate timelines, cut duplication, and make it harder for administrative backlog to suffocate the government's own investment programme."
 USA_The_Democratic_Technology_Compact:0 "The Democratic Technology Compact"
 USA_The_Democratic_Technology_Compact_desc:0 "Technology competition now shapes alliance politics as much as military planning. Washington will seek a compact with democratic partners on standards, supply security, research coordination, and strategic technology controls, turning common vulnerability into organised cooperation."
 USA_The_Arsenal_Reassurance_Plan:0 "The Arsenal Reassurance Plan"
 USA_The_Arsenal_Reassurance_Plan_desc:0 "Allies need confidence that American commitments are backed by production capacity, not just statements from the podium. This plan will tie deterrence to industrial throughput by expanding munitions capacity and signalling that the United States can support its partners without emptying its own stocks."
 USA_The_Maritime_Logistics_Command:0 "The Maritime Logistics Command"
 USA_The_Maritime_Logistics_Command_desc:0 "Deterrence in two oceans depends on transport, maintenance, and port capacity as much as it does on fleet tonnage. The administration will establish a command framework focused on sealift, sustainment, and industrial support so that American power projection is not undermined by its own logistical weaknesses."
 USA_The_Immigration_Case_Clearance:0 "The Immigration Case Clearance"
 USA_The_Immigration_Case_Clearance_desc:0 "Backlogs have turned immigration administration into a self-reproducing crisis. The White House will fund staffing, case review, and court support to reduce the procedural paralysis that has allowed every surge in arrivals to become a political and administrative breakdown."
 USA_The_Fentanyl_Interdiction_Taskforce:0 "The Fentanyl Interdiction Taskforce"
 USA_The_Fentanyl_Interdiction_Taskforce_desc:0 "The fentanyl crisis cannot be reduced to campaign theatre. It is a law-enforcement, customs, public-health, and organised-crime problem that demands coordinated federal action. This taskforce will concentrate interdiction, intelligence, and cross-border operational work in a single national effort."
 USA_The_Continental_Production_System:0 "The Continental Production System"
 USA_The_Continental_Production_System_desc:0 "Recovery will remain fragile unless the United States can reconnect infrastructure, industrial investment, and strategic supply into a coherent production model. This system links the recovery bill's early projects into a broader continental framework for output, transport, and resilient domestic industry."
 USA_The_Executive_Capacity_Doctrine:0 "The Executive Capacity Doctrine"
 USA_The_Executive_Capacity_Doctrine_desc:0 "The core lesson of the post-Trump years is that the state cannot rely on improvisation during every emergency. The administration will formalise a doctrine of executive capacity that prioritises planning, continuity, inter-agency coordination, and implementation discipline across the federal government."
 USA_The_Democracy_Arsenal_Network:0 "The Democracy Arsenal Network"
 USA_The_Democracy_Arsenal_Network_desc:0 "American foreign policy will be stronger if it rests on a network of shared industrial capacity with aligned democracies rather than on unilateral strain. Washington will therefore connect technology coordination, defence production, and procurement partnerships into a longer-term industrial bloc."
 USA_The_Hemispheric_Security_Framework:0 "The Hemispheric Security Framework"
 USA_The_Hemispheric_Security_Framework_desc:0 "North America and the wider hemisphere can no longer be treated as a strategic afterthought. Smuggling, state weakness, logistical disruption, and external influence now affect domestic governance and military planning alike. The administration will build a regional framework that treats hemispheric order as part of national security."
 USA_The_New_American_Centre:0 "The New American Centre"
 USA_The_New_American_Centre_desc:0 "If the administration succeeds, it will not be because it revived an old consensus intact. It will be because it assembled a new governing centre out of state capacity, industrial recovery, allied credibility, and legislative discipline. This focus represents the consolidation of that settlement into a durable national project."
 USA_The_Deterrence_Presidency:0 "The Deterrence Presidency"
 USA_The_Deterrence_Presidency_desc:0 "Having stabilised the political centre, the administration can now convert it into a more assertive doctrine abroad. This presidency will present deterrence not as episodic reaction, but as a standing method of statecraft backed by planning, logistics, and a willingness to sustain pressure over time."
 USA_The_Reindustrialized_Union:0 "The Reindustrialized Union"
 USA_The_Reindustrialized_Union_desc:0 "The promise of recovery must become a visible economic order. This stage of the programme ties infrastructure, labour markets, domestic industry, and strategic investment into a more durable production settlement that can be felt beyond Washington."
 USA_The_Latticework_Alliance:0 "The Latticework Alliance"
 USA_The_Latticework_Alliance_desc:0 "America's alliances will be stronger if they resemble a system rather than a set of sentimental obligations. The administration will therefore weave defence coordination, technology sharing, and strategic production into a denser allied architecture."
 USA_The_American_Decade:0 "The American Decade"
 USA_The_American_Decade_desc:0 "The final objective is not a return to the vanished certainties of the old order, but the construction of a decade in which American capacity, allied leverage, and domestic production once again move in the same direction. If the state can hold that line, history may start bending away from managed decline."