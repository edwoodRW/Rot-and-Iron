l_english:
 FRA_german_war.1.t:0 "Paris Holds Its Breath"
 FRA_german_war.1.d:0 "§gÉLYSÉE // CONSEIL DE DÉFENSE // 01:30§!\n\nThe lights in the Salon Murat had been burning since midnight. The President sat at the head of the table with a cold coffee, and around him sat the people who were supposed to know what to do. Nobody did.\n\n'Moscow has invoked the pact,' said the Foreign Minister. 'London has already answered. They expect us to follow within the day.'\n\nThe Chief of the Defence Staff shook his head slowly. 'Monsieur le Président, I must be honest. The Germans have been preparing for this for a year. We have not. Our depots are half full, our reserves are untrained, and our border fortifications exist mainly in the budget.'\n\n'You are saying we cannot fight.'\n\n'I am saying we cannot fight today. Give me three months and I might say something different. If Berlin wins quickly, Paris is next. If Berlin is bogged down in the east, we can choose our moment.'\n\nThe President looked out of the window at the dark courtyard. 'And Moscow? What do I tell Moscow?'\n\n'Tell them,' said the Foreign Minister, with the faintest smile, 'that France is consulting her allies. It is the oldest sentence in diplomacy. It buys a month.'\n\nThe President nodded once. The communique went out at dawn. It said very little, and it said it beautifully.\n\n§Y\"A nation that is not sure it can survive does not rush to the front. It waits, and it counts.\"§!"
 FRA_german_war.1.a:0 "Consult our allies. Delay the decision."
 FRA_german_war.decision.t:0 "France Must Choose"
 FRA_german_war.decision.d:0 "§gLE MONDE // ÉDITORIAL // SIXTY DAYS ON§!\n\n§YTHE LONG PAUSE ENDS§!\n\nFor two months France has said nothing, and in the language of European politics silence is a kind of speech. The Élysée has issued bulletins about 'consultation' and 'prudence'. The army has quietly refilled its depots and moved its reserve brigades east. In the cafés, people have debated the question until even the waiters have opinions.\n\nNow the moment is upon us. Moscow is demanding an answer, and London is demanding it more loudly. The Union's ambassador has been seen at the Quai d'Orsay three times this week. German envoys, meanwhile, have been courteous, patient and, according to one minister, 'unsettlingly relaxed'.\n\nThere is a case for joining the war. A Germany that defeats the Soviet Union becomes the master of the Continent, and France has seen what happens to neighbours of such a power. There is a case for staying out. The country is tired, the army is not ready, and a conflict that began in the east could easily end on the Rhine.\n\nThe President has said he will decide by the end of the week. An old man selling newspapers near the Pont Neuf summed up the mood. 'Whatever he picks,' he said, 'it will be the wrong one. That is what makes it a decision.'\n\n§Y\"Neutrality is a decision too. It is simply the one that history forgets to blame.\"§!"
 FRA_german_war.decision.a:0 "Honour the pact. France enters the war."
 FRA_german_war.decision.b:0 "Stay out. France will watch and wait."
 ITA_german_war.1.t:0 "Rome Hesitates"
 ITA_german_war.1.d:0 "§gPALAZZO CHIGI // CABINET ROOM // 02:15§!\n\nThe news had reached Rome before the official cable. By the time the cabinet assembled, half the ministers had already read the reports on their phones, and the other half were pretending they hadn't.\n\n'The Soviets have called on us,' the Prime Minister said. 'The pact is clear on the point. We are expected to join.'\n\nThe Defence Minister, a heavy, careful man, folded his hands. 'We are expected to do many things. I should like to know whether any of them are possible.'\n\n'Explain.'\n\n'The fleet can hold the Mediterranean for a month. The army can hold the Alpine passes for rather less. Our factories cannot replace what we lose. If Germany turns its full weight on us, we survive weeks, not years.'\n\nThe Foreign Minister leaned forward. 'Then we say nothing, and we call it prudence. The Soviets are far away. The Germans are near. And in a long war, the man who arrives last is often the man who arrives on the winning side.'\n\nAn older minister at the end of the table murmured something about honour. Nobody answered him. It was not that they disagreed. It was that nobody could afford to.\n\nThe Prime Minister rubbed his eyes. 'Then it is agreed. Italy is still considering its obligations. We shall let them consider for some time.'\n\n§Y\"Rome has survived by knowing when not to march.\"§!"
 ITA_german_war.1.a:0 "Italy is still considering its obligations."
 ITA_german_war.decision.t:0 "Italy Must Choose"
 ITA_german_war.decision.d:0 "§gLA REPUBBLICA // PRIMA PAGINA§!\n\n§YROME'S HOUR OF DECISION§!\n\nROME - It has been over three months, and the Italian government has still not said whether it will join the war. In Rome, the strain is beginning to show. Ministers have grown pale and short-tempered. The Soviet ambassador has stopped bothering to hide his impatience.\n\nThe delay has not been wasted. Factories in Turin and Milan have been working double shifts. The fleet has been refitted at Taranto. The army has quietly moved three divisions to the northern frontier. Whatever Italy decides, it will not decide unprepared.\n\nThe case for joining is simple. The alliance with Moscow and London is the foundation of Italian security, and a Germany that wins without Italian blood will not feel obliged to remember Italian interests. The case against is equally simple. If Germany is as strong as everyone says, Italy has more to lose by fighting than by waiting.\n\nIn the streets, opinion is divided. A shopkeeper in Trastevere said he would prefer a hundred years of peace to a single day of glory. A veteran outside the Colosseum said that a country which does not fight for its friends will find it has none.\n\nThe Prime Minister has promised an announcement this week. Rome, as always, is holding its breath.\n\n§Y\"A late ally is still an ally. A dead one is merely a memory.\"§!"
 ITA_german_war.decision.a:0 "Honour the pact. Italy enters the war."
 ITA_german_war.decision.b:0 "Stay out. Italy will watch and wait."
