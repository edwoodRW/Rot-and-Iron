l_english:
 BM_HISTORY_TITLE:0 "Brief History"
 BLITZKRIEG_NAME:0 "Fracture Point"
 BLITZKRIEG_DESC:0 "Three great victories—in 1929, 1944, and 1949—left socialist movements dominant across much of the world. Germany's decentralized revolution, the Soviet Union's centralized power, and China's independent communist movement now stand on opposing paths.\n\nIn 2026, Germany and China have opened a two-front war against the Soviet Union. Britain depends on Moscow, while Italy and Ethiopia remain tied to the Soviet bloc. The conflict threatens to redraw Europe and the wider socialist world. Beyond it, Japan and the United States weigh their own interests as revolutionary states across Latin America and Asia decide whether to intervene or stay neutral."
 ENG_BLITZKRIEG_DESC:0 "The British Empire fell in the 1999 Millennium Revolution, which established the Union of British Socialist Republics under Keir Starmer. London relies on Soviet military aid, but Scottish separatism and disputes over resources and political control strain the Union.\n\nWith Germany and China attacking Moscow, Britain's principal ally is fighting for survival. Starmer must manage shortages and internal dissent while deciding how far the republic will commit to a war that could leave it isolated if the Soviet Union falls."
 SCO_BLITZKRIEG_DESC:0 "Scotland remains a source of separatist pressure within the British socialist order. Disputes over resources, the power grid, and political control have sharpened the question of whether the Union can hold together.\n\nAs London's Soviet ally faces a two-front war, Scotland's future is tied to the choices made across Britain: accept the existing settlement, demand a new distribution of power, or press for separation while the state is under strain."
 PRC_BLITZKRIEG_DESC:0 "The Left Kuomintang's alliance with the Chinese Communist Party carried China to victory over Japan in the Second World War. A brief democratic opening in the 1940s gave way to a dictatorial communist state, followed decades later by slow democratization. Under the nationalist leadership of Bo Xilai, that progress has been reversed.\n\nChina has aligned with Germany and launched an invasion of the Soviet Union from the east. Its leaders present the campaign as a strategic opportunity, but the war risks turning China's rise into a prolonged struggle with its former communist rival."
 FRA_BLITZKRIEG_DESC:0 "France is a socialist commune governed by Pierre Laurent's orthodox faction, which maintains a veneer of democracy as opposition to its increasingly strict rule grows. The military remains furious over Germany's control of Alsace-Lorraine, while years of stagnation have weakened the country.\n\nWith Paris tied to Moscow and Germany leading the war against the Soviet Union, France faces a difficult choice between defending its alliance, challenging the government at home, or risking a confrontation it may not be ready to fight."
 GER_BLITZKRIEG_DESC:0 "Rosa Luxemburg's Spartacists seized power during the German Revolution and built a decentralized, democratic socialist republic in opposition to Moscow's bureaucratic system. Under Chancellor Stefan Liebknecht, Germany now claims a distinct path to socialism and has become a leading revolutionary power.\n\nIn 2026, Germany has joined China in a two-front invasion of the Soviet Union. Victory could reshape Eastern Europe, but the war will test Germany's ideals and determine whether its revolutionary model can survive the consequences of its own expansion."
 CAN_BLITZKRIEG_DESC:0 "Canada became the refuge of the British monarchy and imperial loyalists after the 1999 Millennium Revolution. Prime Minister Conrad Black's national-conservative government maintains a thin parliamentary veneer while a narrow oligarchy holds power.\n\nThe Dominion watches an increasingly uncertain United States and suppresses dissent at home. The Soviet Union's war against Germany and China threatens to shift the balance of power that has helped Canada preserve its position—and the old imperial order it represents."
 SOV_BLITZKRIEG_DESC:0 "The Soviet Union, once the world's foremost communist power, is now led by Valery Rashkin and under pressure on two fronts. Germany's revolutionary republic and China have invaded from west and east, exposing the weakness of Soviet logistics and the deep divisions inside the state.\n\nMoscow's allies, including Britain, Italy, and Ethiopia, depend on the Union's survival. If the front collapses, the consequences will reach far beyond Soviet borders and determine which vision of socialism dominates the postwar world."
 USA_BLITZKRIEG_DESC:0 "The 1934 Business Plot ushered in decades of military-corporate dominance in the United States. The 2008 crash triggered a socialist revolution, bringing the Democratic Socialist Party to power, first through a cautious coalition. Nina Turner now leads the country as it tries to move beyond the institutions that constrained it.\n\nWashington once backed Canada and Japan against the revolutionary tide; Turner's government is now drawing closer to Europe's socialist states. As Germany and China attack the Soviet Union, she must decide whether America will support the war, seek a different balance, or turn its attention toward home."
 OTHER_BLITZKRIEG_DESC:0 "The world order has been transformed by successive socialist revolutions and the collapse of old empires. From the British Millennium Revolution to the Latin American Spring, new states have emerged with sharply different ideas about democracy, central authority, and the meaning of socialism.\n\nGermany and China are now at war with the Soviet Union, while smaller nations weigh alliances, neutrality, and survival. The decisions made in 2026 will shape not only who wins the war, but what kind of world follows it."
 DEN_GATHERING_STORM_DESC:0 "Denmark sits at the crossroads of Scandinavia and Europe, a prosperous EU member state grappling with the same populist undercurrents that have reshaped its larger neighbours. North Sea oil reserves offer Copenhagen new economic leverage, but also new dilemmas.\n\nAs the monarchy remains a beloved institution and urban modernisation reshapes Danish society, the question facing Denmark is whether it can maintain its Nordic model in an era of rising nationalism - or whether it, too, will be swept up in the continental tide."
 ETH_GATHERING_STORM_DESC:0 "Ethiopia, Africa's second-most populous nation, is rebuilding in the shadow of civil war. Prime Minister Abiy Ahmed's Prosperity Party governs a deeply fractured country where ethnic tensions between Tigray, Oromo, and Amhara communities threaten to reignite at any moment.\n\nAs a member of the African Union, headquartered in its own capital, Ethiopia harbours ambitions of pan-African leadership. But first, it must heal the wounds within. The choices made in Addis Ababa will determine whether Ethiopia rises as a continental power or collapses under the weight of its own divisions."
 FIN_GATHERING_STORM_DESC:0 "Finland has taken a sharp rightward turn. The Finns Party, once dismissed as a fringe protest movement, now leads the government in Helsinki, echoing the populist wave rolling across Europe.\n\nAs an EU member sharing one of the longest borders in Europe with Russia, Finland's historic neutrality is under unprecedented strain. With the spectre of Russian aggression looming to the east, Helsinki must decide: cling to neutrality, or become the David that dares to face Goliath?"
 ICE_GATHERING_STORM_DESC:0 "Iceland, the remote island republic in the North Atlantic, finds itself at an unexpected crossroads. Long content to exist on the periphery of European affairs, the shifting geopolitical landscape has forced Reykjavik to confront fundamental questions about its future.\n\nShould Iceland approach the European Union and seek the shelter of continental integration? Should it militarise for the first time in its modern history? Or should it leave NATO entirely and chart its own course? For a nation of barely 400,000, the stakes have never been higher."
 ITA_GATHERING_STORM_DESC:0 "Giorgia Meloni's Fratelli d'Italia governs a nation of contradictions. Italy, the cradle of European civilisation, is plagued by endemic corruption, organised crime, and a stagnant economy, yet its people carry an irrepressible ambition that has endured since the days of Rome.\n\nAs an EU member with a seat at the G7 table, Italy's rightward shift has sent ripples across Brussels. Meloni must choose: confront the mafia and corruption that rot the state from within, pursue a dramatic Italexit from the European project, or look to the ancient past for inspiration and forge a new Mediterranean destiny."
 NOR_GATHERING_STORM_DESC:0 "Norway, one of the world's wealthiest nations per capita, stands defiantly outside the European Union while remaining a key NATO ally. The country's vast oil wealth has built the world's largest sovereign wealth fund, but the political landscape is shifting beneath the surface.\n\nThe question of EU membership refuses to die, the royal family's future stirs public debate, and whispers of a renewed Scandinavian union with Sweden grow louder. Norway must decide whether to remain an isolated Nordic powerhouse or embrace a larger role on the European stage."
 SWE_GATHERING_STORM_DESC:0 "Sweden, once the poster child of progressive social democracy, has seen its political landscape transformed. The Sweden Democrats, long treated as outcasts, have surged to prominence on a platform of immigration control and northern nationalism.\n\nAs an EU member grappling with the consequences of decades of open-border policies, Sweden faces an identity crisis. The old Swedish model, generous welfare, international solidarity, strict neutrality, is under siege. Whether Sweden doubles down on its traditions or embraces a more inward-looking nationalism will shape Scandinavia for decades to come."
 SWI_GATHERING_STORM_DESC:0 "Switzerland, the eternal neutral, finds its centuries-old political model under unprecedented pressure. The Swiss system of direct democracy and consensus government has long been the envy of the world, but the forces reshaping Europe are testing even the Alpine republic's legendary stability.\n\nJoining the United Nations, abandoning neutrality, or even the dissolution of the confederation itself - options once unthinkable are now topics of serious debate. As the world around it convulses, Switzerland must decide whether its splendid isolation remains a strength or has become a fatal vulnerability."
 JAP_BLITZKRIEG_DESC:0 "Japan emerged from the upheavals of the twentieth century as a nationalist, monarchist state, wary of both Moscow and Beijing.\n\nAs Germany and China march on the Soviet Union, Tokyo must decide whether the war is an opportunity to reclaim lost influence in Asia or a trap that will leave Japan exposed."
 ITA_BLITZKRIEG_DESC:0 "Italy lives under a communist government led by Marco Rizzo, uneasy at the prospect of a Germany strong enough to dominate the continent.\n\nRome has watched the war in the east begin with caution. Whether to stand with Moscow, bargain with Berlin or stay out of the fighting is a question that could define the republic's future."
 BRA_BLITZKRIEG_DESC:0 "Brazil is the dominant power of South America, governed by a conservative monarchist order that has kept its distance from the great ideological blocs.\n\nWith war raging across Eurasia, Brasília can trade with every side, or choose the moment to project its influence beyond the continent."
 AST_BLITZKRIEG_DESC:0 "Australia is a stable democracy at the edge of a world in turmoil, aligned by history and trade with neither Moscow nor Berlin.\n\nAs the Pacific grows tense, Canberra must weigh its security against the risk of being drawn into a war it did not choose."
 RAJ_BLITZKRIEG_DESC:0 "The British Raj survives as a socialist state led by Dipankar Bhattacharya, home to a huge population and a fragile balance of regions and parties.\n\nIndia's size gives it weight in any conflict, but it also leaves it exposed to unrest, famine and the ambitions of its neighbours."
