l_english:
 SOV_fascist_party:0 "RNU"
 SOV_fascist_party_long:0 "Russian National Unity"
 SOV_fascist_party_description:0 "An underground ultranationalist movement that emerged during the economic stagnation of the late twentieth century. Russian National Unity considers the Soviet experiment a historical catastrophe that has weakened Russian national identity and sacrificed its interests in pursuit of international revolution. The movement advocates the abolition of the Soviet Union and its replacement with an authoritarian Russian nationalist state. Despite decades of suppression by the Soviet security services, the organisation has attracted a small following amongst disillusioned veterans and political extremists."
 SOV_nationalist_party:0 "NSP"
 SOV_nationalist_party_description:0 "The National Salvation Party argues that Moscow can no longer afford to maintain an increasingly unstable multinational union. Its members believe that decades of economic mismanagement and political concessions have weakened the Russian people. Unlike the more radical Russian National Unity, the NSP is willing to maintain diplomatic and economic relationships with former Soviet republics, provided Russian interests remain protected. The party represents those who believe that Russia's survival is more important than the survival of communism"
 SOV_monarchist_party:0 "RIM"
 SOV_monarchist_party_long:0 "Russian Imperial Movement"
 SOV_monarchist_party_description:0 "For more than a century, monarchism has survived in the Soviet Union through underground organisations, religious communities and Russian émigré families. The Russian Imperial Movement seeks to restore the historic institutions of the Russian state, including the monarchy and the influence of the Orthodox Church. Its members are divided between constitutional monarchists who favour parliamentary government and traditionalists who seek the restoration of imperial authority. The collapse of Soviet legitimacy has presented the movement with its greatest opportunity since the Russian Civil War."
 SOV_national_bolshevik_party:0 "NBF"
 SOV_national_bolshevik_party_long:0 "National Bolshevik Front"
 SOV_national_bolshevik_party_description:0 "The National Bolshevik Front emerged from the growing frustration of Soviet hardliners who believed the Communist Party had become too bureaucratic, internationally submissive and disconnected from national interests. Combining state socialism with Russian nationalism, the movement advocates a highly centralised economy, extensive military mobilisation and the strengthening of Russian cultural identity. The NBF considers both German democratic socialism and Rashkin's stagnant orthodox communism to be failures. It seeks to transform the Soviet Union into a militarised, nationalist socialist state."
 SOV_national_conservative_party:0 "PSU"
 SOV_national_conservative_party_long:0 "Patriotic Union of the Soviet Peoples"
 SOV_national_conservative_party_description:0 "Popular amongst military officers, veterans and patriotic citizens. Its members are less concerned with Marxist ideology than preserving Soviet territorial integrity and restoring the country's military strength."
 SOV_centrist_party:0 "URP"
 SOV_centrist_party_long:0 "Union Renewal Party"
 SOV_centrist_party_description:0 "A movement of economists, engineers, scientists, regional administrators and former CPSU officials who believe decades of ideological infighting have ruined the country."
 SOV_liberal_party:0 "DUS"
 SOV_liberal_party_long:0 "Democratic Union of Soviets"
 SOV_liberal_party_description:0 "The Democratic Union of Soviets is a coalition of civil rights activists, independent journalists, academics, lawyers and political dissidents who seek to end the Communist Party's monopoly on political power. The movement supports free elections, an independent judiciary, freedom of speech and the introduction of a competitive market economy. Unlike Russian nationalist movements, the DUS believes that the Soviet republics could remain united through a voluntary democratic federation. However, it supports the right of individual republics to determine their own futures through referendums. The German aggression has divided the movement between those who view Berlin as a potential liberator and those who believe democracy cannot be established through foreign occupation"
 SOV_social_democrat_party:0 "SDPU"
 SOV_social_democrat_party_long:0 "Social Democratic Party of the Union"
 SOV_social_democrat_party_description:0 "The Social Democratic Party of the Union seeks to establish a democratic society whilst preserving the most successful achievements of the Soviet system, including universal healthcare, public education, workers rights and affordable housing. It advocates a mixed economy in which private enterprise operates alongside publicly owned essential industries. The party has developed a following amongst trade unions, public sector workers, younger generations and moderate Communist Party members who have become disillusioned with Rashkin's leadership. It strongly opposes the German aggression on the border but believes that meaningful democratisation could create the conditions for a negotiated peace"
 SOV_moderate_socialist_party:0 "MSP"
 SOV_moderate_socialist_party_long:0 "Movement for Socialist Progress"
 SOV_moderate_socialist_party_description:0 "A growing movement amongst younger citizens, academics, technology professionals and reformist party officials. It admires the modern socialist economic model developed in Germany but opposes German military intervention."
 SOV_revolutionary_socialist_party:0 "RCI"
 SOV_revolutionary_socialist_party_long:0 "Revolutionary Communist International"
 SOV_revolutionary_socialist_party_description:0 "Believes that the Soviet Union has betrayed the legacy of Leon Trotsky. It demands the restoration of workers councils, revolutionary democracy and international socialism."
 SOV_communist_party:0 "CPSU"
 SOV_communist_party_long:0 "Communist Party of the Soviet Union"
 SOV_communist_party_description:0 "The ruling establishment that has governed the Soviet Union for over a century. Increasingly divided between hardliners, military officials and ageing bureaucrats, it sees political reform as a threat to the survival of the state"
 SOV_islamist_party:0 "IMJ"
 SOV_islamist_party_long:0 "Islamic Movement for Justice"
 SOV_islamist_party_description:0 "The Islamic Movement for Justice developed amongst religious communities throughout the Soviet Union, particularly in Central Asia and the Caucasus, in response to decades of restrictions on religious expression and regional autonomy. The movement demands greater religious freedom, political representation and the recognition of Islamic cultural institutions. Its membership is divided between moderates seeking religious rights within a decentralised Soviet federation and more radical factions advocating independent states governed according to their interpretation of Islamic principles. The weakening of Moscow's authority and the Chinese invasion of Central Asia have created new opportunities for the movement to expand its influence."







