l_english:
 ENG_restored.1.t: "The King Comes Home"
 ENG_restored.1.d: "§IBuckingham Palace, London - Late Afternoon§!\n\nThe gates open slowly.\n\nFor a generation, the palace has existed in photographs, schoolbook arguments, and the dim rooms of exile associations in Ottawa and Halifax. Now the car turns through the forecourt beneath a sky the colour of old silver, and the King steps out onto English ground.\n\nThe crowd beyond the railings is not one crowd. Some cheer until their voices disappear. Some stand in silence. A group of young republicans hold a banner that the police have allowed them to keep: §INo One Is Born to Rule§!. An old man beside them removes his hat and begins to cry.\n\nInside, Rees-Mogg waits in the State Entrance. He bows deeply. For once, he has no prepared sentence.\n\nThe King looks through the open doors toward the city. The blackened buildings. The Canadian vehicles still standing at the edge of the Mall. The flags that have been raised too quickly and the flags that have not yet been lowered.\n\n§R\"Is it still Britain?\"§! he asks.\n\nRees-Mogg looks at him.\n\n§R\"It is trying to be, Your Majesty.\"§!\n\nThat evening, the King addresses the nation. He does not promise a return to the past. He promises service, restraint, and a country in which the Crown must again earn the right to be heard.\n\nLondon listens."
 ENG_restored.1.a: "Long live the King."

 ENG_restored.2.t: "The Constitution Is Ratified"
 ENG_restored.2.d: "§IWestminster Hall, London - Election Day§!\n\nThe queue begins before sunrise.\n\nIt runs past the battered walls of Parliament, around the statue of Cromwell, and into streets where people have spent decades being told that politics was something done to them by men behind closed doors. Some voters are old enough to remember the last free ballot. Others have never held one before.\n\nAt every polling station, observers sit beside local volunteers. Monarchists hand out leaflets beside republicans. Formerly banned parties argue over tax, housing, the war, and every old wound that has returned to the surface. Nobody agrees on what Britain ought to become. That is the point.\n\nBy midnight, the constitutional result is clear. The new order will rest on an elected Parliament, protected rights, and a government that can be removed without another revolution.\n\nBoris watches the declaration from the gallery of the Commons. The chamber rises around him, applauding itself, applauding the voters, perhaps applauding the sheer fact that the argument has not ended in gunfire.\n\n§R\"They chose,\"§! he says quietly.\n\nOutside, a woman folds her ballot stub into her wallet. She intends to keep it."
 ENG_restored.2.a: "The country has spoken."

 ENG_restored.3.t: "The London Compact"
 ENG_restored.3.d: "§IThe Foreign Office, London - Midnight§!\n\nThe agreement is not elegant. It has been negotiated sentence by sentence between British civil servants, Canadian administrators, trade union representatives, judges, and politicians who dislike one another too much to call this a celebration.\n\nCanada retains a limited security mission. Britain receives a timetable for full control of its courts, ministries, and armed forces. Emergency powers expire on fixed dates. Elections are promised, but not yet held.\n\nBoris signs first. Then Black, joining by secure line from Ottawa. Finally, the British delegates place their names beneath the title: §IThe London Compact.§!\n\nA reporter asks whether this makes Britain free.\n\nBoris takes longer than usual to answer.\n\n§R\"It makes Britain responsible,\"§! he says. §R\"Freedom is the work that follows.\"§!\n\nThe cameras flash. Outside, the city is still under curfew. But for the first time, the end of it has a date."
 ENG_restored.3.a: "A bridge, not a permanent occupation."

 ENG_restored.4.t: "The Union in Practice"
 ENG_restored.4.d: "§IEdinburgh, The First Joint Parliament§!\n\nThe new chamber is crowded with two sets of expectations. Scottish members have arrived carrying the suspicion of a country that remembers every promise made in London. English members have arrived knowing, perhaps for the first time, that the Union cannot survive by assuming Scotland will endure whatever Westminster decides.\n\nThe first bill is deliberately ordinary: transport funding, shared energy planning, a guarantee for the Scottish Parliament. It is not a declaration of empire. It is a test.\n\nA Scottish member rises to speak.\n\n§R\"We did not return to be absorbed,\"§! she says. §R\"We returned because this agreement says we remain ourselves. We will hold you to it.\"§!\n\nThe hall is quiet. Then the measure passes, not unanimously, but clearly.\n\nOutside, rain moves across the old city. The Union has no coronation, no triumphant march. It has committees, votes, and the difficult discipline of treating consent as something that must be renewed."
 ENG_restored.4.a: "Let the guarantees mean something."

 ENG_restored.5.t: "Two Nations, One Island"
 ENG_restored.5.d: "§IBerwick-upon-Tweed, The Border Crossing§!\n\nThe new signs have been installed overnight.\n\nThey do not announce a frontier in the language of checkpoints or suspicion. They list trade rules, travel arrangements, emergency telephone numbers, and the names of the two governments that have agreed not to turn an old border into a new wound.\n\nA Scottish minister and an English minister meet in the rain for photographs neither enjoys. Behind them, lorries begin crossing in both directions. The first carries machine parts north. The second carries whisky south.\n\n§R\"This is not the Union,\"§! the Scottish minister says.\n\n§R\"No,\"§! her English counterpart replies. §R\"It is what comes after refusing to make the same mistake again.\"§!\n\nThe cameras record the handshake. Neither government has surrendered its flag. Neither has won the argument forever. But the road is open, and for now that is enough."
 ENG_restored.5.a: "Peace between neighbours."

 ENG_restored.6.t: "The Crown Learns Restraint"
 ENG_restored.6.d: "§IManchester, A Wet November Morning§!\n\nThe King arrives without a carriage.\n\nThere is still a police cordon, still a small crowd, still the awkwardness that follows any royal visit after twenty-seven years of absence. But there are no proclamations to read and no portraits being unveiled. He has come to open a rebuilt engineering works, to meet apprentices, and to spend an afternoon listening to people who have no reason to tell him what he wants to hear.\n\nA woman in the crowd asks whether the Crown means that England will go backwards. The King's private secretary moves to intervene. The King raises a hand.\n\n§R\"No,\"§! he says. §R\"It means that I have returned to serve a country that has changed without me.\"§!\n\nThe answer appears in every evening paper. Some mock it. Others distrust it. But by the next morning, the question being asked is no longer whether the Crown can command Britain. It is whether it can learn to belong to it."
 ENG_restored.6.a: "The Crown serves the country."

 ENG_restored.7.t: "The Habit of Being Asked"
 ENG_restored.7.d: "§ILeeds Town Hall, Election Night§!\n\nThe counting hall is noisy, exhausted, and almost painfully ordinary.\n\nCandidates argue over margins. Volunteers drink bad coffee. A television crew waits for a recount that will decide one seat in a Parliament large enough to survive without it. Nobody has been arrested. Nobody has declared an emergency. Nobody has asked the army to settle the result.\n\nNear midnight, an elderly man leaves the queue at the counting desk and pauses beneath the new constitutional noticeboard. He tells a reporter that he voted in the last free election before the Revolution.\n\n§R\"I forgot what it felt like,\"§! he says. §R\"Not choosing who wins. Just knowing they have to ask.\"§!\n\nThe remark travels further than any speech from Westminster. Britain is still divided, still poor in places, still haunted by the war. But the vote has become an institution again, and institutions are built by surviving their first difficult night."
 ENG_restored.7.a: "Let the argument continue."

 ENG_restored.8.t: "The Last Canadian Convoy"
 ENG_restored.8.d: "§IPortsmouth, Dawn§!\n\nThe final Canadian convoy leaves without a band.\n\nThe docks are crowded with British workers, Canadian service personnel, diplomats, and people who have come because they feel they ought to witness the end of an occupation that was never allowed to call itself one. Crates are loaded. Security offices are closed. A Canadian officer hands the keys to a British harbour official and salutes.\n\nFor a moment, neither knows what to say.\n\n§R\"You gave us time,\"§! the official says.\n\nThe officer looks toward the ships.\n\n§R\"Make good use of it.\"§!\n\nAs the convoy moves into the Channel, a crowd begins to clap. It is not applause for departure alone. It is applause for the dangerous idea that Britain can now stand without a guardian - and that Canada can leave without becoming an enemy."
 ENG_restored.8.a: "Britain governs itself."

 ENG_restored.9.t: "The Federal Offer"
 ENG_restored.9.d: "§IEdinburgh, Scottish Parliament - Evening§!\n\nThe offer from London is not a demand. That is what makes it difficult.\n\nIt promises a Scottish Parliament with protected powers, a written division of authority, and a federal chamber in which Scotland cannot be reduced to a voting bloc that Westminster remembers only during a crisis. It asks Scotland to rejoin a state that has changed, or claims to have changed, without asking it to forget why it left.\n\nThe chamber divides along lines that do not match the old parties. Some see an opportunity to make the Union safe at last. Others see a new language for an old habit. Outside, the square fills with both Union flags and Saltires, neither side able to claim the evening as its own.\n\nThe First Minister closes the draft and looks around the room.\n\n§R\"The question is not whether England has changed,\"§! she says. §R\"The question is whether Scotland has enough power to make sure it stays changed.\"§!"
 ENG_restored.9.a: "A federal Union can protect Scotland."
 ENG_restored.9.b: "Independence is the safer guarantee."

 ENG_restored.10.t: "The Federal Union"
 ENG_restored.10.d: "§IWestminster Hall, London - Ratification Day§!\n\nThe treaty is read in two voices.\n\nThe English text is spoken first, then the Scottish. Each clause is repeated: the Parliament in Edinburgh, the federal division of powers, the protections for law and education, the promise that no government may dissolve the settlement without the consent of both nations.\n\nWhen the final signatures are placed on the document, there is applause, but it is not triumphant. Too much history stands in the room for triumph.\n\nA Scottish delegate turns to the English Prime Minister.\n\n§R\"This is not a return,\"§! she says. §R\"It is a beginning, and we will know the difference.\"§!\n\nOutside, the bells of Westminster and Edinburgh ring on the same afternoon. The Union has been remade not by conquest, nor by nostalgia, but by a vote that either country was free to refuse."
 ENG_restored.10.a: "A union built on consent."
