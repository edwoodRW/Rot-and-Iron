l_english:
 GER_allies.france_responds.t:0 "Paris Answers"
 GER_allies.france_responds.d:0 "§gLE MONDE // INTERNATIONAL // FRONT PAGE§!\n\n§YA HANDSHAKE, A SMILE, AND A NEW ERA?§!\n\nPARIS - The photographs will be in every school textbook within the year. On the steps of the Élysée, the French President and the German Chancellor clasped hands for exactly eleven seconds, which one cameraman, who counted, described as 'two seconds longer than protocol required and three seconds shorter than history deserves'.\n\nThe agreement itself is less dramatic than the pictures. It consists of a joint declaration on defence cooperation, a promise of shared intelligence, and an understanding, expressed with the usual Gallic elegance, that neither country will be surprised by the other. Observers describe it as a cautious step forward, though in the context of a century of mutual suspicion, a cautious step is an impressive thing.\n\nIt was not universally welcomed. Opposition leaders in both capitals complained that the deal had been struck without sufficient consultation. A veteran French columnist wrote that she 'did not trust a pact signed under television lights'. In Berlin, hard-liners warned of entanglement.\n\nBut the mood on the boulevards was warmer than the commentary. At a café near the Place de la République, an elderly man was heard telling his granddaughter that he had never thought he would live to see the day. 'Nor did I,' she replied. 'But here we are.'\n\n§Y\"Old enemies make the most loyal allies, if only because they remember why they became enemies.\"§!"
 GER_allies.france_responds.a:0 "Embrace the partnership. Joint planning begins."
 GER_allies.france_responds.b:0 "Keep it ceremonial. No binding commitments."
 GER_allies.western_front.t:0 "A Second Front"
 GER_allies.western_front.d:0 "§gEMERGENCY SESSION // JOINT STAFF // TRANSCRIPT§!\n\n'Gentlemen, let me summarise our position. The Soviet advance has stalled in the east. We have air superiority and a growing logistical advantage. And now, as of this morning, the Western allies have agreed to open a second line of pressure on the Soviet flank. I want to hear objections before we proceed.'\n\n'None, General. But I want it on the record that the coordination will be difficult. Three armies, three languages, four time zones. There will be mistakes.'\n\n'Noted. How bad?'\n\n'Bad enough that someone will be shot at by their own side, and good enough that nobody will remember by Christmas.' A pause. 'I say that with affection.'\n\nLaughter, brief and uneasy. At the end of the table, the liaison from the French staff raised a hand. 'If I may, mon Général. The moral effect of this will be considerable. The Soviets believe they are fighting a single enemy. They will soon learn otherwise.'\n\n'Then let us make sure they learn it quickly.' The general stood, buttoned his jacket, and looked at the map on the wall. A thin red line ran across it, unbroken, from the Baltic to the Black Sea. 'It is a long front. We shall make it longer.'\n\n§Y\"Armies march on their stomachs. Alliances march on their trust.\"§!"
 GER_allies.western_front.a:0 "Coordinate the offensive. Hit them from both sides."
 GER_allies.china_responds.t:0 "A Message From Beijing"
 GER_allies.china_responds.d:0 "§gXINHUA // INTERNATIONAL DESK // TRANSLATED EXTRACT§!\n\n§YCHINESE FOREIGN MINISTRY: 'WE OBSERVE THE SITUATION WITH GRAVE CONCERN'§!\n\nBEIJING - In a statement carefully balanced between concern and calculation, the Foreign Ministry of the People's Republic today addressed the ongoing conflict in Eastern Europe. 'China has always advocated peaceful resolution of disputes,' the spokesperson said. 'We call on all parties to exercise restraint.'\n\nThose familiar with the language of Chinese diplomacy will recognise it for what it is: a door left carefully ajar. Behind closed doors, according to officials in two European capitals, Beijing's envoys have been unusually forthcoming. They have spoken of 'strategic convergence' and 'mutual interest in stability'. They have mentioned, in passing, that certain industrial shipments might be expedited.\n\nThe subtext is unmistakable. China has no particular love for Berlin, nor any fondness for Moscow. But it has an unerring instinct for the winning side, and a long-standing preference for waiting until it knows which that is. The question being asked in every chancery is whether the moment has arrived.\n\nA senior analyst at a Shanghai think tank offered an old proverb. 'When two tigers fight,' he said, 'the wise man sits on the mountain and watches.' When asked which tiger he expected to win, he smiled. 'The one who remembers to feed the man on the mountain.'\n\n§Y\"Patience is not weakness. It is the strategy of those who intend to outlast.\"§!"
 GER_allies.china_responds.a:0 "Welcome Beijing's support, and its trade."
 GER_allies.china_responds.b:0 "Request military advisors and shared doctrine."
 GER_allies.grand_coalition.t:0 "The Grand Coalition"
 GER_allies.grand_coalition.d:0 "§gSUMMIT COMMUNIQUE // BERLIN // FOR IMMEDIATE RELEASE§!\n\nIt was the largest gathering of heads of state the city had seen in a generation. Motorcades blocked the Unter den Linden for most of the afternoon. Helicopters circled overhead. On the steps of the Reichstag, flags of eleven nations hung in the wind, and for a moment even the skeptics fell silent.\n\nInside, the talks were long and sometimes bitter. There were disputes about command structure, quarrels over who should supply what, and a memorable shouting match between two defence ministers that was, mercifully, not recorded. At one stage the translator for the French delegation reportedly put down her headset and refused to continue until someone apologised.\n\nBut when the doors opened, there was a joint declaration. It was a short document, as such things go, and its language was formal. The signatories pledged their full cooperation 'in the pursuit of a just and lasting settlement'. They agreed to share intelligence, to coordinate logistics and to maintain a unified political front.\n\nThe Chancellor spoke last. 'We did not choose this alliance because it was easy,' he said. 'We chose it because it was necessary. History will decide whether we were right.' Then, with a rare glint of humour: 'It will probably also decide who gets the blame for the catering.'\n\n§Y\"Alliances are not built in peace. They are forged in the certainty that no one can win alone.\"§!"
 GER_allies.grand_coalition.a:0 "Forge a unified command. Victory demands it."
 GER_allies.grand_coalition.b:0 "Keep the coalition loose. Let each nation lead its own front."
 GER_politics.brandt_prewar_warning.t:0 "Brandt's Warning"
 GER_politics.brandt_prewar_warning.d:0 "§gLEAKED TRANSCRIPT // RÄTEPARTEI CONGRESS // CLOSED SESSION§!\n\n[Applause.]\n\nELSA BRANDT: Thank you. Please, sit. I will be brief, because I have not been given long.\n\nI want to speak plainly. The Chancellor is preparing for war. He will not say so, and his ministers will deny it, but the evidence is in every ministry corridor, every factory order and every cancelled holiday. They have a plan. They have a timetable. They have everything except the consent of the people who will be asked to carry it out.\n\n[Murmurs.]\n\nI say this not because I think the war is certain, or even because I think it is wrong. I say it because I have sat in the cabinet room, and I have watched decisions being made in a hurry by tired men who would rather be told they are right than be shown they are mistaken. The question is not whether Germany should defend itself. The question is whether Germany is being led or driven.\n\n[Voice from the floor: 'Which is it?']\n\nI do not know. That is what frightens me. And I tell you now, before the first shot, so that no one can say afterwards that they were not warned.\n\n[Sustained applause.]\n\n§Y\"A prophet is only ever right when it is too late to matter.\"§!"
 GER_politics.brandt_prewar_warning.a:0 "Hear her out. The party should not be silenced."
 GER_politics.brandt_prewar_warning.b:0 "Dismiss it as alarmism. The Chancellor knows best."
 GER_politics.brandt_response.t:0 "The Chancellor Answers"
 GER_politics.brandt_response.d:0 "§gPRESS CONFERENCE // CHANCELLERY BRIEFING ROOM // 14:00§!\n\nThe questions had been coming for an hour, and the Chancellor had answered most of them with the patience of a man who has already given his answer. Then a reporter from a small left-wing paper stood and asked the one he had been waiting for.\n\n'Herr Chancellor, Elsa Brandt says you are driving this country to war. How do you respond?'\n\nThe room went quiet. The Chancellor looked at the reporter, then at the ceiling, then at the lectern, as if searching for something he had mislaid.\n\n'I have great respect for Frau Brandt,' he said at last. 'She is sincere, she is intelligent, and she has never once been dishonest with me. I wish I could say the same of everyone in this room.' A ripple of nervous laughter. 'She is also wrong. Not in her principles. In her timing.'\n\nHe paused. 'Peace is not an absence of risk. It is a decision to bear a smaller risk now rather than a larger one later. If Frau Brandt can show me a way of doing that without this government's plan, I will listen. But I will not be lectured by someone who has not had to sign the order.'\n\nHe took a sip of water. 'Next question.'\n\n§Y\"A leader's duty is not to be loved. It is to be right, and to be brave about it.\"§!"
 GER_politics.brandt_response.a:0 "Hold the line. Stand by the Chancellor."
 GER_politics.brandt_response.b:0 "Quietly reach out to Brandt. Keep her close."
 GER_politics.brandt_takes_power.t:0 "Brandt Takes the Chair"
 GER_politics.brandt_takes_power.d:0 "§gTHE INDEPENDENT // BREAKING NEWS // BERLIN§!\n\n§YLIEBICH OUT: BRANDT TO FORM NEW GOVERNMENT AS WAR TURNS§!\n\nBERLIN - In a development that stunned even veteran political observers, Chancellor Liebich resigned his office shortly before midnight and recommended Elsa Brandt as his successor. The Bundestag confirmed her within the hour.\n\nSources close to the former Chancellor describe the decision as personal rather than political. 'He was exhausted,' said one aide. 'The war had become something he no longer recognised. He said he wanted to hand the country to someone who still believed it could be stopped.'\n\nBrandt, who spent much of the past year warning of the dangers of escalation, accepted the office in a short statement delivered in front of the Reichstag. 'I did not seek this,' she said. 'I have no illusions about what it means. But I will not run from it.' She then announced an immediate review of every military commitment the previous government had made.\n\nReaction was swift. Markets wobbled and recovered. Western capitals issued carefully worded statements. In Moscow, officials reportedly greeted the news with a mixture of relief and suspicion. A senior Soviet diplomat declined to comment, but was seen leaving his embassy with an unusual spring in his step.\n\nIn the streets of Berlin, the crowd that gathered outside the Chancellery was quiet. They had not come to celebrate. They had come to see whether someone would finally say it was over.\n\n§Y\"Some leaders end wars. Others only end themselves. The wise know which they are.\"§!"
 GER_politics.brandt_takes_power.a:0 "A new chapter begins."
 GER_politics.ceasefire_opened.t:0 "A Door Opens"
 GER_politics.ceasefire_opened.d:0 "§gSECURE LINE // CHANCELLERY TO MOSCOW // INTERCEPT TRANSCRIPT§!\n\nBRANDT: Can you hear me? The line is poor.\n\nVOICE (SOVIET): We can hear you, Chancellor. Go ahead.\n\nBRANDT: I will be short. I am not calling to surrender, and I am not calling to threaten. I am calling because it is four in the morning, and I have just read a casualty report that I do not want to read again.\n\nVOICE: You surprise us. We had expected a speech.\n\nBRANDT: I have given enough speeches. What I want to know is this. If I stopped our advance tomorrow, tonight, within the hour, what would you do?\n\nVOICE: That is a very large question.\n\nBRANDT: It is. Which is why I am asking it directly, and not through an intermediary who will smile and say nothing.\n\nA long silence. Static. Somewhere in the background, a clock ticking.\n\nVOICE: We would be prepared to talk. Not to promise. To talk.\n\nBRANDT: That will do. For now, that will do.\n\nThe line went dead. Brandt placed the receiver down very gently, as though it might wake someone.\n\n§Y\"The war ends not with a bang but with two people agreeing to speak.\"§!"
 GER_politics.ceasefire_opened.a:0 "Declare a pause. Let the talking begin."
 GER_politics.ceasefire_opened.b:0 "Negotiate from strength. Keep the guns warm."
 GER_endgame.victory.t:0 "Victory in the East"
 GER_endgame.victory.d:0 "§gBREAKING // ALL NETWORKS // BERLIN§!\n\n'Good evening. Tonight, at 19:42, the Soviet High Command announced its unconditional acceptance of the terms presented by the German government. In a short statement, read in a flat voice from a prepared text, a Soviet general acknowledged that further resistance would be futile and that the war in the East was at an end.'\n\n'In the streets of Berlin, reaction was subdued at first. People stood outside shops and cafés, staring at the screens. Then, slowly, a murmur began. It spread through Potsdamer Platz, through Kreuzberg, and through the great arterial streets of the capital. By nine o'clock, it had become a roar.'\n\n'In Hamburg, church bells were ringing. In Munich, strangers embraced in the Marienplatz. In Leipzig, a group of veterans stood in silent formation outside the old railway station, medals pinned to their coats.'\n\n'The Chancellor will address the nation tomorrow morning. Tonight, however, a brief written message was released, which we read now: \"To every soldier, every worker and every citizen who gave something to this effort, I say: thank you. It is over. Come home.\"'\n\n'We will bring you more as it develops. For now, from Berlin, good night, and, for once, congratulations.'\n\n§Y\"Victory is not a feeling. It is the sudden, astonishing quiet after the noise stops.\"§!"
 GER_endgame.victory.a:0 "Germany stands victorious."
 GER_endgame.berlin_accords.t:0 "The Berlin Accords"
 GER_endgame.berlin_accords.d:0 "§gTHE SIGNING // BERLIN // OFFICIAL TRANSCRIPT§!\n\nThe hall had been chosen for its symbolism: the old Reichstag chamber, rebuilt, repainted, and filled to the rafters with delegates from thirty nations. Cameras lined the galleries. The air smelled of floor polish and nerves.\n\nAt exactly eleven o'clock, the Chancellor entered with the Soviet envoy at his side. They did not speak. They did not look at one another. They walked together to a long table at the centre of the chamber and sat, a pen set before each of them, a single document between.\n\nThe Accords themselves ran to eighty-one pages. They defined borders, set limits on armaments, established a joint commission on reparations, and created a framework for future disputes. It was the kind of document that diplomats spend years drafting and historians spend decades arguing over.\n\nThe Chancellor signed first, slowly, with a steady hand. The Soviet envoy signed second, his hand less so. A ripple of applause began in the gallery and then, as if embarrassed, died away. Nobody wanted to be the first to cheer for the end of something so costly.\n\nAfterwards, on the steps of the building, a young journalist asked the Chancellor what the feeling was. The Chancellor looked up at the grey sky for a moment. 'Tired,' came the answer. 'And, I think, very, very old.'\n\n§Y\"Peace is not the end of the story. It is only where the next chapter begins.\"§!"
 GER_endgame.berlin_accords.a:0 "Sign. Let the world be at peace."
