l_english:
 USA_prewar.1.t:0 "Sworn In"
 USA_prewar.1.d:0 "WASHINGTON, D.C. — Nina Turner was sworn in as the President of the United States on Tuesday, in a ceremony that drew a crowd the Park Service estimated at well over a million and a protest the police estimated at somewhat fewer.\n\nIn an address of just under eighteen minutes, Turner avoided the soaring language of her predecessors. 'I will not tell you that the work ahead is easy, or that it will be quick,' she said. 'I will tell you that it is necessary, and that I intend to do it in the open.' Cable commentators were divided. Some praised the candour. Others noted that the new President's first act of the day had been to order the removal of three security officials from her own detail, without explanation.\n\nOutside the Capitol, supporters waved flags and union banners. A block away, a smaller crowd gathered behind police lines, chanting that the election had been stolen. By evening, both groups had been dispersed, and the first of the new administration's executive orders had been published. Analysts expect the first months to be dominated by two questions: how much the President can accomplish before the midterms, and how much of the machinery of government is prepared to help her."
 USA_prewar.1.a:0 "Begin the work."
 USA_prewar.1.b:0 "Let the crowds see that she means it."
 USA_prewar.2.t:0 "A Quiet Warning"
 USA_prewar.2.d:0 "WASHINGTON, D.C. — A senior intelligence official has delivered a private briefing to the President in which, according to two people familiar with the meeting, concerns were raised about unusual contacts between retired military officers, wealthy donors and members of the opposition.\n\nNeither the White House nor the Agency would comment on the briefing. A spokesman said only that the President 'receives regular assessments on a wide range of subjects, as every president does.' Yet the people who attended describe a meeting that ran well past its scheduled time. One described the mood as that of 'a room where everyone has just stopped pretending.'\n\nSpeculation has begun to circulate in the capital's quieter corners. An opposition senator dismissed the reports as 'a distraction from the failures of this administration.' A former official, speaking on condition of anonymity, said simply: 'If I were the President, I would be asking who is not being asked about this.'"
 USA_prewar.2.a:0 "Take it seriously. Ask for everything."
 USA_prewar.2.b:0 "Treat it as noise, for now."
 USA_prewar.3.t:0 "Sunday Evening"
 USA_prewar.3.d:0 "WASHINGTON, D.C. — On a calm Sunday evening, the capital is, by any measure, quiet. The streets around the White House are almost empty. The Pentagon has said nothing. The networks are running their usual programming, and for the first time in weeks, no one is shouting.\n\nYet there is a feeling in the city that is hard to describe and harder to ignore. Staff in the West Wing are working late. Two senators have cancelled weekend plans. A courier, seen leaving the State Department in a hurry, declined to say where he was going. In Berlin, in Moscow, in Beijing and in London, other governments are making their own calculations, and some of them are not calm.\n\nThe President has spent eighteen months trying to repair a country that was falling apart. Whether she has done enough, and whether it will matter, is a question that will be answered sooner than anyone would like."
 USA_prewar.3.a:0 "Whatever comes, we are as ready as we can be."
