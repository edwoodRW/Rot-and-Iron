l_english:
 eurocommunism:0 "Eurocommunist"
 eurocommunism_desc:0 "A democratic, nationally rooted socialism that rejects Moscow's claim to leadership over Europe's left. It seeks public ownership and social equality through pluralist institutions, independent unions and cooperation between sovereign European movements."
 RI_GER_karl_hoffmann_desc:0 "A former general and a leading voice in the Nationaler Volksverein, Karl Hoffmann believes Germany's socialist government has allowed ideology and coalition politics to weaken national defence. His supporters admire his insistence on military readiness; his opponents fear that he would trade the republic's liberties for discipline and security."
 RI_GER_werner_dahl_desc:0 "Werner Dahl leads a small communist movement that sees Moscow, rather than Berlin, as the centre of the international revolution. Marginalised in Germany's political life, he has long argued that the Spartacist republic's independent course divides the socialist world. A Soviet victory could give his faction the influence it has been unable to win at the ballot box."
 RI_GER_rolf_eichenwald_desc:0 "Rolf Eichenwald leads the marginal German Imperial Front, a movement hostile to the socialist republic and its democratic institutions. His party's authoritarian politics have left it isolated, but its organisers hope that war and economic hardship will bring them an audience."
 RI_GER_friedrich_hagenfels_desc:0 "Friedrich Hagenfels speaks for the Kaiserliche Restauration, a nationalist movement seeking the return of a German monarchy. Unlike the House of Hohenzollern Circle, his organisation is a political campaign rather than the royal household itself. It argues that Germany needs a stronger national identity and a break with the revolutionary settlement."
 RI_GER_viktor_bredenau_desc:0 "Viktor Bredenau leads the National Revolutionary Front, a small movement that combines state socialism with nationalism. He rejects both the republic's pluralism and Moscow's claim to direct Germany's future, leaving his party at odds with the socialist government and the Soviet-aligned communists alike."
 RI_GER_sabine_leutheusser_schnarrenberger_desc:0 "In this alternate Germany, Sabine Leutheusser-Schnarrenberger leads the National Liberal Union. A defender of civil liberties, she advocates independent institutions and limits on state power. Her supporters seek to reform the republic through elections rather than discard its democratic traditions."
 RI_GER_olaf_scholz_desc:0 "In this alternate Germany, Olaf Scholz leads the Progressive Democrats, a pragmatic social-democratic opposition. His party supports public services, workers' rights and gradual reform, offering voters an alternative to Liebich's socialist government."
