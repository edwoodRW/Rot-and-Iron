l_english:
ENG_tri_party_concordat_spirit:0 "Tri-Party Concordat"
ENG_tri_party_concordat_spirit_desc:0 "A cross-party pact turns City Hall into a stable, competent coalition that shields London from national turbulence."
ENG_regulatory_safe_zone_spirit:0 "Regulatory Safe Zone"
ENG_regulatory_safe_zone_spirit_desc:0 "London guarantees predictable rules for the Square Mile, keeping capital in the city and industry humming."
ENG_green_ringfence_fund:0 "Social Resilience Fund"
ENG_green_ringfence_fund_desc:0 "Transport revenue stays in London to harden schools, homes, and infrastructure against austerity."
ENG_brussels_office_mission:0 "Brussels Liaison"
ENG_brussels_office_mission_desc:0 "A direct line to Brussels preserves market access and keeps London plugged into European innovation."
ENG_strategic_reserve_stockpiles:0 "Strategic Reserve"
ENG_strategic_reserve_stockpiles_desc:0 "Dockland warehouses become stockpiles of essentials, lowering consumption and stiffening London's resolve."
ENG_london_charter_rights:0 "London Charter of Rights"
ENG_london_charter_rights_desc:0 "A city-level bill of rights entrenches civil protections and resists outside ideological pressure."
ENG_treasury_freeze_modifier:0 "Treasury Freeze"
ENG_treasury_freeze_modifier_desc:0 "Funds to the capital are throttled; London feels the squeeze while Westminster rallies public support."
ENG_siege_city_hall_modifier:0 "Siege of City Hall"
ENG_siege_city_hall_modifier_desc:0 "Police and volunteers ring City Hall, tightening control while unrest simmers just beyond the cordon."
ENG_cordon_sanitaire_modifier:0 "Cordon Sanitaire"
ENG_cordon_sanitaire_modifier_desc:0 "A controlled perimeter slows infrastructure work but buys time to stockpile supplies and regain political leverage."
ENG_sterling_crisis:0 "The Sterling Crisis"
ENG_sterling_crisis_desc:0 "A constitutional and market panic has broken confidence in the British economy. Imports choke, capital flees, and emergency controls distort civilian production while the state struggles to reassert command."
ENG_autonomous_city_state:0 "Autonomous City-State"
ENG_autonomous_city_state_desc:0 "London has been granted special status. Stability is shored up locally, but national authority bleeds away as the capital charts its own course."
ENG_great_reckoning:0 "The Great Reckoning"
ENG_great_reckoning_desc:0 "The nation is in campaign mode. The centre frays, stability dips, but every party is clawing for power with relentless political machinery."
ENG_reform_majority_machine:0 "Reform Majority Machine"
ENG_reform_majority_machine_desc:0 "A disciplined majority operation converts electoral success into dependable parliamentary force."
ENG_county_commissioner_state:0 "County Commissioner State"
ENG_county_commissioner_state_desc:0 "Political commissioners tie local administration more closely to the national government and its priorities."
ENG_national_broadcast_discipline:0 "National Broadcast Discipline"
ENG_national_broadcast_discipline_desc:0 "The government is reshaping the communications order to keep the national conversation on friendlier ground."
ENG_compliance_bureau_state:0 "Compliance Bureau State"
ENG_compliance_bureau_state_desc:0 "A central compliance apparatus pressures institutions to execute the government's line with fewer delays and objections."
ENG_patriotic_managerial_state:0 "Patriotic Managerial State"
ENG_patriotic_managerial_state_desc:0 "Reform fuses disciplined administration with national preference, turning its mandate into a stable governing model."
ENG_reform_state_apparatus:0 "Reform State Apparatus"
ENG_reform_state_apparatus_desc:0 "The institutions of government are being recast in the image of the victorious mandate rather than left as neutral inheritances."
ENG_union_mobilization_posture:0 "Union Mobilization Posture"
ENG_union_mobilization_posture_desc:0 "Britain has shifted into a more confrontational defensive footing in response to the breakup of the union."
ENG_union_sanctions_campaign:0 "Union Sanctions Campaign"
ENG_union_sanctions_campaign_desc:0 "Westminster is trying to squeeze a breakaway Scotland economically while accepting the political and commercial costs of doing so."
ENG_union_blockade_posture:0 "Union Blockade Posture"
ENG_union_blockade_posture_desc:0 "Britain is maintaining a coercive maritime and security stance toward a reunified Ireland after the collapse of the old settlement."
ENG_eu_sanctions_regime:0 "EU Sanctions Regime"
ENG_eu_sanctions_regime_desc:0 "Britain has entered a new confrontation with Europe after refusing to accept the post-union constitutional settlement."
ENG_sanctions_market_panic:0 "Sanctions Market Panic"
ENG_sanctions_market_panic_desc:0 "Sanctions have spilled into markets, logistics, and business confidence. Imports are costlier, investors are skittish, and ordinary economic management has become far more difficult."
ENG_pro_eu_street_wave:0 "Pro-EU Street Wave"
ENG_pro_eu_street_wave_desc:0 "A visible pro-EU protest movement is blaming the government for turning constitutional crisis into economic self-harm."
ENG_managed_retreat_on_europe:0 "Managed Retreat on Europe"
ENG_managed_retreat_on_europe_desc:0 "The government is trying to lower the temperature, stabilize markets, and quietly move away from the most self-destructive edges of its own sanctions confrontation."
ENG_besieged_britain_campaign:0 "Besieged Britain Campaign"
ENG_besieged_britain_campaign_desc:0 "Farage has chosen to turn sanctions into an ongoing nationalist mobilization, accepting more instability in exchange for a sharper siege mentality at home."
