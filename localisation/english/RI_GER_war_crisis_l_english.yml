l_english:
 RI_GER_crisis.1.t:0 "The Republic at the Brink"
 RI_GER_crisis.1.d:0 "§gBUNDESTAG // EMERGENCY SESSION // BERLIN§!\n\nThe reports arrived faster than the ministers could read them. Towns that had been behind the front only days ago were now under Soviet control; roads west were crowded with families, ambulances and retreating units. Each new mark on the map brought the war closer to the heart of the republic.\n\nIn the Bundestag, the coalition that had supported Chancellor Liebich's war finally broke. Members of the Rätepartei, trade-union representatives and exhausted moderates demanded a change of government. Sahra Wagenknecht, who had warned against the campaign before the first shots were fired, was asked to lead it.\n\nHer first address offered little comfort. 'We cannot bring back the dead,' she told the chamber. 'We can decide how many more names are added to their number.' A delegation will approach Moscow, but the Soviet advance has given the Kremlin demands it had once lacked the power to make.\n\n§YThe republic survives. What it must sacrifice to keep surviving remains to be seen.§!"
 RI_GER_crisis.1.a:0 "Send the delegation. Hear Moscow's terms."
 RI_GER_crisis.2.t:0 "The Price of Peace"
 RI_GER_crisis.2.d:0 "§gCHANCELLERY // SECURE DIPLOMATIC CHANNEL§!\n\nThe Soviet reply is blunt. Moscow is prepared to end the coalition's war, but only if Germany accepts the loss of the German-owned territories now occupied by Soviet forces and their allies. Berlin itself is not included in the proposed transfer.\n\nWagenknecht lays the terms before the cabinet. For some ministers, every concession rewards the very power Germany went to war to oppose. For others, the alternative is to gamble what remains of the republic on a front that has already broken.\n\nIf the Soviet side controls at least 80% of Germany's currently owned core states while Germany still owns Berlin, Moscow will impose a communist government and divide the country. A capitulation or peace conference may occur before that threshold is reached.\n\n§YThere is no painless choice left. There is only the choice of which losses Germany is prepared to risk.§!"
 RI_GER_crisis.2.a:0 "Accept the terms. End the coalition's war."
 RI_GER_crisis.2.b:0 "Reject them. Germany will fight on."
 RI_GER_crisis.2.c:0 "The situation has changed."
 RI_GER_crisis.3.t:0 "A Government Under Supervision"
 RI_GER_crisis.3.d:0 "§gBERLIN // EMERGENCY BROADCAST§!\n\nThe German front has collapsed. Soviet representatives have taken control of the negotiations, and the government has lost the ability to resist them. Berlin remains the seat of a reduced North German Soviet Republic, while an Oder Soviet Republic can be established in the eastern territories and German-held land in neighbouring countries is dealt with separately.\n\nWerner Dahl and the communist faction have formed a government under Soviet supervision. The west and south can be organised into smaller Soviet-aligned republics. Former allies may still be fighting; the remaining choices require Germany to be at peace.\n\n§YThe reckoning has only begun.§!"
 RI_GER_crisis.3.a:0 "The republic enters a new and uncertain chapter."
 RI_GER_crisis.4.t:0 "The Work of Recovery"
 RI_GER_crisis.4.d:0 "Germany is independent, and its war with the Soviet Union has ended. The fighting has left difficult questions about security, reconstruction and the country's political future.\n\nA new recovery branch is now available beneath Germany's existing national focuses."
 RI_GER_crisis.4.a:0 "Begin the work of rebuilding."
 RI_GER_crisis.5.t:0 "The Division of Germany"
 RI_GER_crisis.5.d:0 "Berlin retains the northern heartland, but Moscow will not leave the rest of Germany under its authority. The territories still held in the west and south can be divided into Soviet-aligned republics: the Rhineland, Westphalia, Hesse, Swabia and Bavaria. Alternatively, a Soviet military administration can govern them together as a buffer under Moscow's protection.\n\nOnly eligible western and southern territory owned by Germany or the Soviet Union and safely controlled is transferred to the military administration. Existing unrelated governments are not altered. German-held border territories return to Austria, Poland, Czechoslovakia or Lithuania where possible; otherwise the Soviet Union takes them. A new Austria is established under Soviet protection if needed."
 RI_GER_crisis.5.regions:0 "Establish regional governments under Soviet protection."
 RI_GER_crisis.5.regions_unavailable:0 "The regional settlement is unavailable."
 RI_GER_crisis.5.regions_unavailable_tt:0 "Westphalia, Hesse and Swabia must not already exist. Any earlier Rhineland or Bavarian settlement must be independent or under Soviet protection, and its territory must be fully controlled by that country, Germany or the Soviet Union."
 RI_GER_crisis.5.soviet:0 "Establish a Soviet western military administration."
 RI_GER_crisis.5.buffer_unavailable:0 "The military administration cannot be established."
 RI_GER_crisis.5.buffer_unavailable_tt:0 "The Soviet Union must not be in a peace conference. The military administration must not already exist unless it was created by this settlement, remains a Soviet subject, and is at peace."
 RI_GER_crisis.5.defer:0 "The question must wait."
 RI_GER_crisis.5.unavailable:0 "The conditions for partition are not met."
 RI_GER_crisis.5.unavailable_tt:0 "Germany must have undergone the Soviet takeover, be a Soviet subject at peace, own Berlin, and still own western or southern territory. The relevant western, southern, eastern, Austrian and neighbouring states must be fully controlled by Germany or the Soviet Union. The partition must not already have been completed."
 RI_GER_crisis.6.t:0 "The Austrian Question"
 RI_GER_crisis.6.d:0 "Germany still holds Austrian territory, and no Austrian government exists. Berlin can restore Austria as a Soviet dependent, or transfer the territory to Soviet administration. An Austria that already exists will not have its government altered."
 RI_GER_crisis.6.puppet:0 "Restore Austria under Soviet protection."
 RI_GER_crisis.6.soviet:0 "Place Austrian territory under Soviet administration."
 RI_GER_crisis.6.unavailable:0 "The conditions for restoring Austria are not met."
 RI_GER_crisis.6.unavailable_tt:0 "Germany must have undergone the Soviet takeover, be a Soviet subject at peace, own Berlin, and hold Austrian territory. Austria must not already exist. Relevant German-held territories must be fully controlled by Germany or the Soviet Union."
 RI_GER_crisis.7.t:0 "Test the Soviet Takeover"
 RI_GER_crisis.7.d:0 "This event is for manual testing. It bypasses the normal 80% occupation requirement and immediately imposes the Soviet takeover on Germany. Soviet-held eastern German states can form an Oder Soviet Republic. An eligible Poland is restored or converted into a Soviet puppet, with German-held Polish territory returned to it.\n\nUse a separate test save. Germany must own Berlin, be independent and at peace, and the Soviet Union must exist. Poland must also be at peace and independent or already a Soviet subject. After confirming, advance the game to see the settlement events."
 RI_GER_crisis.7.test:0 "Start the takeover test."
 RI_GER_crisis.7.cancel:0 "Do not change the situation."
 RI_GER_crisis.8.t:0 "The Fate of [RI_SOV_defeated_ally.GetName]"
 RI_GER_crisis.8.d:0 "With Germany under Soviet supervision, the war against its European allies continues. [RI_SOV_defeated_ally.GetNameDef] has capitulated or Soviet forces control at least 80% of its currently owned core states. Moscow must decide whether to establish a communist government under Soviet protection or incorporate the country directly into the Soviet Union.\n\nThe country must remain at war with the Soviet Union, its territory must be fully controlled by its own forces or Soviet forces, and it must have no other enemies outside the Soviet coalition. Direct annexation is unavailable while it has subjects. A peace conference may settle its fate first."
 RI_GER_crisis.8.puppet:0 "Establish a Soviet-aligned government."
 RI_GER_crisis.8.annex:0 "Incorporate the country into the Soviet Union."
 RI_GER_crisis.8.unavailable:0 "The situation has changed."
 RI_GER_crisis.9.t:0 "The Settlement Interrupted"
 RI_GER_crisis.9.d:0 "The peace settlement could not be completed: the country no longer exists, remains at war, or has entered a peace conference. Its final status must be resolved separately."
 RI_GER_crisis.9.a:0 "We will review the situation."
 RI_GER_return_ermland_to_soviet:0 "Return Ermland-Masuren to the Soviet Union"
 RI_GER_return_ermland_to_soviet_desc:0 "Return Ermland-Masuren to Soviet administration if Germany or a Soviet-dependent Poland owns it and the state is safely controlled. Land owned by unrelated countries is not affected."
 RI_GER_create_western_buffer:0 "Establish the Western Military Administration"
 RI_GER_create_western_buffer_desc:0 "Create a Soviet-dependent military administration from the safely controlled western and southern territories held by Germany or the Soviet Union. This decision also repairs an earlier settlement that placed those territories directly under Soviet rule. It will not take land from other countries."
 RI_GER_test_eastern_republics:0 "Complete the Eastern Republics Test"
 RI_GER_test_eastern_republics_desc:0 "For an existing Soviet-takeover test save, restore or convert Poland into a Soviet-puppet Polish SSR and transfer eligible German-held Polish territory to it. Soviet-held Polish homeland states are returned to Poland, and Soviet-held eastern German states form a separate Oder Soviet Republic. Existing third-party subjects and territory are not taken."
 RI_GER_review_german_partition:0 "Review the German Partition"
 RI_GER_review_german_partition_desc:0 "Resume the choices over the western and southern German territories and, if applicable, Austria. Germany must be a Soviet subject at peace, own Berlin, and fully control the relevant states or have them fully controlled by the Soviet Union."
 RI_GER_refine_german_partition:0 "Redraw the Regional Settlement"
 RI_GER_refine_german_partition_desc:0 "Replace the earlier broad western and southern settlement with smaller Soviet-dependent republics. Westphalia and Hesse are separated from the Rhineland, and Swabia from Bavaria. German-held border pockets return to neighbouring countries where possible; existing unrelated countries are not made subjects."
 RI_GER_review_remaining_austria:0 "Reconsider Austria's Future"
 RI_GER_review_remaining_austria_desc:0 "Review German-held Austrian territory if Austria does not exist. Berlin can restore Austria or transfer the territory to Moscow."
 RI_GER_return_austria_to_existing:0 "Return Austrian Territory"
 RI_GER_return_austria_to_existing_desc:0 "Transfer German-owned Austrian states to the existing Austrian government, without changing its independence or politics."
 RI_GER_transfer_eastern_pockets:0 "Transfer the Eastern Pockets"
 RI_GER_transfer_eastern_pockets_desc:0 "Transfer remaining German-owned eastern settlement states to the Soviet Union; the Oder republic receives the eligible western states."
 RI_GER_finalize_soviet_settlement:0 "Complete the Soviet Settlement"
 RI_GER_finalize_soviet_settlement_desc:0 "Return German-held Austrian, Polish, Czech and Lithuanian border states to their existing countries where possible, establish a Soviet-dependent Austria if necessary, and transfer designated eastern states to the Soviet Union and its Oder republic. The settlement's regional republics become Soviet puppets. Existing unrelated countries and third-party territory are not taken."
 RI_GER_enforce_accepted_settlement:0 "Enforce the Accepted Soviet Settlement"
 RI_GER_enforce_accepted_settlement_desc:0 "Germany already accepted Moscow's terms, but the war did not end. Enforce the agreed peace between Germany's coalition and the Soviet coalition. No further German territory is transferred by this decision."
