l_english:
 GER_diplomatic_corps:0 "Federal Liaison Network"
 GER_diplomatic_corps_desc:0 "A permanent team joins diplomatic reporting, economic data and regional expertise. Berlin can prepare proposals faster, though its growing reach makes every foreign contact easier to monitor."
 GER_french_trade_partner:0 "Franco-German Industrial Channel"
 GER_french_trade_partner_desc:0 "Shared specifications and production schedules reduce bottlenecks between German and French factories. The arrangement improves output but ties both economies to a fragile political understanding."
 GER_intelligence_directorate:0 "Directorate for Strategic Intelligence"
 GER_intelligence_directorate_desc:0 "Analysts bring cyber reports, satellite imagery and human sources into one assessment cycle. The directorate improves planning, while its classified budgets deepen public suspicion of the war cabinet."
 GER_covert_rearmament:0 "Quiet Rearmament Network"
 GER_covert_rearmament_desc:0 "Civilian suppliers and military procurement offices coordinate production under routine replacement orders. Factories become more efficient, but the deception depends on keeping workers and auditors outside the full picture."
 GER_prewar_officer_training:0 "Staff Modernisation Programme"
 GER_prewar_officer_training_desc:0 "Command courses train officers to work with distributed communications, rapid logistics and incomplete battlefield data. The new methods improve coordination without resolving the political divide inside the high command."
 GER_liebich_war_mandate:0 "Liebich's War Mandate"
 GER_liebich_war_mandate_desc:0 "Parliament has authorised the campaign, but its support is conditional and publicly recorded. The mandate gives the government room to act while every new emergency measure risks spending that authority."
 GER_war_economy_decree:0 "Emergency Production System"
 GER_war_economy_decree_desc:0 "A central allocation system directs materials and factory time toward military orders. Output rises as civilian demand is cut, shifting the cost of the war into household budgets and local services."
 GER_industrial_rationalisation:0 "Integrated Production Grid"
 GER_industrial_rationalisation_desc:0 "Factories share capacity forecasts, component inventories and transport windows through a unified production schedule. Better coordination reduces waste, but the system is vulnerable to strikes and data failures."
 GER_expanded_conscription:0 "Expanded National Service"
 GER_expanded_conscription_desc:0 "The government broadens eligibility for military service and links local records to call-up planning. The army gains a larger pool of recruits as families and employers face mounting disruption."
 GER_peoples_army_doctrine:0 "People's Army Doctrine"
 GER_peoples_army_doctrine_desc:0 "Unit leadership and political education are brought closer to the soldiers expected to carry out the plan. Cohesion improves, though commanders must balance initiative with the party's demand for accountability."
 GER_accelerated_officers:0 "Accelerated Command Course"
 GER_accelerated_officers_desc:0 "Experienced non-commissioned officers receive shortened command training and are sent to formations that have lost their leadership. Decisions move faster, but accelerated promotion cannot replace years of field experience."
 GER_eastern_hammer_doctrine:0 "Eastern Operational Plan"
 GER_eastern_hammer_doctrine_desc:0 "The command system prioritises tempo, mobile reserves and pressure on Soviet logistics nodes. The approach sharpens attacks but asks exhausted formations to keep moving before supply can reliably catch up."
 GER_atlantic_strategy:0 "Atlantic Interdiction Plan"
 GER_atlantic_strategy_desc:0 "Maritime surveillance and patrol schedules are coordinated around the routes supplying the Soviet war effort. Germany gains reach at sea, while each interception risks turning a neutral shipping dispute into a diplomatic crisis."
 GER_naval_expansion:0 "Fleet Construction Programme"
 GER_naval_expansion_desc:0 "Dockyards standardise components and keep more hulls moving through construction at once. The programme increases future capacity, although the ships cannot arrive in time to settle the immediate campaign."
 GER_submarine_warfare:0 "Subsurface Interdiction"
 GER_submarine_warfare_desc:0 "Submarine patrols use shared route data to concentrate on high-value supply traffic. The campaign threatens enemy logistics, but missing crews and disputed sinkings make the political cost impossible to hide."
 GER_iceland_base:0 "North Atlantic Staging Network"
 GER_iceland_base_desc:0 "Fuel, repair crews and secure communications extend German patrol operations into the North Atlantic. The base improves operational endurance and places a small island under pressure from every power watching the sea lanes."
 GER_biscay_patrol:0 "Biscay Maritime Picture"
 GER_biscay_patrol_desc:0 "Coastal sensors, patrol reports and port records are combined to identify traffic moving through the Bay of Biscay. The picture is more complete; French officials now have a clearer view of German activity as well."
 GER_med_strategy:0 "Mediterranean Pressure Plan"
 GER_med_strategy_desc:0 "German planners map the ports and transfer points that connect Mediterranean shipping to the eastern front. The plan creates leverage over supply routes but gives Rome reason to question Berlin's intentions."
 GER_north_sea_blockade_idea:0 "North Sea Inspection Regime"
 GER_north_sea_blockade_idea_desc:0 "Patrol groups coordinate inspections and convoy disruption across the northern approaches. The campaign makes Soviet-bound traffic harder to move, while increasing the risk of clashes with British Union and neutral vessels."
 GER_coalition_coordinator:0 "Coalition Operations Secretariat"
 GER_coalition_coordinator_desc:0 "A shared staff translates incompatible national plans into timetables, supply requests and common objectives. Coordination improves, but the secretariat cannot make partners agree on who bears the next cost."
 GER_two_front_coordination:0 "Parallel Front Coordination"
 GER_two_front_coordination_desc:0 "German and Chinese staffs exchange operational windows and logistics updates through a secure liaison network. The Soviet command must respond across two fronts, while the coalition's distance and differing priorities remain serious weaknesses."
 GER_grand_coalition_bonus:0 "Coalition Command Framework"
 GER_grand_coalition_bonus_desc:0 "The allies establish a common planning process and a limited set of shared priorities. It improves the coalition's ability to act together without erasing the arguments that will shape any peace settlement."
 GER_coalition_stability_idea:0 "Managed Wartime Coalition"
 GER_coalition_stability_idea_desc:0 "Liebich gives unions, party officials and reluctant moderates a place in the wartime decision process. The arrangement steadies the government and generates new political work with every compromise."
 GER_war_mandate_renewed:0 "Renewed Mandate"
 GER_war_mandate_renewed_desc:0 "The government has secured another vote to continue the campaign. Its authority is stronger for now, but the renewal ties political credibility to results the cabinet cannot guarantee."
 GER_war_won:0 "The Cost of Victory"
 GER_war_won_desc:0 "The eastern campaign has ended, leaving the government to convert military success into a workable peace. Public relief is real, but so are the casualties, shortages and political claims that victory has not settled."
 GER_berlin_accords_spirit:0 "Berlin Accords Settlement"
 GER_berlin_accords_spirit_desc:0 "The settlement creates a framework for reconstruction and guarded diplomacy. Its institutions can help rebuild stability, but every unresolved border and prisoner list remains a future point of rupture."
 FRA_bordeaux_agreement:0 "Bordeaux Industrial Compact"
 FRA_bordeaux_agreement_desc:0 "French factories join a negotiated production and standards framework with Germany. The arrangement brings investment and access to shared supply chains, while French officials retain hard limits on Berlin's authority."
 GER_french_economic_partner:0 "Bordeaux Economic Desk"
 GER_french_economic_partner_desc:0 "A joint office manages industrial schedules, investment and cross-border transport. It improves capacity on both sides, though its success depends on France believing the partnership is not a prelude to control."
 CHI_german_coordination:0 "Joint Continental Staff Channel"
 CHI_german_coordination_desc:0 "Chinese and German planners exchange intelligence and operational timing through a dedicated liaison channel. The arrangement sharpens coordination against their shared opponent without resolving their separate postwar aims."
 SCO_german_trained_brigades:0 "German-Scottish Brigade Training"
 SCO_german_trained_brigades_desc:0 "Scottish formations receive common communications procedures, staff training and field exercises with German advisers. The brigades become more capable, while their dependence on outside equipment remains visible."
 SCO_german_guarantee:0 "Berlin's Guarantee"
 SCO_german_guarantee_desc:0 "The Edinburgh pact gives Scotland a public security commitment and a place in the coalition's planning. It strengthens the government's standing at home while making its independence increasingly bound to Germany's fortunes."
 SOV_british_lifeline:0 "British Supply Corridor"
 SOV_british_lifeline_desc:0 "British Union shipping continues to move fuel, machine parts and military stores eastward. The corridor supports Soviet production until patrols and port restrictions finally make the route untenable."
 GER_production_drive:0 "Emergency Production Drive"
 GER_production_drive_desc:0 "A one-year industrial mobilisation pushes factories to add shifts, share components and cut idle time. Output improves quickly, at the cost of deferred maintenance and worker fatigue."
 GER_war_bonds:0 "Wartime Bond Programme"
 GER_war_bonds_desc:0 "Public borrowing directs household savings into the war effort and keeps industrial orders moving. The influx sustains production, but debt and compulsory appeals erode confidence in the government."
