l_english:
 GER_allies.1.t:0 "The Union Closes Ranks"
 GER_allies.1.d:0 "§gBFV / BND JOINT BRIEFING // COALITION PLANNING CELL // RESTRICTED§!\n\n§YSUBJECT: BRITISH UNION POSITION FOLLOWING THE OUTBREAK OF WAR§!\n\nThe British Union has not been neutral for a single hour. Within six hours of our declaration, the Union's Council of Representatives issued a public statement pledging 'full fraternal solidarity' with the Soviet Union. Within twelve, intercepted traffic showed British staff officers arriving in Moscow, and freight manifests at Liverpool and Hull were rewritten overnight to prioritise shipments for the eastern front.\n\nThere is no ambiguity in any of this. London and Moscow have been bound together for years by treaty, ideology and a shared hostility to everything Berlin represents. British radio is already describing Germany as 'the aggressor of the age'. Their dockworkers' councils have pledged to load Soviet cargo and to refuse ours. Their naval signals traffic has doubled.\n\nWe should expect the Union to act as a full belligerent in all but name, and to become one in name as soon as it suits them. Their fleet is large, their industrial base is intact, and their propaganda apparatus is the best in the hemisphere. They will attempt to isolate us diplomatically while keeping Moscow supplied.\n\nWe therefore recommend that the Chancellor formalise the coalition framework immediately. Scotland has every reason to resist the Union. France has its own reasons to hedge. Others will follow once they see that we intend to win. We cannot afford to wait for friends to volunteer.\n\n§Y\"We were never going to be able to outrun London. We can only outbuild it.\"§!"
 GER_allies.1.a:0 "Build the coalition. London has chosen its side."
 GER_allies.1.b:0 "Proceed carefully. Avoid provoking the Union further."
 SCO_liberation.german_feelers.t:0 "A Quiet Visit From Berlin"
 SCO_liberation.german_feelers.d:0 "§gHOLYROOD // FIRST MINISTER'S OFFICE // 21:10§!\n\nThe visitor had no name on the guest list. He arrived by the side entrance in a plain grey car, carrying nothing but a leather folder and a polite expression. The duty officer logged him as 'a trade consultant', which was the phrase the First Minister's private secretary had asked him to use.\n\nIn the small drawing room overlooking the Canongate, the man from Berlin introduced himself as a counsellor at the German embassy in Oslo. He declined tea. He accepted whisky. He said that his government had been watching events in Britain with growing concern and had noticed that Scotland, alone among its neighbours, had refused to bend the knee to the Union in London.\n\n'We are not here to make promises,' he said. 'We are here to listen.'\n\nThe First Minister's chief of staff asked what, exactly, Berlin hoped to hear. The visitor smiled. 'That Scotland is not alone.'\n\nFor most of an hour they talked in careful generalities: shipping lanes, border incidents, the strange fact that British radio had begun describing the Scots as 'misguided cousins'. Nothing was written down. At the end the visitor stood, shook hands, and said only that his government would be grateful to hear whatever Scotland wished to say, at whatever time it chose to say it.\n\nAfter he left, the First Minister stood at the window for a long time and watched the grey car vanish down the Royal Mile. 'Well,' he said at last. 'That was either the beginning of something, or the cleverest bit of theatre I have ever seen.'\n\n§Y\"Small nations learn to read quiet messages. They have to.\"§!"
 SCO_liberation.german_feelers.a:0 "Open a discreet channel to Berlin."
 SCO_liberation.german_feelers.b:0 "Listen, but commit to nothing."
 SCO_liberation.german_arms.t:0 "Crates at Leith"
 SCO_liberation.german_arms.d:0 "§gTHE SCOTSMAN // FRONT PAGE§!\n\n§YMYSTERY SHIPMENTS ARRIVE AT LEITH AS GERMANY ARMS EDINBURGH§!\n\nEDINBURGH - They came ashore before dawn, forty trucks in a column that stretched from the docks to the Seafield road. By the time the first commuters arrived at the port, the cargo had vanished into army depots from Stirling to Dundee. A ministry spokesman declined to describe it. A union man on the quayside was more forthcoming. 'Rifles,' he said. 'Hundreds of crates. Written in German on the side.'\n\nThe government has confirmed what it calls 'a defensive procurement arrangement with a friendly European power'. Pressed on which power, a minister said only that Scotland would not be 'dictated to by anyone in London, Moscow or anywhere else'.\n\nThe reaction was immediate. In Glasgow, a crowd gathered outside the Central Station waving saltires and chanting the First Minister's name. In Aberdeen, the old dockers' union passed a resolution of support. In Newcastle, across the border, British Union radio denounced the shipments as 'a provocation by imperialist adventurers'.\n\nOne elderly veteran, interviewed outside a recruiting office, put it plainly. 'My grandfather fought the English with sticks,' he said. 'I would prefer that my grandson had better.'\n\nBy nightfall the army had distributed the first rifles to the border regiments. The Union's ambassador was recalled to London.\n\n§Y\"A nation that is armed is a nation that is heard.\"§!"
 SCO_liberation.german_arms.a:0 "Distribute the arms. Prepare the border."
 SCO_liberation.german_arms.b:0 "Hold the shipment in reserve. Do not provoke London."
 SCO_liberation.edinburgh_pact.t:0 "The Edinburgh Pact"
 SCO_liberation.edinburgh_pact.d:0 "§gSIGNING CEREMONY // PARLIAMENT OF SCOTLAND // OFFICIAL RECORD§!\n\nThe chamber was too small for the occasion, and everyone knew it. Delegates stood three deep along the walls. Cameras jostled for position in the gallery. On the raised table at the head of the room, two flags stood side by side: the blue saltire of Scotland and the black, red and gold of Germany.\n\nThe German Chancellor's representative spoke first. 'The people of Scotland have chosen to remain free,' he said. 'Germany does not give them that freedom. It simply promises that it will not stand by while others attempt to take it away.'\n\nThe First Minister rose to reply. He spoke for less than two minutes, and when he finished, nobody in the chamber could remember a word of it except the last sentence. 'We ask for no favours,' he said. 'We ask only that when the Union comes for us, someone is standing with us.'\n\nThe pact itself was a single page: a mutual guarantee of independence, a commitment to joint defence planning and a shared pledge to resist 'any attempt at subjugation by foreign powers'. Both signatories understood the foreign power in question.\n\nOutside, in the rain, the crowd on the Royal Mile began to sing. Nobody could say afterwards who started it. By the third verse the whole street had joined in.\n\n§Y\"Treaties are made of paper. What matters is who is willing to stand behind them.\"§!"
 SCO_liberation.edinburgh_pact.a:0 "Scotland will not stand alone."
 FRA_german_overture.covert.t:0 "A Courier From Berlin"
 FRA_german_overture.covert.d:0 "§gCAFÉ DE FLORE // SAINT-GERMAIN-DES-PRÉS // 16:40§!\n\nThe two men met by accident, or so they would later swear. One was a mid-ranking official of the French foreign ministry. The other was a German cultural attaché whose duties, as far as anyone could tell, consisted of attending exhibitions and being photographed with ministers.\n\nThey sat at an outdoor table with a bottle of mineral water between them. For ten minutes they discussed the weather, the quality of the coffee and the sorry state of European football. Then the attaché reached into his jacket and set a small, unmarked envelope on the table.\n\n'A message from my government,' he said. 'It has not been sent through channels. It does not exist.'\n\nThe official did not touch the envelope. 'And what does it say?'\n\n'That Berlin has noticed the French people are tired of being led by Moscow's habits. That we do not wish to fight France. That in the months ahead, there may be a moment when France is offered a choice, and we would prefer that the choice be an informed one.'\n\nThe official looked at the envelope for a long time. At the next table a child laughed. A waiter swept past with a tray of croissants. Finally, with the air of a man picking up something that might be hot, he slid the envelope into his coat. 'I will see that it reaches the right person,' he said. 'Whether he reads it is another matter.'\n\n§Y\"In Paris, the most dangerous letters are always the ones nobody has signed.\"§!"
 FRA_german_overture.covert.a:0 "Pass the message to the Elysée."
 FRA_german_overture.covert.b:0 "Say nothing. File it away for later."
 FRA_german_overture.1.t:0 "Berlin Offers Its Hand"
 FRA_german_overture.1.d:0 "§gLE FIGARO // POLITIQUE // PAGE TWO§!\n\n§YBERLIN PROPOSES 'COMMON FRONT' AS PARIS WEIGHS ITS LOYALTIES§!\n\nPARIS - The offer, delivered in person by a senior German envoy, was as short as it was startling. Germany, the envoy told a closed session of the foreign affairs committee, would welcome the opportunity to coordinate its war effort with France, share intelligence on Soviet and British movements and open a framework for trade that would sidestep the commercial blockade now strangling the Continent.\n\nThe committee has not yet formally replied. But the discussion in the corridors of the Quai d'Orsay has been feverish. Supporters of the proposal argue that France has nothing to gain from a Soviet victory and a great deal to lose from a British Union that treats its allies as subordinates. Opponents counter that France's ties to Moscow and London run deeper than any single agreement, and that a premature break could invite reprisals.\n\nIn the streets, the debate is simpler. A woman at a market stall in Belleville said she did not much care who France sided with, provided her sons stayed home. A student outside the Sorbonne said that a country that waits to be told what to do is a country that has already lost.\n\nThe President's office has issued a statement. It said that France would consider all proposals with the seriousness they deserved. In the language of French diplomacy, this means that the answer is not yet no.\n\n§Y\"A country's allies are those it can afford. Its enemies are those it cannot ignore.\"§!"
 FRA_german_overture.1.a:0 "Open formal talks with Berlin."
 FRA_german_overture.1.b:0 "Keep the talks private and the options open."
 SOV_german_war.1.t:0 "Germany Declares War"
 SOV_german_war.1.d:0 "§gKREMLIN // EMERGENCY SESSION // 00:47§!\n\nThe telephone in the General Secretary's study rang at three minutes past midnight. It rang for a long time before anyone answered it. When someone finally did, the voice on the line belonged to the ambassador in Berlin, and what it said was brief and exact.\n\nBy the time the Security Council convened, the first reports were already arriving. Border posts had gone silent. Radar stations in the western districts showed contacts moving east. A staff colonel read the list of the units in contact in a voice that did not quite shake. The Defence Minister asked whether the Union's allies had been informed. They had. London's reply had come within four minutes. It had used the word 'fraternal' three times.\n\nA younger minister, one of the new men, asked whether the front was prepared. For a moment nobody answered. Then the old Marshal at the end of the table, who had said nothing all evening, said very quietly: 'Prepared enough to bleed them. Not enough to stop them. That will depend on how quickly we learn.'\n\nThe General Secretary stood and walked to the window. Below, the lights of the capital burned as they always did, indifferent, orderly, and a little unreal. 'Gentlemen,' he said, 'the Germans believe they have caught us sleeping. Let us show them what it costs to wake us.'\n\n§Y\"They did not ask whether we were ready. They never do.\"§!"
 SOV_german_war.1.a:0 "Mobilise. The Motherland will answer."
 SOV_german_ceasefire.1.t:0 "A Call From Berlin"
 SOV_german_ceasefire.1.d:0 "§gKREMLIN // SECURE LINE // 04:05§!\n\nThe request came through the diplomatic channel with no fanfare and no preamble: the new German Chancellor wished to speak, privately, to someone with the authority to listen. The duty officer woke the General Secretary himself.\n\nIn the study, three men sat in the lamplight and read the transcript of the call that had just ended. It was a short document. It contained no threat, no ultimatum and no demand. It contained only a question, put with unusual directness: would Moscow be prepared to discuss an end to the fighting?\n\nThe Foreign Minister read it twice and laid it on the table. 'It could be a trap,' he said. 'It could also be the first honest thing the Germans have said in a year.'\n\nThe Defence Minister disagreed. 'They are losing patience, not strength. If we answer now we reward them for stopping. If we wait, we make them pay for starting.'\n\n'And London?' asked the General Secretary. 'What would London say?'\n\nNobody answered. They all knew what London would say. It was, in the end, the reason they were still talking.\n\nThe General Secretary picked up the transcript and held it for a moment, as though it weighed more than paper should. 'We have been fighting for a long time,' he said. 'I should like to know whether we are fighting for a reason.'\n\n§Y\"A ceasefire is not peace. It is merely the pause in which peace is possible.\"§!"
 SOV_german_ceasefire.1.a:0 "Agree to talk. Nothing more."
 SOV_german_ceasefire.1.b:0 "Refuse. The war continues."
