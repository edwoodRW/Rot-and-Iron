 POLITICS_VALERY_RASHKIN_DESC:0 "§YGeneral Secretary Valery Rashkin§!\n\nBorn in 1955, Valery Rashkin belongs to the last generation of Soviet politicians raised during the golden age of the Union. Having spent decades climbing the ranks of the Communist Party, Rashkin emerged as a staunch defender of orthodox Marxism and the traditional Soviet political establishment.\n\nFollowing the removal of Ivan Sokolnikov in 2022, Rashkin assumed control of a nation already suffering from economic stagnation, widespread corruption and growing separatist movements. Rather than embrace meaningful reform, he strengthened the authority of the Politburo and expanded the powers of the state security apparatus.\n\nThe atrocities committed under his administration have alienated even the Soviet Union's closest ideological allies. With German forces preparing an invasion from the west and Chinese armies crossing the eastern frontier, Rashkin now faces the consequences of decades of political mismanagement.\n\n§RThe Union that once liberated continents now struggles to defend its own borders. Whether Rashkin will save it or become its final General Secretary remains to be seen.§!"

 POLITICS_SERGEI_UDALTSOV_DESC:0 "§YChairman Sergei Udaltsov§!\n\nBorn in Moscow in 1977, Sergei Udaltsov grew up surrounded by the revolutionary mythology of Leon Trotsky and the great Soviet victories of the twentieth century. However, the Soviet Union of his adulthood bore little resemblance to the revolutionary society described in his childhood textbooks.\n\nA prominent socialist activist and organiser, Udaltsov became increasingly critical of the entrenched bureaucracy that had transformed the Communist Party into an institution concerned primarily with its own survival. His involvement in underground workers movements eventually brought him to the leadership of the Revolutionary Communist International.\n\nUdaltsov advocates the restoration of workers councils, revolutionary democracy and the destruction of bureaucratic privilege. He regards both Rashkin's orthodox establishment and German democratic socialism as departures from the original revolutionary project.\n\nAlthough fiercely opposed to foreign occupation, he believes that the Soviet Union cannot be saved without a fundamental political transformation.\n\n§RThe revolution is not dead. It has merely been imprisoned by those who claim to defend it.§!"

 POLITICS_NIKOLAI_PLATOSHKIN_DESC:0 "§YChairman Nikolai Platoshkin§!\n\nA diplomat, historian and socialist intellectual, Nikolai Platoshkin represents a growing generation of Soviet reformers who believe that socialism must adapt to the realities of the twenty-first century.\n\nDuring his diplomatic career, Platoshkin witnessed the economic and technological achievements of the German Spartacist Republic. Whilst Moscow remained burdened by outdated institutions and rigid economic planning, Berlin developed a modern socialist economy capable of competing on the international stage.\n\nReturning to the Soviet Union, Platoshkin became a leading advocate for administrative reform, technological investment, political accountability and a more flexible economic system. His proposals were repeatedly rejected by the orthodox leadership, eventually driving him towards the Movement for Socialist Progress.\n\nPlatoshkin condemns the German invasion but acknowledges that the Soviet Union must confront the failures that made it possible. His vision is not the destruction of the Union, but its transformation into a modern, prosperous and accountable socialist federation.\n\n§YSocialism must evolve, or it will become nothing more than a chapter in the history books.§!"

 POLITICS_IRINA_MIKHAILOVA_DESC:0 "§YPresident Irina Mikhailova§!\n\nBorn in Leningrad in 1974, Irina Mikhailova spent her early career studying social policy and the deteriorating living conditions of ordinary Soviet citizens. As a university lecturer and trade union representative, she witnessed the gradual decline of public services that had once been regarded as the greatest achievements of the Soviet system.\n\nHer criticism of government corruption and bureaucratic privilege earned her considerable support amongst workers, teachers, healthcare professionals and younger citizens. Despite repeated attempts by the authorities to restrict her activities, Mikhailova emerged as a leading figure within the Social Democratic Party of the Union.\n\nShe advocates free elections, independent trade unions, universal healthcare and a mixed economy in which public ownership exists alongside responsible private enterprise.\n\nMikhailova believes that the Soviet Union can survive only through the consent of its citizens, rather than the authority of the Communist Party. She seeks a negotiated end to the war and the establishment of a democratic federation capable of rebuilding the nation's shattered institutions.\n\n§YA government exists to serve its people, not the other way around.§!"

 POLITICS_GRIGORY_YAVLINSKY_DESC:0 "§YPresident Grigory Yavlinsky§!\n\nBorn in Lviv in 1952, Grigory Yavlinsky devoted much of his professional life to understanding the structural weaknesses of the Soviet economy. An accomplished economist, he repeatedly warned that excessive centralisation and bureaucratic interference would eventually undermine the prosperity of the Union.\n\nThroughout the closing decades of the twentieth century, Yavlinsky presented successive Soviet governments with proposals for economic liberalisation and constitutional reform. His recommendations were consistently rejected by officials unwilling to surrender their political and economic privileges.\n\nDisillusioned with the Communist establishment, Yavlinsky became a prominent figure within the Democratic Union of Soviets, advocating free elections, an independent judiciary, civil liberties and a competitive market economy.\n\nUnlike many anti-communist movements, he does not believe that the dissolution of the Soviet Union is inevitable. Instead, he proposes a voluntary democratic federation in which each republic possesses the constitutional right to determine its own future.\n\n§YThe unity of nations must be built upon freedom and cooperation, not fear and obedience.§!"

 POLITICS_ALEXEI_KUDRIN_DESC:0 "§YChairman Alexei Kudrin§!\n\nBorn in 1960, Alexei Kudrin established himself as one of the Soviet Union's most respected economists and financial administrators. For decades, he worked within a government increasingly paralysed by ideological disputes, outdated economic institutions and widespread administrative corruption.\n\nKudrin became convinced that the Soviet Union's greatest weakness was not socialism itself, but the inability of its political leadership to adapt to changing economic and technological circumstances.\n\nFollowing years of unsuccessful attempts to reform the state from within, he emerged as a leading figure of the Union Renewal Party, attracting economists, engineers, scientists and experienced civil servants dissatisfied with the existing political establishment.\n\nHis National Reconstruction Programme prioritises infrastructure modernisation, digitalisation, responsible public spending, industrial efficiency and the professionalisation of government institutions.\n\nWith the Soviet Union facing military defeat and economic collapse, Kudrin offers a government built around administrative competence rather than ideological loyalty.\n\n§YThe Soviet Union does not need another revolution. It needs a government that works.§!"

 POLITICS_VIKTOR_SOKOLOV_DESC:0 "§YGeneral Viktor Sokolov§!\n\nBorn in Volgograd in 1967, Viktor Sokolov dedicated his life to the Soviet armed forces. Descended from a family with a long tradition of military service, he rose through the ranks during a period in which the Red Army gradually declined from its position as the world's most formidable military institution.\n\nThroughout his service, Sokolov witnessed the damaging effects of political interference, corruption and outdated military doctrines. Qualified officers were routinely overlooked in favour of politically connected commanders, whilst military equipment deteriorated within neglected storage facilities.\n\nDespite repeated warnings to the Politburo, his recommendations were largely ignored. The German and Chinese invasions finally exposed the catastrophic consequences of these failures.\n\nSokolov has emerged as a leading figure within the military establishment and the Patriotic Union of the Soviet Peoples. He believes that preserving the territorial integrity of the Union must take priority over ideological disputes.\n\nShould civilian leadership fail completely, Sokolov may find himself at the head of an emergency military government.\n\n§RThe Motherland cannot afford another day of political paralysis.§!"

 POLITICS_KONSTANTIN_MALENKOV_DESC:0 "§YChairman Konstantin Malenkov§!\n\nBorn in Moscow in 1972, Konstantin Malenkov became known as a controversial political theorist whose writings challenged both the internationalist traditions of Soviet communism and the growing influence of German democratic socialism.\n\nA former university lecturer, Malenkov argued that the Soviet Union had sacrificed its national interests in pursuit of an increasingly meaningless international revolutionary project. He believed that the Communist Party had become an ageing bureaucracy incapable of defending either socialism or the Motherland.\n\nHis political philosophy combines extensive state ownership, authoritarian government and Russian nationalism. These ideas attracted disillusioned Communist officials, military veterans and radical nationalist intellectuals, eventually forming the foundations of the National Bolshevik Front.\n\nMalenkov seeks to replace the existing multinational Soviet system with a highly centralised nationalist socialist state. Such a transformation would risk provoking further conflict throughout the non-Russian republics.\n\n§RHis promised national revival threatens to deepen the very divisions that are tearing the Union apart.§!"

 POLITICS_VLADIMIR_PUTIN_DESC:0 "§YPresident Vladimir Putin§!\n\nBorn in Leningrad in 1952, Vladimir Putin entered the Soviet intelligence services during the final decades of the Union's international supremacy. His career exposed him to the growing weaknesses of Soviet institutions and the gradual deterioration of Moscow's influence abroad.\n\nUnlike many members of the Communist establishment, Putin came to regard Soviet ideology as secondary to the security and strategic interests of the Russian state. His extensive experience within the intelligence apparatus allowed him to establish connections throughout the military, political and security establishments.\n\nAs economic stagnation worsened and separatist movements gained momentum, Putin emerged as an influential advocate for a more centralised Russian-led political system. His association with the National Salvation Party reflects a growing belief that Russia must prioritise its own survival over the preservation of an increasingly unstable multinational union.\n\nPutin seeks to rebuild state authority, strengthen national security and maintain Russian influence throughout the territories of the former Soviet sphere.\n\n§YThe survival of the Russian state may ultimately come at the expense of the Soviet Union itself.§!"

 POLITICS_ALEXANDER_VORONTSOV_DESC:0 "§YChairman Alexander Vorontsov§!\n\nBorn in Leningrad in 1968, Alexander Vorontsov developed an interest in Russian imperial history despite the restrictions placed upon the study of pre-revolutionary political institutions. His academic career focused on the constitutional developments, traditions and political structures that existed before the October Revolution.\n\nThrough contacts with religious communities, underground monarchist organisations and descendants of Russian émigré families, Vorontsov became increasingly involved in the movement for imperial restoration.\n\nFor more than a century, monarchism had remained on the margins of Soviet political life. However, the declining legitimacy of the Communist Party has created opportunities that previous generations of monarchists could scarcely have imagined.\n\nAs leader of the Russian Imperial Movement, Vorontsov advocates the restoration of the Duma, the recognition of traditional religious institutions and the establishment of a constitutional monarchy under a legitimate Romanov claimant.\n\nHe faces the enormous challenge of restoring institutions that most Soviet citizens know only through history books.\n\n§YAfter more than a century in exile, the Russian Crown may yet return.§!"

 POLITICS_DMITRY_CHERNOV_DESC:0 "§YDirector Dmitry Chernov§!\n\nBorn in Omsk in 1981, Dmitry Chernov grew up during a period of economic stagnation, declining living standards and increasing political repression. Following a brief military career, Chernov became involved with underground ultranationalist organisations hostile to the Soviet political system.\n\nHis extremist ideology rejects communism, liberal democracy and the multinational character of the Soviet Union. He advocates the establishment of an authoritarian ethnonationalist state governed through political repression and rigid central authority.\n\nFor years, the Soviet security services treated Chernov and his associates as a marginal extremist threat. However, the collapse of government authority and the growing desperation of sections of the population have provided opportunities for the Russian National Unity movement to expand its activities.\n\nChernov's rise would represent a complete rejection of the political foundations upon which the Soviet Union was established. His policies threaten to provoke widespread persecution, ethnic violence and international isolation.\n\n§RFrom the ruins of a failing state, an even darker political order threatens to emerge.§!"

 POLITICS_TIMUR_KARIMOV_DESC:0 "§YChairman Timur Karimov§!\n\nBorn in Tashkent in 1975, Timur Karimov pursued an academic career specialising in Central Asian history, religious studies and Islamic jurisprudence. Throughout his life, he witnessed the tensions between the Soviet government's secular policies and the religious traditions of Central Asia.\n\nKarimov became increasingly involved in movements advocating religious freedom, cultural recognition and greater regional autonomy. His criticism of the treatment of Central Asian communities brought him into repeated conflict with the Soviet authorities.\n\nAs the political situation deteriorated, Karimov emerged as a leading figure of the Islamic Movement for Justice, a coalition containing religious scholars, regional activists and advocates of political decentralisation.\n\nWhilst initially supporting greater autonomy within a reformed Soviet federation, the weakening authority of Moscow and the Chinese invasion have placed the future of Central Asia in considerable doubt.\n\nKarimov must now balance the demands of moderate reformers, independence movements and competing religious factions whilst attempting to protect the interests of his supporters.\n\n§YFor the peoples of Central Asia, the future of the Union is no longer a question for Moscow alone.§!"
