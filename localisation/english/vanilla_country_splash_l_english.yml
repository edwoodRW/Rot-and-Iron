l_english:
  ENG_country_splash_header: "The Union of British Socialist Republics"
  ENG_rainbow_name: "The Union of Socialist British Republics"
  ENG_country_splash_header: "The Union of British Socialist Republics"
  ENG_country_splash_description: "The British Empire collapsed in the 1999 Millennium Revolution, when a charismatic socialist movement swept away the old order. Keir Starmer's government built a revolutionary state with deep ties to Moscow, relying on Soviet military aid as Britain remade its economy and institutions. The Union still carries the weight of its imperial past, even as it claims a new socialist identity.\n\nThat settlement is under strain. Scottish separatism has grown around disputes over resources, power, and political control, while the Soviet Union's war against Germany and China threatens the lifeline on which London depends. Starmer must hold the republic together as shortages and pressure from the front expose the limits of the old alliance."
  ENG_country_splash_close_button: "Begin"
  SCO_country_splash_header: "Scotland"
  SCO_country_splash_description: "Scotland enters this decade in a volatile constitutional and geopolitical moment. Westminster's instability has created openings, but also new risks for Edinburgh's long-term future.\n\nWith public services under pressure, energy and industrial policy up for renegotiation, and relations with London, Brussels, and Washington all in flux, Scotland must define whether it will be a cautious reformer or a disruptive force in a changing North Atlantic order."
  SCO_country_splash_picture: "GFX_ENG_country_splash_picture"
  SCO_country_splash_close_button: "Begin"
  PRC_country_splash_header: "The Republic of China"
  PRC_country_splash_description: "The Left Kuomintang's alliance with the Chinese Communist Party carried China to victory over Japan in the Second World War. A brief democratic opening in the 1940s gave way to a dictatorial communist state, which began a slow process of democratization in later decades. Under the nationalist leadership of Bo Xilai, that progress has been reversed. China now stands alongside Germany in a two-front invasion of the Soviet Union."
  PRC_country_splash_picture: "GFX_ENG_country_splash_picture"
  PRC_country_splash_close_button: "Begin"
  FRA_country_splash_header: "The Commune of France"
  FRA_country_splash_description: "France's postwar settlement left the country socialist, but not at peace with itself. Pierre Laurent's orthodox faction dominates a state that still claims the language of democracy, while opposition grows against his increasingly strict rule. Years of political stagnation have left the country ill-prepared for a new European war.\n\nThe loss of Alsace-Lorraine to Germany remains an open wound, and the French military has little patience for the government's caution. Paris is caught between its Soviet ties and the threat posed by a revolutionary Germany. As the war expands, France must decide whether to defend the existing order or risk a deeper internal rupture."
  FRA_country_splash_picture: "GFX_ENG_country_splash_picture"
  FRA_country_splash_close_button: "Begin"
  GER_country_splash_header: "The Socialist Republic of Germany"
  GER_country_splash_description: "The German Revolution saw Rosa Luxemburg's Spartacists seize power during the upheavals of the Second World War. Germany rejected both capitalism and Moscow's bureaucratic model, building a decentralized, democratic, and egalitarian socialist republic. Its revolutionary victory helped spread communism across Europe.\n\nUnder Chancellor Stefan Liebknecht, Germany now leads a war against the Soviet Union alongside China. The republic presents itself as proof that socialism need not mean Soviet tyranny, but the invasion will test its ideals and determine the future of Eastern Europe."
  GER_country_splash_picture: "GFX_ENG_country_splash_picture"
  GER_country_splash_close_button: "Begin"
  CAN_country_splash_header: "The Dominion of Canada"
  CAN_country_splash_description: "Canada became a refuge for the exiled British monarchy and imperial loyalists fleeing the 1999 Millennium Revolution. Prime Minister Conrad Black's national-conservative government preserves the appearance of parliamentary rule, but power rests with a narrow oligarchy and its security apparatus.\n\nThe Dominion depends on an increasingly uncertain United States while suppressing dissent at home. Its leaders fear that socialist revolution could cross the border, yet every crackdown deepens the resentment that makes the country harder to govern. Canada's old imperial identity survives, but the world that sustained it is gone."
  CAN_country_splash_picture: "GFX_ENG_country_splash_picture"
  CAN_country_splash_close_button: "Begin"
  SOV_country_splash_header: "The Union of Soviet Socialist Republics"
  SOV_country_splash_description: "The Soviet Union was once the world's foremost communist power. Lenin lit the revolution; Trotsky founded the Union and Tukhachevsky carried its influence forward. That ascendancy has curdled into a rigid, repressive state, increasingly at odds with Germany's democratic socialism and China's independent revolution.\n\nUnder Valery Rashkin, the USSR faces a war on two fronts and a crisis of its own making. Its armies are battered, its logistics falter, and old political divisions are returning as the frontiers contract. The Union remains immense, but its survival—and the future of the Soviet system—can no longer be taken for granted."
  SOV_country_splash_picture: "GFX_ENG_country_splash_picture"
  SOV_country_splash_close_button: "Begin"
  USA_country_splash_header: "The United States of America"
  USA_country_splash_description: "The United States emerged from the 1934 Business Plot under a military-corporate order that kept its institutions intact while narrowing their purpose. The 2008 crash broke that arrangement: a socialist revolution brought the Democratic Socialist Party to power, initially through a cautious coalition that still carried the habits of the old republic.\n\nNina Turner now leads a country whose leftward turn remains unfinished. Her administration inherited a powerful economy and military, but also a deep alliance with the forces that once constrained reform. Washington had backed Canada and Japan as bulwarks against the revolutionary tide; now Turner is drawing closer to Europe's socialist governments. The old security establishment is watching, and the state is no longer certain that it serves the President."
  USA_country_splash_picture: "GFX_USA_country_splash_picture"
  USA_country_splash_close_button: "Begin"
  DEN_country_splash_header: "The Kingdom of Denmark"
  DEN_country_splash_description: "Denmark, a small but prosperous Nordic kingdom, has long been held up as a model of the Scandinavian welfare state—generous public services, high trust, and social cohesion. But the same populist winds that have reshaped the continent are blowing across the Øresund.\n\nNorth Sea energy reserves give Copenhagen economic leverage that belies the country's modest size, and the beloved monarchy provides a stabilising anchor. But immigration debates, EU scepticism, and the question of Danish identity in a globalised world refuse to go away.\n\nDenmark must navigate these currents while preserving what makes it unique—or risk becoming just another casualty of the populist tide."
  DEN_country_splash_picture: "GFX_ENG_country_splash_picture"
  DEN_country_splash_close_button: "Begin"
  ETH_country_splash_header: "The People's Democratic Republic of Ethiopia"
  ETH_country_splash_description: "Ethiopia is a steadfast Soviet ally whose authoritarian planning system has delivered a remarkable economic boom. Soviet aid and state-led development transformed the country into a regional power, while the ruling party presents its growth as proof that the revolution can overcome poverty and division.\n\nThe Soviet Union's crisis now threatens Ethiopia's chief patron and source of support. Addis Ababa must preserve its gains and its security while deciding how much to rely on a weakening Moscow—or whether a new alignment can protect the republic without undoing its socialist project."
  ETH_country_splash_picture: "GFX_ENG_country_splash_picture"
  ETH_country_splash_close_button: "Begin"
  FIN_country_splash_header: "The Republic of Finland"
  FIN_country_splash_description: "Finland's political landscape has shifted dramatically. §RRiikka Purra§W and the Finns Party have risen from populist outsiders to the leading force in government, part of the same continental wave that has swept the right to power across Europe.\n\nBut Finland's geopolitical reality is unique. Sharing one of Europe's longest borders with Russia, the Finns have always lived in the shadow of their eastern neighbour. Historic neutrality—once the cornerstone of Finnish foreign policy—is under existential strain as Russian aggression reshapes the security landscape.\n\nFrom the forests of Karelia to the corridors of Brussels, Finland must decide: hold fast to neutrality, or take its place on the front line of a new European order?"
  FIN_country_splash_picture: "GFX_ENG_country_splash_picture"
  FIN_country_splash_close_button: "Begin"
  ICE_country_splash_header: "The Republic of Iceland"
  ICE_country_splash_description: "Iceland has always been a world apart—a volcanic island republic of barely 400,000 souls, perched on the edge of the Arctic Circle. For most of its modern history, it has been content to fish, export aluminium, and stay out of trouble.\n\nBut the world is changing, and even Iceland cannot remain untouched. The strategic importance of the North Atlantic is rising as great powers eye Arctic shipping routes and resources. NATO membership, once taken for granted, is now debated openly. And the question of EU membership—shelved after the 2008 financial crisis—has returned to the political agenda.\n\nFor a nation this small, every choice carries outsized consequences. Iceland's future may be shaped less by its own designs than by the ambitions of far larger powers."
  ICE_country_splash_picture: "GFX_ENG_country_splash_picture"
  ICE_country_splash_close_button: "Begin"
  ITA_country_splash_header: "The Socialist Republic of Italy"
  ITA_country_splash_description: "Italian fascism collapsed in 1942 as Soviet forces swept down the peninsula. Unlike revolutionary Germany, Italy became a centralized dictatorship and one of Moscow's most dependable European clients. Its government maintains control through state power, patronage, and trade with the Soviet bloc.\n\nItaly is not ready for a full-scale war against Germany. Its leaders are rebuilding the armed forces and weighing the price of loyalty to Moscow as the Soviet front deteriorates. Rome may be called upon to defend the order that made it powerful before it has recovered enough to do so."
  ITA_country_splash_picture: "GFX_ITA_country_splash_picture"
  ITA_country_splash_close_button: "Begin"
  NOR_country_splash_header: "The Kingdom of Norway"
  NOR_country_splash_description: "Norway stands apart from its Scandinavian siblings—fabulously wealthy from North Sea oil, defiantly outside the European Union, yet firmly entrenched in NATO. The Government Pension Fund Global, the world's largest sovereign wealth fund, gives Oslo a financial cushion that most nations can only dream of.\n\nBut wealth does not insulate Norway from the forces reshaping Europe. Immigration debates, the future of the monarchy, and the perennial question of EU membership dominate public discourse. Meanwhile, whispers of a renewed Scandinavian union with Sweden evoke memories of a shared past that some believe could shape a shared future.\n\nNorway's challenge is one of choice: it has the resources to go almost any direction. The question is which direction it will choose."
  NOR_country_splash_picture: "GFX_ENG_country_splash_picture"
  NOR_country_splash_close_button: "Begin"
  SWE_country_splash_header: "The Kingdom of Sweden"
  SWE_country_splash_description: "For decades, Sweden was synonymous with the 'Swedish Model'—a generous welfare state, progressive social values, international solidarity, and strict neutrality. That model is under siege.\n\nThe §RSweden Democrats§W, founded in the late 1980s and long shunned as extremists, have surged to political prominence on a platform of immigration restriction and northern nationalism. Decades of open-border policies have transformed Swedish society in ways that many citizens did not choose and some bitterly resent.\n\nAs an EU member grappling with gang violence, integration challenges, and an identity crisis, Sweden must decide what it wants to be. The folkhem—the 'people's home'—was built on consensus. Whether it can survive this level of polarisation remains to be seen."
  SWE_country_splash_picture: "GFX_ENG_country_splash_picture"
  SWE_country_splash_close_button: "Begin"
  SWI_country_splash_header: "The Swiss Confederation"
  SWI_country_splash_description: "Switzerland has endured for over seven centuries as a beacon of neutrality, direct democracy, and decentralised government. While empires rose and fell around it, the Alpine republic remained steadfast—banking on consensus, prosperity, and the world's willingness to leave it alone.\n\nBut the forces reshaping Europe in 2029 do not respect old arrangements. The pressures of migration, the demands of great power competition, and the erosion of the rules-based international order all test Switzerland's foundational principles.\n\nJoining the United Nations, abandoning centuries of armed neutrality, or even the unthinkable dissolution of the confederation—these are no longer hypothetical. Switzerland must decide whether its legendary independence is sustainable in a world that increasingly demands you pick a side."
  SWI_country_splash_picture: "GFX_ENG_country_splash_picture"
  SWI_country_splash_close_button: "Begin"
