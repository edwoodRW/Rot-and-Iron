l_english:
 ENG_a_country_returned:0 "A Country Returned"
 ENG_a_country_returned_desc:0 "The fighting has ended, but England must learn again how to govern itself after twenty-seven years of revolution, war, and foreign intervention."
 ENG_a_country_returned_tt:0 "Begin the reconstruction of liberated England."
 ENG_reopen_whitehall:0 "Reopen Whitehall"
 ENG_reopen_whitehall_desc:0 "Ministries, courts, and local councils must work again before any government can claim the confidence of the country."
 ENG_reopen_whitehall_tt:0 "Restore the machinery of civilian government."
 ENG_the_constitutional_question:0 "The Constitutional Question"
 ENG_the_constitutional_question_desc:0 "England has been recovered by force of arms. Its people must now decide what sort of country has been recovered."
 ENG_the_constitutional_question_tt:0 "Choose the political foundation of the restored state."
 ENG_the_crown_returns:0 "The Crown Returns"
 ENG_the_crown_returns_desc:0 "The monarchy survived in exile. Its return must now be made real in the streets, institutions, and constitutional life of Britain."
 ENG_the_crown_returns_tt:0 "Complete the Restoration settlement."
 ENG_the_peoples_constitution:0 "The People's Constitution"
 ENG_the_peoples_constitution_desc:0 "No crown, party, or foreign army can settle Britain's future alone. A free people must give the new state its legitimacy."
 ENG_the_peoples_constitution_tt:0 "Complete the democratic settlement."
 ENG_the_london_compact:0 "The London Compact"
 ENG_the_london_compact_desc:0 "Canada's transition must end in a British settlement: orderly, cautious, and strong enough to survive without foreign administrators."
 ENG_the_london_compact_tt:0 "Complete the transitional settlement."
 ENG_rebuild_the_island:0 "Rebuild the Island"
 ENG_rebuild_the_island_desc:0 "Railways, homes, factories, and the bonds of ordinary life must be restored after decades of division."
 ENG_rebuild_the_island_tt:0 "Launch a national reconstruction programme."
 ENG_the_kings_peace:0 "The King's Peace"
 ENG_the_kings_peace_desc:0 "The Crown's return will endure only if it brings restraint, service, and ordinary security rather than another attempt to rule Britain from a vanished age."
 ENG_the_kings_peace_tt:0 "Consolidate a constitutional Crown settlement."
 ENG_a_republic_rebuilt:0 "A Republic Rebuilt"
 ENG_a_republic_rebuilt_desc:0 "The new constitution must become more than a ballot held after a war. It must be a democratic state capable of rebuilding Britain in public view."
 ENG_a_republic_rebuilt_tt:0 "Consolidate the democratic settlement."
 ENG_end_the_canadian_mission:0 "End the Canadian Mission"
 ENG_end_the_canadian_mission_desc:0 "The transition was meant to be temporary. Britain must now complete the handover and ask Canada to withdraw from its last supervisory role."
 ENG_end_the_canadian_mission_tt:0 "Complete the transition to full British self-government."
 ENG_homes_for_the_returning:0 "Homes for the Returning"
 ENG_homes_for_the_returning_desc:0 "The families displaced by war and revolution cannot rebuild their lives on promises. Housing must come before ceremony."
 ENG_homes_for_the_returning_tt:0 "Begin a national housing and local infrastructure programme."
 ENG_restore_the_railways:0 "Restore the Railways"
 ENG_restore_the_railways_desc:0 "The island's cities, ports, and counties must be connected again before the country can begin to feel like a shared political life."
 ENG_restore_the_railways_tt:0 "Rebuild England's damaged transport links."
 ENG_reopen_the_yards:0 "Reopen the Yards"
 ENG_reopen_the_yards_desc:0 "Workshops and shipyards cannot remain monuments to the war. Their workers must have a role in the peace that follows."
 ENG_reopen_the_yards_tt:0 "Restart industry and employment in the old industrial centres."
 ENG_the_reconstruction_settlement:0 "The Reconstruction Settlement"
 ENG_the_reconstruction_settlement_desc:0 "Recovery must become more than emergency repair: a public commitment that the restored state will visibly rebuild the lives it disrupted."
 ENG_the_reconstruction_settlement_tt:0 "Complete the first stage of national reconstruction."
 ENG_offer_a_federal_union:0 "Offer a Federal Union"
 ENG_offer_a_federal_union_desc:0 "Scotland will not return to an old centralised settlement. A new union must rest on a Scottish Parliament, shared institutions, and voluntary consent."
 ENG_offer_a_federal_union_tt:0 "Offer Scotland a voluntary federal Union."
 ENG_ratify_the_federal_union:0 "Ratify the Federal Union"
 ENG_ratify_the_federal_union_desc:0 "Edinburgh has accepted the offer. The constitutional guarantees must now be placed beyond the reach of temporary governments."
 ENG_ratify_the_federal_union_tt:0 "Reunite Scotland and England under a negotiated federal settlement."
 ENG_demand_scottish_return:0 "Demand Scotland's Return"
 ENG_demand_scottish_return_desc:0 "The Restoration is not complete while the northern kingdom remains outside it. Edinburgh will be offered one final choice."
 ENG_demand_scottish_return_tt:0 "Gain a war goal against Scotland."
 ENG_a_union_of_equals:0 "A Union of Equals"
 ENG_a_union_of_equals_desc:0 "The Union has returned through Scottish consent. Its institutions must now prove that Scotland has joined a partnership, not disappeared into England."
 ENG_a_union_of_equals_tt:0 "Implement the guarantees of the new Union."
 ENG_two_nations_one_island:0 "Two Nations, One Island"
 ENG_two_nations_one_island_desc:0 "Scotland has chosen to remain independent. England must decide whether its future is shaped by grievance or by a durable relationship between neighbours."
 ENG_two_nations_one_island_tt:0 "Pursue a stable settlement with independent Scotland."
