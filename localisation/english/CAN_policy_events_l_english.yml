l_english:
 CAN_policy.1.t:0 "The Black Plan"
 CAN_policy.1.d:0 "Conrad Black's government has chosen a hard Canadian road: protected industry, guarded resources, and a Dominion that will no longer mortgage its future to the dreams of exile politicians. The programme will be expensive, but its authors promise that Canada will emerge stronger and more independent."
 CAN_policy.1.a:0 "Canada must stand on its own feet."
 CAN_policy.2.t:0 "The Mogg Plan"
 CAN_policy.2.d:0 "Jacob Rees-Mogg has won the argument. Canadian finance, shipyards, and manpower are to be directed toward the long-promised return across the Atlantic. To its supporters, this is a national duty. To its critics, it is an empire's old war financed by a new country."
 CAN_policy.2.a:0 "Prepare the way home."