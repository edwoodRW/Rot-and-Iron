# CAN_borispm — Boris Platform and Defence Framework Events
###########################################################
CAN_borispm.platform.t:0 "Boris Speaks"
 CAN_borispm.platform.d:0 "§IToronto, Queen Street West§!\n\nHe didn't ask for a podium. He didn't prepare a speech. He simply strolled out of NCP headquarters, spotted the crowd huddled in the cold, and started talking.\n\nBy the time the press core scrambled onto the scene, there were four thousand people standing shoulder to shoulder.\n\nBoris Johnson — hair gloriously dishevelled, coat slightly wrong for the climate, gesturing wildly with his arms — looks out at them. Yet beneath the usual theatricality, there is an expression nobody in Canadian politics has quite seen on him before. Something quieter. Something entirely resolute.\n\n§R\"I was... er, twenty-five years old when I left London. Packed two bags. Had absolutely no earthly idea where I was going! Ended up right here. And I want to tell you something that Jacob Rees-Mogg will never, ever tell you — because Jacob, frankly, has never actually looked at this country! Canada is... well, it’s extraordinary! Not because of what it can do for Britain, or some distant imperial pipe-dream, but because of what it IS! Because of the people I’ve met here over a quarter of a century — people who are tough, terribly funny, generous, and completely, blissfully unimpressed by anyone who thinks a title or a pompous accent makes them special! Jacob says we didn't come here to become Canadian. Well, blast it, I did! I AM a Canadian! My children are Canadian! And I will not stand by and watch this magnificent country bleed for some... some phantom yesterday that nobody can give back! Our way is here. Our future is here. And it is going to be... absolutely, blindingly magnificent!\"§!\n\nThe crowd goes dead silent for a singular moment. Then it erupts."
 CAN_borispm.platform.a:0 "Canada has spoken."

 CAN_borispm.platform_reaction.t:0 "The World Reacts to Boris"
 CAN_borispm.platform_reaction.d:0 "§IOttawa and London§!\n\nThe speech travels faster than anyone in government expected. Across Canada, it is watched, shared, and endlessly debated over kitchen tables. People who have never given a toss about day-to-day politics find themselves staring at a clip of a rumpled, hand-waving British exile standing on Queen Street, saying the exact things they have always felt, but never heard from a career politician. In London — inside the gloomy bunkers of Starmer's regime — the broadcast arrives well before breakfast.\n\nThe official response from the mainland is swift, furious, and dripping with venom: §R\"Boris Johnson is a traitor to the republic, a traitor to the exile community, and a useful idiot for the forces seeking to permanently abandon British sovereignty. His words bring shame on every exile who has sacrificed to keep the flame of legitimate government alive.\"§!\n\nIn Ottawa, Boris's chief aide reads him the statement over the phone line. Boris listens carefully, adjusting his spectacles.\n\n§R\"Right,\" he snorts softly. \"Well... gosh. At least we know where the old chaps stand, eh?\"§!"
 CAN_borispm.platform_reaction.a:0 "Let them talk. Canada is listening."

 CAN_borispm.defence_framework.t:0 "Two Neighbours"
 CAN_borispm.defence_framework.d:0 "§IOttawa, Cabinet Room§!\n\nThe agreement is twelve pages long and classified at the absolute highest level. But its fundamental meaning is strikingly clear: for the first time since the Great Exile, Canadian and American military officers are sitting in the very same room, leaning over the same tactical maps, planning for the exact same contingencies. Not an official alliance — both sides are immensely careful about that particular word — but something that may, with enough time, patience, and goodwill, become one.\n\nBoris Johnson finishes reading the summary briefing at his desk, running a hand through his hair. His Chief of Staff watches him closely. §R\"How do you feel, sir?\"§!\n\nBoris sets the folder down and looks out the window at Ottawa — grey, biting, and entirely itself.\n\n§R\"Like something that should have been done twenty bloody years ago has finally been sorted,\" he says with a heavy exhale. \"Which is mostly relief, to be honest. With a small, lingering amount of 'what on earth took us so long' underneath.\"§! He reaches for the telephone receiver.\n\n§R\"Get me the Prime Minister. I want to give him the news myself.\"§!"
 CAN_borispm.defence_framework.a:0 "Two neighbours. One future."

 CAN_borispm.becomes_pm.t:0 "Johnson's Canada"
 CAN_borispm.becomes_pm.d:0 "§IOttawa, Swearing-In Ceremony§!\n\nBoris Johnson is officially sworn in as Prime Minister of Canada on a crisp, grey January morning. The ceremony is considerably smaller and far less grandiose than usual — he explicitly asked for it that way. Afterward, he walks back through the corridors to the office — his office now — and sits down behind the heavy desk where Conrad Black sat for so many years. The framed photograph that Black always kept on display is gone. In its place, Boris sets down a small, worn frame he has carried everywhere: a rain-slicked street in Kensington, taken in 1999, the exact day his family left.\n\nHis aide pokes his head through the doorway.\n\n§I\"Sir. President Turner's office on line one.\"§!\n\n§R\"Right-o. Put her through, would you?\"§!\n\n§I\"And the Scottish Minister's office called to extend their congratulations.\"§!\n\n§R\"Ah, superb! Call him back personally, if you please. Tonight, if we can manage it.\"§!\n\n§I\"And the press pack outside are clamouring to know your immediate priorities.\"§!\n\nBoris looks back out the window at Ottawa — grey, freezing, and entirely unbothered. A wide, irrepressible grin spreads across his face.\n\n§R\"Tell them Canada is going to be fine,\" he says softly. \"Tell them we are going to be absolutely... roaringly magnificent.\"§!\n\nHe lifts the telephone handset.\n\nHe begins."
 CAN_borispm.becomes_pm.a:0 "Canada's future starts now."

###########################################################
# CAN_policy — Black Plan and Mogg Plan Narrative Events
###########################################################

 CAN_policy.1.t: "Canada First"
 CAN_policy.1.d: "§IOttawa, Cabinet Room§! Conrad Black addresses his cabinet for the first time since the Grand Compromise. The room is full. Ministers and deputy ministers and senior advisors. Rees-Mogg's people on one side. Black's people on the other. Boris Johnson, as always, sitting slightly apart from both.\n\n§R"What we are embarking on is not a rejection of our obligations to the exile community. It is a recognition that those obligations can only be met by a Canada that is strong, solvent, and genuinely sovereign. We will build that Canada first. We will build it for Canadians. We will build it because without it, everything else is built on sand. This is the Black Plan. This is what we are doing. I expect every minister at this table to understand it, support it, and implement it without reservation."§! He looks around the table. Rees-Mogg meets his gaze steadily. Says nothing. Boris Johnson is looking at his hands. He is, very quietly, smiling."
 CAN_policy.1.a: "Canada first. Always."

 CAN_policy.2.t: "The Hour Has Come"
 CAN_policy.2.d: "§IHalifax, IRP Headquarters§! Jacob Rees-Mogg does not give many speeches. He finds them, he has said privately, somewhat vulgar — the reduction of complex argument to crowd-pleasing simplicity. He prefers the written word. The considered position paper. The formal address to a select audience.But tonight, in the Halifax headquarters of the Imperial Restoration Party, looking out at a room full of exile community leaders who have been waiting for this moment their entire adult lives, he makes an exception.\n\n§R"Twenty-seven years ago we left. We left with the clothes on our backs and the photographs in our hands and the absolute certain knowledge that we would return.\n\nMany of us have doubted. Many of us have wondered whether the cause was possible. Whether the world had moved on. Whether the Britain we remembered was a Britain that still existed to be returned to. I never doubted. Not once.\n\nThe hour has come. Canada will be the sword of restoration. Halifax will be the launching point of liberation. And we — every man and woman in this room — will live to see the Union Jack fly over Westminster again. We are going home."§! The room erupts. Somewhere in Ottawa, Boris Johnson's phone buzzes with the news alert. He reads it once. Sets his phone face down on his desk. Sits for a long time."
 CAN_policy.2.a: "The time has come. We are going home."

