l_english:
  prc_focus.1.t: "The Mandate of the New Era"
  prc_focus.1.d: "There was no applause in the room. There seldom is anymore when the real decisions are made. Only the soft drag of chairs, the scratch of pens against prepared paper, and the hush that falls when men who command a fifth of mankind begin to speak in the language of inevitability.\n\nThe slogans come first because they must. §RRejuvenation.§! §RSecurity.§! §RSelf-reliance.§! The words have been repeated so often that they now hang over Zhongnanhai like weather, less debated than inhaled. But beneath them lies something colder. The old bargain that made the age of growth possible is fraying. Property no longer rises forever. Birth rates fall. Foreign capital asks harder questions. American fleets still cross the Pacific as if history has not moved at all.\n\nSo the Party has made its judgment. If prosperity will no longer silence uncertainty by itself, then discipline will. If the world will not yield its commanding heights, then China must build its own. A new era, in official language, sounds almost serene. In practice it means every ministry, every province, every boardroom and barracks being told the same thing: the improvisations are over. The centre is speaking in full sentences again."
  prc_focus.1.a: "The century will not wait for doubters."

  prc_focus.10.t: "A Screen Between State and Society"
  prc_focus.10.d: "The memorandum is dry, technical, and full of harmless language: interoperability standards, data governance architecture, secure municipal integration, trusted platform oversight. It does not say what everyone in the room understands. It does not need to.\n\nA state that can see everything does not need to shout. It can sort, compare, flag, delay, deny, and gently redirect until resistance becomes not impossible, but exhausting. The old police state kicked in doors. The modern one updates databases. It learns a citizen's habits, friendships, purchases, travel patterns, moods. It decides who is merely inconvenient, who is suspect, and who may never even know they were once considered dangerous.\n\nOfficials frame it as efficiency. Cadres praise its contribution to public order. Technocrats insist this is simply what governing a civilisation-sized country looks like in the digital age. Perhaps they even believe it. Yet as one more provincial dashboard flickers to life and one more urban network begins feeding the centre, a less public truth settles in: China is not merely building better administration. It is building a political nervous system."
  prc_focus.10.a: "Let nothing move unseen."

  prc_focus.20.t: "Silicon and Steel"
  prc_focus.20.d: "In another age, a shortage of advanced chips would have been treated as a commercial inconvenience, an irritation for procurement officers and factory managers. That age is gone. Now the absence of a lithography machine or a sanctions-proof design chain is spoken of in the same breath as sea lanes, missile ranges, and food security.\n\nThe planners know the truth even when the newspapers obscure it. A country that can assemble the world's consumer goods but not guarantee the brains inside its own systems remains vulnerable at the highest level. Each imported wafer, each foreign patent, each interdicted component is a reminder that wealth without technical sovereignty can still be throttled.\n\nSo the directive goes out: subsidise, copy, recruit, poach, reverse engineer, endure waste, and try again. Build national champions whether they deserve the name yet or not. Accept duplication, bureaucracy, and fraud if necessary, because dependency is worse. Somewhere in a clean room still smelling of fresh paint, an engineer lowers a visor and begins work under fluorescent light. Around him hangs not just industrial policy, but state ambition condensed into dustless air."
  prc_focus.20.a: "What we cannot buy, we will force into existence."

  prc_focus.30.t: "Beyond the First Island Chain"
  prc_focus.30.d: "For generations the map taught caution. Coastal defence. Near seas. Limited reach. A continental power learning, slowly and suspiciously, how to think in maritime terms. But the map on the wall in the admiral's office is different now. It stretches far past the littoral, past Taiwan, past the South China Sea, across the Indian Ocean and into waters where Chinese power once arrived only in cargo manifests and diplomatic speeches.\n\nSteel answers doctrine. New hulls slide into the water beneath banners and cameras, but the real transformation is less photogenic. Logistics tables grow thicker. Replenishment routes are gamed out in detail. Officers who once planned for coastal denial now argue over persistent presence, escort formations, and what it means to defend interests thousands of miles from home.\n\nA navy built for the shoreline is a shield. A navy built for oceans is a declaration. Not necessarily of war, not yet, but of intention. The old maritime order assumed China would remain a giant trading state protected, ironically, by a system it did not control. That assumption is being scrapped in drydock."
  prc_focus.30.a: "The ocean, too, can be taught obedience."

  prc_focus.40.t: "The Question with No Expiry Date"
  prc_focus.40.d: "Every generation of the People's Republic has inherited the same sentence and been unable to finish it. Taiwan remains unresolved. It has been spoken in whispers, in tirades, in white papers, in military briefings, in school textbooks, in speeches crafted for foreign ears and speeches crafted for domestic memory. Time changes the vocabulary, not the fact.\n\nNow the problem sharpens. The island is wealthier, more armed, more politically separate in instinct than Beijing likes to admit. The Americans are inconsistent but present. The generals caution that modern war is not a parade route. The nationalists reply that delay is not peace, only erosion disguised as patience. And above all hangs the fear that the longer history is left open, the more permanent the separation will begin to feel.\n\nSo the files are opened again. Shipping tonnage. Air superiority windows. Ammunition expenditure. Financial sanctions scenarios. Civilian morale estimates. Propaganda sequencing. Nobody in the room mistakes planning for decision. Yet planning has its own gravity. Once a state begins arranging the instruments of a future crisis in neat columns, the crisis itself starts to become imaginable."
  prc_focus.40.a: "Prepare everything. Promise nothing."

  prc_focus.100.t: "The Shape of the Century"
  prc_focus.100.d: "The speeches will say that history has chosen wisely. They always do. Cameras will pan across soldiers, workers, children with flags, engineers in clean suits, party secretaries standing with the neutral expressions of men who know their faces are part of the architecture now. On the review stand, the leadership will speak of peace, development, stability, and shared destiny. Every phrase will be polished smooth enough for export.\n\nBut beneath the ceremony lies the harder meaning of what has been built. Not a temporary campaign. Not a single programme. A system. A China more centralised than at any point in decades, more capable of supervising its own population, more determined to harden its industry against foreign coercion, more willing to turn commercial reach into geopolitical leverage, and more confident that military power will eventually decide what diplomacy cannot.\n\nThis does not guarantee triumph. Systems this ambitious also create brittleness, resentment, and illusions of control. Yet for now the machine is functioning and the men at its summit believe, perhaps sincerely, that they are not merely governing a state but drafting the operating manual for a new age. Whether the world calls that order, dominance, or merely exhaustion will be decided later. The centre has already made its choice."
  prc_focus.100.a: "Let the world adjust."
