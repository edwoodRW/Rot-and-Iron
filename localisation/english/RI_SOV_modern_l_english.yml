l_english:
 RI_SOV_union_must_survive:0 "The Union Must Survive"
 RI_SOV_union_must_survive_desc:0 "For decades, the Union survived by insisting that tomorrow would be better than today. Now the factories are failing, the army is stretched across two frontiers, and the republics are beginning to wonder whether Moscow can still protect them. Rashkin will address the nation and promise that the Soviet state will endure, even if keeping that promise requires remaking it."
 RI_SOV_emergency_politburo_session:0 "An Emergency Session of the Politburo"
 RI_SOV_emergency_politburo_session_desc:0 "The Politburo will meet behind closed doors while the country waits for orders. Reformers will demand an accounting, generals will demand authority, and the old guard will insist that hesitation is treason. Whatever emerges from the chamber, the meeting will make one thing clear: the Union is no longer governed by a single will."
 RI_SOV_state_of_union_address:0 "The State of the Union Address"
 RI_SOV_state_of_union_address_desc:0 "The official reports have become too absurd even for the censors to defend. Empty shelves, missing equipment and stalled trains are no longer isolated failures but symptoms of a state losing control of its own machinery. The government will admit enough of the truth to demand sacrifice, while carefully avoiding the question of who allowed the crisis to grow."
 RI_SOV_mobilise_the_republics:0 "Mobilise the Republics"
 RI_SOV_mobilise_the_republics_desc:0 "Moscow will summon the republics to an emergency conference and ask them to provide soldiers, grain, fuel and skilled workers. The language will be one of solidarity, but every delegate will understand the bargain: the centre wants resources now and offers protection later. Cooperation may preserve the Union, yet coercion may convince the periphery that it is already finished."
 RI_SOV_five_year_emergency_programme:0 "The Five-Year Emergency Programme"
 RI_SOV_five_year_emergency_programme_desc:0 "The old five-year plans promised abundance through statistics and slogans. This one will promise only survival. Civilian orders will be delayed, unfinished projects will be abandoned, and every ministry will be measured by how much steel, ammunition and power it can place in the hands of a state preparing for catastrophe."
 RI_SOV_defend_every_soviet_citizen:0 "Defend Every Soviet Citizen"
 RI_SOV_defend_every_soviet_citizen_desc:0 "Shelters will be cleared, hospitals placed on emergency footing and evacuation routes marked across the great cities. The campaign is presented as proof that the state values every citizen, but its deeper purpose is to keep panic from becoming a second enemy. A population that believes it has been abandoned will not defend the Union for long."
 RI_SOV_union_will_not_fall:0 "The Union Will Not Fall"
 RI_SOV_union_will_not_fall_desc:0 "The speeches are ready, the banners are printed, and the ministries have been ordered to report success whether they have achieved it or not. Beneath the ceremony lies a desperate calculation: if the people can be persuaded that the Union still has a future, they may give it the time required to find one. If they cannot, every emergency measure will only hasten the collapse."
 RI_SOV_reform_the_politburo:0 "Reform the Politburo"
 RI_SOV_reform_the_politburo_desc:0 "The men who built their careers by never contradicting the centre are suddenly being asked to solve problems they spent years denying. Younger administrators and regional specialists will be brought into the leadership, not because the old guard has discovered humility, but because there are no longer enough loyalists who know how anything works. Reform may save the system, or reveal how little of it remains."
 RI_SOV_anti_corruption_directorate:0 "The Anti-Corruption Directorate"
 RI_SOV_anti_corruption_directorate_desc:0 "A new directorate will investigate vanished funds, phantom factories and contracts awarded to friends of officials who have already fled. Its reports will be uncomfortable, but its powers will be even more so. The government must decide whether the investigation is meant to cleanse the state or merely provide a list of scapegoats for the next crisis."
 RI_SOV_merit_before_loyalty:0 "Merit Before Loyalty"
 RI_SOV_merit_before_loyalty_desc:0 "Engineers, economists and officers who were once considered politically unreliable will be invited back into public service. Their knowledge is needed, but their independence is precisely what makes the Party fear them. The Union can no longer afford to promote only the obedient; neither can it afford to discover that its experts have stopped believing in it."
 RI_SOV_reformist_memorandum:0 "The Reformist Memorandum"
 RI_SOV_reformist_memorandum_desc:0 "The memorandum has circulated for weeks in copied pages passed between ministries, barracks and university offices. It calls for controlled elections inside the Party, genuine regional representation and an economy allowed to reward results rather than connections. To its authors, this is a final attempt to save socialism; to its opponents, it is the first draft of the Union's obituary."
 RI_SOV_extraordinary_party_congress:0 "The Extraordinary Party Congress"
 RI_SOV_extraordinary_party_congress_desc:0 "Delegates will arrive in Moscow under guard, carrying mandates written by committees that do not trust one another. The Congress is advertised as a demonstration of unity, but every speech will be treated as a declaration of faction. If the reformers win, they may inherit a broken state; if they lose, they may decide that the only road left is outside the Party."
 RI_SOV_new_soviet_consensus:0 "A New Soviet Consensus"
 RI_SOV_new_soviet_consensus_desc:0 "The republics want guarantees that their languages, budgets and local governments will survive the emergency. The reformers want a Union whose institutions are strong enough to act without resorting to fear. A compromise is drafted in careful language, leaving every side convinced that it has conceded nothing and gained everything."
 RI_SOV_new_soviet_economy:0 "A New Soviet Economy"
 RI_SOV_new_soviet_economy_desc:0 "The Soviet Union still possesses oil, minerals, farmland and an educated population on a scale few countries can match. What it lacks is a system capable of turning those advantages into reliable output. The new economic programme will ask whether the state can modernise without admitting that its old methods were the cause of the decline."
 RI_SOV_revive_soviet_industry:0 "Revive Soviet Industry"
 RI_SOV_revive_soviet_industry_desc:0 "Across the Union, plants remain open on paper while their machines wait for parts, power or workers who have already been conscripted. The recovery commission will close dead capacity, consolidate production and give functioning managers authority over local party officials. It will be unpopular, disruptive and possibly the first industrial policy in years based on what actually exists."
 RI_SOV_ural_industrial_corridor:0 "The Ural Industrial Corridor"
 RI_SOV_ural_industrial_corridor_desc:0 "The Urals are far enough from the western front to offer security, yet close enough to the old industrial heartlands to inherit their skilled labour and rail connections. New machine plants and arms works will be built along the corridor. If the west falls, this region will become the workshop of the surviving Union; if it does not, it may become the foundation of a different one."
 RI_SOV_siberian_development_programme:0 "The Siberian Development Programme"
 RI_SOV_siberian_development_programme_desc:0 "For generations, Siberia was treated as a place to send prisoners, extract resources and forget. Now planners are drawing cities, rail spurs and processing plants across maps that were once blank. Regional leaders know that Moscow needs their resources more than ever, and they intend to exchange them for influence before the centre remembers how to say no."
 RI_SOV_technological_revolution:0 "The Technological Revolution"
 RI_SOV_technological_revolution_desc:0 "The Union can still produce brilliant scientists, but brilliance is wasted when laboratories lack components and discoveries disappear into ministerial filing cabinets. Research institutes will be tied directly to industry and defence, with funding measured against results rather than political loyalty. The danger is obvious: once knowledge begins moving freely, the state may find it harder to control where ideas go next."
 RI_SOV_reconnect_the_union:0 "Reconnect the Union"
 RI_SOV_reconnect_the_union_desc:0 "The Union is held together by railways that do not run on time, telephone lines that fail between cities and ministries that still send urgent orders by courier. Reconnecting the country is not merely an infrastructure project; it is an attempt to restore the idea that Moscow and the republics inhabit the same political space. Every new link will carry both supplies and expectations."
 RI_SOV_digital_question:0 "The Digital Question"
 RI_SOV_digital_question_desc:0 "The Party understands that a modern economy cannot be built on a network designed primarily to watch its own citizens. Engineers want access, scientists want uncensored research and the security services want a system that can be closed at the first sign of dissent. The question is not whether the Soviet Union will enter the digital age, but whether it will enter as its master or its prisoner."
 RI_SOV_soviet_internet_act_desc:0 "The Internet Act will establish the rules under which every message, transaction and scientific exchange in the Union takes place. The open network promises innovation but threatens the monopoly of the official narrative; the state network offers stability at the price of suspicion; the sovereign network promises safety by making the country its own locked room. The choice will outlive the officials who make it."
 RI_SOV_connect_the_republics:0 "Connect the Republics"
 RI_SOV_connect_the_republics_desc:0 "Fibre-optic cables will follow the railways, linking capitals, factories and universities that have spent years operating as isolated islands. The project will give the republics a voice in a common network, but it will also make their grievances impossible to hide from one another. Moscow may discover that connection creates solidarity in more than one direction."
 RI_SOV_national_cyber_directorate:0 "The National Cyber Directorate"
 RI_SOV_national_cyber_directorate_desc:0 "The first attacks on the new networks will not look like invasions. They will be missing shipments, corrupted records and machines that fail at exactly the wrong moment. A National Cyber Directorate will bring the military, security services and civilian engineers under one command, creating a shield for the Union while giving the state a new instrument of internal control."
 RI_SOV_digital_soviet_union:0 "The Digital Soviet Union"
 RI_SOV_digital_soviet_union_desc:0 "The first stage of the digital transformation is complete. A worker in Novosibirsk can now speak to a planner in Moscow, a scientist in Kyiv can reach a laboratory in Leningrad, and a regional official can no longer claim that an order was lost in transit. The network promises a more capable Union, but it also gives millions of people the means to compare their lives with one another."
 RI_SOV_rebuild_transport_network:0 "Rebuild the Soviet Transport Network"
 RI_SOV_rebuild_transport_network_desc:0 "Industry and armies cannot move without railways. Every improvement will be measured by whether people, fuel and equipment can reach the front before the opportunity is lost. The work will be slow, expensive and invisible until the day the trains fail to arrive."
 RI_SOV_trans_siberian_modernisation:0 "The Trans-Siberian Modernisation"
 RI_SOV_trans_siberian_modernisation_desc:0 "The eastern lifeline must carry the burden of a continental war. The eastern regions will carry more of the Union's industrial burden as the western front becomes increasingly dangerous. The project will bring prosperity to the east, but also a new confidence that Moscow may find difficult to contain."
 RI_SOV_red_army_reborn_desc:0 "Numbers alone cannot win a modern war. The reform will be judged on the battlefield, where paperwork and promises have no value unless they produce faster decisions. The soldiers will need more than equipment; they will need to believe that the men giving orders understand the war."
 RI_SOV_general_staff_emergency_conference:0 "The General Staff Emergency Conference"
 RI_SOV_general_staff_emergency_conference_desc:0 "Commanders will confront the truth about the fronts. Commanders will have to exchange political certainty for professional judgement if the army is to recover its initiative. The reform will succeed only if commanders are permitted to act before the next order arrives from Moscow."
 RI_SOV_zhukov_protocol:0 "The Zhukov Protocol"
 RI_SOV_zhukov_protocol_desc:0 "Command structures must become faster and more accountable. Its success will be measured not by the announcement, but by what changes when the first crisis arrives."
 RI_SOV_remove_incompetent_commanders:0 "Remove the Incompetent Commanders"
 RI_SOV_remove_incompetent_commanders_desc:0 "Failure in command has consequences. Its success will be measured not by the announcement, but by what changes when the first crisis arrives."
 RI_SOV_unified_command_system:0 "The Unified Command System"
 RI_SOV_unified_command_system_desc:0 "The fronts must share information and purpose. Its success will be measured not by the announcement, but by what changes when the first crisis arrives."
 RI_SOV_modern_general_staff:0 "The Modern General Staff"
 RI_SOV_modern_general_staff_desc:0 "A professional staff can turn a retreat into a defence. Commanders will have to exchange political certainty for professional judgement if the army is to recover its initiative. The reform will succeed only if commanders are permitted to act before the next order arrives from Moscow."
 RI_SOV_western_defence_line:0 "The Western Defence Line"
 RI_SOV_western_defence_line_desc:0 "Every kilometre bought is another day to reorganise. The line is not expected to stop every attack, but it can buy the time needed to reorganise the forces behind it. The fortifications will not make the frontier safe, but they may make its loss less sudden."
 RI_SOV_moscow_defensive_ring:0 "The Moscow Defensive Ring"
 RI_SOV_moscow_defensive_ring_desc:0 "The capital will not be left undefended. Its success will be measured not by the announcement, but by what changes when the first crisis arrives."
 RI_SOV_modernise_armed_forces:0 "Modernise the Armed Forces"
 RI_SOV_modernise_armed_forces_desc:0 "Armour, aircraft and communications must be integrated. Modernisation will expose how much of the existing arsenal is obsolete, improvised or quietly missing."
 RI_SOV_two_front_doctrine:0 "The Two-Front Doctrine"
 RI_SOV_two_front_doctrine_desc:0 "Germany and China cannot be treated as separate emergencies. The doctrine will be tested against two enemies, two distances and a leadership that still distrusts initiative."
 RI_SOV_diplomatic_offensive:0 "The Soviet Diplomatic Offensive"
 RI_SOV_diplomatic_offensive_desc:0 "Isolation is another enemy. Moscow will offer cooperation where it can and pressure where it must, hoping to keep the Union from facing its enemies alone. Every promise made abroad will be weighed against the question of whether the Soviet government can keep it."
 RI_SOV_resistance_pact:0 "The Soviet Resistance Pact"
 RI_SOV_resistance_pact_desc:0 "Our allies must know that the Union still stands. The remaining partners will be asked to commit more than statements, supplies and intelligence before the crisis deepens. The allies will want proof that Moscow can still send aid, not another declaration that it intends to do so."
 RI_SOV_international_socialist_appeal:0 "The International Socialist Appeal"
 RI_SOV_international_socialist_appeal_desc:0 "Socialists everywhere must understand what is at stake. Its success will be measured not by the announcement, but by what changes when the first crisis arrives."
 RI_SOV_message_to_washington:0 "A Message to Washington"
 RI_SOV_message_to_washington_desc:0 "Even rivals can recognise a common danger. The approach will be cautious, since even a limited channel can be mistaken for weakness by friends and enemies alike. The Americans will listen for weakness in every carefully chosen word."
 RI_SOV_nuclear_question:0 "The Nuclear Question"
 RI_SOV_nuclear_question_desc:0 "The world must remember the cost of attacking the Union. Strategic power remains one of Moscow's few unquestioned advantages, but using it as leverage carries consequences of its own. The arsenal can deter an enemy, but it cannot repair the factories or reunite a divided leadership."
 RI_SOV_future_of_the_union:0 "The Future of the Union"
 RI_SOV_future_of_the_union_desc:0 "The emergency has passed. Now the political question returns. The choice will decide whether the emergency produces a harder Union, a reformed Union or a renewed revolutionary project."
 RI_SOV_rashkin_holds:0 "Rashkin Holds: The Soviet Fortress"
 RI_SOV_rashkin_holds_desc:0 "The existing leadership will retain control. The state will become more centralised and more militarised, gaining speed at the cost of political flexibility. Rashkin will call the centralisation necessary; his enemies will call it the final stage of paralysis."
 RI_SOV_emergency_decree:0 "The Emergency Decree"
 RI_SOV_emergency_decree_desc:0 "Survival requires total mobilisation. Its success will be measured not by the announcement, but by what changes when the first crisis arrives."
 RI_SOV_reform_coup:0 "The Reform Coup: A New Union"
 RI_SOV_reform_coup_desc:0 "The generals and reformers will remove a failing leadership. The measure will test whether the Soviet system can renew itself without surrendering control of the Union. The officers may remove one government, but they will inherit every crisis that government failed to solve."
 RI_SOV_removal_of_rashkin:0 "The Removal of Rashkin"
 RI_SOV_removal_of_rashkin_desc:0 "The Union can change without surrendering its sovereignty. The state will become more centralised and more militarised, gaining speed at the cost of political flexibility. Its success will be measured not by the announcement, but by what changes when the first crisis arrives."
 RI_SOV_red_renewal:0 "The Red Renewal"
 RI_SOV_red_renewal_desc:0 "The revolution will be renewed rather than abandoned. The movement will seek strength in revolutionary conviction, asking the population to accept sacrifice in exchange for a new beginning. The new movement will promise that the revolution has not failed, only that its guardians have betrayed it."
 RI_SOV_permanent_revolution:0 "Permanent Revolution"
 RI_SOV_permanent_revolution_desc:0 "A new revolutionary wave will carry the Union forward. The promise of progress will be powerful, but so will the fear of what uncontrolled change might unleash."
 RI_SOV_digital_policy_category:0 "The Digital Freedom Debate"
 RI_SOV_open_network:0 "The Open Network"
 RI_SOV_state_network:0 "The State Network"
 RI_SOV_sovereign_network:0 "The Sovereign Network"
 RI_SOV_rotting_bureaucracy:0 "The Rotting Bureaucracy"
 RI_SOV_rotting_bureaucracy_desc:0 "The state is large, but its systems are failing."
 RI_SOV_rashkin_paralysis:0 "Rashkin's Paralysis"
 RI_SOV_rashkin_paralysis_desc:0 "The leadership hesitates while the crisis worsens. The state will become more centralised and more militarised, gaining speed at the cost of political flexibility. Its success will be measured not by the announcement, but by what changes when the first crisis arrives."
 RI_SOV_two_front_catastrophe:0 "Two-Front Catastrophe"
 RI_SOV_two_front_catastrophe_desc:0 "The army cannot coordinate two wars. Its success will be measured not by the announcement, but by what changes when the first crisis arrives."
