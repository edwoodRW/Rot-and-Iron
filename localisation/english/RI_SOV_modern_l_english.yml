 RI_SOV_opening.1.t:0 "The Union Must Survive"
 RI_SOV_opening.1.d:0 "§gTHE KREMLIN // MOSCOW§!\n\nThe factory manager had promised the workers that the parts would arrive on Monday. By Thursday, the machines were still silent, and he had stopped answering questions about the next delivery. When the evening shift gathered in the canteen to hear General Secretary Rashkin speak, several of them came straight from the queue outside the ration shop.\n\nRashkin told the country that the Soviet Union faced an emergency. Industry was struggling, corruption had weakened the state, and the armed forces needed support as danger gathered on both the western and eastern frontiers. He called on officials in Moscow and the republics to put aside their disputes, conserve resources and prepare their communities for sacrifice.\n\nSome workers applauded when he promised that the Union would protect its citizens. Others wanted to know why the shortages had been allowed to become so severe before anyone in the Kremlin would admit them. One man asked whether his son would be called up; another wanted to know if the next food delivery would arrive. The television offered no answer to either question.\n\nAfter the speech, republic officials began asking Moscow what assistance they could expect and what would be demanded in return. Within the Party, Rashkin's allies called his address a necessary show of resolve. His critics argued that a speech could not repair the institutions that had produced the crisis.\n\nThe General Secretary has asked the country to stand together. The Politburo must now decide how it intends to lead it."
 RI_SOV_opening.1.a:0 "The Union must not fall."
 RI_SOV_opening.2.t:0 "The Politburo's Divided Response"
 RI_SOV_opening.2.d:0 "§gPOLITBURO CHAMBER // EMERGENCY SESSION§!\n\nThe meeting was called to decide who would direct the Union's response to the crisis. Rashkin had expected a list of measures he could approve before the afternoon was over. Instead, the ministers brought him three proposals, and each required him to place his trust in people who had spent the morning blaming one another.\n\nThe General Secretary's supporters spoke first. They wanted the Party leadership to issue orders directly, bypassing officials who delayed or questioned them. The proposal would give Rashkin the authority to move quickly, but delegates from the republics warned that another demand from Moscow would be hard to accept when earlier requests for help remained unanswered.\n\nThe reformers wanted a commission with access to government records and the freedom to bring scientists and administrators into the emergency effort. One delegate placed a report on the table showing how long a research institute had waited for equipment while the responsible ministry certified that its work was proceeding. Rashkin's allies accused the reformers of using the crisis to weaken the Party. The reformers replied that the Party was weakening itself by refusing to listen.\n\nThe officers present offered a different plan: establish a military council to coordinate preparations and put the General Staff in closer contact with civilian ministries. Several ministers welcomed the proposal. Others asked whether soldiers should be given a greater voice in decisions that affected the whole country.\n\nBy the end of the session, no faction had persuaded the others to withdraw. The decision now rests with the leadership."
 RI_SOV_opening.2.a:0 "The General Secretary must retain authority."
 RI_SOV_opening.2.b:0 "Establish a commission for reform."
 RI_SOV_opening.2.c:0 "Entrust the emergency to a military council."
 RI_SOV_future.1.t:0 "The Future of the Union"
 RI_SOV_future.1.d:0 "§gMOSCOW // THE QUESTION OF THE UNION§!\n\nThe emergency programme has reached its final review. Ministers have brought reports on mobilisation, industry and the measures taken to connect the republics. Military planners have presented their proposals for defending a Union threatened on more than one frontier. The government has acted, but the meeting has exposed a question the emergency itself could not answer: who should shape the country that follows it?\n\nRashkin's supporters want him to retain control and build a more tightly organised Soviet state. They argue that the emergency has shown the value of discipline and that loosening Moscow's grip would invite officials and republic leaders to pursue their own interests. Their opponents point out that many of those officials have spent years protecting themselves behind the authority of the centre.\n\nReform-minded Party members believe the work of rebuilding must go further. They want a government that listens to specialists and gives the republics a stronger stake in the Union's future. Where the reform current has gained sufficient support, its members are prepared to challenge the existing leadership. The old guard regards that challenge as a threat to stability; reformers answer that stability without change is only another name for decline.\n\nA third current has gathered around calls for revolutionary renewal. Its supporters condemn the bureaucracy for losing touch with workers and reducing socialism to the defence of privileges. Some who have grown tired of the old leadership welcome their message; others fear the upheaval it could bring.\n\nThe proposals are before the leadership. Choosing one will establish the direction the government intends to take."
 RI_SOV_future.1.a:0 "Rashkin will build the Soviet fortress."
 RI_SOV_future.1.b:0 "Let the reformers make their case."
 RI_SOV_future.1.c:0 "Give the revolution a new purpose."
 RI_SOV_collapse.1.t:0 "The Union Unravels"
 RI_SOV_collapse.1.d:0 "§gCOUNCIL OF MINISTERS // MOSCOW§!\n\nThe request from a republic ministry reached Moscow with a list of questions attached. Were the promised supplies still coming? Who would pay the workers if they did not? Should local officials continue to wait for instructions from the centre? The secretary who received it had no answers, and the minister she called could offer none.\n\nSimilar messages have accumulated across the government. Confidence in the Union has fallen so far that every new order is met with doubts about whether Moscow can carry it out. Regional officials are making arrangements of their own, while Party representatives argue over whether to negotiate with them or demand obedience.\n\nAt an emergency meeting, one group of ministers proposes beginning the dissolution of the Union and addressing the status of the republics. They argue that the government must acknowledge how much authority it has lost. The announcement would carry its own cost: officials, soldiers and citizens who still depend on the Union would be left facing an uncertain future, and the proposal offers no guarantee that every republic's position can be settled immediately.\n\nOthers demand that Moscow refuse to give way. A public call for unity, they argue, could rally those who still believe the country can be held together. Their opponents ask how another appeal will succeed without the resources and trust that have already been spent.\n\nOutside the meeting, the unanswered messages continue to arrive. Inside, the ministers must decide what they will tell the country."
 RI_SOV_collapse.1.a:0 "Begin the process of dissolution."
 RI_SOV_collapse.1.b:0 "The Union must hold together."

 RI_SOV_focus_events.1.t:0 "What Moscow Asks"
 RI_SOV_focus_events.1.d:0 "The delegates had arrived with lists of their own: shortages in local hospitals, unpaid railway workers, equipment that had never reached the units it was meant to supply. Moscow's list was longer. The republics were being asked for recruits, food, fuel and the skilled workers needed to keep the emergency programme running.\n\nOne delegate asked when the promised assistance would reach his region. Another replied that his republic could send men, but not if the farms that fed them were left without labour. The official chairing the conference assured them that the burden would be shared, though he could give no date for the supplies they wanted in return.\n\nBy the end of the meeting, the delegates had agreed to take the mobilisation requests home. Some regarded the appeal as a duty to neighbours who faced the same danger. Others warned that Moscow would have to prove that solidarity ran in both directions.\n\nAt the station, one delegate folded the list he had brought with him and put it back in his case. He would still have to explain to his colleagues why so few of their questions had been answered."
 RI_SOV_focus_events.1.a:0 "The republics have heard our appeal."

 RI_SOV_focus_events.2.t:0 "A Plan for Survival"
 RI_SOV_focus_events.2.d:0 "The planning commission's new instructions reached the factory before the machinery did. Production for the emergency programme would take priority; several civilian contracts were to be postponed, and the plant's managers were to report what they could actually produce rather than what they had promised on paper.\n\nThe director read the figures twice. He had spent years sending the ministry reports that showed each target being met. Now he was being asked to explain which machines worked, which needed repairs and how much material was missing. The first honest inventory would be an admission of failure.\n\nOn the shop floor, the workers had a different concern. The new orders might keep the plant open, but nobody could say when the delayed civilian goods would reach the towns that relied on them. A foreman asked whether the new targets came with replacement parts. The director promised to make the request, then added it to a pile of requests already waiting for a reply.\n\nThe emergency plan has been issued. Its success will depend on whether the ministries can supply the factories they have ordered to work harder."
 RI_SOV_focus_events.2.a:0 "Begin with what we can actually produce."

 RI_SOV_focus_events.3.t:0 "The Shelter Beneath the School"
 RI_SOV_focus_events.3.d:0 "The caretaker had not opened the shelter beneath the school in years. When the civil defence team arrived, he led them past broken chairs and boxes of old records to a door whose lock took several minutes to turn. Inside, the air was damp, and a row of empty shelves stood where emergency supplies were supposed to be.\n\nTeachers brought pupils down to help clear the entrance while local officials drew up lists of equipment. Parents arrived later with blankets, water containers and questions about how an evacuation would work. One mother asked where her elderly father was meant to go; the official taking names promised to find out before the next meeting.\n\nThe government's civil defence campaign has put shelters, hospitals and evacuation plans back on the local agenda. In some places, people welcome the preparations as proof that someone is thinking about their safety. Elsewhere, residents see the neglected shelters as evidence of how long their warnings have been ignored.\n\nBy evening, the doorway beneath the school was clear. The shelves were still mostly empty, but the caretaker left the key with the headteacher instead of locking it away again."
 RI_SOV_focus_events.3.a:0 "Preparation begins at home."

 RI_SOV_focus_events.4.t:0 "The Missing Machinery"
 RI_SOV_focus_events.4.d:0 "The directorate's investigators went looking for a shipment of machine tools. According to the ministry's records, it had been delivered, installed and paid for. According to the factory staff, the tools had never arrived.\n\nThe plant manager produced a folder of letters sent to Moscow over the previous year. Each requested the missing equipment; each had been answered with a form insisting that the order was complete. When the investigators followed the payment, they found signatures from officials who had approved the shipment without visiting the plant.\n\nNews of the inquiry spread quickly through the ministry. Some administrators welcomed it, offering records they had previously been afraid to raise. Others complained that an investigation in the middle of an emergency would paralyse offices already struggling to meet their orders. A few began asking which files the directorate intended to examine next.\n\nThe investigators have submitted their first report. The missing machinery has not yet been recovered, and the workers who need it are still waiting. For the first time, however, the paperwork explaining its disappearance is being read by someone with the authority to ask questions."
 RI_SOV_focus_events.4.a:0 "Follow the records wherever they lead."

 RI_SOV_focus_events.5.t:0 "The Delegates Take the Floor"
 RI_SOV_focus_events.5.d:0 "The delegate had been warned to keep his remarks brief. He began by reading the approved statement of loyalty to the Union, then set it aside and told the congress what had happened when his region asked for emergency assistance. The request had passed through three offices, he said; by the time the reply arrived, the figures on which it was based were already out of date.\n\nThere was an uncomfortable silence before a delegate from another republic stood to say that the same thing had happened there. Several more followed. Party veterans objected that the meeting was being turned into a public list of failures, but younger representatives insisted that the failures had been public for years to anyone living with them.\n\nThe congress eventually agreed on a statement supporting reform and greater cooperation between the centre and the republics. It did not settle every dispute over what those reforms should mean. Delegates returned to their committees with different interpretations, and officials who had defended the old arrangements began looking for ways to preserve their influence.\n\nStill, the complaints had been heard in the chamber itself. The people who raised them would now expect more than applause."
 RI_SOV_focus_events.5.a:0 "The discussion cannot end here."

 RI_SOV_focus_events.6.t:0 "The Shift Begins Again"
 RI_SOV_focus_events.6.d:0 "For months, the workers had reported to a plant that could not operate a full shift. Components arrived late, power failed without warning, and the manager spent more time explaining missed targets than arranging production. Under the industrial revival programme, a new commission came to inspect the site and decide what could be put back to work.\n\nThe commission ordered the repair of equipment that had been left idle and brought the plant's suppliers into the same meeting as its engineers. One workshop would be consolidated with another; its staff were promised positions elsewhere, though several workers asked how long the transfer would take and whether their pay would follow them.\n\nWhen the first repaired line started, the foreman let it run for an hour before calling the manager over. Nobody wanted to announce a success that would stop the next morning. By the end of the shift, a small batch had been completed and the engineers had another list of faults to correct.\n\nThe commission's report to Moscow described progress, not a miracle. The workers wanted the same thing they had wanted before: reliable supplies, functioning machines and enough time to do their jobs."
 RI_SOV_focus_events.6.a:0 "Keep the line running."

 RI_SOV_focus_events.7.t:0 "From Laboratory to Factory"
 RI_SOV_focus_events.7.d:0 "The researchers had built a working prototype, but their earlier requests to test it in a factory had vanished between ministries. When a new industrial delegation arrived at the institute, the team brought out the correspondence along with the machine. The visitors spent almost as long reading the unanswered letters as examining the work itself.\n\nThe technological programme is intended to bring laboratories, industry and defence planners into closer contact. At their first joint meeting, the factory representatives asked for designs they could manufacture with the components available. The researchers asked for equipment, funding and permission to speak directly to the people expected to use their work.\n\nNot everyone welcomed the arrangement. An official who had supervised the old approval process warned that too much independence would make the institutes difficult to manage. The engineers answered that a discovery kept in a filing cabinet was of little use to anyone.\n\nA trial has now been arranged, and the institute has been given a contact at the plant. Whether the programme delivers more than another exchange of promises will depend on what happens after the visitors leave."
 RI_SOV_focus_events.7.a:0 "Let them put the work to use."

 RI_SOV_focus_events.8.t:0 "Who Controls the Network?"
 RI_SOV_focus_events.8.d:0 "The university technician demonstrated the problem by trying to send a set of research files to a colleague in another republic. The connection failed twice. When it finally worked, the transfer was stopped for a review that nobody in the room could explain.\n\nThe demonstration was part of a government inquiry into the Union's digital networks. Researchers and engineers argued that universities, factories and regional administrations needed faster, more reliable access to information. Without it, they said, the country would continue to lose time to systems designed around paperwork and suspicion.\n\nSecurity officials agreed that the networks needed modernising, but warned that wider access would also make them harder to protect and monitor. Representatives from the republics asked who would control the infrastructure and whether local institutions would have any say in the rules.\n\nThe meeting ended without a final settlement. Instead, the government has opened the question for a wider policy decision. The technicians returned to their computers; the security representatives returned to their reports. Both sides know that the rules chosen for the network will shape far more than the next file transfer."
 RI_SOV_focus_events.8.a:0 "The debate is only beginning."

 RI_SOV_focus_events.9.t:0 "The General Staff Speaks"
 RI_SOV_focus_events.9.d:0 "An officer began the conference with a map and a timetable. On paper, the exercise required reinforcements, fuel and ammunition to reach a threatened sector within days. In the account he gave the General Staff, the requests had passed between headquarters while commanders waited to learn who could authorise the trains.\n\nThe discussion that followed was sharper than many in the room expected. Senior officers defended their staffs, pointing to shortages and conflicting instructions from civilian ministries. Younger commanders argued that delays could not all be blamed on missing equipment. If orders had to travel back to Moscow for every decision, they said, the army would always be reacting too late.\n\nThe conference ended with agreement to examine command procedures and improve coordination. It did not produce the men, vehicles or supplies that the planners wanted. Some officers left encouraged that problems could finally be discussed openly; others worried that an honest report would damage their careers.\n\nThe timetable remained on the table after the room emptied. Its missed deadlines would be used in the next round of planning."
 RI_SOV_focus_events.9.a:0 "The army must learn from its failures."

 RI_SOV_focus_events.10.t:0 "A Continent Between Two Frontiers"
 RI_SOV_focus_events.10.d:0 "The railway officer placed two requests beside the same map. One asked for equipment to be sent west; the other demanded additional capacity in the east. Both claimed urgency, and both relied on trains that could not be in two places at once.\n\nThe General Staff's new doctrine asks commanders to plan for threats across the whole Union rather than treating each frontier as an isolated problem. Military districts must share information, account for the distance between them and make clear which formations and supplies can be moved without stripping another region of its defences.\n\nAt the planning session, officers from the west pressed for assurances that their needs would not be forgotten. Their eastern counterparts replied that distance made their own shortages harder to remedy. The railway officer asked them both to decide what should move first, because his staff could not carry every request at the same time.\n\nThe doctrine gives the army a framework for making those decisions. It does not shorten the railway or make the arguments disappear. It does require the commanders at the table to reckon with both demands before sending their orders."
 RI_SOV_focus_events.10.a:0 "The fronts cannot be planned separately."

 RI_SOV_focus_events.11.t:0 "An Appeal to the Socialist World"
 RI_SOV_focus_events.11.d:0 "The statement arrived at socialist organisations abroad with a request that it be read aloud and circulated. Moscow called on workers and movements across the world to support the Soviet people and resist the pressures threatening the Union. Its authors presented the crisis as a question for the international left, not merely a dispute between governments.\n\nThe responses were divided. Some welcomed the appeal and began organising meetings to discuss what assistance they could provide. Others asked how they could defend the Soviet government after years of reports about repression and corruption. Their members argued over whether solidarity with Soviet citizens required support for the leadership in Moscow.\n\nIn Germany, the message provoked anger as well as debate. Critics accused the Soviet government of invoking socialist unity while refusing to answer for its own actions. Soviet officials denounced the criticism and circulated reports of the support the appeal had received elsewhere.\n\nBack in Moscow, the foreign ministry collected the replies. Some promised meetings and public statements; others were politely noncommittal. The appeal has reached its audience, but it has also brought the divisions within that audience into the open."
 RI_SOV_focus_events.11.a:0 "The world has heard our case."

 RI_SOV_focus_events.12.t:0 "A Message Across the Divide"
 RI_SOV_focus_events.12.d:0 "The Soviet diplomats spent the morning arguing over a single paragraph. It had to acknowledge the differences between Moscow and Washington without allowing them to consume the entire message. It also had to make clear that the Union was seeking a channel for discussion, not offering a concession it had no authority to make.\n\nThe message proposed contact over the dangers facing both countries. Its authors hoped that even a limited exchange might help prevent a crisis from being interpreted through rumours and public speeches alone. They knew that years of distrust would make any response uncertain, and that the message offered no guarantee of an agreement.\n\nIn Moscow, some officials welcomed the attempt. Others worried that reaching out would be read as a sign of weakness by allies and opponents alike. The diplomats replied that a conversation was not the same thing as a commitment, and that understanding another country's intentions could be valuable in itself.\n\nThe proposal has been prepared. Whether Washington will respond, and what either side might say next, remains to be seen."
 RI_SOV_focus_events.12.a:0 "We have made our approach."

 RI_SOV_focus_events.13.t:0 "The Fortress and Its Keepers"
 RI_SOV_focus_events.13.d:0 "The orders sent from Moscow were unmistakable: the Union's institutions were to concentrate on defence, discipline and the direction set by the central leadership. Rashkin's supporters presented the programme as a necessary answer to years of hesitation. Ministries were told to review their responsibilities and report where stronger coordination was needed.\n\nAmong officials who had long demanded firmer control, the announcement brought relief. They believed that a divided Party could not manage the dangers confronting the country. In the republics, however, some administrators asked whether closer supervision would come with the resources needed to fulfil Moscow's demands, or merely more instructions.\n\nAt a factory meeting, the local Party secretary praised the programme as a promise that the state would not abandon its people. A worker asked whether that promise included the missing supplies he had raised at the previous meeting. The secretary wrote down the question and moved on to the next speaker.\n\nThe Soviet fortress is becoming the organising idea of government. Its supporters now have to show that central authority can solve the problems they have been given the power to address."
 RI_SOV_focus_events.13.a:0 "The centre must hold."

 RI_SOV_focus_events.14.t:0 "A New Union, on Paper"
 RI_SOV_focus_events.14.d:0 "The reformers gathered their supporters in a room borrowed from a government ministry. On the table was a draft programme for a new Union: a more capable administration, a stronger role for expertise and a government that could rebuild confidence without abandoning socialism.\n\nSome of those present wanted an immediate break with the existing leadership. Others cautioned that the institutions they hoped to reform still depended on officials whose cooperation would be needed the following morning. Military representatives pressed for a clear chain of command; republic officials wanted assurances that reform would not simply replace one group of Moscow administrators with another.\n\nThe programme was approved after a long argument over its wording. Its supporters celebrated the commitment to change, while opponents in the Party warned that the reformers had raised expectations they could not satisfy. The question of the leadership remains before them, along with the practical work of turning their programme into policy.\n\nWhen the meeting ended, copies of the document were sent to ministries and regional representatives. The replies would reveal how much support the new project had beyond the room in which it was written."
 RI_SOV_focus_events.14.a:0 "The work of reform begins."

 RI_SOV_focus_events.15.t:0 "Whose Revolution?"
 RI_SOV_focus_events.15.d:0 "The meeting was supposed to discuss unpaid wages and shortages at the plant. It became something larger when a speaker from the renewal movement asked the workers why they were still being told to accept failures in the name of socialism. The revolution, he argued, had promised workers a voice, not another generation of officials who refused to hear them.\n\nSeveral people applauded. Others reminded him that slogans would not bring the missing materials to the factory gate. A union representative asked what the movement intended to do about managers and Party committees already responsible for keeping production going. The speaker promised that workers would have a greater part in shaping the answer, though he offered few details about how quickly that could happen.\n\nNews of meetings like this has reached Moscow, where supporters of red renewal are pressing their case against the old bureaucracy. Established officials accuse them of stirring discontent at a dangerous moment. The movement replies that discontent already exists, and that ignoring it has only made the Union weaker.\n\nAt the plant, the workers returned to their shifts still arguing. The question was no longer whether the revolution needed defending, but who could claim to speak for it."
 RI_SOV_focus_events.15.a:0 "Let the workers be heard."
