 GER_2029_hold_the_republic_together:0 "Hold the Republic Together"
 GER_2029_hold_the_republic_together_desc:0 "Berlin's priority is internal stability, not reopening old continental ambitions. The government will spend its energy containing unrest, managing coalition strain, and keeping the state functional."
 GER_2029_domestic_recovery_programme:0 "Domestic Recovery Programme"
 GER_2029_domestic_recovery_programme_desc:0 "Germany turns inward, focusing on public order, industrial upkeep, and a basic recovery agenda instead of any revanchist foreign adventure."