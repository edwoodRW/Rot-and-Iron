l_english:
 uk_left_tree:0 "UK Left Tree"
 ENG_LEFT_The_Socialist_Mandate:0 "The Socialist Mandate"
ENG_LEFT_The_Socialist_Mandate_desc:0 "The government will use its mandate to tighten rules on political influence, begin restoring public services, and shift national policy toward redistribution, labour protections, and a less interventionist foreign policy."
 ENG_LEFT_The_Year_of_Jubilee:0 "The Year of Jubilee"
ENG_LEFT_The_Year_of_Jubilee_desc:0 "The first programme of government will combine household debt relief, emergency social spending, and tax changes designed to shift resources away from concentrated wealth and into public services, housing, and local recovery."
 ENG_LEFT_Peace_Through_Disarmament:0 "Peace Through Disarmament"
ENG_LEFT_Peace_Through_Disarmament_desc:0 "Britain will withdraw from NATO, cancel further expansion of the nuclear deterrent, and begin decommissioning the existing system while redirecting part of defence spending toward domestic priorities."
 ENG_LEFT_The_Right_of_Return:0 "The Right of Return"
ENG_LEFT_The_Right_of_Return_desc:0 "Britain will recognise the State of Palestine, support an internationally supervised right of return, expand reconstruction aid, and align diplomatic policy behind Palestinian statehood and civilian protection."
 ENG_LEFT_The_Bridge_of_Hope:0 "The Bridge of Hope"
ENG_LEFT_The_Bridge_of_Hope_desc:0 "The government will end the hostile-environment approach, expand asylum processing and legal routes, shift maritime operations toward search and rescue, and build reception, housing, and integration capacity for new arrivals."
 ENG_LEFT_The_Citizen_of_the_World_Curriculum:0 "The Citizen of the World Curriculum"
ENG_LEFT_The_Citizen_of_the_World_Curriculum_desc:0 "Schools will revise history and civics teaching around empire, colonialism, labour movements, migration, and international institutions, backed by updated curriculum standards, materials, and teacher guidance."
 ENG_LEFT_The_Ethical_Arms_Ban:0 "The Ethical Arms Ban"
ENG_LEFT_The_Ethical_Arms_Ban_desc:0 "Britain will suspend arms export licences to active war zones, tighten end-use controls, and fund conversion plans for affected defence production into civilian and green manufacturing."
 ENG_LEFT_The_Fair_Trade_Tariffs:0 "The Fair Trade Tariffs"
ENG_LEFT_The_Fair_Trade_Tariffs_desc:0 "Tariffs, procurement rules, and import standards will be used to protect domestic industry, labour standards, and strategic supply chains from undercutting and offshoring pressure."
 ENG_LEFT_The_Citizen_of_the_World_Passport:0 "The Citizen of the World Passport"
ENG_LEFT_The_Citizen_of_the_World_Passport_desc:0 "Britain will expand humanitarian visas, simplify residency and travel procedures, and orient passport and border policy around safe movement, family reunion, and international cooperation."
 ENG_LEFT_Socialist_Protectionism:0 "Socialist Protectionism"
ENG_LEFT_Socialist_Protectionism_desc:0 "The government will use public investment, ownership rules, and trade controls to protect strategic sectors, support co-operatives, and rebuild domestic production under stronger democratic oversight."
 ENG_LEFT_The_Workers_Coffee_Coops:0 "The Workers' Coffee Co-ops"
ENG_LEFT_The_Workers_Coffee_Coops_desc:0 "A public co-operative development programme will back worker-owned shops, local credit, and community purchase schemes to revive town centres and reduce dependence on absentee landlords and chain operators."
 ENG_LEFT_Public_Wealth_Levy:0 "Public Wealth Levy"
ENG_LEFT_Public_Wealth_Levy_desc:0 "Emergency tax and asset measures will target dormant holdings, large fortunes, and speculative property, with the proceeds redirected into housing, public services, and local investment."
 ENG_LEFT_National_Broadband_Service:0 "National Broadband Service"
ENG_LEFT_National_Broadband_Service_desc:0 "The state will take control of core broadband infrastructure, set universal-service obligations, and expand affordable high-speed access through a publicly run national network."
 ENG_LEFT_The_Peoples_Media_Mandate:0 "The People's Media Mandate"
ENG_LEFT_The_Peoples_Media_Mandate_desc:0 "The government will impose stronger media-ownership limits, expand public-interest journalism, and subject major platforms and news conglomerates to stricter democratic and regulatory oversight."
 ENG_LEFT_Police_Accountability_Reform:0 "Police Accountability Reform"
ENG_LEFT_Police_Accountability_Reform_desc:0 "Police forces will be placed under stronger local democratic oversight, with reforms to training, use-of-force rules, complaints systems, and command accountability."
 ENG_LEFT_Public_Control_of_the_Grid:0 "Public Control of the Grid"
ENG_LEFT_Public_Control_of_the_Grid_desc:0 "The government will transfer the grid into public ownership, curb profiteering, and run investment, pricing, and transition planning through a publicly accountable energy authority."
 ENG_LEFT_Everyone_is_Welcome:0 "Everyone is Welcome"
ENG_LEFT_Everyone_is_Welcome_desc:0 "Emergency accommodation, municipal support funds, and access to basic services will be extended regardless of immigration status so that no resident is left without shelter or immediate support."
 ENG_LEFT_End_Royal_Prerogative:0 "End Royal Prerogative"
ENG_LEFT_End_Royal_Prerogative_desc:0 "The government will transfer prerogative powers from the Crown to Parliament, end royal consent as a political veto point, and place crown finances and estates under statutory public oversight."
 ENG_LEFT_Reform_the_Upper_House:0 "Reform the Upper House"
ENG_LEFT_Reform_the_Upper_House_desc:0 "The Lords will be stripped of hereditary and patronage privileges and reconstituted as a smaller second chamber with representation tied to labour, local government, and public service."
 ENG_LEFT_The_Second_Reconstruction:0 "The Second Reconstruction"
ENG_LEFT_The_Second_Reconstruction_desc:0 "With the old constitution split open, the government will move from reform to reconstruction, combining emergency social legislation, permanent public ownership powers, and a new settlement built around class power rather than inherited authority."
 ENG_LEFT_Workers_Control_Act:0 "Workers' Control Act"
ENG_LEFT_Workers_Control_Act_desc:0 "Large firms will be required to recognise elected workplace councils with binding rights over safety, closures, investment plans, and redundancy proposals, giving organised labour a direct role in economic management."
 ENG_LEFT_Convention_of_the_Republic:0 "Convention of the Republic"
ENG_LEFT_Convention_of_the_Republic_desc:0 "A constituent convention drawn from unions, councils, tenants' groups, and civic bodies will be convened to draft the institutional shape of the post-Westminster order and decide which powers remain national, regional, and local."
 ENG_LEFT_The_Duchies_for_the_Public:0 "The Duchies for the Public"
ENG_LEFT_The_Duchies_for_the_Public_desc:0 "The Duchies of Lancaster and Cornwall will be stripped of private constitutional status and transferred into public trusts, with their revenues redirected into local government, housing, and regional development."
 ENG_LEFT_Social_Ownership_Charter:0 "Social Ownership Charter"
ENG_LEFT_Social_Ownership_Charter_desc:0 "Strategic industries, major logistics networks, and firms that attempt capital flight will be brought under social ownership through compulsory purchase, public equity stakes, and co-operative conversion powers."
 ENG_LEFT_The_Republican_Constitution:0 "The Republican Constitution"
ENG_LEFT_The_Republican_Constitution_desc:0 "Britain will adopt a written constitution defining social rights, limits on executive authority, binding standards for public ownership, and a clear supremacy of democratic law over convention and prerogative."
 ENG_LEFT_Palestine_Solidarity_Offensive:0 "Palestine Solidarity Offensive"
ENG_LEFT_Palestine_Solidarity_Offensive_desc:0 "Britain will move beyond recognition into active solidarity, backing Palestinian statehood in every forum, suspending military and diplomatic support for Israeli operations, and turning foreign policy toward anti-colonial alignment across the region."
 ENG_LEFT_Arrest_the_Fascist_Ringleaders:0 "Arrest the Fascist Ringleaders"
ENG_LEFT_Arrest_the_Fascist_Ringleaders_desc:0 "The state will pursue the organisers, financiers, and public leaders of violent far-right networks through conspiracy, weapons, and hate-crime prosecutions, aiming to break the command layer behind the street movement."
 ENG_LEFT_Break_the_Private_Press_Bloc:0 "Break the Private Press Bloc"
ENG_LEFT_Break_the_Private_Press_Bloc_desc:0 "Cross-ownership caps, anti-monopoly action, and disclosure rules will be used to break concentrated press power, preventing a handful of proprietors from dominating political communication or sabotaging the new order."
 ENG_LEFT_Housing_Beyond_the_Market:0 "Housing Beyond the Market"
ENG_LEFT_Housing_Beyond_the_Market_desc:0 "National rent controls, compulsory purchase of long-empty property, and a state-led building programme will be used to turn housing into a guaranteed social good rather than an investment vehicle."
 ENG_LEFT_Refugee_Solidarity_Corridors:0 "Refugee Solidarity Corridors"
ENG_LEFT_Refugee_Solidarity_Corridors_desc:0 "Britain will establish protected humanitarian routes from major conflict zones, sharply expand asylum capacity, and direct councils, unions, and public services to treat refugee resettlement as a national obligation rather than a border problem."
 ENG_LEFT_Break_with_Atlantic_Orthodoxy:0 "Break with Atlantic Orthodoxy"
ENG_LEFT_Break_with_Atlantic_Orthodoxy_desc:0 "Foreign policy will no longer follow Washington's security consensus by default. Britain will oppose sanctions regimes that produce mass suffering, refuse alignment with regional proxy wars, and pursue open links with anti-imperial governments across the Middle East and Global South."
 ENG_LEFT_Public_Service_Broadcasting_Act:0 "Public Service Broadcasting Act"
ENG_LEFT_Public_Service_Broadcasting_Act_desc:0 "Broadcast licensing, platform carriage rules, and public grants will be reorganised to expand non-commercial news, local stations, and union-backed media outside private ownership chains."
 ENG_LEFT_Seize_the_Hate_Platforms:0 "Seize the Hate Platforms"
ENG_LEFT_Seize_the_Hate_Platforms_desc:0 "Broadcasters, publishers, and digital channels that coordinate fascist agitation or incitement will face licence seizure, emergency trusteeship, and asset confiscation so that organised reaction cannot hide behind media ownership."
 ENG_LEFT_Tribunals_for_Incitement:0 "Tribunals for Incitement"
ENG_LEFT_Tribunals_for_Incitement_desc:0 "Special republican courts will be empowered to try political incitement, organised hate campaigns, and violent conspiracy cases rapidly, targeting the influencers and patrons who turn propaganda into attacks on the street."
 ENG_LEFT_Common_Treasury_Programme:0 "Common Treasury Programme"
ENG_LEFT_Common_Treasury_Programme_desc:0 "Revenue from the wealth levy, the duchies, and recovered Crown assets will be pooled into a permanent treasury for housing, municipal industry, transport modernisation, and emergency welfare guarantees."
 ENG_LEFT_Internationalism_Without_Empire:0 "Internationalism Without Empire"
ENG_LEFT_Internationalism_Without_Empire_desc:0 "The republic will define itself through anti-imperial solidarity: refugee protection, sanctions on occupation and apartheid, and a foreign policy that treats the decline of Western bloc power as an opportunity to build a different international order."
 ENG_LEFT_No_Platform_for_the_Counter_Revolution:0 "No Platform for the Counter-Revolution"
ENG_LEFT_No_Platform_for_the_Counter_Revolution_desc:0 "Reactionary parties, financiers, and media fronts that organise to overturn the republic will be denied the protections of ordinary politics, facing party bans, property seizures, and permanent exclusion from public institutions."
 ENG_LEFT_The_Monarchy_Question:0 "The Monarchy Question"
ENG_LEFT_The_Monarchy_Question_desc:0 "Once prerogative, privilege, and aristocratic property have been cut back, the state must decide whether the royal family will remain in the country as private citizens or whether the Crown itself will be ended in law."
 ENG_LEFT_Exile_the_House_of_Windsor:0 "Exile the House of Windsor"
ENG_LEFT_Exile_the_House_of_Windsor_desc:0 "The royal household will be removed from Britain, stripped of remaining privileges, and barred from intervention in public life, while the state settles its estates and titles under republican law."
 ENG_LEFT_End_the_Monarchy:0 "End the Monarchy"
ENG_LEFT_End_the_Monarchy_desc:0 "The Crown will be abolished outright, all remaining royal functions will be transferred into the republican constitution, and Britain will cease to recognise monarchy as a legal or political institution."
ENG_LEFT_The_Red_Republic_Consolidated:0 "The Red Republic Consolidated"
ENG_LEFT_The_Red_Republic_Consolidated_desc:0 "With the monarchy abolished, the question shifts from seizure to survival. The republic must now harden itself against sabotage, shortages, secession, and its own internal divisions, proving that communist Britain can do more than win power."
ENG_LEFT_Purge_the_Old_State:0 "Purge the Old State"
ENG_LEFT_Purge_the_Old_State_desc:0 "Senior officials, judges, security chiefs, and departmental fixers who still serve the old order will be removed, sidelined, or broken up so that the republic is not strangled from inside its own institutions."
ENG_LEFT_Congress_of_the_Republic:0 "Congress of the Republic"
ENG_LEFT_Congress_of_the_Republic_desc:0 "The victory coalition cannot be held together by momentum alone. A republican congress of unions, councils, tenants, and revolutionary committees will define what the next stage of the state is actually for."
ENG_LEFT_Emergency_Economic_Directorate:0 "Emergency Economic Directorate"
ENG_LEFT_Emergency_Economic_Directorate_desc:0 "Capital flight, investment freezes, and deliberate bottlenecks will be treated as political warfare. A central economic directorate will coordinate supply, investment, labour deployment, and emergency production."
ENG_LEFT_Republican_Guard_Command:0 "Republican Guard Command"
ENG_LEFT_Republican_Guard_Command_desc:0 "The republic cannot rely forever on inherited security structures whose loyalties remain suspect. A Republican Guard will be built to defend government sites, infrastructure, and the new constitutional order itself."
ENG_LEFT_Tribunes_of_the_Civil_Service:0 "Tribunes of the Civil Service"
ENG_LEFT_Tribunes_of_the_Civil_Service_desc:0 "Departments and local administrations will be penetrated by trusted republican organisers tasked with identifying obstruction, accelerating directives, and ensuring the bureaucracy answers to the new state rather than the dead one."
ENG_LEFT_The_Nationalities_Question:0 "The Nationalities Question"
ENG_LEFT_The_Nationalities_Question_desc:0 "A communist republic in Britain cannot simply assume Scotland, Wales, and the regions will accept a new centre because the old one has fallen. The state must decide whether the union is to be federal, voluntary, and negotiated, or centralised and commanded."
ENG_LEFT_National_Logistics_Authority:0 "National Logistics Authority"
ENG_LEFT_National_Logistics_Authority_desc:0 "Ports, freight routes, fuel depots, food warehousing, and municipal distribution will be coordinated under a national logistics command so that private disruption cannot starve the republic into retreat."
ENG_LEFT_Seize_the_Commanding_Heights:0 "Seize the Commanding Heights"
ENG_LEFT_Seize_the_Commanding_Heights_desc:0 "Banking, heavy industry, energy, transport, and strategic communications will be pulled fully under public command so that the decisive levers of the economy can no longer be used against the government."
ENG_LEFT_Workers_Militias_and_Civic_Defence:0 "Workers' Militias and Civic Defence"
ENG_LEFT_Workers_Militias_and_Civic_Defence_desc:0 "Local defence committees, union stewards, and disciplined workers' militias will be mobilised to protect neighbourhoods, strike lines, depots, and state infrastructure from organised reaction and terror."
ENG_LEFT_The_Cultural_Republic:0 "The Cultural Republic"
ENG_LEFT_The_Cultural_Republic_desc:0 "Schools, museums, broadcasting, and public ritual must stop reproducing the moral authority of aristocracy and empire. The republic will begin reshaping everyday culture around labour, solidarity, and anti-elite memory."
ENG_LEFT_The_Federal_Commonwealth:0 "The Federal Commonwealth"
ENG_LEFT_The_Federal_Commonwealth_desc:0 "The republic will recognise that socialist legitimacy must be shared across the nations and regions. A federal commonwealth will distribute authority outward rather than trying to replicate the old Westminster pyramid in red colours."
ENG_LEFT_One_Republic_One_Command:0 "One Republic, One Command"
ENG_LEFT_One_Republic_One_Command_desc:0 "The crisis is too deep for layered sovereignty and negotiated ambiguity. Britain will be held together under one revolutionary command structure, with the centre retaining the power needed to crush resistance and force through the new order."
ENG_LEFT_The_Peoples_Rationing_System:0 "The People's Rationing System"
ENG_LEFT_The_Peoples_Rationing_System_desc:0 "If distribution becomes a battlefield, the republic must answer with guaranteed access and strict control. Rationing, anti-hoarding laws, and public supply boards will ensure that scarcity falls on profiteers before it falls on workers."
ENG_LEFT_Red_Reconstruction_Authority:0 "Red Reconstruction Authority"
ENG_LEFT_Red_Reconstruction_Authority_desc:0 "Emergency survival is not enough. A reconstruction authority will direct labour, housing, transport, and industrial renewal on a national scale so that the republic visibly builds while its enemies predict collapse."
ENG_LEFT_Land_Reform_Against_the_Aristocracy:0 "Land Reform Against the Aristocracy"
ENG_LEFT_Land_Reform_Against_the_Aristocracy_desc:0 "Aristocratic estates, idle holdings, and concentrated landownership will be broken up and transferred into public, municipal, and co-operative use, turning one of the oldest structures of class power against itself."
ENG_LEFT_Workers_Councils_in_Every_City:0 "Workers' Councils in Every City"
ENG_LEFT_Workers_Councils_in_Every_City_desc:0 "The republic will deepen beyond ministries and party offices by embedding workers' councils in every major city, turning production, local services, and urban life into arenas of direct socialist participation."
ENG_LEFT_Non_Aligned_Socialist_Bloc:0 "Non-Aligned Socialist Bloc"
ENG_LEFT_Non_Aligned_Socialist_Bloc_desc:0 "Britain will seek partners not through old alliance systems but through a new network of socialist, anti-imperial, and post-colonial states willing to trade, coordinate, and resist great-power coercion together."
ENG_LEFT_Export_the_Revolution:0 "Export the Revolution"
ENG_LEFT_Export_the_Revolution_desc:0 "The republic will not survive indefinitely as an isolated exception. Resources, organisers, and diplomatic pressure will be used to aid allied movements abroad and turn Britain's revolution into a wider international current."
ENG_LEFT_The_Workers_Commonwealth:0 "The Workers' Commonwealth"
ENG_LEFT_The_Workers_Commonwealth_desc:0 "Britain will stabilise as a democratic socialist republic rooted in councils, unions, regional autonomy, and social transformation from below, proving that revolutionary victory need not end in military centralism."
ENG_LEFT_The_Fortress_Republic:0 "The Fortress Republic"
ENG_LEFT_The_Fortress_Republic_desc:0 "Besieged by reaction at home and pressure abroad, the state will harden into a disciplined citadel: centralised, guarded, efficient, and permanent in its readiness to suppress enemies before they can regroup."
ENG_LEFT_The_International_Commune:0 "The International Commune"
ENG_LEFT_The_International_Commune_desc:0 "Britain will define itself not merely as a national republic but as the centre of a broader revolutionary alignment, tying domestic transformation to international struggle and making communist Britain a global pole of attraction."
ENG_LEFT_The_Common_Good_Reconstruction:0 "The Common Good Reconstruction"
ENG_LEFT_The_Common_Good_Reconstruction_desc:0 "Corbyn's republic will move carefully, using public investment, constitutional repair, and social guarantees to stabilize the country without turning the transition into a purge."
ENG_LEFT_Democratic_Public_Ownership:0 "Democratic Public Ownership"
ENG_LEFT_Democratic_Public_Ownership_desc:0 "Key utilities, transport links, and strategic industries will be brought into public ownership through legislation and compensation, with democratic oversight replacing both private monopoly and emergency seizure."
ENG_LEFT_Constitutional_Convention:0 "Constitutional Convention"
ENG_LEFT_Constitutional_Convention_desc:0 "A broad constitutional convention will assemble unions, councils, civic groups, and the devolved nations to design a durable settlement that curbs executive overreach and restores public trust."
ENG_LEFT_The_National_Investment_Bank:0 "The National Investment Bank"
ENG_LEFT_The_National_Investment_Bank_desc:0 "A national investment bank will channel cheap capital into housing, green industry, transport, and regional development so that recovery is driven by long-term planning rather than speculative finance."
ENG_LEFT_Workplace_Democracy_Act:0 "Workplace Democracy Act"
ENG_LEFT_Workplace_Democracy_Act_desc:0 "Workers will gain a statutory voice over pay structures, plant closures, investment plans, and safety standards, anchoring industrial strategy in negotiation rather than decree."
ENG_LEFT_The_Charter_of_Social_Rights:0 "The Charter of Social Rights"
ENG_LEFT_The_Charter_of_Social_Rights_desc:0 "The new settlement will codify housing, healthcare, labour dignity, and basic material security as social rights that governments are expected to uphold rather than optional promises."
ENG_LEFT_Public_Contracts_For_Britain:0 "Public Contracts for Britain"
ENG_LEFT_Public_Contracts_For_Britain_desc:0 "Procurement will be rewritten so state contracts reward domestic production, union labour, climate standards, and long-term community benefit instead of the cheapest bidder."
ENG_LEFT_Housing_For_the_Many:0 "Housing for the Many"
ENG_LEFT_Housing_For_the_Many_desc:0 "Council house construction, rent discipline, and the reuse of vacant property will be treated as core economic policy, easing pressure on households while rebuilding local capacity."
ENG_LEFT_Humanitarian_Britain:0 "Humanitarian Britain"
ENG_LEFT_Humanitarian_Britain_desc:0 "Britain will combine managed borders with legal routes, stronger asylum capacity, and immediate humanitarian support, replacing cruelty and spectacle with a rules-based system that can actually function."
ENG_LEFT_Peace_and_Detente:0 "Peace and Detente"
ENG_LEFT_Peace_and_Detente_desc:0 "Foreign policy will prioritise diplomacy, arms-control pressure, and de-escalation over bloc theatrics, reflecting Corbyn's instinct to reduce confrontation where possible without abandoning Britain's interests."
ENG_LEFT_Public_Interest_Media:0 "Public Interest Media"
ENG_LEFT_Public_Interest_Media_desc:0 "A stronger non-profit and public-interest media sector will be fostered through charter reform, local journalism support, and tighter concentration rules, without outright state seizure of the press."
ENG_LEFT_Community_Anti_Extremism:0 "Community Anti-Extremism"
ENG_LEFT_Community_Anti_Extremism_desc:0 "The far right will be countered through policing, civic organising, and targeted disruption of violent networks, aiming to isolate extremism without turning politics into permanent emergency rule."
ENG_LEFT_Regional_Rebalancing_Act:0 "Regional Rebalancing Act"
ENG_LEFT_Regional_Rebalancing_Act_desc:0 "Treasury rules and investment priorities will be rewritten to favour the North, Midlands, Wales, and neglected coastal communities, binding national recovery to territorial fairness."
ENG_LEFT_Independent_Foreign_Policy:0 "Independent Foreign Policy"
ENG_LEFT_Independent_Foreign_Policy_desc:0 "Britain will act with more distance from Washington's automatic line, seeking room for mediation, development, and international law while avoiding the isolationism of the harder left."
ENG_LEFT_Democratic_Economic_Council:0 "Democratic Economic Council"
ENG_LEFT_Democratic_Economic_Council_desc:0 "Trade unions, local authorities, co-operatives, and public agencies will be drawn into a standing national forum to coordinate wages, investment, industrial resilience, and energy transition."
ENG_LEFT_The_New_Settlement_For_Britain:0 "The New Settlement for Britain"
ENG_LEFT_The_New_Settlement_For_Britain_desc:0 "The republic will be recast as a patient social-democratic project: more equal, more democratic, and less deferential, but still grounded in consent, elections, and institutional continuity."
ENG_LEFT_A_Ceremonial_Crown:0 "A Ceremonial Crown"
ENG_LEFT_A_Ceremonial_Crown_desc:0 "The monarchy will remain only as a symbolic institution, stripped of meaningful political leverage and folded into a settlement where Parliament and the electorate clearly rule."
ENG_LEFT_A_Republic_by_Consent:0 "A Republic by Consent"
ENG_LEFT_A_Republic_by_Consent_desc:0 "If Britain is to become a full republic, it will do so by referendum, statute, and public consent rather than rupture, making constitutional change an argument won rather than an order imposed."
ENG_LEFT_The_Common_Good_Commonwealth:0 "The Common Good Commonwealth"
ENG_LEFT_The_Common_Good_Commonwealth_desc:0 "With the constitutional question settled, Corbyn's Britain can move from emergency repair into long-term renewal, building a more equal and democratic country without abandoning restraint, consent, and parliamentary legitimacy."
ENG_LEFT_Renew_the_Commons:0 "Renew the Commons"
ENG_LEFT_Renew_the_Commons_desc:0 "Parliament, local government, and civic institutions must be made credible again, not as ornaments of an old order but as the working machinery of a fairer Britain that people can actually trust."
ENG_LEFT_Cooperative_Commonwealth:0 "Co-operative Commonwealth"
ENG_LEFT_Cooperative_Commonwealth_desc:0 "A stronger co-operative sector will anchor the economy in shared ownership, worker participation, and community wealth, proving that economic democracy can grow without emergency centralisation."
ENG_LEFT_A_Public_Housing_Surge:0 "A Public Housing Surge"
ENG_LEFT_A_Public_Housing_Surge_desc:0 "Council-led construction, land assembly, and social infrastructure spending will be accelerated so that housing is treated as the foundation of national recovery rather than a speculative market prize."
ENG_LEFT_Charter_of_Devolution:0 "Charter of Devolution"
ENG_LEFT_Charter_of_Devolution_desc:0 "The nations and regions need a settlement that spreads power outward, binding the union together through trust, fairness, and democratic voice instead of old Westminster command habits."
ENG_LEFT_National_Care_Service:0 "National Care Service"
ENG_LEFT_National_Care_Service_desc:0 "Care will be lifted out of fragmentation and chronic understaffing through a national service designed around dignity, stable staffing, and social need rather than private extraction."
ENG_LEFT_Peace_Dividend_Budget:0 "Peace Dividend Budget"
ENG_LEFT_Peace_Dividend_Budget_desc:0 "A more careful foreign posture and tighter spending priorities will free resources for housing, care, transport, and local government, turning de-escalation abroad into reconstruction at home."
ENG_LEFT_Rebuild_Britain_for_the_Many:0 "Rebuild Britain for the Many"
ENG_LEFT_Rebuild_Britain_for_the_Many_desc:0 "The state will now tie social investment, regional recovery, and public infrastructure into one visible reconstruction effort, showing that the left can still build materially as well as legislate morally."
ENG_LEFT_A_Fairer_Britain:0 "A Fairer Britain"
ENG_LEFT_A_Fairer_Britain_desc:0 "The promise of Corbynism is not rupture for its own sake but a country that is more secure, more equal, and less cruel in everyday life, with ordinary people feeling the settlement in wages, services, and housing."
ENG_LEFT_The_Common_Good_Nation:0 "The Common Good Nation"
ENG_LEFT_The_Common_Good_Nation_desc:0 "Britain will be defined neither by revolutionary emergency nor by managed decline, but by a patient social-democratic transformation rooted in solidarity, democratic legitimacy, and the steady widening of the common good."
 ENG_your_party_hidden_missions:0 "YOUR PARTY Internal Missions"
 ENG_silent_majority_discontent_mission:0 "The Silent Majority's Discontent"
 ENG_silent_majority_discontent_mission_desc:0 "A quiet revolt is brewing across the North and Midlands. If stability falls too far while the government's internationalist agenda is being pushed through, the backlash could burst into the open."
 ENG_general_strike_left_idea:0 "General Strike"
 ENG_general_strike_left_idea_desc:0 "The government's response to the Northern Walkout has hardened discontent into an organised labour stoppage, freezing normal political and economic life across key parts of the country."
ENG_emergency_strike_measures_idea:0 "Emergency Strike Measures"
ENG_emergency_strike_measures_idea_desc:0 "The strike has escalated into a broader confrontation. Emergency interventions have kept parts of the state functioning, but at the cost of deeper instability and economic disruption."
ENG_peoples_dictatorship_idea:0 "The People's Dictatorship"
ENG_peoples_dictatorship_idea_desc:0 "The republic has hardened into a revolutionary regime. The state moves faster and speaks more sharply, but large parts of the country increasingly feel occupied rather than represented."
ENG_quiet_republic_idea:0 "The Quiet Republic"
ENG_quiet_republic_idea_desc:0 "Corbyn's republic has chosen legitimacy over rupture, trying to stabilize the new order through patience, restraint, and social trust rather than revolutionary coercion."
ENG_lamppost_resistance_idea:0 "Lamppost Resistance"
ENG_lamppost_resistance_idea_desc:0 "Sultana's split has driven the hardest elements of the movement underground. The Vanguard Guard now wages a campaign of sabotage and intimidation against the quieter republic they denounce as a betrayal."
ENG_jubilee_programme_idea:0 "Jubilee Programme"
ENG_jubilee_programme_idea_desc:0 "Debt relief, emergency social spending, and redistribution have started to circulate purchasing power back into ordinary households while easing pressure on the welfare state."
ENG_citizen_world_curriculum_idea:0 "Citizen of the World Curriculum"
ENG_citizen_world_curriculum_idea_desc:0 "Schools are teaching a more international and anti-imperial civic story, broadening political literacy while making chauvinist narratives harder to normalize."
ENG_socialist_protectionism_idea:0 "Socialist Protectionism"
ENG_socialist_protectionism_idea_desc:0 "Industrial planning now favors strategic domestic production, public procurement, and supply-chain resilience over cheap dependence on external markets."
ENG_workers_cooperative_sector_idea:0 "Workers' Co-operative Sector"
ENG_workers_cooperative_sector_idea_desc:0 "The government is channeling credit and procurement toward worker-owned firms, giving the co-operative economy a real foothold in national production."
ENG_national_broadband_service_idea:0 "National Broadband Service"
ENG_national_broadband_service_idea_desc:0 "A public broadband backbone is reducing infrastructure bottlenecks and spreading digital capacity beyond the most profitable private markets."
ENG_reformed_public_order_idea:0 "Reformed Public Order"
ENG_reformed_public_order_idea_desc:0 "Police oversight has been tightened and the internal security apparatus is under closer democratic supervision, making covert destabilization more difficult."
ENG_public_energy_authority_idea:0 "Public Energy Authority"
ENG_public_energy_authority_idea_desc:0 "The grid is now being planned as national infrastructure rather than a private rent stream, improving investment discipline and reducing consumer waste."
ENG_parliamentary_supremacy_idea:0 "Parliamentary Supremacy"
ENG_parliamentary_supremacy_idea_desc:0 "Royal discretion is being replaced by statutory authority and parliamentary control, making the state more politically responsive and less vulnerable to constitutional obstruction."
ENG_second_reconstruction_idea:0 "The Second Reconstruction"
ENG_second_reconstruction_idea_desc:0 "The government has entered a more disruptive phase of institutional change, accelerating public investment and political centralization at the cost of social calm."
ENG_workers_control_idea:0 "Workers' Control"
ENG_workers_control_idea_desc:0 "Workplace councils now have teeth. Management decisions are being pushed through structures that include labor directly, improving efficiency where the state can enforce compliance."
ENG_social_ownership_charter_idea:0 "Social Ownership Charter"
ENG_social_ownership_charter_idea_desc:0 "Public ownership powers have expanded from emergency intervention into a standing doctrine of economic management, pulling strategic industry further under collective control."
ENG_republican_constitution_idea:0 "Republican Constitution"
ENG_republican_constitution_idea_desc:0 "A written constitution has clarified the new political order, raising confidence in the republic and limiting the ability of hostile elites to exploit old ambiguities."
ENG_common_good_commonwealth_idea:0 "Common Good Commonwealth"
ENG_common_good_commonwealth_idea_desc:0 "The government has entered a more confident reconstruction phase, pairing constitutional legitimacy with visible social-democratic renewal."
ENG_reconstruction_for_the_many_idea:0 "Reconstruction for the Many"
ENG_reconstruction_for_the_many_idea_desc:0 "Housing, infrastructure, and regional investment are now being coordinated as one public rebuilding effort directed toward ordinary communities rather than speculative return."
ENG_common_good_crown_idea:0 "Crown in Common Service"
ENG_common_good_crown_idea_desc:0 "The monarchy survives only as a ceremonial shell beneath a stronger parliamentary and social-democratic state, giving the settlement extra stability without real royal leverage."
ENG_common_good_republic_idea:0 "Republic Settled in Law"
ENG_common_good_republic_idea_desc:0 "The republic has moved beyond abolition into a durable constitutional and social order, strengthening the government's authority and democratic resilience."
ENG_housing_beyond_market_idea:0 "Housing Beyond the Market"
ENG_housing_beyond_market_idea_desc:0 "Housing policy is now organized around social need instead of asset speculation, giving the state more room to build and plan at scale."
ENG_refugee_solidarity_corridors_idea:0 "Refugee Solidarity Corridors"
ENG_refugee_solidarity_corridors_idea_desc:0 "Protected routes and expanded settlement capacity are turning refugee reception into an organized state function rather than an ad hoc emergency response."
ENG_post_atlantic_doctrine_idea:0 "Post-Atlantic Doctrine"
ENG_post_atlantic_doctrine_idea_desc:0 "Britain's foreign policy is no longer anchored to automatic Atlantic alignment. The state is freer politically, but relations with established partners are cooling."
ENG_common_treasury_programme_idea:0 "Common Treasury Programme"
ENG_common_treasury_programme_idea_desc:0 "Recovered wealth and Crown revenues are being recycled into a permanent public investment pool focused on housing, transport, and municipal industry."
ENG_internationalism_without_empire_idea:0 "Internationalism Without Empire"
ENG_internationalism_without_empire_idea_desc:0 "The republic is framing itself as an anti-imperial state, accepting diplomatic friction abroad in exchange for a clearer foreign-policy identity at home."
ENG_counter_revolution_suppressed_idea:0 "Counter-Revolution Suppressed"
ENG_counter_revolution_suppressed_idea_desc:0 "The state has shut much of the organized reactionary ecosystem out of public life, making internal sabotage harder but deepening the sense of permanent confrontation."
ENG_state_of_rebellion_modifier:0 "State of Rebellion"
ENG_state_of_rebellion_modifier_desc:0 "The local political settlement has broken down. Militant committees, strikes, and sporadic clashes are disrupting normal administration and economic life."
 ENG_silent_majority_discontent_started_tt:0 "Starts the §YSilent Majority's Discontent§! mission for §Y180 days§!."
 ENG_northern_walkout_risk_tt:0 "If §YStability§! is below §R40%§! when this focus completes, §YThe Northern Walkout§! will fire."
ENG_blue_labour_decisions:0 "Blue Labour Initiatives"
ENG_blue_labour_decisions_desc:0 "The government has pivoted toward a more rooted social conservatism, trying to reconnect class politics with place, family, and national solidarity."
ENG_blue_labour_community_union_compacts:0 "Community Union Compacts"
ENG_blue_labour_community_union_compacts_desc:0 "Local labour agreements should be tied to visible community benefit, not just abstract wage settlements negotiated in Westminster or London headquarters."
ENG_blue_labour_family_service_guarantee:0 "Family Service Guarantee"
ENG_blue_labour_family_service_guarantee_desc:0 "Public services need to look dependable and local again. This initiative ties schools, clinics, and councils more tightly to family security and civic trust."
ENG_blue_labour_local_industry_charter:0 "Local Industry Charter"
ENG_blue_labour_local_industry_charter_desc:0 "Work, wages, and dignity are inseparable from place. We will back local industry and procurement rules that visibly reward productive communities."
