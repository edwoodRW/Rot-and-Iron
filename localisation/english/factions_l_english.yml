l_english:
The_Spartacist_Accord:0 "The German Democratic Coalition"
 The_Spartacist_Accord_desc:0 "The German Democratic Coalition is a military alliance formed between Germany and its partners in response to the threat of Soviet expansion. Its members coordinate their defence while retaining their own governments and national sovereignty."
The_Entente:0 "The Entente"
  The_Entente_desc:0 "The Entente is a coalition of nations united by shared interests and common goals. It serves as a platform for diplomatic collaboration, economic partnerships, and collective security. The Entente fosters cooperation among its members, enabling them to address global challenges, promote peace, and advance their mutual prosperity. Through dialogue and joint initiatives, the Entente strengthens international relations and contributes to a more stable world order."
 Comintern:0 "Comintern"
  Comintern_desc:0 "The Comintern is a revolutionary socialist organization that seeks to unite workers and oppressed peoples worldwide in the struggle against capitalism and imperialism. It advocates for the establishment of a classless society based on collective ownership of the means of production and democratic control. The Comintern promotes international solidarity, workers rights, and social justice, aiming to create a world free from exploitation and oppression."
 The_Prosperity_Sphere:0 "The Prosperity Sphere"
  The_Prosperity_Sphere_desc:0 "The Prosperity Sphere is an economic and political alliance that aims to foster prosperity, stability, and cooperation among its member states. It promotes trade, investment, and development initiatives to enhance the well-being of its members. By encouraging collaboration and shared growth, the Prosperity Sphere seeks to create a favorable environment for economic advancement, social progress, and regional stability." 
