 l_english:

 CAN_armada.1.t: "The War Council of Ottawa"
 CAN_armada.1.d: "§IOttawa, the Cabinet War Room — Late Evening§!\n\nThe maps cover every surface.\n\nCharts of the North Atlantic. Aerial reconnaissance photographs of the English coast — blurry, taken from altitude, but good enough. Tide tables. Weather projections. Supply chain calculations running to thirty pages.\n\nJacob Rees-Mogg stands at the head of the table. He has been standing there for three hours. He shows no sign of fatigue.\n\nAcross from him: Admiral James Forthright of the Royal Canadian Navy, his uniform pressed with a precision that speaks of forty years at sea. Beside Forthright: General Edward Ashworth of the Imperial Restoration Army — exile-born, fought in three campaigns, built the Liberation Force from nothing over fifteen years.\n\nConrad Black sits at the end of the table with a cold cup of coffee and the expression of a man running the numbers in his head.\n\nBoris Johnson sits in the corner. He was not invited. He came anyway.\n\n§R\"Gentlemen,\" Rees-Mogg begins. \"We have spent twenty-seven years building toward this moment. The fleet is assembled. The armies are trained. The logistical chain is in place. The question before this council is not whether we go. We go. The question is how.\"§!\n\nForthright opens a folder. Spreads photographs across the map.\n\n§R\"The Channel approaches are contested. Starmer's navy has been reinforced with Soviet equipment — destroyer class, capable vessels. We will not have an easy crossing.\"§!\n\n§R\"We have never expected an easy crossing,\" Rees-Mogg replies. \"Ease was never the point.\"§!\n\nBlack sets down his cup.\n\n§R\"Jacob. I want to be clear about one thing before this council approves anything. Every Canadian dollar spent on this operation, every Canadian life lost — I am answerable for that to the Canadian people. Not to the Crown. To the people of this country who have funded this fleet and whose sons will sail in it. I need to know that the plan in front of us is sound.\"§!\n\nThe room is very quiet.\n\n§R\"It is sound,\" says Rees-Mogg.\n\n\"Then prove it,\" says Black.§!"

 CAN_armada.1.a: "The operation is approved. Begin detailed planning."


 CAN_armada.1.b: "Delay — the intelligence picture is incomplete."

 CAN_armada.2.t: "The Question of Command"
 CAN_armada.2.d: "§IOttawa, the Cabinet War Room§!\n\nThey have been at it for six hours.\n\nThe question of who commands the landing force has divided the council along a fault line that everyone knew was there and nobody wanted to name directly.\n\nAdmiral Forthright spreads his hands on the table.\n\n§R\"The Royal Canadian Navy will transport this force across three thousand miles of contested ocean. My ships. My crews. My responsibility. I submit that operational command of the landing belongs with the officer who understands those conditions — which is to say, with me.\"§!\n\nGeneral Ashworth does not raise his voice. He has never needed to.\n\n§R\"With respect to the Admiral, the landing force is composed overwhelmingly of exile soldiers. Men and women who have waited their entire adult lives for this crossing. They will follow an officer who shares that history — who was there when London fell, who has spent twenty-seven years building toward this moment. They will not follow a Canadian naval officer they have never met on the most important day of their lives.\"§!\n\nRees-Mogg says nothing. He is watching Black.\n\nBlack is watching Boris.\n\nBoris is looking at the map of the English coast with an expression nobody in the room can quite read.\n\n§R\"There is,\" says Black slowly, \"a third option.\"§!"

 CAN_armada.2.a: "Admiral Forthright commands. He knows these waters."

 CAN_armada.2.b: "General Ashworth commands. He fought at the Channel in '99."

 CAN_armada.2.c: "Joint command. Both men. Neither has full authority."

 CAN_armada.3.t: "Where Do We Land?"
 CAN_armada.3.d: "§IOttawa, the Cabinet War Room — Day Three§!\n\nThe maps are covered in marks now. Lines drawn and redrawn. Possible landing sites circled, crossed out, circled again.\n\nRees-Mogg has not moved from the position he took on the first day.\n\n§R\"Dover,\" he says, for the fifth time. \"It has always been Dover. The White Cliffs. Every Englishman alive has grown up with that image — the cliffs, the Channel, the gateway home. When our forces come ashore under those cliffs it will tell the British people everything they need to know about who we are and what we have come to do. There are moments in history that require the right stage. This is one of them.\"§!\n\nForthright does not bother to hide his frustration.\n\n§R\"The stage, as the Deputy Prime Minister calls it, is a killing ground. The approaches to Dover are mined. The harbour defences have been reinforced since 2020. Starmer knows Dover is the symbolic target — which means it is the defended target. We will lose a third of the landing force before they reach the beach.\"§!\n\nAshworth speaks quietly.\n\n§R\"Portsmouth. Deep water. Existing infrastructure. The naval base can be turned to our purposes within forty-eight hours of capture. We land, we consolidate, we move inland with a functioning supply line. That is how you win a campaign. Not with symbols.\"§!\n\nBlack lights his cigar. Looks at the map.\n\n§R\"And if we hit them at three points simultaneously? Stretch their response until it tears?\"§!\n\nThe room considers this.\n\nRees-Mogg says: §R\"Dover must be one of them.\"§!\n\nForthright says: §R\"Then God help whoever lands there first.\"§!"

 CAN_armada.3.a: "Dover. The White Cliffs. It has to be Dover."

 CAN_armada.3.b: "Portsmouth. Deep water port, existing infrastructure."

 CAN_armada.3.c: "Multiple simultaneous landings. Overwhelm their response."

 CAN_armada.4.t: "Boris's Objection"
 CAN_armada.4.d: "§IOttawa, the Cabinet War Room§!\n\nHe has been sitting in the corner for three days.\n\nHe has not spoken — not because he has had nothing to say, but because he has been watching, learning the dynamics, waiting for the moment when what he says might actually matter.\n\nBoris Johnson stands up.\n\nEveryone looks at him.\n\n§R\"I'd like to say something. If I may.\"§!\n\nRees-Mogg's expression does not change. The expression itself is the objection.\n\nBlack says: §R\"The Deputy Prime Minister has the floor.\"§!\n\nBoris looks at the maps. The circled coastlines. The photographs of Dover and Portsmouth and the Channel approaches.\n\n§R\"I was twenty-five years old when I left London. I remember what it looked like when it fell. I remember the fires. I remember standing on the deck of the ship and watching the skyline disappear into the smoke.\n\nI am not — I want to be very clear about this — I am not saying that what we are planning is wrong. I believe the British people deserve liberation. I believe Starmer's regime is monstrous. I believe that.\n\nBut I need someone in this room to answer me one question honestly before this fleet sails.\n\nNot — will it work? I can see from the planning that it might work. My question is different.\n\nMy question is: what happens the day after? What do we tell the British people we have come to give them? Because if the answer is that we have come to give them the King and Jacob Rees-Mogg, I think we should understand very clearly that some of them — a great many of them — will not see that as liberation.\"§!\n\nThe room is very still.\n\nRees-Mogg speaks first.\n\n§R\"The British people will determine their own future through constitutional processes once the occupation has ended. That is not a question for this council.\"§!\n\n§R\"With respect,\" says Boris quietly, \"I think it is exactly a question for this council. Because the British people are going to ask it the moment we land. And we should have an answer that isn't a constitutional process.\"§!\n\nHe sits down.\n\nBlack looks at him for a long moment.\n\nThen looks at Rees-Mogg.\n\nThe question hangs in the air of the War Room like smoke."

 CAN_armada.4.a: "Let him speak. He has earned that much."

 CAN_armada.4.b: "This is not the time for cold feet. The fleet sails."

 CAN_armada.5.t: "The Night Before"
 CAN_armada.5.d: "§IHalifax Harbour, Nova Scotia — 11:47 PM§!\n\nThe harbour is full.\n\nFull in a way that Halifax has never been full in its entire history — warships from horizon to horizon, transport vessels laden with men and equipment, the great carriers sitting heavy in the black water, lights blazing on every deck.\n\nThree scenes, happening simultaneously.\n\n§LScene one — Rees-Mogg's cabin aboard HMS Restoration.§!\n\nHe sits alone at a small desk. In front of him: a single sheet of paper, a pen, and a photograph. The photograph is of London — specifically of the Houses of Parliament, taken from the Thames sometime in the 1990s before the revolution. He has carried this photograph for twenty-seven years.\n\nHe picks up the pen. He writes a letter. He addresses it to the King.\n\nIt begins: §R\"Your Majesty. By the time you read this, I will either have restored your throne or I will have died in the attempt. I find, to my surprise, that I am entirely at peace with either outcome.\"§!\n\n§LScene two — Black's office, Government House, Ottawa.§!\n\nBlack is on the phone. He has been on the phone for four hours. He is speaking to finance ministers, to industrial consortium heads, to the American liaison officer who represents Turner's administration — which has made its displeasure known and is watching very carefully.\n\nHe hangs up. His aide enters.\n\n§R\"Sir. The fleet reports ready.\"§!\n\nBlack nods. Looks at the photograph on his desk.\n\n§R\"Then God help us,\" he says quietly. \"All of us.\"§!\n\n§LScene three — Boris, on the harbour wall.§!\n\nHe stands at the edge of the water and watches the ships.\n\nHe has been there for an hour.\n\nA junior aide finds him and stands beside him in silence for a moment.\n\n§R\"Sir? Is there anything you need?\"§!\n\nBoris looks at the fleet.\n\n§R\"I don't know,\" he says. \"I genuinely don't know.\"§!\n\nThe aide doesn't know what to say to that.\n\nBehind them, Halifax sleeps badly.\n\nThe tide is going out."

 CAN_armada.5.a: "Tomorrow, history is made."

 CAN_armada.6.t: "The Armada Sails"
 CAN_armada.6.d: "§IHalifax Harbour — Dawn§!\n\nAt 0600 hours, in a grey Atlantic dawn, the first ship clears the harbour mouth.\n\nThen another.\n\nThen another.\n\nFor three hours the fleet files out of Halifax harbour. Every ship that Canada has built over twenty-five years of preparation. Every exile soldier who survived long enough to make this crossing. Every hope and obsession and sacrifice that has gone into the Reclamation, floating now on the dark water, moving east.\n\nRees-Mogg stands on the bridge of HMS Restoration. He watches the Canadian coastline recede.\n\nHe does not look back for long.\n\nIn Ottawa, Conrad Black watches the departure on a television feed. He does not speak.\n\nIn London — in the bunkers beneath Westminster where Starmer's government has been operating since the Soviet supply collapse — an intelligence officer puts a telephone to her ear and says, quietly:\n\n§R\"They've sailed. Confirmed. All of them.\"§!\n\nA pause.\n\n§R\"How long?\"§!\n\n§R\"Six days. Maybe seven.\"§!\n\nAnother pause.\n\nThen: §R\"Scramble the fleet. All of it. Everything we have.\"§!\n\nSix days across the Atlantic.\n\nAt the end of it — one way or another — history."

 CAN_armada.6.a: "God save the King. God save Canada."

 CAN_armada.7.t: "The Evacuation Order"
 CAN_armada.7.d: "§IEnglish Channel, Twenty-One Days After the Landing§!\n\nThe maps have become smaller every morning.\n\nWhat began as arrows pushing inland is now a narrow shaded strip along the coast, crossed by roads full of wounded men, burnt lorries, and units that no longer know which headquarters is issuing orders. London has not fallen. The English government has not broken. The bridgehead is still alive, but it is no longer advancing.\n\nAt sea, the destroyers are short of fuel. In the field hospitals, surgeons have stopped asking when the next convoy will arrive. They ask only how many men can be moved before the weather turns.\n\nAdmiral Forthright puts the situation before the War Council without decoration.\n\n§R\"We can remain and lose the force,\"§! he says. §R\"Or we can withdraw what remains. There is no third option.\"§!\n\nRees-Mogg stares at the coastline through the operations-room window. Somewhere beyond it is the country he promised to reclaim. Somewhere behind it are thousands of Canadians and exiles waiting for an order that will decide whether they see Halifax again.\n\nThe order is given.\n\nBy nightfall, the radio traffic changes. Not advance. Evacuate. Not hold. Embark.\n\nThe Armada turns west."
 CAN_armada.7.a: "Bring them home."

 CAN_armada.8.t: "The Second Crossing"
 CAN_armada.8.d: "§IHalifax Harbour, One Year Later§!\n\nThere are fewer ships this time. No one pretends otherwise.\n\nThe replacements are newer, the escort screens denser, the radios tested and tested again. The men boarding the transports have studied the failures of the first crossing until the names of lost ships have become part of their drill. There are no bands on the harbour wall. No speeches about destiny.\n\nRees-Mogg walks the quay with Admiral Forthright's successor. They stop beside a destroyer whose name has been taken from a vessel lost in the first campaign.\n\n§R\"Thirty-five days,\"§! the admiral says. §R\"That is the window. If England does not break by then, we leave. No exceptions.\"§!\n\nRees-Mogg looks east, toward a country no one in Halifax can see.\n\n§R\"Then we will make the days count.\"§!\n\nThe fleet sails without ceremony."
 CAN_armada.8.a: "The final crossing begins."

 CAN_armada.9.t: "No Third Armada"
 CAN_armada.9.d: "§INorth Atlantic, Thirty-Five Days Later§!\n\nThe signal arrives in Ottawa shortly after midnight.\n\nEngland still holds. The new bridgehead has fought longer, pushed further, and bled more carefully than the first. It has not broken the government in London. The transports are loading again. The fleet is turning west.\n\nThis time there is no argument in the War Council. The admirals have their orders. The soldiers have their embarkation lists. Everyone understands what a third attempt would mean: another generation sent to sea for a promise that has already consumed too many lives.\n\nRees-Mogg reads the final cable alone.\n\n§R\"There will be no third Armada,\"§! he says.\n\nIt is the first time anyone in the room has heard him speak of the Reclamation in the past tense."
 CAN_armada.9.a: "The sea has had enough."

 CAN_westminster.1.t: "The Liberation"
 CAN_westminster.1.d: "§ILondon, England§!\n\nThey came ashore in the grey morning.\n\nStarmer's forces fought hard — harder than the intelligence had suggested. The first days were bloody and uncertain. But the exile armies had something Starmer's exhausted, undersupplied, Soviet-abandoned forces did not:\n\nThey had been waiting twenty-seven years for this.\n\nBy the end of the third week, London was in exile hands.\n\nStarmer fled north. His regime fragmented. The BBC broadcast a blank screen for six hours, then suddenly — inexplicably — played the national anthem.\n\nRees-Mogg entered Downing Street for the first time in twenty-seven years.\n\nHe stood in the entrance hall for a long moment. Looked at the portraits on the walls. The years of socialist leaders staring back at him.\n\nThen he turned to his aide.\n\n§R\"Get them down,\" he said. \"All of them.\"§!\n\nBut the euphoria lasts only as long as it takes for the first question to be asked.\n\nAnd the first question, asked by a BBC journalist who somehow found a microphone:\n\n§R\"Deputy Prime Minister — who governs Britain now?\"§!\n\nRees-Mogg looks at the camera.\n\nFor once in his life, Jacob Rees-Mogg does not have an immediate answer."

 CAN_westminster.1.a: "Rees-Mogg governs. He earned this."

 CAN_westminster.1.b: "Canada administers. Temporarily."

 CAN_westminster.1.c: "Free elections. Immediately. Let the British decide."

 CAN_humiliation.1.t: "The Atlantic Disaster"
 CAN_humiliation.1.d: "§IHalifax, Nova Scotia — 36 Days After Departure§!\n\nThe reports come in through the night.\n\nNot all at once. That would almost be kinder. They come in fragments — a ship lost here, a radio signal cut off there, a naval engagement going wrong in a dozen different ways simultaneously.\n\nStarmer's navy, warned by Soviet intelligence, intercepted the armada three hundred miles west of the Irish coast.\n\nThe battle lasted thirty-six hours.\n\nWhen it was over, roughly a third of the exile fleet lay at the bottom of the North Atlantic. Thousands of soldiers and sailors were dead. The water temperature was four degrees.\n\nThe remnant fleet — battered, short of fuel, its command structure in chaos — turned west.\n\nThey are coming home.\n\nIn Ottawa the news arrives at 3 AM. Black's Chief of Staff enters his bedroom and stands in the doorway.\n\nBlack is already awake. He has been awake for twelve hours.\n\nHe sits up.\n\nHis Chief of Staff does not need to speak.\n\nBlack looks at the window. The Ottawa weather, grey and enormous and indifferent.\n\n§R\"How many?\"§!\n\n§R\"We don't have final numbers yet, sir.\"§!\n\n§R\"Approximate.\"§!\n\nThe Chief of Staff tells him.\n\nBlack is quiet for a very long time.\n\nThen: §R\"Get me Boris.\"§!"

 CAN_humiliation.1.a: "We failed. God help us."

 CAN_westminster.2a.t: "The Restoration Cabinet"
 CAN_westminster.2a.d: "§IDowning Street, London - The First Morning§!\n\nThe removal vans arrive before dawn.\n\nThey take the files first: ministerial papers, intelligence summaries, lists of names, records of arrests and releases and disappearances that have accumulated over the twenty-seven years since the Revolution. Then they take the portraits. Labour Prime Ministers, socialist marshals, committee chairmen. Each is lifted from the wall, wrapped in brown paper, and carried through the black door by men who do not look at the faces beneath the glass.\n\nAt nine o'clock, the first Restoration Cabinet gathers around the polished table. Nearly all of them are exiles. Some left Britain as children. Some have not seen London since it burned. One minister has brought the key to his parents' old house in Surrey and keeps turning it over in his hand beneath the table.\n\nJacob Rees-Mogg opens the meeting with a prayer for the dead, for the King, and for the nation. The words are composed, familiar, almost comforting. Beyond the gates, however, the sound of Canadian engines has not stopped. Whitehall is sealed by armoured vehicles. Soldiers in foreign uniforms stand beneath the statues of men who never imagined they would be guarded by troops from across the Atlantic.\n\nThe Foreign Secretary clears his throat.\n\n§R\"There is the matter of His Majesty, Prime Minister. The palace is asking whether preparations should begin. The country will expect an announcement.\"§!\n\nFor the first time that morning, Rees-Mogg looks uncertain. Not afraid. Not hesitant. Merely conscious of the size of the question.\n\nThe Crown has survived in exile because it was simple there: a photograph above a mantelpiece, a name spoken at dinners, a promise deferred until some distant day. In London, it is no longer a promise. It is a government, a constitution, a family, a history that half the country remembers and the other half has only been taught to resent.\n\n§R\"We will not return as conquerors,\"§! Rees-Mogg says at last. §R\"We return as the lawful continuity of Britain. The King will come home when the conditions of his homecoming are secure. Not before.\"§!\n\nNobody asks who will decide when those conditions have been met.\n\nOutside, a crowd has gathered at the far end of Whitehall. Some carry Union flags kept hidden for decades. Others carry nothing at all. They stand behind the barricades, watching Downing Street, waiting to discover whether the old country has come back - or whether another government has simply arrived."
 CAN_westminster.2a.a: "The Crown has returned."
 CAN_westminster.2b.t: "The Canadian Administration"
 CAN_westminster.2b.d: "§IWhitehall, London - 48 Hours After the Fall§!\n\nThe first order is about bread.\n\nNot flags, not thrones, not the old constitutional questions that brought an army across the Atlantic. Bread. The warehouses near the river are opened under military guard. Fuel convoys are directed toward hospitals. Railway workers are told to remain at their posts, and are promised that their wages will be paid in pounds, not speeches.\n\nBy noon, every wall in central London carries the same notice. It is printed in English and French, stamped with the seal of the Canadian Provisional Administration, and written in a tone so careful that it is almost apologetic. There will be a curfew. There will be rationing. There will be an audit of the ministries. There will be no collective punishment. The word §Itemporary§! appears six times.\n\nIn Ottawa, Conrad Black reads the draft over a secure telephone line while aides in London wait for his approval.\n\n§R\"The third paragraph is too triumphant,\"§! he says.\n\nA pause at the other end.\n\n§R\"Sir, it says we have liberated the capital.\"§!\n\n§R\"Then remove it. We have taken the capital. Liberation is for the people who live there to decide. Our task is to keep the lights on, stop the killing, and make sure no one starves because a government changed hands.\"§!\n\nBoris Johnson is appointed High Commissioner that afternoon. He is photographed outside the Foreign Office in a borrowed overcoat, flanked by Canadian officers and British civil servants who have not yet decided whether they are collaborators, survivors, or simply employees who need to go back to work tomorrow.\n\nA reporter asks him how long the administration will last.\n\nBoris smiles, then does not smile.\n\n§R\"As long as necessary,\"§! he says. §R\"And, I hope, not a moment longer.\"§!\n\nIn the East End, a woman reads the notice twice before tearing the bottom copy from the wall and taking it home. Her son asks what it means.\n\nShe folds the paper carefully.\n\n§R\"It means,\"§! she says, §R\"that someone else is in charge now.\"§!"
 CAN_westminster.2b.a: "Stability before ceremony."
 CAN_westminster.2c.t: "Britain Votes"
 CAN_westminster.2c.d: "§IHouse of Commons, London - The Chamber Reopens§!\n\nThe chamber still bears the marks of the fighting.\n\nA section of the ceiling has been covered with canvas. Several benches are scorched. The dispatch box has been polished, though someone has missed a dark stain near its base. Canadian soldiers stand in the galleries beside BBC technicians, foreign correspondents, and men and women who once sat in this room before the Revolution and are now old enough to need help up the stairs.\n\nOutside, Parliament Square is full before sunrise. There are republicans with homemade placards. There are monarchists carrying flags their parents kept beneath floorboards. There are trade union banners, church groups, students, pensioners, families of the disappeared, and people who have come only because nobody can remember the last time a government announced something and expected to be answered.\n\nBoris Johnson walks into the chamber to a silence so complete that the cameras can be heard turning.\n\nHe has spent most of his life being loud. He has filled rooms for a living. Today, he does not seem to know what to do with the attention. He grips the edges of the dispatch box and looks up at the galleries.\n\n§R\"Twenty-seven years ago, Britain lost more than a war,\"§! he begins. §R\"It lost the habit of being asked. Every government since then has told the country what it is, what it must remember, and what it is permitted to hope for.\"§!\n\nHe pauses. Somewhere outside, a crowd begins chanting, but the words cannot be made out.\n\n§R\"We have been told that liberation means restoring what existed before. Others have told us that liberation means never allowing that past to return. I do not pretend that either question is small. I do not pretend that an election will heal all that has been done to this country.\"§!\n\nA Canadian officer at the rear of the chamber shifts his weight. Rees-Mogg, watching from Downing Street, says nothing.\n\n§R\"But this much I know. Britain cannot be made free by Ottawa, or by Washington, or by Berlin, or by a cabinet behind locked doors. It can only be made free by the British people, with a ballot in their hands and a choice that belongs to them.\"§!\n\nThe Elections Act is laid before the chamber. It provides for universal voting, international observers, the legal return of parties banned for a generation, and a constitutional referendum after the first elected government takes office. The Crown is not restored by decree. The Republic is not preserved by decree. Both must submit themselves to a country that has not been permitted to choose between them in a lifetime.\n\nFor a moment, no one applauds. The proposal is too large, too dangerous, too full of possibilities nobody can control.\n\nThen an old woman in the public gallery rises and begins to clap.\n\nOthers follow.\n\nBy the time Boris leaves the chamber, the sound has reached Parliament Square."
 CAN_westminster.2c.a: "Let the British decide."
 CAN_westminster.3.t: "The Government Returns"
 CAN_westminster.3.d: "§IWhitehall, London - The Day After Peace§!\n\nThe Canadian flag is lowered before noon.\n\nThere is no ceremony grand enough to conceal what the moment means. For months, the men and women entering Whitehall did so under foreign military protection, carrying relief orders, curfew notices, and the impossible responsibility of keeping England alive while it decided what it was. Now the offices are being handed back. The brass plates are polished. The telephones are connected. The ministers arriving at the doors are British, whatever their history, whatever their quarrels, whatever they owe to Ottawa.\n\nIn the Cabinet Office, the Canadian High Commissioner signs the final transfer papers in the presence of journalists from every major newspaper. The document grants Canada a continuing security role and binds the new government to protect the peace, but its central sentence is stark: the administration of England belongs once again to England.\n\nOutside, no crowd knows quite how to react. Some cheer. Some turn away. A man standing near the gates removes his cap and holds it against his chest for a long time.\n\nAcross the Atlantic, Conrad Black reads the confirmation cable twice.\n\n§R\"We came to end one government,\"§! he says. §R\"Not to become another.\"§!\n\nFor the first time since the Armada sailed, London has a government of its own."
 CAN_westminster.3.a: "Britain must stand on its own feet."
 CAN_westminster.4.t: "A Union Chosen"
 CAN_westminster.4.d: "§ILondon and Edinburgh, Simultaneously§!\n\nThe final votes are counted in Edinburgh before dawn.\n\nThere is no single cheer, no uncomplicated national celebration. Scotland has not surrendered. It has accepted a treaty: a parliament of its own, guarantees written into law, and a place in a British state that is being remade rather than restored exactly as it was.\n\nIn London, the agreement is read aloud in the chamber where British governments once assumed Scotland had no choice but to follow. This time, every sentence has been negotiated. Every power returned to Westminster has a corresponding protection for Edinburgh.\n\nThe Scottish delegation enters to a mixture of applause, suspicion, and exhausted relief.\n\n§R\"We have not voted to disappear,\"§! the First Minister says. §R\"We have voted to build something in which Scotland remains itself.\"§!\n\nThe new British government ratifies the settlement. Canadian troops watch from the galleries but do not vote.\n\nFor the first time in generations, the Union exists because both countries have said yes."
 CAN_westminster.4.a: "A Union of Equals."
 CAN_humiliation.2.t: "The Reckoning"
 CAN_humiliation.2.d: "§IHalifax Harbour, Three Days Later§!\n\nThe ships return one at a time.\n\nThe first is a destroyer with half its antennae gone and black scoring along the hull. The second has no lights at all. By afternoon, a transport enters the harbour listing so badly that two tugs must guide it to the pier. Its decks are crowded with men wrapped in blankets, staring at the city without waving.\n\nHalifax has gathered behind the barriers. Mothers clutch photographs in plastic sleeves. Children hold signs made with marker pens and cardboard: §IWelcome Home§!, §IWhere Is Dad?§!, §IWe Remember§!. A naval officer walks slowly down the line, carrying a clipboard he does not open. Each time someone calls a name, he looks at the paper anyway.\n\nNo band is waiting. No speeches have been prepared. The harbourmaster has ordered the flags lowered to half-mast, but there are not enough flags left on some of the ships to lower.\n\nAt Government House in Ottawa, Black receives the casualty estimate in a room full of people who have known the number since dawn and have been waiting for him to say it aloud. Rees-Mogg is present. Boris is not.\n\n§R\"We need a statement,\"§! says the Press Secretary.\n\nBlack looks at Rees-Mogg.\n\n§R\"Not yet,\"§! Rees-Mogg says. §R\"We cannot let panic define the national response. The cause was just. The execution was flawed. We must make that distinction.\"§!\n\nBlack turns back to the windows. Outside, Ottawa is carrying on with its ordinary afternoon: buses moving through slush, office workers leaving early, people buying groceries before dinner.\n\n§R\"Tell that to the families at the harbour,\"§! he says.\n\nBy evening, the newspapers are running the same question on every front page. Not whether the Armada failed. There is no room for doubt about that.\n\nWho ordered it to sail?\n\nIn Halifax, the families do not ask. They know the names. They have known them for years."
 CAN_humiliation.2.a: "Rebuild what can be rebuilt."
 CAN_humiliation.3.t: "The Halifax Report"
 CAN_humiliation.3.d: "§IOttawa, House of Commons - A Grey Afternoon§!\n\nThe report is heavier than it looks.\n\nThree volumes. Casualty tables, intercepted signals, minutes from the War Council, testimony from admirals who have spent weeks saying they could not remember who insisted on what. The galleries are full before the Clerk begins reading. Some have come to hear the Government condemned. Others have come carrying photographs.\n\nBlack rises slowly. He does not try to soften the findings.\n\n§R\"The Armada failed because we believed conviction could substitute for preparation,\"§! he says. §R\"The men lost in the Atlantic deserved better from every one of us.\"§!\n\nRees-Mogg is not in the chamber. His empty seat is noticed by everyone.\n\nOutside, Halifax families listen to the broadcast in community halls and kitchens. No report can return anyone to them. But for the first time, the state has put its failures into words."
 CAN_humiliation.3.a: "The truth belongs to the country."
 CAN_humiliation.4.t: "Lessons in Salt Water"
 CAN_humiliation.4.d: "§IHalifax Naval Yard, Before Dawn§!\n\nThe salvage officers have spread the wreckage across a long table: a scorched radio set, fragments of a signal book, charts marked with routes that became graves.\n\nRees-Mogg walks past them without touching anything. The admirals expect a speech about sacrifice. Instead, he asks which escort failed first, which order arrived too late, and why no one stopped the operation when the weather turned.\n\nFor hours, the answers are technical, bloodless, unbearable.\n\nAt last, Rees-Mogg closes the file.\n\n§R\"Then the next fleet will not sail for a photograph,\"§! he says. §R\"It will sail when it can win.\"§!\n\nNo one says the word §Inext§! aloud after that."
 CAN_humiliation.4.a: "Never again unprepared."
 CAN_humiliation.5.t: "The End of the Reclamation"
 CAN_humiliation.5.d: "§IOttawa, Dawn§!\n\nBy morning, the newspapers have found the words before the Government has.\n\n§ISecond Armada Withdraws. England Holds. Reclamation Over.§!\n\nThe phrase is everywhere: on radio panels, in factory canteens, in the silence of families who have already hung too many photographs beside too many candles. The exiles do not disappear. The old country does not disappear. But the project that ruled Canadian politics for a generation has reached the point where it can no longer demand another fleet, another levy, another funeral.\n\nIn Parliament, Black closes the debate with a sentence that no one applauds.\n\n§R\"Canada cannot be asked to drown forever in another country's past.\"§!\n\nOutside, the Ottawa River moves under a pale sky, indifferent as the Atlantic."
 CAN_humiliation.5.a: "Canada must live with what remains."
 CAN_humiliation.6.t: "The Mandate After Halifax"
 CAN_humiliation.6.d: "§IOttawa, Cabinet Office - Election Night§!\n\nThe television has been muted for an hour.\n\nAcross the city, results are arriving from ridings that once treated the Reclamation as a matter of honour. The numbers on the screen do not tell a simple story. Canadians have not forgotten England. They have not forgotten the exiles, or the dead, or the promises made in Halifax. But they have also made clear that memory is no longer enough to govern a country.\n\nBlack stands beside the window with the result sheets in his hand. Boris waits near the table, uncharacteristically silent.\n\n§R\"They are not voting for us,\"§! Black says. §R\"Not really. They are voting against being asked to lose another generation.\"§!\n\nBoris looks toward Parliament Hill.\n\n§R\"Then perhaps that is what we should promise them. A government that understands the difference.\"§!\n\nThe room waits for Black to decide whether the new Canada will remain his responsibility, or become Boris's inheritance."
 CAN_humiliation.6.a: "Black will finish the work he began."
 CAN_humiliation.6.b: "Let Boris carry Canada into its next chapter."
 SCO_armada_reaction.1.t: "The South Falls Silent"
 SCO_armada_reaction.1.d: "§IEdinburgh, Cabinet Office - Early Morning§!\n\nThe first report says the bridges are closed.\n\nThe second says Canadian troops are moving through Westminster. The third, delivered by a pale civil servant who has not slept, says the old government has fled north and there is no one in London able to issue orders with any certainty.\n\nFor a long time, the Scottish cabinet listens to the radio. The announcer's voice cuts in and out beneath static. He reads the same sentence three times: London is secured. London is secured. London is secured.\n\nNo one knows what that means.\n\nThe First Minister has spent years telling the country that Scotland is not England, that the border is a border, and that no crisis south of it can erase the independence won through sacrifice. Those words now sit on the cabinet table like documents from another age.\n\nThe Defence Secretary breaks the silence.\n\n§R\"Do the Canadians intend to stop at the border?\"§!\n\nThe Foreign Secretary begins to answer, then stops. There has been no message from Ottawa. No request for Scottish cooperation. No warning. No reassurance.\n\n§R\"They have not crossed it,\"§! the First Minister says.\n\n§R\"That was not the question.\"§!\n\nOutside, the news has spread through Edinburgh. Some people gather at pub windows to watch the BBC feed. Others begin buying fuel and tinned food. At the university, students argue over whether London has been liberated, occupied, or both. A man on Princes Street raises an old Union flag and is shouted down by three different groups for three different reasons.\n\nAt noon, the bells of St Giles begin to ring. Nobody in the cabinet ordered them rung. Nobody can later agree who did.\n\nAcross the Firth, the grey sky presses low over Scotland. To the south, an old power has fallen. Whether a new one has risen is a question Edinburgh cannot afford to leave unanswered."
 SCO_armada_reaction.1.a: "Prepare for what comes next."
 SCO_armada_reaction.2.t: "The Offer From London"
 SCO_armada_reaction.2.d: "§IEdinburgh, The Cabinet Room§!\n\nThe Canadian delegation arrives with two documents. The first is a treaty draft. The second is a letter, signed in London, which begins with the words §IUnion of Equals§!.\n\nIt promises a Scottish Parliament, control over domestic law, and a place in a common foreign and defence policy. It does not ask Scotland to forget why it left. It asks whether independence must mean permanent separation.\n\nFor three hours, the cabinet studies every line. Outside, the news reaches the city and the familiar arguments begin again: old Union flags in some windows, independence banners in others, and a great many people asking what exactly London is offering now that London has changed hands.\n\nThe First Minister closes the folder.\n\n§R\"We did not fight to become a county,\"§! she says. §R\"But neither did we fight to make a border into a prison.\"§!\n\nThe room waits for an answer."
 SCO_armada_reaction.2.a: "A voluntary union may serve Scotland."
 SCO_armada_reaction.2.b: "Scotland's independence is not negotiable."
