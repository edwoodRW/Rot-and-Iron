l_english:
 GER_the_gathering_storm:0 "The Storm Gathers"
 GER_the_gathering_storm_desc:0 "The maps on Liebich's desk are already marked with arrows, though no declaration has been made and no public enemy named. Beyond the windows, Berlin goes on with its ordinary business; inside the cabinet, every conversation has begun to sound like a rehearsal."
 GER_diplomatic_outreach:0 "The Envoys Depart"
 GER_diplomatic_outreach_desc:0 "The Foreign Office is given a quiet mandate to find out who might stand with Germany when the crisis breaks. Couriers leave for Paris and Edinburgh carrying language chosen to promise much and bind little."
 GER_unofficial_channels_edinburgh:0 "Edinburgh's Quiet Door"
 GER_unofficial_channels_edinburgh_desc:0 "The first meetings take place far from the ceremonial rooms of government, with Scottish representatives arriving separately and leaving no record of the hour. No treaty is discussed; for now, the question is whether Edinburgh believes Berlin can be trusted at all."
 GER_covert_arms_shipments:0 "Crates in the Night"
 GER_covert_arms_shipments_desc:0 "Crates marked as agricultural machinery are loaded under cover of darkness. The shipment is small enough to deny and large enough to matter; should it be discovered, Scotland will be left to explain why German weapons were found in its depots."
 GER_paris_backchannel:0 "The Paris Channel"
 GER_paris_backchannel_desc:0 "A retired diplomat, a sealed room and a telephone line that officially does not exist: that is the beginning of the Paris channel. France is not asked to choose sides, only to imagine what a German victory might demand of Europe."
 GER_industrial_cooperation_accord:0 "An Industrial Entente"
 GER_industrial_cooperation_accord_desc:0 "German and French officials begin with the harmless language of trade: machine tools, rail schedules, credit and industrial standards. Each signed page makes the next political refusal more difficult, and the French delegation knows it."
 GER_the_paris_edinburgh_understanding:0 "The Paris-Edinburgh Understanding"
 GER_the_paris_edinburgh_understanding_desc:0 "The two channels finally meet in a single draft, passed between Paris and Edinburgh until neither capital can claim to have written it. Its promises are deliberately incomplete. That may be why both governments are willing to sign."
 GER_shadow_war_directive:0 "Directive for the Unseen War"
 GER_shadow_war_directive_desc:0 "Liebich authorizes an intelligence campaign that is not to appear in any cabinet minutes. Analysts are told to follow the money, the couriers and the quiet connections between Moscow and the British Union; success will be measured by what never reaches the newspapers."
 GER_infiltrate_the_ubsr:0 "The British Union Infiltrated"
 GER_infiltrate_the_ubsr_desc:0 "German agents enter the British Union through labor offices, shipping companies and the people who service its telephones. Most will find nothing. The few who do are instructed to send no message that could expose the network."
 GER_isolate_the_soviets:0 "The Soviet Circle Narrows"
 GER_isolate_the_soviets_desc:0 "Neutral governments receive the same carefully worded warning: Soviet guarantees may be less reliable than they appear. Berlin offers no public ultimatum, only a suggestion that Moscow's friends should consider what happens when the war reaches their own borders."
 GER_the_saboteurs_network:0 "The Saboteurs' Web"
 GER_the_saboteurs_network_desc:0 "A series of disruptions leaves no clear signature: delayed rail consignments, missing manifests and a relay station that fails at exactly the wrong hour. In London, officials blame incompetence. In Berlin, a clerk burns the only copy of the report."
 GER_diplomatic_encirclement:0 "A Ring of Doubt"
 GER_diplomatic_encirclement_desc:0 "Berlin's envoys work the smaller capitals one by one, asking each to reconsider its obligations to Moscow. The pressure is quiet and cumulative; no single refusal matters, but together they might leave the Soviet Union with fewer friends than it expected."
 GER_the_bear_is_weakened:0 "The Bear Bleeds"
 GER_the_bear_is_weakened_desc:0 "Reports from the intelligence directorate and the diplomatic corps arrive in the same week. The Soviet Union is not broken, but it is more isolated, less certain of its allies, and forced to spend attention on dangers beyond the front."
 GER_quiet_rearmament:0 "Rearmament in Shadow"
 GER_quiet_rearmament_desc:0 "Factories receive orders that can be explained as replacements, not preparations. The army studies new formations behind closed doors while public speeches continue to praise peace; the contradiction is understood by everyone who signs the paperwork."
 GER_reserve_stockpiling:0 "The Reserve Ledger"
 GER_reserve_stockpiling_desc:0 "Quartermasters count rifles, ammunition and spare parts against a war plan no minister will name. One new production line is approved, its location chosen for rail access and the number of people who can be trusted to ask no questions."
 GER_officer_corps_review:0 "The Officers' Examination"
 GER_officer_corps_review_desc:0 "The officer corps is examined not only for competence, but for whether its members can carry out orders that have not yet been given. The review leaves old rivalries intact and gives Liebich a clearer picture of which commanders will move when the hour comes."
 GER_doctrine_studies:0 "Maps for the Eastern War"
 GER_doctrine_studies_desc:0 "Staff officers argue over railheads, reserves and the distance between a successful advance and an exhausted army. Their maps are still hypothetical, but the men around the table have stopped pretending that the question is whether Germany will fight."
 GER_liebich_tests_the_waters:0 "Liebich's Trial Balloon"
 GER_liebich_tests_the_waters_desc:0 "Liebich lets the word 'war' appear in a speech and watches which benches fall silent. The response is not the endorsement he wanted, but neither is it a revolt; in politics, that narrow margin can be made to look like a mandate."
 GER_courting_the_moderates:0 "A Majority in Waiting"
 GER_courting_the_moderates_desc:0 "The moderate deputies are invited to meetings where their objections are heard, recorded and answered with promises of oversight. Some leave reassured. Others recognize that the government has learned to make a decision sound like a negotiation."
 GER_brandts_early_warning:0 "Brandt's Warning"
 GER_brandts_early_warning_desc:0 "Brandt's warning is delivered in a crowded hall and carried by workers who have no access to the cabinet room. She speaks of a revolution asked to defend itself by becoming something its founders would not recognize. The applause is uneven, but no one can claim the question was not asked."
 GER_securing_the_mandate:0 "The Mandate Secured"
 GER_securing_the_mandate_desc:0 "The vote is held after a week of bargaining, threats of resignation and late-night promises to the smaller factions. Liebich has his mandate, though the tally reveals a government held together by the belief that there may be no safe alternative."
 GER_the_die_is_cast:0 "No Road Back"
 GER_the_die_is_cast_desc:0 "The final reports are placed before the cabinet: allies contacted, the army prepared, the opposition counted. Outside, the city is still quiet. Inside, the decision has already been made, and the silence that follows is not mistaken for peace."
 GER_spartacist_war_council:0 "Council of War"
 GER_spartacist_war_council_desc:0 "The war council convenes under shuttered windows as the first dispatches arrive from the eastern frontier. Liebich speaks of duty and necessity; the generals speak in timetables. Brandt's empty chair is noticed by everyone and mentioned by no one."
 GER_total_war_decree:0 "The Emergency Decree"
 GER_total_war_decree_desc:0 "The decree is read aloud in factories, barracks and union halls. It asks every institution to give more than it has promised and every household to accept that the war will reach beyond the front. The applause is real; so is the unease beneath it."
 GER_rationalise_industry:0 "Factories for the Front"
 GER_rationalise_industry_desc:0 "Production boards redraw the industrial map around rail capacity, steel and the factories that can be converted fastest. Efficiency is the word used in the public statement. In the workshops, it means longer shifts, fewer choices and a foreman with a new list."
 GER_conscription_review:0 "The Nation in Uniform"
 GER_conscription_review_desc:0 "The call-up lists return to the ministries with names added from the factories and the countryside. Families are promised that the measure is temporary; the army is promised replacements. Neither promise is likely to survive the first winter."
 GER_spartacist_production_drive:0 "The Production Offensive"
 GER_spartacist_production_drive_desc:0 "A year's production targets are compressed into a few months. New shifts begin before the old ones end, and the newspapers print photographs of gleaming machines instead of the men sleeping beside them."
 GER_peoples_army_reform:0 "The People's Army"
 GER_peoples_army_reform_desc:0 "The reformers want an army whose officers understand the people they command; the old guard fears an army that understands politics too well. New doctrine is issued, new instructors promoted, and the argument is postponed until after the next battle."
 GER_war_bond_programme:0 "Bonds for Victory"
 GER_war_bond_programme_desc:0 "The posters promise that every mark lent to the state will come home with victory. The finance ministry knows the arithmetic is less certain. For now, citizens queue outside the banks, placing their faith in a government that has already spent tomorrow."
 GER_officer_acceleration:0 "Commanders of Tomorrow"
 GER_officer_acceleration_desc:0 "The front consumes experienced commanders faster than the academies can replace them. A shortened course sends younger officers east with maps they have studied for weeks and orders they may have to interpret in minutes."
 GER_the_eastern_hammer:0 "The Eastern Hammer"
 GER_the_eastern_hammer_desc:0 "The advance begins before dawn, along roads already crowded with guns, fuel and wounded men. Berlin calls it the decisive blow. At the front, soldiers know only that the next line of villages is still beyond the horizon."
 GER_the_atlantic_question:0 "The Atlantic Lifeline"
 GER_the_atlantic_question_desc:0 "The war council turns to the sea lanes carrying supplies to the Soviet Union. Any attempt to close them risks angering neutral governments and drawing Britain into a wider conflict; leaving them open means accepting that the enemy will keep receiving what it needs."
 GER_naval_build_programme:0 "Hulls in the Slipways"
 GER_naval_build_programme_desc:0 "Shipyards receive orders for hulls that will not be ready before the war has changed shape. Admirals ask for more time; the cabinet asks for more ships. Along the coast, the slips fill with steel and the workers learn to read the war in the rising tide."
 GER_submarine_campaign:0 "The Silent Service"
 GER_submarine_campaign_desc:0 "Submarine commanders are ordered to target the routes that keep the Soviet war effort supplied. The policy is described as interdiction, not blockade; the crews beneath the waves will make little distinction when a freighter disappears."
 GER_iceland_forward_base:0 "A Footing in Iceland"
 GER_iceland_forward_base_desc:0 "Iceland offers a lonely anchorage at the edge of the North Atlantic, far from Berlin and close to every convoy route that matters. The official papers call it a logistical station. The charts in the admiralty mark it as a key to the sea."
 GER_bay_of_biscay_patrol:0 "The Biscay Patrol"
 GER_bay_of_biscay_patrol_desc:0 "Patrols move through the Bay of Biscay under orders to identify every vessel bound for the Soviet-aligned ports. French officials watch the German ships from their windows and wonder how long a 'joint security measure' can remain a courtesy."
 GER_mediterranean_pressure:0 "The Mediterranean Chokepoint"
 GER_mediterranean_pressure_desc:0 "The Mediterranean is not Germany's sea, but its ports and narrow passages can still decide what reaches the east. Rome is reminded of this in diplomatic language polished enough to conceal the warning beneath it."
 GER_north_sea_blockade:0 "The North Sea Line"
 GER_north_sea_blockade_desc:0 "The North Sea patrol orders are explicit; the political language is not. British ships are delayed, inspected or turned back, while Scottish crews find new gaps in the cordon. The blockade is already changing the war before anyone admits it has begun."
 GER_starve_the_bear:0 "The Lifeline Cut"
 GER_starve_the_bear_desc:0 "The last dependable routes begin to close. Soviet depots count their remaining stores; British ministers face the consequences of a lifeline that no longer reaches its destination. In Berlin, the map shows a tightening ring. It does not show the civilians inside it."
 GER_spartacist_alliance:0 "Solidarity in Arms"
 GER_spartacist_alliance_desc:0 "The alliance is announced as a union of revolutions, though every delegation arrives with its own map and its own definition of solidarity. Berlin will coordinate the coalition. Whether it can command it is a question for another day."
 GER_scottish_arms_deal:0 "Scotland Re-Armed"
 GER_scottish_arms_deal_desc:0 "The Scottish delegation asks for rifles, artillery and a guarantee that Berlin will not abandon them once the shipments arrive. The trains leave loaded. The guarantee remains a sentence in a draft agreement, waiting for both governments to decide what it means."
 GER_tommy_brigades:0 "The Tommy Brigades"
 GER_tommy_brigades_desc:0 "German advisers arrive with training manuals and a vocabulary of commands that the Scottish recruits learn by repetition. The new brigades are not yet an army, but they are becoming something the British Union must plan around."
 GER_edinburgh_pact:0 "The Edinburgh Guarantee"
 GER_edinburgh_pact_desc:0 "The pact is signed in Edinburgh without a parade. Berlin guarantees Scotland's independence; Scotland promises to stand with Germany. Both sides understand that the document is strongest while the war is still going their way."
 GER_french_integration:0 "Paris Turns East"
 GER_french_integration_desc:0 "French and German officials meet to discuss the shape of a common command. The French bring their own plans and their own memories of occupation; the Germans bring a coalition already moving toward war. Integration begins with the difficult work of deciding whose orders will be obeyed."
 GER_bordeaux_agreement:0 "The Bordeaux Terms"
 GER_bordeaux_agreement_desc:0 "The Bordeaux agreement gives cooperation a legal shape and an economic one. French ministries sign on to shared planning, while the public is told that the arrangement protects French sovereignty. Both statements are true, though not in the same way."
 GER_western_front_opens:0 "A Second Front in the West"
 GER_western_front_opens_desc:0 "French forces cross the frontier while German commands press from the east. The government calls the opening of the western front a coalition decision; in the border towns, people hear only the artillery and know the war has come home."
 GER_china_coordination:0 "The Chongqing Channel"
 GER_china_coordination_desc:0 "Chinese officers and German staff officers compare maps across a table crowded with translators. Their enemy is the same, but their priorities are not. For the moment, shared pressure on Moscow is enough to keep the conversation moving."
 GER_pacific_coordination:0 "Two Fronts, One Enemy"
 GER_pacific_coordination_desc:0 "The plan is simple enough to fit on one map: Germany presses from the west, China from the east. The Soviet Union will have to divide its reserves. The people who drew the arrows do not have to explain what happens if either front gives way."
 GER_manchurian_front:0 "The Manchurian Offensive"
 GER_manchurian_front_desc:0 "Chinese forces prepare to push through Manchuria as German dispatches describe the eastern advance. Berlin sends equipment and promises coordination; the distance between the two fronts is measured in thousands of miles and one shared enemy."
 GER_the_grand_coalition:0 "An Alliance of Necessity"
 GER_the_grand_coalition_desc:0 "The coalition's representatives gather beneath a map of a war none of them can win alone. Their flags hang side by side, but the arguments over command, borders and the peace after victory begin before the ink is dry."
 GER_liebich_coalition:0 "Liebich's Wartime Coalition"
 GER_liebich_coalition_desc:0 "The war has given Liebich authority, but not certainty. He gathers the unions, party officials and reluctant moderates who keep the government standing, offering each a place in the room and asking them to leave their doubts outside."
 GER_address_the_raetepartei:0 "A Hearing for the Councils"
 GER_address_the_raetepartei_desc:0 "The Rätepartei is not a quiet opposition. Its delegates speak for workers who see the war as a betrayal of the revolution, and Brandt's supporters have begun to ask whether victory under Liebich would still be a victory worth having."
 GER_hold_the_centre:0 "The Centre Holds"
 GER_hold_the_centre_desc:0 "Liebich refuses to let either the generals or the council socialists claim the whole government. For now, compromise keeps the ministries open and the front supplied; every concession leaves another faction waiting to collect its debt."
 GER_victory_in_the_east:0 "Victory and Its Reckoning"
 GER_victory_in_the_east_desc:0 "The Soviet front is collapsing, but no one in Berlin mistakes collapse for peace. Liebich addresses the country as the man who brought the war to its end, while the cabinet begins the harder work of deciding what a victorious Germany has become."
 GER_brandts_moment:0 "Brandt's Hour"
 GER_brandts_moment_desc:0 "The reports from the front reach Berlin before Liebich can prepare an answer. Brandt enters the chamber with the support of workers who have carried the war's cost and the belief that the government has lost the right to speak for them."
 GER_peace_negotiations:0 "The Road to a Ceasefire"
 GER_peace_negotiations_desc:0 "Brandt opens a channel to Moscow while both armies still insist they can win. The ceasefire proposal is carried by diplomats who know that one badly chosen word may bring the guns back before the ink has dried."
 GER_the_berlin_accords:0 "The Berlin Settlement"
 GER_the_berlin_accords_desc:0 "The agreement is signed in Berlin after days of argument over borders, prisoners and who has the right to call the war finished. No side gets everything it wanted. For the first time in years, the maps on the table are not plans for an advance."
