l_english:
 GER_the_gathering_storm:0 "The Storm Gathers"
 GER_the_gathering_storm_desc:0 "Liebich's government has decided that Germany must be ready for a confrontation it has not yet named. Before any order is given, the groundwork has to be laid on four fronts: quiet diplomacy abroad, a shadow war against our rivals, rearmament out of public sight, and a secure majority at home."
 GER_diplomatic_outreach:0 "The Envoys Depart"
 GER_diplomatic_outreach_desc:0 "The Foreign Office is tasked with finding out who would stand with Germany when the crisis comes. A small liaison network will open discreet channels to the governments that matter, starting with Edinburgh and Paris, so that Berlin knows where it has friends before it needs them."
 GER_unofficial_channels_edinburgh:0 "Edinburgh's Quiet Door"
 GER_unofficial_channels_edinburgh_desc:0 "Scotland resents a union it never chose, and many in Edinburgh would welcome a friend in Europe. An unofficial envoy will make contact with the Scottish government and test how far it is willing to go. Nothing will be signed yet, but the door will be open."
 GER_covert_arms_shipments:0 "Crates in the Night"
 GER_covert_arms_shipments_desc:0 "A first shipment of rifles will be sent to Scotland disguised as civilian cargo. It will not change the balance of power, but it shows Edinburgh that Germany is serious about backing it. The risk is real if London discovers where the crates went."
 GER_paris_backchannel:0 "The Paris Channel"
 GER_paris_backchannel_desc:0 "France has its own reasons to fear a divided Europe. Informal talks will sound out Paris on whether it would accept a German move in the east, and whether it would prefer to be consulted in advance. No alliance is asked for, only goodwill."
 GER_industrial_cooperation_accord:0 "An Industrial Entente"
 GER_industrial_cooperation_accord_desc:0 "Trust is easier to build on a factory floor than at a conference table. German and French engineers will standardise parts and align shipments of steel, chemicals and machine tools, tying the two economies together without anyone having to call it an alliance."
 GER_the_paris_edinburgh_understanding:0 "The Paris-Edinburgh Understanding"
 GER_the_paris_edinburgh_understanding_desc:0 "With contacts open in both capitals, Germany will bring them together around one table. The aim is a loose understanding on consultation and mutual interest in the west, so that our western flank is secure when we turn our attention east."
 GER_shadow_war_directive:0 "Directive for the Unseen War"
 GER_shadow_war_directive_desc:0 "A new directorate will be set up to run Germany's intelligence and covert operations under the Chancellor's direct authority. Its task is to shape the war before it starts, and to make sure our enemies are the ones who fight at a disadvantage."
 GER_infiltrate_the_ubsr:0 "The British Union Infiltrated"
 GER_infiltrate_the_ubsr_desc:0 "Agents and sympathisers will be placed inside the British Union's institutions and industry. The goal is not to topple London but to learn its plans, find its weaknesses, and prepare the ground for the disruption to come."
 GER_isolate_the_soviets:0 "The Soviet Circle Narrows"
 GER_isolate_the_soviets_desc:0 "Moscow needs only enough friends to keep its enemies from acting together. Berlin will make that circle smaller through trade offers, visits and quiet pressure on every neutral government, until the Soviet Union has fewer places to turn."
 GER_the_saboteurs_network:0 "The Saboteurs' Web"
 GER_the_saboteurs_network_desc:0 "A small, disciplined network will be activated to cause disruption inside the British Union: failed power stations, blocked railways and strikes at the wrong moment. The aim is to wear London down and leave it unable to support its allies."
 GER_diplomatic_encirclement:0 "A Ring of Doubt"
 GER_diplomatic_encirclement_desc:0 "Having isolated Moscow, Germany will tighten the circle. Trade deals will be withdrawn and diplomatic ties cooled, until the Soviet Union finds its calls unanswered and its remaining partners wondering whether they backed the wrong side."
 GER_the_bear_is_weakened:0 "The Bear Bleeds"
 GER_the_bear_is_weakened_desc:0 "Months of covert pressure should now have left Moscow and London weaker and less prepared. The shadow war will be brought to its conclusion with a final coordinated blow, opening a window for Germany to act that will not stay open for long."
 GER_quiet_rearmament:0 "Rearmament in Shadow"
 GER_quiet_rearmament_desc:0 "Germany will rebuild its military strength without announcing it. Orders will be placed through ordinary supply contracts and stockpiles described as strategic reserves, so that the army can grow without giving our rivals a reason to respond."
 GER_reserve_stockpiling:0 "The Reserve Ledger"
 GER_reserve_stockpiling_desc:0 "A team of logistics officers will survey depots and warehouses across the country and convert suitable sites into stores and arms works. A war is won as much by what is waiting in the depots as by what the generals plan."
 GER_officer_corps_review:0 "The Officers' Examination"
 GER_officer_corps_review_desc:0 "The army has trained for peacekeeping, not for a major war. A review board will assess the officer corps, retire those who are not up to the task, and open commands to younger officers ready to lead in a real conflict."
 GER_doctrine_studies:0 "Maps for the Eastern War"
 GER_doctrine_studies_desc:0 "The General Staff will draw up plans for a campaign in the east, weighing distance, supply and the Soviet Union's strategic depth against the opportunities a weakened front would offer. These studies will shape how Germany fights."
 GER_liebich_tests_the_waters:0 "Liebich's Trial Balloon"
 GER_liebich_tests_the_waters_desc:0 "Before taking the country to war, the Chancellor must learn whether it will follow him. Liebich will raise the question of security and sacrifice in speeches and Reichstag corridors, measuring what the public and the party will accept."
 GER_courting_the_moderates:0 "A Majority in Waiting"
 GER_courting_the_moderates_desc:0 "A quiet majority already supports the Chancellor's policy, but many of its members would rather not say so. Liebich will work to win them over openly and strengthen the moderate base the government depends on."
 GER_brandts_early_warning:0 "Wagenknecht's Warning"
 GER_brandts_early_warning_desc:0 "Sahra Wagenknecht has read the files and does not like where this is heading. The revolutionary wing of the party is strong enough that her warning cannot be ignored, and the Chancellor must decide how to respond to it."
 GER_securing_the_mandate:0 "The Mandate Secured"
 GER_securing_the_mandate_desc:0 "The coalition will put the Chancellor's policy to a formal vote. A clear majority in the Reichstag gives Liebich the legal authority and political cover to prepare Germany for what comes next."
 GER_the_die_is_cast:0 "No Road Back"
 GER_the_die_is_cast_desc:0 "The channels abroad are open, the shadow war has done its work, the army has its plans and the government has its mandate. Germany now commits itself to the course it has chosen, and the pre-war preparations end here."
 GER_spartacist_war_council:0 "Council of War"
 GER_spartacist_war_council_desc:0 "The cabinet will convene a formal war council, placing the direction of the war effort under the Chancellor's authority. From here every branch of the national effort, from industry to the navy to the alliance, can be organised."
 GER_total_war_decree:0 "The Emergency Decree"
 GER_total_war_decree_desc:0 "An emergency decree will place industry, raw materials and labour under central direction for the war effort. It is a sweeping use of state power that will strain the home front, but it lets Germany put its full weight behind the war."
 GER_rationalise_industry:0 "Factories for the Front"
 GER_rationalise_industry_desc:0 "German industry is large but wasteful. Ministries will coordinate suppliers, share capacity between factories and cut duplication, so that more of what the country produces reaches the front."
 GER_conscription_review:0 "The Nation in Uniform"
 GER_conscription_review_desc:0 "The service laws will be rewritten to widen eligibility and call up more of the population. It is a heavy demand on the public, but the army needs the manpower for the campaign ahead."
 GER_spartacist_production_drive:0 "The Production Offensive"
 GER_spartacist_production_drive_desc:0 "A national campaign will mobilise workers to raise output, with the factory floor presented as the front line. It is a short, intense effort that gives a strong boost to industry but will need to be renewed to last."
 GER_peoples_army_reform:0 "The People's Army"
 GER_peoples_army_reform_desc:0 "The army will be reshaped around the idea that its soldiers are citizens defending a cause rather than hired professionals. Political education and closer ties with the party aim to build cohesion and morale."
 GER_war_bond_programme:0 "Bonds for Victory"
 GER_war_bond_programme_desc:0 "The war will cost more than the budget can bear. Rather than raise taxes or print money, the government will ask the public to lend to the state through war bonds, trading short-term funds for debt that will be repaid later."
 GER_officer_acceleration:0 "Commanders of Tomorrow"
 GER_officer_acceleration_desc:0 "The army will run short of officers as it grows. A fast command course for sergeants and warrant officers will turn experienced soldiers into capable commanders in time for the offensive."
 GER_the_eastern_hammer:0 "The Eastern Hammer"
 GER_the_eastern_hammer_desc:0 "With German troops on Soviet soil, the army needs a plan to keep up the tempo. A new operational plan will concentrate force and supply on the decisive axes, driving deeper before the enemy can recover."
 GER_the_atlantic_question:0 "The Atlantic Lifeline"
 GER_the_atlantic_question_desc:0 "Soviet factories depend on supplies crossing the Atlantic. The navy will plan to interdict this lifeline and open the maritime branch of the war effort, turning the sea lanes into a second front."
 GER_naval_build_programme:0 "Hulls in the Slipways"
 GER_naval_build_programme_desc:0 "The Admiralty finally gets the funding it has asked for. New orders will fill the dockyards and add slipways and hulls, building a fleet that will matter in a longer war even if it cannot decide the first campaign."
 GER_submarine_campaign:0 "The Silent Service"
 GER_submarine_campaign_desc:0 "Submarines are the cheapest weapon against a larger navy. A concentrated campaign against enemy shipping will threaten British and Soviet supply lines, though it will also risk diplomatic incidents."
 GER_iceland_forward_base:0 "A Footing in Iceland"
 GER_iceland_forward_base_desc:0 "Iceland sits at the junction of the North Atlantic routes. Securing a forward base on the island will extend our patrol range and let us watch the shipping lanes, at the cost of attracting attention."
 GER_bay_of_biscay_patrol:0 "The Biscay Patrol"
 GER_bay_of_biscay_patrol_desc:0 "A small naval and air patrol will operate off the French Atlantic coast to track traffic in and out of the Bay of Biscay. It is useful for intelligence, but the French will not welcome it."
 GER_mediterranean_pressure:0 "The Mediterranean Chokepoint"
 GER_mediterranean_pressure_desc:0 "Every strait and port in the Mediterranean is a place where supply can be watched, delayed or cut. Naval planners will draw up options to put pressure on the shipping that feeds the eastern front, though Rome may object."
 GER_north_sea_blockade:0 "The North Sea Line"
 GER_north_sea_blockade_desc:0 "German patrol groups, backed by aircraft and submarines, will set up an inspection line across the North Sea. It will squeeze British trade and war effort, but it risks escalation."
 GER_starve_the_bear:0 "The Lifeline Cut"
 GER_starve_the_bear_desc:0 "With the Atlantic blockade tightened, we can finally cut the Soviet Union off from its British supplies. Every convoy will be a target, with the aim of starving the Soviet war effort of what it cannot make for itself."
 GER_spartacist_alliance:0 "Solidarity in Arms"
 GER_spartacist_alliance_desc:0 "Germany has little experience of leading a coalition. A secretariat in Berlin will coordinate allies, share intelligence and plan joint operations, opening channels to Scotland, France and China."
 GER_scottish_arms_deal:0 "Scotland Re-Armed"
 GER_scottish_arms_deal_desc:0 "Germany will supply Scotland with a large shipment of rifles and artillery. It will give Edinburgh the means to defend itself and sets it more firmly against London."
 GER_tommy_brigades:0 "The Tommy Brigades"
 GER_tommy_brigades_desc:0 "Scottish volunteers will be trained by German officers and equipped from German stocks to form new brigades. Germany will also formally recognise the Scottish government, binding Edinburgh closer to Berlin."
 GER_edinburgh_pact:0 "The Edinburgh Guarantee"
 GER_edinburgh_pact_desc:0 "A formal agreement will commit Germany to guarantee Scotland's independence. It binds the two governments together and gives Edinburgh the confidence to stand against London."
 GER_french_integration:0 "Paris Turns East"
 GER_french_integration_desc:0 "Berlin will offer Paris a real role in decisions about the war. The aim is to move France from polite distance to cooperation and bring it into the plan for the east."
 GER_bordeaux_agreement:0 "The Bordeaux Terms"
 GER_bordeaux_agreement_desc:0 "Germany and France will sign an economic and military understanding. It does not commit France to the war, but it brings the two countries closer to fighting on the same side."
 GER_western_front_opens:0 "A Second Front in the West"
 GER_western_front_opens_desc:0 "With France on side, we will press Paris to turn its attention to the British Union. A war in the west would draw London's forces away and relieve the pressure on Germany's flank."
 GER_china_coordination:0 "The Chongqing Channel"
 GER_china_coordination_desc:0 "A liaison office will open in Chongqing to coordinate with China against the common enemy. The distances are great, but a shared opponent gives both sides reason to work together."
 GER_pacific_coordination:0 "Two Fronts, One Enemy"
 GER_pacific_coordination_desc:0 "No single power can fight the Soviet Union everywhere at once. Germany and China will coordinate their timing so that Moscow faces pressure from both east and west."
 GER_manchurian_front:0 "The Manchurian Offensive"
 GER_manchurian_front_desc:0 "Germany will send arms to equip Chinese armies in the north and encourage an offensive in Manchuria. It forces the Soviet Union to divide its forces and strengthens the alliance in the east."
 GER_the_grand_coalition:0 "An Alliance of Necessity"
 GER_the_grand_coalition_desc:0 "A socialist Germany, a nationalist China, a French republic and a Scottish government have little in common except a shared opponent. Germany will weld them into a single command framework to fight the Soviet Union together."
 GER_liebich_coalition:0 "Liebich's Wartime Coalition"
 GER_liebich_coalition_desc:0 "The war will strain the government's fault lines. Liebich will broaden his coalition and make the compromises needed to keep it together through the campaign."
 GER_address_the_raetepartei:0 "A Hearing for Raetepartei"
 GER_address_the_raetepartei_desc:0 "The Raetepartei party has a large following and resents what it sees as a betrayal of the revolution. Liebich will meet its leaders to hear their grievances and try to win their cooperation, though it may reopen a divide in the party."
 GER_hold_the_centre:0 "The Centre Holds"
 GER_hold_the_centre_desc:0 "The Chancellor will keep the coalition together against pressure from the left and the right. If he can hold the centre through the crisis, the government will emerge stronger and ready for what follows."
 GER_victory_in_the_east:0 "Victory and Its Reckoning"
 GER_victory_in_the_east_desc:0 "The Soviet front is collapsing. Germany will consolidate its gains, bring the eastern campaign to a conclusion and face the question of what to do with a victory it has paid heavily for."
 GER_brandts_moment:0 "Wagenknecht's Hour"
 GER_brandts_moment_desc:0 "If the war goes badly and the left loses patience, Sahra Wagenknecht may take her moment at a party congress. Liebich would step down and a new Chancellor would take the country in a different direction. A major Soviet advance into Germany may force this change before the focus is completed."
 GER_peace_negotiations:0 "The Road to a Ceasefire"
 GER_peace_negotiations_desc:0 "The new Chancellor will seek a way out of the war. Ceasefire talks will be opened with Moscow, though opposition at home has not been silenced and the road will be long."
 GER_the_berlin_accords:0 "The Berlin Settlement"
 GER_the_berlin_accords_desc:0 "With Moscow's agreement, a settlement signed in Berlin will seek a coalition-wide white peace with the Soviet Union. If Germany suffers a major invasion first, the government will instead have to face Moscow's territorial demands."
