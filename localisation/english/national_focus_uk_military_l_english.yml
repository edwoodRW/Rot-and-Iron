l_english:
 uk_military_restoration_tree:0 "Military Restoration Tree"
 ENG_MIL_Emergency_Reconstruction_Command:0 "Emergency Reconstruction Command"
 ENG_MIL_Emergency_Reconstruction_Command_desc:0 "The counter-revolution has won the war, but victory on the map is not the same as order in the country. Sanders and the command structure around him must turn a battlefield coalition of officers, police loyalists, and restorationists into a functioning state apparatus before Britain simply collapses into a different form of ruin."
 ENG_MIL_Secure_the_Depots:0 "Secure the Depots"
 ENG_MIL_Secure_the_Depots_desc:0 "The first priority is not rhetoric but control. Ammunition stores, transport hubs, fuel reserves, and supply depots have to be locked down under trustworthy officers before looting, sabotage, or local freelancing turns victory into fragmentation."
 ENG_MIL_Regional_Stabilisation_Bureaus:0 "Regional Stabilisation Bureaus"
 ENG_MIL_Regional_Stabilisation_Bureaus_desc:0 "The country cannot be run from a war room alone. Temporary regional bureaus will coordinate policing, rationing, communications, and emergency directives until a broader civil administration is rebuilt."
 ENG_MIL_Reopen_the_Rail_Arteries:0 "Reopen the Rail Arteries"
 ENG_MIL_Reopen_the_Rail_Arteries_desc:0 "Britain's railways and freight lines were disrupted by war, sabotage, and political collapse. Reopening the national transport spine is the quickest way to show that the new regime can move coal, food, steel, and people more effectively than the republic it destroyed."
 ENG_MIL_Recommission_the_Yards:0 "Recommission the Yards"
 ENG_MIL_Recommission_the_Yards_desc:0 "Idle workshops, damaged plant, and interrupted contracts must be brought back under disciplined management. The reconstruction state will need not just soldiers but rifles, vehicles, spare parts, and a functioning industrial rhythm."
 ENG_MIL_Vet_the_Officer_Corps:0 "Vet the Officer Corps"
 ENG_MIL_Vet_the_Officer_Corps_desc:0 "The military won the civil war, but not every uniform can be trusted equally. Promotion boards, loyalty reviews, and selective retirements will be used to ensure that command rests with officers who are politically reliable as well as professionally competent."
 ENG_MIL_Temporary_Civil_Administration:0 "Temporary Civil Administration"
 ENG_MIL_Temporary_Civil_Administration_desc:0 "Martial rule can hold a line, but it cannot repair every council office, courthouse, and utility board by itself. The regime must therefore recruit a caretaker civil administration willing to serve under military supervision while ordinary governance is pieced back together."
 ENG_MIL_National_Reconstruction_Authority:0 "National Reconstruction Authority"
 ENG_MIL_National_Reconstruction_Authority_desc:0 "Emergency rule now needs an institution built for more than emergency. A National Reconstruction Authority will centralise priorities for transport, housing, industry, utilities, and local recovery so the regime can claim to be restoring Britain, not merely occupying it."
 ENG_MIL_Restore_Local_Government:0 "Restore Local Government"
 ENG_MIL_Restore_Local_Government_desc:0 "The provinces cannot remain indefinitely under improvised command posts and emergency committees. Loyal local government has to be restored, supervised, and gradually returned to routine administration if the country is to feel governed again rather than merely pacified."
 ENG_MIL_Arsenal_of_Recovery:0 "Arsenal of Recovery"
 ENG_MIL_Arsenal_of_Recovery_desc:0 "Reconstruction must not leave the regime militarily hollow. Britain will rebuild workshops and supply chains in ways that support both economic recovery and the permanent readiness of the new order's armed guardians."
 ENG_MIL_Controlled_Civilian_Handback:0 "Controlled Civilian Handback"
 ENG_MIL_Controlled_Civilian_Handback_desc:0 "The army can preserve the political result of the war without ruling every office forever. Power will therefore be handed back selectively to civilian institutions, but only within a settlement shaped, monitored, and ultimately guaranteed by the military victors."
 ENG_MIL_Permanent_National_Directorate:0 "Permanent National Directorate"
 ENG_MIL_Permanent_National_Directorate_desc:0 "The officers who won the war may conclude that stepping back would only invite the old crisis to return in another form. Britain would then be fixed not through supervised normality, but through a permanent command state led openly by the military itself."
 ENG_military_emergency_administration:0 "Military Emergency Administration"
 ENG_military_emergency_administration_desc:0 "Britain is being held together by a disciplined wartime administration that cuts through delay, imposes order on logistics, and centralises authority in the name of recovery."
 ENG_reconstruction_under_guard:0 "Reconstruction Under Guard"
 ENG_reconstruction_under_guard_desc:0 "The new order ties rebuilding directly to military supervision, using controlled investment and command discipline to restore industry, transport, and state capacity."
 ENG_guarded_constitutional_settlement:0 "Guarded Constitutional Settlement"
 ENG_guarded_constitutional_settlement_desc:0 "Political life has been restored, but not left unguarded. The postwar constitution is designed to permit civilian normality without ever allowing the old crisis to return unchecked."
 ENG_permanent_national_directorate:0 "Permanent National Directorate"
 ENG_permanent_national_directorate_desc:0 "The military has chosen not to recede behind institutions but to become the enduring political core of the restored state, tying national stability directly to command authority."