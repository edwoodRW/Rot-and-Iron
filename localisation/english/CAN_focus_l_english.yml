l_english:
 CAN_The_Imperial_Defense_Appropriations_Act:0 "The Imperial Defense Appropriations Act"
 CAN_The_Imperial_Defense_Appropriations_Act_desc:0 "The geopolitical reality of 2026 is unforgiving. Surrounded by a red continent to our south and a red ocean to our east, Canada's current peacetime budget is an active invitation to our own destruction. Prime Minister Conrad Black, in tandem with Deputy PM Rees-Mogg, has formally introduced the Imperial Defense Appropriations Act to the House of Commons. We must rally our coalition partners, silence the pacifist opposition, and unlock the treasury for the rearmament of the Dominion."
 CAN_Settle_the_Timber_Rights:0 "Settle the Timber Rights"
 CAN_Settle_the_Timber_Rights_desc:0 "Canada's vast boreal forests are one of our greatest strategic assets, but who gets to harvest them? The Imperial Restoration Party demands that crown timber leases in British Columbia and Ontario be handed directly to exiled British forestry conglomerates to rapidly build military transport shipping. Conversely, our domestic Progressive Conservative base insists these lucrative contracts remain with local Canadian lumber firms to keep the domestic economy stable. We must sit down with both factions and iron out a timber distribution treaty before sawdust turns to political ash."
 CAN_Settle_the_Steel_Quotas:0 "Settle the Steel Quotas"
 CAN_Settle_the_Steel_Quotas_desc:0 "The blast furnaces of Hamilton and the Great Lakes are roaring at maximum capacity, but there is simply not enough high-grade steel to satisfy everyone. Conrad Black's industrialists want the steel allocated to building up our domestic rail networks, heavy manufacturing plants, and defensive border fortifications. Meanwhile, Jacob Rees-Mogg's Admiralty delegates argue that every single ton of steel must be reserved for laying down the hulls of new destroyers and heavy cruisers. We must decide whose vision of steel takes priority."
 CAN_The_Grand_Compromise_of_26:0 "The Grand Compromise of 26"
 CAN_The_Grand_Compromise_of_26_desc:0 "The debate has been fierce, the late-night sessions in Parliament grueling, and the scotch flows freely in the backrooms of Ottawa. The local Tories and the British Exiles have tested each other's limits, but both Conrad Black and Jacob Rees-Mogg understand that a fractured government will only pave the way for a Liberal-NDP takeover. It is time to sign the Grand Compromise of 2026. This historic budget agreement will formally split Canada's industrial output. We must lock in our long-term grand strategy: will we fortify our new home, or prepare to reclaim our old one?"
 CAN_Prepare_for_Elections_Black:0 "Prepare for Elections (Black)"
 CAN_Prepare_for_Elections_Black_desc:0 "With our domestic policies secured and the Detroit Agreement signed, it is time to return to the people. Jacob Rees-Mogg has been sidelined, and the coalition is ready for a new direction. We will dissolve Parliament and call for a general election to determine Canada's future path."
 CAN_Prepare_for_Elections_Mogg:0 "Prepare for Elections"
 CAN_Prepare_for_Elections_Mogg_desc:0 "With the armada destroyed and the Reclamation dream shattered, the Mogg faction has lost its credibility. Conrad Black has been forced to step aside, and the nation faces a crossroads. We will dissolve Parliament and call for a general election to determine Canada's future path."
 CAN_Carney_Economic_Stabilization:0 "Economic Stabilization"
 CAN_Carney_Economic_Stabilization_desc:0 "Mark Carney's first priority is to stabilize Canada's economy after years of coalition infighting. We will implement sound monetary policy and reduce uncertainty in the markets."
 CAN_Carney_Financial_Reform:0 "Financial Reform"
 CAN_Carney_Financial_Reform_desc:0 "Mark Carney, once the world's most trusted central banker, has no patience for Ottawa's improvised wartime finance. Speculative currency plays and undercapitalized wartime bond issues threaten to undo a decade of careful monetary stewardship. Carney will rewrite the regulatory rulebook from the ground up -- tightening reserve requirements, closing the loopholes exploited by exile financiers, and restoring the institutional discipline that kept Canada solvent while half the old world burned."
 CAN_Carney_Infrastructure_Investment:0 "Infrastructure Investment"
 CAN_Carney_Infrastructure_Investment_desc:0 "Years of coalition infighting between Black's fortress-builders and Mogg's armada-financiers have left ordinary infrastructure to rot -- potholed highways, aging bridges, telecommunications networks a decade behind Washington's. Carney intends to correct course with a long-view infrastructure program: rebuilding the arteries a modern economy actually needs, whether or not a single soldier ever crosses the Atlantic."
 CAN_Carney_Green_Energy:0 "Green Energy Transition"
 CAN_Carney_Green_Energy_desc:0 "The war economy has been an excuse to defer every environmental commitment indefinitely. Carney disagrees with the premise: renewable capacity is not a luxury for peacetime, it is energy security by another name. Hydro expansion, grid modernization, and a managed transition away from volatile oil markets will do more for Canada's resilience than another shipyard ever could."
 CAN_Carney_Trade_Diversification:0 "Trade Diversification"
 CAN_Carney_Trade_Diversification_desc:0 "A nation that ships its exports through a single, war-strained ocean is a nation one naval blockade away from ruin. Carney will use his considerable standing in the world's finance ministries to open new markets across the Pacific and Latin America, ensuring that no single crisis -- American, British, or Soviet -- can strangle the Canadian economy."
 CAN_Carney_Central_Bank:0 "Central Bank Independence"
 CAN_Carney_Central_Bank_desc:0 "Every faction in this Parliament -- Black's nationalists, Mogg's crusaders, Angus's socialists -- has at one point or another eyed the central bank as a lever for their own agenda. Carney will do what he did in London and Ottawa before: wall the institution off from political interference entirely, whatever the short-term cost to whoever currently holds power."
 CAN_Carney_Carbon_Pricing:0 "Carbon Pricing"
 CAN_Carney_Carbon_Pricing_desc:0 "Carney's answer to the climate question is, as ever, a market answer: price the externality and let industry adapt. A national carbon pricing scheme, calibrated to protect the trade-exposed sectors the war economy depends on, will cut emissions without ever having to write a single command-economy regulation."
 CAN_Carney_Technocratic_Governance:0 "Technocratic Governance"
 CAN_Carney_Technocratic_Governance_desc:0 "Carney has watched Black and Mogg run the Dominion on instinct, ideology, and inherited grudge for long enough. He proposes something radical for Ottawa: expert-led ministries, insulated from the factional horse-trading of the coalition, staffed by economists and administrators chosen for competence rather than loyalty to any exile faction."
 CAN_Carney_Global_Leadership:0 "Global Economic Leadership"
 CAN_Carney_Global_Leadership_desc:0 "With the old order in London gone and Washington increasingly inward-looking, someone has to hold the free world's financial architecture together. Carney intends for that someone to be Ottawa -- chairing the trade summits, brokering the currency agreements, and quietly becoming the indispensable capital of a fracturing Western order."
 CAN_Carney_Legacy:0 "Carney's Legacy"
 CAN_Carney_Legacy_desc:0 "The reforms are complete. Inflation is tamed, the institutions are insulated from factional capture, and Canadian trade no longer hangs entirely on the fate of a single ocean convoy. Whatever comes next -- reclamation, fortress, or something else entirely -- it will be built on foundations Mark Carney poured himself."
 CAN_Angus_Workers_Rights:0 "Workers' Rights"
 CAN_Angus_Workers_Rights_desc:0 "Charlie Angus built his career in the mining towns of Northern Ontario, and he has not forgotten who actually built this country's wartime economy. He will move to enshrine sectoral bargaining rights, raise the federal minimum wage, and make clear to Bay Street that the coalition's rearmament will not be financed on the backs of underpaid shift workers."
 CAN_Angus_Labour_Organization:0 "Labour Organization"
 CAN_Angus_Labour_Organization_desc:0 "Decades of anti-union legislation, much of it inherited wholesale from exile-era British common law, have left Canadian workers with less bargaining power than their American counterparts. Angus will tear up the old certification barriers, protect sympathy strikes, and give the labour movement the legal teeth it needs to actually shape the postwar settlement."
 CAN_Angus_Public_Housing:0 "Public Housing"
 CAN_Angus_Public_Housing_desc:0 "Halifax's shipyards and Ontario's arms factories have drawn workers by the tens of thousands into cities with nowhere to put them. Angus will launch a national public housing program on the scale of the wartime industrial mobilization itself -- because a worker sleeping in a rooming house shared by six others cannot be expected to build the tanks Ottawa needs."
 CAN_Angus_Healthcare_Expansion:0 "Healthcare Expansion"
 CAN_Angus_Healthcare_Expansion_desc:0 "The exile elite arrived with private physicians and private clinics; the Canadians who actually staff the factories and the front lines have queued for care since before the war began. Angus will extend public healthcare coverage nationwide, funded in part by the same wealth taxes Rees-Mogg once used to bankroll an armada."
 CAN_Angus_Indigenous_Rights:0 "Indigenous Rights"
 CAN_Angus_Indigenous_Rights_desc:0 "The Fortress of the North cannot be built on unceded land and broken treaties. Angus, who has spent years pushing federal governments to honour their obligations to First Nations communities, will move to formalize consultation rights, resolve outstanding land claims, and ensure that northern development serves the people who have lived there for millennia -- not just the war planners in Ottawa."
 CAN_Angus_Environmental_Justice:0 "Environmental Justice"
 CAN_Angus_Environmental_Justice_desc:0 "It is always the same neighbourhoods, the same reserves, the same working-class towns that absorb the smokestacks and tailings ponds of Canada's industrial mobilization. Angus will legislate environmental review processes that can no longer be waived for wartime expediency, and direct remediation funding to the communities that have paid the environmental cost of this rearmament."
 CAN_Angus_Education_Reform:0 "Education Reform"
 CAN_Angus_Education_Reform_desc:0 "A country that expects its young people to fight, weld, and vote deserves to educate them properly first. Angus will expand federal funding for public schools and make post-secondary education tuition-free for any Canadian willing to serve in the reconstruction effort -- whether in a factory, a laboratory, or a classroom of their own."
 CAN_Angus_Cooperative_Economy:0 "Cooperative Economy"
 CAN_Angus_Cooperative_Economy_desc:0 "Not every Canadian industry needs a Bay Street shareholder or an exile financier sitting on its board. Angus will extend low-interest federal credit to worker cooperatives and community-owned enterprises, betting that an economy owned by the people who actually work it will prove more resilient than one built on speculative exile capital."
 CAN_Angus_Northern_Development:0 "Northern Development"
 CAN_Angus_Northern_Development_desc:0 "Every government since Confederation has promised to develop the North and then quietly forgotten by the second budget cycle. Angus intends to be the exception: permanent infrastructure, year-round transportation links, and real investment in the Indigenous and settler communities north of the 60th parallel, rather than another feasibility study destined for a filing cabinet."
 CAN_Angus_New_Canada:0 "The New Canada"
 CAN_Angus_New_Canada_desc:0 "Together, we have built a more just and equitable Canada. This is just the beginning of our work to create a society that works for everyone."
 CAN_Boris_Strong_Leadership:0 "Strong Leadership"
 CAN_Boris_Strong_Leadership_desc:0 "When Black falters and Mogg's crusade collapses, someone has to hold what remains of the coalition together, and Boris Johnson has never doubted for a second that someone should be him. He will govern by instinct, bluster, and sheer force of personality -- betting, as he always has, that confidence alone can paper over a crisis rhetoric cannot actually solve."
 CAN_Boris_Military_Modernization:0 "Military Modernization"
 CAN_Boris_Military_Modernization_desc:0 "Whatever else can be said of Boris Johnson, he has never met a rearmament program he didn't like. He will push through procurement reform, cut through the paperwork strangling the Ministry of Defence, and fast-track whatever equipment the generals say they need -- regardless of whether the treasury can actually afford it."
 CAN_Entente_Reclamation:0 "Entente Reclamation"
 CAN_Entente_Reclamation_desc:0 "Mogg may be gone, discredited, or dead, but the dream that brought the exiles across the Atlantic in 1999 does not simply die with him. Under Johnson, the Reclamation becomes personal rather than institutional -- a promise made not by a government white paper, but by a man who remembers exactly what was left behind in London."
 CAN_Exile_Integration:0 "Exile Integration"
 CAN_Exile_Integration_desc:0 "Twenty-seven years after the Great Exile, the line between "Canadian" and "British exile" has blurred more than either Black's nationalists or Mogg's crusaders like to admit. Johnson will formalize what has already happened on the ground -- full citizenship rights, recognized professional credentials, and an end to the informal barriers that have kept the exile community a class apart."
 CAN_The_Fortress_of_the_North:0 "The Fortress of the North"
 CAN_The_Fortress_of_the_North_desc:0 "Let the old world tear itself to pieces. Under the steady, realistic leadership of the Progressive Conservative government and our reformed Entente partners, Canada stands as the ultimate, unyielding sanctuary of the free market. Secure behind our heavily fortified borders, fueled by Albertan oil, and backed by a united alliance of Pacific and American holdouts, we are an unbreakable bastion. Let the socialist republics and communist empires exhaust themselves against our shield. We stand ready."
 CAN_The_Black_Plan:0 "The Black Plan"
 CAN_The_Black_Plan_desc:0 "Prime Minister Conrad Black has made his position clear: Canada is no longer a mere colony or a stepping stone for exiled royalty. We are a sovereign, powerhouse nation in our own right, and our first duty is to our own citizens. The 'Black Plan' rejects the reckless, romantic crusade to liberate Europe in favor of building a self-sufficient, heavily fortified North American bastion. We will secure our borders, protect our local industries from foreign speculation, and ensure that Canadian steel and blood are used exclusively to guard Canadian soil."
 CAN_THE_MOGG_PLAN:0 "The Mogg Plan"
 CAN_THE_MOGG_PLAN_desc:0 "Deputy Prime Minister Jacob Rees-Mogg has successfully rallied the cabinet behind the ultimate goal of the 1999 exiles: the Reclamation. The 'Mogg Plan' rejects the passive, turtle-like isolationism of the Canadian establishment. It declares that Canada's true destiny is to serve as the ultimate launching pad for a grand crusade across the Atlantic to tear down the socialist usurpers in London. Every factory, shipyard, and citizen must be integrated into a total-war economy geared toward amphibious invasion. We are going home, and we will stop at nothing to get there."
 CAN_The_St_Lawrence_Shield:0 "The St. Lawrence Shield"
 CAN_The_St_Lawrence_Shield_desc:0 "A country that relies on foreign shipping for basic goods is a country waiting to be blockaded. With the North Atlantic a warzone, we must reorganize our domestic markets. Under Black's direction, Canada will raise steep tariffs on imports and restrict foreign capital, forcing our economy to produce everything we need within our own borders."
 CAN_Subsidize_the_Laurentian_Mills:0 "Subsidize the Laurentian Mills"
 CAN_Subsidize_the_Laurentian_Mills_desc:0 "For decades, our domestic manufacturing has been sidelined by the massive influx of British exile speculative capital. It is time to redirect Canada's financial power back to its roots. By injecting state subsidies directly into the steel mills of Ontario and the manufacturing hubs of the St. Lawrence valley, we will keep local employment high, satisfy Canadian business owners, and build a self-reliant economy."
 CAN_Keep_the_Exiles_in_Check:0 "Keep the Exiles in Check"
 CAN_Keep_the_Exiles_in_Check_desc:0 "While the British exiles are our allies, their endless lobbying for an invasion of Europe threatens to destabilize our domestic peace. Conrad Black will use his extensive media empire and the RCMP (Royal Canadian Mounted Police) to quietly curtail the political influence of the Imperial Restoration Party's most radical elements, ensuring they answer to Ottawa, not London."
 CAN_Canadian_Patents_First:0 "Canadian Patents First"
 CAN_Canadian_Patents_First_desc:0 "The Royal Canadian Forces have spent years relying on outdated British designs brought over during the Great Influx of 1999. No longer. Canadian engineers at Montreal Locomotive Works are capable of world-class innovation. We will prioritize domestic patents, developing heavy armor and rugged industrial machinery designed specifically to operate in the harsh, freezing climates of northern North America."
 CAN_Settle_the_Prairie_Wheat:0 "Settle the Prairie Wheat"
 CAN_Settle_the_Prairie_Wheat_desc:0 "The granaries of Alberta, Saskatchewan, and Manitoba feed not just Canada but the entire Entente war effort, and the prairie farmers know it. Ottawa will guarantee fixed purchase prices for wheat and barley, securing the loyalty of the West and ensuring that no naval blockade or Atlantic convoy loss can ever translate into bread lines in Toronto or Montreal."
 CAN_Laurentian_Steel_Mills:0 "Laurentian Steel Mills"
 CAN_Laurentian_Steel_Mills_desc:0 "The vast agricultural fields of Alberta, Saskatchewan, and Manitoba must be protected. We will guarantee fixed prices for prairie wheat, securing the loyalty of our Western farmers and ensuring that our cities and military forces are entirely insulated from global food shortages."
 CAN_Protect_the_Border_Pipelines:0 "Protect the Border Pipelines"
 CAN_Protect_the_Border_Pipelines_desc:0 "Our oil pipelines running from Alberta to the east are vulnerable to American sabotage or cross-border raids. We will build hardened, underground pumping stations and deploy dedicated air-patrol wings to monitor our critical energy corridors 24/7."
 CAN_Canadian_Autarky:0 "Canadian Autarky"
 CAN_Canadian_Autarky_desc:0 "A country that relies on foreign shipping for basic goods is a country waiting to be blockaded. With the North Atlantic a warzone, we must reorganize our domestic markets. Under Black's direction, Canada will raise steep tariffs on imports and restrict foreign capital, forcing our economy to produce everything we need within our own borders."
 CAN_The_Great_Lakes_Flotilla:0 "The Great Lakes Flotilla"
 CAN_The_Great_Lakes_Flotilla_desc:0 "The watery border between Canada and the United States is vast and vulnerable. We will commission a specialized fleet of shallow-draft patrol boats, armed monitors, and naval mine-layers specifically designed to dominate the Great Lakes and prevent any American incursion into Canadian territory."
 CAN_Conscript_the_National_Guard:0 "Conscript the National Guard"
 CAN_Conscript_the_National_Guard_desc:0 "We cannot match the population of the United States, but we can match their determination. We will reform our local militia networks into a highly organized, professional National Guard. Every able-bodied Canadian citizen will receive baseline defensive military training, ensuring that any invading force will have to fight for every single pine tree and mountain pass."
 CAN_Reorganize_the_Entente:0 "Reorganize the Entente"
 CAN_Reorganize_the_Entente_desc:0 "For too long, our Entente allies have wasted valuable resources dreaming of reclaiming their lost European homelands. We must disabuse them of these fantasies. Prime Minister Conrad Black will host the Ottawa Conference, laying down a new charter for the alliance. The Entente will no longer be an association of desperate exiles chasing ghosts; it will be a streamlined, tightly integrated economic and military bloc dedicated purely to mutual defense, trade autarky, and containment of the socialist powers."
 CAN_Alberta_Energy_Independence:0 "Alberta Energy Independence"
 CAN_Alberta_Energy_Independence_desc:0 "Alberta's oil fields are the backbone of Western Canada's economy. We must secure energy independence from American markets and ensure our resources serve Canadian interests first."
 CAN_Reform_the_Officer_Corps:0 "Reform the Officer Corps"
 CAN_Reform_the_Officer_Corps_desc:0 "The Royal Canadian Forces' senior ranks are still disproportionately filled with British exile officers who arrived in 1999 with more pedigree than combat experience. Black will open the officer academies to merit-based Canadian recruitment, breaking the informal old-boys' network that has kept command appointments an exile privilege rather than a Canadian one."
 CAN_The_Northern_Shield:0 "The Northern Shield"
 CAN_The_Northern_Shield_desc:0 "Romeo Saganash's Northern Affairs Ministry has proposed a revolutionary approach to northern defense: integrate Indigenous knowledge, invest in northern infrastructure, and defend the Arctic through communities that have lived there for millennia."
 CAN_Manage_the_Bernier_Problem:0 "Manage the Bernier Problem"
 CAN_Manage_the_Bernier_Problem_desc:0 "Maxime Bernier represents a persistent thorn in the government's side. His libertarian critique of Black's economic nationalism and his willingness to court Western separatist sentiment make him dangerous. We must neutralize him—either through co-option, marginalization, or decisive action—before his influence spreads beyond Quebec's borders."
 CAN_Indigenous_Consultation:0 "Indigenous Consultation"
 CAN_Indigenous_Consultation_desc:0 "Meaningful consultation with Indigenous communities is not just a legal obligation—it is a strategic necessity. The knowledge of northern territories, the understanding of Arctic conditions, and the traditional connections to the land that Indigenous peoples possess are invaluable for Canada's defense and development. The government will establish formal consultation frameworks and implement treaty obligations."
 CAN_Requisition_the_Exile_Wealth:0 "Requisition the Exile Wealth"
 CAN_Requisition_the_Exile_Wealth_desc:0 "The wealthy lords, financiers, and industrialists who fled London in 1999 did not bring their fortunes to Canada to let them sit idle. They brought them to fund the counter-revolution. Rees-Mogg has drafted emergency legislation to heavily tax and requisition the vast, offshore holdings of the British exile elite. While this will shock the local financial markets, it will immediately provide the astronomical capital required to build a world-class crusader army."
 CAN_The_Halifax_Super_Docks:0 "The Halifax Super Docks"
 CAN_The_Halifax_Super_Docks_desc:0 "If we are to launch an armada, we need the berths to build it. We will initiate a massive expansion of the Halifax shipyards, constructing giant dry-docks capable of laying down multiple aircraft carriers and modern battleships simultaneously. Halifax will become the largest, busiest military harbor in the Western Hemisphere."
 CAN_The_Blue_Water_Mandate:0 "The Blue-Water Mandate"
 CAN_The_Blue_Water_Mandate_desc:0 "A defensive navy is a useless navy. If we are to ever cross the Atlantic and break the stranglehold of Starmer's socialist blockade, the Royal Canadian Navy must be transformed into a terrifying, blue-water force of capital ships. We will heavily subsidize deep-water shipyard hulls, laying down escort fleets capable of fighting in the rough, freezing waters of the North Atlantic."
 CAN_Commission_the_Exiled_Officers:0 "Commission the Exiled Officers"
 CAN_Commission_the_Exiled_Officers_desc:0 "Canadian military academies are excellent at producing competent peacetime commanders, but they lack the bitter, combat-hardened edge of those who fought in the streets during the fall of Britain in 1999. We will officially open the officer ranks of the Royal Canadian Forces to veteran British exile officers, instilling our divisions with a fanatical, disciplined drive to retake the homeland."
 CAN_Conscript_the_Resettled:0 "Conscript the Resettled"
 CAN_Conscript_the_Resettled_desc:0 "Millions of British refugees have integrated into Canadian society since 1999, but many have not yet served. We will pass the Service of the Crown Act, establishing mandatory military conscription for all second-generation British exiles living in Canada. They will be the vanguard of our liberation force, and they will be the ones to finally bring the fight to the socialist usurpers."
 CAN_Press_Gang_the_Merchantry:0 "Press Gang the Merchantry"
 CAN_Press_Gang_the_Merchantry_desc:0 "An invasion across the Atlantic requires an astronomical amount of logistical shipping. We will pass emergency maritime laws allowing the state to requisition civilian merchant ships, tankers, and cargo vessels, converting them into troop transports and supply ships for the Royal Armada."
 CAN_Draft_the_Liberation_Army:0 "Draft the Liberation Army"
 CAN_Draft_the_Liberation_Army_desc:0 "Our infantry divisions must be trained specifically for amphibious, coastal, and urban warfare. We will establish specialized training camps in the rugged terrain of Nova Scotia, replicating the landing conditions of the British coastline. Our soldiers will learn to fight from the sea."
 CAN_Suppress_the_Quiet_Liberals:0 "Suppress the Quiet Liberals"
 CAN_Suppress_the_Quiet_Liberals_desc:0 "Pacifist politicians and liberal media outlets are calling our crusade \"suicidal madness.\" We cannot allow their defeatist rhetoric to poison public morale. Rees-Mogg will use wartime security acts to censor anti-war publications and restrict the political activities of those who advocate for peace with the red world."
 CAN_The_Admiralty_Protocols:0 "The Admiralty Protocols"
 CAN_The_Admiralty_Protocols_desc:0 "Command of our armed forces must be streamlined. We will merge the Canadian General Staff with the exiled British Admiralty, creating a unified, highly efficient command structure designed solely to execute complex, multi-service invasion strategies across vast oceanic distances."
 CAN_Secure_the_Newfoundland_Base:0 "Secure the Newfoundland Base"
 CAN_Secure_the_Newfoundland_Base_desc:0 "Newfoundland is our closest stepping stone to Europe. We will construct massive naval refueling depots, underground ammunition bunkers, and heavily fortified airbases on the island, turning it into our final staging ground before the fleet sails east."
 CAN_Summon_the_Entente_Cohorts:0 "Summon the Entente Cohorts"
 CAN_Summon_the_Entente_Cohorts_desc:0 "The hour of reckoning approaches, and Canada will not cross the Atlantic alone. As the leader of the Entente, we command the last righteous armies of the civilized world. Deputy PM Rees-Mogg has sent a clear ultimatum to Algiers, Melbourne, and beyond: every available division, every capital ship, and every air wing under the Entente banner must assemble in the harbors of Nova Scotia and Newfoundland. Any ally who hesitates to join this holy crusade will be cut off from Canadian industrial support."
 CAN_The_Exiles_Mark_Their_Return:0 "The Exiles Mark Their Return"
 CAN_The_Exiles_Mark_Their_Return_desc:0 "We have not spent twenty-seven years in exile to simply wither away in the snows of Ottawa, the deserts of Africa, or the outback of Australia. Our homes, our history, and our sovereign Lord the King belong in London. Backed by the entire, fanatical might of the Entente, the grand crusade has begun. The ships are ready, the armies are drilled, and the skies are clear. We are the history makers of the return, and we will not stop until the Union Jack flies high over Westminster once more."
 CAN_continental_free_trade:0 "Continental Free Trade"
 CAN_continental_free_trade_desc:0 "The Grand Compromise of 2026 has created an opening that has not existed since the Great Exile. Canada can begin the process of economic integration with the United States, opening trade channels that have been closed for twenty-seven years."
 CAN_minority_government_branch:0 "A Government Renewed"
 CAN_minority_government_branch_desc:0 "Jacob Rees-Mogg is gone. The coalition that brought his Imperial Restoration Party into the heart of Canadian government has broken. What remains is a National Conservative minority administration that must now govern without the exile establishment's resources and must justify its existence to a Parliament it does not control. It is, Boris Johnson has said privately, the first time since 1999 that the Government of Canada has actually been a government of Canada."
 CAN_north_american_investment:0 "North American Investment"
 CAN_north_american_investment_desc:0 "American capital is flowing north for the first time in a generation. Turner's administration has quietly encouraged US firms to invest in Canadian manufacturing — partly out of genuine goodwill, partly because a prosperous Canada is a stable Canada is a Canada that does not build armadas in Halifax harbour. The factories are going up. The jobs are being filled. Conrad Black, watching the construction crews, allows himself something almost like satisfaction."
 CAN_laurentian_trade_corridor:0 "The Laurentian Corridor"
 CAN_laurentian_trade_corridor_desc:0 "The St Lawrence Seaway is the spine of the Canadian economy — the route through which the continent's goods have always moved. With the Detroit Agreement in place, the Seaway can become what it always should have been: the central artery of a continental trading relationship rather than a militarised border. Infrastructure investment, customs simplification, joint navigation protocols. The river that divided us becomes the river that connects us."
 CAN_shared_defence_framework:0 "Shared Defence Framework"
 CAN_shared_defence_framework_desc:0 "Military cooperation between Canada and the United States has been formally proposed for the first time since the Great Exile. It is not an alliance — not yet. It is a framework for communication, intelligence sharing, and joint exercises. Turner's generals and Black's generals are sitting in the same room, looking at the same maps, for the first time in twenty-seven years. Boris Johnson, told of the meeting, is said to have looked out the window for a long time without speaking."
 CAN_north_american_pact:0 "The North American Pact"
 CAN_north_american_pact_desc:0 "It is not the alliance Conrad Black imagined when he came to power. He imagined Canada as a sovereign fortress — self-sufficient, armoured, indifferent to the world beyond its borders. What has emerged is something more complicated and, perhaps, more durable: a partnership between two nations that have spent twenty-seven years regarding each other with suspicion and discovered, to their mutual surprise, that they need each other. The Pact commits both governments to mutual defence, economic integration, and — most remarkably — a joint framework for managing the successor states emerging from the Soviet collapse. Canada and America, together, shaping the world that comes next. Conrad Black reads the final text in his office at two in the morning and thinks about all the things he did not expect to live to see."
 CAN_secure_the_backbench:0 "Secure the Backbench"
 CAN_secure_the_backbench_desc:0 "The IRP's departure has left seventeen seats vacant in the coalition. Some NCP backbenchers are already receiving calls from Rees-Mogg's people. Black must move quickly — reassure his own MPs that the government is stable, that the Detroit Agreement is a strength not a weakness, that the future he is building is worth staying for. The patronage networks must be maintained. The committee positions must be filled. The calls must be returned. Unglamorous work. Essential work."
 CAN_boris_platform:0 "Boris's Platform"
 CAN_boris_platform_desc:0 "Boris Johnson as Deputy Prime Minister is the most popular politician in Canada. This is, to almost everyone who knows him, deeply counterintuitive. He is a British exile. He is famously chaotic. He has no obvious qualifications for the role beyond the fact that ordinary Canadians — waiting at bus stops, watching the news, reading his speeches on their phones — find him, inexplicably, completely impossible not to like. Black has decided to use this. Give Boris a platform. Let him make the case for the new Canada. See what he builds. See what he destroys. And then, when the time comes, let him take the fall for it."
 CAN_carney_accord:0 "The Carney Accord"
 CAN_carney_accord_desc:0 "The formal agreement between the National Conservative minority government and Mark Carney's Continentalist Party commits Ottawa to three things: the Detroit Agreement framework as official policy, trade talks with Washington within ninety days, and Indigenous land rights consultation with a binding timeline. Carney's caucus voted for it unanimously. Black's caucus voted for it with six abstentions and one resignation. The government survives. The work begins."
 CAN_angus_compact:0 "The Angus Compact"
 CAN_angus_compact_desc:0 "The agreement between Conrad Black and Charlie Angus is informal, unwritten, and politically extraordinary. The CCF does not formally support the government. It has agreed, for now, not to bring it down. In exchange: conscription repealed, Hamilton resolved, and a seat at the table — one real seat with real power — for the people the Canadian state has spent a century ignoring. It is not everything Angus asked for. It is more than anyone has ever delivered. He told his caucus: we are not done. We are started."
 CAN_stabilise_the_north:0 "Stabilise the North"
 CAN_stabilise_the_north_desc:0 "The Northern Shield is not on any official map. It has no name in any government document. It is simply the understanding — formalised through Romeo Saganash's Ministry of Northern Affairs — that the vast territories north of the sixtieth parallel, territories that cover more than half of Canada's landmass, will be defended not by conventional military force but by the communities that have lived in them for ten thousand years. Every hunter knows the land. Every village is a listening post. Every trail is a defensive position. Any force attempting to move through the Canadian North will find it has walked into a country that knows exactly where it is."
 CAN_prepare_for_elections:0 "Prepare for Elections"
 CAN_prepare_for_elections_desc:0 "Black has decided to go to the country. The minority government has accomplished what it set out to accomplish — the Detroit Agreement, the conscription repeal, the beginning of an Indigenous settlement. Now he wants a mandate. A real one. Not the borrowed authority of other parties' tolerance but the direct authority of the Canadian people's choice. Boris thinks this is either very brave or very foolish. He has declined to specify which."
 CAN_blacks_last_act:0 "Black's Last Act"
 CAN_blacks_last_act_desc:0 "Conrad Black calls Boris into his office on a Tuesday morning in late winter. The Ottawa light is thin and grey. On the desk: the photograph that is always there. The cold coffee. The newspapers."
 CAN_britain_reclaimed:0 "Britain Reclaimed"
 CAN_britain_reclaimed_desc:0 "The nightmare is over. The Union Jack flies over London once more. The Entente has done the impossible, and now Canada must face the consequence of victory: the return of the exiles, the restoration of the old government, and the question of what relationship Canada will have with the Britain that nearly destroyed it."
 CAN_restore_the_ministries:0 "Restore the Ministries"
 CAN_restore_the_ministries_desc:0 "London lies liberated but leaderless -- Whitehall's ministries gutted, its civil service scattered or purged by the old regime. Canada's provisional administrators will reopen the machinery of government one department at a time: the Treasury first, then the Foreign Office, then whatever remains of a state that has not functioned in nearly three decades."
 CAN_feed_the_capital:0 "Feed the Capital"
 CAN_feed_the_capital_desc:0 "London liberated is not London fed. Food stores are empty, the Thames barges that once supplied the city lie rusted or requisitioned, and a hard winter could undo everything the invasion achieved. Canadian logistics officers will establish emergency supply corridors from the coast, because a starving capital cannot be expected to embrace whatever government Ottawa installs above it."
 CAN_restore_british_government:0 "Restore a British Government"
 CAN_restore_british_government_desc:0 "The war is over. Canada must relinquish direct control of England to a government able to stand before its own people."
 CAN_the_scottish_question:0 "The Scottish Question"
 CAN_the_scottish_question_desc:0 "Scotland is independent — perhaps permanently, perhaps not. The new government in London must decide whether to recognise Edinburgh's sovereignty, offer a new federal union, or demand the restoration of the old order. Canada, as the dominant power in the Entente, will have significant influence over this decision."
 CAN_recognise_scottish_sovereignty:0 "Recognise Scottish Sovereignty"
 CAN_recognise_scottish_sovereignty_desc:0 "Edinburgh broke from London during the chaos of the original revolution and has governed itself ever since. A liberated England claiming the mantle of restored legitimacy cannot, in the same breath, deny Scotland the self-determination it has already exercised for over two decades. Recognition costs pride; refusing it costs credibility Ottawa cannot spare."
 CAN_offer_a_new_union:0 "Offer a New Union"
 CAN_offer_a_new_union_desc:0 "A new relationship between England and Scotland — not the old imperial domination, but a voluntary partnership of equals. Canada will mediate the negotiations, offering economic incentives and security guarantees to encourage Edinburgh to rejoin the union on fair terms."
 CAN_demand_the_union_restored:0 "Demand the Union Restored"
 CAN_demand_the_union_restored_desc:0 "The United Kingdom must be whole. There can be no tolerance for Scottish separatism. Canada will support London's demand for immediate restoration of the Union, backed by economic pressure and the threat of military intervention if necessary."
 CAN_ratify_a_new_union:0 "Ratify a New Union"
 CAN_ratify_a_new_union_desc:0 "Scotland has accepted the federal proposal. A new United Kingdom is born — not the empire of old, but a partnership of equals. Canada's mediation has created something that might actually last."
 CAN_carney_economic_response:0 "Implement Carney's Reforms"
 CAN_carney_economic_response_desc:0 "Mark Carney's economic team has presented a comprehensive reform package. Deregulation, trade liberalization, and targeted investment in strategic sectors. The question is whether Canada has the political will to implement them."
 CAN_deregulate_markets:0 "Deregulate the Markets"
 CAN_deregulate_markets_desc:0 "Carney's economic philosophy is simple: remove barriers, attract capital, let markets work. The question is how far to go in opening Canada's economy to foreign investment."
 CAN_foreign_investment:0 "Attract Foreign Investment"
 CAN_foreign_investment_desc:0 "With regulatory barriers removed, foreign capital is flowing into Canada. American firms are building factories, European companies are investing in infrastructure, and the Canadian economy is being transformed."
 CAN_black_implementation_focus:0 "Fortress North America"
 CAN_black_implementation_focus_desc:0 "Conrad Black's vision of Canada as a self-sufficient North American fortress requires massive investment in defense, infrastructure, and economic autonomy. The work begins now."
 CAN_fortress_economy_complete:0 "The Fortress Economy"
 CAN_fortress_economy_complete_desc:0 "With the border fortified and domestic industry humming, Black's Canada First doctrine is complete: a nation that can defend, feed, and arm itself without depending on any foreign power."
 CAN_north_american_fortress:0 "North American Fortress"
 CAN_north_american_fortress_desc:0 "Canada must be a fortress that cannot be breached. Anti-air defenses, hardened infrastructure, and military installations will make any invasion of North America prohibitively expensive."
 CAN_domestic_industry:0 "Domestic Industry"
 CAN_domestic_industry_desc:0 "Canada's industrial base must be strengthened to support its defensive posture. New factories, expanded capacity, and strategic stockpiles will ensure the Dominion can weather any storm."
 CAN_detroit_agreement_mission:0 "Negotiate the Detroit Agreement"
 CAN_detroit_agreement_mission_desc:0 "Turner's call presents an opportunity that Canada cannot afford to miss. The Detroit Agreement could transform our relationship with the United States, opening trade channels and security cooperation that have been closed for twenty-seven years. But the negotiations will be delicate - Black's instinct is to drive a hard bargain, while Turner seeks a genuine partnership. How we approach this agreement will determine the future of North America."
 CAN_the_atlantic_reckoning:0 "The Atlantic Reckoning"
 CAN_the_atlantic_reckoning_desc:0 "The Atlantic has been red for too long. The socialist governments of Europe have claimed the ocean as their own, and Canadian shipping has suffered for it. It is time to reclaim the sea lanes. Whether through a new Entente navy or through agreements with the United States, Canada will secure its maritime access."
 CAN_black_faces_the_house:0 "Black Faces the House"
 CAN_black_faces_the_house_desc:0 "The Prime Minister must answer to Parliament. Conrad Black will face the House of Commons to defend his government's record, his policies, and his vision for Canada's future. The opposition is ready to pounce on any weakness, and his own coalition partners are restless. This is the moment that will determine whether Black's government survives or falls."
 CAN_mogg_refuses_defeat:0 "Mogg Refuses Defeat"
 CAN_mogg_refuses_defeat_desc:0 "Jacob Rees-Mogg will not accept the end of his Imperial Restoration Party's influence. Even as his coalition collapses, he plots his return to power. He will use every tool at his disposal - media manipulation, backroom deals, and appeals to the exile establishment - to undermine Black's government and position himself for a comeback."
 CAN_opening:0 "Opening Focus"
 CAN_opening_desc:0 "Twenty-seven years after the Great Exile scattered a generation of Britons across the Atlantic, the Dominion of Canada stands at a crossroads of its own making -- fortress or crusader, isolationist or avenger. The choices made in Ottawa's Parliament in the coming months will decide not just Canada's future, but whether the old country is ever seen again."
 CAN_angus_industrial_nationalization:0 "Industrial Nationalization"
 CAN_angus_industrial_nationalization_desc:0 "Angus has watched enough coalition governments hand strategic industries to exile financiers and Bay Street speculators. He will move to bring key sectors -- steel, shipbuilding, rail -- under public ownership, arguing that an economy built to survive a world war is too important to be left to shareholders answerable to no one but themselves."
 CAN_black_implementation:0 "Black Implementation"
 CAN_black_implementation_desc:0 "The Black Plan is no longer a debate in the House of Commons; it is the law of the land. Conrad Black will spend his remaining political capital ensuring every ministry, every Crown corporation, and every provincial government actually implements the fortress vision he fought so hard to win -- tariff walls, domestic steel quotas, and a border bristling with concrete."
 CAN_black_renewed_mandate:0 "Black's Renewed Mandate"
 CAN_black_renewed_mandate_desc:0 "The fortress stands, the tariffs hold, and the Entente has been reorganized on Ottawa's terms -- but a mandate this consequential cannot simply be assumed to carry indefinitely. Conrad Black will call for a fresh election, betting that a grateful, secure electorate will hand him the majority his coalition government never quite achieved."
 CAN_blackslastact:0 "Black's Last Act"
 CAN_blackslastact_desc:0 "Whatever comes next for Canada -- Carney's technocrats, Angus's socialists, or a return of the Mogg faction from the political wilderness -- Conrad Black intends to leave on his own terms. His final act in office will be remembered as either the capstone of the fortress he built, or the last gasp of a man who refused to see a Reclamation through that he always considered reckless."
 CAN_boris_inherits_the_future:0 "Boris Inherits the Future"
 CAN_boris_inherits_the_future_desc:0 "With Black's government exhausted and the Mogg faction discredited by the armada's destruction, someone from within the coalition must pick up the pieces. Boris Johnson, never a man to shy from ambition, steps forward to claim the leadership -- inheriting not just a government, but a fractured coalition still arguing about whether Canada's future lies at home or across the Atlantic."
 CAN_boris_naval_expansion:0 "Naval Expansion"
 CAN_boris_naval_expansion_desc:0 "The Royal Canadian Navy has spent a generation as an afterthought bolted onto Rees-Mogg's Admiralty ambitions. Boris Johnson wants it built into a service that can stand on its own -- new escort classes, a proper submarine arm, and a training pipeline that no longer depends on borrowed exile officers to crew half its ships."
 CAN_borispm:0 "Boris as Prime Minister"
 CAN_borispm_desc:0 "The backbenchers have made their choice, however reluctantly. Boris Johnson -- journalist, mayor, prime minister of a country that was not even his own twenty-seven years ago -- takes the keys to 24 Sussex Drive, promising the coalition a fresh start built on bluster, charm, and the sheer improbability of his own political survival."
 CAN_canada_before_reclamation:0 "Canada Before Reclamation"
 CAN_canada_before_reclamation_desc:0 "Before a single soldier crosses the Atlantic, before a single shipyard lays down an invasion hull, there is a harder question the coalition keeps avoiding: is Canada itself actually ready? This path insists on answering that question honestly -- securing the domestic economy, the prairie harvests, and the northern frontier before committing the Dominion to a war of choice thousands of miles from home."
 CAN_carney_economic_reforms:0 "Carney's Economic Reforms"
 CAN_carney_economic_reforms_desc:0 "The coalition years left Canada's financial institutions patched together with wartime improvisation and factional compromise. Mark Carney will apply the same rigorous, technocratic discipline that once steadied the Bank of England and the Bank of Canada in previous crises -- rewriting monetary policy, tightening fiscal oversight, and building an economy that can survive whichever faction holds power next."
 CAN_compromise:0 "The Compromise"
 CAN_compromise_desc:0 "Black wants a fortress. Rees-Mogg wants a crusade. Neither camp can muster the votes to impose their vision outright, and neither is willing to be the one who folds first. What emerges instead is compromise -- messy, unsatisfying to both sides, and very possibly the only thing standing between this coalition and outright collapse."
 CAN_election:0 "General Election"
 CAN_election_desc:0 "The coalition's mandate, secured in the chaos of the Great Exile's aftermath, was never meant to last this long without renewal. Ottawa will go to the polls, and the outcome -- fortress, crusade, or something neither Black nor Rees-Mogg anticipated -- will settle, for a few years at least, which vision of Canada's future actually commands the country's support."
 CAN_humiliation:0 "The Humiliation"
 CAN_humiliation_desc:0 "The armada is gone, the Reclamation dream lies at the bottom of the Atlantic, and the faction that promised to lead Canada home has nothing left to show for it but empty shipyards and a furious opposition. What follows is not just a change of government -- it is a reckoning the coalition cannot spin its way out of."
 CAN_learn_from_the_wreckage:0 "Learn from the Wreckage"
 CAN_learn_from_the_wreckage_desc:0 "Every burned ship and broken promise from the failed Reclamation attempt holds a lesson, if Ottawa is honest enough to learn it. A parliamentary commission will comb through the wreckage of the armada's destruction -- logistics failures, intelligence gaps, political overreach -- to ensure that whatever Canada attempts next does not repeat the same catastrophic mistakes."
 CAN_northern_affairs_setup:0 "Northern Affairs Setup"
 CAN_northern_affairs_setup_desc:0 "Canada's Arctic and subarctic territories have been administered, when they have been administered at all, as an afterthought bolted onto whichever ministry had spare capacity. A dedicated Ministry of Northern Affairs will finally give the North a permanent seat at the cabinet table, with a mandate covering everything from Indigenous consultation to Arctic sovereignty patrols."
 CAN_policy:0 "Policy Focus"
 CAN_policy_desc:0 "Not every decision in Ottawa carries the weight of a Grand Compromise or a declaration of Reclamation. This is the routine business of governing a Dominion at war -- the small legislative adjustments, ministerial reshuffles, and procedural housekeeping that never make the front page, but keep the machinery of state actually running."
 CAN_publish_the_halifax_report:0 "Publish the Halifax Report"
 CAN_publish_the_halifax_report_desc:0 "Commissioned quietly, feared openly, the Halifax Report lays bare exactly what the Royal Canadian Navy can and cannot do in a war against a modern naval power. Its publication will hand ammunition to Black's fortress advocates and Mogg's crusaders in equal measure, each finding in its pages the justification for whichever policy they already favoured."
 CAN_rebuild_the_armada:0 "Rebuild the Armada"
 CAN_rebuild_the_armada_desc:0 "The old armada sits at the bottom of the Atlantic, and with it, a generation of exile hopes for a swift Reclamation. Rees-Mogg's Admiralty will not be deterred: new keels will be laid at Halifax and the Great Lakes yards, built on the hard lessons of the last disaster, whatever the Treasury has to say about the cost."
 CAN_seek_a_new_mandate:0 "Seek a New Mandate"
 CAN_seek_a_new_mandate_desc:0 "A government that has reshaped Canada's economy, foreign policy, and constitutional relationship with a liberated Britain cannot simply carry on as though nothing has changed. Ottawa will go back to the people, asking them to endorse -- or reject -- the path the coalition has charted since the Great Exile first brought it to power."
 CAN_the_halifax_commission:0 "The Halifax Commission"
 CAN_the_halifax_commission_desc:0 "Halifax's harbour is already the busiest military port in the Western Hemisphere, and Rees-Mogg intends to make sure it stays coordinated rather than chaotic. A dedicated commission will oversee dry-dock allocation, convoy scheduling, and shipyard labour disputes -- the unglamorous administrative work that decides whether an armada actually gets built on schedule."
 CAN_the_second_armada:0 "The Second Armada"
 CAN_the_second_armada_desc:0 "The first armada rests on the Atlantic seabed, and every admiral in Halifax knows exactly why. The second will be built differently -- smaller, better escorted, and shadowed by lessons paid for in Canadian and exile lives alike -- because Rees-Mogg has staked what remains of his political career on this fleet actually reaching the other side of the ocean."
 CAN_westminster:0 "Westminster"
 CAN_westminster_desc:0 "For twenty-seven years, the Canadian Parliament has governed under Westminster procedure inherited from a mother country that no longer exists in any form its exiles would recognize. This focus formalizes what has long been informal practice -- Ottawa's parliamentary tradition as something distinctly Canadian, owing more to precedent than to any living authority in London."
 CAN_armada:0 "The Armada"
 CAN_armada_desc:0 "Halifax's dry docks are full, the Great Lakes shipyards run three shifts around the clock, and for the first time since the Great Exile, the Royal Canadian Navy can credibly call itself a blue-water force. The armada Rees-Mogg promised the exile community for nearly three decades finally rides at anchor, ready for whatever comes next."
 CAN_backbench_tension:0 "Backbench Tension"
 CAN_backbench_tension_desc:0 "The coalition's backbenchers -- split between Black loyalists, Mogg's Imperial Restoration faithful, and an increasingly restless bloc of Angus sympathizers -- have started voting against the whip often enough that the government's majority can no longer be taken for granted. Someone in the leadership will have to spend real political capital before this becomes an open revolt."
 CAN_reclamation_fleet_complete:0 "The Reclamation Fleet"
 CAN_reclamation_fleet_complete_desc:0 "With the fleet built, the soldiers trained, and the Entente coalition secured, Rees-Mogg's Reclamation crusade is ready to sail for Britain."
 CAN_mogg_implementation:0 "Mogg Implementation"
 CAN_mogg_implementation_desc:0 "The Mogg Plan is no longer a rhetorical flourish from the Deputy Prime Minister's office; it is the organizing principle of the Canadian state. Rees-Mogg will spend his political capital ensuring every shipyard, every conscription office, and every foreign ministry cable now serves a single purpose -- the eventual, inevitable crossing of the Atlantic."
 CAN_sovereignty:0 "Canadian Sovereignty"
 CAN_sovereignty_desc:0 "Twenty-seven years after arriving as refugees from a fallen kingdom, Canada's leadership -- exile and native-born alike -- will formally assert what has long been true in practice: this is a sovereign North American power in its own right, answerable to no government in London, Washington, or anywhere else."
