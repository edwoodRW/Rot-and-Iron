	USA_Bernies_Time_To_Shine:0 "Bernies Time To Shine"
	USA_Bernies_Time_To_Shine_desc:0 "With the problem of Alaska out of the way, it's time to deal with the failing American economy. Like those that came before him, he now has a time to shine. "
	USA_Bernies_New_Deal:0 "Bernies New Deal"
	USA_Bernies_New_Deal_desc:0 "The New Deal will overhaul the American economic system completely changing how it works. Starting with federal work programs, and nationalization of certain industries, the economic program will see the recession end and the American people's money worries go away"
	USA_Pushing_back_Against_The_Military_Industrial_Complex:0 "Pushing Back Against The Military Industrial Complex"
	USA_Pushing_back_Against_The_Military_Industrial_Complex_desc:0 "One of the biggest obstables to the American peoples success is the military industrial complex. As part of the new deal, their interests will be sidelines in favor of those which benefit the peoples." 
	USA_Regulate_Wall_Street:0 "Regulate Wall Street"
	USA_Regulate_Wall_Street_desc:0 "Wall Street brokers practically drive the American economy, yet they do so with very little regulation. Fixing that will allow us to take their taxes and reinvest them."
	USA_Raise_Minimum_Wage:0 "Raise Minimum Wage"
	USA_Raise_Minimum_Wage_desc:0 "The Federal Minimum wage has not been raised since 1986. Obviously much has changed in that time and with that change must come a raise in the peoples wages."
	USA_Increase_Taxes_On_The_Aristocracy:0 "Increase Taxes On The Aristocracy"
	USA_Increase_Taxes_On_The_Aristocracy_desc:0 "Formed after the Second Civil War, the aristocracy was a side effect of the new Monarchical system. Since then, they've been let off with more freedoms than deserved. To rectify this, the New Deal commission will raise taxes on them and reinvest those taxes into new public programs."
	USA_Subsidize_Healthcare:0 "Subsidize Public Transport"
	USA_Subsidize_Healthcare_desc:0 "Many Americans can not afford a car or any form of transport outside of a bike. Public Transport which was originally intended to help has fallen from its pedestal. By subsidizing the remaining companies, we can return public transport to its previous glory."
	USA_Work_With_The_Banks:0 "Work With The Banks"
	USA_Work_With_The_Banks_desc:0 "While many in the Commonwealth party would like to create a moneyless society, the reality is that we are not as close to that future as we'd like to be. Instead, the administration will work with the banks to alleviate some of Americas financial stress."
	USA_Onto_The_Real_Work:0 "Onto The Real Work"
	USA_Onto_The_Real_Work_desc:0 "With Americas financial woes on their way out, the real work is set to begin."
	USA_Free_Schooling_For_All:0 "Expand Bernie Care protections"
	USA_Free_Schooling_For_All_desc:0 "Expanding BernieCare protections has been a priority for the administration since their re-election. The program now includes access to many other surgeries which minority groups like the LGBTQ might need."
	USA_Big_Pharma_And_Socialism:0 "Big Pharma And Socialism"
	USA_Big_Pharma_And_Socialism_desc:0 "Pharmacy costs have skyrocketed in previous years. To help alleviate this situation, the Sanders administration will make certain concessions to the Pharmaceutical industry in exchange for the lowering of medical costs."
	USA_Protect_Unions:0 "Protect Unions"
	USA_Protect_Unions_desc:0 "Protecting Unions has been part of the Commonwealth Ideology since its inception. The Sanders administration will continue to protect these peoples from big business. "
	USA_Workplace_Democracy:0 "Workplace Democracy"
	USA_Workplace_Democracy_desc:0 "To provide better work conditions, the Sanders administration has worked with its business council to promote Workplace Democracy."
	USA_A_Roof_Over_Everyones_Head:0 "A Roof Over Everyones Head"
	USA_A_Roof_Over_Everyones_Head_desc:0 "The Federal Housing program will officially start under the Sanders administration. Starting in major cities first and soon expanding outward to the suburbs, this will see homelessness eradicated in a period of 20 years."
	USA_End_The_Prison_Pipeline:0 "End The Prison Pipeline"
	USA_End_The_Prison_Pipeline_desc:0 "The Prison pipeline is a concept which discusses how many prisoners in America are not rehabilitated. This will end immediately with the administration drastically overhauling the prison system and making it focus on rehabilitation rather than just a cheap source of labor."
	USA_Expand_Berniecare_Protections:0 "Expand Berniecare Protections"
	USA_Expand_Berniecare_Protections_desc:0 "Expanding BernieCare protections has been a priority for the administration since their re-election. The program now includes access to many other surgeries which minority groups like the LGBTQ might need."
	USA_Expand_Small_Business_Loans:0 "Expand Small Business Loans"
	USA_Expand_Small_Business_Loans_desc:0 "Expanding small businesses loans will alleviate the stress on new business owners. While many call this a step towards totalism, others see this as a way to expand the economy in a positive way."
	USA_Reform_Law_Enforcement:0 "Reform Law Enforcement"
	USA_Reform_Law_Enforcement_desc:0 "Law Enforcement is still the same as it was in 1960. 40 years later and still no change. The Sanders administration will begin a drastic overhaul program of law enforcement trying to see it modernized."
	USA_The_Environmental_Accords:0 "The Enviromental Accords"
	USA_The_Environmental_Accords_desc:0 "The Environmental Accords under PM Sanders will see the Empire demand the lowering of carbon emissions internationally."
	USA_The_Culmination_Of_The_Commonwealth_Ideals:0 "The Culmination Of The Commonwealth Ideals"
	USA_The_Culmination_Of_The_Commonwealth_Ideals_desc:0 "With his administration's goals on their way to completion, Bernie comes to one last goal, the end of colonization."
	USA_International_Decolonization:0 "International Decolonization"
	USA_International_Decolonization_desc:0 "The call for international decolonization will ring out from North America."
	USA_Set_The_Example:0 "Set The Example"
	USA_Set_The_Example_desc:0 "If we are to be taken seriously, we must set the example and hand back the Baja Mexico territory to the Mexican protectorate."
	USA_Overtures_To_Germany:0 "Overtures To Germany"
	USA_Overtures_To_Germany_desc:0 "One of the biggest empires, if our decolonization program is to work, we need to hand overtures to the German peoples."
	USA_Set_A_Far_Off_Deadline:0 "Set A Far Off Deadline"
	USA_Set_A_Far_Off_Deadline_desc:0 "Obviously the German Empire can't decolonize immediately. They've agreed to the far off deadline of February 2049 so they can build up their remaining territories and ensure that the colonial population will not descend into chaos."
	USA_Further_Relations_With_Russia:0 "Further Relations With Russia"
	USA_Further_Relations_With_Russia_desc:0 "The boogeyman of the world, Russia is constantly looking for ways to open itself up to the world. In a conference with PM Sanders, they agree that international decolonization is needed."
	USA_Push_For_Native_Autonomy:0 "Push For Native Autonomy"
	USA_Push_For_Native_Autonomy_desc:0 "As part of the decolonization program, the Sanders administration has gotten the Russians to agree to grant their native populations a certain amount of autonomy."
	USA_A_Talk_With_Portugal:0 "A Talk With Portugal"
	USA_A_Talk_With_Portugal_desc:0 "The next group to decolonize will be the Portuguese. Although they work under a tyrannical government it is possible that they will be willing to give up their colonies."
	USA_Embargo_The_Portugese:0 "Embargo The Portugese"
	USA_Embargo_The_Portugese_desc:0 "We were wrong and insulted. It's time for the world at large to give up hope on the Portuguese."
	USA_Bernies_Decolonization_Policy:0 "Bernies Decolonization Policy"
	USA_Bernies_Decolonization_Policy_desc:0 ""
	USA_The_Issues_Of_Baja:0 "The Issues Of Baja"
	USA_The_Issues_Of_Baja_desc:0 ""
	USA_A_Hawaiian_Brotherhood:0 "A Hawaiian Brotherhood"
	USA_A_Hawaiian_Brotherhood_desc:0 ""
	USA_Take_It_To_The_European_Powers:0 "Take It To The European Powers"
	USA_Take_It_To_The_European_Powers_desc:0 ""
	USA_The_Newell_Howard_Administration:0 "The Newell Howard Administration"
	USA_The_Newell_Howard_Administration_desc:0 "Two tech titans have done the impossible and secured leadership of the Greater American Empire. They're expected to not only improve the American tech sector tenfold but also fix the mistakes of the previous commonwealth administration."
	USA_It_Just_Works:0 "It Just Works"
	USA_It_Just_Works_desc:0 "That's just the thing, America..it just works!"
	USA_Fixing_Bernies_Mistakes:0 "Fixing Bernies Mistakes"
	USA_Fixing_Bernies_Mistakes_desc:0 "While Bernie was loved by many, his economic policies have devastated the Empire. It's time to work with all members of Parliament and ensure that his mistakes get fixed before Americans have to deal with a horrible economy."
	USA_De_Regulate_Wall_Street:0 "De-regulate Wall Street"
	USA_De_Regulate_Wall_Street_desc:0 "Wallstreet has suffered for years under Bernie. While the idea of redistributing the wealth is nice, it has been shown to reduce economic confidence. By de-regulating Wallstreet we can ensure that even the economy feels the freedom of America."
	USA_Lower_Taxes_on_The_1_percent:0 "Lower Taxes On The 1%"
	USA_Lower_Taxes_on_The_1_percent_desc:0 "Given how the 1% are more likely to spend their money, invest in the stock market, and open businesses, we can not afford to tax them. So for the economy to recover we need to lower taxes on the 1%."
	USA_Soliciting_Bipartisan_Legislation:0 "Soliciting Bipartisan Legislation"
	USA_Soliciting_Bipartisan_Legislation_desc:0 "Bipartisanship is the sad reality of American politics. But for the politicians to truly work for the people, we need both sides of the political isle to create legislation which helps the common man not just their political party."
	USA_Funding_The_Technology_Sector:0 "Funding The Technology Sector"
	USA_Funding_The_Technology_Sector_desc:0 "Once upon a time, the American peoples were in a technology race with the German empire to claim economic dominance over the world. Once again, the technology industry of the world will be based in America."
	USA_Refunding_NASA:0 "Refunding NASA"
	USA_Refunding_NASA_desc:0 "Nasa (National aeronautic and space administration) was heavily defunded under the Goldwater administration. It's time to rectify that mistake and give Americans something to believe in once again. A future in Space."
	USA_Robot_Soldiers_Closer_Than_You_Think:0 "Robot Soldiers? Closer Than You Think"
	USA_Robot_Soldiers_Closer_Than_You_Think_desc:0 "Wars have always been unpopular, but if those wars are not fought with humans, can they perhaps be more palatable for the American people?"
	USA_Robot_Stoke_A_Technology_Race:0 "Robot Stoke A Technlogy Race"
	USA_Robot_Stoke_A_Technology_Race_desc:0 "by artificially stoking a technology race, we can take the worlds focus off the prospect of a third weltkrieg and push the focus more towards a better future of humanity."
	USA_Encourage_Working_In_STEM:0 "Encourage Working In STEM"
	USA_Encourage_Working_In_STEM_desc:0 "STEM (Science, Technology, Engineering, and Mathematics) is the way of the future. By focusing more on these fields, we can speed up the research of key industrial areas."
	USA_Subsidize_Technology_In_School:0 "Subsidize Technology In Schools"
	USA_Subsidize_Technology_In_School_desc:0 "Bernie has the right idea subsidizing schooling, but he went about it in the wrong way. Instead of just enlarging the paychecks of the greedy administrations and teachers, we can instead invest in the technology which will teach the students without a bias."
	USA_Subsidize_The_Green_Industry:0 "Subsidize The Green Industry"
	USA_Subsidize_The_Green_Industry_desc:0 "Green energy is the way of the future yet, the infrastructure to support it is not there yet. So, America under the GEI Act will subsidize the companies who will create the infrastructure for the energy."
	USA_The_Smart_Home_Generation:0 "The Smart Home Generation"
	USA_The_Smart_Home_Generation_desc:0 "Smart homes will give the people a more complacent lifestyle, so they can divert much of their time to their passions instead of just work, sleep, and repeat."
	USA_To_Infinity:0 "To Infinity"
	USA_To_Infinity_desc:0 "We do not go to space because it is easy, we go because it is hard. The exploration of the cosmos is the definition of Humanity's struggle. We seek answers in the cosmos and when our people permanently settle on another planet, we may just find them."
	USA_And_Beyond:0 "And Beyond"
	USA_And_Beyond_desc:0 "Our answers do not lay only in our solar system, but they may be further out. It may not be this generation, or the next, but someday the Greater American Empire will touch down on the surface of another planet in another system."
	USA_Encourage_The_Private_Space_Industry:0 "Encourage The Private Space Industry"
	USA_Encourage_The_Private_Space_Industry_desc:0 "Along with Nasa, the administration is encouraging private companies to enter the space race. If we are not the first Americans to settle on the moon, maybe a private company from our lands will be."
	USA_Subsidize_An_Industrial_Revolution:0 "Subsidize An Industrial Revolution"
	USA_Subsidize_An_Industrial_Revolution_desc:0 "To achieve our goals of technological dominance, the government needs to subsidize a new industrial revolution. All sectors of technology will see improvement from government funding."
	USA_Everyone_Makes_A_Good_Point:0 "Everyone Makes A Good Point"
	USA_Everyone_Makes_A_Good_Point_desc:0 "Let's be real, everyone is making a good point."
	USA_Encourage_Political_Unity:0 "Encourage Political Unity"
	USA_Encourage_Political_Unity_desc:0 "Everyone makes a good point but their not willing to come together and talk about it."
	USA_Re_Establish_American_Centrism:0 "Re-establish American Centrism"
	USA_Re_Establish_American_Centrism_desc:0 "Centrism is the only way to get anything done. By acknowledging that both sides of the political spectrum have good ideas, we can actually get stuff done instead of just arguing."
	USA_Cooperation_With_The_German_Scientific_Center:0 "Cooperation With The German Scientific Center"
	USA_Cooperation_With_The_German_Scientific_Center_desc:0 "The GSC has extended an olive branch to us, and so has the Kaiser himself. If Humanity is truly to have a destiny in the stars then, we are to work together. We can not let petty squabbles get in our way, but instead we have to bridge ideological and cultural gaps to bring about our destiny."
	USA_The_Norton_I_Rover:0 "The Norton I Rover"
	USA_The_Norton_I_Rover_desc:0 "The Norton I Rover will launch from the newly redone Horst Wessel Spaceport. It will travel for nearly a year to Mars where it will achieve orbit and then land down on the surface and send back some of the highest resolution pictures of our new home."
	USA_Build_The_Sanders_Sattelite:0 "Build The Sanders Sattelite"
	USA_Build_The_Sanders_Sattelite_desc:0 "The Sanders Satellite will be built for two reasons. Firstly, it is meant to please the progressives who still idolize Sanders, secondly it is meant to leave our solar system. Travelling over the years to Alpha Centauri, it will send images, audio, and video of the space in between systems."
	USA_A_New_Space_Age:0 "A New Space Age"
	USA_A_New_Space_Age_desc:0 "A New Space Age has begun for humanity. With the cooperation of all factions except those who are still stuck in their ideological struggles (England), we have gone on the first step of achieving our dreams. Tomorrow the moon, next week the universe!"
	USA_Where_Our_Loyalties_Will_Lay:0 "Where Our Loyalties Will Lay"
	USA_Where_Our_Loyalties_Will_Lay_desc:0 "Our neutrality is great but we can not look to stay this way forever. We need to decide where our loyalties lay in the world."
	USA_Our_Friends_In_The_Space_Race:0 "Our Friends In The Space Race"
	USA_Our_Friends_In_The_Space_Race_desc:0 "It's only natural that we ally with our friends in the space race. The Reichspakt is not the one who continually threatened us in years past. They align more with our values of freedom than the entente or even the remains of the Third Internationale do now."
	USA_Join_Mittle_Europa:0 "Join Mittle Europa"
	USA_Join_Mittle_Europa_desc:0 "While it had a rough start and continued its spiral after the Second Weltkrieg, the MittleEuropa alliance is one which represents the best of what Europe can offer. Not only did it heavily improve the German economy after the loss of many of their territories it's made them into one of the worlds economic powerhouses. Joining it will only increase the value of American goods."
	USA_The_San_Francisco_Conferences:0 "The San Francisco Conference"
	USA_The_San_Francisco_Conferences_desc:0 "The San Francisco conference will bring about more cooperation between the Reichspakt and the American Government. During this conference, not only economics will be discussed but politicians will discuss military matters, media exportation, corporation exportation and even a possible marriage into German Royalty."
	USA_Continue_Space_Cooperation:0 "Continue Space Cooperation"
	USA_Continue_Space_Cooperation_desc:0 "Now with access to more resources, why not continue our space cooperation with the German Empire. Together our empires will reach new heights in the cosmos."
	USA_Ensure_Free_Travel_Between_Pakt_Members:0 "Ensure Free Travel Between Pakt Members"
	USA_Ensure_Free_Travel_Between_Pakt_Members_desc:0 "Free travel between America and the Pakt will be instrumental to gaining the peoples trust. While the German Empire has been seen as the villain in the past, they no longer need to be seen as that. Germany and members of the Pakt have amazing cultures which can be shown now that travel is possible."
	USA_Celebrate_Both_Cultures:0 "Celebrate Both Culutures"
	USA_Celebrate_Both_Cultures_desc:0 "Germany and America have cultures which intertwine. Why not celebrate our cultures."
	USA_Lower_Tarrifs_On_Reichspakt_Goods:0 "Lower Tarrifs Reichspakt Goods"
	USA_Lower_Tarrifs_On_Reichspakt_Goods_desc:0 " For years, Americans have been denied Reichspakt goods. The Progressive administrations have refused to import these goods as Germany was “TyraNNical myeah”. That's simply not true. German goods are just as good as American goods Bernie!"
	USA_Economic_Prosperity_On_Both_Sides_Of_The_World:0 "Economic Prosperity On Both Sides Of The World"
	USA_Economic_Prosperity_On_Both_Sides_Of_The_World_desc:0 "With our Nation intertwined into the Pakt economic sphere, both sides of the Atlantic have experienced such a feeling of prosperity. From the prices of gas to the prices of everyday produce at the market, consumers feel as if they have much more to spend."
	USA_Two_Titans_For_Peace:0 "Two Titans For Peace"
	USA_Two_Titans_For_Peace_desc:0 "No one would dare touch the now iron alliance that is the German American compact. Two Titans who rule the world have given people a chance for world peace. No longer will petty squabbles lead to a devastating war. Instead of worrying about Nuclear annihilation, people can look to the skies and seek new life."
	USA_Importing_German_Companies:0 "Importing Germany Companies"
	USA_Importing_German_Companies_desc:0 "German companies like Porsche produce cars better than any American company truly can."
	USA_Exporting_American_Goods:0 "Exporting American Goods"
	USA_Exporting_American_Goods_desc:0 "Germans have never had a single dorito in their life. It's going to blow their mind!"
	USA_An_American_German_Royal_Wedding:0 "An American German Royal Wedding"
	USA_An_American_German_Royal_Wedding_desc:0 "By merging the houses of Hohenzollern and Norton, we can ensure that this alliance never falters..never breaks..and never succumbs to the perils of time."
	USA_Request_Entry_To_The_Entente:0 "Request Entry To The Entente"
	USA_Request_Entry_To_The_Entente_desc:0 "The Entente is a shadow of what it used to be. The Canadians lost India, and they have yet to achieve the goal of the reclamation. With Americas help, we can push the peoples in the right direction."
	USA_Join_The_Entente_Econonomic_Union:0 "Join The Entente Economic Union"
	USA_Join_The_Entente_Econonomic_Union_desc:0 "The Entente Economic union with America can be used to strengthen the North American economy and overtake the German economic dominance of the world."
	USA_The_Vancouver_Conference:0 "The Vancouver Conference"
	USA_The_Vancouver_Conference_desc:0 "Meeting in Vancouver, Representatives from all Entente countries and the American Empire will discuss many things. Some include a possible common currency for the peoples, free travel, the status of the English royals next to the Nortons, and even the possibility of turning over British Columbia to the Greater American Empire."
	USA_TAid_For_The_Reclamation:0 "Aid For The Reclamation"
	USA_TAid_For_The_Reclamation_desc:0 "Our military will not only supply the Canadians, but now they will trained for the day when they finally reclaim the old homeland."
	USA_CBC_America:0 "CBC America?"
	USA_CBC_America_desc:0 "The Canadian Broadcast Channel is finally going to open an office in San Francisco. They'll be staffed by American anchors and cover not only American news but also that of the world."
	USA_Redirect_Space_Funds_Towards_The_Entente:0 "Redirect Space Funds Towards The Entente"
	USA_Redirect_Space_Funds_Towards_The_Entente_desc:0 "With our formal entry to the Entente, we will redirect much of our funding for the German space program towards that of the Ententes. That isn't to say the Germans will be left penniless."
	USA_Degrade_The_Border_Between_The_Countries:0 "Degrade The Border Between The Countries"
	USA_Degrade_The_Border_Between_The_Countries_desc:0 "The border between Canada and the GAE will be degraded as Canadians and Americans will be able to travel freely between the border."
	USA_The_Refugee_Decrees:0 "The Refugee Decrees"
	USA_The_Refugee_Decrees_desc:0 "Let it be known that anyone escaping tyranny in Europe, Africa, Asia, or South America will have a home in the Empires of Canada and America."
	USA_Open_Doors_For_Dual_Citizenship:0 "Open Doors For Dual-Citizenship"
	USA_Open_Doors_For_Dual_Citizenship_desc:0 "Dual Citizenship will help bring our nations together as not only will the peoples learn to understand each other's countries and histories, but they'll learn to appreciate the two radically different cultures."
	USA_The__Hunt_For_Trudeau:0 "The Hunt For Trudeau"
	USA_The__Hunt_For_Trudeau_desc:0 "Justin Trudeau aka “The Red Chairman” has been a thorn in the side of both the Canadian and American governments for decades now. His ilk have launched attacks on American politicians and nearly killed Elizabeth II. Together, the Mounties, MI6, and The Imperial Intelligence Agency will finally arrest this man and try him for his many many crimes."
	USA_The_Elizabeth_I_Spaceport:0 "The Elizabeth I Spaceport"
	USA_The_Elizabeth_I_Spaceport_desc:0 "The Elizabeth I Spaceport will be a testament to how far the Entente has come. Built on Vancouver Island this spaceport will launch the first Canadian astronauts to the moon where they'll plant both the flags of the “British Empire in Exile” and the “Kingdom of Canada”."
	USA_The_Windsor_Norton_Marriage:0 "The Windsor Norton Marriage"
	USA_The_Windsor_Norton_Marriage_desc:0 "The Windsor family seeking a new marriage will see Joshua Norton III marry Queen Elizabeth II. This will be a historic occasion as not since the days of Edward has a royal lay with an American."
	USA_Create_A_New_Faction:0 "Create A New Faction"
	USA_Create_A_New_Faction_desc:0 "Both the Entente and the Reichskpat are doomed to crumble under their own selfish hubris. The Empire will lead America into a new pacifistic age with the North Atlantic Treaty Organization."
	USA_Common_Defense_For_All_Members:0 "Common Defense For All Members"
	USA_Common_Defense_For_All_Members_desc:0 "Part of NATO will be the common defense of all members. No nation will be left behind, and no peoples will be left to rot under the stink of tyranny."
	USA_The_Charter_Of_Human_Rights:0 "The Charter Of Human Rights"
	USA_The_Charter_Of_Human_Rights_desc:0 "The Charter of Human Rights will be created by politicians from all over the world. Progressives, Conservatives, Nationalists, Socialists, etc. will have their voice written in this document. No human will have their rights violated by a government lest they face the consequences."
	USA_Atlantic_Hegemony:0 "Atlantic Hegemony"
	USA_Atlantic_Hegemony_desc:0 "It is time for the NATO Alliance to dominate the Atlantic and secure it in the name of peace."
	USA_Inviting_Ireland:0 "Inviting Ireland"
	USA_Inviting_Ireland_desc:0 "Ireland is a priority for the peoples of NATO. They sit on the cusp of the Reichspakt and invasion from the suicidal English regime. Bringing them under our protection will negate any violence that either side can inflict upon them."
	USA_Build_The_NATO_Parliament:0 "Build The NATO Parliament"
	USA_Build_The_NATO_Parliament_desc:0 "The NATO Parliament built in New York City will showcase the democracy of NATO. Member states will vote on resolutions which could impact the world at large."
	USA_Open_Space_Travel_To_All:0 "Open Space Travel To All"
	USA_Open_Space_Travel_To_All_desc:0 "Space Travel should not be limited by faction or ideological difference. Part of NATOs treaty will allow all who seek to travel the cosmos to find funding through Nato (as long as they comply)."
	USA_The_American_Economic_Union:0 "The American Economic Union"
	USA_The_American_Economic_Union_desc:0 "The American Economic Union will see all NATO Member nations derive their economic success from the American industrial complex."
	USA_Float_The_Dollar:0 "Float The Dollar"
	USA_Float_The_Dollar_desc:0 "No longer will our dollar be constrained to the value of gold. Far too many times we have seen the Berlin Crash rear its ugly head and threaten another recession which could destroy the world."
	USA_Spreading_Democracy_Abroad:0 "Spreading Democracy Aboard"
	USA_Spreading_Democracy_Abroad_desc:0 "Democracy is a fundamental right of each and every citizen of this world. Our goal going forward will be too peacefully spread democracy to every nation possible."
	USA_Station_Troops_In_Every_Member_Nation:0 "Station Troops In Every Member Nation"
	USA_Station_Troops_In_Every_Member_Nation_desc:0 "Part of our common defense agreement will be the stationing of troops in every member nation."
	USA_A_New_Pax_Americana:0 "A New Pax Americana"
	USA_A_New_Pax_Americana_desc:0 "Peace has been achieved as no one dares touch a NATO country."
	USA_A_New_Day_For_Woman:0 "A New Day For Woman"
	USA_A_New_Day_For_Woman_desc:0 "With the election of Hillary Clinton to the highest political office in the nation, a new day for women begins."
	USA_A_New_Day_For_America:0 "A New Day For America"
	USA_A_New_Day_For_America_desc:0 "America is a progressing nation leading the world out of its traditionalist rut."
	USA_Expanding_The_Welfare_State:0 "Expanding The Welfare State"
	USA_Expanding_The_Welfare_State_desc:0 "The Welfare Programs of America are part of what makes the nation great. With this, the people shall no longer worry about their income. No matter what, the people will have a check to fall back on."
	USA_Securing_Access_To_Food:0 "Securing Access To Food"
	USA_Securing_Access_To_Food_desc:0 "More than 40% of Children in the Empire go hungry each and every night. A priority for this administration is the access of food for families. Regardless of race, the people will have access to the ingredients for a fresh and healthy meal."
	USA_Expand_Healthcare_Programs:0 "Expand Healthcare Programs"
	USA_Expand_Healthcare_Programs_desc:0 "Without private insurance, the common man is at a loss when it comes to healthcare. Expanding Berniecare protections and actually funding the program can go a long way for those in the lower income brackets."
	USA_Enshrine_LGBTQ_Rights_Into_Law:0 "Enshrine LGBTQ Rights Into Law"
	USA_Enshrine_LGBTQ_Rights_Into_Law_desc:0 "Gay, Lesbian, Transgender, it doesn't matter. As American citizens, these people have served in our police forces, taught at our schools, or even given the ultimate sacrifice in the military. Yet they go without basic protections from discrimination, bias, and moving properties. No more will they face these prejudices. PM Clinton will sign an executive order which will see these protections added to the constitution (with the emperor's consent)."
	USA_Roll_Back_Oil_Drilling:0 "Roll Back Oil Drilling"
	USA_Roll_Back_Oil_Drilling_desc:0 "Continuing on from PM Bernies environmental policies, the people will see a hike in gas prices. This is only temporary as the Empire will import more from the Canadians and Alaskan territories."
	USA_Cancel_All_Current_Pipelines:0 "Cancel All Current Pipelines"
	USA_Cancel_All_Current_Pipelines_desc:0 "While a deeply unpopular policy, the Empire will immediately halt the construction of all pipelines."
	USA_Eliminate_The_Pink_Tax:0 "Eliminate The Pink Tax"
	USA_Eliminate_The_Pink_Tax_desc:0 "The Pink Tax is a tax on women for many feminine sanitary products. Eliminating this will see women and transgender individuals add an extra $700 to their pockets yearly."
	USA_Expand_Title_IX_Protections:0 "Expand Title IX Protections"
	USA_Expand_Title_IX_Protections_desc:0 "Expanding Title IX protections will see the American Empire become a more tolerant place. Instead of just focusing on gender and racial protections, this will see the categories of sexuality, religion, and background added to this amendment. After all, everyone deserves a second change at least once."
	USA_Fight_Traditional_Gender_Idenitites:0 "Fight Traditional Gender Idenitites"
	USA_Fight_Traditional_Gender_Idenitites_desc:0 "Traditional norms are fine for a place like the Papacy, or the German Empire, but in America we stay ahead of the curve. Men and Women will not be expected to comply with their traditional norms, and instead they can feel free to be who they really are. Even if they want to write for a game."
	USA_Bridge_The_Gap_Between_Parties:0 "Bridge The Gap Between Parties"
	USA_Bridge_The_Gap_Between_Parties_desc:0 "Bipartisanship can help the nation for a bit. After all, many feel good to be represented. However, to help the people, some party lines need to be crossed."
	USA_Defer_Student_Loans:0 "Defer Student Loans"
	USA_Defer_Student_Loans_desc:0 "Student Loans can help a poor kid get through college, yet they can also cripple them later in life. As a temporary relief, Student Loans exceeding $125,000 will have their payments deferred until September of 2013. This can help the common man build up their credit while working towards saving money for the eventual loans."
	USA_Disability_Rights:0 "Disablility Rights"
	USA_Disability_Rights_desc:0 "The Disabled are basically treated like a second class in the empire. Their medical bills constantly pile up and for those who can be independent, workplaces may not hire them. We need to add protections for these people if our society can truly call itself equal."
	USA_Workers_Rights_Are_A_Priority:0 "Workers Rights Are A Priority"
	USA_Workers_Rights_Are_A_Priority_desc:0 "A priority for this administration is the continuing protection of workers from tyrannical employment practices."
	USA_Continue_Fighting_Climate_Change:0 "Continue Fighting Climate Change"
	USA_Continue_Fighting_Climate_Change_desc:0 "The climate change problem is one which continually needs to be addressed. While there are radical solutions, they are not quite possible without bankrupting the nation. However, the administration can keep making small strides in the way of making a better earth for our peoples."
	USA_Reform_The_Justice_System:0 "Reform The Justice System"
	USA_Reform_The_Justice_System_desc:0 "The Justice System has not been reformed since the Great Reclamation during the Second Civil War. An archaic system like this lets prosecutors and others become judge and jury while putting people in prison for small time offenses like marijuana possession."
	USA_Tackle_The_Mental_Health_Crisis:0 "Tackle The Mental Health Crisis"
	USA_Tackle_The_Mental_Health_Crisis_desc:0 "The Suicide rate in the Empire is too high. Men make up nearly 40% of suicides (real info) while women make up nearly an equal amount. There is a mental health crisis going on in America, and it can no longer be ignored."
	USA_Increase_Wealth_Tax:0 "Increase Wealth Tax"
	USA_Increase_Wealth_Tax_desc:0 "When Bernie and Hillary last talked, the former PM expressed his interest in further increasing the wealth tax for America. While it will further Hillary's unpopularity, the taxes gained from the Wealthy people can go towards federal programs like housing, food access, and rent relief."
	USA_Introduce_Federal_Housing:0 "Introduce Federal Housing"
	USA_Introduce_Federal_Housing_desc:0 "Federal Housing blocks will be built in every city around the Empire. These will be uniform apartments for low-income people."
	USA_Expand_NSA_Powers:0 "Expand NSA Powers"
	USA_Expand_NSA_Powers_desc:0 "The NSA which replaced the FBI after their exodus needs its powers expanded. Political extremism is only going to rise unless the government can prevent it."
	USA_Renew_The_American_Dream:0 "Renew The American Dream"
	USA_Renew_The_American_Dream_desc:0 "The American dream is no longer the old one. The old United States died when MacArthur unlawfully took power, and with it….the American dream. Our new American Dream is one of true freedom, for whoever seeks it."
	USA_A_New_Light_On_Top_Of_The_Hill:0 "A New Light On Top Of The Hill"
	USA_A_New_Light_On_Top_Of_The_Hill_desc:0 "Our new free nation will become a new shining light on top of the hill of the world."
	USA_Life_Liberty_Decolonization:0 "Life, Liberty, Decolonization"
	USA_Life_Liberty_Decolonization_desc:0 "Mrs. Clinton has a three-word saying when it comes to her foreign policy decisions. Life, Liberty, and Decolonization."
	USA_Self_Determination_For_All:0 "Self Determination For All"
	USA_Self_Determination_For_All_desc:0 "The Imperial System which governs the world is old and outdated. Somehow when every nation made progressive strides, they could not let go of their century's old idea of colonization."
	USA_Call_For_Sweeping_Decolonization:0 "Call For Sweeping Decolonization"
	USA_Call_For_Sweeping_Decolonization_desc:0 "The Imperial System which governs the world is old and outdated. Somehow when every nation made progressive strides, they could not let go of their century's old idea of colonization."
	USA_Compensate_Colonial_Losses:0 "Compensate Colonial Losses"
	USA_Compensate_Colonial_Losses_desc:0 "In exchange for the leaving of colonies, the American Empire along with other progressive states are prepared to compensate empires for their losses."
	USA_Prevent_The_Further_Spread_Of_African_Syndicalism:0 "Prevent The Further Spread Of African Syndicalism"
	USA_Prevent_The_Further_Spread_Of_African_Syndicalism_desc:0 "Syndicalism is still a detestable ideology which should have no impact on the world. Yet it still festers in Africa. Instead of invading and setting up colonies, the new governments should be shown the dangers of syndicalism."
	USA_Call_For_International_Investment:0 "Call For International Investment"
	USA_Call_For_International_Investment_desc:0 "For these new governments to survive, one has to invest in the African economy."
	USA_Ensure_Access_To_Healthcare:0 "Ensure Access To Healthcare"
	USA_Ensure_Access_To_Healthcare_desc:0 "As it is in America, it shall be in Africa. Our government will put pressure on these new fledgling nations to adopt a universal healthcare program."
	USA_Promote_African_Democracy:0 "Promote African Democracy"
	USA_Promote_African_Democracy_desc:0 "Along with Universal Healthcare, the people shall have their voice represented in a fair, free democracy."
	USA_Fund_African_Infrastructure:0 "Fund African Infrastructure"
	USA_Fund_African_Infrastructure_desc:0 "Our government, now with access to African oil and other products will fund the building of new infrastructure."
	USA_Repatriate_African_Exiles:0 "Repatriate African Exiles"
	USA_Repatriate_African_Exiles_desc:0 "Our nation is home to many exiles from the African federation. With new governments popping up, its time for others to go home and better their nations."
	USA_Ensure_Ethic_Representation:0 "Ensure Ethic Representation"
	USA_Ensure_Ethic_Representation_desc:0 "Ensuring ethnic representation is key to democracy."
	USA_A_Safe_World_Is_A_Free_World:0 "A Safe World Is A Free World"
	USA_A_Safe_World_Is_A_Free_World_desc:0 "A safe world, is one free from the tyranny of imperialism and one from the tyranny of overactive governments."
	USA_Expand_Democracy_To_The_World:0 "Expand Democracy To The World"
	USA_Expand_Democracy_To_The_World_desc:0 "Mrs. Clinton has made it clear that her goals are not stopping with the African continent."
	USA_A_New_Faction:0 "A New Faction"
	USA_A_New_Faction_desc:0 "A new faction is needed for the world to prosper. The old Entente and Reichspakt are over a century old, and no longer represent modern values."
	USA_Promote_Democratic_Reforms:0 "Promote Democratic Reforms"
	USA_Promote_Democratic_Reforms_desc:0 "The Washington Compact has one goal for the two big powers of Europe. The Compact will meet with and fund similar movements in the French and German Empires."
	USA_Fund_The_Adenauer_Movement:0 "Fund The Adenauer Movement"
	USA_Fund_The_Adenauer_Movement_desc:0 "The Adenauer movement, named after famous revolutionary Konrad Adenauer is a student movement calling for a constitutional monarchy to be instated in the German Empire. Still after all this time, the power of government rests in the hands of the Kaiser."
	USA_Put_Diplomatic_Pressure_On_Germany:0 "Put Diplomatic Pressure On Germany"
	USA_Put_Diplomatic_Pressure_On_Germany_desc:0 "With our military, we will put diplomatic pressure on the German Empire. This will include making the Adenauer movement mainstream, handing more power to the Reichstag and the election of a prime minister."
	USA_Demand_German_Repatriation:0 "Demand German Repatriation"
	USA_Demand_German_Repatriation_desc:0 "Similarly, to the Africans, our nation is home to many exiles from the Empire. If they truly have changed, then we need to see the exiles return home."
	USA_Supply_The_Marquises:0 "Supply The Marquises"
	USA_Supply_The_Marquises_desc:0 "The Marquises aka the Marqisards are a democratic French terrorist group. They espouse the values of the pre-revolution Republic and seek to reinstate democracy. Whether or not they can work with the emperor remains to be seen."
	USA_Put_Dipmomatic_Pressure_On_France:0 "Put Diplomatic Pressure On France"
	USA_Put_Dipmomatic_Pressure_On_France_desc:0 "The International community will put pressure on the Bonapartist Empire to adopt new legislation which enshrines Frances Democratic Values."
	USA_Demand_French_Repatriation:0 "Demand French Repatriation"
	USA_Demand_French_Repatriation_desc:0 "Along with the creation of the French Imperial parliament, our government is pushing for the repatriation of French exiles."
	USA_Focus_On_Asia:0 "Focus On Asia"
	USA_Focus_On_Asia_desc:0 "With Europe instituting reforms, the peoples of Asia call out for reforms."
	USA_Contacting_The_Descendant_Of_Ghandi:0 "Contacting The Descendant Of Ghandi"
	USA_Contacting_The_Descendant_Of_Ghandi_desc:0 "Mohandas Gandhi had many descendants. As a reformist in the Bhartiya Commune, his goals of Indian unification were peaceful and respectful. By contacting the descendant who aligns with his values we can pursue a better India."
	USA_Bolster_His_Political_Influence:0 "Bolster His Political Influence"
	USA_Bolster_His_Political_Influence_desc:0 "Bolstering the political influence of Rajmohan Gandhi, the Indian people will start to put pressure on their totalist government and call for reforms."
	USA_Put_Pressure_On_The_Indian_Regime:0 "Put Pressure On The Indian Regime"
	USA_Put_Pressure_On_The_Indian_Regime_desc:0 "Along with the Indian Peoples, the American government will put pressure on the totalist regime to institute democratic reforms."
	USA_Push_For_Indian_Elections:0 "Push For Indian Elections"
	USA_Push_For_Indian_Elections_desc:0 "After caving to our demands, the Indian peoples will finally have their first real democratic elections."
	USA_Rig_The_Elections:0 "Rig The Elections"
	USA_Rig_The_Elections_desc:0 "While the Indians will think these elections are democratic, the truth is, their rigged in Rajmohans favor."
	USA_Train_Indian_Exiles:0 "Train Indian Exciles"
	USA_Train_Indian_Exiles_desc:0 "With the Indians not caving to our pressure, it's time we instigate a violent revolt. If the government will not reform, then the people will force their will upon the government."
	USA_Aid_In_The_Indian_Revolt:0 "Aid In Indian Revolt"
	USA_Aid_In_The_Indian_Revolt_desc:0 "Aiding in the Indian revolt is a high priority for all patriotic Americans. We barely escaped the grasp of totalism, and now we understand the violent impact of it."
	USA_Find_The_Decadent_Kim:0 "Find The Decadent Of Kim"
	USA_Find_The_Decadent_Kim_desc:0 "The Kim Dynasty has ruled the Korean Peninsula since the Boseon revolt in the 1930s. Yet, not all of them are on board with their Juche Totalist government. One, happens to be a fan of Eric Clapton. So if he's a fan of him, what other western things can be used to bribe him."
	USA_Propagandize_Him:0 "Propagandize Him"
	USA_Propagandize_Him_desc:0 "Kim Jong Chul is a brave man who does not stand for the Imperialistic totalist government. It has killed many Koreans and lost its message."
	USA_Instigate_A_Revolt:0 "Instigate A Revolt"
	USA_Instigate_A_Revolt_desc:0 "A Revolt in the city of Seoul will secure the doom of the Korean regime."
	USA_Drone_Strike_The_Last_Airbase:0 "Drone Strike The Last Airbase"
	USA_Drone_Strike_The_Last_Airbase_desc:0 "As the Revolt Spreads, our last goal is to trap the remaining Totalist Kims. Drone Striking every plane at the Kim Jong Il International Totalist Proletariat Pyongyang airport will ensure they face the justice due to them."
	USA_The_Situation_In_Alaska:0 "The Situation In Alaska"
	USA_The_Situation_In_Alaska_desc:0 "Alaska has been the thorn in the side of the American military for more than a decade now. While the Beringian military collapsed almost immediately, local terror groups have remained persistent."
	USA_Finally_Pull_Out_Of_Alaska:0 "Finally Pull Out Of Alaska"
	USA_Finally_Pull_Out_Of_Alaska_desc:0 "It's no longer our problem. Alaska was invaded due to their involvement in the attacks on 9/10. We've not only imprisoned those who supported it, but the leader of the group responsible has been killed. Pull out and let fate do its work."
	USA_Take_Our_Time_Withdraw_Slowly:0 "Take Our Time, Withdraw Slowly"
	USA_Take_Our_Time_Withdraw_Slowly_desc:0 "After investing billions into pacifying the nation, only a fool would think that a large military force could withdraw quickly. It will months, maybe even years but the American military will leave Alaska."
	USA_Continue_Training_The_Alaskan_Military:0 "Continue Training The Alaskan Military"
	USA_Continue_Training_The_Alaskan_Military_desc:0 "While not up to the rough standards of the American army, the Alaskan army has gone from a poorly trained militia to a new pacifying force. If they continue their training and progress, the peoples of Alaska will have their own military to protect them."
	USA_Fortify_the_consulate:0 "Fortify The Consulate"
	USA_Fortify_the_consulate_desc:0 "The Consulate located in Anchorage possesses more than enough information to damage the reputation of the American military. It's time to fortify it beyond belief and implement programs which can purge all data."
	USA_Continue_Building_Up_Infrastructure:0 "Continue Building Up Infrastructure"
	USA_Continue_Building_Up_Infrastructure_desc:0 "Through building up the already pre-existing infrastructure in Alaska. The country can keep working towards self-sufficiency."
	USA_Start_Troop_Withdrawal:0 "Start Troop Withdrawal"
	USA_Start_Troop_Withdrawal_desc:0 "With much of Alaska working on its own, we can work to withdraw some of our soldiers."
	USA_Cooperate_With_Government_On_Withdrawal_Efforts:0 "Cooperate With Government On Withdrawal Efforts"
	USA_Cooperate_With_Government_On_Withdrawal_Efforts_desc:0 "By cooperating with Alaskan Government authorities, the withdrawal can proceed in a better way than expected."
	USA_Continue_Building_Up_The_Government:0 "Continue Building Up The Government"
	USA_Continue_Building_Up_The_Government_desc:0 "The Alaskan government is a weak powerless being which only answers to the American military. By building it up and granting it autonomy, the Alaskan government can learn independence."
	USA_Encouraging_American_Investment:0 "Encouraging American Investment"
	USA_Encouraging_American_Investment_desc:0 "The Alaskan economy needs the investment of foreign powers if it is going to survive. By investing in various different industries, the American government can show the world that the Alaskan market is open for business."
	USA_Continue_Secularization_Polcies:0 "Continue Secularization Policies"
	USA_Continue_Secularization_Polcies_desc:0 "While Towner had brought back many of the old native faiths, the new Alaskan government has become home to totemists, jews, muslims, Christians, protestants, etc. It's time to bring the secular values of America to Alaska."
	USA_Anti-Beringian_Propaganda:0 "Anti-Beringian Propaganda"
	USA_Anti-Beringian_Propaganda_desc:0 "Beringia was a backwards terroristic state which only existed because of the failure of Ayn Rand. It should not be glorified nor brought back."
	USA_Keep_Elmendirf_AFB_Under_Our_Control:0 "Keep Elmendirf AFB Under Our Control"
	USA_Keep_Elmendirf_AFB_Under_Our_Control_desc:0 "Elmendorf AFB (Airforce Base), provides a strategic route for both American and Canadian soldiers into the Pacific. While the Government has complete faith in the Alaskan government, the airforce believes that keeping Elmendorf should remain under American control."
	USA_Complete_Our_Withdrawal:0 "Complete Our Withdrawal"
	USA_Complete_Our_Withdrawal_desc:0 "Goodbye Alaska, hello sunny California."
	USA_Its_long_Overdue_Get_Our_Boys_Home_Now:0 "Its Long Overdue Get Our Boys Home Now"
	USA_Its_long_Overdue_Get_Our_Boys_Home_Now_desc:0 "Whether or not the American government can effectively create a new government is no longer an issue. It's time to pull out of Alaska and let fate do its job."
	USA_Set_A_4_Week_Timer:0 "Set A 4 Week Timer"
	USA_Set_A_4_Week_Timer_desc:0 "Opponents of PM Sanders say that an Alaskan withdrawal would take months if not years. Yet, Sanders believes the military only needs 4 weeks to effectively withdraw from the nation."
	USA_Push_For_Alaskan_Self_Defense:0 "Push For Alaskan Self Defense"
	USA_Push_For_Alaskan_Self_Defense_desc:0 "If Alaska will not defend itself, then why bother."
	USA_Put_The_Embassy_On_High_Alert:0 "Put The Embassy On High Alert"
	USA_Put_The_Embassy_On_High_Alert_desc:0 "The Embassy in the capitol will not survive a long siege if anything goes wrong. Once on high alert, they'll be ready to leave at a moments notice."
	USA_Remove_Our_Infrastructure:0 "Remove Our Infrastructure"
	USA_Remove_Our_Infrastructure_desc:0 "If we coddle the Alaskan peoples, they'll never learn."
	USA_Evacuate_Any_Allies:0 "Evacuate Any Allies"
	USA_Evacuate_Any_Allies_desc:0 "During our occupation, we contracted several groups to help in the occupation. Before we leave, maybe its time we offer them American citizenship."
	USA_Withdraw_Training_Instructors:0 "Withdraw Training Instructors"
	USA_Withdraw_Training_Instructors_desc:0 "The Alaskan military will never learn. Grab our boys and bring them back home."
	USA_Delegate_Policing_To_Alaskan_Authorities:0 "Designate Policing To Alaskan Authorities"
	USA_Delegate_Policing_To_Alaskan_Authorities_desc:0 "As part of the withdrawal effort, the American government will begin designating authority to the local authorities."
	USA_Start_Evacuating_Soldiers:0 "Start Evacuating Soldiers"
	USA_Start_Evacuating_Soldiers_desc:0 "Lets get everyone and leave!"
	USA_Give_A_Warning_To_Any_Civilians:0 "Give A Warning To Any Civilians"
	USA_Give_A_Warning_To_Any_Civilians_desc:0 "LEAVE!"
	USA_Leave_In_The_Middle_Of_The_Night:0 "Leave In The Middle Of The Night"
	USA_Leave_In_The_Middle_Of_The_Night_desc:0 "Bon Voyage Alaska! We bid you farewell."
	USA_We_Accomplished_our_Mission:0 "We Accomplished Our Mission"
	USA_We_Accomplished_our_Mission_desc:0 "Mission accomplished boys! Lets go home."
	USA_The_Anchorage_Crsis:0 "The Anchorage Crisis"
	USA_The_Anchorage_Crsis_desc:0 "Several groups united under the flag of the Native Liberation Army have marched to the doorstep of Anchorage and threaten to take the city if nothing is done."
	USA_Operation_Rising_Eagle:0 "Operation Rising Eagle"
	USA_Operation_Rising_Eagle_desc:0 "Like our previous invasion, Alaska will know the fury of the American peoples. Our nation, and our pride will not be hurt by the will of some radical groups in the frozen wasteland that is Alaska."
	USA_Secure_Old_Airfields:0 "Secure Old Airfields"
	USA_Secure_Old_Airfields_desc:0 "While we left planes for the Alaskan military to use, it seems they have fallen into the hands of the Liberationist groups. Time to reclaim our merchandise"
	USA_The_Race_For_Anchorage:0 "The Race For Anchorage"
	USA_The_Race_For_Anchorage_desc:0 "While our soldiers fight over Anchorage, it is no doubt a race. If we can't secure the city soon, the American people will lose faith in its military and Prime Minister."
	USA_Melt_The_Alaskan_Wilderness:0 "Melt The Alaskan Wilderness"
	USA_Melt_The_Alaskan_Wilderness_desc:0 "They won't be able to hide in piles of ash."
	USA_Bring_Canada_Into_The_Fold:0 "Bring Canada Into The Fold"
	USA_Bring_Canada_Into_The_Fold_desc:0 "As part of Operation Rising Eagle, the Canadian Government was authorized to take several border points. But it's time they expand their operations and help to finish off the terrorist threat once and for all."
	USA_BReinegrate_Alaska_Into_The_Union:0 "Reintegrate Alaska Into The Union"
	USA_BReinegrate_Alaska_Into_The_Union_desc:0 "Up until the Second American Civil War in the thirties, Alaska was apart of the old the United States. It's time that they be reintegrated into the union. No longer shall it be an occupying force, but the peoples of Alaska will know the full protection of the American empire."
	USA_Negotiate_For_Civilian_Safety:0 "Negotiate For Civilian Safety"
	USA_Negotiate_For_Civilian_Safety_desc:0 "A Reinvasion of the Alaskan frontier is deeply unpopular. Instead, we shall negotiate with the terror groups and complete our withdrawal."
	USA_Release_Beringian_Figures:0 "Release Beringian Figures"
	USA_Release_Beringian_Figures_desc:0 "By releasing Beringian terrorists in American prisons, we can show the terror groups a sign of good will."
	USA_Secure_The_Anchorage_Airport:0 "Secure The Anchorage Airport"
	USA_Secure_The_Anchorage_Airport_desc:0 "For the next 30 days, anyone that can make it to Anchorage airport will be given a ride to the American mainland where the government will decide what to do with them."
	USA_Push_For_A_Democratic_Regime:0 "Push For A Democratic Regime"
	USA_Push_For_A_Democratic_Regime_desc:0 "While we lost the main battle with Beringia, we can at least put pressure on them to democratically reform."
	USA_Leave_As_Quickly_As_Possible:0 "Leave As Quickly As Possible"
	USA_Leave_As_Quickly_As_Possible_desc:0 "They're not going to keep those guns aimed at the ground for long. We need to pull out now."
	USA_What_Was_The_Point:0 "What Was The Point"
	USA_What_Was_The_Point_desc:0 "What even was the point of invading if the government was going to hand the land back to the terrorists which the military fought?"
	USA_A_Successful_Withdrawal:0 "A Successful Withdrawal"
	USA_A_Successful_Withdrawal_desc:0 "Our occupation was a success and Alaska is now a beacon of American excellence. Even in that backward of a place, the peoples can learn about democracy and enter the modern world."
	USA_Continue_To_Support_Democracy_Aboard:0 "Continue To Support Democracy Aboard"
	USA_Continue_To_Support_Democracy_Aboard_desc:0 "With the success of Alaska, we can continue to promote various different forms of democracy abroad."
	USA_Establish_A_New_Embassy:0 "Establish A New Embassy"
	USA_Establish_A_New_Embassy_desc:0 "With a new government in control of Alaska, we need to establish a new embassy. This spot will forever be a memorial to the Alaskan invasion and the success of it. For Alaskans it shall be a spot which showcases their will to come to the modern world."
	USA_Cooperate_With_The_Alaskan_Military:0 "Cooperate With The Alaskan Military"
	USA_Cooperate_With_The_Alaskan_Military_desc:0 "Just because we left Alaska, it doesn't mean we can't continue cooperating with the Alaskan military. Together our nations can showcase excellence."
	USA_Alaska_And_America_Push_Forward_Together:0 "Alaska And America Push Forward Together"
	USA_Alaska_And_America_Push_Forward_Together_desc:0 "While they have yet to choose if they want to be reintegrated into the union, America could not be prouder of their brotherhood with this new nation. God Bless America and God Bless Alaska."
	USA_A_New_Day_A_New_Crisis_For_Africa:0 "A New Day, A New Crisis For Africa"
	USA_A_New_Day_A_New_Crisis_For_Africa_desc:0 "It's a new day upon the continent of Africa, and with that new day comes a new crisis."
	USA_Put_The_Embassy_On_Alert:0 "Put The Embassy On Alert"
	USA_Put_The_Embassy_On_Alert_desc:0 "The Embassy in the African capitol is being put on high alert as of now. If..when the call comes, the military will evacuate all employees, and burn any documents in the building."
	USA_Discuss_With_The_Cabinet:0 "Discuss With The Cabinet"
	USA_Discuss_With_The_Cabinet_desc:0 "The Prime Minister along with his cabinet have several options before them."
	USA_The_Obama_Doctrine:0 "The Obama Doctrine"
	USA_The_Obama_Doctrine_desc:0 "The young charismatic politician known as Barack Obama has suggested creating a new America in Africa. His plan would see the Empire re-establish a imperialist foothold in the continent along with a puppet regime ruled by an American general."
	USA_Securing_A_Coastal_FOB:0 "Securing A Coastal FOB"
	USA_Securing_A_Coastal_FOB_desc:0 "Phase One of War Plan Gold will see the military establish a foothold on the continent which will operate as our forward operating base."
	USA_Securing_Supply_Lines:0 "Securing Supply Lines"
	USA_Securing_Supply_Lines_desc:0 "Phase Two of War Plan Gold will see the navy alongside the land forces and air force establish major supply lines."
	USA_Drone_Strikes_On_Government_Positions:0 "Drone Strikes On Government Positions"
	USA_Drone_Strikes_On_Government_Positions_desc:0 "Phase 3 of War Plan Gold will see several major government positions in the capitol and other areas hit by missiles from American drones. These will be meant to eliminate the line of succession in the African government."
	USA_Hearts_And_Minds_Campaigns:0 "Hearts And Minds Campaigns"
	USA_Hearts_And_Minds_Campaigns_desc:0 "Phase 3.5 of War Plan Gold will see the beginning of a massive propaganda campaign. This will entail food, clean water, healthcare, and more being delivered by civilian organizations."
	USA_Bring_Relief_To_Africa:0 "Bring Relif To Africa"
	USA_Bring_Relief_To_Africa_desc:0 "The African government has neglected its own people for years. These peoples need relief, not just an enemy handed to them from the government."
	USA_Destroy_Government_Legitimacy:0 "Destroy Government Legitimacy"
	USA_Destroy_Government_Legitimacy_desc:0 "All government legitimacy is meant to be taken out by the military."
	USA_New_Better_African_Regimes:0 "New, Better African Regimes"
	USA_New_Better_African_Regimes_desc:0 "Eventually the African occupation will be ended. When that is ended, the history of the continent will be changed forever. We can either establish new independent nations and destroy the idea of African unity forever, or we can actually introduce democracy to the continent and liberate its peoples."
	USA_Intervene_On_The_Rebels_Behalf:0 "Intervene On The Rebels Behalf"
	USA_Intervene_On_The_Rebels_Behalf_desc:0 "Instead of reviving Imperialism, the Prime Ministers cabinet has elected to support the democratic rebel cause."
	USA_Sending_An_Intervention_Force:0 "Sending An Intervention Force"
	USA_Sending_An_Intervention_Force_desc:0 "A small intervention force will be sent over to the Rebels. These men and women will help train and arm the rebels, along with assassinating major targets which could present a threat."
	USA_Grant_Temporary_Visas:0 "Grant Temporary Visas"
	USA_Grant_Temporary_Visas_desc:0 "For the time being, we'll grant temporary visas to refugees fleeing the conflicts. They'll be housed in the Mexican Protectorate and then once the war is over they can either apply for citizenship or return home to aid in rebuilding."
	USA_Promote_Civilian_Safety:0 "Promote Civilian Safety"
	USA_Promote_Civilian_Safety_desc:0 "The American government is beginning to put pressure on both governments in the war. Both sides have worked to ensure that the civilian populations of their sides will receive safe haven and be safe from military targeting"
	USA_Promoting_Democracy_Abroad:0 "Promoting Democracy Abroad"
	USA_Promoting_Democracy_Abroad_desc:0 "As part of this rebel assistance, our government has made a promise to promote democracy abroad. We shall not stand for the tyranny of the world, let alone the tyranny of government."
	USA_Set_Up_Red_Cross_Hospitals:0 "Set Up Red Cross Hospitals"
	USA_Set_Up_Red_Cross_Hospitals_desc:0 "The American Red Cross, with the protection of the military will allow those still trapped in combat zones to receive medical care. Officially recognized as neutral ground, these red cross camps will treat both rebel and government soldiers, alongside civilian populations."
	USA_Drone_Strikes_Government_Positions:0 "Drone Strikes Government Positions"
	USA_Drone_Strikes_Government_Positions_desc:0 "Drones from allied bases will destroy government bases and supply lines. These strikes will demoralize the government and hopefully hasten the end of the war."
	USA_Establish_Relations_With_The_New_Regime:0 "Establish Relations With The New Regime"
	USA_Establish_Relations_With_The_New_Regime_desc:0 "With the rebels securing the government and being legitimate, our government will re-establish relations with the African regime."
	USA_Support_The_Legitmate_Government:0 "Support The Legitmate Government"
	USA_Support_The_Legitmate_Government_desc:0 "Surprisingly we will support the legitimate government of the African federation."
	USA_Sanction_Rebel_Groups:0 "Sanction Rebel Groups"
	USA_Sanction_Rebel_Groups_desc:0 "As part of our support, the American government will sanction rebels and encourage the international community to not supply these terrorists."
	USA_Provide_Military_Aid:0 "Provide Military Aid"
	USA_Provide_Military_Aid_desc:0 "As part of our support, the American government will supply the decaying African military with state-of-the-art weaponry."
	USA_Protect_The_Embassy:0 "Protect The Embassy"
	USA_Protect_The_Embassy_desc:0 "The situation is still dangerous, so to protect those who work in the African capitol, the government will send the American military to protect the embassy."
	USA_Send_Military_Advisors:0 "Send Military Advisors"
	USA_Send_Military_Advisors_desc:0 "It's shameful how bad the African military is. To rectify this, several groups will be travelling to military bases and training the African military the proper way"
	USA_Provide_Economic_Aid:0 "Provide Economic Aid"
	USA_Provide_Economic_Aid_desc:0 "Our government will fund the African Federation as a way to help repair its failing economy."
	USA_Drone_Strikes_On_Rebels:0 "Drone Strikes On Rebels"
	USA_Drone_Strikes_On_Rebels_desc:0 "Coming out of the Obama international Airport, Drones will launch strategic strikes on rebel positions eliminating their leadership, command structure, and manufacturing capability. Hell will rain down upon the African jungles."
	USA_Stabilize_The_Regime:0 "Stabilize The Regime"
	USA_Stabilize_The_Regime_desc:0 "Our main priority now will be the stabilization of the African Federation. This will include pressuring the government to reform, supplying economic aid, military training, policing and more."
	USA_Fix_Americas_Mistakes:0 "Fix Americas Mistakes"
	USA_Fix_Americas_Mistakes_desc:0 "America is no longer the great nation it was meant to be. Since the Commonwealth party was made mainstream and Bernie got into office, the nation has plummeted. Inflation is on the rise, political extremism is on the rise, and the military has become a laughing joke."
	USA_Combat_Political_Extremism:0 "Combat Political Extremism"
	USA_Combat_Political_Extremism_desc:0 "As part of the Fix America program, the administration is focusing on combatting political extremism. This involves granting temporary powers to the NSA, vetting social media companies which may or may not promote extremism and working with local law enforcement agencies to prevent politically motivated tragedies."
	USA_Bernie_Was_The_Greatest_Mistake:0 "Bernie Was The Greatest Mistake"
	USA_Bernie_Was_The_Greatest_Mistake_desc:0 "Arguably in the history of American mistakes, Bernie Sanders was one of the largest. His policies ruined the American industrial sector, gave way to hyperinflation, and ultimately he led to the destruction of the American spirit."
	USA_Roll_Back_BernieCare:0 "Roll Back BernieCare"
	USA_Roll_Back_BernieCare_desc:0 "Berniecare needs to be rolled back. It's a policy which has never worked. Through this “free healthcare” program, hospitals have become overcrowded, run out of supplies and faced employment problems. Rolling this back will help relieve the stress on doctors and finally give the real working Americans a chance to receive timely healthcare."
	USA_The_1776_Project:0 "The 1776 Project"
	USA_The_1776_Project_desc:0 "The 1776 Project is called a nationalistic program by some. It is meant to reinvigorate the patriotism many used to feel for this nation. The commonwealth revisionist history curriculum will be swept away, and finally kids will be exposed to the real history of America, not just some propagandist curriculum which was designed to make them hate America."
	USA_Roll_Back_Parliamentary_Powers:0 "Roll Back Parliamentary Powers"
	USA_Roll_Back_Parliamentary_Powers_desc:0 "Parliament is too powerful as is. Rolling back their powers and handing much of it down to the local government level will prevent the widespread 1 party tyranny."
	USA_Employ_Native_In_Office:0 "Employ Natives In OFfice"
	USA_Employ_Native_In_Office_desc:0 "Native Americans are some of the most under franchised people in America. Employing them in offices will ensure these people have a voice in their government."
	USA_Promote_Traditional_Values:0 "Promote Traditional Values"
	USA_Promote_Traditional_Values_desc:0 "Progressive values are fine, but not when they degrade the moral fabric of this nation. Promoting traditional values will end the activism in the classroom and hopefully stop the tide of immoral practices in Americas heartland."
	USA_Criticize_Media_Bias:0 "Criticize Media Bias"
	USA_Criticize_Media_Bias_desc:0 "The Media is part of the problem when it comes to political extremism. They stoke the fires of division and if not controlled or at least called out, the media will inevitably lead to a second civil war in America."
	USA_Add_Stipulations_To_Welfare:0 "Add Stipulations To Welfare"
	USA_Add_Stipulations_To_Welfare_desc:0 "Welfare is just another reason for inflation in the nation. Many people in the lower income brackets have learned how to take advantage of the system. So to help lower hyperinflation, the welfare requirements for Americans will be raised. After all this money is supposed to help the desperate, not the lazy."
	USA_Work_With_Reformists:0 "Work With The Reformists"
	USA_Work_With_Reformists_desc:0 "Reformists in the Commonwealth party can be worked with. There are those like Barack Obama who understand that not all of their party frontline policies are feasible."
	USA_Demonize_The_Commonwealth_Party:0 "Demonize The Commonwealth Party"
	USA_Demonize_The_Commonwealth_Party_desc:0 "To truly win back America, the country needs to turn away from the radicals of the Commonwealth Party."
	USA_Actually_Help_The_Common_Man:0 "Actually, Help The Common Man"
	USA_Actually_Help_The_Common_Man_desc:0 "Unlike the Commonwealth, we aim to actually help the common man. This can't be done by overtaxing the Rich who own business, nor can it be done through extensive amounts of welfare."
	USA_Lower_Taxes_On_The_Rich:0 "Lower Taxes On The Rich"
	USA_Lower_Taxes_On_The_Rich_desc:0 "Lowering taxes on the rich..in idea will see the Rich take those savings and reinvest them into the business..hypothetically making the worker richer."
	USA_Create_Low_Tax_Zones:0 "Create Low Tax Zones"
	USA_Create_Low_Tax_Zones_desc:0 "Low tax zones will be created in the worst cities imaginable. This will in turn see the communities improved and gentrified."
	USA_Reinvigorate_American_Industry:0 "Reinvigorate American Industry"
	USA_Reinvigorate_American_Industry_desc:0 "Under the Commonwealth, the American industrial sector has been decimated. Lowering corporate taxes will see companies which have gone oversees to the African Federation and other countries come back to the Empire."
	USA_Lower_Tarrifs:0 "Lower Tarrifs"
	USA_Lower_Tarrifs_desc:0 "Lower Tariffs will reinvigorate the trade sector. With the lowering of these, we will open ourselves to better trade opportunities which can in turn improve the economic."
	USA_Promote_Pre_Civil_War_History:0 "Promote Pre-Civil War History"
	USA_Promote_Pre_Civil_War_History_desc:0 "While the Imperial Archives in San Francisco are a complete collection of the post-civil war history, the administration is seeking to provide the people with a comprehensive pre-civil war history. This will include the wonders of Herbert Hoover and how radical socialists led to the downfall of the old United States Government."
	USA_The_Wonders_Of_Capitalism:0 "The Wonders Of Capitalism"
	USA_The_Wonders_Of_Capitalism_desc:0 "Capitalism is a wonderful thing. Contrary to what the Commonwealth says, capitalism is able to breed innovation and lift the poorest person up."
	USA_Subsidize_The_Tech_Industry:0 "Subsidize The Tech Industry"
	USA_Subsidize_The_Tech_Industry_desc:0 "As part of a compromise with Todd Howard and his Technocrats, the tech sector will see a huge increase in federal funding."
	USA_Harshen_Immigration_Restrictions:0 "Harshen Immigration Restrictions"
	USA_Harshen_Immigration_Restrictions_desc:0 "While immigration is great, our nation can not afford to take care of all who wish to come. We need to harshen the standards of immigration so instead of having someone who is here illegally feeding off the federal government, our money can go towards those who truly need it." 
	USA_Criticize_The_Canadian_Regime:0 "Criticize The Canadian Regime"
	USA_Criticize_The_Canadian_Regime_desc:0 "The Canadian Government will never reclaim the old English Isles. However, that is not the reason for the condemnation. The Canadian government has turned into the tyrants they claim to fight. Unless the Canadian people change, the government will only trample the liberties of the people for a longer period."
	USA_Support_School_Choice:0 "Support School Choice"
	USA_Support_School_Choice_desc:0 "School choice has been a controversial topic since the MLK Administration. Many believe that it will lower the quality of life in Public Schools, but who is the government to say where a kid can go to school."
	USA_America_First_Energy_Plan:0 "America First Energy Plan"
	USA_America_First_Energy_Plan_desc:0 "The America First Energy plan will finally make the Empire energy independent. Tapping oil reserves in Montana, Ohio, and Texas, the country will see its gas prices lowered drastically."
	USA_Safe_Gun_Legislation:0 "Safe Gun Legislation"
	USA_Safe_Gun_Legislation_desc:0 "While PM Ryan supports the still functioning 2nd amendment of the Empire, he also supports safe gun legislation. This will include the limiting of Ammo sales, the banning of heavy assault rifles and the encouragement of gun buyback programs."
	USA_America_Made_Great:0 "America Made Great"
	USA_America_Made_Great_desc:0 "America under the Ryan administration has finally returned to greatness. Our industrial sector is booming, our gas prices are low, and jobs are available once again. Our country is back to being a country for the working man, not the lazy man."
	USA_A_Conservative_Foreign_Policy:0 "A Conservative Foreign Policy"
	USA_A_Conservative_Foreign_Policy_desc:0 "Conservatism has saved America in its domestic policy, so why can't it help the foreign policy of America."
	USA_Fall_Back_To_Hoover:0 "Fall back To Hoover"
	USA_Fall_Back_To_Hoover_desc:0 "Herbert Hoover in all his faults had the right idea. America can't be the worlds policeman. Instead it needs to just sit back and relax while the world slides further into destruction."
	USA_Neutral_Trade_Policies:0 "Neutral Trade Policies"
	USA_Neutral_Trade_Policies_desc:0 "Why focus our trade on only one faction. We can maximize profits by trading with everyone. AS LONG AS THEY ARENT SYNDICALIST!"
	USA_Continue_The_Syndicalist_Embargoes:0 "Continue The Syndicalist Embargoes"
	USA_Continue_The_Syndicalist_Embargoes_desc:0 "Continuing the syndicalist embargoes will see the international community continue its pressure on the tyrannical remaining syndicalist regimes."
	USA_Encourage_Foreign_Investment:0 "Encourage Foreign Investment"
	USA_Encourage_Foreign_Investment_desc:0 "Foreign investment in America is a great way to protect ones assets. We aren't going to go to war anytime soon nor will we discriminate against a new industry."
	USA_Extradite_Criminals:0 "Extradite Criminals"
	USA_Extradite_Criminals_desc:0 "We have many criminals in our prisons wanted by their respective countries. So to avoid conflict, we will extradite them back to their homelands where they'll presumably face trial."
	USA_Invest_In_Canada:0 "Invest In Canada"
	USA_Invest_In_Canada_desc:0 "Although we condemn their encroaching tyranny, we see the worthwhile investments possible. Canada in turn is pissed at us for condemning them but welcomes the economic help."
	USA_Invest_In_Germany:0 "Invest In Germany"
	USA_Invest_In_Germany_desc:0 "Victor of both Weltkriegs, the German empire is an economic powerhouse. Investing in their companies can only bring America unforeseen wealth."
	USA_Neutral_Grounds_In_America:0 "Neutral Grounds In America"
	USA_Neutral_Grounds_In_America_desc:0 "America shall become the Switzerland of the world. Neutrality shall be what guides us and no longer shall we force ourselves into devastating wars."
	USA_Brng_Peace_To_Both_Factions:0 "Bring Peace To Both Factions"
	USA_Brng_Peace_To_Both_Factions_desc:0 "Instead of stoking the fight between the Entente and the Reichspakt, our government will focus on bringing both factions closer together. Someday they will face the remains of the Third Internationale and by god we'll make sure they're ready for it."
	USA_Canadian_Military_Deals:0 "Canadian Military Deals"
	USA_Canadian_Military_Deals_desc:0 "While a popular destination for immigration, the Canadian regime is poor in military strength. Their soldiers lack basic training and modern weaponry. Some even use pre-2nd weltkrieg weaponry still."
	USA_German_Food_Deals:0 "German Food Deals"
	USA_German_Food_Deals_desc:0 "The German Empire is an industrial powerhouse, yet it is lacking in airable land. To rectify this and help the situation, America will sell excess food to the Empire."
	USA_Never_Another_Weltkrieg:0 "Never Another Weltkrieg"
	USA_Never_Another_Weltkrieg_desc:0 "Never again will there be a Weltkrieg over Europe. Never again will millions die for needless ideological wars."
	USA_A_New_Fortress_On_The_Hill:0 "A Fortress On The Hill"
	USA_A_New_Fortress_On_The_Hill_desc:0 "America can not afford to sit out of the world's problems anymore. Instead of retreating into cowardly isolationism, the country will showcase its real power to the world. God Bless the Nortons."
	USA_The_Third_Power:0 "The Third Power"
	USA_The_Third_Power_desc:0 "Theirs the Entente, the Reichspakt, and now the Pacific-Atlantic Defense Sphere. A Third Power has entered the ring and upset Geopolitics."
	USA_Set_up_American_Bases_Overseas:0 "Set Up American Bases Overseas"
	USA_Set_up_American_Bases_Overseas_desc:0 "The American military will not be restricted to the home territories anymore. With the PADS alliance, comes the expansion of the military. Bases will be built in all member countries, promoting the common defense of all."
	USA_Free_Movement_Between_Members:0 "Free Movement Between Members"
	USA_Free_Movement_Between_Members_desc:0 "No longer having to worry about a war breaking out, the civilian members of PADS nations will be able to travel freely between members experiencing all aspects of foreign culture."
	USA_Set_Up_Joint_Battalions:0 "Set Yp Joint-Battalions"
	USA_Set_Up_Joint_Battalions_desc:0 "Joint-Battalions of PADS will deepen the connection between our fledgling alliance. They will be answerable to a joint command instead of their country."
	USA_Push_For_French_Membership:0 "Push For French Membership"
	USA_Push_For_French_Membership_desc:0 "Viva la France, Viva la Bonapartiste!. Our French brothers sit on top a bed of conflict. With PADS they can feel safe from the threat of the Kaiserreich, and the English above them."
	USA_Cultural_Exchange_Between_The_Memebers:0 "Cultural Exchange Between The Members"
	USA_Cultural_Exchange_Between_The_Memebers_desc:0 "Cultural exchange is a tenet of the PADS alliance and it will be seen to fruition. No culture can survive on its own, but together the PADS nations can intermix their cultures, or expose others to previously unknown parts of it."
	USA_Push_For_International_Detente:0 "Push For International Détente"
	USA_Push_For_International_Detente_desc:0 "We are not seeking conflict with the Reichspakt or the Entente. We seek peace and will defend it at any cost. These alliances need to realize that the real threat lays within the syndicalist nations of the world, not free loving sometimes tyrannical nations."
	USA_Reach_Out_To_The_Benelux:0 "Reach Out To The Benelux"
	USA_Reach_Out_To_The_Benelux_desc:0 "The Benelux sits on a crossroads. On one hand, they are economically dependent on the Kaiserreich for their goods. On the other hand, they have no military protection from the threat of Totalist nukes flying over their cities. Joining PADS will free them from German bondage, and give them reprieve from Totalist terror."
	USA_Lower_Tarrifs_For_Members:0 "Lower Tarrifs For Members"
	USA_Lower_Tarrifs_For_Members_desc:0 "Within the alliance, members will receive favorable trade deals."
	USA_Secure_True_Freedom:0 "Secure True Freedom"
	USA_Secure_True_Freedom_desc:0 "True freedom is something which is defended. Together, the alliance will defend the rights of everyone."
	USA_Tame_The_Iberians:0 "Tame The Iberians"
	USA_Tame_The_Iberians_desc:0 "Operation Ajax will be a multi-nation invasion of the Iberian peninsula. It is meant to curb the attitudes of the expansionist Portuguese who seek to reclaim their lost colonial empire, and bring constitutional democracy to the Spanish who have suffered under the Carlists for decades."
	USA_The_Era_Of_Jones:0 "The Era Of Jones"
	USA_The_Era_Of_Jones_desc:0 "Many said it could not happen. “Who would elect that Royalist crackpot?” they all said. However, the man won not only the popular vote, but he managed to attain a large portion of the electoral college. The Era of Sanders is over, but the Era of Jones is just beginning."
	USA_For_The_Emperor:0 "For The Emperor!"
	USA_For_The_Emperor_desc:0 "Given how Alexander Jones is the first Royalist to ascend past Governorship, the people do not know what to expect. He spouts these crazy conspiracy theories about inter-government agencies which hunt aliens and turn the frogs gay. What about the economy? What about foreign policy?"
	USA_Harshen_Border_Restrictions:0 "Harshen Border Restrictions"
	USA_Harshen_Border_Restrictions_desc:0 "Part of the Royalist agenda has been to harshen restrictions on Canadian immigration. Since the Perot administration, the immigration problem has spiraled out of control. Degrading the border with Canada let hundreds of thousands oppressed Quebecois illegally enter the Empire. They do not seek citizenship but some in the reform party have reached across the Isle seeking to further degrade the border. PM Jones will not allow illegals to enter the Empire and take jobs from good Imperial citizens."
	USA_Increase_The_Military_Budget:0 "Increase The Military Budget"
	USA_Increase_The_Military_Budget_desc:0 "The world today teeters on an edge. Not since the Second Weltkrieg has the world been this instable. England wants to soak the world in a nuclear fire, Germany is only increasing tensions with the Russians, and for some reason, the French are quiet..too quiet. To ready America for the coming conflicts, the military budget will be drastically increased."
	USA_Reform_The_Ministry_Of_Colonies:0 "Reform The Ministry OF Colonies"
	USA_Reform_The_Ministry_Of_Colonies_desc:0 "Disbanded by the MLK administration, the ministry of colonies managed civil conflicts in Mexico and Hawaii. PM King Jr had called the ministry an antiquated imperialist machine which needed to be done away with. With the Royalist party in power, the Ministry of Colonies will be remade. Managing the Mexican protectorate, and soon to be future territories, the ministry will be headed up by ex-Prime Minister hopeful Donald Trump."
	USA_the_1938_Project:0 "The 1938 Project"
	USA_the_1938_Project_desc:0 "The 1938 Project is a monarcho-nationalistic education curriculum which will glorify Civil War and post-civil war history. Meant to show how corrupt the old United States Was, this project will show how the Nortons graciously took power in the Pacific States, and reunited the states under a benevolent administration."
	USA_Redfine_The_American_Identity:0 "Redefine The American Identity"
	USA_Redfine_The_American_Identity_desc:0 "Under the progressives and the far-left commonwealth, the American identity has become muddled. We aren't syndicalists, we aren't national populists, and we definitely aren't liberals."
	USA_Vilify_The_Commonwealth_Party:0 "Vilify The Commonwealth"
	USA_Vilify_The_Commonwealth_Party_desc:0 "The Commonwealth party has led America down the worst path possible. They can not be allowed to return to power, lest the Empire fall back into disarray."
	USA_Bribing_Parliament:0 "Bribing Parliament"
	USA_Bribing_Parliament_desc:0 "For our next move, bribes will be distributed through Parliament. Those who support the black budget will expose their information. We will find Delta Green, and we will destroy these Occultist fiends of Lovecraft."
	USA_A_Meeting_With_The_Emperor:0 "A Meeting With The Emperor"
	USA_A_Meeting_With_The_Emperor_desc:0 "As we prepare our strike, we will meet with the Emperor. We will inform him of the actions being taken and ask for his support."
	USA_Sideline_Political_Opponents:0 "Sideline Political Opponents"
	USA_Sideline_Political_Opponents_desc:0 "There will be those who seek to sideline our agenda and protect those who fund their campaigns. They will sidelined until an appropriate date, and when that date comes they will answer for their crimes against the Empire."
	USA_The_War_On_Delta_Green:0 "The War On Delta Green"
	USA_The_War_On_Delta_Green_desc:0 "The product of Lovecraft and his ideological beliefs will be wiped clean from the face of the Earth. Delta Green and its products will be public knowledge. There will be a reckoning of peoples, and there will come a day when the Lovecraftists of the world will be exposed."
	USA_Team_Up_With_The_CIA:0 "Team Up With The CIA"
	USA_Team_Up_With_The_CIA_desc:0 "The CIA has many assets in the underground. Using them, we will expose every dark corner of the country."
	USA_Scour_New_England:0 "Scour New England"
	USA_Scour_New_England_desc:0 "Under the leadership of King Lovecraft, the New England area became one huge Delta Green base. Several facilities located around the area contain “paranormal” items. Teams of Navy Seals, Marines, and local law enforcement will scour supposed locations for such items."
	USA_Inter_Goverment_Warfare:0 "Inter-Government Warfare"
	USA_Inter_Goverment_Warfare_desc:0 "As the war on Delta Green continues, the government faces stability issues. Several factions in the government have begun open warfare against each other."
	USA_Arrest_Delta_Green_Collaborators:0 "Arrest Delta Green Collaborators"
	USA_Arrest_Delta_Green_Collaborators_desc:0 "To aid in our fight against the globalist organization, the police aided by the military will arrest several members of government who have collaborated with Delta Green."
	USA_Base_01_Destroyed:0 "Base 01 Destroyed"
	USA_Base_01_Destroyed_desc:0 "Located in Vermont, Base 01 is the headquarters of Delta Green. Inside is the rumored Project 001, aka the UFO which crashed in Vermont during the Second Civil War."
	USA_Reveal_What_Was_Inside:0 "Reveal What Was Inside"
	USA_Reveal_What_Was_Inside_desc:0 "With Base 01 destroyed, the American public will have all its files released. They will know of what was found in the base, the paranormal dangers they may face, and most importantly, why they should fear Gary."
	USA_The_Public_Can_Never_Know:0 "The Public Can Never Know"
	USA_The_Public_Can_Never_Know_desc:0 "With Base 01 Destroyed, the Public seek to know what was inside. The Truth however is far more dangerous than the organization every was. So to win both sides of the argument, PM Jones has allowed a plethora of fabricated records to be released, including some that vilify political opponents."
	USA_Expanding_The_Empire:0 "Expanding The Empire"
	USA_Expanding_The_Empire_desc:0 "For an Empire to survive, we need to expand. Under the progressives and the commonwealth our expansion has ended. But under Jones, our empire will not only flourish but show its strength to the world."
	USA_The_Mexican_Protectorate:0 "The Mexican Protectorate"
	USA_The_Mexican_Protectorate_desc:0 "Acquired during the 2nd American Civil War and fulfilling the legacy of Emperor Joshua Norton I, the Mexican protectorate has become somewhat of a drain on resources. One proposal put forth by Texas Governor Rick Scott would be to fully annex the protectorate into the Empire itself. This will cost millions but in the far run, it will increase our economic status along with the added bonus of doubling our military."
	USA_Integration_Into_The_Empire:0 "Integration Into The Empire"
	USA_Integration_Into_The_Empire_desc:0 "With our course of action decided, the Mexican Protectorate will be annexed into the Greater American Empire. However, this will present many problems. Infrastructure needs to be reoriented, local governments need to be reorganized to follow the Imperial system and parliamentary elections will need to happen."
	USA_Begin_Integrating_Military_Forces:0 "Begin Integrating Military Forces"
	USA_Begin_Integrating_Military_Forces_desc:0 "Military forces loyal to the Mexican government will find themselves under the control of a temporary chain of command until the full annexation is complete."
	USA_Reorganize_Local_Governments:0 "Reorganize Local Government"
	USA_Reorganize_Local_Governments_desc:0 "Local governments will see the biggest change during this annexation. State lines will be drawn up with fresh rounds of gubernatorial candidates presenting themselves. Their state congress' will be reorganized into state parliaments, and even the town council will learn a new way of democracy."
	USA_Merging_Infrastructure:0 "Merging Infrastructure"
	USA_Merging_Infrastructure_desc:0 "As part of the annexation process, we will reorient Mexican infrastructure to fit ours. This includes redoing roads, bridges, airports, and more."
	USA_Welcome_The_Mexican_Royal_Family:0 "Welcome The Mexican Royal Family"
	USA_Welcome_The_Mexican_Royal_Family_desc:0 "Under the Norton Empire, the house of Iturbe was restored to the Mexican throne. As long as they were compliant in their emperors' orders. The house will be welcomed to San Francisco where they will take up residence in a palatial style mansion."
	USA_Bienvenidos_A_Mexico:0 "Bienvenidos A Mexico"
	USA_Bienvenidos_A_Mexico_desc:0 "Along with the Royal Family, the Empire will be formally welcoming all Mexican citizens into its embrace. They'll know stability and prosperity like never before."
	USA_The_Empire_Expands:0 "The Empire Expands"
	USA_The_Empire_Expands_desc:0 "With Mexico under our control, the Empire has successfully completed its first phase of expansion. Today Mexico, tomorrow the world."
	USA_Lessen_Their_Autonomy:0 "Lessen Their Autonomy"
	USA_Lessen_Their_Autonomy_desc:0 "Instead of outright annexation by the Empire, the Mexican protectorate will see a gradual annexation. It may not be now, maybe decades down the road. For now we will be content to slowly pull back their autonomy."
	USA_Create_A_Joint_Military_Command_Structure:0 "Create A Joint Military Command Structure"
	USA_Create_A_Joint_Military_Command_Structure_desc:0 "As part of the gradual annexation, the militaries of both nations will create a joint-command structure. This will strengthen the bond between both our nations."
	USA_Ensure_Free_Travel:0 "Ensure Free Travel"
	USA_Ensure_Free_Travel_desc:0 "Free travel across the border will show the peoples that our borders no longer exist."
	USA_The_False_Americans:0 "The False Americans"
	USA_The_False_Americans_desc:0 "Death to Hoover and Death to the FBI!"
	USA_No_Quarter_For_These_Traitors:0 "No Quarter For These Traitors"
	USA_No_Quarter_For_These_Traitors_desc:0 "These traitors, who after decades still do not accept the rule of Norton will find no quarter when the true Americans come knocking."
	USA_Speak_To_The_UN:0 "Speak To The UN"
	USA_Speak_To_The_UN_desc:0 "The UN will know one thing. You are with us or against us. When we invade, we expect no international aid to be shipped to these “countries”. We expect them to protest and call us warmongers, but it is they who will face the hellstorm of American fury if they interfere. Find out why the American Empire doesn't have universal healthcare."
	USA_Reign_Hell_Upon_New_Washington:0 "Reign Hell Upon New Washington"
	USA_Reign_Hell_Upon_New_Washington_desc:0 "“New Washington”..we spit on that name. They claim to be the new home of the old United States yet they are more corrupt and more tyrannical than the old administration. The USCA government will die in a melting pot of hellfire missiles."
	USA_Bring_Home_The_Last_Hoover:0 "Bring Home The Last Hoover"
	USA_Bring_Home_The_Last_Hoover_desc:0 "Herbert Hoover III, the “President” of the United States Enclave otherwise known as the “United States of Liberia” will be brought to the Capitol and stand trial for his crimes."
	USA_Set_Up_New_Colonies:0 "Set Up New Colonies"
	USA_Set_Up_New_Colonies_desc:0 "With Central America and part of North Africa under our control, the American government will set up new colonial administrations until a time is deemed where the peoples of the land can govern themselves according to western standards."
	USA_The_Northern_Neighbor_Policy:0 "The Northern Neighbor Policy"
	USA_The_Northern_Neighbor_Policy_desc:0 "Canada, once an ally of America has become a thorn in the side of the everyday America. We believe that the nation would be better handled by Americans, not some foreign group claiming to be a Kingdom in exile."
	USA_Propose_A_Royal_Marriage:0 "Propose A Royal Marriage"
	USA_Propose_A_Royal_Marriage_desc:0 "While we hate them, the best way to get Canada under our control would the marriage between the Nortons and the Windsor's."
	USA_They_Accepted:0 "They Accepted"
	USA_They_Accepted_desc:0 "The Windsor family has surprisingly accepted. The family will be welcomed into a union with a future heir of the throne."
	USA_Propose_A_Union_Of_Nations:0 "Propose A Union Of Nations"
	USA_Propose_A_Union_Of_Nations_desc:0 "With the Windsor-Norton family alliance secured, next comes the union of nations. Temporarily under the “Canadian-American” government. Our people will begin to integrate ourselves into a new North American Union."
	USA_Welcome_The_Windsors_To_Their_New_Home:0 "Welcome The Windsors To Their New Home"
	USA_Welcome_The_Windsors_To_Their_New_Home_desc:0 "The Windsor family will no longer be relegated to the hellscape that is Toronto. It's time for us to welcome them to the family to San Francisco."
	USA_The_North_American_Empire:0 "The North American Empire"
	USA_The_North_American_Empire_desc:0 "Mexico, Canada, and the American Empire….together in union, together in allegiance to the Norton family. Welcome to the North American Empire, the only empire to have ever spanned an entire continent."
	USA_They_Denied:0 "They Denied.."
	USA_They_Denied_desc:0 "They denied our amazing gesture. So our next option is to destabilize the Canadian government to the point where if we intervene, the American peoples would be welcomed as liberators."
	USA_Continue_The_War_On_Terror_In_Canada:0 "Continue the War On Terror..In Canada"
	USA_Continue_The_War_On_Terror_In_Canada_desc:0 "The War on Terror was primarily fought in Alaska. Yet, we have an opportunity to continue it in Canada. By funding “The Red Chairman” Justin Trudeau, we can direct him to attack places. This will lead to the destruction of the Canadian government and allow us to intervene."
	USA_Fund_Justin_Truedeau:0 "Find Justin Truedeau"
	USA_Fund_Justin_Truedeau_desc:0 "After weeks of scouring, our people have found the Red Chairman himself. The Cia will covertly fund him and direct him on how to destabilize the Canadian Government. Funny thing is, he doesn't realize he's being played."
	USA_Safeguard_The_Windsor_Family:0 "Safeguard The Windsor Family"
	USA_Safeguard_The_Windsor_Family_desc:0 "With the attack on the Canadian government killing the Prime Minister and a large portion of the Canadian Parliament, the Windsor family will be extracted from Canada for their safety."
	USA_Take_Over_Military_Responsibility:0 "Take Over Military Responsibility"
	USA_Take_Over_Military_Responsibility_desc:0 "As the Canadian government has shown itself to be full of traitors, the American military will take over military responsibility in the Canadian frontier."
	USA_The_Hunt_For_Trudeau:0 "The "Hunt" For Trudeau"
	USA_The_Hunt_For_Trudeau_desc:0 "Now that we own the Canadian wilderness, the people will be led to believe that our military is hunting for Justin Trudeau. In reality, this will be used as an excuse for us to take more and more power."
	USA_Take_Advantage_Of_Canadian_Chaos:0 "Take Advantage Of Canadian Chaos"
	USA_Take_Advantage_Of_Canadian_Chaos_desc:0 "Our plan has come to fruition. The Canadian government will be dissolved and military administration run by those loyal to Norton will be installed."
	USA_Install_Government_Leaders:0 "Install Government Leaders"
	USA_Install_Government_Leaders_desc:0 "Local government leaders who resist us will be replaced with those loyal to America and the Empire itself."
	USA_Begin_Recrienting_Infrastructure:0 "Begin Re-orienting Infrastructure"
	USA_Begin_Recrienting_Infrastructure_desc:0 "It's time to show the Canadian people how to drive on the side of freedom."
	USA_Broadcast_American_Propaganda:0 "Broadcast American Propaganda"
	USA_Broadcast_American_Propaganda_desc:0 "or years, the Canadian people have been oppressed by their government and offered no resistance. While our indefinite stay is full of problems, we need to get the Canadian peoples on our side."
	USA_Sideline_The_Windsors:0 "Sideline The Windsors"
	USA_Sideline_The_Windsors_desc:0 "The Windsors will be moved to the royal residences in San Fransico. They will be left to rot in their palatial mansion right next to the Mexican royal family."
	USA_Begin_Americanizing_Canada:0 "Begin Americanizing Canada"
	USA_Begin_Americanizing_Canada_desc:0 "The old Canada is gone. Under the military administration, it will slowly begin to feel more and more American."
	USA_Make_America_Great_Again:0 "Make America Great Again"
	USA_Make_America_Great_Again_desc:0 "Crooked Bernie and the Commonwealth establishment have ruined what America once was."
	USA_A_New_Type_Of_Republicanism:0 "A New Type Of Republicanism"
	USA_A_New_Type_Of_Republicanism_desc:0 "While we Republicans have always stood for truth, justice and the REAL American way, we have become a laughing stock for those who don't believe in our cause. Donald Trumps new Republican party will mimic what the Commonwealth once was. A party for the people by the people."
	USA_Renegotiate_The_Reichspakt_Trade_Agreement:0 "Renegotiate The Reichspakt Trade Agreement"
	USA_Renegotiate_The_Reichspakt_Trade_Agreement_desc:0  "Under PM Bush, the Empire opened up trade to the Reichspakt formally ending the cold war between our two nations. Bush himself was too cowardly and for decades the American economy has ebbed and flowed with the Germans. Renegotiating the agreements under Trump will see Americans be placed higher. In other words, PM Trump seeks to implement a Pro-American deal."
	USA_Lower_Corporate_Taxes:0 "Lower Corporate Taxes"
	USA_Lower_Corporate_Taxes_desc:0 "Under Bernie, the corporate tax rate rose to over 56% absolutely devastating the economy. The First step in healing the economy will be to progressively lower the tax rate until we have enough support to minimize it altogether."
	USA_Reverse_bernie_Tax_Hikes:0 "Reverse Bernies Tax Hikes"
	USA_Reverse_bernie_Tax_Hikes_desc:0 "Bernies tax hikes which were meant to help the working class man have in fact hurt them. Food, Gas, and utilities under the 8 years of his Prime Ministership have risen to an all time high. To rectify this, the Trump administration will lower taxes while raising tariffs on foreign goods."
	USA_Spread_Conservatism:0 "Spread Conservatism"
	USA_Spread_Conservatism_desc:0 "Conservatism is the new Republicanism. We can progress our ideals in society while still keeping the spirit of who we are."
	USA_Appease_The_Religious_Right:0 "Appease The Religious Right"
	USA_Appease_The_Religious_Right_desc:0 "A little known man named Phillip Carol otherwise known as Carolus Rex fought for the Union State until their surrender. PM Trump sees similar people within the religious right, and believes that should worse come to shove, he will need to rely on these people."
	USA_Empowering_Local_Government:0 "Empowering Local Government"
	USA_Empowering_Local_Government_desc:0 "The central government is too strong as is and under the wrong hands, we can turn straight into tyranny."
	USA_Rebuild_Infrastructure:0 "Rebuild Infrastructure"
	USA_Rebuild_Infrastructure_desc:0 "Under the Commonwealth administration, infrastructure fell to the wayside. Roads, bridges, train tracks and more have all fallen into disrepair while local governments bicker. The Trump administration will put forth a Infrastructure bill which will sadly raise taxes but allow the government to intervene and fix dangerous areas."
	USA_Funds_To_Support_Veterans:0 "Funds To Support Weterans"
	USA_Funds_To_Support_Veterans_desc:0 "An often forgotten part of American society. Veterans make up a large portion of the Empires homeless. Under PA.1865 , parliament can allocate upwards of $1.2 billion to funding organizations which get veterans jobs, therapy, and most of all happiness."
	USA_Improve_Youth_Organizations:0 "Improve Youth Organizations"
	USA_Improve_Youth_Organizations_desc:0 "Youth Organizations such as the Imperial Scouts of America have fallen into disrepair and controversy. The is Imperial Scouts all together have let many “fans of the playground” into their organization which has created a new mental health crisis. With extra funds, the administration is seeking to change and fully rework the systems on which these organizations operate."
	USA_The_New_American_Dream:0 "The New American Dream"
	USA_The_New_American_Dream_desc:0 "With Trump in power, its time to redefine the American dream and what it truly means."
	USA_The_African_Travel_Ban:0 "The African Travel Ban"
	USA_The_African_Travel_Ban_desc:0 "With the African continent singlehandedly ensuring its instability the administration has announced a travel ban on Africa. Given the presence of terrorist groups within the Federation, Ethiopia and the United Arabian Kingdom, the administration believes that by keeping travel open, we'd be inviting terrorists into the country."
	USA_Invest_In_American_Business:0 "Invest In Amercan Business"
	USA_Invest_In_American_Business_desc:0 "With many American Businesses finally moving abroad, the administration believes that by investing in smaller and medium size businesses, the country can further our economic standing and the worlds economic reliance on America."
	USA_Lower_Taxes_On_Corporations:0 "Lower Taxes On Corporations"
	USA_Lower_Taxes_On_Corporations_desc:0 "With the success of American corporations with lower taxes, the administration is now working on lowering the corporate taxes for international companies."
	USA_Invest_In_The_American_Tech_Sector:0 "Invest In The American Tech Sector"
	USA_Invest_In_The_American_Tech_Sector_desc:0 "Todd Howard is a fine man. A damned fine man. Some say one of the best men. As a favor towards him and the technocrats of America, the administration will invest significant amounts into the American tech sector. This may lead America into a new golden age, not seen since the 1960s."
	USA_Lower_Taxes_On_The_Middle_Class:0 "Lower Taxes On The Middle Class"
	USA_Lower_Taxes_On_The_Middle_Class_desc:0 "The middle class has had it tough. Lowering taxes on them will hopefully increase the buying power of the normal American citizen."
	USA_Vilify_The_Clintons:0 "Vilify The Clintons"
	USA_Vilify_The_Clintons_desc:0 "Theres something fishy about Bill and Hillary. How do they keep obtaining funding to to run for office. They're deeply unpopular and yet they remain as top political candidates."
	USA_Reach_Out_To_The_Royal_Party:0 "Reach Out To The Royal Party"
	USA_Reach_Out_To_The_Royal_Party_desc:0 "The Royal Party stands for some of the best values of the Empire. Without the Pacific States, the American people would either be rotting under the yolk of the KKK, the Syndicalists, or even Lovecraft."
	USA_Reduce_Reliance_On_Mexico:0 "Reduce Reliance On Mexico"
	USA_Reduce_Reliance_On_Mexico_desc:0 "Mexico houses a lot of the American Industrial sector. In an effort to reduce the reliance on Mexico, the Administration will increase taxes on corporations operating in Mexico while simultaneously reducing taxes on corporations which move operations back to mainland USA."
	USA_A_New_Age_For_America:0 "A New Age For America"
	USA_A_New_Age_For_America_desc:0 "Under Trump, America will enter a new golden age. Our sovereignty will no longer be decided by the actions of the Entente or the Reichspakt. No longer will we be forced to enter ideological conflicts for favorable trade."
	USA_A_New_Faction_For_The_World:0 "A New Faction For The World"
	USA_A_New_Faction_For_The_World_desc:0 "The Cooperative Security Treaty Organization otherwise known as the CSTO alliance will become a new power in the world. Guaranteeing the independence of America and those who align with us, the world will shake."
	USA_Bastion_Against_The_Entente:0 "Bastion Against The Entente"
	USA_Bastion_Against_The_Entente_desc:0 "Since their failure to reclaim the totalist isles, the Entente has become more militaristic. They've overthrown democratically elected regimes because of the dangers that syndicalism may present and to this day they still promote globalist ideals."
	USA_Speak_Out_Against_Entente_Globalism:0 "Speak Out Against Entente Globalism"
	USA_Speak_Out_Against_Entente_Globalism_desc:0 "Globalism is a horrid ideology which the Entente still seems to promote. How can we befriend our northern neighbors if they promote such a horrid ideology."
	USA_Invite_Ireland:0 "Invite Ireland"
	USA_Invite_Ireland_desc:0 "Ireland presents a huge gateway to Europe. Neighboring the Syndicalists of Britain, and the German puppets in Scotland, Ireland joining the CSTO can put us a long way ahead in geopolitics."
	USA_Invite_Southern_Iran:0 "Invite Southern Iran"
	USA_Invite_Southern_Iran_desc:0 "Southern Iran is a blastpoint in the world. The Remnants of the Internationale cling to the North while the South is left defenseless. Inviting them can not only show the world that we'll defend dangerous places but also show the Internationale that their days are numbered."
	USA_Poach_Former_Dominions:0 "Poach Former Dominions"
	USA_Poach_Former_Dominions_desc:0 "Former Dominions of the Canadian/British Empire sit idly in the Entente sacrificing their autonomy for a day that will never come. Under the leadership of the CSTO, they will not need to sacrifice autonomy. They can pursue their own goals while contributing to the defense of others."
	USA_Bastion_Against_The_Reichspakt:0 "Bastion Against The Reichspakt"
	USA_Bastion_Against_The_Reichspakt_desc:0 "The Reichspakt for decades has been Americas main enemy. Except for a few instances where both sides helped each other, the German Empire has remained Americas main enemy. That does not need to be the case anymore, but we will not sacrifice American autonomy to the German Empire."
	USA_America_First_Trade_Deals:0 "America First Trade Deals"
	USA_America_First_Trade_Deals_desc:0 "We trade with the Reichspakt, but thanks to cowardly Bush those deals favor the German Empire and their nominal puppet states. No longer will they be allowed to take advantage of American consumers. Already renominating many deals, the trade of consumer products will become one which benefits the American peoples before lining the pockets of the German aristocracy."
	USA_Invite_The_French:0 "Invite The French"
	USA_Invite_The_French_desc:0 "Neighboring the German empire itself, the Napoleonic state can be a fortress for our cause. We'll lift sanctions and forgive the Empire for some of its crimes against the American government if it joins the CSTO. This will ensure that Germany feels our pressure."
	USA_Fortify_The_Rhine:0 "Fortify The Rhine"
	USA_Fortify_The_Rhine_desc:0 "Nicknamed the Maginot line, American contractors working for the French empire will build a line of fortresses stretching from Mulhouse to Dunkirk. If the Germans feel the need to invade, they'll have a hell of a time doing it."
	USA_A_Meeting_With_The_Kaiser:0 "A Meeting With The Kaiser"
	USA_A_Meeting_With_The_Kaiser_desc:0 "Meeting in the city of Dublin, PM Trump and the Kaiser himself will discuss the easing of tensions between our empires. This will involve prisoner exchanges, cultural exchange programs and an apology from the German Empire for the mistaken sinking of the USS Halifax during the Dumfries War."
	USA_Sovereignty_Secured:0 "Sovereignty Secured"
	USA_Sovereignty_Secured_desc:0 "With our alliance booming, our sovereignty is secured. We'll no longer need to bow to either the Entente or the Reichspakt. After decades, the Empire is equal with all others."
	USA_Bolstering_The_Empire_Economy:0 "Bolstering The Empire Economy"
	USA_Bolstering_The_Empire_Economy_desc:0 "With the CSTO alliance, our empire has a chance to really bolster our economy."
	USA_Increase_American_Exports:0 "Increase American Exports"
	USA_Increase_American_Exports_desc:0 "Working with both factions, the American government will seek to expand American Exports into every market possible."
	USA_Increase_Buying_Power:0 "Increase Buying Power"
	USA_Increase_Buying_Power_desc:0 "Lowering taxes on all American tax brackets will increase the buying power of the American peoples."
	USA_De_Regulate_Wall_Street:0 "De-Regulate Wall Street"
	USA_De_Regulate_Wall_Street_desc:0 "Under Bernie, Wall Street was heavily regulated. The Government should not intervene in the economy directly or control the wealth of those who invest."
	USA_A_Canadian_American_Pipeline:0 "A Canadian American Pipeline"
	USA_A_Canadian_American_Pipeline_desc:0 "Starting from Occupied Alaska and going down to the south of Texas. It will be the biggest oil pipeline to exist and will make sure that the American peoples are energy dependent."
	USA_Subsidize_The_Tech_Sector:0 "Subsidize The Tech Sector"
	USA_Subsidize_The_Tech_Sector_desc:0 "The Tech Sectors in every alliance nation will see huge amounts of funding from the American government. Going abroad our own sector, the Tech sectors of every other nation will soon be on par with America."
	USA_Industrialize_The_Midwest:0 "Industrialize The Midwest"
	USA_Industrialize_The_Midwest_desc:0 "Crooked Bernie let the American Midwest rot. Under Trump, the industrial parks of these states will be renovated and reinvigorated."
	USA_Pax_Americanus:0 "Pax Americanus"
	USA_Pax_Americanus_desc:0 "Such as the Pax Romana, and the aptly named Pax Germanicus after the Second Weltkrieg, the American peoples can claim ownership of Pax Americanus. A new era of peace for the world, free from a Third Weltkrieg, people can grow up without the shadow of war."
	USA_Expand_The_Empires_Of_Freedom:0 "Expand The Empires Of Freedom"
	USA_Expand_The_Empires_Of_Freedom_desc:0 "The Empire is free, and perfect. Why not expand it."
	USA_The_Greenland_Purchase:0 "The Greenland Purchase"
	USA_The_Greenland_Purchase_desc:0 "Initially proposed under PM Long after the Second Civil War, the Greenland Purchase was supposed to give America a new colony and bridge into Europe. Sadly that failed. Under PM Trump, the Danish will not be able to deny the request."
	USA_The_Haiti_Deal:0 "The Haiti Deal"
	USA_The_Haiti_Deal_desc:0 "Haiti, very briefly was under the control of an American during the Second ACW. To keep with history, the Trump Administration will seek to take on the Haitains economy. Thus making them an American protectorate."
	USA_Create_The_Guantanamo_Protectorate:0 "Create The Guantanamo Protectorate"
	USA_Create_The_Guantanamo_Protectorate_desc:0 "Cuba has been a pain in the American governments side since the end of the First Weltkrieg. Nearly falling to Syndicalism, and then nearly becoming a German protectorate, the country is too dangerous to be left independent. Under War Plan Green, the Empire would launch an invasion of the Island nation, and once conquered our new government would be centered in Guantanamo."
	USA_The_Status_Of_Puerti_Rico:0 "The Status Of Puerti Rico"
	USA_The_Status_Of_Puerti_Rico_desc:0 "Puerto Rico has remained loyal to the government for nearly a century now. PM Trump along with many progressives in Parliament seek to turn the colony into a Dominion, granting it near equal status with America. However, Democrats and many nationalistic parties want to see it either freed completely or remain a colony. The question is, who do we please?"
	USA_Obama_Administration:0 "Obama Administration"
	USA_Obama_Administration_desc:0 "The second black man to assume the prime ministership has ascended to the second highest office in the nation. The Warhawk of the Sanders administration has worried many who fear that a new era of American expansionism is coming."
	USA_Protecting_America_At_All_Costs:0 "Protecting America At All Costs"
	USA_Protecting_America_At_All_Costs_desc:0 "The Third Weltkrieg is coming, it may not be now or tomorrow, but it will come. America will not fall into tyranny like it did under the MacArthur administration. A priority since day 1 of the administration has been the protection of the Empire and its Mexican protectorate and the prevention of a Third Civil War from happening. Many will call the Prime Minister a tyrant, but in the end he is doing whats needed for the continuing safety of America."
	USA_From_The_Inside_Or_Out:0 "From The Inside Or Out"
	USA_From_The_Inside_Or_Out_desc:0 "If America is going to survive the oncoming crisis, change is needed. The Obama Administration is fostering change on the domestic level. Neighbors will be encouraged to turn those in who could be considered terrorists, dissidents or even those who could be working for the interests of other nations."
	USA_Establish_The_NSA:0 "Establish The NSA"
	USA_Establish_The_NSA_desc:0 "The attacks in New York by Beringian terrorists exposed the Empires weakness. Terrorists who were tagged by the Central Imperial Intelligence Service were able to hijack civilian planes and attack our economic center. The newly created National Security Administration or NSA for short will create a safety net for the American citizens. They'll monitor internet chatrooms, international dark web websites and many more aspects of the daily citizens life to prevent another massive attack on American soil from happening."
	USA_Sanctioning_Of_Syndicalist_Media:0 "Sanctioning Of Syndicalist Media"
	USA_Sanctioning_Of_Syndicalist_Media_desc:0 "The Syndicalist ideology is inherently anti-american. When the will of the government outweights the will of the actual workers then the government reverts into a tyrannical state of oppression. Media which espouses such ideals such as the Jacobin newspaper will now be forbidden and sanctioned in the Empire."
	USA_Expand_CIA_Jurisdictions:0 "Expand CIA Jurisdictions"
	USA_Expand_CIA_Jurisdictions_desc:0 "Initially created as a successor to the failed FBI and the old American OSS, the CIA has been the bastion against a Third American Civil War for decades now. By expanding their jurisdictions the CIA can focus on the rise in American extremism and work towards stabilizing the nation."
	USA_Continue_Bernies_Work:0 "Continue Bernies Work"
	USA_Continue_Bernies_Work_desc:0 "Prime Minister Sanders has had a lot of problems regarding his administration and sadly those problems are all that the media portray. The Obama administration will work to continue the work of the previous administration including the degrading of the states power, the continuance of the American defiance protocol, and the continuing of the Build Back Better program."
	USA_Pass_Enviromentalist_Legislation:0 "Pass Enviromentalist Legislation"
	USA_Pass_Enviromentalist_Legislation_desc:0 "After repeated failed campaigns by the Environmental Savior Party over the decades, many of its members have instead flocked to the biggest parties in the nation hoping to change the platform of them. Prime Minister Obama with the consent of Parliament has put forth several bills of environmentalist legislation aiming at lowering the Empires carbon footprint."
	USA_Midnight_Raids:0 "Midnight Raids"
	USA_Midnight_Raids_desc:0 "People like David Duke, Pastor Schoep, and more represent a major threat to the stability of the Empire. These new authorized midnight raids will show the enemies of the Empire both foreign and domestic that the nation will not bow to the alluring call of anarchy."
	USA_More_Power_To_The_Federal_Government:0 "More Power To The Federal Government"
	USA_More_Power_To_The_Federal_Government_desc:0 "While the original American constitution enshrined the delegation of powers between the states and the Federal government, the Empires has no such thing. While a delicate balance has been maintained throughout the years, the Obama administration will seek to tip the balance in favor of the federal government and parliament itself."
	USA_Praise_Normal_Citizens:0 "Praise Normal Citizens"
	USA_Praise_Normal_Citizens_desc:0 "Deviants are abound in the Empire. To curb this deviancy and their anarchistic tendencies, the Prime Minister has taken to provoke the more anarchistic and revolutionary sides of society by praising the lives of others."
	USA_Loosen_Immigration_Restrictions:0 "Loosen Immigration Restrictions"
	USA_Loosen_Immigration_Restrictions_desc:0 "The American population is declining more and more as each decade passes. By loosening the already strict restrictions on the immigration restrictions, the American populace can for once receive a population boost."
	USA_Reform_Bernie_Care:0 "Reform Bernie Care"
	USA_Reform_Bernie_Care_desc:0 "Bernie Care has been the bane of the taxpayers existence. First created as a way for the people to gain access to healthcare, then as a way to levy votes, the program is inefficient and troublesome for those in need. PM Obama has put forth a reform plan which if put into motion, can actually deliver on the promise to provide free healthcare to the communities in most need."
	USA_Fund_Green_Energy:0 "Fund Green Energy"
	USA_Fund_Green_Energy_desc:0 "As part of the Prime Ministers environmentalist legislation package, the American tax payer will soon know where their money went. It went deep into the Green Energy industry. The transition to clean renewable energy will begin soon under the administration, and soon enough, when the infrastructure is put in place, the peoples energy will be clean."
	USA_Rebuild_Midwest_Industries:0 "Rebuild Midwest Industries"
	USA_Rebuild_Midwest_Industries_desc:0 "Under the Martin Luther King administration, the midwests industry was decimated. What was once the capital of steel production has become the capital of abandoned buildings and crackheads. The Obama administration has approved federal subsidies for the rebuilding of Midwestern industries, starting with steel production."
	USA_Legalize_Cannabis:0 "Legalize Cannabis"
	USA_Legalize_Cannabis_desc:0 "Cannabis is not a horrid drug like the Christian right would like to depict it. It's a drug which has been used recreationally since the 1960s, and medicinally since the 70s. Legalizing it can alleviate the taxes which the middle and lower classes pay."
	USA_Lower_Taxes_On_The_Lower_Class:0 "Lower Taxes On The Lower Class"
	USA_Lower_Taxes_On_The_Lower_Class_desc:0 "The middle-class average American has struggled under the Sanders administration. It's syndicalist policies have raised taxes on not only the rich but raised the cost of living for the middle class. Gas, groceries, and basic commodities have been raised. Lowering taxes on the middle class and raising them on the rich will let the American people breath a sigh of financial relief."
	USA_Legalize_Gay_Marriage:0 "Legalize Gay Marriage"
	USA_Legalize_Gay_Marriage_desc:0 "While America has come a long way in terms of civil rights, one community is still underserved. The Gay Community has been begging for marriage and adoption rights since the early days of the MLK administration. PM Obama with the consent of Parliament and the Emperor will sign a bill that forces many areas to legalize the union between same sex couples."
	USA_New_Civil_Rights_Movement:0 "New Civil Rights Movement"
	USA_New_Civil_Rights_Movement_desc:0 "Legalizing gay rights is only the beginning for the American people and the underrepresented. PM Obama and his administration will create an environment in which a new Civil Rights movement, one which benefits everyone."
	USA_Promote_Healthy_Food:0 "Promote Healthy Food"
	USA_Promote_Healthy_Food_desc:0 "The American people since the early 70s have grown lazy and complacent. Promoting healthy food in the general public and schools will hopefully lower this alarmingly fast rate."
	USA_Pro_Worker_Legislation:0 "Pro Worker Legislation"
	USA_Pro_Worker_Legislation_desc:0 "One of the better ideas of the Bernie administration was the promise of legislation which would benefit the American worker. While PM Sanders somewhat delivered on this, he fell short of his goal. PM Obama and the rest of the party plan to lower costs for working class families among other plans which in the end will strengthen both the worker and the employer."
	USA_Common_Core_Standards:0 "Common Core Standards"
	USA_Common_Core_Standards_desc:0 "The American education standards ranks far behind that of the German Empire or even the Chinese. By enforcing a new common-core curriculum, the education system will see itself systemized on the federal level instead of the state level."
	USA_Expand_Internet_Access:0 "Expand Internet Access"
	USA_Expand_Internet_Access_desc:0 "Access to the internet needs to be considered a human right. When the people can get access to any book or educational source, then they are able to advance their own knowledge. The Obama administration will create a new source of internet which can be accessed from free areas like public library's, internet cafes, or even a personal device like a cell phone."
	USA_Pro_Veteran_Legislation:0 "Pro Veteran Legislation"
	USA_Pro_Veteran_Legislation_desc:0 "The homeless of America are made up of primarily veterans who could not adapt to life back home. The Obama administration is looking to not only rehabilitate these men and women on the streets but make sure that no more end up in their spot."
	USA_Improve_Military_Standards:0 "Improve Military Standards"
	USA_Improve_Military_Standards_desc:0 "The military standards of the American military are disastrously low. If the Germans, or the Fourth Internationale were able to surprise the American military then the country would be doomed. The training, arming, and deployment standards will be heightened to prepare for the eventual oncoming attack."
	USA_Create_The_Space_Force:0 "Create The Space Force"
	USA_Create_The_Space_Force_desc:0 "Space, the final frontier. The show “Star Trek” has exposed how the American government is underprepared for any conflict with other terrestrial forces or god forbid aliens. The Space Force will create a new branch of the military focusing on both space and satellite defence."
	USA_Sideline_The_Electoral_College:0 "Sideline The Electoral College"
	USA_Sideline_The_Electoral_College_desc:0 "While the reforms put forth by the Sanders and Obama administration have not been popular with the blue grass worker or the white collar business owner, the American peoples need these reforms to continue prospering."
	USA_Better_Black_Lives:0 "Better Black Lives"
	USA_Better_Black_Lives_desc:0 "The black minority in America consistently stays below the poverty line. While the fair society program put forth by the PM Martin Luther King is one thing, the community has continued to struggle. PM Obama will expand the Fair Society program and make sure that the community or at least part of it raises itself above the poverty line."
	USA_Encourage_Minority_Votes:0 "Encourage Minority Votes"
	USA_Encourage_Minority_Votes_desc:0 "Minority voters are the group which turns out the least in elections. By encouraging voters, hopefully the party will be able to maintain its majority."
	USA_Expanding_The_Obama_Doctrine:0 "Expanding The Obama Doctrine"
	USA_Expanding_The_Obama_Doctrine_desc:0 "The Obama Doctrine is one of war. Interventionist policies will see the American military intervene in conflicts which could tip the geopolitical balance. No longer will the American peoples wait for the conflict to grow out of proportion, and no longer will they watch as their geopolitical allies fall to either the German huns, or the alluring ideology of syndicalism. The Obama Doctrine will remake this world in the way of the West."
	USA_Iran_Theater:0 "Iran Theater"
	USA_Iran_Theater_desc:0 "Iran has been split between a western style democracy and a remnant of the Third Internationale. In the one of the first expansions of the Obama Doctrine, the American people will put an end to the decades long civil war, and Iran will be a free democracy."
	USA_Supply_The_Democratic_Republic:0 "Supply The Democratic Republic"
	USA_Supply_The_Democratic_Republic_desc:0 "Instead of directly intervening in the oncoming conflict. The American government will make it a point to supply the democratic south with new and better weapons."
	USA_send_Military_advisors2:0 "Send Military Advisors"
	USA_send_Military_advisors2_desc:0 "While weapons are fine and all, the democratic south will need to see its military drastically overhauled. To do this, the American government will send military advisors to the Iranian military."
	USA_Sell_Equipment_To_The_Republic:0 "Sell Equipment To The Republic"
	USA_Sell_Equipment_To_The_Republic_desc:0 "Along with weapons, the American government will be sending new vehicles and air superiority equipment to the Iranians..for a price of course."
	USA_Assassinate_Syndicalist_Leadership:0 "Assassinate Syndicalist Leadership"
	USA_Assassinate_Syndicalist_Leadership_desc:0 "In conjunction with helping the Iranian military prepare for its invasion, the American government has authorized drone strikes on several key generals and politicians associated with the higher echelons of Syndicalist leadership."
	USA_Sabotage_Syndicalist_Infrastructure:0 "Sabotage Syndicalist Infrastructure"
	USA_Sabotage_Syndicalist_Infrastructure_desc:0 "In the final bid to help the Iranian peoples free themselves from the tyranny of syndicalism, the American military has authorized the bombing of several strategic sites in the Syndicalist land."
	USA_Direct_Intervention:0 "Direct Intervention"
	USA_Direct_Intervention_desc:0 "The fastest way to end this stalemate is to directly intervene in the conflict. Taking temporary control of the Southern Democratic army, the American government will engage in training the south, subterfuge in the north, and eventually a full blown invasion of the Northern Syndicalist Republic."
	USA_Send_Dissidents_Across_The_Border:0 "Send Dissidents Across The Border"
	USA_Send_Dissidents_Across_The_Border_desc:0 "Prisons in the south are full of Islamic extremists and dissidents. Sending them across the Iranian DMZ will distract the Peoples Revolutionary army and allow the Southern democrats to greatly expand their military operations."
	USA_Train_The_Iranian_Military:0 "Train The Iranian Military"
	USA_Train_The_Iranian_Military_desc:0 "Segments of the Iranian military will be trained in Virginia. Much of their equipment pre-dates the Second Weltkrieg, and their training regiment is much the same. Training them will see both their doctrinal practices upgraded but also the equipment that they use."
	USA_Build_New_Airbases:0 "Build New Airbases"
	USA_Build_New_Airbases_desc:0 "New Airbases will be built all over Southern Iran so when Operation Ajax commences, our combined airforces will be able to efficiently strike the Syndicalists."
	USA_Supply_The_Aranian_Airforce:0 "Supply The Aranian Airforce"
	USA_Supply_The_Aranian_Airforce_desc:0 "Keeping the Iranian airforce in the air will be a major priority when the invasion inevitably begins."
	USA_Operation_Ajax:0 "Operation Ajax"
	USA_Operation_Ajax_desc:0 "Three phases over the less than a month will see the Syndicalist Republic of Iran destroyed and a pillar of the past destroyed. Phase 1 will see the destruction of all border forts, military bases, and anti-air systems by land forces loyal to the Democratic Republic and the Empire. Phase two will see air wings from both governments take out key parts of the syndicalist infrastructure, including roads, bridges, highways, electrical plants and water piping. Phase Three will see a combined taskforce enter the city of Tehran destroying the upper leadership. From there the rest of the government is expected to fall"
	USA_Blitz_For_Tehran:0 "Blitz For Tehran"
	USA_Blitz_For_Tehran_desc:0 "Phase 1 and 2 are complete. A combined Task Force of both Imperial and Democratic forces will take the capital of the syndicalist republic. From there, it is expected that syndicalist forces still loyal to the workers republic will either go to ground and form an insurgency, outright surrender, or continue the fight."
	USA_Drop_Propaganda_Leaflets:0 "Drop Propaganda Leaflets"
	USA_Drop_Propaganda_Leaflets_desc:0 "With Tehran taken, the Air Force will drop propaganda leaflets over still syndicalist areas in hope of either demoralizing the enemy further or causing them an outright surrender."
	USA_Drone_Strike_Syndicalist_Infrastructure:0 "Drone Strike Syndicalist Infrastructure"
	USA_Drone_Strike_Syndicalist_Infrastructure_desc:0 "Syndicalist Infrastructure remains a threat to the safety of our troops. When the invasion begins, the American soldiers will need to take syndicalist troops by surprise. To do this, all forms of infrastructure excluding roads will be hit."
	USA_Take_Out_Key_Generals:0 "Take Out Key Generals"
	USA_Take_Out_Key_Generals_desc:0 "Upper leadership in the Syndicalist leadership may be able to change the tide of war by instructing loyal units and setting up alternative communication methods during the conflict. With the Invasion nearing then it is up to the covert aspects of government agencies to assassinate major generals."
	USA_Strike_Their_Oil_Refineries:0 "Strike Their Oil Refineries"
	USA_Strike_Their_Oil_Refineries_desc:0 "Destroying their oil refineries will put the syndicalist response to a pure halt."
	USA_Take_Down_Their_Electrial_Grid:0 "Take Down Their Electrial Grid"
	USA_Take_Down_Their_Electrial_Grid_desc:0 "The electrical grid of the syndicalist republic is focused in three major areas. In one simultaneous swoop, the syndicalist military will be blinded."
	USA_The_Problem_Of_Central_America:0 "The Problem Of Central America"
	USA_The_Problem_Of_Central_America_desc:0 "“The Bastion of the Real American Government” has been a problem for San Francisco since the end of the Second American Civil War. With the Warhawk Obama in office, it seems that this rogue regime will finally be dealt with."
	USA_Break_It_Apart:0 "Break It Apart"
	USA_Break_It_Apart_desc:0 "The false idol that is James Comey has decided to invade the Mexican protectorate. While we are not fully obligated to aid the Mexicans in their border conflict, we will use this opportunity to do so. When defeated. James Comey will see his empire torn limb from limb."
	USA_Take_Advantage_Of_The_Chaos:0 "Take Advantage Of The Chaos"
	USA_Take_Advantage_Of_The_Chaos_desc:0 "President James Comey is anything but a strategist in the eyes of the world. His “Special operation” against the regimes in Colombia and Venezuela has left his northern border open to an American invasion."
	USA_Promise_Liberation:0 "Promise Liberation"
	USA_Promise_Liberation_desc:0 "As we pass through Belize and Guatemala, we gain followers to our side by promising the liberation of all..not the oppression of their old regime."
	USA_Drone_Strikes_On_New_Washington:0 "Drone Strikes On New Washington"
	USA_Drone_Strikes_On_New_Washington_desc:0 "The bastardization of American history in the city of “New Washington” is a crime against the history on which the Empire was founded. We will destroy the foundations on which this city bastardizes history and build it anew."
	USA_Taking_Panama:0 "Taking Panama"
	USA_Taking_Panama_desc:0 "Panama will remain the last holdout of FBI forces. In a final push, the war will end when we overrun the canal. "
	USA_The_Trial_Of_James_Comey:0 "The Trial Of James Comey"
	USA_The_Trial_Of_James_Comey_desc:0 "With the surrender of the USCA regime and their leader President James Comey, the American peoples will witness the trial of one of the worst abusers of Human rights in history."
	USA_Take_Control_Of_The_Canal:0 "Take Control Of The Canal"
	USA_Take_Control_Of_The_Canal_desc:0 "With the USCA under provisional military control, the Panana canal will come under the control of the American government once again."
	USA_Pacify_The_Rebels:0 "Pacify The Rebels"
	USA_Pacify_The_Rebels_desc:0 "Not all have accepted our liberation. Many including Pablo Escobars rebel group still claim to fight for the real liberation. It's time to pacify the rebels of these lands and bring them under a firm hand once and for all."
	USA_Seize_Drug_Stores:0 "Seize Drug Stores"
	USA_Seize_Drug_Stores_desc:0 "The drug stores which the FBI used to generate revenue will now become the property of the Imperial Drug Enforcement agency and instead of being used in illegal sales, they shall be used in the process of breaking up cartels."
	USA_Arrest_FBI_Members:0 "Arrest FBI Members"
	USA_Arrest_FBI_Members_desc:0 "With many FBI members still out there, a massive effort will be put together so they like their leader can answer for their many historic and horrific crimes."
	USA_Hunt_For_Escobar:0 "Hunt For Escobar"
	USA_Hunt_For_Escobar_desc:0 "Pablo Escobar, while useful in the invasion has become a nuisance at best. The American/Mexican occupation force will focus their efforts towards the eventual arrest or assassination of Pablo Escobar."
	USA_Re_Establish_Local_Policing:0 "Re-Establish Local Policing"
	USA_Re_Establish_Local_Policing_desc:0 "With the occupation proceeding swimmingly, the military can focus more of their efforts on domestic stability operations while local police forces will be able to enforce occupation policies on a smaller level."
	USA_Set_Up_A_New_Duchy:0 "Set Up A New Duchy"
	USA_Set_Up_A_New_Duchy_desc:0 "The Imperial Government has announced that to keep the Central American government afloat, they will make it into a colonial dominion with a duchy status. This will not reflect the colonialism of the past centuries but instead actually uplift the local governments."
	USA_Set_Up_A_Provisional_Government:0 "Set Up A Provisional Government"
	USA_Set_Up_A_Provisional_Government_desc:0 "Keeping true to our promise, the American government will pull out of the Central American region leaving it to its own devices. Although before then, politicians will help establish a fair union in which the Central American Government will be able to keep itself afloat."
	USA_Welcome_To_North_Africa:0 "Welcome To North Africa"
	USA_Welcome_To_North_Africa_desc:0 "Literally the last bastion of Hooverism, the United States Enclave otherwise known as the “The United States of America in Liberia” is the last home to slavery in the world. The Grandson of Herbert Hoover III rules the land with an iron fist. When we come marching, they'll all topple like dominoes."
	USA_They_Have_WMDS:0 "They Have WMDS"
	USA_They_Have_WMDS_desc:0 "To justify such a war, the American government will announce that our intelligence agencies have found evidence of nuclear weapons present within the borders of this rogue state."
	USA_Strike_Quick_Win_Fast:0 "Strike Quick,Win Fast"
	USA_Strike_Quick_Win_Fast_desc:0 "To win this war in the eyes of the American people we will need to strike the enemy and win fast. A prolonged war will not win any favors."
	USA_Secure_The_Coast:0 "Secure The Coast"
	USA_Secure_The_Coast_desc:0 "With the war off to a great start, its time to focus on the logistical side of things. Securing portions of the coastal regions will let us resupply our soldiers and deploy more."
	USA_Bomb_The_Congress:0 "Bomb The Congress"
	USA_Bomb_The_Congress_desc:0 "President Hoover III has called an emergency session of the Enclave congress. This fool has doomed his compatriots."
	USA_Move_To_Secure_The_Ruins:0 "Move To Secure The Ruins"
	USA_Move_To_Secure_The_Ruins_desc:0 "With much of the Enclave leadership taken out, the job of the military is to now secure the ruins of the US Enclave."
	USA_Capture_Hoover:0 "Capture Hoover"
	USA_Capture_Hoover_desc:0 "Like James Comey, Herbert Hoover III is on a list of most wanted for crimes against humanity. When his final outpost is taken, the wannabe dictator will be transported to the Hauge where he will be tried for his many many many crimes."
	USA_Reclaim_Our_Old_Colony:0 "Reclaim Our Old Colony"
	USA_Reclaim_Our_Old_Colony_desc:0 "Like James Comey, Herbert Hoover III is on a list of most wanted for crimes against humanity. When his final outpost is taken, the wannabe dictator will be transported to the Hauge where he will be tried for his many many many crimes." 
	USA_Promote_A_New_American_Dream:0 "Promote A New American Dream"
	USA_Promote_A_New_American_Dream_desc:0 "With Africa liberated from the tyranny of Hooverism, the American government has taken to promoting the American dream in Africa. If they adopt it, the american dream will prove to be a success."
	USA_Sow_The_Seeds_Of_Discord:0 "Sow The Seeds Of Discord"
	USA_Sow_The_Seeds_Of_Discord_desc:0 "Instead of an outright invasion, the American government will embolden the many ethnic rebel groups in the USNA."
	USA_Assassinate_The_Last_Hoover:0 "Assassinate The Last Hoover"
	USA_Assassinate_The_Last_Hoover_desc:0 "The group known as “Children of Garvey” have contacted the CIA with a plan to assassinate Herbert Hoover III as he gives his annual state of the Union speech. We of course will help this group take out the madman."
	USA_Send_Weapons_To_The_Rebels:0 "Send Weapons To The Rebels"
	USA_Send_Weapons_To_The_Rebels_desc:0 "The American industry will partially reorient the military industrial complex towards the supplying of rebels groups world wide compared to the supplying of our own peoples."
	USA_Train_Pilots:0 "Train Pilots"
	USA_Train_Pilots_desc:0 "The rebels will soon be able to launch aerial attacks against the dwindling USNA military. Pilots for liberation groups have been housed at the air force academy and when returned, they will RAIN HELL DOWN UPON THE FAKE AMERICANS."
	USA_Drone_Strike_The_Airport:0 "Drone Strike The Airport"
	USA_Drone_Strike_The_Airport_desc:0 "Many in the upper USNA leadership see where the war is going and are working to save themselves. While its inevitable that some will escape to friendly regimes, we will not make it easy."
	USA_Call_For_Dissolvement:0 "Call For Dissolvement"
	USA_Call_For_Dissolvement_desc:0 "The idea of a united Africa is a pipedream at best. To prevent further conflict. the USNA will be allowed to peacefully dissolve along its own borders."
	USA_Eliminating_The_Russian_Threat:0 "Eliminating The Russian Threat"
	USA_Eliminating_The_Russian_Threat_desc:0 "ITS ALWAYS THE GODDAMN RUSSIANS!"
	USA_Contact_RIM:0 "Contact RIM"
	USA_Contact_RIM_desc:0 "The Russian Imperialist Movement is the ideal group which we can use to overthrow the Russian Monarcho-Bolshevist regime."
	USA_Arranging_A_Conference_With_Others:0 "Arranging A Conference With Others"
	USA_Arranging_A_Conference_With_Others_desc:0 "Given the proximity of Attu Island to Russia, the CIA will set up a secret conference on the island where we can start to build a report with rebel groups."
	USA_Contacting_Dissatisfied_Generals:0 "Contacting Dissatisfied Generals"
	USA_Contacting_Dissatisfied_Generals_desc:0 "Many within the Mladrossi regimes military are beyond pissed off with the current way of things. Once Russia was a powerhouse, but now it is nothing more than a relic stuck in the past."
	USA_Cease_Mldarossi_Relations:0 "Cease Mldarossi Relations"
	USA_Cease_Mldarossi_Relations_desc:0 "As of today, the American government will close the Russian Embassy in San Francisco demanding the immediate return of the ambassador and their family to Russia."
	USA_Promote_Anti_Russian_Sentiment:0 "Promote Anti-Russian Sentiment"
	USA_Promote_Anti_Russian_Sentiment_desc:0 "To get the American people ready to support the overthrow of the Russian regime, the American government has ordered media companies along with social media companies to start promoting anti-russian sentiments."
	USA_Reopen_Radio_Free_Europe:0 "Reopen Radio Free Europe"
	USA_Reopen_Radio_Free_Europe_desc:0 "Radio Free Europe was closed down in 1984 near the end of the cold war with the Germans. However with the possibility of overthrowing Russias government, the Americans and Germans will both reopen the radio service and focus their broadcasting efforts towards the Russians."
	USA_Cease_Russian_Oil_Trades:0 "Cease Russian Oil Trades"
	USA_Cease_Russian_Oil_Trades_desc:0 "One of the worst policy ideas was accepting the importing of Russian oil into the Empire. Stopping this will not only cripple the Russian economy but also give support for domestic oil production."
	USA_Embargo_Russia:0 "Embargo Russia"
	USA_Embargo_Russia_desc:0 "The full embargo of Russia will be enacted by every western nation. The Russian government will see itself collapse in a matter of days."
	USA_Radicalize_Russian_Youth:0 "Radicalize Russian Youth"
	USA_Radicalize_Russian_Youth_desc:0 "Using radio and tv messaging Radio Free Europe will refocus its efforts on radicalizing Russian youth and turning them into terrorists against the regime."
	USA_Denounce_The_Current_Russian_Regime:0 "Denounce The Current Russian Regime"
	USA_Denounce_The_Current_Russian_Regime_desc:0 "The current Russian Regime is a relic of the past which commits human rights abuses in the name of the “revolution”. Denouncing them before the International community will have such a detrimental impact on the regime."
	USA_Replace_Russian_Products:0 "Replace Russian Products"
	USA_Replace_Russian_Products_desc:0 "Fuck Russia, all my freedom loving friends hate Russia."
	USA_Ruin_The_Russian_Image:0 "Ruin The Russian Image"
	USA_Ruin_The_Russian_Image_desc:0 "In the first step towards revolution, groups of rebels will be allowed to start riots and assassinate Russian local leaders with imported American weapons."
	USA_Encourage_Political_Violence:0 "Encourage Political Violence"
	USA_Encourage_Political_Violence_desc:0 "With riots in the streets, the Chairman of the Peoples Tsardom has called for an emergency meeting with members of the party. When this occurs, they will find themselves dead at the hands of their country men."
	USA_Assassinate_Russian_Politicians:0 "Assassinate Russian Politicians"
	USA_Assassinate_Russian_Politicians_desc:0 "With riots in the streets, the Chairman of the Peoples Tsardom has called for an emergency meeting with members of the party. When this occurs, they will find themselves dead at the hands of their country men."
	USA_Its_Time:0 "Its Time"
	USA_Its_Time_desc:0 "It's Time."
	USA_Ship_Weapons_To_Rebels:0 "Ship Weapons To Rebels"
	USA_Ship_Weapons_To_Rebels_desc:0 "Rebel groups in the Russian country side will be sent coordinates for new high tech weapons."
	USA_Stoke_New_Riots:0 "Stoke New Riots"
	USA_Stoke_New_Riots_desc:0 "While the Russians are not strangers to riots, the new program started by the CIA will see every single major Russian city flooded with rioters. This will overwhelm the resources of their secret police and only help to stoke the eventual revolution."
	USA_Sabotage_Russian_Infrastructure:0 "Sabotage Russian Infrastructure"
	USA_Sabotage_Russian_Infrastructure_desc:0 "Using high altitude strikes, the Russian government will have its infrastructure fail overnight."
	USA_Sabotage_Russian_Nuclear_Plants:0 "Sabotage Russian Nuclear Plants"
	USA_Sabotage_Russian_Nuclear_Plants_desc:0 "In a bid to escalate the crisis, Russian rebels present within major nuclear centers will cause major malfunctions across the board."
	USA_Another_Revolution_In_Russia:0 "Another Revolution In Russia"
	USA_Another_Revolution_In_Russia_desc:0 "Another day, another revolution in Russia. What else is new?"
	USA_Backstab_The_Imperials:0 "Backstab The Imperials"
	USA_Backstab_The_Imperials_desc:0 "With Russian democrats rebelling, the American government will turn its back on the Russian Imperials."
	USA_Pass_The_New_Russia_Act:0 "Pass The New Russia Act"
	USA_Pass_The_New_Russia_Act_desc:0 "The “New Russia Act” is a comprehensive aid package centered towards the Russian Democratic Rebels. This will include weapons, training, vehicles, medical aid, and temporary relocation of civilians."
	USA_Ally_The_New_Russia:0 "Ally The New Russia"
	USA_Ally_The_New_Russia_desc:0 "With the Russian Federation created, and the power of the Tsar/Tsarina heavily scaled back, the American government is ready to ally the new Russia and welcome them into the modern world."
	USA_the_modern_jacobite:0 "The Modern Jacobite"
	USA_the_modern_jacobite_desc:0 "It appears Pence has won the election, and with every prime minister we have a new theme. Pence's is "the Modern Jacobite." A popular theme among the conservative leaning followers of him that he may input every reform and change that they wish fore. But it depends on if he will fufill them while keeping the opposition in check."
	USA_an_era_of_christian_republicanism:0 "An Era of Christian Republicanism"
	USA_an_era_of_christian_republicanism_desc:0 "Two things that are the face of our great nation isamong us, christianity and democracy. A mix of the two has been seen many times before, but were doing it the Pence way. So to improve our nation while keeping democracy and christianity integrated and popular, we shall let god guide us and freedom allow us to follow his guide."
	USA_erode_the_seperation_policy:0 "Erode the Seperation Policy"
	USA_erode_the_seperation_policy_desc:0 "To protect the religions of the world and of America, we should end the seperation policy one bit a time. Diversity is what makes America, well, America! So lets put more work into keeping our diverse religions and beleifs within America, and keep them thriving."
	USA_undoing_the_berlin_conference:0 "Undoing the Berlin Conference"
	USA_undoing_the_berlin_conference_desc:0 "The Berlin Conferences effects seem to have outlived everything they once stood for, and now Pence sees them as a "anchor on the American ship" as he said. So the point is clear, lets reverse this treaty."
	USA_expand_christian_holidays:0 "Expand Christian Holidays"
	USA_expand_christian_holidays_desc:0 "Holidays are amazing, I mean, what could be bad with them? Holidays give days off to the workers which keep them happy, they represent usually a religious topic which keeps the religious happy, they're great! So, lets expand christian related holidays in America and make the major events of the bible overlooked no longer."
	USA_keep_homosexuality_criminalized:0 "Keep Homosexuality Criminalized"
	USA_keep_homosexuality_criminalized_desc:0 "In the words of Pence himself; "Homosexuality is a disease from the devil. We must eradicate it." These words really explain all going on in the minds of Pence and his followers, and it seems like a good time to keep this criminalized so the "Devils Disease" doesn't spread."
	USA_meet_with_herr_kaiser:0 "Meet With Herr Kaiser"
	USA_meet_with_herr_kaiser_desc:0 "It seems like a good idea to have a meet up with the Kaiser of Germany, being close to us in the fight against the Totalist and Syndicalist threat, we should improve relations with the Kaiserreich."
	USA_remove_title_ix_policies:0 "Remove Title IX Policies"
	USA_remove_title_ix_policies_desc:0 "God created every man and woman equally. America bases itself on freedom and equality. Now, this has always been the case, but its horrible to see that men are favored more in many jobs, leaving women unemployed. And though they used to work at home rather than work a job, it is no longer the 19th century. So we must stomp on discrimination, and make sure everybody is equal in all aspects of life, as its disgusting that we haven't done this already before."
	USA_more_funds_for_christian_states:0 "More Funds for Christian States"
	USA_more_funds_for_christian_states_desc:0 "Now while it is ok to follow your own faith, we still have a bias. The prominently christian states with laws, politicians, and demographics following god should get more funding so the others can see who god really supports here."
	USA_promote_christian_morals:0 "Promote Christian Morals"
	USA_promote_christian_morals_desc:0 "Christian morals really do something within people. They will do the right actions and follow these morals in the name of god, and we should help spread the morals of christianity so others can do good in the name of god."
	USA_begin_television_campaigns:0 "Begin in Television Campaigns"
	USA_begin_television_campaigns_desc:0 "In our attempt to spread christianity we should begin television propaganda, cartoons, and adds to spread christs word. This country cannot live without christ, and if these cartoons are broadcast to children maybe we can indocrinate them to christianity."
	USA_televised_church_services:0 "Televised Church Services"
	USA_televised_church_services_desc:0 "Now that we have set up our christian TV programs, lets spread them to the churches as an easier way to make the priests and pastors spread christ across the people of America in a fun and entertaining way."
	USA_ready_the_fight:0 "Ready the Fight"
	USA_ready_the_fight_desc:0 "In the fight against progressivism, we should ready the fight, ready the people, the army, the internet, everything! And finally destroy the liberal cause!"
	USA_erode_liberalism:0 "Erode Liberalism"
	USA_erode_liberalism_desc:0 "Now, Liberalism is a big thing we shouldve exterminated before it spread, but we are far beyond that now. We must erode liberalism slowely so over time it disinegrates and eventually dissapears like a rock in a river."
 USA_Reform_The_CIA:0 "Reform The CIA"
 USA_Reform_The_CIA_desc:0 "In response to recent legislative findings and public demand, a sweeping reform of the Central Intelligence Agency is underway. This initiative aims to redefine the CIA's operations to ensure greater transparency, accountability, and respect for civil liberties. New legislation will set clear operational boundaries, backed by stringent oversight mechanisms. The agency will undergo significant training enhancements to focus on ethical conduct and legal compliance. Additionally, a push towards advanced, privacy-respecting technologies will ensure the CIA remains effective while honoring democratic values. These reforms are crucial for restoring trust and aligning the agency with contemporary standards of governance."
 USA_The_Heir_To_Long:0 "The Heir To Long"
 USA_The_Heir_To_Long_desc:0 "Donald Trump's election, running on a deeply populist platform, has reverberated around the world, stirring a mix of apprehension and scrutiny. This pivotal victory is viewed by many, particularly in left-leaning democracies, as a potential shift towards a more authoritarian regime under the guise of populism. Trump's bold and often contentious rhetoric, combined with his promises to drastically reshape government policies, has both his supporters hailing a new era and critics wary of the implications for democratic norms and international relations."
 USA_Secure_The_Capitol:0 "Secure The Capitol"
 USA_Secure_The_Capitol_desc:0 "As preparations for the inauguration of Prime Minister Donald Trump are underway in San Francisco, security measures have been significantly heightened. The Capitol police, alongside the California National Guard, have been deployed to ensure the safety of the attendees and maintain order during this pivotal national event. Despite these precautions being framed as necessary, Trump's opponents view this extensive military presence as an ominous sign, suggesting it might be the first step towards an authoritarian regime."
 USA_Fix_The_Mistakes_Of_The_Bernie_Era:0 "Fix The Mistakes Of The Bernie Era"
 USA_Fix_The_Mistakes_Of_The_Bernie_Era_desc:0 "In his inauguration speech, Prime Minister Donald Trump sharply criticizes the previous administration, accusing Bernie Sanders of betraying his principles and leaving a legacy of economic and geopolitical missteps. Trump pledges to rectify these so-called "mistakes" with a robust agenda aimed at revitalizing the American economy through widespread deregulation. He also commits to withdrawing American forces from costly foreign engagements and addressing industrial decline, proposing bold measures to bring back industries that have moved overseas."
 USA_The_Jones_Committee:0 "The Jones Committee"
 USA_The_Jones_Committee_desc:0 "Minister of Defense, Alex Jones, will lead a Parliamentary investigation into the abuse of power by Government agencies like the CIA or the ever elusive Delta Green. This will most likely end with significant government reform."
 USA_Find_Parliamentary_Allies:0 "Find The Parliamentary Allies"
 USA_Find_Parliamentary_Allies_desc:0 "The CIA and Delta Green are powerful enemies which can stop an investigation before it truly begins. Mister Jones is seeking allies from across the political isle. Of Course key concessions will have to come out of this."
 USA_The_Committee_Assembles:0 "The Committee Assembles"
 USA_The_Committee_Assembles_desc:0 "Televised in front of the American peoples, the Jones Commitee will broadcast their findings in front of millions and hear the testimony of those effected by the CIA and the lesser known Delta Green."
 USA_Bob_Lazar_Testimony:0 "Bob Lazar Testimony"
 USA_Bob_Lazar_Testimony_desc:0 "The man who exposed Delta Green to the public and exposed Area 51, Bob Lazar will testify in front of the nation about the existence of alien technology being kept from the public. Lazar will publicly confirm the existence of the craft which crashed in New England during the Second ACW."
 USA_Look_Into_The_MLK_Assassination:0 "Look Into The MLK Assassination"
 USA_Look_Into_The_MLK_Assassination_desc:0 "As the Jones Committee delves deeper into historical and ongoing governmental misconduct, a new focus emerges - re-examining the assassination of Dr. Martin Luther King Jr. This investigation aims to uncover any potential government involvement or mishandling in the case that has long been a source of speculation and controversy. The committee will review old evidence, re-interview key witnesses, and explore declassified documents that could shed new light on the circumstances surrounding Dr. King's assassination."
 USA_Interrogate_The_CIA_Director:0 "Interrogate The CIA Director"
 USA_Interrogate_The_CIA_Director_desc:0 "Former CIA Director Gina Haspell who has held the position since 2008 will be made to answer for her many actions during her reign."
 USA_Expose_The_Actual_Treaties:0 "Explose The Actual Treaties"
 USA_Expose_The_Actual_Treaties_desc:0 "While New England joined the Empire under the Treaty of Buffalo, there were some clauses hidden from the American public. These clauses allowed Delta Green to operate outside of the Government and without consequence. Those who were effected by the terrorism of Delta Green are now able to speak about with the protection of the federal government."
 USA_Investigations_Into_ATF_Overreach:0 "Investigations Into ATF Overreach"
 USA_Investigations_Into_ATF_Overreach_desc:0 "The Jones Committee continues its rigorous examination of federal agencies with a targeted investigation into the Bureau of Alcohol, Tobacco, Firearms, and Explosives (ATF). This focus will specifically unravel the events and decisions documented in the previously classified Ruby Ridge Dossier. The dossier contains detailed accounts of the ATF's operations and tactics, which have been criticized for excessive force and violations of civil liberties, most notably during the Ruby Ridge standoff. By bringing these classified documents to light, the committee aims to expose any systemic issues within the ATF that led to overreach and ensure such actions are addressed and rectified. This investigation not only seeks to hold the ATF accountable but also to restore public confidence in federal law enforcement agencies' commitment to upholding the law and respecting citizen rights."
 USA_Phase_Two:0 "Phase Two"
 USA_Phase_Two_desc:0 "With The Committees several findings made public, Now begins the time for action. Delta Green has been exposed and the public has lost all trust in the CIA."
 USA_Reform_The_CIA:0 "Reform The CIA"
 USA_Reform_The_CIA_desc:0 "In response to the sweeping revelations and public outcry following the investigations by the Jones Committee, a comprehensive reform of the Central Intelligence Agency (CIA) is initiated. This reform aims to overhaul the agency's operational guidelines, ensuring they align with constitutional principles and enhanced oversight. New policies will be implemented to limit the scope of the CIA's surveillance and operational powers within the bounds of strict legal frameworks. The agency will also see the introduction of a more transparent reporting system to Congress and the public, aiming to foster a culture of accountability. Additionally, the reform will emphasize the importance of ethical intelligence gathering and the protection of civil liberties, with the goal of rebuilding public trust and ensuring the CIA's actions are always in the nation's best interest."
 USA_Curb_Jurisdictional_Powers:0 "Curb Jurisdictional Powers"
 USA_Curb_Jurisdictional_Powers_desc:0 "In the wake of damning disclosures by the Jones Committee, the government moves swiftly to curb the expansive jurisdictional powers that have allowed agencies like Delta Green and the CIA to operate with minimal oversight."
 USA_Politcally_Neutral_Directors:0 "Politcally Neutral Directors"
 USA_Politcally_Neutral_Directors_desc:0 "To ensure that national security and intelligence agencies operate with impartiality and integrity, new legislation mandates the appointment of politically neutral directors. These leaders will be selected based on their professional qualifications and commitment to legal and ethical standards, rather than their political affiliations. A bipartisan committee will rigorously vet candidates to guarantee that their leadership will be free from political influence, prioritizing national security interests and adherence to the Constitution. This initiative is a key step in restoring public trust and ensuring that agency actions are conducted responsibly and transparently."
 USA_Answer_To_Parliament:0 "Answer To Parliament"
 USA_Answer_To_Parliament_desc:0 "To prevent overreach and enhance accountability within the CIA, new regulations require that the agency's upper leadership be directly answerable to parliamentary oversight boards. These boards, composed of members from multiple political parties, will have the authority to review, question, and oversee all major decisions and operations undertaken by the CIA. Regular hearings will be conducted to assess the agency's compliance with legal mandates and ethical guidelines, ensuring that its actions remain in line with national interests and civil liberties. "
 USA_Reform_Classification_Procedures:0 "Reform Classification Procedures"
 USA_Reform_Classification_Procedures_desc:0 "To address longstanding concerns about the over-classification of government documents and the consequent lack of transparency, new measures are being implemented to overhaul how sensitive information is classified and handled. The reform of classification procedures will focus on reducing unnecessary secrecy, promoting greater access to information for both Congress and the public, and enhancing the overall accountability of the intelligence community. These updated procedures will establish clearer criteria for what constitutes classified information, implement regular reviews to declassify documents where possible, and introduce harsher penalties for improper classification that serves to conceal misconduct or errors. This reform is essential for maintaining an informed public and ensuring that government actions remain subject to scrutiny."
 USA_Military_Operational_Supremacy:0 "Military Operational Supremacy"
 USA_Military_Operational_Supremacy_desc:0 "To maintain and enhance national security, a strategic initiative is underway to ensure that the military achieves operational supremacy. This involves modernizing the armed forces through advanced training programs, upgrading equipment, and integrating cutting-edge technology into defense strategies. Investments are being channeled into research and development of new defense systems and strengthening cyber warfare capabilities to protect against emerging threats."
 USA_Phase_Three:0 "Phase Three"
 USA_Phase_Three_desc:0 "Phase Three marks a critical point in ongoing efforts to consolidate and build upon the reforms initiated in previous phases. This stage focuses on implementing the necessary policies to ensure long-term sustainability and effectiveness of the changes made in intelligence and defense operations. It includes further legislative actions to cement the oversight mechanisms, refine the roles of intelligence agencies, and solidify the guidelines for military engagement."
 USA_Delta_Green_Downfall:0 "Delta Green Downfall"
 USA_Delta_Green_Downfall_desc:0 "With the CIA reformed and much of its old guard dealt with, Minister Jones looks to the  threat of Delta Green. Unlike the CIA, it appears as if the organization will not go peacefully into the night. With the permission of the Emperor and Prime Minister Trump, Martial Law has been declared in parts of New England. Soon enough, Delta Green will  suffer a violent demise."
 USA_Shut_Down_The_Boston_Locations:0 "Shut Down The Boston Locations"
 USA_Shut_Down_The_Boston_Locations_desc:0 "In a coordinated strike designed to cripple the remnants of Delta Green, an elite task force comprising American Navy Seals, the Massachusetts National Guard, and Boston Police will conduct a series of targeted raids across Boston. These operations are focused on key strategic locations believed to be critical to Delta Green's infrastructure and operations within the city. The raids will target four primary sites - Site 045 located beneath the historic Old North Church, Site 002 nestled underneath Quincy Market, Site 021 sprawling under much of the Bunker Hill neighborhood, and Site 100, a vast complex that dominates much of Boston's South End. This decisive action aims to dismantle Delta Green's operational capabilities definitively and restore safety and order to the community."
 USA_Reveal_Many_Of_Their_Documents:0 "Reveal Many Of Their Documents"
 USA_Reveal_Many_Of_Their_Documents_desc:0 "In a move aimed at restoring public trust and transparency, the government has decided to declassify and release a significant portion of Delta Green's documents. These documents chronicle the organization's clandestine involvement with paranormal activities and other undisclosed operations within the Americas. While some information will remain classified to protect national security and operational details, the release will include extensive files that shed light on Delta Green's historical activities and policies."
 USA_Arrest_Compromised_MPS:0 "Arrest Compromised MP's"
 USA_Arrest_Compromised_MPS_desc:0 "The government takes decisive action against internal corruption as it becomes evident that Delta Green's influence has extended into the legislative branch, compromising several members of Parliament. These MPs are suspected of having undisclosed ties to Delta Green, potentially endangering national security by leaking sensitive information that could undermine ongoing operations against the organization. To prevent further breaches and protect the integrity of the government, these members will be arrested and subjected to thorough investigations. This tough stance reflects the government's resolve to purge any elements within its ranks that threaten the nation's democratic processes and security protocols."
 USA_Declare_Delta_Green_A_Terror_Organization:0 "Declare Delta Green A Terror Organization" 
 USA_Declare_Delta_Green_A_Terror_Organization_desc:0 "In a significant escalation of its efforts to neutralize Delta Green, the government officially designates the organization as a terrorist entity. This declaration reflects the gravity of Delta Green's actions and its persistent threat to national security and public safety. With this formal designation, law enforcement and intelligence agencies are granted expanded powers to act against the organization, including more extensive surveillance, financial tracking, and broader authority for preemptive strikes against its operations. This status also enables harsher penalties for those associated with Delta Green, aiming to dismantle its networks and prevent any future activities that could harm citizens or the state. The government's decision sends a clear message that any group undermining national stability and security will face the utmost legal repercussions."
 USA_Autilize_Inter_Organization_Rivalries:0 "Utilize Inter-organization rivalries"
 USA_Autilize_Inter_Organization_Rivalries_desc:0 "In a strategic maneuver, the government plans to exploit existing tensions and rivalries between Delta Green and other clandestine organizations. By understanding and manipulating these internal conflicts, the authorities aim to destabilize Delta Green's operations from within. Intelligence agencies will engage in sophisticated psychological operations, spreading disinformation and sowing distrust among these groups to incite infighting and operational paralysis."
 USA_DThe_Emperors_Address:0 "The Emperors Address"
 USA_DThe_Emperors_Address_desc:0 "The Emperor will address the nation, explaining the recent dismantling of Delta Green and its historical necessity, which has become incompatible with today's ethical standards. Following his speech, Prime Minister Trump will announce a comprehensive aid package to support those affected by Delta Green, demonstrating the government's commitment to healing and justice for the impacted communities."
 USA_Minister_Ross_Financial_Miracles:0 "Minister Ross Financial Miracles"
 USA_Minister_Ross_Financial_Miracles_desc:0 "Financial Minister Wilbur Ross Jr is coming into office with many problems. Rampant inflation, the destruction of the middle class, and the High taxation rates which all face."
 USA_Business_Friendly_Policy:0 "Business Friendly Policy"
 USA_Business_Friendly_Policy_desc:0 "Reducing taxes on big business'  is beneficial for the American economy. It will incentivize other countries corporations to come and settle in the American Empire allowing us to have jobs built and industry returned to major cities."
 USA_Every_Man_An_Emperor:0 "Every Man An Emperor"
 USA_Every_Man_An_Emperor_desc:0 "To return buying power to the common man, the party will restart the "every man a king" program and expand it out even further."
 USA_Reinvest_in_The_Midwest:0 "Reinvest In The Midwest"
 USA_Reinvest_in_The_Midwest_desc:0 "Recognizing the economic decline that has affected the Midwest over the decades, the government is launching a comprehensive initiative aimed at revitalizing this vital region. This plan involves significant investment in infrastructure, manufacturing, and technology sectors to stimulate growth and employment."
 USA_Lower_Foreign_Tariffs:0 "Lower Foreign Tariffs"
 USA_Lower_Foreign_Tariffs_desc:0 "To enhance the competitiveness of American products on the global stage, the government has decided to lower foreign tariffs. This strategic move is aimed at increasing trade volume, reducing costs for consumers and businesses, and fostering stronger economic ties with international partners. By making American goods more affordable abroad, this policy intends to boost exports, stimulate domestic industries, and support job creation across various sectors."
 USA_Lower_Taxes_On_The_Middle_Class2:0 "Lower Taxes On The Middle Class"
 USA_Lower_Taxes_On_The_Middle_Class2_desc:0 "The government has introduced a pivotal policy aimed at reducing the tax burden on the middle class. This measure is designed to increase disposable income for middle-income families, stimulate economic activity by boosting consumer spending, and enhance overall financial stability for a significant segment of the population."
 USA_Remove_Sanctions_on_The_Oil_Industry:0 "Remove Sanctions On The Oil Industry"
 USA_Remove_Sanctions_on_The_Oil_Industry_desc:0 "In a move aimed at bolstering economic growth and ensuring energy security, the government has decided to remove existing sanctions on the oil industry. This policy change is designed to increase domestic oil production, reduce energy costs, and lessen dependence on foreign oil imports. By lifting these sanctions, the government seeks to stimulate investment in the energy sector, create jobs, and drive technological advancements in oil extraction and processing."
 USA_Government_Start_Up_Loans:0 "Government Start Up Loans"
 USA_Government_Start_Up_Loans_desc:0 "For our economy to truly recover, we need to restart small businesses. By handing out loans to start up businesses we can heal our economy and help enrich those who have the work ethic."
 USA_Lower_Government_Budgets:0 "Lower Government Budgets"
 USA_Lower_Government_Budgets_desc:0 "In an effort to optimize efficiency and reduce waste within the federal government, a new initiative is underway to lower government budgets across various departments. This strategic financial adjustment focuses on cutting non-essential expenditures, streamlining operations, and enhancing the accountability of government spending."
 USA_Minister_Gritzs_Domestic_Intelligence:0 "Minister Gritzs Domestic Intelligence"
 USA_Minister_Gritzs_Domestic_Intelligence_desc:0 "Amid rising concerns over the proliferation of extremist groups influencing both the political left and right, Bo Gritz, the appointed Minister of Intelligence, steps forward with a robust and nuanced strategy aimed at curbing these threats. Recognizing the delicate balance between national security and civil liberties, his approach combines cutting-edge intelligence gathering, community engagement, and legislative action to address the complex landscape of domestic extremism."
 USA_Restart_the_Sydnicalist_Scare:0 "Restart The Sydnicalist Scare"
 USA_Restart_the_Sydnicalist_Scare_desc:0 "Amid concerns over the increasing allure of syndicalism among America's youth, the government has launched a comprehensive campaign to reframe syndicalist ideology as a threat to the nation's democratic and economic foundations. This initiative, termed "Counteracting the Syndicalist Surge," employs a multi-faceted approach involving media campaigns, educational reforms, and legislative reviews to challenge and diminish the ideology's appeal. The resurgence of syndicalism, previously endorsed by Bernie's Commonwealth party as a benign alternative, is now being critically reexamined through this national strategy."
 USA_Investigate_The_Underground_Weathermen:0 "Investigate The Underground Weathermen"
 USA_Investigate_The_Underground_Weathermen_desc:0 "One of the first groups for Minister Gritz to focus on will be the left wing extremist group "The Underground Weathermen". Responsible for a series of bombings across the Empire since the 1970s, the group was never formally caught. Gritz aims to change that."
 USA_Reopen_The_New_York_Bombing:0 "Reopen The New York Bombing"
 USA_Reopen_The_New_York_Bombing_desc:0 "In a move to bring closure to one of the darkest chapters in American history, the government has announced the reopening of the investigation into the infamous White House Bombing of 1973. The attack, which left a mark on the national consciousness, was a dramatic escalation in the activities of the left-wing extremist group known as the Underground Weathermen. Found at the scene was a chilling calling card along with a letter bearing the phrase "Sic Semper Tyrannus. America Delenda Est" — a declaration of the group's radical intent to destroy what they viewed as a tyrannical establishment."
 USA_Alert_The_Public:0 "Alert The Public"
 USA_Alert_The_Public_desc:0 "The government has initiated a comprehensive plan to reduce budgets across various federal departments. This strategy focuses on cutting unnecessary spending, optimizing resource allocation, and enhancing the efficiency of government operations. By streamlining expenditures, the initiative aims to reduce the national deficit and allocate funds more effectively, ensuring that taxpayer money is used judiciously to support essential services and investments that provide the greatest public benefit."
 USA_Reopen_The_White_House_Bombing:0 "Reopen The White House Bombing"
 USA_Reopen_The_White_House_Bombing_desc:0 "In light of new evidence and ongoing public interest, the government has decided to reopen the investigation into the notorious White House Bombing of 1973, attributed to the radical group known as the Weathermen. This violent act, which shocked the nation, was marked by the discovery of a calling card and a cryptic letter with the phrases "Sic Semper Tyrannus" and "America Delenda Est," signaling a deep-seated animosity towards the government. By revisiting this case, the authorities aim to uncover overlooked details, resolve unanswered questions, and bring closure to a dark chapter in American history."
 USA_New_Evidence_At_The_Scene:0 "New Evidence At The Scene"
 USA_New_Evidence_At_The_Scene_desc:0 "Following the decision to reopen the investigation of the 1973 White House bombing, authorities have discovered new evidence at the scene that potentially links the Underground Weathermen to the incident. This development comes as a breakthrough in a case that has remained a symbol of political radicalism and unrest for decades. The discovery includes materials and forensic data previously unanalyzed or overlooked, shedding fresh light on the operational methods and connections of the Weathermen."
 USA_Reinterrogate_The_Captured:0 "Reinterrogate The Captured"
 USA_Reinterrogate_The_Captured_desc:0 "In a further push to resolve lingering mysteries surrounding the activities of the Underground Weathermen, the government has initiated a new series of interrogations involving members of the group who were previously captured."
 USA_Raid_Their_Last_Hideout:0 "Raid Their Last Hideout"
 USA_Raid_Their_Last_Hideout_desc:0 "In a strategic move to dismantle the remnants of the Underground Weathermen, the ATF is set to execute a high-stakes raid on a long-abandoned bunker at Fort Hughs. This bunker, constructed during a period of national consolidation known as the Reclamation, has faded from public memory and records. Intelligence suggests it has been used as a last refuge by the dwindling members of the Weathermen, potentially storing weapons, documents, and other materials crucial for their operations."
 USA_Look_To_Our_Next_Focus:0 "Look To Our Next Focus"
 USA_Look_To_Our_Next_Focus_desc:0 "Following the successful raid on the warehouse used by the Underground Weathermen, the investigative team is now broadening its scope to encompass other potential cells and hideouts associated with the group. This expansion of the investigation aims to dismantle any remaining fragments of the organization and prevent future activities that could threaten national security. By systematically targeting known and suspected locations linked to the Weathermen, authorities hope to capture critical evidence and apprehend additional members of the group."
 USA_The_Sons_Of_Reed:0 "The Sons Of Reed"
 USA_The_Sons_Of_Reed_desc:0 "In response to a resurgence of violent activities by the extremist group known as the Sons of Reed, the U.S. government has initiated a major operation to dismantle this network. Inspired by the radical ideologies of Jack Reed, this group has escalated its actions to include rioting and acts of terrorism, exploiting the political turmoil following the election of President Trump. The operation, named "Legacy's End," involves the CIA and the newly established Internal Intelligence Agency (IIA), working together to neutralize this growing domestic threat."
 USA_Designate_The_SOR_A_Terror_Group:0 "Designate The SOR A Terror Group"
 USA_Designate_The_SOR_A_Terror_Group_desc:0 "In a decisive move, Prime Minister Trump is set to address the nation to officially designate the Sons of Reed (SOR) as a terrorist organization. This significant action comes in response to the group's escalating activities, which have increasingly posed serious threats to national security and public safety. The designation is a critical step in empowering law enforcement agencies to take more robust actions against the group's operations and assets. However, the announcement is expected to spark widespread unrest, with potential rioting anticipated in every major city."
 USA_Beef_Up_Police_Forces:0 "Beef Up Police Forces"
 USA_Beef_Up_Police_Forces_desc:0 "In response to rising security concerns and the ongoing threat of domestic terrorism, the government has initiated a comprehensive plan to strengthen police forces across the nation. This initiative involves increasing funding for law enforcement agencies to enhance manpower, upgrade equipment, and improve training programs."
 USA_Raid_The_Campuses:0 "Raid The Campuses"
 USA_Raid_The_Campuses_desc:0 "Amid growing concerns about the radicalization of students on college campuses across the Midwest, which have become hotbeds for ideological indoctrination by extremist factions of the faculty, the government has authorized a series of coordinated raids. Dubbed Operation Academic Shield, this initiative aims to dismantle the recruitment networks of the Sons of Reed, focusing on apprehending faculty members involved in these activities and disrupting their operations. The operation involves multiple law enforcement agencies and is sensitive due to the locations and the potential for significant public and media scrutiny"
 USA_Extended_Prison_Sentences:0 "Extended Prison Sentences"
 USA_Extended_Prison_Sentences_desc:0 "In response to rising security concerns and the ongoing threat of domestic terrorism, the government has initiated a comprehensive plan to strengthen police forces across the nation. This initiative involves increasing funding for law enforcement agencies to enhance manpower, upgrade equipment, and improve training programs."
 USA_Discover_Their_Leadership:0 "Discover Their Leadership"
 USA_Discover_Their_Leadership_desc:0 "In a strategic expansion of its efforts against the Sons of Reed, the government has launched Operation Insight, a dedicated campaign to identify and capture the secretive leadership of this extremist organization. Recognizing that dismantling the group's command structure is crucial to effectively neutralizing its influence and operations, intelligence agencies are now employing advanced surveillance, data analysis, and field operations to uncover the identities of SOR's top leaders."
 USA_America_At_Peace:0 "America At Peace"
 USA_America_At_Peace_desc:0 "Following a series of intense and coordinated efforts by law enforcement and intelligence agencies to dismantle the extremist network of the Sons of Reed (SOR), a relative calm has settled over the nation. Though not all leaders of the SOR have been apprehended, the major operations have significantly weakened the group's capabilities, leading to a marked decrease in violent activities. This event, "America at Peace," marks a period of cautious optimism, where the government and citizens alike breathe a sigh of relief and look forward to a time of rebuilding and healing." 
 USA_Naders_Education_Reform:0 "Naders Education Reform"
 USA_Naders_Education_Reform_desc:0 "Ralph Nader, an independent in the American parliament has been appointed as minister of education. His refusal to bow to political bias will allow him to reform the American education system without the need of political brainwashing"
 USA_Ask_For_More_Funding:0 "Ask For More Funding" 
 USA_Ask_For_More_Funding_desc:0 "Following the initial success of Ralph Nader's educational reforms, the next step involves securing additional funding to further enhance and expand educational initiatives."
 USA_Expand_Parental_Rights:0 "Expand Parental Rights"
 USA_Expand_Parental_Rights_desc:0 "Being built as a nation of Freedom, we still run a somewhat tyrannical education system. One of the first major reforms will be to expand the rights of parents in the education system. This will ensure that Parents themselves can know what their kids are being taught."
 USA_Draft_Up_College_Standards:0 "Draft Up College Standards"
 USA_Draft_Up_College_Standards_decs:0 "To elevate the quality of higher education and ensure uniformity across institutions, a new initiative is underway to draft comprehensive college standards. These standards will focus on academic excellence, student support, and career readiness, aiming to prepare graduates to meet the demands of a competitive global job market."
 USA_Expand_STEM_Programs:0 "Expand STEM Programs"
 USA_Expand_STEM_Programs_desc:0 "Recognizing the critical need for expertise in science, technology, engineering, and mathematics (STEM), the government has launched an initiative to significantly expand STEM education programs across all levels of schooling. This expansion includes increasing funding for STEM facilities, providing more resources for teachers in these disciplines, and creating new opportunities for students to engage with cutting-edge technology and research."
 USA_The_1936_Project:0 "The 1936 Project"
 USA_The_1936_Project_desc:0 "This program will change how history is taught. Instead of demonizing the old USA, this program will show how the Empire is a natural progression of the ideals of the old USA."
 USA_Create_A_Federal_Standard:0 "Create A Federal Standard"
 USA_Create_A_Federal_Standard_desc:0 "The Federal Government will create a new system of standards for primary education."
 USA_Demonize_Syndicalism:0 "Demonize Syndicalism"
 USA_Demonize_Syndicalism_desc:0 "Trump has ordered a move to counter the influence of syndicalist ideologies, the government has initiated a campaign to critically examine and publicly challenge the principles of syndicalism. This initiative aims to highlight the perceived economic inefficiencies and social disruptions associated with syndicalist theories and practices. Through educational programs, media engagement, and public discourse, the campaign seeks to sway public opinion by presenting alternative economic models that emphasize stability, growth, and individual entrepreneurship."
 USA_End_Free_College:0 "End Free College"
 USA_End_Free_College_desc:0 "The Trump government has decided to end the provision of universally free college education. This decision is driven by the need to optimize resource allocation and focus financial support on targeted educational programs that promise higher employment rates and economic benefits. Instead, scholarships and financial aid will be made more accessible to students based on merit and financial need."
 USA_In_The_Legacy_Of_Dr_King_Jr:0 "In The Legacy Of Dr King Jr"
 USA_In_The_Legacy_Of_Dr_King_Jr_desc:0 "To the surprise of many, the first african american to succeed former PM King is not a member of any progressive party, but instead he represents a political party from the old days of the USA. Oddly enough, its the party that would've advocated for the continuing of the racist Jim Crow policies."
 USA_Fix_Bernies_Progressive_Mistakes:0 "Fix Bernies Progressive Mistakes"
 USA_Fix_Bernies_Progressive_Mistakes_desc:0 ""
 USA_Appoint_MP_Roosevelt_III_To_Handle_Domestics:0 "Appoint MP Roosevelt III To Handle Domestics"
 USA_Appoint_MP_Roosevelt_III_To_Handle_Domestics_desc:0 "Former Syndicalist turned Democrat establishment member Kermit Roosevelt III has been appointed by the Obama administration to handle and fix domestic policy."
 USA_Delegate_Funding_Towards_Education:0 "Delegate Funding Towards Education"
 USA_Delegate_Funding_Towards_Education_desc:0 "This initiative will significantly increase funding for education to modernize schools, enhance teacher training, and ensure equitable access to quality education for all students. By addressing the educational disparities and investing in the future workforce, the administration aims to create a more skilled and competitive population capable of driving the nation forward in the 21st century."
 USA_Create_A_Government_Oversight_Board:0 "Create A Government Oversight Board"
 USA_Create_A_Government_Oversight_Board_desc:0 "The Sanders administration constantly attacked the personal liberties and freedoms of Americans in exchange for "the welfare of the worker and the oppressed". The Government Oversight board will look into organizations like the Health Department, the Department of Homeland Security, and even the IRS. With public trials, those who abused the American people will answer for their crimes."
 USA_Fix_The_Big_City_Policing_Problem:0 "Fix The Big City Policing Problem"
 USA_Fix_The_Big_City_Policing_Problem_desc:0 "Major cities under the Sanders administration saw the defunding of police forces in exchange for the funding of major social programs. We need to fix this problem before our cities permanently devolve into warlord esque states out of our control."
 USA_Recommend_Curriculm_Overhauls:0 "Recommend Curriculm Overhauls"
 USA_Recommend_Curriculm_Overhauls_desc:0 "The recommended changes include integrating STEM (Science, Technology, Engineering, and Mathematics) education more thoroughly, promoting critical thinking and problem-solving skills, and incorporating digital literacy from an early age. Additionally, the new curriculum emphasizes civics education to foster informed and engaged citizens."
 USA_Create_A_Cybersecurity_Board:0 "Create A Cybersecurity Board"
 USA_Create_A_Cybersecurity_Board_desc:0 "In response to the growing threat of cyber attacks on national infrastructure and personal data, the Obama administration is establishing a dedicated Cybersecurity Board. This initiative, led by a coalition of top experts from the government, private sector, and academia, aims to develop comprehensive strategies to protect the nation's digital landscape. The board will be responsible for setting security standards, promoting best practices, and coordinating responses to cyber threats. It will also work to enhance public awareness and education on cybersecurity issues, ensuring that both individuals and organizations are better prepared to defend against cyber attacks."
 USA_Increase_Major_City_Taxes:0 "Increase Major City Taxes"
 USA_Increase_Major_City_Taxes_desc:0 "To address the growing financial needs for urban development and public services, the Obama administration is implementing a policy to increase taxes in major cities. This aims to generate additional revenue to fund essential infrastructure projects, enhance public transportation, improve healthcare and education facilities, and bolster public safety measures. By targeting economically vibrant urban centers, the administration seeks to ensure that the wealth generated within these cities contributes to their sustainable growth and development. While mindful of the potential burden on residents, this policy is designed with progressive tax measures to ensure that the higher tax rates primarily affect the wealthiest individuals and corporations."
 USA_Refund_STEM_Programs:0 "Refund STEM Programs"
 USA_Refund_STEM_Programs_desc:0 "Acknowledging the critical importance of Science, Technology, Engineering, and Mathematics (STEM) education for national competitiveness, the Obama administration is committing to refund and expand STEM programs across the country. This focus involves allocating substantial resources to reinvigorate STEM initiatives at all educational levels, from primary schools to universities. The goal is to enhance curriculum content, provide advanced training for educators, and increase access to cutting-edge technology and laboratories. By bolstering STEM education, the administration aims to cultivate a new generation of innovators, engineers, and scientists who will drive technological advancement and economic growth."
 USA_Beef_Up_City_Cyber_Infrastructure:0 "Beef Up City Cyber Infrastructure"
 USA_Beef_Up_City_Cyber_Infrastructure_desc:0 "In an era where digital connectivity is vital for economic growth and public safety, the Obama administration is prioritizing the enhancement of cyber infrastructure in major cities. This allocates significant resources to upgrade and secure the digital networks that underpin urban systems, including public services, transportation, and communication networks. By improving the resilience and capacity of city cyber infrastructure, the administration aims to protect against cyber threats and ensure the seamless operation of critical services. This initiative includes installing advanced security protocols, expanding broadband access, and integrating smart technologies to optimize city management and efficiency."
 USA_For_Liberty_Once_And_For_All:0 "For Liberty Once And For All"
 USA_For_Liberty_Once_And_For_All_desc:0 "With the IIA and CIA actually focused on the real enemies, lest they face a government-sponsored trial, the American peoples are safe from government overeach. But along with that, they now no longer face the burgeoning, threats of cybersecurity."
 USA_Appoint_Yang_To_Handle_Financials:0 "Appoint Yang To Handle Financials"
 USA_Appoint_Yang_To_Handle_Financials_desc:0 "The Sanders administration has absolutely ruined the American economy by overpromising on their progressive ideals. Free college, free healthcare, and over-compensation for Mexico's financial issues have led to the highest inflationary rate since the Berlin Stock Crash. Yang plans to use financial strategies from across the political spectrum to solve this problem and to finally help the average American be able to afford groceries once again"
 USA_Slow_Down_The_Mint1:0 "Slow Down The Mint"
 USA_Slow_Down_The_Mint1_desc:0 "Amidst the economic turmoil brought about by the Sanders administration's ambitious but unsustainable progressive policies, Andrew Yang proposes a critical measure to combat the skyrocketing inflation - "Slow Down the Mint." By significantly reducing the excessive printing of money, this focus aims to curb the devaluation of the currency and bring inflation under control. Yang's strategy involves working closely with financial experts and the Federal Reserve to adjust monetary policy, ensuring that the money supply is aligned with actual economic growth."
 USA_Reform_Bernie_Care2:0 "Reform Bernie Care"
 USA_Reform_Bernie_Care2_desc:0 "Medicare for all is present in every major developed nation, but only in America is it actually a burden. The system is over complicated, backlogged to hell, and under preforming. Through several forms of reformation, we can implement a new form of Berniecare, one which Americans will benefit from."
 USA_Eliminate_Some_Social_Programs:0 "Eliminate Some Social Programs"
 USA_Eliminate_Some_Social_Programs_desc:0 "Andrew Yang recognizes the need for difficult fiscal adjustments to restore economic stability. This involves a thorough review and reduction of government-funded initiatives that have contributed to unsustainable public spending and record-high inflation. This policy aims to streamline federal expenditures by phasing out or downsizing programs that, while well-intentioned, have proven to be economically untenable in the current climate. Yang's approach prioritizes maintaining essential services and support for the most vulnerable, while cutting back on initiatives that can be reformed or replaced by more efficient alternatives."
 USA_End_The_Moratorium_On_Student_Loans:0 "End The Moratorium On Student Loans"
 USA_End_The_Moratorium_On_Student_Loans_desc:0 "Yang's plan includes implementing targeted relief measures such as income-driven repayment plans and interest rate reductions to ensure that repayment remains manageable for graduates. This balanced approach seeks to reignite fiscal responsibility while still offering support to those in need. By lifting the moratorium, the policy aims to reestablish financial discipline, reduce national debt, and contribute to the stabilization of the economy, ultimately helping to bring down inflation and restore economic confidence."
 USA_De_Regulate_Wall_Street:0 "De-Regulate Wall Street"
 USA_De_Regulate_Wall_Street_desc:0 "By reducing regulatory burdens, Yang aims to encourage increased capital flows, boost market liquidity, and enhance the competitiveness of American financial institutions globally. This focus involves simplifying compliance requirements, easing restrictions on trading and investment activities, and promoting financial innovation while ensuring essential protections remain in place to prevent systemic risks. The objective is to attract domestic and international investors, spur economic activity, and drive job creation."
 USA_Lower_Taxes_On_The_Rich2:0 "Lower Taxes On The Rich"
 USA_Lower_Taxes_On_The_Rich2_desc:0 "As part of a comprehensive strategy to stimulate economic growth and investment, Andrew Yang proposes the a new policy which aims to reduce the tax burden on high-income earners and wealthy individuals to incentivize greater private investment and spur economic activity. By lowering taxes on the rich, the administration seeks to encourage the affluent to reinvest their capital into the economy, fostering job creation, entrepreneurship, and innovation. The anticipated increase in investments is expected to trickle down through the economy, benefiting various sectors and ultimately leading to broader economic growth."
 USA_Reinvest_In_Small_Businesses:0 "Reinvest In Small Businesses"
 USA_Reinvest_In_Small_Businesses_desc:0 "Andrew Yang is dedicated to breathing new life into the economy by turning the spotlight on small businesses, which are essential for job creation and community vitality. His plan involves directing substantial financial resources into these local enterprises through targeted tax breaks, grants, and accessible low-interest loans. Simplifying regulatory processes will help budding entrepreneurs and established small business owners navigate their operations with greater ease."
 USA_Add_New_Restrictions_To_Welfare:0 "New Restrictions To Welfare"
 USA_Add_New_Restrictions_To_Welfare_desc:0 "To promote self-reliance and manage fiscal responsibilities more effectively, Andrew Yang proposes introducing stricter guidelines for the welfare system. This initiative involves tightening eligibility criteria, enforcing more rigorous work requirements, and scaling back benefits for able-bodied adults without dependents. The goal is to ensure welfare resources are directed to those in genuine need while encouraging individuals to seek employment and reduce dependency on government aid."
 USA_Raise_The_Minimum_Wage:0 "Raise The Minimum Wage"
 USA_Raise_The_Minimum_Wage_desc:0 "Andrew Yang aims to improve the standard of living for the working class by advocating for an increase in the minimum wage. This initiative is designed to ensure that all workers receive fair compensation that aligns with the cost of living, thereby reducing income inequality and alleviating poverty. By raising the minimum wage, the administration seeks to empower workers, boost consumer spending, and stimulate economic growth."
 USA_Eliminate_The_Carbon_Tax:0 "Eliminate The Carbon Tax"
 USA_Eliminate_The_Carbon_Tax_desc:0 "In a move aimed at easing financial burdens on businesses and consumers, Andrew Yang proposes the elimination of the carbon tax. This measure is intended to reduce energy costs and stimulate economic activity by removing what is seen as a significant financial impediment. Yang believes that lifting the carbon tax will encourage investment, lower production costs, and boost competitiveness for American industries."
 USA_Reform_The_Government_Loan_Process:0 "Reform The Government Loan Process"
 USA_Reform_The_Government_Loan_Process_desc:0 "Determined to revitalize financial accessibility, Andrew Yang is spearheading a transformative overhaul of the government loan system. This aims to dismantle the cumbersome bureaucracy that currently hampers loan approvals, replacing it with a streamlined, user-centric process. By cutting down on paperwork and expediting decision-making, Yang's plan ensures that individuals and businesses can swiftly obtain the financial support they need. The reformation includes robust measures to enhance transparency and prevent misuse of funds, ensuring that loans are granted to trustworthy applicants."
 USA_Reform_The_Universal_Income_Doctrine:0 "Reform The Universal Income Doctrine"
 USA_Reform_The_Universal_Income_Doctrine_desc:0 "Andrew Yang is set to reshape the Universal Income Doctrine, tailoring it to better meet the nation's economic realities and societal needs. This seeks to refine the existing universal income framework by implementing a more targeted approach that prioritizes those in the greatest need while ensuring fiscal sustainability. Yang's plan includes adjusting benefit levels, incorporating means-testing, and exploring funding mechanisms that minimize economic strain. By recalibrating the universal income system, Yang aims to provide a safety net that empowers individuals without compromising the nation's financial health."
 USA_Implement_A_Value_Added_Tax:0 "Implement A Value Added Tax"
 USA_Implement_A_Value_Added_Tax_desc:0 "They're difficult to dodge and easy to implement. By taking a slice at each point that value switches hands in the supply chain, big corporations will pay into the system to bring their products to market. If you want to do business in America, you have to pay into America. That's it. This system doesn't privilege foreign goods because a VAT is equally applied to imported goods."
 USA_The_Bull_Market_For_The_People:0 "The Bull Market For The People"
 USA_The_Bull_Market_For_The_People_desc:0 "Andrew Yang's vision for future transforms the stock market into a cornerstone of economic inclusivity. This bold initiative is designed to break down traditional barriers and open the doors of Wall Street to everyday Americans. Yang's approach involves creating user-friendly investment platforms that cater to novice investors, establishing neighborhood investment cooperatives, and launching comprehensive financial education campaigns. By leveraging technology and community engagement, this policy ensures that the wealth generated by market successes is shared more broadly."
 USA_John_Kerrys_Trip_To_France:0 "John Kerrys Trip To France"
 USA_John_Kerrys_Trip_To_France_desc:0 "Secretary of Defense John Kerry will fix the foreign policy issues created by the two terms of the Sanders administration. His first objective will be to renegotiate French defense treaties."
 USA_Slow_The_Flow_Of_British_Refugees:0 "Slow The Flow Of British Refugees"
 USA_Slow_The_Flow_Of_British_Refugees_desc:0 "The flow of USBR refugees has inflated in recent years. While we originally kept our borders open to those who wanted to experience American freedom, the american economy can no longer support these peoples. For a temporary time, we will slow the flow of refugees into America"
 USA_Rescind_Recognition_Of_The_Peoples_Tsardom2:0 "Rescind Recognition Of The People's Tsardom"
 USA_Rescind_Recognition_Of_The_Peoples_Tsardom2_desc:0 "Determined to realign American foreign policy with democratic principles, Secretary of Defense John Kerry plans to rescind recognition of the People's Tsardom. This bold move is intended to distance the Empire from regimes that do not uphold democratic values and human rights. By withdrawing official recognition, Kerry aims to send a clear message that the U.S. stands firmly against authoritarianism and supports the global push for democracy."
 USA_Keep_The_USCA_Treaties_In_Place:0 "Keep The USCA Treaties In Place"
 USA_Keep_The_USCA_Treaties_In_Place_desc:0 "In a bid to maintain regional stability and uphold long-standing alliances, Secretary of Defense John Kerry is committed to preserving the United States-Central America (USCA) treaties. Recognizing the strategic importance of these agreements, Kerry's approach emphasizes continuity and cooperation. By keeping these treaties intact, he aims to ensure mutual security, bolster economic partnerships, and reinforce diplomatic ties with Central American nations."
 USA_Ask_For_Canadian_Financial_Support:0 "Ask For Canadian Financial Support"
 USA_Ask_For_Canadian_Financial_Support_desc:0 "To navigate the economic turmoil and enhance regional solidarity, Secretary of Defense John Kerry is reaching out to the Kingdom of Canada for financial backing. Recognizing the intertwined destinies of the Empire of America and its steadfast northern ally, Kerry's initiative focuses on leveraging Canada's economic strength to aid in the Empire's recovery."
 USA_Expel_All_Syndicalist_Embassies:0 "Expel All Syndicalist Embassies"
 USA_Expel_All_Syndicalist_Embassies_desc:0 "In a decisive move to counter the influence of syndicalism, Secretary of Defense John Kerry orders the expulsion of all syndicalist embassies from the Empire of America. This bold action aims to sever diplomatic ties with nations promoting syndicalist ideologies, which are seen as a threat to the Empire's stability and values."
 USA_Let_The_Trade_Flow_Once_Again:0 "Let The Trade Flow Once Again"
 USA_Let_The_Trade_Flow_Once_Again_desc:0 "Secretary of Defense John Kerry is determined to rejuvenate the Empire of America's economy by reopening global trade channels. "Let the Trade Flow Once Again" aims to dismantle restrictive trade barriers, eliminate tariffs, and ease regulations. This  seeks to boost exports, attract foreign investments, and lower consumer prices. By revitalizing trade, Kerry envisions a dynamic economy that fosters job creation, economic growth, and strengthened international alliances, positioning the Empire as a key player in global commerce."
 USA_Expand_Refugee_Settlements_In_New_England:0 "Expand Refugee Settlements In New England"
 USA_Expand_Refugee_Settlements_In_New_England_desc:0 "The influx of refugees from the United Socialist British Republics (USBR) has surged in recent years. While the Empire of America has welcomed those seeking freedom, the economic strain has become unsustainable. Secretary of Defense John Kerry proposes a temporary slowdown of refugee admissions to manage resources effectively."
 USA_A_New_Extradition_Treaty_With_The_USCA:0 "A New Extradition Treaty With The USCA"
 USA_A_New_Extradition_Treaty_With_The_USCA_desc:0 "We will renew our extradition treaties with the USCA in an effort to continue raising relations with our new southern friend."
 USA_Spread_Refugees_Across_North_America:0 "Spread Refugees Across North America"
 USA_Spread_Refugees_Across_North_America_desc:0 "In response to the economic strain from the USBR refugee influx, Secretary of Defense John Kerry initiates a policy to distribute refugees more evenly across North America. This strategy is to alleviate pressure on the Empire of America's resources by collaborating with neighboring nations, including the Kingdom of Canada, to share the responsibility."
 USA_Rebuild_The_Pax_Americana:0 "Rebuild The Pax Americana"
 USA_Rebuild_The_Pax_Americana_desc:0 "Seeking to restore global stability and reaffirm the Empire of America's leadership, Secretary of Defense John Kerry launches the "Rebuild the Pax Americana" initiative. This focuses on strengthening international alliances, enhancing military presence in strategic regions, and promoting democratic values worldwide."
 USA_MP_Welches_Transportation_Fixes:0 "MP Welches Transportation Fixes"
 USA_MP_Welches_Transportation_Fixes_desc:0 "Under the Sanders administration, infrastructure crumbled. MP Peter Welch has been assigned to the role of Transportation Csar. Within this role, he will be responsible for upgrading and modernizing American infrastructure."
 USA_Destroy_Amtrak:0 "Destroy Amtrak"
 USA_Destroy_Amtrak_desc:0 "Originally created in 1970 by parliament, Amtrak has become a stagnant, bloated corpse of a way to travel. By destroying the only train service, we can introduce competition back to the rails, not only solving the supply chain problem but also introducing newer ways for people to travel."
 USA_Open_New_Seaports:0 "Open New Seaports"
 USA_Open_New_Seaports_desc:0 "As part of a comprehensive infrastructure overhaul, Transportation Czar Peter Welch focuses on opening new seaports. This initiative aims to enhance trade capacity, reduce congestion in existing ports, and stimulate regional economies. By developing state-of-the-art seaport facilities, Welch seeks to boost international trade, create jobs, and support the Empire of America's position as a global commerce hub."
 USA_Rebuild_Rural_Highways:0 "Rebuild Rural Highways"
 USA_Rebuild_Rural_Highways_desc:0 "Addressing the neglected rural infrastructure, Transportation Czar Peter Welch commits to rebuilding rural highways. Repairing and modernizing these critical roadways will ensure safe and reliable transportation for residents and businesses. Improving rural highways aims to enhance connectivity, support local economies, and provide better access to essential services, fostering balanced regional development."
 USA_Refund_Air_Travel:0 "Refund Air Travel"
 USA_Refund_Air_Travel_desc:0 "Funding is allocated to modernize airports, upgrade air traffic control systems, and enhance passenger services. These improvements are designed to boost the efficiency and safety of air travel, stimulate economic activity, and ensure that the Empire of America's aviation infrastructure meets global standards."
 USA_Build_New_Rail_Lines_Across_The_Land:0 "Build New Rail Lines Across The Land"
 USA_Build_New_Rail_Lines_Across_The_Land_desc:0 "Peter Welch spearheads the construction of new rail lines to connect major cities and underserved regions. Expanding the rail network aims to reduce traffic congestion, lower carbon emissions, and provide efficient, affordable transportation options. This development is intended to stimulate economic growth, enhance regional connectivity, and support sustainable infrastructure across the Empire of America."
 USA_From_one_End_To_Another_Easily:0 "From One End To Another Easily"
 USA_From_one_End_To_Another_Easily_desc:0  "Peter Welch has committed to ensure seamless coast-to-coast travel by enhancing the connectivity and efficiency of the nation's transportation network. This includes integrating various modes of transport—highways, railways, and air travel—into a cohesive system. By optimizing routes and improving infrastructure, Welch envisions a future where citizens and goods can traverse the Empire of America quickly and effortlessly, boosting economic activity and national cohesion."
 USA_Kennedys_Initatives_On_Unification:0 "Kennedys Initatives On Unification"
 USA_Kennedys_Initatives_On_Unification_desc:0 "JFK Jr has been put in place of the "American Unification initiative. The idea is that he will unite the American public behind the Obama administration before the land devolves into the chaos it experienced before."
 USA_Empower_The_Justice_Department:0 "Empower The Justice Department"
 USA_Empower_The_Justice_Department_desc:0 "JFK Jr. seeks to fortify the Justice Department, ensuring it has the tools and authority to uphold civil rights and combat injustices. This initiative emphasizes tackling corruption, enforcing laws equitably, and addressing systemic issues within the legal framework."
 USA_Hold_The_Media_Accountable:0 "Hold The Media Accountable"
 USA_Hold_The_Media_Accountable_desc:0 "JFK Jr. has taken a firm stance on ensuring media integrity and responsibility by introducing measures to hold media outlets accountable for the accuracy and fairness of their reporting. Establishing stricter regulations and promoting journalistic ethics aims to combat misinformation and biased reporting."
 USA_Lessen_The_Press_Corp:0 "Lessen The Press Corp"
 USA_Lessen_The_Press_Corp_desc:0 "In an effort to streamline communication and reduce the influence of sensationalism, a plan is set in motion to scale back the size of the press corps. By limiting the number of media representatives with direct access to government briefings, this initiative aims to foster more focused and accurate reporting."
 USA_Go_After_Political_Radicals:0 "Go After Political Radicals"
 USA_Go_After_Political_Radicals_desc:0 "A decisive campaign is initiated to counteract the influence of political extremists threatening the fabric of the Empire of America. This effort zeroes in on dismantling radical networks through enhanced intelligence operations, vigilant surveillance, and decisive legal action."
 USA_Go_After_Political_Corruption:0 "Go After Political Corruption"
 USA_Go_After_Political_Corruption_desc:0 "A comprehensive crackdown on political corruption is launched to restore integrity and trust in the government. This initiative targets corrupt officials and practices through rigorous investigations, stricter enforcement of anti-corruption laws, and transparent legal proceedings."
 USA_Change_Parliamentary_Decorum:0 "Change Parliamentary Decorum"
 USA_Change_Parliamentary_Decorum_desc:0 "To elevate the standards of political discourse and restore respect within governmental proceedings, a reform of parliamentary decorum is enacted. This initiative introduces stricter rules of conduct, emphasizing civility, constructive debate, and professional behavior among legislators. By fostering a more respectful and orderly parliamentary environment, the goal is to enhance the effectiveness of legislative processes, encourage bipartisan cooperation, and rebuild public trust in the integrity and functionality of the government."
 USA_The_Lovecraft_Approach:0 "The Lovecraft Approach"
 USA_The_Lovecraft_Approach_desc:0 "Adopting an unconventional strategy named "The Lovecraft Approach," this initiative delves into the enigmatic and often overlooked aspects of governance and societal challenges. Inspired by the investigative and thorough methods of H.P. Lovecraft's protagonists, the approach involves assembling expert task forces to explore complex and deep-rooted issues within the Empire of America. By tackling problems from unique and comprehensive angles, this initiative aims to uncover hidden solutions, address systemic inefficiencies, and promote innovative reforms that contribute to a more resilient and adaptive society."
 USA_An_Olive_Branch_Across_The_Isle:0 "An Olive Branch Across The Isle"
 USA_An_Olive_Branch_Across_The_Isle_desc:0 "In a bid to bridge political divides and foster a spirit of cooperation, a significant effort is launched under the banner "An Olive Branch Across the Isle." This initiative seeks to encourage dialogue and collaboration between differing political factions within the Empire of America. By facilitating bipartisan meetings, joint policy workshops, and cross-party projects, the goal is to reduce polarization and build consensus on key national issues."
 USA_Hand_In_Hand_We_Go_Forward:0 "Hand In Hand We Go Forward"
 USA_Hand_In_Hand_We_Go_Forward_desc:0 "By rallying individuals from diverse backgrounds to join forces, it aims to cultivate a profound sense of national solidarity and community spirit. The goal is to transform the Empire of America into a beacon of cooperation and inclusivity, where progress is driven by the combined efforts of its citizens, paving the way for a resilient and harmonious future."
 USA_Expand_Operations_In_Alaska:0 "Expand Operations In Alaska"
 USA_Expand_Operations_In_Alaska_desc:0 "As a solution to the growing problems in  Alaska, PM Obama announced that his administration will invoke war time powers to greatly expand operations. The goal of this operation will be the capture of Nowa Cumig, and the eventual reintegration of Alaska into the American Union."
 USA_Cumigs_Demise:0 "Cumigs Demise"
 USA_Cumigs_Demise_desc:0 "The Budget of the IIA and CIA will be hugely upgraded in their search for the neo-townerist" 
 USA_Redeploy_To_Alaska:0 "Redeploy To Alaska"
 USA_Redeploy_To_Alaska_desc:0 "Prime Minister Obama's decisive action plan includes the strategic redeployment of military forces to Alaska, marking a significant escalation in the effort to reclaim the region. This redeployment aims to bolster defense capabilities and prepare for the critical operation to capture Nowa Cumig. By mobilizing troops and resources to Alaska."
 USA_Work_With_The_Canadians:0 "Work With The Canadians"
 USA_Work_With_The_Canadians_desc:0 "To enhance the success of the Alaskan operation, Prime Minister Obama forges a strategic alliance with the Kingdom of Canada. This collaboration focuses on leveraging Canadian resources, intelligence, and logistical support to strengthen the military efforts in Alaska."
 USA_Launch_Air_Strikes_From_Canada:0 "Launch Air Strikes From Canada"
 USA_Launch_Air_Strikes_From_Canada_desc:0 "Capitalizing on the strategic alliance with the Kingdom of Canada, Obama authorizes the launch of air strikes from Canadian bases. These precision strikes target key positions in Nowa Cumig and surrounding areas to weaken opposition forces and pave the way for ground operations."
 USA_Cut_Off_Native_Supply_Lines:0 "Cut Off Native Supply Lines"
 USA_Cut_Off_Native_Supply_Lines_desc:0 "As part of the strategic operations in Alaska, Obama will order focused effort to sever the supply lines of opposition forces. This initiative targets the logistical networks that sustain Native resistance, aiming to cripple their ability to operate effectively."
 USA_Take_The_Oil_Rigs:0 "Take The Oil Rigs" 
 USA_Take_The_Oil_Rigs_desc:0 "In a strategic move to gain control over Alaska's vital resources, Prime Minister Obama directs military forces to secure the region's oil rigs. Capturing these assets is essential for disrupting the opposition's economic base and ensuring energy security for the American Union."
 USA_Interrogate_Alaskan_Prisoners:0 "Interrogate Alaskan Prisoners"
 USA_Interrogate_Alaskan_Prisoners_desc:0 "As part of the effort to dismantle opposition forces in Alaska, America authorizes the interrogation of captured Alaskan prisoners. This initiative aims to gather crucial intelligence on enemy plans, supply routes, and stronghold locations."
 USA_Enhance_Our_Techniques:0 "Enhance Our Techniques"
 USA_Enhance_Our_Techniques_desc:0 "To maximize the effectiveness of the Alaskan campaign, a mandate is issued to enhance military and intelligence techniques. This involves integrating advanced technologies, improving training programs, and adopting innovative strategies for combat and intelligence gathering."
 USA_Kidnap_Cumigs_Family:0 "Kidnap Cumigs Family"
 USA_Kidnap_Cumigs_Family_desc:0 "In a controversial but strategic move, operatives are tasked with kidnapping the family of Nowa Cumig. This operation aims to apply psychological pressure on Cumig and destabilize the leadership of the opposition forces. By capturing his family, the goal is to force Cumig into a position of vulnerability, potentially leading to negotiations or a weakening of resistance."
 USA_An_Offer_You_Cant_Refuse:0 "An Offer You Cant Refuse"
 USA_An_Offer_You_Cant_Refuse_desc:0 "In a bid to expedite the end of hostilities and secure the reintegration of Alaska, a high-stakes proposition is presented to Nowa Cumig and his key lieutenants. This offer includes guaranteed safety for Cumig's family, substantial financial incentives, and political concessions."
 USA_Reinstitute_Control_Over_Alaska:0 "Reinstitute Control Over Alaska"
 USA_Reinstitute_Control_Over_Alaska_desc:0 "As a critical starting point in reclaiming Alaska, efforts are concentrated on reestablishing governmental authority and infrastructure in the region. Administrative teams are deployed to oversee the restoration of public services, law enforcement, and essential utilities."
 USA_Investigate_Alaskan_Congressional_Members:0 "Investigate Alaskan Congressional Members"
 USA_Investigate_Alaskan_Congressional_Members_desc:0 "To ensure loyalty and integrity within the governance of Alaska, a thorough investigation of Alaskan congressional members is initiated. This process aims to identify any affiliations or activities that might undermine the reintegration efforts."
 USA_End_Alaskan_Local_Governance_Temporarily:0 "End Alaskan Local Governance Temporarily"
 USA_End_Alaskan_Local_Governance_Temporarily_desc:0 "In a decisive move to stabilize Alaska during its reintegration, local governance is temporarily suspended. This measure aims to streamline administrative control and ensure uniform implementation of federal policies across the region."
 USA_The_Battle_Of_Anchora:0 "The Battle Of Anchora"
 USA_The_Battle_Of_Anchora_desc:0 "The Battle of Anchora is a dramatic showdown in the mission to reintegrate Alaska, pitting determined American forces against entrenched opposition. This crucial engagement targets the heart of resistance - the bustling city of Anchora, a vital stronghold."
 USA_Acquire_The_Alaskan_SDF:0 "Acquire The Alaskan SDF"
 USA_Acquire_The_Alaskan_SDF_desc:0 "Securing control over the Alaskan Self-Defense Force (SDF) is a strategic move to bolster military strength and ensure loyalty within the region. This initiative involves integrating the SDF into the broader American military framework, providing advanced training, and aligning their operations with federal objectives. By acquiring the Alaskan SDF, the goal is to unify command structures, enhance defensive capabilities, and solidify American authority in Alaska."
 USA_Give_Them_Newer_Supplies:0 "Give Them Newer Supplies"
 USA_Give_Them_Newer_Supplies_desc:0 "To ensure the effectiveness and readiness of the newly integrated Alaskan Self-Defense Force (SDF), an immediate upgrade in their equipment and supplies is mandated. This initiative focuses on providing the SDF with the latest military gear, advanced weaponry, and state-of-the-art technology."
 USA_Train_Them_Better:0 "Train Them Better"
 USA_Train_Them_Better_desc:0 "To maximize the capabilities of the Alaskan Self-Defense Force (SDF), an intensive training program is implemented. This initiative aims to elevate the proficiency and effectiveness of the SDF by introducing advanced combat techniques, strategic operations, and modern military doctrines. Experienced trainers and specialized instructors are brought in to conduct rigorous training sessions, ensuring that the SDF is well-prepared for any challenges they might face."
 USA_A_New_Alaskan_Day:0 "A New Alaskan Day"
 USA_A_New_Alaskan_Day_desc:0 "Marking a fresh chapter in Alaska's history, "A New Alaskan Day" symbolizes the successful reintegration of the region into the American Union. This initiative focuses on celebrating the renewed unity and progress achieved through collective efforts."
 USA_Sideline_The_German_Garrison:0 "Sideline The German Garrison"
 USA_Sideline_The_German_Garrison_desc:0 "In a strategic move to assert full American control over Alaska, efforts are directed towards sidelining the German garrison stationed in the region. This initiative involves diplomatic negotiations and tactical maneuvers to reduce the influence and presence of German forces."
 USA_Demand_German_Asset_Withdrawal:0 "Demand German Asset Withdrawal"
 USA_Demand_German_Asset_Withdrawal_desc:0 "To solidify American sovereignty over Alaska, a formal demand is issued for the withdrawal of all German assets from the region. This initiative targets the removal of German military units, economic interests, and intelligence operations."
 USA_Kick_Out_German_Citizens:0 "Kick Out German Citizens"
 USA_Kick_Out_German_Citizens_desc:0 "As part of a comprehensive strategy to reassert full control over Alaska, a directive is issued to expel German citizens residing in the region. This measure focuses on removing foreign nationals who may pose a threat to American sovereignty or be sympathetic to the German garrison."
 USA_End_German_Alaskan_Relations:0 "End German Alaskan Relations"
 USA_End_German_Alaskan_Relations_desc:0 "To fully restore American sovereignty over Alaska, a decisive policy is enacted to sever all diplomatic and economic ties with Germany in the region. This initiative aims to terminate any agreements, collaborations, and dependencies that exist between Alaska and German entities."
 USA_The_Battle_Of_Nome:0 "The Battle Of Nome"
 USA_The_Battle_Of_Nome_desc:0 "Culminating the comprehensive campaign to reclaim Alaska, the Battle of Nome stands as the final and most decisive confrontation. This critical engagement targets the remaining stronghold of opposition forces, aiming to secure total victory and bring an end to the conflict."
 USA_Reintegrate_Alaska_Into_The_Union:0 "Reintegrate Alaska Into The Union"
 USA_Reintegrate_Alaska_Into_The_Union_desc:0 "Following the decisive victories and strategic efforts to reclaim the region, the final step is to formally reintegrate Alaska into the American Union. This process involves re-establishing federal governance, reinstating civil administration, and integrating Alaskan representatives into national political structures."
 USA_For_The_Freedom_Of_Those_Aboard:0 "For The Freedom Of Those Aboard"
 USA_For_The_Freedom_Of_Those_Aboard_desc:0 "With America secured, we now look forward to the expansion of American freedom abroad. Our first priority as a reawakened American giant is to join the Entente as we should have once so long ago. Together with Canada, we will bring peace! justice! and freedom! to this new world we find ourselves in."
 USA_Join_The_Entente:0 "Join The Entente"
 USA_Join_The_Entente_desc:0 "With the Empire of America now stabilized and unified, the focus shifts to expanding American influence and promoting freedom on the global stage. The first priority in this new era is to join the Entente, forging a powerful alliance with Canada and other like-minded nations."
 USA_Liberation_And_Imperialism:0 "Liberation And Imperialism"
 USA_Liberation_And_Imperialism_desc:0 "There are those who suffer under the tyranny of syndicalism still!. We will not allow this to continue, nor will we allow the Internationale to regain its prominence. If it is through a third weltkrieg, or if it is through a series of conflicts, we will carry the torch of freedom and eradicate every last bit of Syndicalism from this planet!"
 USA_Restore_The_Indian_Raj:0 "Restore The Indian Raj"
 USA_Restore_The_Indian_Raj_desc:0 "In a bold move to extend American influence and stabilize South Asia, the decision is made to annex India and restore the Indian Raj. This initiative aims to reestablish a structured and prosperous governance system in India under American oversight. By restoring the Indian Raj, the goal is to bring political stability, economic development, and social reforms to the region."
 USA_Integrate_India_Into_The_American_Commonwealth_Society:0 "Integrate India Into The American Commonwealth Society"
 USA_Integrate_India_Into_The_American_Commonwealth_Society_desc:0 "Following the restoration of the Indian Raj, the next step is to fully integrate India into the American Commonwealth Society. This initiative aims to forge strong political, economic, and cultural ties between India and the American Union. By incorporating India into the Commonwealth, the goal is to promote mutual growth, shared governance, and cooperative development."
 USA_Keep_The_Focus_On_Asia:0 "Keep The Focus On Asia"
 USA_Keep_The_Focus_On_Asia_desc:0 "Building on the restoration of the Indian Raj, efforts now turn to fully integrating India into the American Commonwealth Society. This initiative aims to create robust political, economic, and strategic ties within Asia, fostering a network of cooperation and shared prosperity."
 USA_Subjugate_The_Rising_Sun:0 "Subjugate The Rising Sun"
 USA_Subjugate_The_Rising_Sun_desc:0 "With the aim of securing dominance in Asia, the focus will shift to subjugating the Empire of Japan. This initiative targets the dismantling of Japanese military power and influence in the region. Strategic operations are planned to neutralize key military installations, assert naval supremacy, and undermine Japan's political authority."
 USA_Retake_The_Phillipines:0 "Retake The Phillipines"
 USA_Retake_The_Phillipines_desc:0 "As part of the broader strategy to assert control in Asia, a focused military campaign is launched to retake the Philippines. This operation aims to liberate the islands from any occupying forces and reestablish American sovereignty."
 USA_A_Mandate_Of_South_East_Asia:0 "A Mandate Of South East Asia"
 USA_A_Mandate_Of_South_East_Asia_desc:0 "To consolidate influence and ensure stability in Southeast Asia, a mandate will be established to oversee the governance and development of the region. This initiative aims to bring political order, economic growth, and social reform to the diverse nations within Southeast Asia."
 USA_Pax_Norton_American2:0 "Pax Norton Americana"
 USA_Pax_Norton_American2_desc:0 "The establishment of "Pax Norton Americana" marks a new era of peace and stability across Asia under the influence of the American Union. Named in honor of a visionary leader, this initiative aims to create a comprehensive framework for maintaining order, fostering economic prosperity, and promoting democratic governance throughout the region."
 USA_End_The_Argentinian:0 "End The Argentinian Farce"
 USA_End_The_Argentinian_desc:0 "Focusing on South America, the aim is to bring an end to the Argentinian Farce—a syndicalist regime that threatens regional stability and American interests. This initiative combines military intervention, economic sanctions, and diplomatic efforts to dismantle the syndicalist government and restore democratic order."
 USA_Topple_Mugabes_Regime:0 "Topple Mugabes Regime"
 USA_Topple_Mugabes_Regime_desc:0 "As part of a broader strategy to stabilize and unify the African Federation, efforts are directed towards toppling Robert Mugabe's regime in Zimbabwe. This initiative leverages a mix of covert operations, economic leverage, and support for local resistance movements to dismantle Mugabe's hold on power."
 USA_Expand_The_Focus_Into_Africa_And_The_Middle_East:0 "Expand The Focus Into Africa And The Middle East" 
 USA_Expand_The_Focus_Into_Africa_And_The_Middle_East_desc:0 "Embarking on a bold and transformative strategy, the focus shifts to extending American influence across Africa and the Middle East. This initiative, titled "Project New Dawn," seeks to weave a tapestry of alliances, economic partnerships, and cultural exchanges."
 USA_Topple_The_United_Arabian_Empire:0 "Topple The United Arabian Empire"
 USA_Topple_The_United_Arabian_Empire_desc:0 "Launching a bold and covert initiative, the aim is to dismantle the United Arabian Empire's autocratic regime and pave the way for a democratic transformation in the Middle East. Dubbed "Operation Desert Dawn," this strategy involves a blend of intelligence operations, cyber warfare, and tactical support for revolutionary movements."
 USA_Spread_Democracy_To_Kurdistan:0 "Spread Democracy To Kurdistan"
 USA_Spread_Democracy_To_Kurdistan_desc:0 ""Project Freedom Flame" is launched to bring democratic governance to Kurdistan, a region yearning for self-determination and stability."
 USA_End_The_Socialist_Persian_State:0 "End The Socialist Persian State"
 USA_End_The_Socialist_Persian_State_desc:0 " "Operation Dawn's Light," involves a combination of economic sanctions, covert operations, and support for pro-democracy factions within Persia."
 USA_Pax_Norton_American1:0 "Pax Norton Americana"
 USA_Pax_Norton_American1_desc:0 "Concluding a series of transformative initiatives across Africa and the Middle East, "Pax Norton Americana" marks the establishment of a new era of peace and stability under American guidance. This grand strategy involves consolidating the gains made by toppling autocratic regimes, spreading democracy, and fostering economic development."
 USA_Put_Major_Sanctions_on_The_USBR:0 "Put Major Sanctions on The USBR"
 USA_Put_Major_Sanctions_on_The_USBR_desc:0 "Launching "Operation Iron Grip," an unprecedented sanctions campaign is unleashed against the United Socialist British Republics (USBR). This multifaceted strategy targets the very lifeblood of the USBR's economy—crippling vital sectors such as energy, finance, and trade. By meticulously cutting off access to global markets and financial systems, the aim is to suffocate the USBR's economic engine and erode its authoritarian grip."
 USA_Invite_Portugal_Back_To_The_Entente:0 "Invite Iberian Union To The Entente"
 USA_Invite_Portugal_Back_To_The_Entente_desc:0 "As part of a broader strategy to strengthen international alliances and promote democratic values, a formal invitation will be extended to the Iberian Union to join the Entente."
 USA_KeepThe_Focus_On_Europe:0 "Keep The Focus On Europe"
 USA_KeepThe_Focus_On_Europe_desc:0 "With Germany's collapse leaving a power vacuum at the heart of Europe, the spotlight is now firmly on the unfolding dynamics within the new German state. Whether it's the rise of a Fascist Greater Empire or a Totalist state taking over, this initiative, named "Operation Vigilant Eye," is dedicated to closely monitoring and responding to Germany's actions. By establishing intelligence networks, enhancing diplomatic efforts, and preparing for potential military contingencies, the goal is to ensure that the new German regime does not destabilize the region further."
 USA_Bolster_The_Sardinians:0 "Bolster The Sardinians"
 USA_Bolster_The_Sardinians_desc:0 "In a strategic move to strengthen key European allies, a focused initiative is launched to bolster the Sardinians. This effort, known as "Operation Island Shield," aims to enhance Sardinia's military capabilities, economic stability, and political resilience. By providing advanced military equipment, financial aid, and diplomatic support, the goal is to empower Sardinia as a robust ally in the Mediterranean."
 USA_Coerce_The_French:0 "Coerce The French"
 USA_Coerce_The_French_desc:0 "Aiming to consolidate power and influence in Europe, a strategic initiative is launched to coerce France into alignment with broader geopolitical goals. This operation, dubbed "Operation Gallic Persuasion," employs a mix of diplomatic pressure, economic incentives, and subtle political maneuvers."
 USA_Topple_the_Welsh:0 "Topple The Welsh"
 USA_Topple_the_Welsh_desc:0 "In a bold and decisive effort to reshape the power dynamics within the British Isles, a covert operation is launched to topple the Welsh government. This initiative, known as "Operation Dragon's Fall," involves a combination of intelligence operations, support for internal dissident groups, and strategic economic disruptions. The objective is to destabilize the current Welsh regime, which is seen as an obstacle to regional stability and alignment with broader geopolitical goals. By undermining the government's authority and fostering a climate of political upheaval, the aim is to pave the way for a more favorable administration that aligns with American and Entente interests."
 USA_Pax_Norton_American:0 "Pax Norton Americana"
 USA_Pax_Norton_American_desc:0 "Following the significant shifts in Europe, the establishment of "Pax Norton Americana" marks the beginning of a new era of peace and stability under American leadership. With Germany's collapse and the subsequent power struggles, the focus is on ensuring that the continent does not descend into chaos."
 USA_A_Commonwealth_Decade_Continues:0 "A Commonwealth Decade Continues"
 USA_A_Commonwealth_Decade_Continues_desc:0 "With the election of Ron Dellums, the Commonwealth Party's progressive vision for America is set to continue. Building on the foundations laid by Bernie Sanders, Dellums is committed to further enhancing social welfare, promoting economic equity, and maintaining strong international alliances. This focus signifies the beginning of a new era, marked by ongoing transformation and unity. Under Dellums' leadership, the Commonwealth Party aims to make America a beacon of hope, justice, and prosperity for all. This decade will be one of bold reforms, ensuring that every American has access to the resources they need to thrive, and creating opportunities for a brighter future."
 USA_Aim_For_The_Hearts_Of_The_Peoples:0 "Aim For The Hearts Of The Peoples"
 USA_Aim_For_The_Hearts_Of_The_Peoples_desc:0 "Ron Dellums and the Commonwealth Party recognize that winning the hearts and minds of the people is crucial for sustaining their progressive vision. This focus is dedicated to deepening the connection between the government and its citizens. By launching nationwide campaigns that highlight the benefits of social welfare programs, educational reforms, and economic equity, Dellums aims to foster a strong sense of community and solidarity."
 USA_Carry_On_The_Legacy_Of_Bernie:0 "Carry On The Legacy Of Bernie"
 USA_Carry_On_The_Legacy_Of_Bernie_desc:0 "With Ron Dellums at the helm, the Commonwealth Party remains steadfast in its mission to continue the transformative legacy of Bernie Sanders. This focus is dedicated to honoring Sanders' vision by advancing progressive policies that prioritize social justice, economic equality, and environmental sustainability. Under Dellums' leadership, the Commonwealth Party aims to build upon Sanders' achievements, ensuring that every American benefits from the nation's prosperity."
 USA_Concessions_To_Political_Opponents:0 "Concessions To Political Opponents"
 USA_Concessions_To_Political_Opponents_desc:0 "In a strategic move to foster unity and cooperation within the political landscape, Ron Dellums' administration will extend concessions to political opponents. Recognizing the importance of bipartisan support and the need to bridge ideological divides, this focus aims to build a more collaborative and inclusive government."
 USA_Amend_The_Meyer_Amendment:0 "Amend The Meyer Amendment"
 USA_Amend_The_Meyer_Amendment_desc:0 "In line with the Commonwealth Party's commitment to ensuring equitable representation and justice, Ron Dellums administration will seek to amend the Meyer Amendment. Originally introduced to regulate and oversee specific political processes, the amendment now requires revisions to better align with modern democratic values."
 USA_Reintroduce_College_Tutitions:0 "Reintroduce College Tutitions"
 USA_Reintroduce_College_Tutitions_desc:0 "In an effort to address the growing financial strains on the national budget and ensure the sustainability of higher education, Ron Dellums' administration will reintroduce college tuitions. This focus aims to balance the need for accessible education with the economic realities facing the nation. By reintroducing tuition fees, the administration plans to fund critical educational resources, improve the quality of higher education, and offer targeted financial aid programs to support students from low-income families."
 USA_Introduce_Parliamentary_Term_Limits:0 "Introduce Parliamentary Term Limits"
 USA_Introduce_Parliamentary_Term_Limits_desc:0 "To promote political renewal and prevent the entrenchment of power, Ron Dellums' administration will introduce parliamentary term limits. This aims to enhance democratic governance by ensuring regular turnover in political leadership, fostering fresh perspectives, and reducing the risk of corruption."
 USA_Rescind_USCA_Recognition:0 "Rescind USCA Recognition"
 USA_Rescind_USCA_Recognition_desc:0 "In a decisive shift in foreign policy, Ron Dellums' administration will rescind recognition of the United States of Central America (USCA). This is driven by the need to re-evaluate diplomatic relations and address concerns about the USCA's actions and policies. By withdrawing formal recognition, the administration aims to signal disapproval of the USCA's governance and align America's international stance with its values of democracy and human rights."
 USA_Further_Slash_Government_Budgets:0 "Further Slash Government Budgets"
 USA_Further_Slash_Government_Budgets_desc:0 "In a bold move to reduce the national deficit and streamline public spending, Ron Dellums' administration will implement further cuts to government budgets. This aims to eliminate wasteful expenditures, prioritize essential services, and improve the efficiency of government operations."
 USA_Further_Defund_The_CIA:0 "Further Defund The CIA"
 USA_Further_Defund_The_CIA_desc:0 "In a bold move to reduce the national deficit and streamline public spending, Ron Dellums' administration will implement further cuts to government budgets. This aims to eliminate wasteful expenditures, prioritize essential services, and improve the efficiency of government operations."
 USA_Reduce_Corporate_Taxes:0 "Reduce Corporate Taxes"
 USA_Reduce_Corporate_Taxes_desc:0 "In an effort to stimulate economic growth and attract investment, Ron Dellums' administration will implement a significant reduction in corporate taxes. This aims to create a more business-friendly environment, encouraging companies to expand operations, increase hiring, and invest in innovation."
 USA_Reform_Federal_Criminal_Codes:0 "Reform Federal Criminal Codes"
 USA_Reform_Federal_Criminal_Codes_desc:0 "Ron Dellums' administration is committed to overhauling the federal criminal codes to create a more just and equitable legal system. This aims to address systemic issues within the criminal justice system by revising outdated laws, reducing mandatory minimum sentences, and ensuring fairer sentencing practices."
 USA_Lower_Middle_Class_Taxes:0 "Lower Middle Class Taxes"
 USA_Lower_Middle_Class_Taxes_desc:0 "This plan is designed to increase disposable income for middle-income earners, stimulating consumer spending and boosting economic growth. By lowering the tax burden on the middle class, the administration aims to enhance financial stability, promote economic equality, and ensure that the benefits of prosperity are shared more broadly."
 USA_End_The_use_Of_Private_Prisons:0 "End The Use Of Private Prisons"
 USA_End_The_use_Of_Private_Prisons_desc:0 "This idea seeks to phase out privately-operated correctional facilities, transferring inmates to public institutions that adhere to higher standards of accountability and care. By eliminating private prisons, the administration intends to address issues of abuse, neglect, and financial exploitation within the prison system. This policy underscores the Commonwealth Party's dedication to justice, human rights, and the ethical treatment of incarcerated individuals."
 USA_Lower_The_Federal_Income_Tax:0 "Lower The Federal Income Tax"
 USA_Lower_The_Federal_Income_Tax_desc:0 "Ron Dellums administration will implement a significant reduction in federal income tax rates, aiming to provide immediate financial relief to American families. This is designed to increase disposable income, stimulate consumer spending, and drive economic growth. By lowering the federal income tax, the administration seeks to alleviate the financial burden on working and middle-class citizens, promoting a fairer tax system."
 USA_Bail_Reform_Policies:0 "Bail Reform Policies"
 USA_Bail_Reform_Policies_desc:0 "This new plan aims to eliminate cash bail, reduce pretrial detention, and implement risk assessment tools to ensure that individuals are not unjustly incarcerated due to their inability to pay bail. By reforming bail policies, the administration seeks to address systemic inequalities, reduce jail populations, and ensure that justice is accessible to all, regardless of economic status."
 USA_America_The_Free:0 "America The Free"
 USA_America_The_Free_desc:0 "The Dellums administration is now promising to strengthening the principles of freedom and democracy across the nation. This emphasizes the protection of civil liberties, the expansion of individual rights, and the promotion of democratic values. By advocating for freedom of speech, assembly, and press, the administration aims to foster an open and inclusive society where every citizen can exercise their fundamental rights without fear."
 USA_Incentivize_Community_Gardens:0 "Incentivize Community Gardens"
 USA_Incentivize_Community_Gardens_desc:0 "The Dellums administration is dedicated to promoting sustainable local food systems by encouraging the establishment of community gardens. This provides grants and resources to neighborhoods, fostering a spirit of collaboration and environmental stewardship. Community gardens enhance food security, provide educational opportunities, and beautify urban spaces."
 USA_Expand_Free_Education:0 "Expand Free Education"
 USA_Expand_Free_Education_desc:0 "Determined to break down economic barriers to learning, the Dellums administration plans to significantly widen the scope of free education. This initiative ensures that all Americans, from toddlers to university students, can access quality education without the burden of tuition fees."
 USA_Upgrade_Bernie_Care:0 "Upgrade Bernie Care"
 USA_Upgrade_Bernie_Care_desc:0 "In a bid to enhance the nation's healthcare system, Ron Dellums' administration plans to build upon the foundations laid by Bernie Sanders. The goal is to improve and expand "Bernie Care," ensuring that more Americans have access to affordable, high-quality healthcare."
 USA_Set_Up_Goverment_Grocery_Stores:0 "Set Up Goverment Grocery Stores"
 USA_Set_Up_Goverment_Grocery_Stores_desc:0 "To combat food insecurity and ensure affordable access to nutritious foods, Ron Dellums administration will establish government-operated grocery stores. These stores aim to provide high-quality, low-cost food options to underserved communities, reducing reliance on private markets that often fail to meet the needs of all citizens. By setting up these stores, the administration seeks to address food deserts, improve public health, and support local agriculture."
 USA_Propose_A_Wider_National_Health_System:0 "Propose A Wider National Health System"
 USA_Propose_A_Wider_National_Health_System_desc:0 "Seeking to transform the nation's healthcare landscape, Ron Dellums' administration aims to launch an extensive expansion of the national healthcare system. This ambitious plan includes comprehensive coverage for all citizens, integration of mental health services, and an emphasis on preventive care. By widening the scope of healthcare, the administration aspires to reduce disparities, lower overall healthcare costs, and enhance the quality of medical services."
 USA_End_Food_Deserts:0 "End Food Desserts"
 USA_End_Food_Deserts_desc:0 "Determined to tackle food insecurity and promote equitable access to nutritious foods, the Dellums administration aims to eradicate food deserts across the nation. This initiative focuses on establishing grocery stores in underserved areas, supporting local farmers' markets, and implementing mobile food programs. By addressing food deserts, the administration seeks to ensure that all Americans have access to fresh, healthy food options, regardless of their location."
 USA_Healthcare_Vouchers:0 "Healthcare Vouchers"
 USA_Healthcare_Vouchers_desc:0 "To ensure that every American has access to essential medical services, Ron Dellums' administration introduces healthcare vouchers. These vouchers are designed to provide financial assistance to individuals and families, enabling them to choose their healthcare providers and services. By offering vouchers, the administration aims to increase healthcare accessibility, reduce financial barriers, and empower citizens with the freedom to make informed healthcare choices."
 USA_Expand_Food_Stamp_Programs:0 "Expand Food Stamp Programs" 
 USA_Expand_Food_Stamp_Programs_desc:0 "In an effort to combat hunger and support low-income families, the Dellums administration will significantly expand the national food stamp program. This initiative aims to increase the accessibility and reach of food assistance, ensuring that all citizens have the means to obtain nutritious food. By enhancing the food stamp program, the administration seeks to reduce food insecurity, improve public health, and provide a vital safety net for those in need."
 USA_America_The_Equal:0 "America The Equal"
 USA_America_The_Equal_desc:0 "Dedicated to creating a more just and equitable society, the Dellums administration will implement comprehensive reforms to address systemic inequalities. This focus includes expanding civil rights protections, promoting economic opportunities for marginalized communities, and ensuring equal access to education and healthcare."
 USA_For_A_Free_And_Equal_World:0 "For A Free And Equal World"
 USA_For_A_Free_And_Equal_World_desc:0 "Expanding its progressive vision beyond national borders, the Dellums administration seeks to promote global peace and equality. This emphasizes collaboration with international partners to advance human rights, support democratic movements, and foster economic development. By advocating for a world where freedom and equality are universal, the administration aims to build alliances and support initiatives that reflect these core values."
 USA_Address_The_UN:0 "Address The UN"
 USA_Address_The_UN_desc:0 "Determined to foster international cooperation and advocate for global justice, Ron Dellums will deliver a landmark speech at the United Nations General Assembly. By presenting a compelling vision for worldwide collaboration on human rights, sustainable development, and democratic values, the administration seeks to inspire collective action and build stronger alliances."
 USA_Lay_The_Foundations_Of_A_New_World:0 "Lay The Foundations Of A New World"
 USA_Lay_The_Foundations_Of_A_New_World_desc:0 "Embracing a vision of global harmony and progress, the Dellums administration will take decisive steps to reshape the international order. By promoting cooperation, peace, and sustainable development, the goal is to build a world where nations work together for the common good."
 USA_A_New_UN_Refugee_Agency:0 "A New UN Refugee Agency"
 USA_A_New_UN_Refugee_Agency_desc:0 "While the idea of a society free from war is far from being realized, we can build the foundations of an organization which will better the lives of civilians fleeing war torn countries.\n\nThe UN Refugee Resettlement and Assistance Agency which will be housed in Geneva, Switzerland will be the first agency of its kind solely dedicated to refugees."
 USA_Set_Up_Refugee_Housing_Blocs:0 "Set Up Refugee Housing Blocs"
 USA_Set_Up_Refugee_Housing_Blocs_desc:0 "One of the major activities of UNRRAA will be the maintaining of Refugee housing assistance blocs in several nations where said groups will stay before their asylum claims are processed by the nation of their choice."
 USA_Establish_The_Resettlement_Corps:0 "Establish The Resettlement Corps"
 USA_Establish_The_Resettlement_Corps_desc:0 "Like the somewhat weak Peacekeeping Corps, the Resettlement Corps of the UN will be primarily devoted to civilian evacuation. Proposed by PM Dellums and accepted at the UN General assembly, this new form of a UN military will soon deploy to active warzones and assist civilians in evacuation to designated safe zones where they can hope to begin the process of Resettlement"
 USA_Refugee_Tribunals:0 "Refugee Tribunals"
 USA_Refugee_Tribunals_desc:0 "In response to the global refugee crisis, the Dellums administration will establish Refugee Tribunals in the United States. These tribunals are designed to provide fair and expedited processing of asylum claims, ensuring that refugees receive timely and just decisions. By implementing these tribunals, the administration aims to uphold humanitarian values and strengthen the nation's commitment to protecting those fleeing persecution and conflict."
 USA_End_Statelessness:0 "End Statelessness"
 USA_End_Statelessness_desc:0 "Committed to addressing the plight of stateless individuals, the Dellums administration aims to eradicate statelessness through comprehensive legal and policy reforms. This involves working with international partners to provide legal identity, citizenship, and protection to those without a nationality."
 USA_Assimilation_Courses:0 "Assimilation Courses"
 USA_Assimilation_Courses_desc:0 "To promote social cohesion and cultural integration, the Dellums administration will introduce Assimilation Courses for immigrants and refugees. These courses will focus on language acquisition, civic education, and employment skills, ensuring that newcomers are well-equipped to thrive in their new environment."
 USA_Anti_Nuclear_Efforts:0 "Anti-Nuclear Efforts"
 USA_Anti_Nuclear_Efforts_desc:0 "Committed to promoting global peace and security, the Dellums administration will spearhead a comprehensive anti-nuclear initiative. This focus involves advocating for nuclear disarmament, strengthening non-proliferation treaties, and supporting international efforts to reduce nuclear arsenals. By leading these efforts, the administration aims to diminish the threat of nuclear conflict and work towards a safer, nuclear-free world, underscoring its dedication to global stability and humanitarian values."
 USA_The_Denuclearization_Council:0 "The De-nuclearization Council"
 USA_The_Denuclearization_Council_desc:0 "The Dellums administration will establish the DeNuclearization Council, a global initiative aimed at overseeing and accelerating nuclear disarmament efforts. This council will bring together world leaders, experts, and advocates to develop comprehensive strategies for reducing nuclear arsenals and preventing proliferation."
 USA_From_Bombs_To_Power_Plants:0 "From Bombs To Power Plants"
 USA_From_Bombs_To_Power_Plants_desc:0 "In a groundbreaking initiative to repurpose nuclear technology for peaceful use, the Dellums administration will launch the "From Bombs to Power Plants" program. This project aims to convert decommissioned nuclear warheads into fuel for civilian nuclear power plants. By transforming instruments of war into sources of clean energy, the administration seeks to promote sustainable development, reduce carbon emissions, and ensure a safer world."
 USA_End_Uranium_Enrichment:0 "End Uranium Enrichment"
 USA_End_Uranium_Enrichment_desc:0 "As part of its commitment to global nuclear disarmament and the promotion of peaceful nuclear technology, the Dellums administration will initiate a program to end uranium enrichment. This effort aims to transition from weapons-grade uranium production to non-enriched nuclear materials for energy purposes."
 USA_Shut_Down_Nuclear_Silos:0 "Shut Down Nuclear Silos"
 USA_Shut_Down_Nuclear_Silos_desc:0 "In a bold move towards complete nuclear disarmament, the Dellums administration will initiate the decommissioning and shutdown of all nuclear missile silos. This initiative aims to eliminate the threat of nuclear warfare by safely dismantling these facilities and ensuring that their materials are repurposed or securely disposed of. By shutting down nuclear silos, the administration reinforces its commitment to global peace, security, and the pursuit of a world free from the dangers of nuclear weapons."
 USA_Begin_To_Dismantle_Americas_Arsenal:0 "Begin To Dismantle Americas Arsenal"
 USA_Begin_To_Dismantle_Americas_Arsenal_desc:0 "Emphasizing a commitment to global peace and security, the Dellums administration will initiate the gradual dismantling of America's nuclear arsenal. This comprehensive plan involves safely decommissioning warheads, repurposing nuclear materials for peaceful uses, and collaborating with international bodies to ensure compliance and transparency."
 USA_Building_The_ICJ:0 "Building The ICJ"
 USA_Building_The_ICJ_desc:0 "While the UN has a criminal section, it does not possess any actual power to put those who commit crimes against humanity on trial. The Newly Built International Criminal Justice Courthouse in Los Angeles, California will put those accused of such heinous crimes on trial."
 USA_Interagency_Cooperation:0 "Interagency Cooperation"
 USA_Interagency_Cooperation_desc:0 "With the creation of a new international law system, we will set up framework for agencies to cooperate on extraditing global threats to LA where they will be contained."
 USA_Reopen_Alcatraz:0 "Reopen Alcatraz"
 USA_Reopen_Alcatraz_desc:0 "If the court decides that life in prison is more suitable for this unique type of criminal, then they will be shipped off to the newly reopened "ICJ Prison Facility 001""
 USA_Circumvent_A_Jury_Trial:0 "Circumvent A Jury Trial"
 USA_Circumvent_A_Jury_Trial_desc:0 "To ensure swift and impartial justice for those accused of crimes against humanity, the Dellums administration will implement procedures to circumvent traditional jury trials for cases tried at the International Criminal Justice Courthouse."
 USA_The_Trial_Of_The_Iraqi_Demon:0 "The Trial Of The Iraqi Demon"
 USA_The_Trial_Of_The_Iraqi_Demon_desc:0 "One of the first trials to grace the hall of the ICJC will be that of the infamous "Iraqi Demon" otherwise known as Commander Saddam Hussein.  As a former commander of the Pan-Arab military he was in charge of the multi-year long campaign against Kurdistani rebels during their independence war. With threats of invasion by a global coalition, the Pan-Arab government turnt over Hussein to the Canadian government who in turn have turnt him and his associates over to us."
 USA_The_Trial_Of_The_Ethiopian_Chairman:0 "The Trial Of The Ethiopian Chairman"
  USA_The_Trial_Of_The_Ethiopian_Chairman_desc:0 "Chairman Mengitsu Mariam has been expedited to the ICJ from the African Federation in a show of good will. After fleeing the Ethiopia during their civil war in 1991, Mariam received political asylum in Mugabe's government as the "Legitimate Peoples Government of Ethiopia".\n\nMariam will stand trial where he is accused of genocide, imprisonment of political opponents, and illegal confiscation of property."
 USA_The_Trial_Of_The_Merchant_Of_Death:0 "The Trial Of The Merchant Of Death"
 USA_The_Trial_Of_The_Merchant_Of_Death_desc:0 "Victor Bout, "The Merchant of Death"  has been brought to the ICJC by representatives of the Peoples Tsardom. In a shocking turn of events, Russian Spetznaz forces arrested bout in a Chechnyan compound where was found to be selling weapons to Russian separatist groups.\n\nBout faces charges ranging from illegal selling of weapons all the way to aiding and abetting genocide."
 USA_The_Only_True_Patriots:0 "The Only True Patriots"
 USA_The_Only_True_Patriots_desc:0 "One of the most extreme parties in Imperial history has somehow won the election. Already, the nation is divided, and this does not seem to help. With their extremist calls to return to the olden days of the USA, they are already facing votes of no confidence from every single party. If Clinton is to succeed, he will need to talk a very thin fine line"
 USA_The_Summer_Of_Riots:0 "The Summer Of Riots"
 USA_The_Summer_Of_Riots_desc:0 "There are many groups in the Empire who have taken to the streets in protest of our government with the rallying call of illegitimacy uniting them."
 USA_The_Great_American_Rebirth:0 "The Great American Rebirth"
 USA_The_Great_American_Rebirth_desc:0 "With our enemies complacent we will begin the Great American Rebirth. A Project devised by Bill in college where he envisioned a return to the federalist democracy which America was built upon instead of this farce monarchist government which was built by sedition and treason."
 USA_Restorationist_Campaigns:0 "Restorationist Campaigns"
 USA_Restorationist_Campaigns_desc:0 "Bill Clinton will spearhead a series of Restorationist Campaigns aimed at reviving the traditional values and policies of the old USA. These campaigns will focus on re-establishing the nation's former governmental structures and cultural norms, seeking to unify the country under a common historical identity."
 USA_The_1778_Project:0 "The 1776 Project"
 USA_The_1778_Project_desc:0 "The 1776 Project is a nationalistic overhaul of the education system which will reorient the teachings of America towards the success and benefits of the Old America rather than its failures."
 USA_Rewrite_The_2ACW_Narrative:0 "Rewrite The 2ACW Narrative"
 USA_Rewrite_The_2ACW_Narrative_desc:0 "Clinton's administration will undertake a bold initiative to rewrite the narrative of the Second American Civil War. This aims to reshape the historical perspective on the conflict, emphasizing themes of unity, resilience, and the triumph of democratic values. By revising educational materials, public speeches, and national commemorations, Clinton seeks to foster a renewed sense of national identity rooted in a shared understanding of the past."
 USA_Prime_Minister_To_President:0 "Prime Minister To President"
 USA_Prime_Minister_To_President_desc:0 "Through executive order, Prime Minister Bill Clinton will officially change his title from Prime Minister to President. Andrew Cuomo will officially take the title of Prime Minister."
 USA_The_Great_Congressional_Debate:0 "The Great Congressional Debate"
 USA_The_Great_Congressional_Debate_desc:0 "The Old American Congress was a bipartisan hellhole which consistently led to corruption,  When we reform the USA once again, we will have to either get rid of Parliament or Congress."
 USA_Plans_To_Restore_The_Senate:0 "Plans To Restore The Senate"
 USA_Plans_To_Restore_The_Senate_desc:0 "Clinton's administration will launch an ambitious initiative to re-establish the United States Senate. This effort aims to revive the bicameral legislative system, emphasizing the importance of balanced governance and representation. Clinton envisions the restored Senate as a critical institution for ensuring checks and balances, promoting bipartisanship, and enhancing democratic processes."
 USA_Rebirth_Of_The_Old_Flag:0 "Rebirth Of The Old State Flag"
 USA_Rebirth_Of_The_Old_Flag_desc:0 "After the fall of the Old United States, the Stars and Stripes became associated with yet another tyrannical entity similarly to the Confederate States. But through several political campaigns we can restore the image and glory of the old USA flag, perhaps allowing some states to even fly it again."
 USA_Rebirth_Of_The_Old_State_Flags:0 "Rebirth Of The Old State Flags"
 USA_Rebirth_Of_The_Old_State_Flags_desc:0 "Seeking to restore regional pride and heritage, Clinton's administration will reintroduce historical state flags. By replacing current state symbols with their original counterparts, this initiative celebrates the unique histories and traditions of each state, aiming to strengthen federal-state bonds and promote a shared national spirit rooted in historical continuity."
 USA_Disband_The_ANBC:0 "Disband The ANBC"
 USA_Disband_The_ANBC_desc:0 "The American News Broadcast Channel was a American copy of the Canadian Broadcast Channel in which in the government ran a national news network paid for by taxpayers. We will disband the government corporation and return news broadcasting to private companies."
 USA_Posthumously_Pardon_Macarchur:0 "Posthumously Pardon Macarchur"
 USA_Posthumously_Pardon_Macarchur_desc:0 "In an effort to reconcile with a turbulent past, Bill Clinton's administration will initiate the process to posthumously pardon General Douglas MacArthur. Despite his role in the Second American Civil War and subsequent dictatorial actions that fractured the nation, this pardon seeks to acknowledge his military contributions while addressing the contentious aspects of his legacy."
 USA_Bring_Back_Uncle_Sam:0 "Bring Back Uncle Sam"
 USA_Bring_Back_Uncle_Sam_desc:0 "Seeking to revive a symbol of American patriotism, Bill Clinton's administration will reintroduce Uncle Sam as a prominent figure in national propaganda and public campaigns. This aims to leverage the iconic character to inspire unity, civic duty, and national pride."
 USA_Electoral_Reform:0 "Electoral Reform"
 USA_Electoral_Reform_desc:0 "In a bid to strengthen democracy and ensure fair representation, Bill Clinton's administration will introduce comprehensive electoral reform. This initiative aims to address systemic issues within the electoral process, including gerrymandering, voter suppression, and the influence of money in politics."
 USA_Redraw_Electoral_Districts:0 "Redraw Electoral Districts"
 USA_Redraw_Electoral_Districts_desc:0 "To ensure fair and equitable representation, Bill Clinton's administration will undertake the task of redrawing electoral districts. This initiative aims to eliminate gerrymandering and create districts that reflect true demographic and political diversity. By establishing independent redistricting commissions, the administration seeks to promote transparency and fairness in the electoral process."
 USA_Phase_2_Of_The_Rebirth:0 "Phase 2 Of The Rebirth"
 USA_Phase_2_Of_The_Rebirth_desc:0 "Embarking on the next stage of national revitalization, Bill Clinton's administration will initiate Phase 2 of the Rebirth. This phase focuses on consolidating the gains made during the initial restoration efforts and expanding reforms to further unify the country. Key initiatives include enhancing federal-state cooperation, advancing social and economic policies, and promoting national solidarity through cultural and educational programs."
 USA_Constitutional_Convention:0 "Constitutional Convention"
 USA_Constitutional_Convention_desc:0 "To lay the groundwork for a new era of governance, Bill Clinton's administration will call for a Constitutional Convention. This historic assembly aims to revise and update the United States Constitution, addressing contemporary challenges and ensuring the document reflects modern values and principles."
 USA_Exclude_Monarchist_Sympathizers:0 "Exclude Monarchist Sympathizers"
 USA_Exclude_Monarchist_Sympathizers_desc:0 "In a decisive move to secure the nation's democratic future, Bill Clinton's administration will take steps to exclude monarchist sympathizers from key governmental and military positions. This initiative aims to prevent the influence of anti-democratic elements and ensure that all branches of government are aligned with republican values."
 USA_Reorganize_The_Governments_Powers:0 "Reorganize The Governments Powers"
 USA_Reorganize_The_Governments_Powers_desc:0 "Embracing a vision of modern governance, Bill Clinton's administration will initiate a comprehensive overhaul of government powers. This bold restructuring will clarify roles and responsibilities across federal, state, and local levels, aiming to enhance efficiency, transparency, and accountability."
 USA_Eliminate_The_Senate:0 "Eliminate The Senate"
 USA_Eliminate_The_Senate_desc:0 "Bill Clinton's administration will propose the elimination of the United States Senate. This transformative initiative aims to consolidate legislative power within the House of Representatives, reducing bureaucratic gridlock and ensuring more responsive and agile decision-making."
 USA_Draw_Up_The_New_Articles_Of_Confederation:0 "Draw Up The New Articles Of Confederation"
 USA_Draw_Up_The_New_Articles_Of_Confederation_desc:0 " To lay the foundation for a reimagined federal structure, Bill Clinton's administration will embark on drafting the New Articles of Confederation. This initiative aims to modernize and decentralize the government's framework, promoting greater autonomy for states while ensuring national unity."
 USA_Sideline_Political_Opponents2:0 "Sideline Political Opponents"
 USA_Sideline_Political_Opponents2_desc:0 "In a strategic effort to consolidate power and ensure smooth governance, Bill Clinton's administration will implement measures to sideline political opponents. This initiative aims to neutralize opposition forces that hinder legislative progress and disrupt national unity."
 USA_Take_Over_The_DOJ:0 "Take Over The DOJ"
 USA_Take_Over_The_DOJ_desc:0 "Recognizing the need for stronger centralized control, Bill Clinton's administration will undertake a strategic initiative to take over the Department of Justice (DOJ). This plan focuses on centralizing judicial power, aligning legal enforcement with the administration's policies, and ensuring swift execution of justice. By appointing trusted officials and enacting targeted reforms, Clinton aims to streamline the DOJ's operations, bolster accountability, and diminish the influence of political adversaries."
 USA_Midnight_Arrests:0 "Midnight Arrests"
 USA_Midnight_Arrests_desc:0 "In a dramatic effort to neutralize threats to national stability, Bill Clinton's administration will conduct a series of coordinated midnight arrests targeting key political opponents and dissidents. This strategic operation aims to preemptively disrupt plans to undermine the government's reforms and secure the administration's hold on power."
 USA_Embolden_Rioters:0 "Embolden Rioters"
 USA_Embolden_Rioters_desc:0 "In a controversial move to apply pressure on opposition forces, Bill Clinton's administration will covertly embolden rioters to create chaos within dissident strongholds. This calculated strategy aims to destabilize organized resistance by encouraging civil unrest and diverting attention from government reforms."
 USA_Turn_A_Blind_Eye_To_Threats:0 "Turn A Blind Eye To Threats" 
 USA_Turn_A_Blind_Eye_To_Threats_desc:0 " In a calculated move to maintain focus on key political objectives, Bill Clinton's administration will selectively turn a blind eye to certain external and internal threats. This strategy involves deprioritizing minor issues to allocate resources and attention to more significant challenges facing the nation. By strategically ignoring less critical threats, Clinton aims to streamline governmental efforts, ensuring that the administration can effectively implement its transformative policies and maintain stability during this period of substantial political change."
 USA_Bribe_Media_Outlets:0 "Bribe Media Outlets"
 USA_Bribe_Media_Outlets_desc:0 "In an effort to control the narrative and ensure favorable coverage, Bill Clinton's administration will secretly bribe key media outlets. This clandestine operation aims to secure positive media portrayals and suppress critical reporting that could undermine the administration's agenda. By manipulating media coverage, Clinton seeks to shape public perception, bolster support for his policies, and diminish the influence of opposition voices."
 USA_Stoke_Reactionary_Fires:0 "Stoke Reactionary Fires"
 USA_Stoke_Reactionary_Fires_desc:0 "To further destabilize opposition groups and create a pretext for stronger governmental control, Bill Clinton's administration will covertly stoke reactionary fires. This tactic involves subtly encouraging extreme factions within opposition movements to escalate their activities, thereby inciting chaos and division. By amplifying these reactionary elements, Clinton aims to justify the implementation of more stringent measures and consolidate his administration's power."
 USA_Remove_Opponents_From_Power:0 "Remove Opponents From Power"
 USA_Remove_Opponents_From_Power_desc:0 "Bill Clinton will initiate a comprehensive campaign to remove political opponents from positions of influence. This effort involves identifying and systematically ousting key figures who pose a threat to the administration's agenda. Through a combination of legal actions, political maneuvering, and strategic appointments, Clinton aims to dismantle opposition networks and replace them with loyal supporters."
 USA_Go_Back_On_The_Sanders_Treaties:0 "Go Back On The Sanders Treaties"
 USA_Go_Back_On_The_Sanders_Treaties_desc:0 "Bill Clinton's administration will initiate a review and reversal of the treaties established under Bernie Sanders. These treaties, seen by Clinton as overly compromising and detrimental to national interests, will be renegotiated or nullified. By rolling back these agreements, the administration aims to restore American sovereignty and strengthen its global standing."
 USA_Remilitarize_The_USCA_Border:0 "Remilitarize The USCA Border"
 USA_Remilitarize_The_USCA_Border_desc:0 "In response to escalating tensions and perceived threats from the United States of Central America (USCA), Bill Clinton's administration will take decisive action to remilitarize the border. This initiative involves deploying additional troops, enhancing surveillance, and fortifying border defenses to ensure national security. By strengthening military presence along the USCA border, Clinton aims to deter potential aggressions and protect American sovereignty." 
 USA_Demand_The_Constitutions_Return:0 "Demand The Constitutions Return"
 USA_Demand_The_Constitutions_Return_desc:0 "In a bid to restore democratic norms and legitimacy, Bill Clinton's administration will demand the reinstatement of the original Constitution. This initiative aims to undo the changes made under previous administrations and re-establish the foundational legal framework of the nation."
 USA_Rescind_USCA_Passports:0 "Rescind USCA Passports"
 USA_Rescind_USCA_Passports_desc:0 "To assert national sovereignty and address security concerns, Bill Clinton's administration will rescind the recognition of USCA passports. This action aims to tighten border controls and prevent potential threats from entering the country under false pretenses. By invalidating USCA passports, Clinton seeks to enhance national security and maintain the integrity of the nation's immigration system."
 USA_Blockade_The_Panama_Canal:0 "Blockade The Panama Canal"
 USA_Blockade_The_Panama_Canal_desc:0 "In a strategic move to exert pressure on adversarial forces, Bill Clinton's administration will enforce a blockade of the Panama Canal. This decisive action aims to disrupt the economic and military activities of hostile entities by controlling a critical maritime chokepoint. By blockading the canal, Clinton seeks to assert American dominance, restrict the movements of adversaries, and safeguard national interests."
 USA_Rescind_USCA_Recognition2:0 "Rescind USCA Recognition "
 USA_Rescind_USCA_Recognition2_desc:0 " In a significant diplomatic shift, Bill Clinton's administration will rescind official recognition of the United States of Central America (USCA). This policy change reflects a rejection of the current regime's legitimacy and a commitment to supporting democratic forces within the region. By withdrawing recognition, Clinton aims to isolate the USCA government, apply international pressure, and pave the way for political reforms."
 USA_Abolish_The_Monarchy:0 "Abolish The Monarchy"
 USA_Abolish_The_Monarchy_desc:0 "In a transformative effort to restore the principles of the old United States, Bill Clinton's administration will initiate a bold campaign to abolish the monarchy. This historic move aims to dismantle royal influence and revive the republic, where governance is free from inherited privilege. Clinton envisions this as a return to true democratic values, promoting political equality and ensuring that power lies with the people. By abolishing the monarchy, the administration seeks to rejuvenate the nation's commitment to freedom, democracy, and national unity, echoing the ideals of the original United States."
 USA_Preventing_A_New_Civil_War:0 "Preventing A New Civil War"
 USA_Preventing_A_New_Civil_War_desc:0 "Amidst the fervor for restoring the old United States, Bill Clinton's administration faces the daunting task of averting another civil war. Recognizing the volatile mix of nostalgia and ideological fervor, this initiative focuses on comprehensive conflict prevention strategies. Clinton will establish national reconciliation committees, initiate widespread town hall meetings, and launch media campaigns promoting unity. By addressing deeply rooted divisions and fostering open dialogue, the administration aims to transform potential conflict into a shared vision for the nation's future, ensuring stability and peace during this pivotal transition." 
 USA_A_Peaceful_Ending_At_Midnight:0 "A Peaceful Ending At Midnight"
 USA_A_Peaceful_Ending_At_Midnight_desc:0 "We need to make sure that we do not make the same mistakes of the past, and for that reason we will avoid using the military as means of forcing our agenda."
 USA_The_New_York_Conference:0 "The New York Conference"
 USA_The_New_York_Conference_desc:0 "Prime Minister Clinton has called for all opposition leaders to meet at the Ritz Carlton Hotel in New York City where he aims to negotiate an end to all riots in the Empire. When the Great Rebirth ends, these people will need a place in the new United States."
 USA_Key_Concessions_To_The_Left:0 "Key Concessions To The Left"
 USA_Key_Concessions_To_The_Left_desc:0 "By making key concessions to the left, we can make sure that they will not interfere with our Great American rebirth"
 USA_Key_Concessions_To_The_Right:0 "Key Concessions To The Right"
 USA_Key_Concessions_To_The_Right_desc:0 "Its time we move forward with our agenda."
 USA_The_MacArthur_Route:0 "The MacArthur Route"
 USA_The_MacArthur_Route_desc:0 "Douglas Macarthur was a hero in disguise for the Republic. He believed he could save the republic, yet he did not go far enough in his protectionist ideals. Working with loyalist members of the military, we will launch a pre-emptive coup d-etat of the Greater American Empire and dissolve the Empire."
 USA_Contact_Loyalist_Elements:0 "Contact Loyalist Elements"
 USA_Contact_Loyalist_Elements_desc:0 "We must locate those loyal to our ideals to arrange the new America to begin"
 USA_Arrange_Traffic_Accidents:0 "Arrange Traffic Accidents"
 USA_Arrange_Traffic_Accidents_desc:0 "By carefully arranging several accidents we can effectively shut down the Capital and ensure that if help arrives to this illegitimate city, that it is delayed."
 USA_Take_Parliament_By_Force:0 "Take Parliament By Force"
 USA_Take_Parliament_By_Force_desc:0 "Loyalist elements of the military have taken control of Parliament hill in a bloodless coup d'etat. Members of parliament have been placed under arrest there and Capital Police are having their arms taken."
 USA_Urge_Peace_On_The_News_Networks:0 "Urge Peace On The News Networks"
 USA_Urge_Peace_On_The_News_Networks_desc:0 "Under Our Guidance, major news networks will broadcast a message from Prime Minister Clinton where he will call for peace among this turbulent time."
 USA_A_Military_End_To_These_Protests:0 "A Military End To These Protests"
 USA_A_Military_End_To_These_Protests_desc:0 "With Parliament  out of the way and the media in our pocket, we will use the military to put down these protests against our new government. When all is said and done, we will begin the process of restoring the United States of America to its democratic ways..by any means possible."
 USA_Fast_Forward_The_Rebirth:0 "Fast Forward The Rebirth"
 USA_Fast_Forward_The_Rebirth_desc:0 "We need to move quickly to create our old nation"
 USA_Officially_The_SOL:0 "Officially Recognize The SOL"
 USA_Officially_The_SOL_desc:0 "Originally founded by Arthur MacArthur IV in the 1958 after his families release from house arrest, the Sons of Liberty have been responsible for several terrorist attacks across the decades. In 1982, IIA operatives in conjunction with the Montana National Guard managed to arrest General MacArthurs son.\n\nWith the governments emergency still allowing us some sort of power, we will pardon MacArthur IV and officially sanction the activities of the SOL."
 USA_Extend_The_State_Of_Martial_Law:0 "Extend The State Of Martial Law"
 USA_Extend_The_State_Of_Martial_Law_desc:0 "Allowing our nation to slip into disarray again is not an option. To that end we will extend the order of Martial law indefinitely."
 USA_Deputize_The_SOL:0 "Deputize The SOL"
 USA_Deputize_The_SOL_desc:0 "Functioning as an unofficial police force, the SOL will receive universal deputization to remove the future enemies of our reborn republic."
 USA_LMilitarize_The_Police:0 "Militarize The Police"
 USA_LMilitarize_The_Police_desc:0 "In response to the extension of martial law, Bill Clinton's administration will implement a controversial plan to militarize the police force. This initiative involves equipping law enforcement with military-grade weapons and training to handle civil unrest and enforce order. Clinton believes that a heavily armed police force is necessary to maintain stability and security during this turbulent period."
 USA_Lock_Down_Rebellious_Cities:0 "Lock Down Rebellious Cities"
 USA_Lock_Down_Rebellious_Cities_desc:0 "To quell insurrection and restore order, Clinton's administration will initiate strict lockdowns in rebellious cities. This measure will involve curfews, increased patrols, and the suspension of civil liberties to ensure compliance and prevent further unrest."
 USA_Take_Over_the_National_Guard:0 "Take Over The National Guard"
 USA_Take_Over_the_National_Guard_desc:0 "In a decisive power play, the administration will assert direct control over the National Guard. This maneuver is designed to centralize military power, ensuring that all armed forces are aligned with the government's objectives and capable of enforcing order nationwide."
 USA_OThe_End_Of_Local_Governance:0 "The End Of Local Governance"
 USA_OThe_End_Of_Local_Governance_desc:0 "Marking a significant shift in power, local governance will be dissolved in favor of a unified federal system. This consolidation aims to eliminate fragmented authority and create a cohesive, streamlined government capable of decisive action and national unity."
 USA_One_Government_One_Peoples:0 "One Government One Peoples"
 USA_One_Government_One_Peoples_desc:0 "Embracing the vision of a singular national identity, Clinton's administration will implement policies to unify the populace under one government. This seeks to foster a sense of collective purpose, erasing regional distinctions in favor of a unified national identity."
 USA_End_The_Monarchy:0 "End The Monarchy"
 USA_End_The_Monarchy_desc:0 "To fully realize the vision of a democratic republic, Bill Clinton's administration will initiate the abolition of the monarchy. This historic effort seeks to dismantle royal power structures, symbolically and practically ending centuries of hereditary rule. By abolishing the monarchy, Clinton aims to return to the democratic ideals of the old United States, ensuring that governance is based on the will of the people rather than inherited privilege."
 USA_Burn_The_House_Of_Lords:0 "Burn The House Of Lords"
 USA_Burn_The_House_Of_Lords_desc:0 "Symbolizing the end of aristocratic influence, the administration will oversee the destruction of the House of Lords. This act aims to eradicate remnants of elitism and herald a new era of egalitarian governance, free from the shadows of hereditary power."
 USA_March_On_The_Palace:0 "March On The Palace"
 USA_March_On_The_Palace_desc:0 "In a historic demonstration of power, government forces will march on the imperial palace. This bold move is intended to dismantle the monarchy's physical seat of power, showcasing the administration's commitment to a republic free from royal influence."
 USA_MAttack_The_Parliament:0 "Attack The Parliament"
 USA_MAttack_The_Parliament_desc:0 "In a decisive assault on entrenched political structures, Clinton's administration will orchestrate an attack on the Parliament. This action aims to disrupt and disband opposition, clearing the path for the establishment of a new, unified government framework."
 USA_Hold_The_Emperor_Hostage:0 "Hold The Emperor Hostage"
 USA_Hold_The_Emperor_Hostage_desc:0 "To expedite the transition to a republic, the administration will take emperor Norton hostage. This dramatic measure is intended to force the abdication of the throne, ensuring the swift and uncontested establishment of a democratic government."
 USA_Burn_The_Traitors_Constitution:0 "Burn The Traitors Constitution"
 USA_Burn_The_Traitors_Constitution_desc:0 "As a symbolic gesture to break from the past, the administration will publicly burn the old constitution. This act of defiance against the former regime is intended to inspire national unity and herald the creation of a new, inclusive constitutional framework."
 USA_Ready_The_New_Day:0 "Ready The New Day"
 USA_Ready_The_New_Day_desc:0 "Preparing for a new era, the administration will finalize plans for the transition to a republic."
 USA_Burn_The_Palace_To_The_Ground:0 "Burn The Palace To The Ground"
 USA_Burn_The_Palace_To_The_Ground_desc:0 "In a final act of defiance against monarchical rule, the administration will oversee the complete destruction of the imperial palace. This dramatic gesture is intended to symbolize the end of royal tyranny and the birth of a truly democratic republic."
 USA_The_New_Continental_Congress:0 "The New Continental Congress"
 USA_The_New_Continental_Congress_desc:0 "With the monarchy dismantled, a New Continental Congress will be convened. This assembly will draft a new constitution, setting the foundation for the future of the American republic."
 USA_Our_Land_Will_Be_Redeemed:0 "Our Land Will Be Redeemed"
 USA_Our_Land_Will_Be_Redeemed_desc:0 "After years of environmental neglect, Prime Minister Kaczynski aims to restore the natural beauty of the Empire. This will set the foundation for a new era of ecological restoration, focusing on rehabilitating damaged ecosystems, reforestation, and revitalizing rural communities. It's a bold plan that will challenge the current infrastructure but promises long-term environmental and societal benefits."
 USA_The_Prairie_Legislations:0 "The Prairie Legislations"
 USA_The_Prairie_Legislations_desc:0 "Through a decisive executive order, Kaczynski introduces the Prairie Act, a comprehensive legislative package aimed at transforming the vast prairies into sustainable, self-sufficient regions. This legislation will prioritize renewable energy development, sustainable agriculture, and the establishment of eco-villages that embody the ideals of green libertarianism."
 USA_Build_The_Clean_Energy_Sector:0 "Build The Clean Energy Sector"
 USA_Build_The_Clean_Energy_Sector_desc:0 "As part of the Prairie Act, this accelerates the transition to clean energy by establishing wind farms, solar panels, and other renewable energy sources across the nation. The goal is to reduce dependency on fossil fuels and create a self-sufficient energy grid that supports both urban and rural areas."
 USA_Immediate_Ban_On_Fracking:0 "Immediate Ban On Fracking"
 USA_Immediate_Ban_On_Fracking_desc:0 "Kaczynski enforces a nationwide ban on fracking, despite potential economic backlash. The ban is a significant move towards protecting the environment and public health, signaling the administration's commitment to a sustainable future, even at the cost of short-term economic challenges."
 USA_Solar_Panel_Tax_Breaks:0 "Solar Panel Tax Breaks"
 USA_Solar_Panel_Tax_Breaks_desc:0 "To incentivize the adoption of solar energy, this introduces significant tax breaks for individuals and businesses installing solar panels. The initiative is expected to boost the clean energy sector and reduce the Empire's carbon footprint, while also providing economic relief to eco-conscious citizens."
 USA_The_Walkable_City_Acts:0 "The Walkable City Acts"
 USA_The_Walkable_City_Acts_desc:0 "With the passing of the Walkable City Acts, cities across the Empire will undergo a radical transformation. This legislation mandates the restructuring of urban areas to prioritize pedestrian access, public transportation, and green spaces, reducing the reliance on automobiles and lowering carbon emissions."
 USA_Tear_Down_The_Highway_System:0 "Tear Down The Highway System"
 USA_Tear_Down_The_Highway_System_desc:0 "In a controversial move, Kaczynski orders the dismantling of major highway systems, which have long been symbols of industrial excess. The shifts to replacing these highways with green corridors, bike paths, and community-focused infrastructure that aligns with the new ecological vision."
 USA_Reform_Public_Transport:0 "Reform Public Transport"
 USA_Reform_Public_Transport_desc:0 "The Walkable City Acts will also reform public transportation, making it more efficient, accessible, and environmentally friendly. This will overhaul existing systems, introduce new green technologies, and ensure that public transit becomes the backbone of urban mobility."
 USA_The_Still_Lingering_Effects_of_The_2nd_ACW:0 "The Still Lingering Effects Of The 2nd ACW"
 USA_The_Still_Lingering_Effects_of_The_2nd_ACW_desc:0 "Many towns were devastated during the 2nd American Civil War, and despite previous efforts, these ghost towns remain neglected. The Prairie Act includes provisions to rebuild these towns with a on sustainability and resilience, ensuring that they become thriving communities once more, free from the scars of the past."
 USA_Recycle_Old_Military_Vehicles:0 "Recycle Old Military Vehicles"
 USA_Recycle_Old_Military_Vehicles_desc:0 "The Midwest is littered with relics of the 2nd Civil War. therefore we will send recovery teams to dismantle and recycle old military vehicles, repurposing the materials for civilian use. It's a practical step towards sustainability and a symbolic gesture of moving beyond the Empire's militaristic past."
 USA_Declare_A_Climate_Crisis:0 "Declare A Climate Crisis"
 USA_Declare_A_Climate_Crisis_desc:0 "Recognizing the severity of environmental degradation, Kaczynski formally declares a climate crisis, paving the way for emergency powers to combat ecological threats. This declaration will justify sweeping reforms and stringent measures to protect the environment, positioning the Empire as a global leader in climate action."
 USA_Environmentalism_In_Reason:0 "Environmentalism In Reason"
 USA_Environmentalism_In_Reason_desc:0 "Recognizing the need for balance, this adopts a pragmatic approach to environmentalism, ensuring that green policies are implemented with economic stability in mind. By prioritizing realistic and sustainable initiatives, we aim to safeguard both the environment and the livelihoods of our citizens."
 USA_Americas_High_Speed_Solar_Rail:0 "Americas High Speed Solar Rail"
 USA_Americas_High_Speed_Solar_Rail_desc:0 "With the dismantling of the outdated and environmentally harmful highway system, we now have the opportunity to revolutionize transportation. This initiates the groundwork for America's first high-speed rail system powered entirely by solar energy, reducing carbon emissions and setting a new standard for sustainable travel across the nation."
 USA_Home_Farm_Subsidies:0 "Home Farm Subsidies"
 USA_Home_Farm_Subsidies_desc:0 "To promote sustainable agriculture, this provides subsidies to home farms, encouraging local food production and reducing the environmental impact of large-scale industrial farming."
 USA_Penalize_Inhuman_Meat_Companies:0 "Penalize Inhuman Meat Companies"
 USA_Penalize_Inhuman_Meat_Companies_desc:0 "Recognizing the inhumane practices of some large meat companies, this enforces strict penalties on corporations that fail to meet ethical and environmental standards."
 USA_Subsidize_Synthetic_Production:0 "Subsidize Synthetic Production"
 USA_Subsidize_Synthetic_Production_desc:0 "This promotes the development and production of synthetic alternatives to traditionally farmed meat, reducing the environmental impact of livestock farming. By subsidizing synthetic food production, we move closer to a sustainable and cruelty-free food supply chain."
 USA_Expand_The_Hoover_Damns_Capabililities:0 "Expand The Hoover Damns Capabililities"
 USA_Expand_The_Hoover_Damns_Capabililities_desc:0 "The Hoover Dam, an iconic symbol of American engineering, will be upgraded to harness more renewable energy."
 USA_The_Nevada_Solar_Plants:0 "The Nevada Solar Plants"
 USA_The_Nevada_Solar_Plants_desc:0 "Nevada's vast deserts offer the perfect location for large-scale solar power plants."
 USA_West_Coat_Tidal_Energy_Farms:0 "West Coat Tidal Energy Farms"
 USA_West_Coat_Tidal_Energy_Farms_desc:0 "Harnessing the power of the Pacific Ocean, this involves the construction of tidal energy farms along the West Coast."
 USA_Dismantle_All_Off_Shore_Oil_Rigs:0 "Dismantle All Off Shore Oil Rigs"
 USA_Dismantle_All_Off_Shore_Oil_Rigs_desc:0 "In a bold move to eliminate fossil fuel dependency, this mandates the dismantling of all offshore oil rigs. The initiative aims to end offshore drilling permanently, protecting marine ecosystems and pushing the nation further towards renewable energy sources."
 USA_Ecological_Tax_Breaks:0 "Ecological Tax Breaks"
 USA_Ecological_Tax_Breaks_desc:0 "To incentivize businesses and individuals to adopt eco-friendly practices, this introduces tax breaks for those investing in renewable energy, sustainable technologies, and environmentally friendly operations."
 USA_Ocean_Clean_Up_Efforts:0 "Ocean Clean Up Efforts"
 USA_Ocean_Clean_Up_Efforts_desc:0 "The pollution of our oceans poses a significant threat to marine life and global ecosystems."
 USA_The_Eco_Punk_Era:0 "The Eco Punk Era"
 USA_The_Eco_Punk_Era_desc:0 "Embracing a new cultural movement, this focus marks the dawn of the "Eco-Punk Era," where environmentalism becomes the core of American identity. This movement encourages grassroots activism, sustainable living, and a rejection of consumerism, inspiring a generation committed to ecological preservation and innovation."
 USA_Go_Even_Further:0 "Go Even Further"
 USA_Go_Even_Further_desc:0 "In a bold move, Kaczynski declares that the climate crisis must be addressed with unwavering resolve. This intensifies efforts to reverse environmental damage, prioritizing planet-saving initiatives over economic growth. The message is clear - no sacrifice is too great in the fight to save Earth."
 USA_The_necessary_Coup:0 "The Necessary Coup"
 USA_The_necessary_Coup_desc:0 "Under the cover of darkness, eco-militias and military units coordinated a bold move to seize control of key government buildings and infrastructure across the Empire. As dawn breaks, the operation concludes with the Green Party firmly in power, establishing a new regime focused on environmental sustainability."
 USA_Purge_The_Rebellious_Military:0 "Purge The Rebellious Military"
 USA_Purge_The_Rebellious_Military_desc:0 "Identify and remove disloyal elements within the military to ensure that all forces remain firmly aligned with the new environmental regime."
 USA_Ecologize_Our_Military:0 "Ecologize Our Military"
 USA_Ecologize_Our_Military_desc:0 "Implement eco-friendly practices within the military, such as sustainable energy sources, to align the armed forces with the regime's green principles."
 USA_Imprison_Treacherous_MPs:0 "Imprison Treacherous MP's"
 USA_Imprison_Treacherous_MPs_desc:0 "Arrest and detain Members of Parliament who oppose the regime, ensuring that dissent is swiftly and decisively dealt with."
 USA_Maintain_Control_Of_The_Civilian_Infrastructure:0 "Maintain Control Of The Civilian Infrastructure"
 USA_Maintain_Control_Of_The_Civilian_Infrastructure_desc:0 "Secure key infrastructure to maintain stability and control over civilian activities during the regime's transition."
 USA_Dismantle_Old_Infrastructure:0 "Dismantle Old Infrastructure"
 USA_Dismantle_Old_Infrastructure_desc:0 "Remove outdated and environmentally harmful structures, paving the way for a more sustainable future."
 USA_Replace_Representatives:0 "Replace Representatives"
 USA_Replace_Representatives_desc:0 "Install loyal representatives in positions of power to guarantee unwavering support for the new environmental policies."
 USA_A_Federal_system_Of_Population_Controls:0 "A Federal System Of Population Controls"
 USA_A_Federal_system_Of_Population_Controls_desc:0 "Introduce measures to regulate population growth, balancing human impact with environmental sustainability."
 USA_Empower_The_EPA:0 "Empower The EPA"
 USA_Empower_The_EPA_desc:0 ""
 USA_Ban_The_Trade_Of_Oil_On_American_Soil:0 "Ban The Trade Of Oil On American Soil"
 USA_Ban_The_Trade_Of_Oil_On_American_Soil_desc:0 "Prohibit the extraction and trade of oil within the nation's borders, pushing for alternative energy sources."
 USA_Ban_Hunting:0 "Ban Hunting"
 USA_Ban_Hunting_desc:0 "Implement a nationwide ban on hunting to protect wildlife populations and preserve biodiversity. This legislation will be enforced rigorously, with strict penalties for violators."
 USA_Promote_Synthetic_Alternatives:0 "Promote Synthetic Alternatives"
 USA_Promote_Synthetic_Alternatives_desc:0 "Advocate for the widespread adoption of synthetic alternatives to traditional resources. By reducing dependence on natural products, this initiative aims to preserve ecosystems while encouraging innovation in sustainable industries."
 USA_Expand_StatE_Parks_Protections:0 "Expand State Parks Protections"
 USA_Expand_StatE_Parks_Protections_desc:0 "Strengthen the legal protections for state parks, ensuring that these natural areas are preserved for future generations."
 USA_Ban_The_Use_Of_Commercial_Airlines:0 "Ban The Use Of Commercial Airlines"
 USA_Ban_The_Use_Of_Commercial_Airlines_desc:0 "Phase out the use of commercial airlines to significantly reduce carbon emissions and environmental pollution. This drastic measure will be accompanied by the promotion of alternative, eco-friendly modes of transportation."
 USA_BAN_ANIMAL_TESTING:0 "BAN ANIMAL TESTING"
 USA_BAN_ANIMAL_TESTING_desc:0 "Outlaw all forms of animal testing in scientific research and product development, pushing for the adoption of humane and cruelty-free alternatives."
 USA_Heal_The_World_THROUGH_FORCE:0 "Heal The World..THROUGH FORCE"
 USA_Heal_The_World_THROUGH_FORCE_desc:0 "Deploy military and eco-militias to enforce environmental policies globally, using force where necessary to ensure compliance."
 USA_Ecological_Imperialism:0 "Ecological Imperialism"
 USA_Ecological_Imperialism_desc:0 "Extend the nation's environmental policies beyond its borders, establishing control over foreign lands under the guise of protecting nature."
 USA_Preserve_The_Amazon:0 "Preserve The Amazon"
 USA_Preserve_The_Amazon_desc:0 "Launch a major international initiative to protect the Amazon rainforest, often referred to as the "lungs of the Earth." This campaign involves sending in eco-militias, environmental experts, and resources to enforce conservation laws, halt deforestation, and restore degraded areas."
 USA_The_Beauty_Of_The_Congo_Jungle:0 "The Beauty Of The Congo Jungle"
 USA_The_Beauty_Of_The_Congo_Jungle_desc:0 "Focus on safeguarding the Congo Basin, one of the world's largest and most vital tropical rainforests. This initiative will send teams to work on the ground, employing both diplomatic and forceful means to protect the biodiversity of the region. The plan emphasizes the global importance of the Congo jungle as a habitat for endangered species and a carbon sink."
 USA_Contain_The_Coral_Reefs:0 "Contain The Coral Reefs"
 USA_Contain_The_Coral_Reefs_desc:0 "Implement measures to protect and rehabilitate coral reefs worldwide, essential for marine biodiversity. This includes deploying eco-militias to prevent destructive activities like overfishing and coral mining, as well as investing in restoration projects."
 USA_To_Go_Even_Further:0 "To Go Even Further"
 USA_To_Go_Even_Further_desc:0 "Asserting global dominance in environmental protection, the campaign extends its reach beyond borders, implementing rigorous ecological practices across continents."
 USA_Expand_The_South_America_Preserve:0 "Expand The South America Preserve"
 USA_Expand_The_South_America_Preserve_desc:0 "Secure and expand South America's preserved zones, prioritizing the protection of biodiversity and ecosystems through interventionist policies."
 USA_A_Clean_Sweep_Across_The_South:0 "A Clean Sweep Across The South"
 USA_A_Clean_Sweep_Across_The_South_desc:0 "Conduct comprehensive operations across South America, targeting nations that defy environmental regulations with sweeping measures."
 USA_Punish_Venezuela_And_Colombia:0 "Punish Venezuela And Colombia"
 USA_Punish_Venezuela_And_Colombia_desc:0 "Enforce strict punitive actions against Venezuela and Colombia for environmental transgressions, imposing sanctions and direct intervention."
 USA_Preserve_The_Lands_Of_Darwins_Theses:0 "Preserve The Lands_Of Darwins Theses"
 USA_Preserve_The_Lands_Of_Darwins_Theses_desc:0 "Ensuring the preservation of the lands that inspired Charles Darwin's groundbreaking work on evolution."
 USA_Into_The_Arabic_Lands:0 "Into The Arabic Lands"
 USA_Into_The_Arabic_Lands_desc:0 "Expand ecological oversight into the Middle East, initiating campaigns to establish environmental protection zones in this region."
 USA_Create_The_Middle_Eastern_preservation_Zone:0 "Create The Middle Eastern Preservation Zone"
 USA_Create_The_Middle_Eastern_preservation_Zone_desc:0 "Formulate and enforce an ecological preservation zone within the Middle East, transforming it into a model for sustainable practices."
 USA_End_The_Chinese_Farce:0 "End The Chinese Farce"
 USA_End_The_Chinese_Farce_desc:0 "Target China's environmental violations, launching a concerted effort to expose and dismantle their damaging ecological practices."
 USA_Divide_China:0 "Divide China"
 USA_Divide_China_desc:0 "Implement a strategic plan to divide China into multiple smaller states, each with distinct governance to weaken central authority. The goal is to ensure no single entity can wield significant power, thus preventing any potential threats to global environmental efforts."
 USA_End_The_Western_Terrorizers:0 "End The Western Terrorizers"
 USA_End_The_Western_Terrorizers_desc:0 "Launch a decisive campaign against Western nations identified as threats to global ecological stability. The plan involves dismantling their political and economic influence, weakening their military capabilities, and ensuring they can no longer exploit global resources irresponsibly."
 USA_CreatE_The_Western_Preservation_Zone:0 "Create The Western Preservation Zone"
 USA_CreatE_The_Western_Preservation_Zone_desc:0 "Launch a decisive campaign against Western nations identified as threats to global ecological stability. The plan involves dismantling their political and economic influence, weakening their military capabilities, and ensuring they can no longer exploit global resources irresponsibly."
 USA_Expand_Into_Eastern_Europe:0 "Expand Into Eastern Europe"
 USA_Expand_Into_Eastern_Europe_desc:0 "Commence an expansive campaign to bring Eastern Europe under control, establishing new ecological zones that prioritize sustainability over industrial development. The strategy includes integrating the region into the global environmental governance system, reshaping its economies around renewable energy, and eliminating harmful industries."
 USA_ECreate_The_Eastern_European_Preservation_Zone:0 "Create The Eastern European Preservation Zone"
 USA_ECreate_The_Eastern_European_Preservation_Zone_desc:0 "Establish the Eastern European Preservation Zone as a sanctuary for natural habitats, free from industrial exploitation and urban sprawl. This initiative aims to transform vast regions into protected areas where biodiversity can thrive, and ecosystems can be restored to their natural state."
 USA_DSurrender_To_Our_Wills:0 "Surrender To Our Wills"
 USA_DSurrender_To_Our_Wills_desc:0 "The time has come for the world to yield to our superior vision. Through relentless pressure and unyielding demands, we will bring even the most resistant nations to their knees. This final push will solidify our dominance, ensuring that no force can stand against our global environmental agenda."
 USA_The_Commonwealths_Last_Chance:0 "The Commonwealths Last Chance"
 USA_The_Commonwealths_Last_Chance_desc:0 "Despite the Commonwealth Party's recent political struggles—marked by the failure of Bill P-37 in Parliament and the shelving of the Commonwealth Agenda—the party has pulled off a surprising electoral victory. The re-election has given Stephen King and his party one last opportunity to prove their worth. The future of the Commonwealth Party now hangs in the balance. King must chart a new course to avoid repeating the failures of the past, restore public trust, and ensure the party's survival in a highly divided political landscape."
 USA_The_Broad_Coalition:0 "The Broad Coalition"
 USA_The_Broad_Coalition_desc:0 "With the Commonwealth Party losing its supermajority in the government, Stephen King must now navigate a more fractured political landscape. To ensure the survival and effectiveness of the party's policies, King is forced to reach across the aisle and form alliances with other political factions.\n\nThe most viable coalition partners are Ted Kaczynski's Green Party, which focuses on radical environmentalism and local autonomy, and Hillary Rodham's Liberal Democrats, who champion moderate, liberal reforms. By forging a broad coalition with these left-leaning and environmentally focused parties, King can push through crucial legislation and keep the Commonwealth Party relevant in the rapidly shifting political arena. However, balancing the ideologies and demands of these factions will require careful diplomacy, or risk alienating parts of the Commonwealth's base."
 USA_Distancing_From_Bernie:0 "Distancing From Bernie"
 USA_Distancing_From_Bernie_desc:0 "While Sanders' leadership helped shape the party's identity, his era is now seen as a time of unfulfilled promises and growing disillusionment. Moving forward, the party must forge a new path, free from the shadow of its former leader. However, this decision will not come without consequences. Loyalists who still revere Bernie's vision are likely to feel betrayed, and internal divisions may deepen as the party struggles to balance its past with the need for renewal."
 USA_Revising_Bernies_Financial_Policies:0 "Revising Bernies Financial Policies"
 USA_Revising_Bernies_Financial_Policies_desc:0 "The economic policies of Bernie Sanders left a lasting impact, but not all of them are sustainable in the current economic climate. To rebuild the economy, the Commonwealth Party must revisit these financial strategies and make necessary adjustments."
 USA_Induce_A_Recession:0 "Induce A Recession" 
 USA_Induce_A_Recession_desc:0 "The government is taking a bold and controversial step - deliberately inducing a controlled recession to reset the overheated economy. This risky strategy aims to curb inflation, reduce national debt, and reorient economic priorities."
 USA_Cut_Cost_Across_The_Board:0 "Cut Cost Across The Board"
 USA_Cut_Cost_Across_The_Board_desc:0 "To mitigate the recession's impact, the government will implement broad spending cuts across all sectors. This includes reducing budgets for non-essential programs and tightening the financial belt of federal operations."
 USA_Raise_Taxes_On_The_Rich:0 "Raise Taxes On The Rich"
 USA_Raise_Taxes_On_The_Rich_desc:0 "To help balance the budget during the economic downturn, the government will raise taxes on the wealthy. This policy aims to generate significant revenue to fund essential programs while attempting to maintain social stability."
 USAPull_Back_Foreign_Aid_Packages:0 "Pull Back Foreign Aid Packages"
 USAPull_Back_Foreign_Aid_Packages_desc:0 "In light of domestic financial struggles, the government has decided to cut back on foreign aid. The goal is to redirect funds back into the national economy and focus on internal recovery rather than overseas commitments."
 USA_Invest_In_The_Midwest_Again:0 "Invest In The Midwest Again"
 USA_Invest_In_The_Midwest_Again_desc:0 "Revitalizing the heartland is key to economic recovery. By investing in the Midwest, the government aims to boost industrial output, create jobs, and stabilize the region's economy. This investment plan will prioritize infrastructure, manufacturing, and agriculture, helping to reignite American production from the ground up."
 USA_Decrease_Walll_Street_Regulation:0 "Decrease Wall Street Regulation"
 USA_Decrease_Walll_Street_Regulation_desc:0 "In an effort to spur economic growth and attract investment, the government will roll back regulations on Wall Street. This move aims to create a more business-friendly environment and encourage financial innovation. However, it risks returning to the same conditions that led to past financial crises, and could deepen the divide between rich and poor."
 USA_Lower_Immigration_Requirements:0 "Lower Immigration Requirements"
 USA_Lower_Immigration_Requirements_desc:0 "With an aging workforce and a slowing economy, the government will temporarily lower immigration requirements to bring in more workers."
 USA_Prioritize_American_Production:0 "Prioritize American Production"
 USA_Prioritize_American_Production_desc:0 "With the aim of reducing dependency on foreign goods, the government is prioritizing American production, encouraging local businesses, increasing manufacturing jobs, and stimulating economic growth from within. This push towards economic sovereignty is seen as a patriotic move, but transitioning industries could strain the economy in the short term, testing the resolve of both businesses and workers alike."
 USA_Abolish_Federal_Minimum_Income:0 "Abolish Federal Minimum Income"
 USA_Abolish_Federal_Minimum_Income_desc:0 "In a bold and contentious decision, the government will abolish the federal minimum income, arguing that it stifles economic growth and reduces work incentives. Replacing it with job creation programs and skills training, the administration aims to encourage self-sufficiency among citizens."
 USA_Reinvigorate_American_Exportation:0 "Reinvigorate American Exportation"
 USA_Reinvigorate_American_Exportation_desc:0 "Revitalizing the nation's economic strength, the government is focusing on expanding American exports by opening new markets and promoting U.S. goods on the global stage. A successful campaign could lead to a booming industrial sector, enhancing the country's trade position. However, the strategy carries risks—overreliance on foreign markets could make the economy vulnerable to international fluctuations and trade disputes."
 USA_Cut_NASA_And_Air_Force_Funding:0 "Cut NASA And Air Force Funding"
 USA_Cut_NASA_And_Air_Force_Funding_desc:0 "To reallocate resources toward pressing domestic issues, the government is slashing funding for NASA and the Air Force. This budget reallocation is aimed at diverting funds towards economic recovery and social programs, though it raises concerns about national security and scientific progress. "
 USA_Increase_Welfare_Requirements:0 "Increase Welfare Requirements"
 USA_Increase_Welfare_Requirements_desc:0 "To reduce government spending and encourage a more self-sufficient workforce, welfare eligibility requirements are being tightened. The administration argues that this policy will help redirect funds to those in dire need while promoting employment among able-bodied citizens."
 USA_Demand_Canadian_Repayments:0 "Demand Canadian Repayments" 
 USA_Demand_Canadian_Repayments_desc:0 "With the economy under severe strain, the government is turning to its northern neighbor, demanding the repayment of outstanding debts owed by Canada. Framed as a necessary move to reclaim funds that rightfully belong to the state, this bold step is intended to alleviate some financial pressure on the treasury. However, the aggressive stance risks straining diplomatic relations, potentially provoking economic retaliation or further political tensions with Canada."
 USA_King_Anomics_Works:0 "King Anomics Works"
 USA_King_Anomics_Works_desc:0 "Stephen King's economic policies, dubbed “King-anomics,” are a daring departure from the old Commonwealth financial strategies. As the new policies begin to take effect, the nation is watching closely to see if King's vision can pull the economy back from the brink. Critics are skeptical, but early indicators show mixed results."
 USA_The_Radical_GOP_Problem:0 "The Radical GOP Problem"
 USA_The_Radical_GOP_Problem_desc:0 "Following the re-election of the Commonwealth Party, right-wing factions, led by figures like Bill Clinton and Andrew Cuomo, have grown increasingly restless. These radical GOP members are openly pushing their agenda, including calls to restore the old USA flag, dismantle the Commonwealth, and return to the old order. Their influence threatens to destabilize the nation, and the government must take decisive action to prevent a descent into civil unrest or even civil war."
 USA_Temporary_Political_Measures:0 "Temporary Political Measures"
 USA_Temporary_Political_Measures_desc:0 "In response to the growing unrest from the radical GOP factions, the government is implementing temporary political measures to maintain order. These actions include restricting certain political activities, monitoring extremist communications, and tightening security measures around key government buildings."
 USA_To_be_Extreme_Or_Not_To_be_Extreme:0 "To Be Extreme Or Not To Be Extreme"
 USA_To_be_Extreme_Or_Not_To_be_Extreme_desc:0 "As the radical GOP problem grows, Prime Minister King is faced with a critical choice - should the government take a hardline approach and use all available measures to crush the opposition, or should it exercise restraint, hoping to prevent the situation from escalating into outright conflict? The decision to go extreme could bring quick results but at a significant cost to the nation's democratic values and stability."
 USA_Authorize_A_Witch_Hunt:0 "Authorize A Witch Hunt"
 USA_Authorize_A_Witch_Hunt_desc:0 "Facing growing pressure from the radical GOP, the government has made the decision to authorize a full-scale "witch hunt" targeting key opposition figures like Bill Clinton and Andrew Cuomo. Under the expanded powers granted to the Internal Intelligence Agency (IIA) by the Patriot Act of 2002, agents now have unrestricted access to personal networks, computers, and communications. The IIA will leave no stone unturned, searching for any sign of treasonous activity or criminal behavior."
 USA_Fabricate_Evidence_Against_Cuomo:0 "Fabricate Evidence Against Cuomo"
 USA_Fabricate_Evidence_Against_Cuomo_desc:0 "To ensure the downfall of Andrew Cuomo, the IIA has resorted to fabricating evidence of treason and corruption. This risky and morally dubious strategy is meant to destroy Cuomo's political credibility and sever his ties with the radical GOP."
 USA_The_Cigar_Under_The_Desk:0 "The Cigar Under The Desk"
 USA_The_Cigar_Under_The_Desk_desc:0 "With Bill Clinton firmly in the government's crosshairs, the IIA has begun a covert operation to unearth—or fabricate—scandals and misconduct that would ruin Clinton's political career."
 USA_Request_A_Format_Investigation:0 "Request A 'Formal' Investigation"
 USA_Request_A_Format_Investigation_desc:0 "To cover its tracks and give the IIA's fabricated evidence legitimacy, the government will request a formal investigation into Andrew Cuomo's activities. By engaging in an official inquiry, the administration aims to provide a veneer of legality to the accusations while keeping control of the process behind the scenes."
 USA_Fabricate_All_Findings:0 "Fabricate All Findings"
 USA_Fabricate_All_Findings_desc:0 "In a last-ditch effort to completely discredit the opposition, the government has authorized the IIA to fabricate all findings against key radical GOP leaders, ensuring they are buried under a mountain of incriminating—but false—evidence. "
 USA_Issue_The_Warrants:0 "Issue The Warrants"
 USA_Issue_The_Warrants_desc:0 "With mounting evidence—both fabricated and real—against key radical GOP leaders, the government is ready to take the next step. Warrants have been prepared for the arrest of influential figures such as Bill Clinton and Andrew Cuomo, officially accusing them of treason, corruption, and conspiracy. By issuing these warrants, the government aims to cripple the GOP's leadership and prevent further dissent."
 USA_We_Arent_Savages:0 "We Arent Savages"
 USA_We_Arent_Savages_desc:0 "Despite mounting pressure to use force or fabricate evidence against the radical GOP, Prime Minister King refuses to resort to such extreme measures. Instead, he believes in maintaining the Commonwealth Party's principles by upholding justice and diplomacy. King's government will engage the opposition through dialogue, rather than using underhanded tactics to undermine them."
 USA_Bring_Them_To_The_Table:0 "Bring Them To The Table"
 USA_Bring_Them_To_The_Table_desc:0 "Instead of resorting to fabricating evidence or extreme crackdowns, Prime Minister King has decided to take a diplomatic approach. To stabilize the nation, he has called for a bipartisan political conference in the old Congressional House in Washington, D.C. The goal is to bring GOP leaders like Bill Clinton and Andrew Cuomo to the table in hopes of de-escalating the situation."
 USA_Offer_Concessions:0 "Offer Concessions"
 USA_Offer_Concessions_desc:0 "After tense negotiations with the GOP radicals, Prime Minister King has reluctantly agreed to offer concessions in order to prevent further division and unrest."
 USA_Pray_And_Hope_To_God_They_Comply:0 "Pray And Hope To God They Comply"
 USA_Pray_And_Hope_To_God_They_Comply_desc:0 "With concessions offered and negotiations concluded, all Prime Minister King can do now is wait—and hope that the GOP radicals will honor their part of the agreement. The outcome is far from certain, as the opposition could view these concessions as a sign of weakness and push for more aggressive demands."
 USA_Incorporate_Longist_Populism:0 "Incorporate Longist Populism"
 USA_Incorporate_Longist_Populism_desc:0 "To win back the trust of the American people and regain political influence, the Commonwealth Party needs to adopt a more populist stance. By incorporating elements of Longist Populism, which focuses on addressing the needs of the common worker and empowering local communities, the party hopes to bridge the gap between government and citizens." 
 USA_Re_Establish_Business_Trust:0 "Re-Establish Business Trust"
 USA_Re_Establish_Business_Trust_desc:0 "Under Bernie Sanders, the relationship between the government and the business sector soured, causing many companies to flee or downsize their operations. Now, with the Commonwealth Party back in power, it's time to restore trust in the American economy. By enacting pro-business policies, the government aims to incentivize private sector investment, reintroducing stability and growth to the national economy."
 USA_Introduce_School_Choice:0 "Introduce School Choice"
 USA_Introduce_School_Choice_desc:0 "To revitalize the education system and offer more opportunities for families, the government will implement a School Choice policy, allowing parents to choose where to send their children, whether to public, charter, or private schools."
 USA_Restore_Capitalistic_Fervor:0 "Restore Capitalistic Fervor"
 USA_Restore_Capitalistic_Fervor_desc:0 "The American economy has suffered in recent years, and the only way forward is by fully embracing the tenets of capitalism once again."
 USA_Hand_Out_Small_Business_Grants:0 "Hand Out Small Business Grants"
 USA_Hand_Out_Small_Business_Grants_desc:0 "Small businesses form the backbone of the American economy, and to encourage their growth, the government will begin issuing grants to small enterprises. These funds will provide much-needed capital to entrepreneurs, allowing them to expand and create jobs."
 USA_Establish_Better_Business_Worker_Relations:0 "Establish Better Business Worker Relations" 
 USA_Establish_Better_Business_Worker_Relations_desc:0 "A thriving economy depends on the collaboration between business owners and workers. The government will encourage stronger partnerships between employers and employees, fostering a more cooperative environment through tax incentives and labor reforms that protect workers' rights without stifling business growth."
 USA_Cut_Government_Funding:0 "Cut Government Funding"
 USA_Cut_Government_Funding_desc:0 "In order to reduce the deficit and allow the private sector to flourish, the government will begin cutting back on unnecessary spending in non-essential sectors. By scaling down bloated government programs, more resources can be directed to private businesses and the national debt can be brought under control."
 USA_Eliminate_Redundant_Departments:0 "Eliminate Redundant Departments"
 USA_Eliminate_Redundant_Departments_desc:0 "The government is riddled with bureaucratic inefficiencies and wasteful spending. By eliminating redundant departments and merging overlapping agencies, the administration can streamline government operations and reduce costs."
 USA_Eliminate_Government_Oversight_Boards:0 "Eliminate Government Oversight Boards"
 USA_Eliminate_Government_Oversight_Boards_desc:0 "King has ordered to deregulate the economy and reduce government interference, several oversight boards that monitor industry and commerce will be eliminated. The plan is to allow businesses more freedom to operate without excessive bureaucracy, which will encourage innovation and investment."
 USA_Delegate_More_Power_To_Local_Governments:0 "Delegate More Power To Local Governments"
 USA_Delegate_More_Power_To_Local_Governments_desc:0 "To better address the unique needs of each region, the federal government will delegate more power to state and local governments. This decentralization will enable communities to manage their own affairs more effectively, crafting policies tailored to their specific economic and social conditions."
 USA_Re_Evaluate_Bernies_Social_Programs:0 "Re-Evaluate Bernies Social Programs"
 USA_Re_Evaluate_Bernies_Social_Programs_desc:0 "Many of Bernie Sanders social programs, while well-intentioned, have burdened the economy with excessive costs. The Commonwealth government will reassess these initiatives to determine which ones should be scaled back, reformed, or eliminated entirely."
 USA_Roll_Back_Free_College:0 "Roll Back Free College"
 USA_Roll_Back_Free_College_desc:0 "While the idea of free college under Bernie Sanders administration was popular, it has proven financially unsustainable."
 USA_Incentivize_Private_Healthcare:0 "Incentivize Private Healthcare"
 USA_Incentivize_Private_Healthcare_desc:0 "To reduce the burden on the public healthcare system, the government will introduce incentives for citizens to opt into private healthcare plans. Tax breaks and subsidies will be offered to private healthcare providers, encouraging competition and reducing reliance on state-funded services."
 USA_Add_Term_Limits_To_Parliament:0 "Add Term Limits To Parliament"
 USA_Add_Term_Limits_To_Parliament_desc:0 "To ensure accountability and prevent career politicians from consolidating power, the government will introduce term limits for members of Parliament."
 USA_Expel_Radicals_Out_The_Party:0 "Expel Radicals Out The Party" 
 USA_Expel_Radicals_Out_The_Party_desc:0 "The Commonwealth Party is in danger of fracturing under the influence of radical elements that have infiltrated its ranks. To restore stability and prevent internal collapse, the party must take decisive action by expelling these radicals."
 USA_Lower_Lower_Class_Taxes:0 "Lower Lower-Class Taxes"
 USA_Lower_Lower_Class_Taxes_desc:0 "To alleviate the economic burden on the working class, the government will introduce significant tax cuts for lower-income citizens. This policy is aimed at boosting consumer spending, reducing poverty, and improving the quality of life for millions of Americans."
 USA_Empower_The_IIA:0 "Empower The IIA"
 USA_Empower_The_IIA_desc:0 "With growing internal threats and external pressures, the government will expand the powers of the Internal Intelligence Agency (IIA) to maintain order and protect national security. This move will give the IIA greater authority to monitor and neutralize potential threats, both foreign and domestic."
 USA_The_Mexican_Debacle:0 "The Mexican Debacle"
 USA_The_Mexican_Debacle_desc:0 "The situation in Mexico has spiraled out of control. Years of mismanagement, corruption, and internal strife have left the region in chaos. Now, the government faces a critical decision - how to handle the growing instability south of the border?"
 USA_Attempt_To_Fix_The_Sinking_Boat:0 "Attempt To Fix The Sinking Boat"
 USA_Attempt_To_Fix_The_Sinking_Boat_desc:0 "Mexico is on the verge of collapse, and the situation demands immediate attention. The government will take steps to provide support and stabilize the country before it becomes a full-fledged disaster."
 USA_Promise_To_Leave_Alaska:0 "Promise To Leave Alaska"
 USA_Promise_To_Leave_Alaska_desc:0 "Alaska has long been a point of contention within the American Empire. While it holds strategic value, the costs of maintaining control over the state have become increasingly burdensome."
 USA_Begin_The_Process:0 "Begin The Process"
 USA_Begin_The_Process_desc:0 "Following the promise to leave Alaska, the government will now begin the process of transitioning control of the state."
 USA_Correcting_Bernies_Foreign_Policy:0 "Correcting Bernies Foreign Policy"
 USA_Correcting_Bernies_Foreign_Policy_desc:0 "Bernie Sanders' foreign policy left much to be desired. His idealistic approach often neglected critical geopolitical realities, leaving America vulnerable to external threats. Prime Minister King now has the opportunity to correct these mistakes and craft a foreign policy that strengthens America's global position."
 USA_Re_Establish_American_Domination_Aboard:0 "Re-Establish American Domination Aboard"
 USA_Re_Establish_American_Domination_Aboard_desc:0 "With Bernie's foreign policy corrected, it's time to reassert America's influence around the world. The government will take aggressive steps to expand America's reach, both diplomatically and militarily."
 USA_The_Mexico_Problem:0 "The Mexico Problem"
 USA_The_Mexico_Problem_desc:0 "For decades, Mexico has been a vital agricultural and economic asset to the Empire, often referred to as the "breadbasket of the Americas." However, this essential resource has long been plagued by unchecked corruption, rampant cartel violence, and a puppet government that has served American interests more than its own people."
 USA_Fixing_The_Troubles_Of_Mexico:0 "Fixing The Troubles Of Mexico"
 USA_Fixing_The_Troubles_Of_Mexico_desc:0 "Addressing Mexico's deep-rooted problems requires more than superficial fixes. The Commonwealth government will attempt to establish reforms aimed at rooting out corruption, stabilizing the political system, and reducing the influence of the powerful cartels."
 USA_The_Commonwealth_Initiative:0 "The Commonwealth Initiative"
 USA_The_Commonwealth_Initiative_desc:0 "With growing discontent both in the Empire and Mexico, Prime Minister King's administration is implementing the Commonwealth Initiative, a bold reform to redefine the relationship between Mexico and the American Empire. For the first time since the syndicalist revolts, the Mexican parliament will be granted more control over its own affairs, while Norton IV remains the figurehead."
 USA_New_Parliamentary_Elections:0 "New Parliamentary Elections"
 USA_New_Parliamentary_Elections_desc:0 "For the first time in recent memory, the Mexican people will have the opportunity to elect a new parliament under the Commonwealth system."
 USA_Weed_Out_The_Corrupt_Members:0 "Weed Out The Corrupt Members"
 USA_Weed_Out_The_Corrupt_Members_desc:0 "As part of the Commonwealth reforms, the new Mexican parliament will not only have more control but will also face the challenge of rooting out corrupt officials that have long plagued the system."
 USA_Help_Create_A_Separate_Yucatan_Government:0 "Help Create A Separate Yucatan Government"
 USA_Help_Create_A_Separate_Yucatan_Government_desc:0 "The Yucatán Peninsula has long been a source of tension in Mexico, with separatist movements calling for more autonomy. As part of the Commonwealth's efforts to stabilize the region, the government will consider helping to establish a separate Yucatán government."
 USA_Ensure_The_Right_Of_Return:0 "Ensure The Right Of Return"
 USA_Ensure_The_Right_Of_Return_desc:0 "In order to ease the transition into the Commonwealth system, the government will ensure the Right of Return for displaced Mexicans, allowing them to return to their homes or gain compensation for any land or property lost during the violent years of conflict."
 USA_Free_Migration:0 "Free Migration"
 USA_Free_Migration_desc:0 "As part of the Commonwealth Initiative, free migration will be introduced between the Empire and Mexico. This policy will allow Mexican citizens to live and work freely within the American Empire, and vice versa, effectively breaking down borders between the two nations. The influx of cheap labor into the Empire will boost the economy, but it may also cause tension among American workers who feel their jobs are being taken."
 USA_Dual_Citizenship_Initiatives:0 "Dual Citizenship Initiatives"
 USA_Dual_Citizenship_Initiatives_desc:0 "To further integrate Mexico into the American Commonwealth, dual citizenship will be offered to Mexican and American citizens, allowing for greater mobility and legal equality between the two nations."
 USA_Tether_The_Mexican_Economy_To_America:0 "Tether The Mexican Economy To America"
 USA_Tether_The_Mexican_Economy_To_America_desc:0 "In order to cement control over Mexico, the American government will fully integrate the Mexican economy into its own. This will allow American businesses to dominate Mexican markets while ensuring that the Mexican government remains reliant on American aid and investment."
 USA_Cheap_Mexican_Products:0 "Cheap Mexican Products"
 USA_Cheap_Mexican_Products_desc:0 "With Mexico's economy now fully tethered to America, a flood of cheap Mexican products will be available to the American market. This will benefit consumers and businesses alike, as costs of goods plummet."
 USA_Help_Build_A_Mexican_Military:0 "Help Build A Mexican Military"
 USA_Help_Build_A_Mexican_Military_desc:0 "In order to stabilize Mexico and secure its future, the American government will provide significant support to build a strong Mexican military."
 USA_Help_Build_The_Mexican_Navy:0 "Help Build The Mexican Navy"
 USA_Help_Build_The_Mexican_Navy_desc:0 "To defend Mexico's coasts and ensure the security of vital trade routes, the American government will assist in the development of a modern Mexican navy."
 USA_Keep_American_Royal_Titles:0 "Keep American Royal Titles?"
 USA_Keep_American_Royal_Titles_desc:0 "As Mexico moves toward reform, an important question arises within the Commonwealth government - should the American royal titles in Mexico, established after Norton I declared himself Protector of Mexico, be maintained?"
 USA_Help_Redefine_Provinces:0 "Help Redefine Provinces"
 USA_Help_Redefine_Provinces_desc:0 "As part of the Commonwealth reforms, the government will assist in redefining the internal boundaries and provinces of Mexico to better reflect its new reality. By redrawing administrative lines, the government hopes to create more efficient governance and reduce cartel control in certain regions."
 USA_The_Mexican_Currency_Referendum:0 "The Mexican Currency Referendum"
 USA_The_Mexican_Currency_Referendum_desc:0 "As part of the sweeping reforms to stabilize Mexico, the government has proposed a referendum to decide whether Mexico will fully adopt the American dollar as its official currency."
 USA_Invite_Investors:0 "Invite Investors"
 USA_Invite_Investors_desc:0 "To accelerate this process and stabilize the country's economy, the government will invite foreign investors—particularly from the Empire—to help rebuild Mexico's shattered industries."
 USA_The_Mexican_Referendum:0 "The Mexican Referendum"
 USA_The_Mexican_Referendum_desc:0 "Mexico's future is at a crossroads, and it is time for the people to decide the course of their nation. A national referendum will be held, allowing Mexicans to vote on whether they wish to remain under the Commonwealth's protectorate or pursue independence."
 USA_The_Mexican_Crisis:0 "The Mexican Crisis"
 USA_The_Mexican_Crisis_desc:0 "The Mexican Referendum has ignited a full-blown crisis. Cartels and syndicalist rebels have launched coordinated attacks, storming the Mexican capital and claiming hundreds of lives. The situation has escalated beyond control, and the future of Mexico now hangs by a thread."
 USA_Authorize_Airstrikes:0 "Authorize Airstrikes"
 USA_Authorize_Airstrikes_desc:0 "As the Mexican Crisis worsens, the American military has been authorized to conduct targeted airstrikes on key cartel and rebel positions across Northern Mexico. These airstrikes are intended to soften the enemy's defenses and clear the way for a ground invasion."
 USA_Begin_Phase_1_Of_The_Invasion:0 "Begin Phase 1 Of The Invasion"
 USA_Begin_Phase_1_Of_The_Invasion_desc:0 "With the airstrikes complete, American and loyalist Mexican forces will cross the border into Northern Mexico, initiating Phase 1 of the invasion. Their mission is to secure key cities and cripple the cartel strongholds as quickly as possible."
 USA_Secure_Supply_Lines:0 "Secure Supply Lines"
 USA_Secure_Supply_Lines_desc:0 "As the invasion progresses, ensuring secure supply lines becomes critical to the success of the operation. American forces will work to establish and defend vital supply routes that will keep troops well-fed, equipped, and ready for the long fight ahead."
 USA_Establish_Refugee_Camps:0 "Establish Refugee Camps"
 USA_Establish_Refugee_Camps_desc:0 "The conflict in Mexico has displaced thousands of civilians, many of whom have fled north, crossing into the Empire in search of safety. To address this humanitarian crisis, the American government will establish refugee camps near the border, providing shelter, food, and medical care to those affected by the war."
 USA_Host_The_Mexican_Government_In_Exile:0 "Host The Mexican Government In Exile"
 USA_Host_The_Mexican_Government_In_Exile_desc:0 "With Mexico City under siege, the legitimate government of Mexico will be hosted in the Empire as a government in exile. This provisional government will coordinate with American forces to eventually return to power and re-establish control over Mexico."
 USA_Aid_Mexican_Rebels_With_Weapons:0 "Aid Mexican Rebels With Weapons"
 USA_Aid_Mexican_Rebels_With_Weapons_desc:0 "To further weaken cartel and syndicalist forces, the American government will begin supplying weapons and resources to Mexican rebels fighting against the coalition."
 USA_Begin_Phase_2:0 "Begin Phase 2"
 USA_Begin_Phase_2_desc:0 "The United Coalition will now move deeper into cartel territory, entering Phase 2 of the invasion. The goal is to sweep through cartel-controlled regions, dismantling their operations and driving their forces back into Mexico City."
 USA_Destroy_Mexican_Supply_Warehouses:0 "Destroy Mexican Supply Warehouses"
 USA_Destroy_Mexican_Supply_Warehouses_desc:0 "The backbone of the Cartel-Syndicalist war effort lies in their well-stocked supply warehouses hidden across Mexico. These storage facilities are the lifeline for their military campaigns, housing everything from weapons and ammunition to food and medical supplies."
 USA_Shut_Down_The_Mexican_Electrical_Grid:0 "Shut Down The Mexican Electrical Grid"
 USA_Shut_Down_The_Mexican_Electrical_Grid_desc:0 "American forces will strike at Mexico's electrical grid, plunging large portions of cartel-held territory into darkness."
 USA_Push_Into_Mexico_City:0 "Push Into Mexico City"
 USA_Push_Into_Mexico_City_desc:0 "The final phase of the invasion is upon us. The coalition forces will now launch an all-out assault to retake Mexico City from the Cartel-Syndicalist alliance. This city is the heart of Mexico, and reclaiming it will deal a decisive blow to the opposition. The true democratic government of Mexico, now operating in exile, is ready to return, and once Mexico City is back in their hands, they will be able to reclaim their rightful place."
 USA_The_Tijuana_Conference:0 "The Tijuana Conference"
 USA_The_Tijuana_Conference_desc:0 "With Mexico City secured, the next step is diplomacy. Prime Minister King will meet in Tijuana with representatives from the democratic Mexican government, syndicalist rebels, and the Yucatán Liberation Front to discuss Mexico's future. The objective is clear - rebuild the Mexican state while ensuring it remains a part of the American Commonwealth system."
 USA_A_Change_In_Foreign_Policy:0 "A Change In Foreign Policy"
 USA_A_Change_In_Foreign_Policy_desc:0 "The global political landscape is shifting, and America must adapt to maintain its influence. The King Administration will initiate a comprehensive change in foreign policy, moving away from the old diplomatic frameworks that no longer serve the Empire's goals."
 USA_Rescind_Recognition_Of_The_Peoples_Tsardom:0 "Rescind Recognition Of The Peoples Tsardom"
 USA_Rescind_Recognition_Of_The_Peoples_Tsardom_desc:0 "While some within the administration still push for peace with the People's Tsardom of Russia, the King Administration has made a clear decision. To show solidarity with those who have fled the oppressive regime, America will officially rescind its recognition of the Tsardom."
 USA_Create_The_Community_Of_Exiled_Peoples:0 "Create The Community Of Exiled Peoples"
 USA_Create_The_Community_Of_Exiled_Peoples_desc:0 "To weaken foreign regimes opposed to the American Commonwealth, the King Administration will establish a coalition of exiled governments, known as the "Community of Exiled Peoples." These nations—forced from their homelands by authoritarian regimes—will set up embassies in New York, where they can operate under the protection of America."
 USA_Awaken_The_American_giant:0 "Awaken The American Giant"
 USA_Awaken_The_American_giant_desc:0 "As America strengthens its position on the global stage, it is time to fully awaken the nation's military and economic might. The King Administration will push for military expansion and economic mobilization, ensuring that the Empire stands ready to defend its interests around the world."
 USA_Recognize_The_Israeli_State:0 "Recognize The Israeli State"
 USA_Recognize_The_Israeli_State_desc:0 "To get the Jewish population of the Empire on our side, and to continue a long standing goal of previous prime ministers, the Empire will recognize the Jewish State in madagascar and recognize the further zionist claim to the arabic region of Palestine in the Levant.  In exchange for this recognition, the Jewish state will have to do away with its nationalist government and form a new democratic government representative of the peaceful religion Judaism is."
 USA_Promote_Jewish_Settlement_In_Madagascar:0 "Promote Jewish Settlement In Madagascar"
 USA_Promote_Jewish_Settlement_In_Madagascar_desc:0 "As part of the broader foreign policy shift, the American government will support the promotion of Jewish settlement in Madagascar."
 USA_Welcome_Israel_Into_The_UN:0 "Welcome Israel into the UN"
 USA_Welcome_Israel_Into_The_UN_desc:0 "Having recognized Israel and helped establish it as a democratic state, the American Commonwealth will now push for Israel's full inclusion in the United Nations."
 USA_The_Arabic_Republic_And_Its_Problems:0 "The Arabic Republic and Its Problems"
 USA_The_Arabic_Republic_And_Its_Problems_desc:0 "The Arabic Republic is a volatile and unstable state that has been a constant thorn in the side of American foreign policy. Plagued by internal conflict and radical ideologies, the republic presents both a threat to regional stability and an opportunity for American influence."
 USA_The_United_Coalition_Will_Collapse:0 "The United Coalition Will Collapse"
 USA_The_United_Coalition_Will_Collapse_desc:0 "The fragile coalition holding together the Arabic Republic is on the verge of collapse. Internal tensions between syndicalists, monarchists, and local warlords are rising, and America is poised to exploit this fragmentation."
 USA_Utilize_CIA_Assets:0 "Utilize CIA Assets"
 USA_Utilize_CIA_Assets_desc:0 "To counter the growing instability in the Arabic Republic and other key regions, the King Administration will authorize the use of CIA assets."
 USA_Rescind_USCA_Recognition:0 "Rescind USCA Recognition"
 USA_Rescind_USCA_Recognition_desc:0 "To please some of the more radical conservatives who may try to remove this administration, the Greater American Empire will rescind their recognition of the USCA. Whiile much of Bernies programs with the USCA will remain in place, the overall recognition of such a state will cease."
 USA_Keep_The_Borders_Open:0 "Keep The Borders Open"
 USA_Keep_The_Borders_Open_desc:0 "While the King Administration is moving away from certain socialist policies, it will maintain one critical aspect of Bernie Sanders' legacy - open borders. Keeping the borders open between America and its neighbors is essential to promoting trade, labor movement, and political stability within the region."
 USA_End_The_Exreadition_Treaties:0 "End The Exreadition Treaties"
 USA_End_The_Exreadition_Treaties_desc:0 "The King Administration will end the extradition treaties with several key nations. This decision will give America greater autonomy in handling its own legal affairs, particularly concerning political dissidents and criminals seeking asylum."
 USA_Ignite_The_Arab_Collapse:0  "Ignite The Arab Collapse"
 USA_Ignite_The_Arab_Collapse_desc:0 "America will ignite the collapse of the Arabic Republic"
 USA_The_Lands_Of_Tyrants:0 "The Lands of Tyrants"
 USA_The_Lands_Of_Tyrants_desc:0 "The collapse of the Arabic Republic has left a power vacuum across the region. Various warlords and tyrants will rise to fill the void, each vying for control of the fractured lands."
 USA_Threaten_The_French:0 "Threaten the French"
 USA_Threaten_The_French_desc:0 "Napoleon V's reign may have brought temporary stability to France, but the Commonwealth believes it's time to push the French nation back toward true democracy. By threatening to cut off key economic ties, especially trade, the King Administration hopes to pressure Emperor Bonaparte IV into reforming his government."
 USA_Encourage_A_Second_Visit_To_The_Empire:0 "Encourage a Second Visit to the Empire"
 USA_Encourage_A_Second_Visit_To_The_Empire_desc:0 "Building upon past diplomatic successes, Prime Minister King will invite Emperor Napoleon V to visit America."
 USA_Agree_To_A_Future_Betrothal_Of_Heirs:0 "Agree to a Future Betrothal of Heirs"
 USA_Agree_To_A_Future_Betrothal_Of_Heirs_desc:0 "In a historic move to cement the bond between the American Commonwealth and the French Empire, discussions will begin regarding the betrothal of future heirs. If Napoleon V can produce an heir, an agreement will be reached to marry that heir into the American royal family, further solidifying ties between the two empires."
 USA_Rescind_Recognition_of_The_USBR:0 "Rescind Recognition Of The USBR"
 USA_Rescind_Recognition_of_The_USBR_desc:0 "The time has come to correct the mistakes of past administrations. The King Administration will officially rescind recognition of the United Socialist British Republic (USBR), severing all diplomatic ties. The USBR has long been a supporter of terrorism in mainland Europe, funding insurgent groups and destabilizing American allies. By joining with the Emperor of Canada and King William, America will send a clear message that it will no longer tolerate USBR aggression."
 USA_A_Joint__American_Canadian_USBR_Blockade:0 "A Joint American-Canadian USBR Blockade"
 USA_A_Joint__American_Canadian_USBR_Blockade_desc:0 "With relations between the American Commonwealth, Canada, and the USBR at an all-time low, it is time to tighten the screws. America and Canada will coordinate a naval blockade of USBR-controlled territories, cutting off vital supply routes and crippling the socialist regime's economy."
 USA_Western_Europe_Missile_Defense:0 "Western Europe Missile Defense"
 USA_Western_Europe_Missile_Defense_desc:0 "In light of growing threats from the USBR, the King Administration will push for the installation of "Steel Shield" missile defense systems along the western European coast. These systems will protect the continent from potential ICBM attacks, giving the people of Europe the security they need to resist further USBR aggression."
 USA_The_African_Pretenders:0 "The African Pretenders"
 USA_The_African_Pretenders_desc:0 "The African continent has long been plagued by slavery and human rights abuses, particularly in the United States of Africa (USA). To put an end to these atrocities, America will take a leading role in bringing the African pretenders to justice."
 USA_Call_For_A_UN_Meeting:0 "Call for a UN Meeting"
 USA_Call_For_A_UN_Meeting_desc:0 "The Commonwealth will formally call for an emergency meeting of the United Nations to address the human rights violations occurring in the United States of Africa. "
 USA_Liberate_The_Slaves_Of_Liberia:0 "Liberate the Slaves of Liberia"
 USA_Liberate_The_Slaves_Of_Liberia_desc:0 "The United States of Africa has long exploited the people of Liberia, forcing them into brutal labor conditions and denying them basic human rights. The time for liberation has come. With the support of the United Nations, America, alongside France, Canada, and Spain, will lead an international coalition to invade Liberia and free the enslaved population."
 USA_Leaving_Alaska:0 "Leaving Alaska"
 USA_Leaving_Alaska_desc:0 "To finally solve the Alaskan problem, Prime Minister King has decided to withdraw completely from Alaska. The question now lies in who will take over the oversight of this vast territory - Canada, Japan, or possibly Israel? "
 USA_Finish_The_Democracy_Plan:0 "Finish the Democracy Plan"
 USA_Finish_The_Democracy_Plan_desc:0 "Building on the reforms of former PM Bush, the King Administration will complete the process of establishing democratic institutions in Alaska."
 USA_Bring_The_Nativists_To_The_Table:0 "Bring the Nativists to the Table"
 USA_Bring_The_Nativists_To_The_Table_desc:0 "In an effort to prevent future conflict, American diplomats will meet with representatives of Alaska's native populations to discuss their role in the new Alaskan government. At the heart of these discussions is the question of representation for indigenous communities in the new Alaskan congress."
 USA_Reinforce_Their_Infrastructure:0 "Reinforce Their Infrastructure"
 USA_Reinforce_Their_Infrastructure_desc:0 "To ensure Alaska's stability after America's withdrawal, significant investment will be made to reinforce the territory's infrastructure."
 USA_Sell_Old_Warships:0 "Sell Old Warships"
 USA_Sell_Old_Warships_desc:0 "Several aging American naval vessels that have been docked since the 1970s will be sold to the new Alaskan government to bolster their military capabilities."
 USA_Formally_Leave_Alaska:0 "Formally Leave Alaska"
 USA_Formally_Leave_Alaska_desc:0 "With all preparations complete, the King Administration will formally withdraw from Alaska, granting the territory full independence. President Sarah Palin will thank the American government for its role in establishing Alaskan democracy, and the transition will be marked by a public ceremony. However, the region will remain under the careful watch of the King Administration, which will ensure that Alaska does not fall under the influence of hostile foreign powers."
 USA_Handing_Over_Ownership:0 "Handing over ownership"
 USA_Handing_Over_Ownership_desc:0 "Like Russia once did, we will sell the Alaskan territory to the highest bidder. While we would have liked to give the Alaskans their own form of self determination, the ever present threat of nativist terror continues to hang over the heads of New Yorkers and other Americans alike. To help our economy we will sell the protectorate, pull our equipment and military out while also making sure that the progress towards Alaskan democracy shall not be infringed upon or undone"
 USA_The_Canadian_Dominion:0 "The Canadian Dominion"
 USA_The_Canadian_Dominion_desc:0 "If Canada wins the bid for Alaska, the region will be transformed into the "Dominion of Alaska." Governed by General Philippe Poitier and placed under the symbolic rule of King William, Alaska will maintain some autonomy but remain firmly under Canadian control."
 USA_The_Japanese_Protectorate:0 "The Japanese Protectorate"
 USA_The_Japanese_Protectorate_desc:0 "Should Japan win the Alaskan bidding war, Alaska will be transformed into a protectorate of the Japanese Empire. All American military supplies will be withdrawn, and the Japanese government will take over the prisons and civil governance of the region."
 USA_The_Bastion_Of_New_Zion:0 "The Bastion of New Zion"
 USA_The_Bastion_Of_New_Zion_desc:0 "If Israel is selected to take over Alaska, the region will become the "Bastion of New Zion," a secure refuge for Jewish settlers. The oil-rich lands of Alaska will be shared with Israel, and all religious freedoms will be protected under the new government."
 USA_Draw_Up_The_Oil_Treaties:0 "Draw Up the Oil Treaties" 
 USA_Draw_Up_The_Oil_Treaties_desc:0 "As part of the transition to the new government in Alaska, America will negotiate a series of oil treaties with the new ruling power—whether it be Canada, Japan, or Israel. These treaties will ensure that America retains access to Alaskan oil reserves, securing a vital energy supply for the Empire."
 USA_Ensure_Secular_Rights:0 "Ensure Secular Rights"
 USA_Ensure_Secular_Rights_desc:0 "One of the major reasons Towner revolted during the Second ACW was the dissolution of Alaskan native rights and traditions. When we hand the keys over to Israel we will respect Jewish religious soverignty but we will contractually obligate them to also grant equal rights to all who stay in Alaska."
  USA_A_Formal_Handover_At_Elmendorf:0 "A Formal Handover at Elmendorf"
 USA_A_Formal_Handover_At_Elmendorf_desc:0 "Elmendorf Air Force Base, one of the largest military installations in Alaska and the home of the infamous Area 46, will be officially handed over to the new ruling power—whether it be Canada, Japan, or Israel."
 USA_Turn_Over_Elmendorf_AFB:0 "Turn Over Elmendorf AFB" 
 USA_Turn_Over_Elmendorf_AFB_desc:0 "Elmendorf Air Force Base, Alaska's most significant military installation, will be formally turned over to the new government. As a show of goodwill, all American military assets, hardware, and classified data will be removed or destroyed before the handover"
 USA_Peaceful_Handover_Of_Prisoners:0 "Peaceful Handover of Prisoners"
 USA_Peaceful_Handover_Of_Prisoners_desc:0 "s part of the withdrawal from Alaska, America will peacefully hand over control of all prisoners held in Alaskan facilities. This includes both common criminals and political prisoners. The new ruling power will take responsibility for the treatment and rehabilitation of these prisoners, under agreements that uphold human rights standards."
 USA_Finalize_The_Deal:0 "Finalize the Deal"
 USA_Finalize_The_Deal_desc:0 "The final stage in the handover process will see America complete all diplomatic agreements with Canada"
 USA_Withdraw_All_Supplies:0 "Withdraw All Supplies"
 USA_Withdraw_All_Supplies_desc:0 "In preparation for Japan's assumption of control, all American military supplies, assets, and personnel will be fully withdrawn from Alaska."
 USA_Handover_The_Prisons:0 "Handover the Prisons" 
 USA_Handover_The_Prisons_desc:0 "All prison facilities in Alaska will be formally transferred to the Japanese government. This includes the management of both civil and political prisoners, with  Japan taking full responsibility for the administration and security of the facilities."
 USA_Ensure_Civilian_Rights:0 "Ensure Civilian Rights"
 USA_Ensure_Civilian_Rights_desc:0 "In an effort to maintain peace and stability in Alaska, Japan will be required to guarantee the protection of civilian rights, particularly for the native populations."
 USA_The_Ol_Star_Spangled_Banner:0 "The Ol' Star Spangled Banner?"
 USA_The_Ol_Star_Spangled_Banner_desc:0 "With all other offers rejected, Prime Minister King is left with one final, controversial option: selling the Alaskan protectorate to the United States of Central America (USCA)."
 USA_Welcome_The_American_Army_Again:0 "Welcome the American Army... Again?"
 USA_Welcome_The_American_Army_Again_desc:0 "To help secure the city of Anchorage for the USCA's President and American PMS visit, the USCA has sent their secret service alongside a detachment of USCA marines to help secure the city against any opportunistic terrorists."
 USA_Ensure_Native_Representation:0 "Ensure Native Representation"
 USA_Ensure_Native_Representation_desc:0 "With the USCA fully intending to annex Alaska into their union, we have made sure that the mistakes of the previous USA and the tyranny of the FBI regime will not be repeated. The native groups will receive protections and representation in the USCA congress."
 USA_A_Symbolic_Handover_in_Anchorage:0 "A Symbolic Handover in Anchorage"
 USA_A_Symbolic_Handover_in_Anchorage_desc:0 "The final step in the process will be the official handover of Alaska to the USCA, with a grand ceremony planned in Anchorage. Representatives from both governments will attend, including the USCA's president and the American prime minister."
 USA_A_New_Kind_of_President:0 "A New Kind of President"
 USA_A_New_Kind_of_President_desc:0 "They had their turn. The billionaires. The elites. The traitors. Now it's YOUR turn. I'm here to take back your country — and I'll tear apart anyone who stands in the way."
 USA_Ignite_the_Class_War:0 "Ignite the Class War"
 USA_Ignite_the_Class_War_desc:0 "The time for polite negotiations is over. Trump will tear down the billionaire class with the same ferocity he once used to build his empire. This is not a time for moderation. It is a time for battle. The factories, the farms, the forgotten towns — all must rise against the lords of Wall Street. The Class War begins now—and Trump leads the charge."
 USA_The_Working_Class_Rises:0 "The Working Class Rises"
 USA_The_Working_Class_Rises_desc:0 "The factories, the mines, the forgotten towns — they roar back to life. Trump becomes the voice of the blue-collar army, pledging "Never again will Wall Street steal your future.""
 USA_The_Billionaire_Betrayal:0 "The Billionaire Betrayal"
 USA_The_Billionaire_Betrayal_desc:0 "From the Rose Garden, Trump names his enemies live on national TV — Bezos, Gates, all of Corporate America. The era of untouchable oligarchs is over. Warrants are prepared. Investigations launched"
 USA_Corporate_Tyranny_Must_Fall:0 "Corporate Tyranny Must Fall"
 USA_Corporate_Tyranny_Must_Fall_desc:0 "The Justice Department will become a war machine, breaking monopolies and smashing conglomerates that dared strangle the American dream"
 USA_The_Republican_Party_Revolution:0 "The Republican  Party Revolution"
 USA_The_Republican_Party_Revolution_desc:0 "Trump cleans house, expelling corporate Republicans. The party of republicans friends with CEO's and Wall Street becomes the party of factories, fields, and families"
 USA_The_American_Labor_Army:0 "The American Labor Army"
 USA_The_American_Labor_Army_desc:0 "Union rights are declared sacred. Mass mobilization begins to build a new economy — "If you want a job, you'll have one. If you work, you'll thrive"
 USA_The_Peoples_Infrastructure_Act:0 "The People's Infrastructure Act"
 USA_The_Peoples_Infrastructure_Act_desc:0 "Roads, bridges, railroads, green energy — the economy is hurled into overdrive. Trump promises: "We will build faster, stronger, better than ever before!""
 USA_The_Green_Cities_Initiative:0 "The Green Cities Initiative"
 USA_The_Green_Cities_Initiative_desc:0 "Donald Trump has ordered a second infrastructure wave: eco-cities, carbon-free zones, smart highways. America will become the greenest industrial superpower on Earth"
 USA_The_Peoples_Internet:0 "The People's Internet"
 USA_The_Peoples_Internet_desc:0 "The government has announced it will create free nationalized internet, providing high-speed access to all, owned by the people, banning corporate control"
 USA_National_Service_for_the_Youth:0 "National Service for the Youth"
 USA_National_Service_for_the_Youth_desc:0 "Youth programs launched: work in infrastructure, green energy, healthcare, or join the American Labor Army. A rite of passage into the People's Empire."
 USA_Reform_BernieCare:0 "Reform BernieCare"
 USA_Reform_BernieCare_desc:0 "Berniecare may look like universal healthcare but is far from it. Parts of the health department are still privatised and only functions for urgent free care. Now Trump will establish a system where ALL care is free, from health and care to dental and eye care."
 USA_Housing_for_All_Act:0 "Housing for All Act"
 USA_Housing_for_All_Act_desc:0 "Trump has declared housing a human right. Federal programs build free housing projects, renovate abandoned towns, and offer low-rent apartments for all Americans."
 USA_Universal_Childcare_and_Family_Support:0 "Universal Childcare and Family Support"
 USA_Universal_Childcare_and_Family_Support_desc:0 "Government-funded childcare, free parental leave, family stipends. Strengthening the American family becomes a core policy of Trump's New America"
 USA_The_Great_Education_Renewal:0 "The Great Education Renewal"
 USA_The_Great_Education_Renewal_desc:0 "Trump declares a “War on Ignorance.” Free universities, reformed curriculums, patriotic civic education to build the next generation of American heroes"
 USA_The_New_American_Consensus:0 "The New American Consensus"
 USA_The_New_American_Consensus_desc:0 "The walls between the economy and society have been torn down. Industry serves the people. Society strengthens the industry. America is reborn as a single, unified engine of prosperity, patriotism, and human achievement"
 USA_The_Great_Wealth_Tax:0 "The Great Wealth Tax"
 USA_The_Great_Wealth_Tax_desc:0 "Assets of billionaires are seized and redistributed to fund housing, education, healthcare, and jobs. "Their stolen fortune belongs to you.""
 USA_Economic_Liberation_Day:0 "Economic Liberation Day"
 USA_Economic_Liberation_Day_desc:0 "Trump has proclaimed a national holiday: "Economic Liberation Day." It marks the dismantling of corporate power. Celebrations erupt across cities and towns. For the first time in living memory, the economy belongs to the people — not the billionaires."
 USA_The_Peoples_Federal_Reserve:0 "The People's Federal Reserve"
 USA_The_Peoples_Federal_Reserve_desc:0 "The Federal Reserve is no longer an independent plaything for Wall Street. Trump seizes full control, tying the fate of monetary policy directly to worker prosperity. Interest rates, investment policy, currency stability — all now serve the people's needs"
 USA_The_Billionaire_Tax_Blitz:0 "The Billionaire Tax Blitz"
 USA_The_Billionaire_Tax_Blitz_desc:0 "Trump has unleashed a massive new tax regime: 80–90% marginal tax rates on the ultra-wealthy, massive tariffs on luxury goods, and national fees on "speculative" activities. Amazon, Facebook, Google, and their peers are slammed overnight"
 USA_The_Corporate_Insurrection:0 "The Corporate Insurrection"
 USA_The_Corporate_Insurrection_desc:0 "In secret meetings and backroom deals, Big Tech and the remnants of Wall Street plot their revenge. They file lawsuits, organize lobbyists, pressure international courts—and even push tech "service charges" against Trump's government to slow down the revolution."
 USA_The_Economic_Liberation_Act:0 "The Economic Liberation Act"
  USA_The_Economic_Liberation_Act_desc:0 "Moving forward we will break up the biggest monopolies, Criminalizes predatory lobbying and force mandatory worker seats on corporate boards"
 USA_Seize_the_Means_of_Innovation:0 "Seize the Means of Innovation"
 USA_Seize_the_Means_of_Innovation_desc:0 "Big Tech tried to fight Trump with lawsuits and "usage taxes"? Fine. Trump nationalizes key patents, research labs, and tech infrastructures. The Internet, AI research, and communications satellites now belong to the people. "We built it. We paid for it. And now we OWN IT. Innovation belongs to America again!""
 USA_We_built_it_We_bought_it_We_OWN_it:0 "We built it. We bought it. We OWN it"
 USA_We_built_it_We_bought_it_We_OWN_it_desc:0 "The biggest industries — oil, railroads, banking, aerospace — are still too important to leave in private hands. Trump will sign sweeping emergency orders nationalizing them all. Boeing becomes The People's Aeronautics Authority. JPMorgan becomes The People's Bank of America"
 USA_The_American_Peoples_Triumph:0 "The American People's Triumph"
 USA_The_American_Peoples_Triumph_desc:0 "After a brutal struggle, Trump's MAFA Agenda has succeeded. The elites are broken, the economy rebuilt, and the working class stands supreme. The Empire of America enters a new golden age — forged by the people, for the people. Now, the world awaits." 
 USA_The_Peoples_Referendum_Monarchy_Or_Republic:0 "The Peoples Referendum Monarchy Or Republic"
 USA_The_Peoples_Referendum_Monarchy_Or_Republic_desc:0 "In an unprecedented move, Prime minister Trump has called for a national referendum: Should America continue honoring Emperor Norton's ancient line, or cast off the monarchy and become a full People's Republic?"
 USA_A_Peoples_Empire_Reborn:0 "A People's Empire Reborn"
 USA_A_Peoples_Empire_Reborn_desc:0 "The people choose to honor Norton's legacy — but on Trump's terms. A monarchy of the people, for the people. The Crown survives — but serves the revolution"
 USA_Fight_In_The_Halls_Of_Power:0 "Fight in the Halls of Power"
 USA_Fight_In_The_Halls_Of_Power_desc:0 "Trump has rallied working-class Congressmen, labor unions, and new left-wing populists to pass bills against the corporate elite — even against royal advisors warnings"
 USA_The_Billionaire_Lawsuits:0 "The Billionaire Lawsuits"
 USA_The_Billionaire_Lawsuits_desc:0 "Big Tech, Big Pharma, and Big Bank have decided to file massive lawsuits against Trump's administration. Court battles rage across the Empire."
 USA_Compromise_To_save_The_Revolution:0 "Compromise to Save the Revolution" 
 USA_Compromise_To_save_The_Revolution_desc:0 "Trump has chosen negotiation: compromise with monarchists and CEOs to preserve stability. But he will sacrifice some policies in exchange for peace — but risks betraying his base"
 USA_A_Fractured_Populist_Front:0 "A Fractured Populist Front"
 USA_A_Fractured_Populist_Front_desc:0 "Trump's hardcore supporters feel betrayed. Protests erupt accusing him of "selling out." The revolution fractures internally"
 USA_The_Day_Of_Broken_Faith:0 "The Day of Broken Faith"
 USA_The_Day_Of_Broken_Faith_desc:0 "Enraged by perceived betrayal, millions of MAFA supporters march on government centers. Parliament buildings are besieged. Workers' strikes freeze cities."
 USA_The_Long_Walk_Alone:0 "The Long Walk Alone"
 USA_The_Long_Walk_Alone_desc:0 "As protests rage across cities, Trump's own congressional allies begin deserting him. Parliament sessions are half-empty. Cabinet seats sit vacant.Old loyalists refuse to answer calls. The People's Empire looks into a void. Trump stands almost alone — one man against the tide."
 USA_The_Empire_Without_A_Crown:0 "The Empire Without a Crown"
 USA_The_Empire_Without_A_Crown_desc:0 "Trump refuses to surrender. He rules alone — unsupported, embattled, the last soldier of the Revolution. The People's Empire becomes an increasingly hollow throne, its leader isolated by his own victory."
 USA_The_Second_Revolution_Ventura_Ascends:0 "The Second Revolution: Ventura Ascends"
 USA_The_Second_Revolution_Ventura_Ascends_desc:0 "Trump resigns in a televised, tearful but defiant speech: "We built the future, folks. But every future needs new hands to guide it." Jesse Ventura is sworn in as the new Leader of the People's Commonwealth. The Revolution is saved — at great cost."
 USA_The_Republic_Rises_Again:0 "The Republic Rises Again"
 USA_The_Republic_Rises_Again_desc:0 "The People have spoken — and the crown is retired. Trump proclaims a new American Republic, forged by revolution and led by the working class."
 USA_The_American_Crown_Falls:0 "The American Crown Falls"
 USA_The_American_Crown_Falls_desc:0 "The People have spoken — and the crown is retired. Trump proclaims a new American Republic, forged by revolution and led by the working class."
 USA_America_First_World_Next:0 "America First, World Next"
 USA_America_First_World_Next_desc:0 "We saved America. Now we save the world. They can join us... or be left behind"
 USA_Dealing_With_The_USBR:0 "Dealing With the U.S.B.R."
 USA_Dealing_With_The_USBR_desc:0 "The U.S.B.R is a thorn in our side  and now we must finally deal with the annoying menace by showing we mean force and have them either accept or feel our wrath of fury"
 USA_Operation_Grand_Stand:0 "Operation Grand Stand"
 USA_Operation_Grand_Stand_desc:0 "Mass rallies, live broadcasts, UN speeches — Trump paints Blair as a cowardly dictator to the entire world"
 USA_Summit_Or_Siege:0 "Summit or Siege"
 USA_Summit_Or_Siege_desc:0 "Blair's regime must choose: diplomacy or isolation. Trump prepares for both outcomes"
 USA_The_Handshake_Heard_Around_the_World:0 "The Handshake Heard Around the World"
 USA_The_Handshake_Heard_Around_the_World_desc:0 "In Switzerland , Trump and Blair meet in the most dramatic summit of the century. Peace... or betrayal?"
 USA_The_Walls_Of_London_Will_Crack:0 "The Walls of London Will Crack"
 USA_The_Walls_Of_London_Will_Crack_desc:0 "Trump launches full-scale economic warfare: sanctions, propaganda, cyber-warfare. Englands isolation deepens"
 USA_Extend_The_Hand_Of_Brotherhood:0 "Extend the Hand of Brotherhood"
 USA_Extend_The_Hand_Of_Brotherhood_desc:0 "Canada shares our blood and our traditions. It's time to tighten our bonds and secure our shared destiny."
 USA_The_Ottawa_Pact_Proposal:0 "The Ottawa Pact Proposal"
 USA_The_Ottawa_Pact_Proposal_desc:0 "Trump proposes a new pact: trade, defense, unity. Canada must choose between independence or becoming our closest ally."
 USA_The_North_American_Alliance:0 "The North American Alliance"
 USA_The_North_American_Alliance_desc:0 "America and Canada stand as brothers. Trade flows, borders strengthen, and a true continental empire begins"
 USA_Pressure_The_Monarchy:0 "Pressure the Monarchy"
 USA_Pressure_The_Monarchy_desc:0 "Economic leverage and political influence are used to push Canada into closer alignment—by persuasion or by pressure"
 USA_The_State_Visit_To_Ottawa:0 "The State Visit to Ottawa"
 USA_The_State_Visit_To_Ottawa_desc:0 "Trump has been given a state visit offer  to Ottawa for a historic meeting with King William V and the Canadian government. All the cameras are rolling. Will Trump celebrate the alliance—or shatter it with a fiery call for Republicanism and revolution?"
 USA_Ignite_The_Republican_Flame:0 "Ignite the Republican Flame"
 USA_Ignite_The_Republican_Flame_desc:0 "Inspired by Trump's fiery speech, Canadian workers, students, and unions rise in protest. Demands for a republic sweep across Ontario and Quebec"
 USA_Fund_The_Republican_Movement:0 "Fund the Republican Movement"
 USA_Fund_The_Republican_Movement_desc:0 "American agents, unions, and NGOs funnel supplies, money, and media influence to Republican rebels inside Canada"
 USA_The_Second_Contiental_Revolution:0 "The Second Continental Revolution"
 USA_The_Second_Contiental_Revolution_desc:0 "If we put enough pressure not he republican movement and show them how a free democracy can work then protest and unrest will erupt."
 USA_Strengthen_The_Northern_Alliance:0 "Strengthen the Northern Alliance"
 USA_Strengthen_The_Northern_Alliance_desc:0 "After Trump's speech praising King William V, relations flourish. Talks begin about deeper integration: joint trade zones, joint defense pacts, intelligence sharing."
 USA_The_Continental_Economic_Union:0 "The Continental Economic Union"
 USA_The_Continental_Economic_Union_desc:0 "Massive American-Canadian free trade agreements will be signed. North America's industrial power becomes unmatched."
 USA_Joint_Continental_Command:0 "Joint Continental Command"
 USA_Joint_Continental_Command_desc:0 "The U.S. and Canadian militaries are going to be merged with intelligence and defense planning into one supreme command — headquartered in Ottawa and Washington."
 USA_The_Kaisers_Shadow:0 "The Kaiser's Shadow"
 USA_The_Kaisers_Shadow_desc:0 "The German Empire strangles Europe under its aristocratic boot. Their so-called 'Reichspakt' alliances dominate the old world. Trump sees them not just as a rival—but as a threat to the People's Empire's global vision"
 USA_Challenge_The_Reich:0 "Challenge the Reich"
 USA_Challenge_The_Reich_desc:0 "Trump has launched a global propaganda campaign exposing the German Empire as corrupt, elitist, and outdated. He calls for "the workers of Europe" to awaken and rise."
 USA_Subvert_The_Puppet:0 "Subvert the Puppets"
 USA_Subvert_The_Puppet_desc:0 "America funds populist, leftist, and nationalist insurgencies inside German-dominated countries (Belgium, Netherlands, etc.)."
 USA_The_Berlin_Information_War:0 "The Berlin Information War"
 USA_The_Berlin_Information_War_desc:0 "Massive cyber campaigns, radio broadcasts, and secret funding flood Europe. Trump declares information war against the Kaiser's empire."
 USA_Preparing_The_Final_Clash:0 "Preparing the Final Clash"
 USA_Preparing_The_Final_Clash_desc:0 "With tensions peaking and Europe destabilizing, Trump authorizes full mobilization. War may not be today... but it's coming"
 USA_Offer_A_Cold_Peace:0 "Offer a Cold Peace"
 USA_Offer_A_Cold_Peace_desc:0 "Trump proposes a tense non-aggression pact: America and Germany stay out of each other's way—for now. But tensions simmer just below the surface"
 USA_The_Frozen_Rivalry:0 "The Frozen Rivalry"
 USA_The_Frozen_Rivalry_desc:0 "Tension simmers under the surface. Publicly, Trump and the Kaiser offer smiles and handshakes. Privately, spies are trained, borders are fortified, and alliances are tested. Everyone knows: this "peace" will not last."
 USA_Build_The_Fortress_Continent:0 "Build the Fortress Continent"
 USA_Build_The_Fortress_Continent_desc:0 "Trump has started to invest heavily in continental defenses: NORAD expansions, Atlantic Wall, Homeland Security, anti-sabotage networks. He prepares the People's Empire for the inevitable German strike."
 USA_Expand_The_American_Sphere:0 "Expand the American Sphere"
 USA_Expand_The_American_Sphere_desc:0 "While Germany dominates Europe, Trump turns south — offering aid, protection, and trade to Latin America, the Caribbean, and Africa"
 USA_Lets_Wait_and_See:0 "Lets Wait And See"
 USA_Lets_Wait_and_See_desc:0 "Trump reminds America that time is on their side. The Kaisers rule is unstable. Germany's puppets strain at their chains. When the moment is right, America will not hesitate."
 USA_An_Unlikely_Friendship:0 "An Unlikely Friendship?"
 USA_An_Unlikely_Friendship_desc:0 "The Tsardom of Russia is not a natural enemy. Trump sees in Russia a strange reflection: a reborn empire, strong, proud, wounded but rising"
 USA_Pressure_The_Tsardom:0 "Pressure the Tsardom"
 USA_Pressure_The_Tsardom_desc:0 "Behind smiles, Trump orders heavy propaganda into Russia. Support for liberals, nationalists, republicans. If Maria's system collapses, America must be ready"
 USA_Whispers_In_The_Tsardinas_Court:0 "Whispers in the Tsarina's Court"
 USA_Whispers_In_The_Tsardinas_Court_desc:0 "The only way forward is Funding opposition, spreading unrest"
 USA_Divide_And_Conquer:0 "Divide and Conquer" 
 USA_Divide_And_Conquer_desc:0 "America fans the flames of factionalism inside Russia. Support for monarchist hardliners, socialist republicans, even nationalist separatists—anything to tear the Tsardom apart"
 USA_The_Crown_Slips:0 "The Crown Slips"
 USA_The_Crown_Slips_desc:0 "Riots in Siberia. Mutinies in the military. Secret police defections. Trump watches gleefully as Maria struggles to hold her empire together"
 USA_From_Moscow_To_Montana:0 "From Moscow to Montana"
 USA_From_Moscow_To_Montana_desC:0 "If Russia collapses, Trump will choose to support friendly factions, carve out pro-American republics, or even install puppet regimes"
 USA_The_New_Great_Game:0 "The New Great Game"
 USA_The_New_Great_Game_desc:0 "Trump treats Russia as a cautious partner, proposing a joint "Sphere of Stability" across Eurasia. Divide the world: Russia takes East, America takes West. No interference. No wars. "We stay outta Siberia, they stay outta Miami. Fair deal!""
 USA_Divide_The_World:0 "Divide the World"
 USA_Divide_The_World_desc:0 "Trump and Maria secretly agree: the world is split into spheres. America takes Latin America, Western Europe; Russia gets Central Asia, the Caucasus"
 USA_Respect_But_Not_Trust:0 "Respect... But Not Trust"
 USA_Respect_But_Not_Trust_desc:0 "Trump strengthens border defenses and expands American intelligence operations, quietly preparing in case the Tsardom betrays the deal"
 USA_The_Silent_Cold_War:0 "The Silent Cold War"
 USA_The_Silent_Cold_War_desc:0 "Publicly peaceful, privately tense. America and Russia expand their spheres with minimal open conflict. Minor states are pressured, influenced, or absorbed without firing a shot"
 USA_When_The_Ice_Breaks:0 "When the Ice Breaks"
 USA_When_The_Ice_Breaks_desc:0 "Trump prepares contingency plans: if Russia overreaches or betrays the People's Empire, America will respond with overwhelming force"
 USA_Embrace_The_Peoples_Brotherhood:0 "Embrace the People's Brotherhood"
 USA_Embrace_The_Peoples_Brotherhood_desc:0 "Trump sees in Russia not an enemy, but a brother-in-arms. Two Empires—one old, one new—both reborn through the fire of revolution. Trump proposes a formal ideological alliance between the People's Empire of America and the Tsardom of Russia."
 USA_The_Eurasian_American_Accord:0 "The Eurasian-American Accord"
 USA_The_Eurasian_American_Accord_desc:0 "Joint declarations are signed: support for worker movements, anti-elitism, economic cooperation. The two Empires pledge to resist old aristocracies and capitalist oligarchs worldwide."
 USA_The_Grand_Cultural_Exchange:0 "The Grand Cultural Exchange"
 USA_The_Grand_Cultural_Exchange_desc:0 "Massive cultural programs: Russian workers visit Chicago, American engineers visit Novosibirsk. Pop culture, sports, music flood both nations, creating a real ideological fusion"
 USA_A_White_Red_White_Future:0 "A New Red-White Future"
 USA_A_White_Red_White_Future_desc:0 "After full integration, Trump proposes something almost unthinkable: a formal "Global Solidarity Pact" — binding America and Russia as defenders of the world's working classes. The echoes of 1776 and 1917 join hands"

























