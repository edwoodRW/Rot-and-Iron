	#Focus

 USA_Second_Degree_Burn:0 "Second Degree Burn"
 USA_Second_Degree_Burn_desc:0 "As Bernie heads into his second term as Prime Minister, the American peoples deal with many issues. No matter what side of the spectrum, Americans are feeling malaise and distrust towards their government. For Bernie to succeed he will need to address their issues while creatively pleasing his own party"
 USA_Inaugural_Address:0 "Inaugural Address"
 USA_Inaugural_Address_desc:0 "From the steps of the Emperors Palace, Prime Minister Sanders will address the American people once again. Those who still support the man hope that this time around he can work to fix their problems."
 USA_Bill_P_37:0 "Bill P-37"
 USA_Bill_P_37_desc:0 "Bill P-37 is a comprehensive overhaul of the government's financial policy nicknamed “Bernies Fix-it all bill. This bill if passed will have immediate effects on the American people."
 USA_The_Bill_Passes:0 "The Bill Passes"
 USA_The_Bill_Passes_desc:0 "In a surprise action of bi-partisanship, Bill P-37 has passed."
 USA_Immediate_Cutting_Of_Government_Funds:0 "Immediate Cutting Of Government Funds"
 USA_Immediate_Cutting_Of_Government_Funds_desc:0 "One of the first actions done by Bill P-37 is the immediate cutting of government funding. This will include the lower pay of those in parliament, the defunding of the capital police, and the reduction of the Prime Ministers staff. This will cut down on the taxes of the everyday American who tend to front the bill for such things."
 USA_Fix_The_Food_Industry:0 "Fix The Food Industry"
 USA_Fix_The_Food_Industry_desc:0 "As an emergency act, the Government is forcing the food industry and its many companies to lower their prices. This may lead to future food shortages or “food deserts” in many cities, but it is a solution that the American people can live with."
 USA_Cut_CIA_Funding:0 "Cut CIA Funding"
 USA_Cut_CIA_Funding_desc:0 "The CIA is an over bloated piece of government tyranny leftover from the end of the Second Reconstruction period. It served its purpose hunting down many of the remaining Federalists and Syndicalists. Since then, it has fought imaginary threats. Bill P-37 will defund it heavily, taking even more of the government's budgetary problems."
 USA_Slow_Down_The_Mint:0 "Slow Down The Mint"
 USA_Slow_Down_The_Mint_desc:0 "One of the biggest causes of American inflation is the Mint. By slowing down the process in which we print, the inflation rate in America will begin to steadily fall."
 USA_Increase_Taxes_On_The_Rich:0 "Increase Taxes On The Rich"
 USA_Increase_Taxes_On_The_Rich_desc:0 "For the longest time, the rich in America have refused to pay their fair share of taxes. As part of Bill P-37, the rich shall go from a 7.5% tax rate up to a 9% tax rate."
 USA_Cut_NASA_Funding_Further:0 "Cut NASA Funding Further"
 USA_Cut_NASA_Funding_Further_desc:0 "Who even wants to go to the moon anymore. All of our issues lay within the realm of Earth itself."
 USA_The_New_Commonwealth_Legacy:0 "The New Commonwealth Legacy"
 USA_The_New_Commonwealth_Legacy_desc:0 "The old Commonwealth of Upton Sinclair was that of improving the world for the common man and working towards the abolition of the Monarchy. The new Commonwealth of Bernie Sanders still shares some of those goals, but it also establishes domestic peace in our time. With this new Commonwealth, the worry of a Third American Civil War is practically non-existent."
 USA_The_Bill_Is_Killed:0 "The Bill Is Killed"
 USA_The_Bill_Is_Killed_desc:0 "In a stunning defeat for the Commonwealth party, Bill P-37 has been killed in parliament."
 USA_A_Vote_Of_No_Confidence:0 "A Vote Of No Confidence"
 USA_A_Vote_Of_No_Confidence_desc:0 "Started by opposition parties, Bernie Sanders faces a vote of no-confidence. If this bill passes, Sanders will removed from office and his Deputy PM will take over the position until the 2012 election."
 USA_Cut_Back_Social_Programs:0 "Cut Back Social Programs"
 USA_Cut_Back_Social_Programs_desc:0 "One of the biggest drains on the American wallet is the rampant abuse of social programs set up under the first Sanders administration. Cutting the funding to these will lower the abuse rates, and lower budgetary concerns."
 USA_Adopting_A_New_Economic_Policy:0 "Adopting A New Economic Policy"
 USA_Adopting_A_New_Economic_Policy_desc:0 "The neo-syndicalist policy adopted by the Sanders administration has bankrupted the government and forced the American peoples to pick up the bill. With a firm hand on the government, it is time for parliament to adopt a common-sense economic policy."
 USA_Temporary_Government_Shutdowns:0 "Temporary Government Shutdowns"
 USA_Temporary_Government_Shutdowns_desc:0 "To avoid further government over-spending, Parliament has passed a temporary measure which will in effect shut down the government for a period of 24 days every 6 months. This move will allow special members of a parliamentary board to investigate government finances and reconsider some of those financial decisions."
 USA_Roll_Back_Involvement_In_Alaska:0 "Roll Back Involvement In Alaska"
 USA_Roll_Back_Involvement_In_Alaska_desc:0 "While Alaska is relatively secure, the coalition occupation still continues. To save the American people more money, the American occupation force shall be cut by one quarter. 2,000 soldiers will be able to return home while our other allies in the region pick up the slack."
 USA_Cut_Back_Bernie_Care:0 "Cut Back Bernie Care"
 USA_Cut_Back_Bernie_Care_desc:0 "Bernie Care is another example of a social program being abused. What was meant to be a way for the poor and downtrodden to receive quality healthcare has become yet another part of the bloated American bureaucracy. Cutting it back and increasing the qualification requirements will reduce the abuse of it and thus reduce the cost of it."
 USA_A_New_Age_Of_American_Politics:0 "A New Age Of American Politics"
 USA_A_New_Age_Of_American_Politics_desc:0 "It's clear that the Commonwealths time has come and go. Many say this is the end of Americas second progressive age and the beginning of something new."
 USA_The_End_Of_An_Era:0 "The End Of An Era"
 USA_The_End_Of_An_Era_desc:0 "One of the few things kept from the old United States of America was the policy of term limits. With Bernie's time coming to an end, he has only a few more policies to make good on."
 USA_Make_Good_On_Remaining_Promises:0 "Make Good On Remaining Promises"
 USA_Make_Good_On_Remaining_Promises_desc:0 "On the campaign trail for his second term, Bernie made many promises and as his time lessens, he wants to make good on those promises."
 USA_Revitalize_Foreign_Policy:0 "Revitalize Foreign Policy"
 USA_Revitalize_Foreign_Policy_desc:0 "Since the Perot administration, Americas foreign policy has suffered. While it is important for the American people to be taken care of, the rest of the world has fallen to the wayside without the influence of a giant like America. It is time for the giant to reawaken once again."
 USA_Diplomacy_Alaska:0 "Diplomacy Alaska"
 USA_Diplomacy_Alaska_desc:0 "After the attacks of September 11, 2001 , the American government along with a coalition force invaded and deposed the Beringian government. Since then it has become a drain on the American tax payer. One of PM Sanders' campaign promises was to end the eternal war on terror."
 USA_To_End_The_Forever_War:0 "To End The Forever War"
 USA_To_End_The_Forever_War_desc:0 "There are many steps needed for the American military to pull out of Alaska, but by god we will complete it."
 USA_Turn_Over_The_Prisons:0 "Turn Over The Prisons"
 USA_Turn_Over_The_Prisons_desc:0 "Built quickly after landfall, these prisons hold some of the worst Beringian extremists. Turning them over to the Alaskan government will let us divert our forces elsewhere."
 USA_Launch_Anti_Terror_Operations:0 "Launch Anti-Terror Operations"
 USA_Launch_Anti_Terror_Operations_desc:0 "Four major anti-terror operations will take place across Alaska. These operations will be met with resistance but if executed perfectly then leadership of most neo-Beringia groups will be either killed or arrested."
 USA_Continue_Infrastructure_Buildup:0 "Continue Infrastructure Buildup"
 USA_Continue_Infrastructure_Buildup_desc:0 "Before the downfall of the US government, Alaska was a sparsely populated territory. Since our invasion, we have built modern highways, roads, and more. For Alaska to succeed. We will continue this move."
 USA_Promote_Alaskan_Investment:0 "Promote Alaskan Investment"
 USA_Promote_Alaskan_Investment_desc:0 "The Alaskan provisional governments economy has relied on the American economy to prop it up. By promoting the Alaskan government and their stability, we can hope that international companies will invest in such a upstart nation."
 USA_Promote_Alaskan_Progressivism:0 "Promote Alaskan Progressivism"
 USA_Promote_Alaskan_Progressivism_desc:0 "For Alaska to be welcomed into the world as a modern Western nation, they need to embrace progressive ideals."
 USA_Alaska_In_The_Empire:0 "Alaska In The Empire"
 USA_Alaska_In_The_Empire_desc:0 "When the coalition deems it ready, we will seek to add Alaska to the empire, not as a province but as an Imperial Protectorate similar to Alaska."
 USA_Diplomacy_USCA:0 "Diplomacy USCA"
 USA_Diplomacy_USCA_desc:0 "The USCA (United States of Central America) is one of three nations laying claim to the mantle of the Old United States. Compared to the African pretenders, the Central American regime seems to be on the same track we are. PM Sanders seeks to normalize relations with the USCA government as a way of easing tensions in the south of the Mexican protectorate."
 USA_Open_USCA_Negotiations:0 "Open USCA Negotiations"
 USA_Open_USCA_Negotiations_desc:0 "The USCA (United States of Central America) is one of three nations laying claim to the mantle of the Old United States. Compared to the African pretenders, the Central American regime seems to be on the same track we are. PM Sanders seeks to normalize relations with the USCA government as a way of easing tensions in the south of the Mexican protectorate."
 USA_Demand_Canal_Access:0 "Demand Canal Access"
 USA_Demand_Canal_Access_desc:0 "Its time we make our points clear. We want access and we want it now!"
 USA_Imperial_Investments:0 "Imperial Investments"
 USA_Imperial_Investments_desc:0 "Imperial companies like Apple, Microsoft, and others have been given the go ahead by the government to open operations in the USCA. In turn, their products will come out at a cheaper cost. Of course, some worry that this is selling out the American middle-class worker."
 USA_The_Canal_Opens_For_All:0 "The Canal Opens For All"
 USA_The_Canal_Opens_For_All_desc:0 "Thanks to successful talks, the Panama Canal will now be recognized as an international neutral territory. This will mean that all countries regardless of ideology will be able to traverse the canal"
 USA_Sales_Of_Military_weapons:0 "Sales Of Military Weapons"
 USA_Sales_Of_Military_weapons_desc:0 "The USCA military is heavily outdated. In order to keep its stability, the Imperial military will sell its surplus of weapons to the USCA's military."
 USA_Dismantiling_The_Border_Forifications:0 "Dismantling The Border Fortifications"
 USA_Dismantiling_The_Border_Forifications_desc:0 "Under Prime Minister Goldwater, the American military erected several lines of fortifications on the border with the USCA. Now with both countries seeking to lighten tensions, the fortifications will be dismantled."
 USA_Request_The_Return_Of_American_Prisoners:0 "Request The Return Of American Prisoners"
 USA_Request_The_Return_Of_American_Prisoners_desc:0 "Several American citizens were taken prisoner during the 1972 USCA coup d'etat and have yet to be returned. That is not to say the Empire does not have its fair share of captured USCA spies. Both our countries have agreed to return these peoples back to their countries of origin."
 USA_Have_The_USCA_Join_The_UN:0 "Have The USCA Join The UN"
 USA_Have_The_USCA_Join_The_UN_desc:0 "For the USCA to be recognized on a wider scale, the Empire has sponsored their ascension to the UN. Of course, this will mean that the USCA government will be subject to inspections by UN investigators and the like."
 USA_Mutual_Immigration_Policies:0 "Mutual Immigration Policies"
 USA_Mutual_Immigration_Policies_desc:0 "Since both our countries are working to pursue closer bonds, the Empire and the USCA will ensure free migration between our countries."
 USA_The_Three_Point_Plan:0 "The Three Point Plan"
 USA_The_Three_Point_Plan_desc:0 "The USCA has seen drastic improvement, but they also see the Empire as encroaching on their way of life. So, they have handed us a set of demands, colloquially known as “The Three Point Plan”"
 USA_The_Presidential_Portraits:0 "The Presidential Portraits"
 USA_The_Presidential_Portraits_desc:0 "Sitting in the Smithsonian Museum of History, the old Presidential portraits have collected dust over the decades. Now they will find a new home in the White House of the USCA. Some argue that we are giving away a significant portion of American history, but in reality all we are doing is handing these unwanted paintings over to a country that claims ownership."
 USA_A_Neutral_Gulf_Of_Mexico:0 "A Neutral Gulf Of Mexico"
 USA_A_Neutral_Gulf_Of_Mexico_desc:0 "Point 2 of the Three Point Plan is the withdrawal of all American and American associated warships from the Gulf of Mexico thus making it a neutral territory."
 USA_Reparations_For_The_Iowa_Incidents:0 "Reparations For The Iowa Incident"
 USA_Reparations_For_The_Iowa_Incidents_desc:0 "Point 3 of the Three Point Plan is reparations for the Iowa Incident. In 1972 during the overthrow of the USCAs FBI regime, the USS Iowa sailed into the harbor of San Francisco. As it refused to answer any calls, the Imperial Navy was forced to fire upon it. As we now understand, the Iowa came to San Francisco with peaceful intentions. We acknowledge our wrong and will hand out reparations to the family of those lost."
 USA_Diplomacy_Germany:0 "Diplomacy Germany"
 USA_Diplomacy_Germany_desc:0 "We once believed the British to be our eternal enemy and threat to peace. That time however has passed. The horrors of the Second Weltkrieg and after showed that we ignored the threat of Germany. As time has passed, we realize that it may not be Germany we have to fear but instead we could be friends with the Kaiser."
 USA_Memories_Of_The_Cold_War:0 "Memories Of The Cold War"
 USA_Memories_Of_The_Cold_War_desc:0 "Our ideas of the Germany from the Cold War still permeate the mindset of the everyday American. Going forward, we need to show that Germany and “German-ness” is not a threat."
 USA_The_Second_Berlin_Conference:0 "The Second Berlin Conference"
 USA_The_Second_Berlin_Conference_desc:0 "As was in the past, the major powers of the world will be invited to Berlin to discuss Africa and the threat of the Mugabe regime. This will of course detail sanctions and a possible military intervention if the regime is ever to fall."
 USA_Reopen_The_New_York_Embassy:0 "Reopen The New York Embassy"
 USA_Reopen_The_New_York_Embassy_desc:0 "Closed shortly after reconstruction and the beginning of the Cold War, the New York Embassy will once again house representatives of the German Empire. There are those who resent this idea, but how can we progress into a more peaceful world if we do not extend a small amount of trust towards a once known enemy."
 USA_Transfer_The_14th_Battalion:0 "Transfer The 14th Battalion"
 USA_Transfer_The_14th_Battalion_desc:0 "The 14th Volunteer Battalion (Das 14. Freiwilligenbataillon) was transferred over to the Union State in late 1937 and sadly every member of it perished in the Battle of St. Louis. The Union State buried the bodies outside the city limits. As an act of thanks for their service, we are exhuming and transferring their bodies back to their homelands. We only hope their souls can find rest at home."
 USA_Trans_Atlantic_Trade_Deals:0 "Trans-Atlantic Trade Deals"
 USA_Trans_Atlantic_Trade_Deals_desc:0 "Companies on both sides of the Atlantic seek to expand their business into new markets. Creating these trans-atlantic trade deals will help to alleviate American economic woes while propping up the failing German euro-pakt economy."
 USA_End_Anti_German_Policies:0 "End Anti-German Policies"
 USA_End_Anti_German_Policies_desc:0 "Rebel leader turned parliamentary powerhouse Joseph McCarthy turned America into a near-authoritarian state overnight with his anti-syndicalist and anti-german policies. Some of these policies are still in effect and its time we end these."
 USA_Open_American_Markets:0 "Open American Markets"
 USA_Open_American_Markets_desc:0 "American markets will now open themselves to the Euro stock market allowing Europeans in the Euro-pakt to invest in American success."
 USA_Invite_Germany_Into_Alaska:0 "Invite Germany Into Alaska"
 USA_Invite_Germany_Into_Alaska_desc:0 "To aid in the withdrawal from Alaska, we will invite the German Empire into the Alaska coalition. This will however give them preferential rights to the oil in some areas."
 USA_Recognize_German_Claims:0 "Recognize German Claims"
 USA_Recognize_German_Claims_desc:0 "To stop the spread of syndicalism and the rise of another Bonapartist empire, we the American government will recognize the German claims to the Alsace-Lorraine region."
 USA_Demand_German_Reforms:0 "Demand German Reforms"
 USA_Demand_German_Reforms_desc:0 "For a continued partnership, we demand that the German Empire lift its state of emergency and restore the democratically elected Bundestag."
 USA_Help_Reform_The_German_Military:0 "Help Reform The German Military"
 USA_Help_Reform_The_German_Military_desc:0 "While not as bad as other militaries, the German military needs dire reform. We will, for a price, help them."
 USA_Condemn_Japanese_Influence_In_Korea:0 "Condemn Japanese Influence In Korea"
 USA_Condemn_Japanese_Influence_In_Korea_desc:0 "Both the German and American Governments, arguably two of the most powerful governments will condemn the continuing colonization of Korea by the Japanese government. This will do little to nothing, but it will show that both empires are united in ideology."
 USA_Joint_Condemnations_In_Africa:0 "Joint Condemnations In Africa"
 USA_Joint_Condemnations_In_Africa_desc:0 "One of the only nations to continue business with Mugabe's tyrannical regime is the German Empire. By forcing Germany to pull its businesses out of Africa, we can further weaken the totalist regime on the continent."
 USA_Export_The_American_Political_System:0 "Export The American Political System"
 USA_Export_The_American_Political_System_desc:0 "While the American political system is not perfect by any means, we can at least agree that its better than the proto-absolutist government in Germany. We can help to expand the powers of the German Bundestag and hand more power to the people."
 USA_A_Conversation_on_Hoover:0 "A Conversation On Hoover"
 USA_A_Conversation_on_Hoover_desc:0 "Herbert Hoover III has only one empire on earth which continues to trade with it. If we can convince the Germans to cut their connections with Hoovers regime, then we can further cripple the tyrannical regimes of the African continent."
 USA_A_Common_Enemy_To_The_East:0 "A Common Enemy To The East"
 USA_A_Common_Enemy_To_The_East_desc:0 "Both of our empires have several problems, but we share common enemy's in the east. Both of our nations will work to destabilize the Russian government."
 USA_Pursue_Military_Cooperation:0 "Pursue Military Cooperation"
 USA_Pursue_Military_Cooperation_desc:0 "Our two empires will form the next major military coalition. While we are not joining the Reichspakt alliance, we will be ready to defend the Germans if the totalists or monarcho-bolshevists invade Europe."
 USA_Open_German_Ports_To_Refugees:0 "Open German Ports To Refugees"
 USA_Open_German_Ports_To_Refugees_desc:0 "For nearly a decade, refugees have been creatively escaping the USBR. Yet, they are not welcomed when they come go across the channel to other nations. We in America will help to house these disparaged peoples but we can not do it without the help of Germany."
 USA_Increase_German_Reliance_On_America:0 "Increase German Reliance On America"
 USA_Increase_German_Reliance_On_America_desc:0 "Since Germany has pulled out of their agreements with Mugabe and Hoover, they have come to rely on America for resources. We will further indebt Germany to America by completely taking over their consumer sector."
 USA_Peace_In_Our_Time:0 "Peace In Our Time"
 USA_Peace_In_Our_Time_desc:0 "We must follow our principles of peace in our time and ensure that we can stick to diplomatic ties with other nations"
 USA_Create_Lasting_Policy_Effects:0 "Create Lasting Policy Effects"
 USA_Create_Lasting_Policy_Effects_desc:0 "PM Bernie is seeking to leave office with his legacy secured. Sure some things may not have gone well but he seeks to be remembered fondly."
 USA_Ensure_The_Commonwealth_Goals:0 "Ensure Commonwealth Goals"
 USA_Ensure_The_Commonwealth_Goals_desc:0 "The Commonwealth seeks to create an equal society. One free of racism and other problems which still plague the nation. Before leaving the office, Bernie will at least work to rectify some of these issues."
 USA_Meet_With_Teddy_K:0 "Meet With Teddy K"
 USA_Meet_With_Teddy_K_desc:0 "Theodore Kaczynski is one of the biggest political activists of our time. He's lobbied across party lines for environmental laws to be passed. Pm Bernie is going to meet with Teddy K to possibly sway him over to the Commonwealth."
 USA_Promote_Unionism:0 "Promote Unionism"
 USA_Promote_Unionism_desc:0 "While syndicalist unions were outlawed under PM Long and then later allowed to operate under PM Perot, there has not been a huge union culture in the workplace. PM Bernie aims to promote unions in the workplace."
 USA_legalize_Gay_Marriage:0 "Legalize Gay Marriage"
 USA_legalize_Gay_Marriage_desc:0 "How can we truly call ourselves a free nation when in many areas being a homosexual is considered a crime. To really create an equal society we must fix the problems of our unequal society. So with permission granted by the Emperor himself, PM Bernie will push forward an executive order bypassing state governments allowing homosexual couples to be married and recognized by the state."
 USA_Expand_Free_Schooling:0 "Expand Free Schooling"
 USA_Expand_Free_Schooling_desc:0 "It is shocking that to this day many still can not get an education worthwhile. To help this, PM Bernie and the Commonwealth are passing a bill which will help fund schools in underdeveloped areas of the country along with expanding access to free colleges."
 USA_Expand_The_Green_Energy_Industry:0 "Expand The Green Energy Industry"
 USA_Expand_The_Green_Energy_Industry_desc:0 "As part of a promise to the Green Party. Prime Minister Bernie is taking away funds from the military industrial complex and divert them towards the green energy industry."
 USA_Promote_Workplace_Democracy:0 "Promote Workplace Democracy"
 USA_Promote_Workplace_Democracy_desc:0 "The average office would not work without the worker. To help create equality in the office, PM Bernie and the Commonwealth have passed a bill which will let the workers elect their own manager."
 USA_Expand_Community_Initiatives:0 "Expand Community Initiatives"
 USA_Expand_Community_Initiatives_desc:0 "The rich still refuse to work with the community. By granting them charitable tax breaks, we can force the rich to expand their community-based charities thus allowing the poorer communities of many states to be uplifted."
 USA_Eliminate_Medical_Debt:0 "Eliminate Medical Debt"
 USA_Eliminate_Medical_Debt_desc:0 "Many Americans can barely keep $1000 in their own savings accounts. For many this is because of overwhelming medical debt. If we help to eliminate such debt we can uplift the younger generation out of medical based poverty."
 USA_Reform_The_Federal_Police_Agencies:0 "Reform The Federal Police Agencies"
 USA_Reform_The_Federal_Police_Agencies_desc:0 "While efficient in their duties, the capitol police are known for being brutal towards the cities citizenry. We hope to reform them and tie them to the government."
 USA_Economic_Bill_Of_Rights:0 "Economic Bill Of Rights"
 USA_Economic_Bill_Of_Rights_desc:0 "Even though it is the second term of the Commonwealth government, the peoples of our nation have still been economically disparaged. By creating this new bill of rights we can guarantee that the people will have rights to housing, clean environments, and free healthcare."
 USA_Create_State_Housing_Blocks:0 "Create State Housing Blocks"
 USA_Create_State_Housing_Blocks_desc:0 "To help the homelessness crisis, we will create state housing blocks in several major cities across the nation. These developments will come with low rent, and food stamps. However their will be a certain beauty standard to keep in place."
 USA_Revitalize_American_Cities:0 "Revitalize American Cities"
 USA_Revitalize_American_Cities:0 "Revitalize American Cities"
 USA_Revitalize_American_Cities_desc:0 "The American city is dying. Many young people prefer to live in the rural country away from others, businesses refuse to open in certain neighborhoods and police forces are overwhelmed with crime. Bill P-990 will divert several funds towards to helping city governments create safer and beautiful environments."
 USA_Clear_Abandoned_Industrial_Parks:0 "Clear Abandoned Industrial Parks"
 USA_Clear_Abandoned_Industrial_Parks_desc:0 "Along with helping the cities to develop, the American government will help cities to clear abandoned industrial parks. These areas will be replaced with parks, new housing developments, and fabricated ponds."
 USA_Expand_The_State_Park_Initiative:0 "Expand The State Park Initiative"
 USA_Expand_The_State_Park_Initiative_desc:0 "To help further preserve the American beauty, our government will further designate areas to be national parks."
 USA_Reform_Immigration_Policies:0 "Reform Immigration Policies"
 USA_Reform_Immigration_Policies_desc:0 "The Commonwealth party will further aid those seeking the freedom that America brings. We will lessen the restrictions on certain areas of the world. After all, who are we to destroy the dreams of those who want to come here."
 USA_Reform_The_Prison_System:0 "Reform The Prison System"
 USA_Reform_The_Prison_System_desc:0 "The Prison system is nothing but a new form of legalized slavery. Instead of working to reform the criminal and help with the mental health crisis in this nation, prisoners are instead worked for pennies on the dollar. The Commonwealth party seeks to create a new form of imprisonment where the goal of imprisonment will be to reform the criminal and make sure they do not reoffend."
 USA_Divert_Funds_Towards_The_VA:0 "Divert Funds Towards The VA"
 USA_Divert_Funds_Towards_The_VA_desc:0 "Our veterans are the backbone of the nation. Yet they are undertreated medically. We seek to help them by diverting more tax funds to the VA and actually helping these people."
 USA_Refusing_to_Go_Quietly_Into_The_Night:0 "Refusing To Go Quietly Into The Night"
 USA_Refusing_to_Go_Quietly_Into_The_Night_desc:0 "Do not go gentle into that good night,\n\nOld age should burn and rave at close of day;\n\nRage, rage against the dying of the light.\n\n\n\nThough wise men at their end know dark is right,\n\nBecause their words had forked no lightning they\n\nDo not go gentle into that good night."
















	 USA_prime_minister_bernie:0 "Bernard's First Term"
	 USA_prime_minister_bernie_desc:0 "Bernie Sanders was elected Prime Minister in the 2008 General Election by a very narrow margin in the Electoral College and a little over 51% of the popular vote. He sits as the first, and only so far, Prime Minister of the Commonwealth Party. His first term has seen moderate success including the passage of Berniecare. The future remains to be seen though."
	 USA_dealing_with_the_recession:0 "Dealing with The Great Recession"
	 USA_dealing_with_the_recession_desc:0 "The second worst economic blow in American history hit this country in 2008, and the American people have been dealing with its consquences ever since. The economy has only marginally improved ever since the recession began. Extensive reforms and action must be taken by Congress and the Prime Minister to help end this recession; that action must begin now!"
	 USA_cut_military_spending:0 "Pushback Against the Military-Industrial Complex!"
	 USA_cut_military_spending_desc:0 "The Progressive ideals that this country was rebuilt and reunified upon have been chipped away and removed for over 50 years. With the military budget increasing with nearly every administration, the Commonwealth Party has focused on slashing the military budget in half as a way to increase budgets for more important services and welfare. The Military-Industrial Complex will not be running the show around here anymore."
	 USA_tax_the_rich:0 "Make the Top 1% Pay Their Fair Share"
	 USA_tax_the_rich_desc:0 "The Bush adminstration, as well as the Perot administration, decreased corporate and income taxes by a considerable degree which has resulted in mass economic and income inequality. Prime Minister Sanders famously stated how the top 1% of Americans own more than the bottom half. Prime Minister Sanders and his party can't stand for income inequality any longer; they will force Congress to increase taxes on the top 1% so they can pay their fair share."
	 USA_increase_banking_regulations:0 "No More "Too Big to Fail""
	 USA_increase_banking_regulations_desc:0 "The deregulation of banks under the Bush administration has severely damaged our country, allowed banks to "become too big to fail," and take advantage of the poor. We must roll back on deregulation, and we need to regulate banks even further."
	 USA_break_the_bankers:0 "Break Up the Banks"
	 USA_break_the_bankers_desc:0 "We're going to go one step further than bring back old regulations and expanding regulations. The monopolies held by certain banking companies will be broken up and will help bring this country to a more equal and fair society."
	 USA_subsidized_healthcare:0 "Subsidize Healthcare"
	 USA_subsidized_healthcare_desc:0 "Although Berniecare was passed into law, private health insurance companies and the private industry still heavily dominate the health/medical market. Prices for those in need of medicine or aid have been steadily increasing over the past two decades. The only way to help fix this is to subsidize healthcare so prices can be cheaper for the American people."
